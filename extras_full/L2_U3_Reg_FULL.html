rash2",[["path",{d:"M3 6h18",key:"d0wm0j"}],["path",{d:"M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6",key:"4alrt4"}],["path",{d:"M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2",key:"v07s0e"}],["line",{x1:"10",x2:"10",y1:"11",y2:"17",key:"1uufr5"}],["line",{x1:"14",x2:"14",y1:"11",y2:"17",key:"xtxkd"}]]);var Q5=Nn("TrendingUp",[["polyline",{points:"22 7 13.5 15.5 8.5 10.5 2 17",key:"126l90"}],["polyline",{points:"16 7 22 7 22 13",key:"kwv8wd"}]]);var D1=Nn("TriangleAlert",[["path",{d:"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3",key:"wmoenq"}],["path",{d:"M12 9v4",key:"juzpu7"}],["path",{d:"M12 17h.01",key:"p32p05"}]]);var z2=Nn("Users",[["path",{d:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2",key:"1yyitq"}],["circle",{cx:"9",cy:"7",r:"4",key:"nufk8"}],["path",{d:"M22 21v-2a4 4 0 0 0-3-3.87",key:"kshegd"}],["path",{d:"M16 3.13a4 4 0 0 1 0 7.75",key:"1da9ce"}]]);var SL=o(gn(),1),T0n=Symbol.for("react.element"),c0n=Symbol.for("react.fragment"),R0n=Object.prototype.hasOwnProperty,k0n=SL.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,A0n={key:!0,ref:!0,__self:!0,__source:!0};function TL(n,u,f){var l,w={},g=null,N=null;f!==void 0&&(g=""+f),u.key!==void 0&&(g=""+u.key),u.ref!==void 0&&(N=u.ref);for(l in u)R0n.call(u,l)&&!A0n.hasOwnProperty(l)&&(w[l]=u[l]);if(n&&n.defaultProps)for(l in u=n.defaultProps,u)w[l]===void 0&&(w[l]=u[l]);return{$$typeof:T0n,type:n,key:g,ref:N,props:w,_owner:k0n.current}}var iY=c0n,T=TL,k=TL;var J9=[{id:"W13",number:13,title:"Predicting Numbers, Not Labels",subtitle:"Regression vs Classification",mentalModelShort:"Thermometer Prediction",icon:"thermometer",color:"#0D9488",accent:"#EA580C",teacherEmpowerment:{whatIsThisReally:"Regression is the 1805 invention by Legendre and Gauss to predict continuous numbers — not categories — by finding relationships between variables. While classification sorts things into buckets like 'cat vs dog', regression estimates how much: temperature, price, time, weight. Gauss used it to predict where the dwarf planet Ceres would reappear. In the 1950s it became the backbone of statistics, but in 2012 deep learning made regression scale to billions of examples, powering maps, ads, and recommendations. Today every product that predicts a number — ETA, watch time, waste — is regression under the hood.",why7thGradersNeedThis:"7th graders predict numbers every day — will it be 75°F or 90°F at recess, how tall will I be next year, how many minutes until the pizza arrives? Regression gives them a language for those everyday estimates. It also shows that AI isn't just sorting, it's measuring. That reframe unlocks math class relevance.",realWorldBehindTheScenes:"Google Maps ETA is pure regression: it takes distance, traffic speed, lights, time-of-day and predicts minutes as a continuous number — 17.3 minutes, not just 'soon'. YouTube does the same for watch time: given your history, it predicts you'll watch 4.2 minutes of this video, then ranks. Our lunch waste predictor will do the same: inputs = student count, output = kg of waste, a number we can act on.",kidQuestionsAndAnswers:[{q:"Is regression always a line?",a:"Great catch! Simplest regression is a line, but regression can be curved too — like a parabola for a ball toss. Line is just our starting tool because it is easiest to draw and explain. Real apps often use wiggly curves, but they still predict numbers."},{q:"Can AI predict the future perfectly?",a:'Never perfectly. Regression learns patterns from past data, but future always has new surprises — a fire drill changes lunch waste. We measure error to stay humble. Good predictors give a range: "about 4-5 kg" not "exactly 4.321 kg".'},{q:"Who decides what data to use?",a:"Humans do! The team chooses which columns matter — should we include weather for waste? That choice is power. If we pick biased data, prediction will be biased. That is why we ask who is missing and who could be harmed."}],vocabForTeacher:[{term:"Regression",teacherDef:"Supervised learning task that maps inputs to a continuous numeric output.",kidDef:"Guessing a number, not a name.",pron:"re-GRESH-un",visualCue:"Draw thermometer with numbers going up, arrow pointing to 72°"},{term:"Continuous",teacherDef:"Value that can be any number in a range with decimals.",kidDef:"Numbers that can have .5, not just 1,2,3 buckets.",pron:"con-TIN-you-us",visualCue:"Draw number line with dots between integers"},{term:"Feature (X)",teacherDef:"Input variable used to predict.",kidDef:"Clue you use to guess.",pron:"FEE-cher",visualCue:"Magnifying glass over student count"},{term:"Target (Y)",teacherDef:"Numeric output we want to predict.",kidDef:"Answer you want — the number.",pron:"TAR-get",visualCue:"Bullseye with kg label"}]},mentalModelDeep:{name:"Thermometer Prediction",teacherAnalogy:'A thermometer doesn’t sort weather into "hot/cold buckets"; it slides along a continuous scale. Regression is the same — it slides along numbers. You read clues (sun, clouds) to estimate the exact reading. The better your clues, the tighter your estimate. That slider mindset replaces the sorting mindset from Unit 2.',studentAnalogy:'You don’t just say "it’s hot outside". You say "it’s 82 degrees". Regression is guessing the exact number on the thermometer.',sketchSteps:["Draw big vertical thermometer on left, mark 0-100","On right, draw 3 buckets labeled cat/dog/fish — cross them out","Draw arrow from clues (sun icon) pointing to thermometer at 78°",'Write "REGRESSION = HOW MUCH?" under thermometer','Add small slider under with label "Numbers, not names"'],commonWrongModel:{wrong:"Students think regression = fancy sorting that gives confidence %",right:"Regression predicts the actual number value itself, like 4.5 kg, not a label with a percent."},bridgeQuestion:'If I ask "how many minutes until lunch ends?" am I asking for a label or a number on a thermometer?'},examplesBank:[{title:"Cafeteria Thermometer Waste",story:"Lin measures lunch waste each day. On Monday 200 kids came, waste was 3.2kg. Tuesday 240 kids, 3.9kg. She wants to guess tomorrow’s waste from kid count.",howItWorks:"Kid count (X) vs waste (Y) forms dots. Regression finds line that best predicts Y for new X. More kids → more waste.",whereToSee:"Kitchen scale log sheet",discussionQ:"If 0 kids come, should waste be 0kg? Should line go through zero?",whatIf:"If we include pizza day vs salad day, line shifts. One feature not enough.",ethicsLens:{benefits:"Reduce waste, save money",harmed:"Kitchen staff blamed if prediction high",missing:"Food type data",trafficLight:"Green"}},{title:"Bus ETA Clock",story:'Sam’s bus app says 7 minutes, then 6, then 5. It is not guessing "soon", it predicts a number that ticks down.',howItWorks:"App regression uses distance, traffic, past trips to predict minutes. Updates as inputs change.",whereToSee:"Google Maps ETA",discussionQ:"Why does ETA jump from 6 to 9?",whatIf:"If accident data missing, ETA underestimates.",ethicsLens:{benefits:"Less waiting stress",harmed:"Driver rushed to meet ETA",missing:"Wheelchair boarding time",trafficLight:"Yellow"}},{title:"Height from Shoe Size",story:"PE teacher notices bigger shoes → taller kids, but not perfect. Can we predict height?",howItWorks:"Shoe size X, height Y. Line captures trend, dots scatter around it.",whereToSee:"Growth chart in nurse office",discussionQ:"Would this work for adults vs 7th graders?",whatIf:"If we measure only basketball team, line too tall.",ethicsLens:{benefits:"Fun prediction",harmed:"Body shaming if used to label",missing:"Age, gender diversity",trafficLight:"Yellow"}},{title:"YouTube Watch Time",story:"Why does YouTube show you a 12-min video next? It predicts you’ll watch 8.3 minutes of it.",howItWorks:"Your history → predicted watch minutes (regression). Higher predicted time = higher rank.",whereToSee:"YouTube autoplay queue",discussionQ:"Is predicting watch time same as predicting you’ll like it?",whatIf:"If only clicks used, predicts clickbait.",ethicsLens:{benefits:"Finds engaging videos",harmed:"Addictive doom-scrolling",missing:"Well-being signals",trafficLight:"Red"}},{title:"Lemonade Price Profit",story:"Maya sells lemonade. $1 cup sells 40, $2 sells 22. What price predicts best profit number?",howItWorks:"Price X, cups sold Y, profit = price*Y. Regression predicts Y for any price, then compute profit number.",whereToSee:"School fundraiser sheet",discussionQ:"Can regression predict beyond prices we tried?",whatIf:"Hot day vs cold day changes line.",ethicsLens:{benefits:"Learn business math",harmed:"None low risk",missing:"Weather",trafficLight:"Green"}},{title:"Study Minutes to Score",story:"Does 30 min study → 75%? 60 min → 82%? Students track study time vs quiz score number.",howItWorks:"Study minutes X, score Y. Line shows gain per minute, but flattens.",whereToSee:"Study log",discussionQ:"Does line prove studying causes scores?",whatIf:"If only motivated kids log, line lies.",ethicsLens:{benefits:"Motivation",harmed:"Anxiety if over-interpreted",missing:"Sleep, prior knowledge",trafficLight:"Yellow"}}],physicalComputing:{title:"micro:bit Temperature Sensor vs Thermometer Reading",microbit:"Use micro:bit built-in temperature sensor to log temperature number every 10 sec. Students predict next reading from time.",noTech:"Real alcohol thermometer, read number, log on paper, predict next hour.",wiring:"No wiring - internal sensor. Hold micro:bit, press A to log, B to show prediction using simple slope.",codeBlocks:["on start: set baseline = temperature","every 10s: read temp, plot point","on A: log (time, temp) to array","on B: compute line: (last-first)/time → predict next","show predicted number on LEDs"],stringMethod:"Draw time vs temp dots on large paper, stretch yarn for prediction line."},communityData:{description:"Single classroom 5 days = noisy line. Need more days.",visual:"5 dots scattered"},lesson90Detailed:{prep15min:"Print dot paper with 10 blank axes, yarn 6 pieces, thermometer poster, micro:bits charged, waste kg fake dataset 200 kids=3.2kg etc.",flow:[{time:"0-10 Hook",goal:"Contrast label vs number",teacherScriptExact:"Yesterday we sorted lunch into recycle vs trash — that was labels. Today I ask, how many kilograms of trash? That is not a label, it is a number on a scale. Watch: I hold this thermometer. Is 72 degrees a label or a number? Turn to partner: give me one question that needs a number answer, not a label.",studentAction:"Think-pair-share number questions: How long? How heavy?",materials:"Thermometer, sorting bins from U2",checkUnderstanding:"Green: Students can name 2 number-prediction questions vs label questions.",ifStuck:'Orange: Point to classroom: "Is how many chairs a label or number?" Scaffold to thermometer.'},{time:"10-25 Concept + Mental Model",goal:"Introduce regression as thermometer",teacherScriptExact:"Regression is thermometer thinking. Classification puts things in buckets. Regression slides up and down a number line to predict how much. Draw with me: left side thermometer 0-100, right side buckets crossed out. Regression answers how much, how many, how long. When you see Google Maps say 7 minutes, that is regression predicting a number.",studentAction:"Draw thermometer vs buckets in notebook, label REGRESSION = HOW MUCH",materials:"Board, markers, mental model poster",checkUnderstanding:"Green: Can explain difference in own words: sorting vs number sliding.",ifStuck:"Orange: Use body: crouch low for small number, stand tall for large number. Ask: is height a bucket?"},{time:"25-45 Deep Dive 6 Examples",goal:"Connect to real life",teacherScriptExact:"Let’s walk 6 quick stories where AI predicts a number. For each, I want you to whisper: what is X, what is Y number? First: lunch waste — X is kid count, Y is kg. Second: bus ETA — X distance, Y minutes. Notice all predict a number. Which one feels most unfair if wrong? That is ethics lens.",studentAction:"For each example, fill X/Y on mini cards, vote traffic light",materials:"6 example cards, traffic light dots",checkUnderstanding:"Green: Correctly identifies X and Y as numbers for 4/6 examples.",ifStuck:'Orange: Re-ask: "If answer can be 3.5, is it regression?" Use that filter.'},{time:"45-65 Unplugged Hands-On",goal:"Thermometer prediction game",teacherScriptExact:"You are now regression models. Trainer shows student count card, Model guesses waste kg by pointing on giant thermometer poster, Tester reveals actual waste, Recorder logs error = guessed - actual. Roles rotate. Goal: get error small. You will feel what predicting numbers means.",studentAction:"Role play: Trainer, Model, Tester, Recorder, 8 rounds, compute error",materials:"Role badges, thermometer poster 0-10kg, count cards, waste cards",checkUnderstanding:"Green: Computes error as difference, notices prediction improves with pattern.",ifStuck:'Orange: Let Recorder help: "If guess 4kg actual 3kg, error +1". Use number line.'},{time:"65-80 Workbook Practice",goal:"Plot X vs Y and draw first regression line",teacherScriptExact:"Open workbook W13 page. Plot these 8 dots: 200 kids 3.2kg etc. Now draw a line that feels central through dots. This is your first regression line. Use ruler. Now use it: if 260 kids tomorrow, what kg does your line predict? Mark it. How confident are you?",studentAction:"Plot dots, draw line, predict new X, compute residual for one dot",materials:"Workbook, ruler, dot stickers",checkUnderstanding:"Green: Line passes through middle of cloud, prediction read off Y axis.",ifStuck:"Orange: Cover dots with hand, ask: if all dots invisible, where would line go? Now uncover, adjust."},{time:"80-90 Reflection + Preview",goal:"Summarize and preview best fit",teacherScriptExact:"Today we learned regression predicts numbers. Thermometer, not buckets. Exit ticket: write one regression question from your life and its X and Y. Tomorrow we ask: how do we find THE best line, not just any line? We will use string to find path.",studentAction:"Exit ticket, clean up, preview yarn activity",materials:"Exit slips",checkUnderstanding:"Green: Writes valid regression question with numeric Y.",ifStuck:'Orange: Prompt: "Predict ___ from ___" sentence starter.'}]},unpluggedActivityEnlarged:{roles:["Trainer: shows X card (student count)","Model: points on thermometer to predict Y","Tester: reveals actual Y card and says true value","Recorder: logs prediction, actual, error = pred-actual"],materials:["Giant thermometer poster 0-10kg","20 X cards (180-300 kids)","20 Y cards (2.8-5.1 kg)","Role lanyards","Log sheet"],steps:["1. Setup thermometer and deck","2. Trainer draws X=220 kids, shows","3. Model closes eyes 3 sec, then points to number on thermometer","4. Tester flips Y card: actual 3.7kg","5. Recorder writes pred, actual, error","6. Rotate roles every 2 rounds","7. After 8 rounds, who had smallest average error? Discuss why"],variations:{fast:"Use only 4 rounds, whole class prediction by show of hands on thermometer.",slow:"Add second clue: weather card, Model adjusts prediction."},whatTeacherObserves:"Do Models look at previous errors to adjust? Do they understand error can be negative? Are they confusing label vs number language?",commonMistakes:['Predicting label "a lot" not number "4.2kg"',"Error calculated as absolute but sign matters for bias","Thinking more precise guess = always better without looking at pattern"]},workbook:{tasks:["Plot 8 (students, waste) dots","Draw regression line with ruler","Predict waste for 260 students using line","Calculate error for one dot: actual - predicted","Reflection: When would predicting waste be useful and risky?"],rubric:"4= line central, prediction within 0.3kg, error calc correct, reflection mentions use + risk. 3= line ok. 2= dots plotted but line off. 1= incomplete."}},{id:"W14",number:14,title:"Line of Best Fit",subtitle:"Drawing line through dots",mentalModelShort:"Trend Line is Path",icon:"path",color:"#EA580C",accent:"#0D9488",teacherEmpowerment:{whatIsThisReally:"Line of best fit is the mathematical solution to minimize squared errors, first formalized as least squares in 1805. Given scatter dots (X,Y), we find slope m and intercept b so line Y = mX + b is closest to all dots on average. In 1800s astronomers used it to reduce telescope measurement noise. In 1950s it became linear regression in statistics textbooks. The 2012 breakthrough didn't replace it — deep nets still stack many lines of best fit. It matters today because even billion-parameter models are evaluated by how low their error is from best fit.",why7thGradersNeedThis:'Kids already draw trend lines in science fair — "as water increases, plant height goes up". Formalizing that intuition lets them move from "looks like it goes up" to "it goes up 0.4 cm per mL". That quantification is power for arguments in science and everyday budgeting.',realWorldBehindTheScenes:`YouTube's watch time prediction is actually many lines of best fit stacked: each feature like "time of day" gets a weight (slope). The model finds best slopes that minimize error between predicted watch time and actual watch time. Google Maps ETA same: each road segment gets a slope weight. When you drag dots in our dashboard, you are doing what their optimizer does — hunting for smallest error.`,kidQuestionsAndAnswers:[{q:"Is the best fit line always straight?",a:"No! Best fit can be curved — think growth spurt. But we start straight because it is simple, has only slope and intercept, and often good enough. We will see wiggly lines next week."},{q:"How does computer find best line?",a:"It tries many lines and measures total error — sum of squared distances from dots to line. It picks line with smallest error. Like trying shoes until smallest pinch. We do same with yarn."},{q:"Can there be two best lines?",a:"For straight line with squared error, mathematically only one best line. But if you change error definition, you could get different best. That is why defining error matters."}],vocabForTeacher:[{term:"Line of Best Fit",teacherDef:"Line minimizing sum of squared vertical distances to data points.",kidDef:"Path that stays closest to all dots.",pron:"LINE of BEST FIT",visualCue:"Dots with yarn stretched through middle, arrows showing small gaps"},{term:"Slope",teacherDef:"Change in Y per 1 unit change in X.",kidDef:"How steep the path is.",pron:"SLOPE",visualCue:"Stairs drawing: run 1, rise m"},{term:"Intercept",teacherDef:"Y value when X=0.",kidDef:"Where path starts on left.",pron:"IN-ter-sept",visualCue:"Dot on Y-axis where line crosses"},{term:"Residual / Error",teacherDef:"Actual Y minus predicted Y.",kidDef:"How far dot is from line.",pron:"re-ZID-you-al",visualCue:"Vertical dashed line from dot to line"}]},mentalModelDeep:{name:"Trend Line is Path",teacherAnalogy:"Imagine dots are stepping stones across a river. You want to lay a straight plank path that stays closest to all stones so you don’t have to jump far. You wouldn’t lay plank through only two stones — you’d center it to minimize average jump. Best fit line is that centered plank. Slope tells you if river goes uphill, intercept tells where you step in.",studentAnalogy:"Dots are friends scattered on field. You want to walk straight so you stay close to all friends, not just one. Best fit line is the fairest walk.",sketchSteps:["Scatter 8 dots loosely going up to right","Place ruler roughly through middle, not touching all","Draw short vertical dashes from each dot down/up to ruler = errors",'Label longest dash "big error" and shortest "small error"','Write "Best fit = smallest total errors" below'],commonWrongModel:{wrong:"Line must go through most dots or through first and last dot",right:"Line goes through middle of cloud to minimize average error, may touch zero dots."},bridgeQuestion:"If you were the path, would you go through the loudest friend or stay fair to all friends?"},examplesBank:[{title:"Allowance to Savings Path",story:"Kids get $5, $10, $15 allowance. Their savings are $2, $6, $9. What line predicts savings from allowance?",howItWorks:"Allowance X, savings Y. Best fit slope ~0.6 means save 60 cents per dollar.",whereToSee:"Piggy bank log",discussionQ:"What does intercept tell us if allowance 0?",whatIf:"If one kid saves $0 despite $15, slope flattens.",ethicsLens:{benefits:"Teaches budgeting",harmed:"None",missing:"Spending needs",trafficLight:"Green"}},{title:"Steps to Calories Path",story:"Fitness band: 2000 steps burns 80 cal, 5000 steps 190 cal. Predict calories for 3500 steps.",howItWorks:"Steps X, calories Y. Line best fit converts steps to calories using slope.",whereToSee:"Fitbit app",discussionQ:"Is calorie prediction same for all bodies?",whatIf:"If weight added as second feature, line becomes plane.",ethicsLens:{benefits:"Health awareness",harmed:"Eating disorders if over-trusted",missing:"Metabolism differences",trafficLight:"Yellow"}},{title:"Rainfall to Umbrella Sales",story:"Shop: 2mm rain sells 5 umbrellas, 10mm sells 22. Predict sales for 6mm.",howItWorks:"Rain X, sales Y. Slope positive. Intercept = sales even with no rain.",whereToSee:"Store inventory sheet",discussionQ:"Would line work for 100mm hurricane?",whatIf:"Prediction beyond data (extrapolation) risky.",ethicsLens:{benefits:"Stock planning",harmed:"Overstock waste",missing:"Forecast error",trafficLight:"Green"}},{title:"Game Time to Score",story:"Player plays 10 min scores 15 pts, 20 min scores 28 pts. Line predicts score from time.",howItWorks:"Minutes X, points Y. Line gives points per minute slope.",whereToSee:"Basketball stats",discussionQ:"Does more time cause more points or just opportunity?",whatIf:"If player tired, slope drops after 30 min — line fails, needs curve.",ethicsLens:{benefits:"Coaching",harmed:"Pressure to play injured",missing:"Fatigue",trafficLight:"Yellow"}},{title:"Ad Spend to Views",story:"Channel spends $10 gets 1000 views, $30 gets 2500 views. Predict views for $20.",howItWorks:"Spend X, views Y. Line predicts return on ad spend.",whereToSee:"YouTube analytics",discussionQ:"Should you spend more if line says more views?",whatIf:"Platform changes algorithm, old line useless.",ethicsLens:{benefits:"Small creators plan",harmed:"Encourages ad addiction",missing:"Content quality",trafficLight:"Yellow"}},{title:"Battery Age to Life",story:"Phone 1 year old battery lasts 8h, 2 years 6.5h. Predict 1.5 year battery life.",howItWorks:"Age X, life Y. Negative slope shows decay.",whereToSee:"Battery health settings",discussionQ:"Why not just use average?",whatIf:"If one battery replaced, dot outlier pulls line.",ethicsLens:{benefits:"Plan replacement",harmed:"Planned obsolescence",missing:"Usage patterns",trafficLight:"Green"}}],physicalComputing:{title:"String as Best Fit Line",microbit:"Micro:bit displays X value on LEDs, student moves string, micro:bit shows predicted Y = mX+b where m from string slope measured.",noTech:"Paper with dots, yarn as line, measure error with finger widths.",wiring:"Micro:bit on desk, no wiring. Use buttons: A increase slope, B decrease, shows slope number.",codeBlocks:["Set slope=0.1, intercept=0.5","On A: slope +=0.02 show slope","On B: slope -=0.02","Read X from potentiometer or button presses","Predict Y = slope*X+intercept display"],stringMethod:"Tape paper to floor, scatter dot stickers, students stretch yarn until vertical gaps smallest average."},communityData:{description:"One group line wobbly, pooled line stable",visual:"3 groups lines vs pooled"},lesson90Detailed:{prep15min:"Dot paper 10 copies, yarn 12 pieces, rulers, micro:bits with slope code, error flag cards, slope visual stairs poster.",flow:[{time:"0-10 Hook",goal:"Why best fit not any fit",teacherScriptExact:"Last time we predicted numbers with any line. Today: which line is best? I show two lines through same dots — both go through cloud but one hugs dots tighter. Which would you trust to predict tomorrow? Shout best. We need a way to decide, not just eyeball. We will use string and measure errors.",studentAction:"Vote which line tighter, discuss criteria",materials:"Two lines on same dot plot projected",checkUnderstanding:"Green: Says best = closer to dots overall.",ifStuck:"Orange: Ask: if you had to jump from dot to line, which line makes jumps shorter?"},{time:"10-25 Concept + Mental Model",goal:"Line as path minimizing error",teacherScriptExact:"Imagine dots are friends on field, you walk straight. Best path minimizes total distance to friends. In regression, error is vertical distance from dot to line. Best fit line minimizes sum of squared errors — squaring punishes big misses more. Slope is how steep path is, intercept where you start. Lets draw errors as little bridges.",studentAction:"Draw dots, line, vertical error dashes, label slope/intercept",materials:"Board, sketch steps poster",checkUnderstanding:"Green: Can point slope and intercept and error dash.",ifStuck:"Orange: Use stairs: run 1 foot forward, rise slope feet up. Walk it physically."},{time:"25-45 Deep Dive 6 Examples",goal:"Slope meaning in context",teacherScriptExact:"Six stories, all have slope meaning. Allowance to savings slope 0.6 means save 60c per dollar. Steps to calories slope is calories per step. For each, ask: what does slope tell us? What does intercept mean when X=0? Which intercept makes sense, which is weird? That weirdness is clue.",studentAction:'Fill slope meaning sheet: "Slope = ___ per ___"',materials:"Example cards with X/Y",checkUnderstanding:"Green: Writes slope interpretation for 3 examples.",ifStuck:'Orange: Sentence starter: "For each extra ___ , we get ___ more ___."'},{time:"45-65 Unplugged Hands-On",goal:"String best fit",teacherScriptExact:"Teams: scatter 10 dot stickers on large paper. Now stretch yarn to find best fit. Move until average finger-width errors smallest. Tape yarn. Then place new dot at X=8, predict Y using yarn. Check actual. Rotate measurer. Micro:bit group: press A/B to change slope, see predicted Y update on LEDs. No-tech group: measure gaps with paper clips.",studentAction:"Scatter dots, stretch yarn, measure errors, predict new dot",materials:"Large paper, dots, yarn, rulers, micro:bits",checkUnderstanding:"Green: Yarn central, prediction within 1 unit of true.",ifStuck:"Orange: Try extreme: yarn through top dots only — see big errors at bottom. Adjust to balance."},{time:"65-80 Workbook Practice",goal:"Calculate error",teacherScriptExact:"Workbook W14: you have 6 dots and line Y=0.5X+1. For each dot, compute predicted Y, then error = actual - predicted. Then square error. Add squares — total error. Now try line Y=0.6X+0.8 — is total error smaller? You just did what computers do.",studentAction:"Compute predicted, error, squared error, compare two lines",materials:"Workbook, calculator",checkUnderstanding:"Green: Computes errors correctly, identifies smaller total error line.",ifStuck:"Orange: Do one dot together on board, then let them try next."},{time:"80-90 Reflection + Preview",goal:"Wrap and preview data needs",teacherScriptExact:"We learned best fit = smallest errors, slope = rate, intercept = start. Exit: draw your line and circle biggest error dot — why might that dot be weird? Tomorrow: how many dots do we need before line stops wiggling? Bring curiosity about plant watering.",studentAction:"Exit ticket, journal",materials:"Reflection cards",checkUnderstanding:"Green: Identifies outlier and hypothesizes.",ifStuck:'Orange: "Could this dot be a mistake or special day?"'}]},unpluggedActivityEnlarged:{roles:["Scatterer: places 10 dots","Yarn Holder 1 & 2: stretch yarn","Error Measurer: measures vertical gaps with clips","Predictor: uses yarn to predict new X"],materials:["A2 paper","Dot stickers","Yarn 1m","Paper clips as error measure","New X card"],steps:["1. Scatterer puts 10 dots with upward trend but scatter","2. Holders stretch yarn across","3. Measurer measures each vertical gap in clips","4. Sum clips — total error","5. Adjust yarn to reduce total","6. Tape when minimal","7. Predictor places new dot X=9, reads Y off yarn, checks actual hidden dot"],variations:{fast:"Use 5 dots only, 1 minute per adjustment",slow:"Add outlier dot far away, see how line pulled, discuss"},whatTeacherObserves:"Do students try to go through most dots vs minimize average? Do they understand vertical not perpendicular distance? Do they adjust both slope and intercept?",commonMistakes:["Measuring perpendicular distance not vertical","Forcing line through origin","Thinking line must touch at least 2 dots"]},workbook:{tasks:["Given line Y=0.4X+1, compute predicted for X=10,20,30","Compute error for actual Y=6 at X=10","Compare total squared error for two lines","Interpret slope in allowance context","Sketch line with slope 0 and explain"],rubric:"4= all errors correct, slope interpretation accurate, comparison correct. 3= minor math slip. 2= confusion vertical vs other. 1= incomplete."}},{id:"W15",number:15,title:"How Much Data is Enough?",subtitle:"Learning curves",mentalModelShort:"Plant Needs Water",icon:"plant",color:"#0D9488",accent:"#F59E0B",teacherEmpowerment:{whatIsThisReally:"Learning curves plot model performance vs training data size, a concept formalized in 1950s learning theory but popularized after 2010 when teams realized data beats algorithms. The curve typically drops fast early, then flattens — more data helps less after a point. In 2012 ImageNet showed 1.2M images beat clever features. Today foundation models train on trillions of tokens because curve still improving. Why it matters: it tells you when to stop collecting — after flatten, collect different data, not more same.",why7thGradersNeedThis:"Kids think more data always = better, like more water always helps plant. But overwatering kills. Same for AI: 10 lunch waste days gives wobbly line, 50 days stabilizes, 500 days same line but wasted effort. Learning when enough is enough is life skill for studying, not just AI.",realWorldBehindTheScenes:"YouTube doesn’t just collect more watch logs forever for same user — after 100 videos, extra history barely improves prediction. Instead they collect diverse signals: search, likes. Our waste predictor: after 2 weeks of similar menus, more same days won’t help; need varied menus. Learning curve visualization in dashboard shows error dropping then flat — that flat point is stop signal.",kidQuestionsAndAnswers:[{q:"If we have infinite data, will prediction be perfect?",a:"No. Even infinite data has noise — some days same kid count but different waste because menu changed. Best model still has irreducible error. Curve flattens above zero, not at zero."},{q:"Why not just use all data from internet?",a:"More data costs time, storage, privacy. Also if data is junk or biased, more junk makes worse model. Quality and diversity beat quantity after point."},{q:"How do you know when enough?",a:"Plot learning curve: error on test set vs training size. When error stops dropping much, you have enough for now. Then collect different kind of data."}],vocabForTeacher:[{term:"Learning Curve",teacherDef:"Plot of error vs number of training examples.",kidDef:"Shows how plant grows with water, then stops.",pron:"LERN-ing KURV",visualCue:"Curve dropping fast then flat, water drops on x-axis"},{term:"Sample Size",teacherDef:"Number of data points collected.",kidDef:"How many dots you have.",pron:"SAM-ple SIZE",visualCue:"Pile of dots small vs large"},{term:"Diminishing Returns",teacherDef:"Each extra example helps less than previous.",kidDef:"5th glass water helps less than 1st.",pron:"di-MIN-ish-ing",visualCue:"Plant with 1 drop big growth, 10 drops tiny growth"},{term:"Noise",teacherDef:"Random variation not predictable from features.",kidDef:"Wobble that line can’t explain.",pron:"NOYZ",visualCue:"Squiggly around straight line"}]},mentalModelDeep:{name:"Plant Needs Water",teacherAnalogy:"A seedling with no water is wobbly and uncertain — like regression with 3 dots. First few waters make huge growth — error drops fast. After enough water, extra water barely helps and can drown — error flatlines. Good gardener watches plant, not just pours. Same with data: watch learning curve flatten, then change soil (features), not just add water.",studentAnalogy:"More water helps plant until it doesn’t. Same with data for AI. First cups matter a lot, later cups matter little.",sketchSteps:['Draw wilting plant labeled "3 dots = wobbly line"','Draw 2nd plant thriving with watering can "10 dots = stable"','Draw 3rd plant flooded "100 dots same menu = waste"',"Below draw axes: X=water cups, Y=plant health, curve fast up then flat",'Label flat part "Enough! Collect different data"'],commonWrongModel:{wrong:"More data always better, line keeps improving forever",right:"Error drops then flattens; after flatten, need different data, not more same."},bridgeQuestion:"If your plant stops growing after 5 cups, do you keep pouring same water or try sunlight?"},examplesBank:[{title:"Lunch Waste 3 Days vs 14 Days",story:"3 days waste line jumps if one pizza day. 14 days line stable.",howItWorks:"Small sample → high variance line. Larger sample averages out pizza day noise.",whereToSee:"Our collection sheet",discussionQ:"How many days until pizza effect averaged?",whatIf:"If we collect only Mondays, line biased.",ethicsLens:{benefits:"Stable prediction",harmed:"Collection labor",missing:"Menu diversity",trafficLight:"Green"}},{title:"Face Recognition Photos",story:"App needs 5 photos to recognize you, 50 photos barely improves.",howItWorks:"Learning curve for face: early photos capture angles, later duplicates low gain.",whereToSee:"Phone Face ID setup",discussionQ:"Would 500 photos of same pose help?",whatIf:"Photos all in dark, more dark photos no help — need light variety.",ethicsLens:{benefits:"Unlock fast",harmed:"Privacy if 500 stored",missing:"Lighting diversity",trafficLight:"Yellow"}},{title:"Typing Autocorrect",story:"Keyboard learns your words after 100 sentences, after 10k same slang, still same.",howItWorks:"Early data learns vocabulary, later data only refines rare words — diminishing returns.",whereToSee:"Gboard personal dictionary",discussionQ:"When should keyboard ask for new words not more sentences?",whatIf:'If you type only "lol", more lol no help.',ethicsLens:{benefits:"Faster typing",harmed:"Learns typos as correct",missing:"Formal vs informal",trafficLight:"Green"}},{title:"Weather Forecast History",story:"Forecast using last 7 days vs last 2 years — which better?",howItWorks:"7 days too little, misses seasons; 2 years includes seasons, more stable.",whereToSee:"Weather app",discussionQ:"Does 10 years always beat 2 years?",whatIf:"Climate change — old data may be outdated.",ethicsLens:{benefits:"Better planning",harmed:"False confidence",missing:"Climate shift",trafficLight:"Yellow"}},{title:"Game Cheat Detection",story:"Anti-cheat needs 10 games to spot cheater, 1000 games same player no extra.",howItWorks:"Early games capture pattern, extra games from same cheater redundant — need many different cheaters.",whereToSee:"Game ban reports",discussionQ:"Is it fair to ban after only 10 games?",whatIf:"Cheater changes tactic, old data useless.",ethicsLens:{benefits:"Fair play",harmed:"False ban hurts player",missing:"New cheat methods",trafficLight:"Red"}},{title:"Library Book Popularity",story:"Predict holds from first week checkouts. 3 books data wobbly, 30 books stable.",howItWorks:"Sample size matters for library purchasing prediction.",whereToSee:"Library holds list",discussionQ:"Would bestseller list help prediction?",whatIf:"If only fantasy books tracked, prediction fails for nonfiction.",ethicsLens:{benefits:"Better stock",harmed:"Niche books ignored",missing:"Genre diversity",trafficLight:"Yellow"}}],physicalComputing:{title:"Learning Curves - Add Dots, See Line Stabilize",microbit:"Log temperature every minute for 2 minutes (3 dots) vs 10 minutes (10 dots). Show prediction wobble decreases.",noTech:"Start with 3 dots, draw line. Add 5 dots, redraw, see line move less each time.",wiring:"micro:bit internal sensor, timer code.",codeBlocks:["Array temps = []","Every 10s: push temp to array, plot line slope","On shake: show variance of slope over last 3 lines","LED: big wobble = sad face, stable = happy"],stringMethod:"Add dot stickers one by one, adjust yarn slightly less each time — feel stabilizing."},communityData:{description:"Pooling 3 schools = 3x data, curve flattens faster, less noise.",visual:"Curve comparison"},lesson90Detailed:{prep15min:"Dot sheets with 3,10,30 dots versions, yarn, micro:bits logging code, watering can prop, plant images, learning curve poster blank.",flow:[{time:"0-10 Hook",goal:"Question more is always better",teacherScriptExact:"I watered my plant 10 times yesterday — is it 10x healthier? No! First water huge, tenth water maybe drowning. Same for AI data. Today we test: does adding dots always improve line a lot? You will add dots one by one and feel line stabilize. When would you stop collecting?",studentAction:"Discuss plant watering analogy, predict data needed",materials:"Plant, watering can, dot poster with 3 dots",checkUnderstanding:"Green: Says early data helps more than later.",ifStuck:"Orange: Show 3-dot line vs 4-dot line big jump, 30 vs 31 tiny jump."},{time:"10-25 Concept + Mental Model",goal:"Learning curve",teacherScriptExact:"Learning curve is X = number of dots, Y = error. Early, error high and drops fast as you add dots. Then flat — diminishing returns. Why flat? Noise remains. No line can predict random wobble. Good data scientists watch curve flatten then ask: do we need different clues, not more dots? Draw with me: wilt, thrive, flood.",studentAction:"Draw 3 plants and curve axes",materials:"Board, curve template",checkUnderstanding:"Green: Can sketch curve shape fast drop then flat.",ifStuck:"Orange: Use candy: first candy super yummy, 10th candy less exciting."},{time:"25-45 Deep Dive 6 Examples",goal:"Diminishing returns in real products",teacherScriptExact:"Six cases where more same data stops helping. Face ID 5 vs 50 photos, typing 100 vs 10k sentences. For each, ask: what is enough? What kind of new data would help more than more same? Think diversity: different lighting for face, different genres for library. That is key insight.",studentAction:"For each example, mark enough point and what diverse data needed",materials:"Example cards, enough line stickers",checkUnderstanding:"Green: Identifies diversity needed beyond quantity.",ifStuck:'Orange: Prompt: "If all photos dark, more dark photos help?"'},{time:"45-65 Unplugged Hands-On",goal:"Add dots stabilize",teacherScriptExact:"Teams get paper with 3 dots, draw yarn line, measure slope roughly with protractor. Now I give you 5 more dots — adjust yarn, slope change big or small? Now 10 more dots — adjust again. Record slope each stage. You should see change shrinking. That is learning curve in your hands. Micro:bit group logs real temp and sees prediction wobble shrink.",studentAction:"Add dots in stages, record slope, plot slope vs n",materials:"Staged dot stickers, yarn, slope recorder sheet, micro:bits",checkUnderstanding:"Green: Records decreasing slope change.",ifStuck:'Orange: Focus on line movement: "Did yarn move a lot or a little this time?"'},{time:"65-80 Workbook Practice",goal:"Plot learning curve",teacherScriptExact:"Workbook W15: table shows training size 5 error 2.1, size 10 error 1.4, 20 error 1.0, 40 error 0.9, 80 error 0.85. Plot error vs size. Where does it flatten? Mark enough point. Then write: what new feature would help beyond more days? Maybe menu type.",studentAction:"Plot curve, mark flatten point, propose new feature",materials:"Workbook, colored pencils",checkUnderstanding:"Green: Curve correct shape, identifies flatten ~20-40.",ifStuck:"Orange: Connect dots, ask: is drop from 5 to 10 bigger than 40 to 80?"},{time:"80-90 Reflection + Preview",goal:"Summarize and preview test set",teacherScriptExact:"Today we learned more data helps fast then flat. Enough is when curve flat, then collect different data. Exit: how many days of lunch waste should we collect before we stop? Why? Tomorrow we hide some dots to test honestly — pop quiz for AI.",studentAction:"Exit ticket with days number and reason",materials:"Exit slips",checkUnderstanding:"Green: Gives number with justification about flatten.",ifStuck:'Orange: "Would 3 days be enough? 100 days same menu?" Guide.'}]},unpluggedActivityEnlarged:{roles:["Waterer: adds dot stickers (water cups)","Gardener: adjusts yarn line","Measurer: records slope angle","Botanist: plots slope change vs water"],materials:["Base paper with axes","Dot stickers in 3 colors for stages","Yarn","Protractor print","Plot sheet for learning curve"],steps:["1. Start with 3 dots (wilt plant), Gardener draws line, Measurer records slope","2. Waterer adds 5 dots (thrive), Gardener adjusts, Measurer records","3. Botanist plots slope difference vs stage","4. Waterer adds 10 more dots (flood), adjust, record","5. Repeat with 20 dots if time","6. Observe slope change shrinking","7. Discuss: when would you stop watering same soil?"],variations:{fast:"Use only 2 stages 3 and 13 dots",slow:"Add outlier flood dot, see if line destabilizes again"},whatTeacherObserves:"Do students notice diminishing adjustment? Can they connect slope stability to enough data? Do they suggest diversity?",commonMistakes:["Thinking flat curve means perfect prediction","Confusing slope of data line with slope of learning curve","Thinking more data hurts"]},workbook:{tasks:["Plot given error vs size points","Mark flatten point","Explain diminishing returns in own words with plant analogy","Suggest new feature for waste predictor beyond student count","Reflect: when is 5 examples enough in real life?"],rubric:"4= curve correct, flatten marked, new feature plausible, explanation uses diminishing returns. 3= curve ok. 2= curve shape wrong. 1= incomplete."}},{id:"W16",number:16,title:"Testing with New Data",subtitle:"Hold-out test set",mentalModelShort:"Pop Quiz for AI",icon:"quiz",color:"#EA580C",accent:"#0D9488",teacherEmpowerment:{whatIsThisReally:"Hold-out test set is the honesty mechanism from 1950s statistics: split data into training (to learn line) and testing (to evaluate on unseen). Without it, models cheat by memorizing. The 2010s deep learning crisis was models acing training but failing real world — solved by strict test sets. ImageNet kept test labels secret. Why matters today: every product launch uses hold-out to avoid shipping a model that only memorized lunch menu last week but fails next week.",why7thGradersNeedThis:"Kids know studying only old quizzes then failing real test. Same for AI: if it only sees training dots, it may memorize them. Pop quiz with new questions reveals true learning. This teaches honesty in evaluation, not just optimism.",realWorldBehindTheScenes:"Google Maps tests ETA model on cities it never trained on — hold-out cities. If it only tested on trained cities, ETA looks perfect but fails in new city. Our waste project will hide 5 days as pop quiz. Train line on 9 days, predict hidden 5, compute error. That error is honest forecast of next week.",kidQuestionsAndAnswers:[{q:"Why hide data? Isn’t more training better?",a:"Training on all data makes error look tiny, but you fool yourself. Hiding some lets you simulate future. Better to have honest higher error than fake low error."},{q:"How much should be test?",a:"Typical 20-30% test, 70-80% train. Too small test = noisy evaluation, too large = not enough to learn. We use 5 hidden of 14 days ~35%."},{q:"Can AI cheat on test?",a:"If test data leaks into training — like peeking at quiz — yes. Real teams keep test locked, sometimes secret. That is why ethics of evaluation matters."}],vocabForTeacher:[{term:"Training Data",teacherDef:"Data used to fit line.",kidDef:"Practice problems you study.",pron:"TRAIN-ing",visualCue:"Open book with practice dots"},{term:"Test Data",teacherDef:"Held-out data never seen during training, used to evaluate.",kidDef:"Pop quiz new questions.",pron:"TEST",visualCue:"Closed envelope with ?"},{term:"Overfitting",teacherDef:"Model memorizes training noise, fails test.",kidDef:"Memorized answers, fails new quiz.",pron:"over-FIT-ing",visualCue:"Wiggly line through all dots but misses new dot"},{term:"Generalization",teacherDef:"Ability to perform on new data.",kidDef:"Doing well on pop quiz, not just practice.",pron:"gen-er-al-i-ZA-shun",visualCue:"Bridge from training island to test island"}]},mentalModelDeep:{name:"Pop Quiz for AI",teacherAnalogy:"Student studies 20 practice problems, memorizes answers. Teacher gives pop quiz with 5 new problems using same concept. If student truly learned concept, they pass; if memorized, they fail. Hold-out test is that pop quiz. Training dots = practice, test dots = quiz. Good model generalizes concept, not memorizes dots.",studentAnalogy:"If you only practice old spelling list, you fail when teacher uses new words with same rule. Pop quiz shows if you learned rule or just memorized list.",sketchSteps:["Draw two boxes: left Practice (open book) with 8 dots, right Pop Quiz (sealed envelope) with 3 dots ?","Draw line through left box dots","Draw same line extended into right box, predict quiz dots","Draw error arrows in quiz box only",'Label "Honest score = quiz errors only"'],commonWrongModel:{wrong:"Test set is for training harder, so include it to make line better",right:"Test set must stay hidden until final evaluation; its error is honest report card."},bridgeQuestion:"Would you want to know quiz questions before studying? What would that hide?"},examplesBank:[{title:"Spelling Rule Pop Quiz",story:"Learn i before e except after c. Practice 20 words, quiz 5 new words. Do you know rule?",howItWorks:"Practice = training, quiz = test. Memorization fails new words.",whereToSee:"Spelling test",discussionQ:"What if quiz words are much harder than practice?",whatIf:"If quiz leaks, grade inflated.",ethicsLens:{benefits:"True learning check",harmed:"None",missing:"Diverse word types",trafficLight:"Green"}},{title:"Maps Hidden City",story:"Train ETA in SF, LA, NYC, test in hidden Austin. Does it generalize?",howItWorks:"Hold-out city never seen. If ETA works there, model learned traffic physics, not just memorized SF.",whereToSee:"Google Maps new city launch",discussionQ:"What if Austin has scooters not cars?",whatIf:"If test city similar to train, false confidence.",ethicsLens:{benefits:"Works for new users",harmed:"Tourists if fails",missing:"Scooter data",trafficLight:"Yellow"}},{title:"Waste Hidden Week",story:"Train on 2 weeks Mon-Thu, test on Fri. Predict Fri waste honestly.",howItWorks:"Weekday pattern: Fri maybe less waste. Training without Fri hides that, test reveals.",whereToSee:"Our project",discussionQ:"Should test be random days or last week?",whatIf:"If Fri always pizza, test error high — need feature.",ethicsLens:{benefits:"Honest forecast",harmed:"Kitchen understaff if underestimate",missing:"Fri menu",trafficLight:"Green"}},{title:"Game Level Not Seen",story:"AI plays levels 1-10, test on level 11 never seen. Does it generalize jumping skill?",howItWorks:"Training levels teach jump timing, test level new layout tests generalization.",whereToSee:"AI game bots",discussionQ:"Is level 11 fair test if much harder?",whatIf:"If train and test levels share bug, both fail.",ethicsLens:{benefits:"Fun",harmed:"None",missing:"Player diversity",trafficLight:"Green"}},{title:"Medical Symptom Checker",story:"Trained on adult symptoms, tested on kids — fails. Hold-out reveals gap.",howItWorks:"Adult train, kid test = generalization failure. Need kid data.",whereToSee:"Health apps",discussionQ:"Is it ethical to test on kids after?",whatIf:"If test set only adults, misses harm to kids.",ethicsLens:{benefits:"Safety check",harmed:"Kids misdiagnosed if no kid test",missing:"Age groups",trafficLight:"Red"}},{title:"Ad Click Fraud",story:"Model trained to predict clicks, tested on new bots — catches fraud?",howItWorks:"Train on human clicks, test on new bot patterns. If fails, bots evolve.",whereToSee:"Ad dashboard",discussionQ:"Should test include future bot types?",whatIf:"If test data old bots, new bots slip.",ethicsLens:{benefits:"Saves advertiser money",harmed:"Small site flagged as fraud wrongly",missing:"New bot patterns",trafficLight:"Red"}}],physicalComputing:{title:"Hold-out - Hide 5 Dots as Test",microbit:"Log 15 temps, use first 10 to predict, test on last 5 hidden. Compute error.",noTech:"Paper with 15 dots, cover 5 with sticky notes as test envelope.",wiring:"Internal sensor, array split.",codeBlocks:["Collect 15 readings","Split: first 10 train, last 5 test","Fit line on train (simple avg slope)","Predict test Xs, compute error","Show avg test error"],stringMethod:"Cover 5 dots with envelope, fit yarn on visible 10, then lift envelope to check prediction."},communityData:{description:"Each school hides last week as test, compares honest error.",visual:"3 schools test errors"},lesson90Detailed:{prep15min:"15-dot sheets, sticky notes as envelopes, micro:bits with split code, practice vs quiz posters, test error calculation sheet.",flow:[{time:"0-10 Hook",goal:"Feel cheating vs honesty",teacherScriptExact:"I let you practice 10 math problems, then test you on same 10 — you get 100%! Did you learn? Now I test 5 new problems — score drops. Which score is honest? AI same. If we test on dots it trained on, error looks tiny but fake. Today we do pop quiz for AI by hiding dots.",studentAction:"Take practice test same questions vs new questions, compare feelings",materials:"Two mini quizzes",checkUnderstanding:"Green: Says new questions show true learning.",ifStuck:'Orange: "If you memorize answers, do you know concept?"'},{time:"10-25 Concept + Mental Model",goal:"Train vs test split",teacherScriptExact:"Draw two boxes: practice open, quiz sealed. Training data is practice you can see to fit line. Test data sealed envelope you cannot see until final. You fit line on practice, then extend to quiz and measure error only on quiz. That error is honest. If line wiggles to touch every practice dot, it will miss quiz dots — that is overfitting, memorizing not learning.",studentAction:"Draw two boxes, label train/test, sketch overfitting wiggly vs straight",materials:"Board, envelope prop",checkUnderstanding:"Green: Can explain why test must be hidden.",ifStuck:"Orange: Role play: let one student peek at quiz, other not. Who honest?"},{time:"25-45 Deep Dive 6 Examples",goal:"Generalization failures",teacherScriptExact:"Walk examples where test reveals failure: maps hidden city, medical kids, ad fraud. For each, ask: who harmed if we skip test? What missing data does test reveal? Mark traffic lights: red where harm high. Notice pattern: skipping test hides harm to unseen groups.",studentAction:"For each example, note train/test split and who harmed",materials:"Example cards, harmed stickers",checkUnderstanding:"Green: Identifies harmed group for 3 red/yellow examples.",ifStuck:'Orange: "If model never saw kids, what happens to kid user?"'},{time:"45-65 Unplugged Hands-On",goal:"Hide dots test",teacherScriptExact:"Teams get 15 dots, cover 5 with sticky envelope — do not peek! Fit yarn on 10 visible dots only. Tape. Now lift envelope — predict Y for hidden X using yarn, measure error. Record test error. Now try cheating: refit yarn using all 15 dots, measure test error again — is it smaller? Cheating makes test error look smaller but you peeked. Honest error is first one.",studentAction:"Cover 5 dots, fit line on 10, test on 5, compare honest vs cheating error",materials:"15-dot sheets, sticky notes, yarn, error ruler",checkUnderstanding:"Green: Honest test error larger than training error, understands why.",ifStuck:'Orange: "If you move yarn to hit hidden dots after seeing them, is that fair?"'},{time:"65-80 Workbook Practice",goal:"Compute train vs test error",teacherScriptExact:"Workbook W16: you have train 8 dots and test 4 dots. Line Y=0.5X+1. Compute train error average and test error average. Which bigger? Why? Then draw wiggly line through all train dots exactly — train error 0! Predict test dots with wiggly line — error huge. What happened? Overfitting.",studentAction:"Compute train/test errors, compare, sketch overfit",materials:"Workbook, calculator",checkUnderstanding:"Green: Test error > train error, identifies overfit.",ifStuck:"Orange: Calculate one train error together, then one test."},{time:"80-90 Reflection + Preview",goal:"Summarize and preview Goldilocks",teacherScriptExact:"We learned honest score comes from hidden test, not practice. Exit: why should we never let waste predictor see next week before predicting? Tomorrow we meet Goldilocks: not too simple line, not too wiggly line, just right for pop quiz.",studentAction:"Exit ticket explanation",materials:"Exit slips",checkUnderstanding:"Green: Says peeking leaks future and gives fake low error.",ifStuck:'Orange: "Would you trust weather app that only brags about yesterday?"'}]},unpluggedActivityEnlarged:{roles:["Hider: covers 5 dots with envelope, must not peek","Fitter: fits yarn on 10 train dots","Tester: lifts envelope and measures test errors","Honesty Checker: ensures no peeking during fit"],materials:["15-dot sheet","5 sticky note envelopes","Yarn","Test error log","Cheating allowed second round sheet"],steps:["1. Hider covers 5 random dots with sticky, writes ? on them","2. Fitter stretches yarn on 10 visible only","3. Tape yarn","4. Tester lifts one envelope, predicts Y using yarn, measures error","5. Repeat for all 5, average test error","6. Now allow peeking: refit yarn using all 15, remeasure test error — compare","7. Discuss: which error is honest forecast for next week?"],variations:{fast:"Use 10 train 3 test only",slow:"Two rounds: simple line vs wiggly line through all train dots, compare test errors"},whatTeacherObserves:"Do students resist peeking? Do they understand test error > train error normal? Can they articulate overfitting?",commonMistakes:["Using test dots to adjust yarn and still calling it test","Thinking test error should be zero for good model","Confusing training error with honesty"]},workbook:{tasks:["Given train/test split, compute train avg error and test avg error","Explain why test error usually bigger","Draw wiggly line that overfits train and fails test","Design honest test for waste predictor: which days hide?","Reflection: when have you memorized not learned?"],rubric:"4= errors correct, overfit sketch shows train 0 test large, honest design logical. 3= minor calc slip. 2= confuses train/test. 1= incomplete."}},{id:"W17",number:17,title:"Bias-Variance Tradeoff Simple",subtitle:"Simple vs wiggly model",mentalModelShort:"Goldilocks Model",icon:"goldilocks",color:"#0D9488",accent:"#EA580C",teacherEmpowerment:{whatIsThisReally:"Bias-variance tradeoff is central dilemma since 1950s: simple models (high bias) miss pattern, complex wiggly models (high variance) chase noise. Best model balances — Goldilocks just right. Formalized by Geman et al 1992. In 2010s deep learning seemed to break tradeoff with double descent, but for 7th grade linear case tradeoff holds. Why matters: it explains why not always use super wiggly AI — it fails pop quiz. Choosing complexity is ethical choice about trust.",why7thGradersNeedThis:"Kids intuitively know Goldilocks — porridge not too hot, not too cold. Same for models: simple line too stiff misses pizza day pattern, wiggly line too crazy memorizes every random spill. Just right line captures trend but ignores noise. That intuition helps them argue about when AI is too simple or too complex in news.",realWorldBehindTheScenes:"YouTube uses simple regression for new users (high bias, safe) then more complex as data grows. If they used wiggly model for new user with 3 videos, it would overfit and recommend weird stuff. Our waste predictor: simple line uses only student count, wiggly uses count + day + weather + noise — with 10 days, wiggly overfits. Goldilocks picks complexity matching data size.",kidQuestionsAndAnswers:[{q:"Is Goldilocks always in middle?",a:"Not exactly middle complexity, but middle error on test. Sometimes more data allows more complexity — Goldilocks moves right as data grows. With little data, Goldilocks is simple."},{q:"How do you find Goldilocks?",a:"Try simple and wiggly, test both on hidden pop quiz. Pick line with smallest test error, not training error. That is empirical search."},{q:"Can simple ever beat complex?",a:"Yes! With little or noisy data, simple wins because wiggly chases noise. That is why we start simple. Complex needs lots of clean data."}],vocabForTeacher:[{term:"Bias",teacherDef:"Error from oversimplifying — misses true pattern.",kidDef:"Too simple, stubborn.",pron:"BYE-us",visualCue:"Stiff straight ruler ignoring curve"},{term:"Variance",teacherDef:"Error from being too sensitive to training noise.",kidDef:"Too wiggly, nervous.",pron:"VAIR-ee-ance",visualCue:"Wiggly worm line through every dot"},{term:"Overfitting",teacherDef:"Low bias, high variance — memorizes train.",kidDef:"Memorized but fails quiz.",pron:"over-FIT",visualCue:"Wiggly line with 0 train error, big test error"},{term:"Underfitting",teacherDef:"High bias, low variance — too simple.",kidDef:"Too lazy, misses pattern.",pron:"under-FIT",visualCue:"Flat line through upward dots"}]},mentalModelDeep:{name:"Goldilocks Model",teacherAnalogy:"Goldilocks tries three porridges: too hot (high variance wiggly — burns by overreacting to every dot), too cold (high bias simple — ignores pattern, bland), just right (balanced — warm enough to capture trend, cool enough to ignore random spill). Bias is stubbornness to change, variance is nervous twitching. Good model is calm but attentive.",studentAnalogy:"Papa bear bed too hard = simple line misses bumps. Mama bear bed too soft = wiggly line sinks into every bump. Baby bear bed just right = follows gentle trend, ignores tiny crumbs.",sketchSteps:["Draw 3 beds labeled: Too Simple (flat line through rising dots), Too Wiggly (worm through all dots), Just Right (smooth trend)","Under each write Bias high / Variance high / Balanced","Draw test dot far right: which line predicts it best? Circle Just Right","Add Goldilocks peeking at Just Right bed",'Write "Test error smallest = Just Right"'],commonWrongModel:{wrong:"More wiggly always better because touches more dots",right:"Wiggly has tiny train error but huge test error — fails pop quiz. Just right has medium train error but smallest test error."},bridgeQuestion:"If you had only 3 dots, would you draw wiggly worm or simple line? Why?"},examplesBank:[{title:"Allowance Savings: Simple vs Wiggly",story:"3 allowance points: simple line predicts savings. Wiggly line zigzags through all 3 perfectly but predicts $100 savings for $20 allowance — crazy.",howItWorks:"High variance overfits 3 points, wild outside. Simple generalizes.",whereToSee:"Sketch",discussionQ:"Which would you trust for $25 allowance?",whatIf:"With 30 points, wiggly might be justified if pattern truly curved.",ethicsLens:{benefits:"Teaches caution",harmed:"None",missing:"Spending context",trafficLight:"Green"}},{title:"Face Filter Too Wiggly",story:"Filter that tracks every freckle (wiggly) fails when you smile — too sensitive. Simpler filter tracks eyes nose mouth.",howItWorks:"High variance model memorizes freckle positions, breaks on expression change.",whereToSee:"Snapchat filters",discussionQ:"When is detail good vs bad?",whatIf:"If training includes many expressions, wiggly could work.",ethicsLens:{benefits:"Fun",harmed:"Beauty standards",missing:"Diverse faces",trafficLight:"Yellow"}},{title:"Weather Simple Average vs Wiggly Past",story:"Simple: tomorrow = average last 7 days. Wiggly: matches every wiggle last 7 days exactly. Which predicts next week?",howItWorks:"Wiggly overfits last week noise, simple underfits seasonal shift. Goldilocks uses trend + season.",whereToSee:"Weather app",discussionQ:"What would Goldilocks consider?",whatIf:"With 2 years data, more complexity ok.",ethicsLens:{benefits:"Planning",harmed:"Farmers if wrong",missing:"Climate",trafficLight:"Yellow"}},{title:"YouTube Thumbnail Clickbait Wiggly",story:"Model that memorizes exact thumbnails that got clicks (wiggly) recommends same clickbait to you, fails when you change taste.",howItWorks:"High variance memorizes training clicks, low generalization to new interests.",whereToSee:"Recommendation feed",discussionQ:"Simple model based on topics vs specific videos?",whatIf:"If user taste stable, wiggly may work short term then fail.",ethicsLens:{benefits:"None",harmed:"Echo chamber",missing:"Long-term interests",trafficLight:"Red"}},{title:"Lunch Waste Goldilocks",story:"Simple: waste = 0.015*students. Wiggly: waste = 0.015*students + 2 if pizza + random noise from last Tuesday spill. Which predicts next week?",howItWorks:"Simple ignores pizza (high bias), wiggly memorizes spill (high variance). Goldilocks: includes pizza but not spill.",whereToSee:"Our project",discussionQ:"What feature is signal vs noise?",whatIf:"If pizza every Friday, including pizza reduces bias.",ethicsLens:{benefits:"Accurate",harmed:"None",missing:"Menu",trafficLight:"Green"}},{title:"Medical Diagnosis Simple vs Complex",story:"Simple rule: fever → flu. Complex: fever + 10 other rare symptoms → rare disease. Which safer with little data?",howItWorks:"Complex overfits rare cases, simple may miss but safer. Goldilocks needs lots of data for rare.",whereToSee:"Symptom checker",discussionQ:"When should doctor use simple vs run many tests?",whatIf:"More data allows more complexity safely.",ethicsLens:{benefits:"Safety",harmed:"Missed diagnosis if too simple, false alarm if too complex",missing:"Diverse patients",trafficLight:"Red"}}],physicalComputing:{title:"Goldilocks - Simple Line vs Wiggly Line",microbit:"Show simple prediction vs wiggly polynomial prediction for new X. Wiggly jumps wildly.",noTech:"Two yarns: straight vs wiggly pipe cleaner through dots. Test new dot.",wiring:"Code two formulas: simple Y=mX+b, wiggly Y=mX+b + sin(X)*noise.",codeBlocks:["Train 5 dots","Simple: fit line","Wiggly: fit through all dots exactly using piecewise","Predict new X=10: simple stable, wiggly crazy","Show both on LEDs as numbers"],stringMethod:"Use stiff yarn for simple, flexible pipe cleaner for wiggly, compare predictions for new dot."},communityData:{description:"3 schools: simple line similar across schools, wiggly lines very different — variance visual.",visual:"Simple vs wiggly across schools"},lesson90Detailed:{prep15min:"Pipe cleaners wiggly, yarn stiff, 3-bed poster, dot sheets 10 dots, simple/wiggly prediction cards, micro:bits with two formulas, Goldilocks storybook.",flow:[{time:"0-10 Hook",goal:"Feel too simple vs too wiggly",teacherScriptExact:"Story: Goldilocks tries Papa bear bed too hard — flat line that ignores dots rising, too simple. Mama bear bed too soft — wiggly worm that touches every dot but goes crazy outside. Baby bear bed just right — smooth trend. Which would you sleep in? Which line would you trust to predict tomorrow’s waste? Today we find Goldilocks model.",studentAction:"Vote beds, connect to lines",materials:"3 beds poster, dot plot with 3 lines",checkUnderstanding:"Green: Says too simple misses pattern, too wiggly crazy outside.",ifStuck:"Orange: Use body: stiff robot walk vs wiggly worm wiggle vs calm walk."},{time:"10-25 Concept + Mental Model",goal:"Bias vs variance",teacherScriptExact:"Bias is stubborn — too simple, ignores pattern, high error even on training. Variance is nervous — too wiggly, changes a lot if dots change a little, memorizes noise. Goldilocks balances. Draw: flat line = high bias, wiggly worm = high variance, just right = low test error. How to find? Try both, test on hidden pop quiz, pick smallest test error. That is tradeoff.",studentAction:"Draw 3 beds with bias/variance labels, write definitions",materials:"Board, vocab cards",checkUnderstanding:"Green: Can label bias high vs variance high lines.",ifStuck:'Orange: "If line ignores all dots, is it stubborn or nervous?"'},{time:"25-45 Deep Dive 6 Examples",goal:"Signal vs noise",teacherScriptExact:"Six stories where simple vs wiggly matters. For lunch waste, pizza is signal, random spill is noise. Goldilocks includes pizza not spill. For face filter, eyes are signal, freckles noise. Ask each: what is signal, what is noise? If we include noise, variance high. If we ignore signal, bias high. That is ethical choice: what we include.",studentAction:"For each example, list signal vs noise, vote Goldilocks",materials:"Signal/noise sorting cards",checkUnderstanding:"Green: Distinguishes signal vs noise for 4 examples.",ifStuck:'Orange: "Does pizza happen regularly? Spill once? Which is pattern?"'},{time:"45-65 Unplugged Hands-On",goal:"Compare simple vs wiggly prediction",teacherScriptExact:"Teams get 8 dots, two materials: stiff yarn simple, pipe cleaner wiggly. Fit both: yarn central, pipe cleaner through every dot exactly, twisting. Now predict new dot at X=10 far right. Simple predicts near trend, wiggly predicts wild high or low. Measure which closer to hidden true dot. You will see wiggly fails pop quiz. Rotate.",studentAction:"Fit simple and wiggly, predict far X, compare to hidden truth",materials:"Dots, yarn, pipe cleaners, hidden true dot envelope",checkUnderstanding:"Green: Wiggly train error 0 but test error large, simple test error smaller.",ifStuck:'Orange: "Look at pipe cleaner outside dots — does it shoot up crazy?"'},{time:"65-80 Workbook Practice",goal:"Calculate bias variance tradeoff",teacherScriptExact:"Workbook W17: table shows simple line train error 1.2 test error 1.3, complex line train error 0.2 test error 2.5, Goldilocks line train error 0.8 test error 0.9. Which is high bias? High variance? Goldilocks? Circle. Then explain why test error matters more than train. Draw your own Goldilocks line for given dots.",studentAction:"Compare errors, label bias/variance, draw Goldilocks",materials:"Workbook",checkUnderstanding:"Green: Correctly labels and picks Goldilocks smallest test error.",ifStuck:'Orange: "Which line memorizes training? That is variance. Which ignores? Bias."'},{time:"80-90 Reflection + Preview",goal:"Summarize and preview project",teacherScriptExact:"Today Goldilocks: not too simple, not too wiggly, just right = smallest test error. Simple = high bias, wiggly = high variance. Exit: draw your dots and show simple, wiggly, Goldilocks. Tomorrow we become Waste Prophets — collect real data and find our Goldilocks line for lunch waste.",studentAction:"Draw 3 lines, exit ticket",materials:"Exit slips, project preview poster",checkUnderstanding:"Green: 3 lines distinguishable, Goldilocks central with gentle curve maybe.",ifStuck:"Orange: Provide template with dots, ask to trace."}]},unpluggedActivityEnlarged:{roles:["Simple Fitter: fits stiff yarn (high bias)","Wiggly Fitter: fits pipe cleaner through all dots (high variance)","Judge: hides true new dot, reveals after prediction","Recorder: logs train error and test error for both"],materials:["8-dot sheet","Stiff yarn","Pipe cleaners","Hidden new dot envelope","Error log"],steps:["1. Simple Fitter stretches yarn central","2. Wiggly Fitter bends pipe cleaner through every dot exactly","3. Recorder measures train error: yarn some error, pipe cleaner 0","4. Judge places new X=10 card far right, asks both to predict Y using their line","5. Judge reveals true Y from envelope","6. Recorder computes test error: simple small, wiggly large","7. Discuss: which would you trust next week? Goldilocks?"],variations:{fast:"Use only 5 dots, quick fit",slow:"Add second hidden dot at X=0 to see wiggly crazy both sides"},whatTeacherObserves:"Do students see wiggly train 0 but test big? Can they articulate why simple sometimes wins with little data?",commonMistakes:["Thinking train error 0 means best","Confusing bias with being biased against people (related but different)","Thinking Goldilocks always exactly middle complexity"]},workbook:{tasks:["Given train/test errors for 3 models, label high bias, high variance, Goldilocks","Explain why test error > train error for wiggly","For waste data, list one signal and one noise feature","Draw simple, wiggly, Goldilocks for provided dots","Reflection: when have you been too simple or too wiggly in studying?"],rubric:"4= correct labels, explanation mentions memorization, signal/noise sensible, drawings distinguishable. 3= minor mix. 2= confuses bias/variance. 1= incomplete."}},{id:"W18",number:18,title:"PROJECT 3: Lunch Waste Prophet",subtitle:"Predict waste kg from students count",mentalModelShort:"Waste Prophet",icon:"prophet",color:"#EA580C",accent:"#0D9488",teacherEmpowerment:{whatIsThisReally:"Project 3 is authentic regression: collect 2 weeks of (student count, waste kg) from cafeteria, plot scatter, fit Goldilocks line, predict next week, then test honesty with hold-out. This mirrors real data science loop from 2010s: collect, clean, visualize, model, test, act. The 2012 breakthrough showed more diverse schools data improves generalization — we pool 3 schools. Why matters: students do not just learn regression, they use it to reduce waste — actionable AI for good.",why7thGradersNeedThis:'Predicting waste gives agency: they can tell kitchen "Tuesday 250 kids → expect 4.1kg, prep less". It connects math to environmental action and budgeting. Also shows data is not abstract — it is lunch they touched. That ownership builds data literacy for life.',realWorldBehindTheScenes:"LeanPath and Winnow are startups that do exactly this: scale in bin, regression predicts waste from covers, alerts kitchen. They use same line of best fit but with more features like menu, weather. Our classroom version is simplified but real mechanism. When we pool 3 schools anonymized counts only, we get better line, less noise, same as industry federated learning.",kidQuestionsAndAnswers:[{q:"Can we really predict waste?",a:"Approximately, yes. More kids usually more waste, but menu matters. Our line gives estimate with error bars. Even 20% error helps kitchen prep less. Perfect not needed for useful."},{q:"What if our prediction wrong and kitchen runs out?",a:'Great risk question! We give range not single number: "4-5kg, maybe 5 if pizza". Also we keep safety buffer. AI predictions should include uncertainty and human override.'},{q:"Who owns our waste data?",a:"We do. We anonymize to counts only, no names. Pooling shares counts not photos. That is privacy by design — minimal data needed for task."}],vocabForTeacher:[{term:"Waste Prophet",teacherDef:"Model that predicts waste kg to enable reduction.",kidDef:"Fortune teller for trash that helps reduce it.",pron:"WAYST PROF-et",visualCue:"Crystal ball showing kg number"},{term:"Data Collection",teacherDef:"Systematic gathering of X,Y pairs.",kidDef:"Writing down what you see each day.",pron:"DAY-ta",visualCue:"Clipboard with tallies"},{term:"Prediction Interval",teacherDef:"Range where future Y likely falls.",kidDef:"Guess with wiggle room.",pron:"pre-DIK-shun",visualCue:"Line with shaded band"},{term:"Actionable Insight",teacherDef:"Prediction that leads to decision.",kidDef:"Number that tells you what to do.",pron:"AK-shun-a-ble",visualCue:"Arrow from kg to less prep"}]},mentalModelDeep:{name:"Waste Prophet",teacherAnalogy:"A prophet does not claim perfect future, but reads signs — clouds, wind — to warn village. Waste Prophet reads signs — student count, day, menu — to warn kitchen: tomorrow will be high waste, prep less. It is humble, gives range, and helps act. Not magic, just pattern + error awareness + action.",studentAnalogy:'You are weather forecaster for trash. You look at past trash weather, draw trend path, and say "tomorrow about 4kg, maybe a bit more if pizza". Kitchen can then cook less and save planet.',sketchSteps:['Draw crystal ball with "4.2 kg" inside',"Below ball draw scatter dots (students vs waste)","Draw line through dots going into ball","Draw arrow from ball to kitchen with less food prepared",'Write "Predict → Act → Reduce" around'],commonWrongModel:{wrong:"Prophet predicts exact kg and kitchen must obey exactly",right:"Prophet gives estimate with range and uncertainty, kitchen uses as guidance with human judgment."},bridgeQuestion:"If prophet says 10kg waste tomorrow, what could kitchen do today to make it 8kg instead?"},examplesBank:[{title:"Our School Waste Prophet",story:"We collected 10 days: 200 kids 3.2kg etc. Line predicts 260 kids → 4.3kg. Kitchen preps 5% less.",howItWorks:"Regression line from our data. Prediction interval ±0.5kg. Action: less rice.",whereToSee:"Cafeteria scale log",discussionQ:"What action would you take for high prediction?",whatIf:"If pizza day, add 0.8kg to prediction.",ethicsLens:{benefits:"Less waste, save $",harmed:"None if buffer kept",missing:"Menu feature",trafficLight:"Green"}},{title:"Three Schools Pooled Prophet",story:"School A, B, C pool anonymized counts only, get better line with less wobble.",howItWorks:"More diverse data → learning curve flatter, variance lower, Goldilocks clearer.",whereToSee:"Community Pool tab",discussionQ:"Why anonymized counts only?",whatIf:"If one school has very different menu, pooled line may be biased for them.",ethicsLens:{benefits:"Better accuracy, collaboration",harmed:"Privacy if names shared",missing:"Menu differences",trafficLight:"Green"}},{title:"Supermarket Waste Prophet",story:"Store predicts unsold bread kg from customers count, donates early.",howItWorks:"Same regression: customers X, waste Y. Predict evening waste at noon, donate.",whereToSee:"Grocery donation bin",discussionQ:"Would you trust store to donate not trash?",whatIf:"If prediction overestimates, good food trashed unnecessarily.",ethicsLens:{benefits:"Food rescue",harmed:"Food safety if mis-handled",missing:"Expiry time",trafficLight:"Yellow"}},{title:"Hospital Linen Waste",story:"Hospital pre
