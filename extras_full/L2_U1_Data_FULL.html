at might be lost."},{q:"Do humans also have dirty data?",a:"Yes! Our memories are messy. Eyewitness testimony is famous for typos. That's why police use photos, notes, and cross-checks — their own cleaning."}],vocabForTeacher:[{term:"Raw Data",teacherDef:"Data as initially collected, unprocessed, with natural errors.",kidDef:"Messy pile straight from backpack",pronunciation:"raw DAY-tuh",visualCue:"Pile of crumpled papers"},{term:"Clean Dataset",teacherDef:"Structured, de-duplicated, validated, consistent representation ready for modeling.",kidDef:"Desk after organizing, only what you need",pronunciation:"kleen DAYT-uh-set",visualCue:"Labeled folders"},{term:"Missing Value",teacherDef:"Null or empty field requiring imputation or removal strategy.",kidDef:"Blank answer on quiz",pronunciation:"MISS-ing VAL-yoo",visualCue:"Empty box with ?"},{term:"Validation",teacherDef:"Rule check to ensure data conforms to expected range/format.",kidDef:"Hall pass check",pronunciation:"val-ih-DAY-shun",visualCue:"Checkmark stamp"}]},mentalModelDeep:{name:"Messy Room",teacherAnalogy:"A messy room has clothes on floor, books mixed, trash hidden. You can't find your math book, so you think it's lost and buy another — waste. Cleaning is not just tidying; it's categorizing (clothes vs books), discarding (trash), fixing (folding), and labeling. AI cleaning is identical: find duplicates, fix formats, remove impossible values, standardize.",studentAnalogy:"Your backpack after a week has old snacks, 3 pencils same, paper crumpled. Before homework, you empty, throw trash, keep good stuff. That's cleaning data.",sketchSteps:["Draw big square = room","Scribble dots = mess","Circle 3 groups: TRASH, FIX, KEEP","Arrow: Sort -> Trash bin, Fix -> mending, Keep -> shelf","Write: Clean first, learn second"],commonWrongModel:{wrong:"Cleaning means deleting everything messy to make it pretty.",right:"Cleaning means making mess understandable and usable, not just pretty. Sometimes messy shows important diversity."},bridgeQuestion:"If your room was a YouTube video list, what would be 'trash', what would be 'fix', and what would be 'keep'?"},examplesBank:[{title:"YouTube Title Typos",story:"A creator types 'how to cook rive' instead of rice. AI trained on typo thinks 'rive' is new food. Thousands see wrong search.",howItWorks:"Spell-checker dictionary compares words to known foods, flags rare words, suggests fix before training.",whereToSee:"YouTube search bar autocorrect",discussionQ:"Should AI auto-fix or ask human?",whatIf:"If we keep all typos, AI learns bad spelling as correct.",ethics:{benefits:"More accurate search helps learners",harmed:"Creators whose slang flagged as typo lose views",missing:"Non-English titles underrepresented",trafficLight:"Yellow"}},{title:"Missing Ages in Health App",story:"School health survey 100 kids, 12 left age blank. If AI deletes them, it ignores younger kids who may need help.",howItWorks:"Instead of delete, use median age or ask to re-collect, and log why missing.",whereToSee:"Google Forms required field",discussionQ:"When is deleting okay?",whatIf:"If all missing are 6th graders, deleting skews average older.",ethics:{benefits:"Complete data helps nurse",harmed:"Younger kids excluded if deleted",missing:"Privacy concerns why blank",trafficLight:"Red"}},{title:"Duplicate Game Accounts",story:"One kid makes 3 accounts to get free gems. Leaderboard thinks 3 players, not 1.",howItWorks:"Deduplication checks same device ID + similar name + same birthday, merges.",whereToSee:"Game leaderboard",discussionQ:"Is merging accounts fair?",whatIf:"If twins share device, merge wrongly harms them.",ethics:{benefits:"Fair leaderboard",harmed:"Twins flagged as cheaters",missing:"Shared devices in low-income homes",trafficLight:"Yellow"}},{title:"Date Formats Chaos",story:"US writes 01/02 = Jan 2, UK writes 01/02 = Feb 1. AI scheduling messes up.",howItWorks:"Standardize to YYYY-MM-DD ISO format, validate month 1-12, day 1-31.",whereToSee:"Airline tickets",discussionQ:"Whose format should win?",whatIf:"If we force US format, UK users confused.",ethics:{benefits:"No missed flights",harmed:"Cultural format erased",missing:"Indigenous calendars",trafficLight:"Green"}},{title:"Sensor Glitch -999 Temp",story:"Micro:bit temperature logs -999 when wire loose. AI thinks Antarctica in classroom.",howItWorks:"Range validation: human temp can't be -999, flag as error, remove or re-measure.",whereToSee:"Weather app",discussionQ:"Should we auto-remove impossible numbers?",whatIf:"If -999 is real error code, removing hides bug.",ethics:{benefits:"Accurate climate data",harmed:"If auto-removed, engineers never fix sensor",missing:"Maintenance workers need error logs",trafficLight:"Yellow"}},{title:"Name Capitalization",story:"Dataset has 'alice', 'Alice', 'ALICE' — AI thinks 3 different people, attendance wrong.",howItWorks:"Normalize to Title Case and trim spaces, but keep original for display.",whereToSee:"Class roster",discussionQ:"Does capitalization carry meaning?",whatIf:"If ALICE means shouting, normalizing loses emotion.",ethics:{benefits:"Accurate headcount",harmed:"Stylistic expression lost",missing:"Names where case matters culturally",trafficLight:"Green"}}],physicalComputing:{title:"Messy vs Clean Desk Logger",wiring:"micro:bit on desk, light sensor + button A = log messy (clutter blocks light), button B = log clean (light clear). USB to laptop.",codePseudo:["on start: clear log","on A: log light + label 'messy'","on B: log light + label 'clean'","on shake: show avg light messy vs clean"],noTech:"Tally chart: 10 desks, count items on desk, decide threshold >10 = messy",goal:"Students physically see messy = noisy sensor, clean = stable signal"},communityData:{note:"Pool anonymized counts only - no names. Sample size matters.",schools:[{name:"Lincoln Middle",rows:34,insight:"22% missing homework field - more in morning classes"},{name:"Riverside K8",rows:33,insight:"Duplicate entries 15% - shared Chromebooks"},{name:"Your School",rows:33,insight:"Date formats mixed 40% US / 60% ISO"}]},ethicsLensWeekly:"Who decides what is 'dirty' and what is 'normal'? Cleaning can erase minority patterns if not careful. Log everything.",lesson90Detailed:{prep15:["Print 100-row messy roster (duplicates, blanks, typos)","micro:bit + USB, tape","Sorting bins: TRASH / FIX / KEEP","Whiteboard ready for Messy Room sketch"],flow:[{phase:"Hook - Messy Backpack",time:"0-10m",goal:"Feel cost of messy data",teacherScriptExact:"Everyone dump backpack mentally. What’s lost? I lost my homework last week because my bag was messy. Data is same. If AI learns from messy backpack, it thinks trash is treasure. Today we become cleaners, not just users.",studentAction:"List 3 messy items in own backpack, vote messiest desk",materials:"Backpacks, board",checkUnderstanding:"Can you name one cost of messy backpack? Green box: If 3 students answer with example of lost/found, go.",ifStuck:"Show photo of extremely messy room, ask: could you find red sock in 10 sec?"},{phase:"Mental Model - Messy Room",time:"10-20m",goal:"Anchor cleaning metaphor",teacherScriptExact:"Draw square = room. Scribble mess. Now we sort: Trash = impossible like age 200, Fix = typo rive->rice, Keep = good data. This is 80% of real AI job. Engineers don’t code all day; they clean.",studentAction:"Copy sketch, label TRASH/FIX/KEEP",materials:"Whiteboard markers",checkUnderstanding:"Student labels example: age -5 as TRASH? Yes.",ifStuck:"Use physical desk items, sort live."},{phase:"Direct Mini - 3 Cleaning Moves",time:"20-35m",goal:"Teach delete, fix, standardize",teacherScriptExact:"Three moves only. One: Remove impossible. Two: Fix obvious typo with dictionary. Three: Standardize format like dates. We log each move. Why log? So we can undo if we harmed someone.",studentAction:"On 100-row sheet, highlight red impossible, yellow typo, green keep",materials:"Highlighters, messy dataset",checkUnderstanding:"Find -999 temp and mark red. Green box: 80% correct.",ifStuck:"Do 3 rows together, think-aloud."},{phase:"Unplugged - Sorting Factory",time:"35-60m",goal:"Embody cleaning",teacherScriptExact:"Roles: Trainer holds rules, Model holds raw row, Tester checks if row passes, Recorder logs decision. Rotate. You are a human cleaning pipeline like YouTube. Speed matters but accuracy matters more.",studentAction:"In groups of 4, process 20 rows each, log decisions",materials:"Role cards, rows cut",checkUnderstanding:"Recorder shows log: 3 TRASH, 5 FIX, 12 KEEP.",ifStuck:"Reduce to 10 rows, add hint card: 'Age >120 = TRASH'."},{phase:"Physical Lab - Light Logger",time:"60-80m",goal:"See noisy vs stable signal",teacherScriptExact:"Messy desk blocks light sensor, clean desk gives steady light. Log both. Messy = jumpy numbers, clean = stable. This is why AI prefers clean. Shake micro:bit to see average.",studentAction:"Log 5 messy, 5 clean readings, compare avg",materials:"micro:bit, laptop",checkUnderstanding:"Clean avg higher and less variable? Explain why.",ifStuck:"Use phone flashlight to simulate clean vs hand shadow messy."},{phase:"Exit & Reflect",time:"80-90m",goal:"Ethics of deletion",teacherScriptExact:"Today we learned cleaning is 80% of work. But who decides what is trash? If we delete all quiet kids' data because incomplete, we erase them. Tomorrow we meet loud kids — outliers. Exit ticket: Name one TRASH you deleted and one risk of deleting it.",studentAction:"Write exit ticket, stick on Ethics Wall",materials:"Sticky notes",checkUnderstanding:"Exit shows awareness of deletion risk.",ifStuck:"Sentence starter: 'I deleted ___ but risk is ___'."}]},unpluggedActivityEnlarged:{roles:["Trainer: holds cleaning rules sheet","Model: holds raw data card","Tester: checks against rules","Recorder: logs TRASH/FIX/KEEP"],materials:["100 row cards","3 bins","Rules poster","Log sheet"],steps:["1. Trainer reads rule: Age 0-120 valid","2. Model shows row: 'Age -5, Name ALICE'","3. Tester says: -5 invalid = TRASH or FIX?","4. Group debates: is -5 typo for 5?","5. Recorder logs decision + reason","6. Rotate roles, next row","7. Count bins, discuss what was lost"],variations:{fast:"Speed round 30 rows in 5 min, then audit accuracy",slow:"Each row debate 2 min, focus on ethics of deletion"},observes:["Do they auto-delete or try fix?","Do they log reason?","Do they notice bias if many similar rows deleted?"],mistakes:["Deleting everything blank without asking why blank","Fixing typo to what they assume, not checking","Not logging, so can't undo"]},workbook:[{task:"Raw: ['alice', 'ALICE', 'Bob', '', 'Carol'] -> Clean list",answer:"['Alice','Bob','Carol'] + log: removed empty, merged duplicate alice/ALICE"},{task:"Find 3 dirty items in: Age: 12,13, -2, 14, 999, 13",answer:"-2 and 999 impossible, duplicate 13 may be okay, check context"}]},{id:"W2",title:"Data Types, Distributions, Outliers",tagline:"Not all data equal - One loud kid skews average",mentalModel:"Loud Kids",mentalEmoji:"\uD83D\uDCE2",color:"#F97316",teacherEmpowerment:{whatIsThisReally:"Data types formalized in 1960s programming languages: numeric, categorical, boolean. Distributions studied since 1900s by Pearson and Fisher to understand how data spreads. Outliers defined by Tukey in 1977 with boxplots. Different types need different treatment. A loud kid in class (outlier) can make average participation look high, hiding that most kids are quiet. AI must detect when one extreme dominates.",why7thGradersNeedThis:"Kids know loud kids — one person yelling changes whole class average noise. Same with TikTok: one viral video with 10M views skews creator's average. They need to see why average can lie and median sometimes tells truth.",realWorldBehindTheScenes:"TikTok outlier detection: If a user normally watches 20 videos/day but suddenly 500 (bot or shared account), algorithm flags as outlier, doesn't use to train recommendations, otherwise it would think user loves everything. Light sensor spike detection similar — sudden jump >3 standard deviations ignored.",kidQuestionsAndAnswers:[{q:"What is outlier?",a:"A value far from others. Like 1 kid shouting in quiet library. It can be error or super interesting real event."},{q:"Should we always delete outliers?",a:"No! Sometimes outlier is discovery — like first COVID case was outlier. Delete only if error, investigate if interesting."},{q:"Types vs distributions difference?",a:"Type = what kind (number vs word). Distribution = how numbers spread (clustered or spread out)."}],vocabForTeacher:[{term:"Distribution",teacherDef:"Pattern of how data values are spread across range.",kidDef:"How kids spread in cafeteria",pronunciation:"dis-tri-BYOO-shun",visualCue:"Dots spread on line"},{term:"Outlier",teacherDef:"Observation distant from other observations, may be error or signal.",kidDef:"Loud kid in quiet class",pronunciation:"OUT-ly-er",visualCue:"One dot far away"},{term:"Categorical",teacherDef:"Data representing categories, not numbers.",kidDef:"Flavor, not amount",pronunciation:"cat-eh-GOR-ical",visualCue:"Color labels"},{term:"Numeric",teacherDef:"Data representing measurable quantity.",kidDef:"How many, how much",pronunciation:"new-MER-ik",visualCue:"Ruler"}]},mentalModelDeep:{name:"Loud Kids",teacherAnalogy:"Class noise average: 19 kids whisper at 20 decibels, 1 kid screams at 100 decibels. Average = (19*20+100)/20 = 24 decibels — looks louder than reality for most. Median stays 20. Outlier pulls average. Same in data: one billionaire in village makes average income look rich.",studentAnalogy:"One friend yelling your average volume score is loud, even if you're quiet 90% of time.",sketchSteps:["Draw 19 small dots low","Draw 1 big dot high far right","Draw average line pulled up","Draw median line staying low","Label: Average listens to loud kid, median listens to middle kid"],commonWrongModel:{wrong:"Outlier is always bad and should be deleted.",right:"Outlier is clue. Could be error or most important discovery. Investigate first."},bridgeQuestion:"If TikTok deletes all loud kid videos, what does it lose?"},examplesBank:[{title:"Class Test Score 0%",story:"Everyone scores 70-90, one kid 0 because absent. Average drops to 65, looks failing class.",howItWorks:"Detect 0 is >2 std away, check attendance log, mark as missing not 0, use median.",whereToSee:"Gradebook",discussionQ:"Is 0 fair if absent?",whatIf:"If 0 is real fail, deleting hides struggle.",ethics:{benefits:"Fair class average",harmed:"Absent kid needs support, not deletion",missing:"Reason for absence",trafficLight:"Yellow"}},{title:"Viral Video 10M Views",story:"Creator avg 1k views, one video 10M. Sponsors think avg 500k, overpay.",howItWorks:"Median shows 1k typical, outlier flagged as viral event separate analysis.",whereToSee:"YouTube analytics",discussionQ:"Should viral count for average?",whatIf:"If viral is new normal, ignoring loses growth.",ethics:{benefits:"Realistic expectations",harmed:"Creator undervalued if viral ignored",missing:"Why viral — luck or skill",trafficLight:"Green"}},{title:"Sensor Spike - Sun Flash",story:"Light sensor logs 255 suddenly when sun hits. AI thinks lights on all day.",howItWorks:"Sudden jump >50 in 1 sec = outlier, smooth with previous avg.",whereToSee:"micro:bit light log",discussionQ:"Is sun real or error?",whatIf:"If sun is real, smoothing hides daylight pattern.",ethics:{benefits:"Stable reading",harmed:"Natural daylight erased",missing:"Time of day context",trafficLight:"Yellow"}},{title:"Billionaire in Town",story:"Town avg income $30k, one billionaire moves, avg becomes $300k, town looks rich, loses aid.",howItWorks:"Use median $30k stays, flag billionaire as outlier for separate policy.",whereToSee:"Census data",discussionQ:"Who decides outlier?",whatIf:"If many billionaires move, not outlier anymore.",ethics:{benefits:"Aid stays for needy",harmed:"Billionaire excluded from community data",missing:"Wealth inequality context",trafficLight:"Red"}},{title:"Game Lag Spike",story:"Ping 50ms normally, spike 2000ms once. Average ping looks bad.",howItWorks:"Remove top 1% spikes before avg, show median.",whereToSee:"Game stats",discussionQ:"Should lag be ignored?",whatIf:"If spikes frequent, ignoring hides problem.",ethics:{benefits:"Fair performance view",harmed:"Players with bad internet hidden",missing:"Infrastructure inequality",trafficLight:"Yellow"}},{title:"Wrong Units cm vs inches",story:"Heights: 150cm, 5ft, 160cm mixed. 5 looks outlier vs 150.",howItWorks:"Standardize units to cm, 5ft=152cm not outlier.",whereToSee:"Health records",discussionQ:"How to know units?",whatIf:"If no unit label, can't fix.",ethics:{benefits:"Accurate health",harmed:"If forced to one unit, original culture lost",missing:"Source of measurement",trafficLight:"Green"}}],physicalComputing:{title:"Loud Kid = Light Spike",wiring:"micro:bit light sensor facing ceiling, log every second. Cover sensor suddenly = spike to 0. Shake = spike to 255.",codePseudo:["log light every 1000ms","if jump > 50: mark 'OUTLIER'","show outlier count","no-tech: clap loud = outlier"],noTech:"Human chain whisper, one shouts, graph noise",goal:"Feel outlier detection physically"},communityData:{note:"Outlier rates differ by school - context matters",schools:[{name:"Lincoln Middle",rows:34,insight:"Outlier: 1 kid logged 120 books - real avid reader, not error"},{name:"Riverside K8",rows:33,insight:"Light sensor outliers 30% - classroom near window sun"},{name:"Your School",rows:33,insight:"Game time outlier 8hrs - weekend vs weekday"}]},ethicsLensWeekly:"Outliers can be marginalized voices. Deleting them can silence. Always ask: who is the loud kid and why loud?",lesson90Detailed:{prep15:["Print dot plots with outlier","micro:bit + flashlight","Billionaire town story cards","Outlier ruler"],flow:[{phase:"Hook - Loud Kid Demo",time:"0-10m",goal:"Feel outlier pull",teacherScriptExact:"Everyone whisper your name. Now one person shout. What happened to average volume? We just created an outlier. Average listened to loud kid, median stayed with middle. Data same. One billionaire ruins town average.",studentAction:"Whisper/shout demo, calculate avg with outlier",materials:"Noise meter app",checkUnderstanding:"If 19*20 +100 /20 =? Green: 24 correct.",ifStuck:"Use numbers 2,3,4,100 - which pulls average?"},{phase:"Types & Distribution",time:"10-20m",goal:"Types need different handling",teacherScriptExact:"Two kinds: numbers you can average like height, and categories like favorite color you can't average. Distribution is how they spread. Are most kids clustered tall or spread? Draw dots.",studentAction:"Sort cards into numeric vs categorical, plot dot plot",materials:"Cards",checkUnderstanding:"Is 'pizza topping' numeric? No.",ifStuck:"Ask: can you add them? If no, categorical."},{phase:"Detect Outlier - 3 Methods",time:"20-35m",goal:"Teach IQR, z-score intuition, visual",teacherScriptExact:"Method one: look - dot far away. Method two: if value > 2 steps from middle. Method three: boxplot whiskers. We will use look + jump rule: sudden jump >50 is outlier. Real data scientists use fancy math, same idea.",studentAction:"Circle outliers on 5 plots",materials:"Dot plot sheets",checkUnderstanding:"Circle outlier in 70,72,75,200. Green if 200.",ifStuck:"Use ruler: more than one hand away from cluster = outlier."},{phase:"Unplugged - Loud Kids Chain",time:"35-60m",goal:"Embody",teacherScriptExact:"Line up, whisper number 20. One person assigned loud kid yells 100. Trainer calculates average, Model shows how median stays 20. Switch loud kid. Feel pull.",studentAction:"Chain whisper, calculate",materials:"Role cards",checkUnderstanding:"Average vs median difference explained.",ifStuck:"Use 5 people only, easier math."},{phase:"Physical Lab",time:"60-80m",goal:"Sensor outlier",teacherScriptExact:"Log light. Steady = normal kids. Cover sensor = outlier 0, flashlight = outlier 255. Code marks OUTLIER if jump >50. Is sun outlier or real? Debate.",studentAction:"Log, trigger spikes, count outliers",materials:"micro:bit",checkUnderstanding:"Can distinguish real change vs glitch?",ifStuck:"Manually graph first, then micro:bit."},{phase:"Exit Ethics",time:"80-90m",goal:"Outlier as person",teacherScriptExact:"Outlier could be a kid who reads 100 books while others read 5. Is that error? No, star. If we delete stars, we lose excellence. Tomorrow we summarize with photo captions — mean median mode. Ticket: outlier you would keep and why.",studentAction:"Write ticket",materials:"Sticky",checkUnderstanding:"Shows keep vs delete reasoning.",ifStuck:"Starter: 'I would keep ___ because ___.'"}]},unpluggedActivityEnlarged:{roles:["Trainer: says rule for outlier","Model: holds data point card","Tester: measures distance","Recorder: marks outlier"],materials:["Number line tape on floor","Dot cards","Whistle for outlier"],steps:["1. Lay number line 0-100","2. 5 students stand at 20,21,22,20,21","3. Trainer brings 100 stands far","4. Tester measures gap >20 = outlier","5. Recorder marks","6. Discuss keep/delete","7. Repeat with real star reader example"],variations:{fast:"Add 2 outliers at once, find both",slow:"One at a time, story for each"},observes:["Do they ask why outlier before deleting?","Do they use visual distance?","Do they protect star outliers?"],mistakes:["Calling all high values outliers","Not checking context","Deleting star performers"]},workbook:[{task:"Data: 10,12,11,13,100. Mean? Median? Outlier?",answer:"Mean 29.2, Median 12, Outlier 100. Median better."},{task:"Categorical: [red, blue, red] distribution?",answer:"red 2, blue 1 - bar chart not histogram"}]},{id:"W3",title:"Mean, Median, Mode - How AI Summarizes",tagline:"Photo caption tells story - summary tells truth",mentalModel:"Photo Caption",mentalEmoji:"\uD83D\uDCF8",color:"#EA580C",teacherEmpowerment:{whatIsThisReally:"Mean (average) formalized in 1700s for astronomy error reduction, median used in 1800s for skewed income data, mode for most common. All are compression: 1000 numbers -> 1 number story. Choice matters: mean sensitive to outliers, median robust, mode shows popularity. AI summarization like Google search snippets uses same idea: compress many pages into one summary.",why7thGradersNeedThis:"Kids caption photos daily — choosing 5 words to tell 1000-word story. Mean/median/mode are data captions. Which caption is fair? If one loud kid skews mean, caption lies. They need to choose right caption for situation.",realWorldBehindTheScenes:"Google summarization: When you search 'average height 7th grader', Google doesn't show all 10M heights, it shows median to avoid billionaire height problem (outlier athletes). TikTok 'average watch time' uses mean but trims outliers (top 1% removed) to avoid one viral binge skewing.",kidQuestionsAndAnswers:[{q:"Which is best: mean median mode?",a:"Depends. Mean for symmetric, median for skewed with outliers, mode for most popular category."},{q:"Can they be same?",a:"Yes in perfectly symmetric data like 5,6,7 — all 6. Real data rarely symmetric."},{q:"Why AI needs summary?",a:"Can't show 1B rows to user. Must compress to one helpful number."}],vocabForTeacher:[{term:"Mean",teacherDef:"Sum divided by count, sensitive to extremes.",kidDef:"If all shared equally",pronunciation:"meen",visualCue:"Balance scale"},{term:"Median",teacherDef:"Middle value when sorted, robust to outliers.",kidDef:"Middle kid in line",pronunciation:"MEE-dee-an",visualCue:"Line sorted, middle marked"},{term:"Mode",teacherDef:"Most frequent value.",kidDef:"Most popular",pronunciation:"mohd",visualCue:"Tallest bar"},{term:"Skew",teacherDef:"Asymmetry where mean pulled from median.",kidDef:"Loud kid pulls caption",pronunciation:"skyoo",visualCue:"Arrow pulling"}]},mentalModelDeep:{name:"Photo Caption",teacherAnalogy:"1000 vacation photos — you pick one caption: 'Sunny beach fun'. You compressed 1000 moments into 3 words. Different captions tell different stories: 'Expensive trip' (mean cost) vs 'Mostly beach' (mode activity) vs 'Middle day was calm' (median mood). Mean/median/mode are captions with different angles.",studentAnalogy:"TikTok recap: 'You watched 2hrs average' vs 'Most days 30min but one day 10hrs' — which caption more honest?",sketchSteps:["Draw 5 photos scattered","Draw caption box","Write 3 captions: AVG, MID, POPULAR","Show one photo far away (outlier) affects AVG caption","Label: Choose caption that tells truth for audience"],commonWrongModel:{wrong:"Average = typical, always.",right:"Average can be lie if outlier. Typical might be median or mode."},bridgeQuestion:"If you caption class height with mean vs median, which would you use if basketball player in class?"},examplesBank:[{title:"Allowance $",story:"5 kids allowance: $5,$5,$6,$6,$100 (one rich kid). Mean $24.40 looks rich class, median $6 true.",howItWorks:"Sort: median middle = $6. Mean sum/count = $24.4 pulled by $100.",whereToSee:"Family budget",discussionQ:"Which caption would principal use to claim school needs no aid?",whatIf:"If $100 is monthly, not weekly, outlier error.",ethics:{benefits:"Median shows true typical",harmed:"Rich kid labeled outlier = exclusion",missing:"Family income context",trafficLight:"Red"}},{title:"Game Scores Mode",story:"Scores: 100,90,100,80,100. Mean 94, median 100, mode 100. Mode shows most common win.",howItWorks:"Count frequency, 100 appears 3 times.",whereToSee:"Leaderboard most common score",discussionQ:"When is mode more useful than mean?",whatIf:"If two modes (bimodal), story splits.",ethics:{benefits:"Shows achievable score",harmed:"Low scores hidden if only mode shown",missing:"Struggling players",trafficLight:"Yellow"}},{title:"Wait Time Hospital",story:"ER wait: 10,15,20,20,300 mins (one disaster day). Mean 73 mins scary, median 20 calm.",howItWorks:"Hospital reports median to avoid panic, but logs mean for staffing.",whereToSee:"Hospital website",discussionQ:"Is reporting median misleading?",whatIf:"If 300 is frequent, median hides crisis.",ethics:{benefits:"Calm public",harmed:"Crisis hidden if median only",missing:"Why 300 — understaffed?",trafficLight:"Red"}},{title:"TikTok Watch Time",story:"Watch: 5,10,15,600 mins binge. Mean 157 mins suggests addiction, median 12.5 mins normal.",howItWorks:"App uses trimmed mean (remove top 1%) for fair avg.",whereToSee:"Screen time report",discussionQ:"Should binge count?",whatIf:"If binge is real interest, trimming erases passion.",ethics:{benefits:"Fair habit view",harmed:"Passionate fan erased",missing:"Why binge — boredom or love",trafficLight:"Yellow"}},{title:"Shoe Size Mode",story:"Shoe sizes 7,8,8,8,9. Mean 8, median 8, mode 8 all same because symmetric, easy order.",howItWorks:"Symmetric distribution all centers agree.",whereToSee:"Store stock",discussionQ:"What if sizes skewed large?",whatIf:"If one size 15 ordered, mean shifts, stock wrong.",ethics:{benefits:"Easy stock",harmed:"Large feet ignored if mean only",missing:"Inclusive sizing",trafficLight:"Green"}},{title:"Salary Negotiation",story:"Company says avg salary $80k (mean with CEO $1M). Median $45k tells worker truth.",howItWorks:"CEO outlier inflates mean, median resists.",whereToSee:"Job ad",discussionQ:"Which should company report?",whatIf:"If CEO salary included, mean misleading.",ethics:{benefits:"Transparency if median",harmed:"Workers misled by mean",missing:"CEO pay ratio",trafficLight:"Red"}}],physicalComputing:{title:"Caption with micro:bit",wiring:"Log light 10 times, compute mean median mode on micro:bit screen. Button A = mean, B = median.",codePseudo:["log 10 lights","sort list","mean = sum/len","median = middle","mode = most frequent","show on press"],noTech:"Measure 10 classmates heights, calc all three, discuss",goal:"Physically compute captions"},communityData:{note:"Mean vs median gap shows inequality",schools:[{name:"Lincoln",rows:34,insight:"Mean books 15, median 8 - few avid readers pull mean"},{name:"Riverside",rows:33,insight:"Mode favorite sport = soccer"},{name:"Your School",rows:33,insight:"Mean screen time 3hr, median 2hr - binge skew"}]},ethicsLensWeekly:"Who benefits when we pick mean over median? Powerful outliers can hide behind mean.",lesson90Detailed:{prep15:["Heights tape","Calculators","Photo caption examples","micro:bit"],flow:[{phase:"Hook - Caption Game",time:"0-10m",goal:"Summarizing is captioning",teacherScriptExact:"I have 20 photos from weekend. Caption in 3 words. You just summarized 20 into 3. Mean median mode are data captions. Today we learn which caption lies and which tells truth.",studentAction:"Caption 5 photos, vote best",materials:"Photos",checkUnderstanding:"Can they compress?",ifStuck:"Show Instagram caption vs reality."},{phase:"3 Captions Math",time:"10-25m",goal:"Compute",teacherScriptExact:"Mean = share equally, median = middle kid, mode = most popular. Calculate for 5 allowances $5,$5,$6,$6,$100. Mean $24, median $6. Which tells truth about typical kid? Median. Mean listens to loud rich kid.",studentAction:"Calculate for 3 datasets",materials:"Worksheet",checkUnderstanding:"Mean vs median for skewed?",ifStuck:"Use physical money share."},{phase:"When Each Wins",time:"25-35m",goal:"Choose right summary",teacherScriptExact:"Use mean when symmetric no outliers like shoe size. Median when outlier like salary. Mode when most popular matters like favorite color. No one best, context best.",studentAction:"Match scenario to best caption",materials:"Scenario cards",checkUnderstanding:"Salary scenario = median?",ifStuck:"Ask: is there a loud kid? If yes, median."},{phase:"Unplugged - Line Up",time:"35-60m",goal:"Embody median",teacherScriptExact:"Line up by height. Middle person = median. Now add basketball player 7ft at end. Did median move? No. Mean moved? Yes. Feel robust.",studentAction:"Line up, find median, add outlier, observe",materials:"Floor tape",checkUnderstanding:"Median stable, mean shifts.",ifStuck:"Use 5 people first."},{phase:"Physical + Calculator",time:"60-80m",goal:"Compute with sensor",teacherScriptExact:"Log 10 light readings. One reading with flashlight = 255 outlier. Compute mean median. Which changed less? Median. That's why AI uses median for noisy sensors.",studentAction:"Log, compute, compare",materials:"micro:bit",checkUnderstanding:"Median less affected.",ifStuck:"Calculate manually with sorted list."},{phase:"Exit",time:"80-90m",goal:"Ethics of caption choice",teacherScriptExact:"Company can lie with mean if CEO rich. Which caption would you use to get more funding? Mean if rich outlier helps. Ethics: choose caption that serves truth, not power. Ticket: pick dataset, choose best caption and justify.",studentAction:"Exit ticket",materials:"Tickets",checkUnderstanding:"Justification includes outlier awareness.",ifStuck:"Starter: 'I choose median because ___'."}]},unpluggedActivityEnlarged:{roles:["Trainer: explains mean/median/mode","Model: holds number card","Tester: sorts line","Recorder: calculates"],materials:["Number cards","Balance scale","Line tape"],steps:["1. 7 students hold numbers","2. Trainer: find mean by sharing (sum/7)","3. Tester sorts line, finds middle = median","4. Recorder counts duplicates = mode","5. Add outlier 100, repeat","6. Observe which moves","7. Discuss which caption honest"],variations:{fast:"Use 20 cards, quick calc",slow:"Act out sharing money physically"},observes:["Do they sort before median?","Do they see mean pulled?","Can they explain choice?"],mistakes:["Forgetting to sort for median","Mean without sum","Mode as average"]},workbook:[{task:"5,6,7,7,100 -> mean, median, mode",answer:"Mean 25, median 7, mode 7. Median/mode typical."},{task:"When to use mode?",answer:"Most popular category, e.g., favorite color, not numeric average."}]},{id:"W4",title:"Visualizing Distributions - Histograms Tell Stories",tagline:"Chart is X-ray of data",mentalModel:"X-Ray",mentalEmoji:"\uD83E\uDE7B",color:"#FB923C",teacherEmpowerment:{whatIsThisReally:"Visualization invented 1786 by William Playfair, Scottish engineer, first bar chart and pie chart. Histograms show shape: normal bell, skewed, bimodal two peaks. Shape tells story of process. Normal = many small random causes, skewed = barrier (like zero), bimodal = two groups mixed. AI uses histograms to see if cleaning worked and if data balanced.",why7thGradersNeedThis:"Kids see X-rays at doctor — you can't see bone without X-ray. Data same, you can't see shape without chart. Histogram is X-ray of class heights, game scores, screen time. Shape shows if one group or two groups.",realWorldBehindTheScenes:"YouTube uses histograms of watch time: if histogram shows two peaks (shorts vs long), they know two audiences, make two recommendation models. If histogram skewed, they know barrier like minimum watch time. Visual check catches data bugs before AI trains.",kidQuestionsAndAnswers:[{q:"Histogram vs bar chart?",a:"Histogram numeric ranges (0-10,10-20) touching, bar chart categories (red, blue) separated."},{q:"Why shape matters?",a:"Bell = natural, skewed = barrier, two peaks = two groups. Shape hints cause."},{q:"How many bins?",a:"Not too few (hides detail) not too many (noisy). Rule: sqrt(n) bins. 100 rows ~10 bins."}],vocabForTeacher:[{term:"Histogram",teacherDef:"Chart of numeric distribution with bins, bars touching.",kidDef:"X-ray of numbers",pronunciation:"HIS-toe-gram",visualCue:"Bars touching"},{term:"Bin",teacherDef:"Interval grouping continuous data.",kidDef:"Bucket for numbers",pronunciation:"bin",visualCue:"Bucket"},{term:"Skewed",teacherDef:"Asymmetric tail longer one side.",kidDef:"Leaning to side",pronunciation:"skyood",visualCue:"Tail arrow"},{term:"Bimodal",teacherDef:"Two peaks, two groups.",kidDef:"Two humps like camel",pronunciation:"by-MOH-dal",visualCue:"Camel humps"}]},mentalModelDeep:{name:"X-Ray",teacherAnalogy:"Doctor can't see broken bone from outside, needs X-ray. Teacher can't see if class has two groups (gamers vs readers) from list of numbers, needs histogram X-ray. Shape reveals hidden structure: one hump = one group, two humps = two groups mixed, long tail = barrier like can't go below zero screen time.",studentAnalogy:"Instagram filter vs X-ray: filter makes pretty, X-ray shows truth underneath.",sketchSteps:["Draw list of numbers","Draw buckets 0-10,10-20","Drop numbers into buckets count","Draw bars touching","Label shape: bell, skewed, camel"],commonWrongModel:{wrong:"Chart is just pretty picture to decorate.",right:"Chart is diagnostic tool like X-ray, shows disease in data (skew, gaps, two groups)."},bridgeQuestion:"If histogram of heights shows two peaks, what two groups might be in 7th grade?"},examplesBank:[{title:"Heights Bimodal",story:"7th grade heights histogram shows two peaks: 4'8 and 5'2, maybe girls vs boys growth spurts different timing.",howItWorks:"Two peaks = mixture of two distributions, not one average.",whereToSee:"Class height chart",discussionQ:"Should we average two peaks?",whatIf:"If we use single mean 5'0, fits nobody.",ethics:{benefits:"Shows diversity",harmed:"If labeled boy/girl peak, stereotypes",missing:"Non-binary growth",trafficLight:"Yellow"}},{title:"Screen Time Skewed",story:"Screen time histogram long tail to right: most 1-2hr, few 8hr bingers. Tail = no upper limit.",howItWorks:"Skewed right because can't be <0 but can be large.",whereToSee:"Screen time app",discussionQ:"Is skew bad?",whatIf:"If we remove tail, hide addiction.",ethics:{benefits:"Shows typical + extremes",harmed:"Bingers shamed",missing:"Why binge — homework or escapism",trafficLight:"Yellow"}},{title:"Test Scores Bell",story:"Test scores bell curve 70 avg, few low/high. Natural many small factors.",howItWorks:"Central limit theorem many small random errors create bell.",whereToSee:"Grade distribution",discussionQ:"Is bell always good?",whatIf:"If bell forced, hides teaching problem.",ethics:{benefits:"Normal expectation",harmed:"If bell forced via curve, unfair",missing:"Different learning needs",trafficLight:"Green"}},{title:"Game Scores Gap",story:"Game histogram gap at 50-60: nobody scores there, bug or level jump?",howItWorks:"Gap suggests barrier or bug in scoring.",whereToSee:"Game analytics",discussionQ:"What causes gap?",whatIf:"If gap is real difficulty spike, design fix needed.",ethics:{benefits:"Finds bug",harmed:"Players stuck at gap frustrated",missing:"Playtest feedback",trafficLight:"Green"}},{title:"Light Sensor Histogram",story:"Light sensor 0-255 values histogram: peak at 100 (classroom), small peak at 255 (window). Bimodal.",howItWorks:"micro:bit logs, histogram shows two light environments.",whereToSee:"micro:bit data log",discussionQ:"How to handle two environments?",whatIf:"If average only, you get 150 which is neither.",ethics:{benefits:"Shows environment diversity",harmed:"If averaged, window kids overlit",missing:"Blind students light irrelevant",trafficLight:"Green"}},{title:"Missing Bin Bias",story:"Histogram of books read hides 0 bin (kids who read 0). Chart starts at 1, looks everyone reads.",howItWorks:"Bin choice hides data, ethical choice must include zero.",whereToSee:"Library poster",discussionQ:"Is omitting 0 lying?",whatIf:"If 0 included, shows need for support.",ethics:{benefits:"Honest if includes 0",harmed:"0 readers shamed if highlighted",missing:"Why 0 — access or interest",trafficLight:"Red"}}],physicalComputing:{title:"X-Ray with Light Logger",wiring:"micro:bit logs light 0-255 for 2 minutes, moving around classroom. Plot histogram by hand tally 0-50,51-100 etc.",codePseudo:["every 500ms log light","store 100 values","on button: show histogram counts via bar on LED","export to paper tally"],noTech:"Tally chart of shoe sizes, build histogram with sticky notes",goal:"Build histogram physically, see shape"},communityData:{note:"Histograms pooled show diversity - single school bell, three schools bimodal maybe different contexts",schools:[{name:"Lincoln",rows:34,insight:"Screen time skewed right tail 6hr+"},{name:"Riverside",rows:33,insight:"Reading histogram bimodal: avid vs reluctant"},{name:"Your School",rows:33,insight:"Light histogram bimodal window vs interior"}]},ethicsLensWeekly:"Bin choices can hide or highlight groups. Starting histogram at 1 not 0 hides zero readers. Ethical visualization includes all, labels clearly.",lesson90Detailed:{prep15:["Print histograms examples","Sticky notes for histogram wall","micro:bit","Tally sheets 0-255 bins"],flow:[{phase:"Hook - X-Ray",time:"0-10m",goal:"Chart = X-ray",teacherScriptExact:"Doctor uses X-ray to see bone without cutting. Data needs X-ray to see groups without guessing. Today we X-ray numbers. What shape is class heights? Let's see, not guess.",studentAction:"Guess shape, then see real histogram",materials:"Heights data",checkUnderstanding:"Can they guess shape before seeing?",ifStuck:"Show skeleton X-ray, analogy."},{phase:"Build Histogram",time:"10-25m",goal:"Bins and bars touching",teacherScriptExact:"Histogram: numbers into buckets 0-10,10-20. Bars touch because numbers continuous. Bar chart categories separate. Count how many in each bucket, draw bar. That's it.",studentAction:"Build histogram from 20 heights using buckets",materials:"Buckets poster, counters",checkUnderstanding:"Bars touching? Bins correct?",ifStuck:"Use 5 buckets only first."},{phase:"Read Shape",time:"25-35m",goal:"Bell, skewed, bimodal",teacherScriptExact:"Three shapes: bell = many small random causes like test scores, skewed = barrier like can't be <0 screen time so tail right, bimodal camel two humps = two groups mixed like heights maybe. Shape tells story of cause.",studentAction:"Label 6 histograms as bell/skewed/bimodal/gap",materials:"Shape cards",checkUnderstanding:"Can label 4/6 correct?",ifStuck:"Use body: bell = one hill, skewed = slide, camel = two humps."},{phase:"Unplugged - Human Histogram",time:"35-60m",goal:"Embody",teacherScriptExact:"Tape number line floor 0-10 hours screen time. Students stand in bin where they are. See shape live. Is it skewed? Why tail? Discuss.",studentAction:"Stand in bins, see shape, move",materials:"Floor tape, labels",checkUnderstanding:"Can they see skew live?",ifStuck:"Use shoe size instead, easier."},{phase:"Physical Lab",time:"60-80m",goal:"Sensor histogram",teacherScriptExact:"Log light around room, 100 values. Tally into 0-50,51-100,101-150,151-200,201-255. Build histogram. Do you see two peaks window vs interior? That's bimodal telling two environments.",studentAction:"Log, tally, build histogram",materials:"micro:bit",checkUnderstanding:"Histogram built, shape named.",ifStuck:"Use 3 bins only."},{phase:"Exit Ethics",time:"80-90m",goal:"Bin ethics",teacherScriptExact:"If I start histogram at 1, I hide kids who read 0 books. That's lying with X-ray. Ethical X-ray shows all, even uncomfortable. Ticket: draw histogram of books, include 0 bin, label shape.",studentAction:"Exit ticket histogram",materials:"Paper",checkUnderstanding:"Includes 0, shape labeled.",ifStuck:"Provide bins labeled."}]},unpluggedActivityEnlarged:{roles:["Trainer: calls bin ranges","Model: holds data value","Tester: puts in correct bin","Recorder: builds bar with sticky notes"],materials:["Floor bins tape","Sticky notes","Data cards"],steps:["1. Lay 5 bins 0-10,10-20 etc","2. Model holds number 14","3. Trainer says bins","4. Tester walks to 10-20 bin","5. Recorder adds sticky note to wall histogram","6. Repeat 20 times","7. Step back, read shape: bell? skewed? camel?"],variations:{fast:"50 cards speed histogram",slow:"Discuss each placement why"},observes:["Do they place in correct bin inclusive/exclusive?","Do they see shape emerging?","Do they notice gaps?"],mistakes:["Bars not touching confusion with bar chart","Wrong bin boundaries","Ignoring zero bin"]},workbook:[{task:"Data 1,2,2,3,10 -> histogram 0-3,4-7,8-11 shape?",answer:"Bin 0-3 =4, 8-11=1 skewed right tail"},{task:"Why bars touching in histogram?",answer:"Numeric continuous, no gap between 10 and 11, unlike categories red vs blue separated."}]},{id:"W5",title:"Correlation vs Causation",tagline:"Ice cream does not cause drowning - rooster does not cause sunrise",mentalModel:"Rooster Sunrise",mentalEmoji:"\uD83D\uDC13",color:"#EA580C",teacherEmpowerment:{whatIsThisReally:"Correlation formalized 1880s by Francis Galton studying heredity, causation philosophy centuries older. Correlation = two things happen together, causation = one makes other happen. Ice cream sales and drowning both rise in summer (third cause = heat), but ice cream doesn't cause drowning. Rooster crows before sunrise, but doesn't cause sun. AI confuses them badly and can cause harm.",why7thGradersNeedThis:"Kids see TikTok 'this song makes you smarter' — correlation of listeners being smarter vs song causing smarts. Need to ask: is there third cause like richer kids have headphones? Rooster story memorable for life.",realWorldBehindTheScenes:"YouTube correlation study: People who watch conspiracy videos also watch cat videos late at night — not because cats cause conspiracies, but both caused by insomnia. If AI thinks cat causes conspiracy, it recommends conspiracy to cat lovers — harmful. Must test causation with experiments, not just correlation.",kidQuestionsAndAnswers:[{q:"Does correlation mean causation?",a:"No! Rooster crows before sunrise but doesn't cause sunrise. Need experiment to prove cause."},{q:"What is third cause?",a:"Hidden cause making both happen. Heat causes both ice cream and drowning. Sun causes both rooster crow and sunrise."},{q:"How to prove causation?",a:"Experiment: change one thing, keep others same, see if effect changes. Randomized trial."}],vocabForTeacher:[{term:"Correlation",teacherDef:"Statistical relationship where two variables move together.",kidDef:"Happen together",pronunciation:"kor-eh-LAY-shun",visualCue:"Two lines moving same"},{term:"Causation",teacherDef:"One variable directly produces effect in other.",kidDef:"Makes it happen",pronunciation:"caw-ZAY-shun",visualCue:"Domino push"},{term:"Confounder",teacherDef:"Third variable causing both observed variables.",kidDef:"Hidden puppeteer",pronunciation:"con-FOWN-der",visualCue:"Puppet strings"},{term:"Experiment",teacherDef:"Controlled test changing one variable to isolate cause.",kidDef:"Fair test",pronunciation:"ex-PAIR-ih-ment",visualCue:"Lab coat"}]},mentalModelDeep:{name:"Rooster Sunrise",teacherAnalogy:"Rooster crows every morning at 6am, sunrise at 6:05am. Correlation perfect: rooster crow and sunrise together 100% of days. Villagers think rooster causes sun. But sun causes both: light triggers rooster and also is sunrise. If you silence rooster, sun still rises. That's correlation without causation. Third cause = Earth's rotation.",studentAnalogy:"You wear lucky socks, team wins. Socks and win correlated, but socks don't cause win. Hard practice does, or weak opponent.",sketchSteps:["Draw rooster -> crow","Draw sun -> rise","Draw Earth spinning -> causes both rooster light + sun","Show arrow: Earth -> rooster, Earth -> sun, no arrow rooster->sun","Label: correlation line, not causation arrow"],commonWrongModel:{wrong:"Because they happen together, one causes other.",right:"Together can be coincidence or third cause. Need experiment removing one to see if other still happens."},bridgeQuestion:"If we ban ice cream, will drowning stop? Why no? What third cause?"},examplesBank:[{title:"Ice Cream & Drowning",story:"Data shows ice cream sales up, drowning up same months. News says ban ice cream!",howItWorks:"Heat causes both: hot -> more ice cream + more swimming + more drowning. Confounder = temperature/season.",whereToSee:"News headline",discussionQ:"Should we ban ice cream?",whatIf:"If we cool pools, drowning down even if ice cream same.",ethics:{benefits:"Find real cause heat, teach swim safety",harmed:"Ice cream shops blamed unfairly",missing:"Access to pools safety",trafficLight:"Yellow"}},{title:"Rooster & Sunrise",story:"Rooster crows before sunrise every day, 100% correlation.",howItWorks:"Earth rotation causes light, light triggers rooster crow and also is sunrise. Third cause Earth.",whereToSee:"Farm",discussionQ:"How prove rooster doesn't cause sun?",whatIf:"Remove rooster, sun still rises -> not cause.",ethics:{benefits:"Teaches not to blame rooster",harmed:"If we think rooster causes sun, we protect rooster not earth",missing:"Science of rotation",trafficLight:"Green"}},{title:"Sleep & Grades",story:"Kids who sleep more get higher grades correlation. Does sleep cause grades?",howItWorks:"Maybe, but confounder: stable home causes both good sleep and study support. Need experiment.",whereToSee:"School poster 'sleep more = A'",discussionQ:"Does more sleep = A?",whatIf:"If well-rested but no study, grades not up.",ethics:{benefits:"Promotes sleep",harmed:"If sleep blamed, ignores poverty/stress",missing:"Home stability",trafficLight:"Yellow"}},{title:"Game Time & Aggression",story:"Kids who play violent games show aggression correlation. News: games cause violence.",howItWorks:"Confounder: kids who are frustrated may both play more and be aggressive, or aggressive kids choose violent games. Causation not proven.",whereToSee:"News",discussionQ:"Do games cause aggression?",whatIf:"If less frustrated, less aggression even with games.",ethics:{benefits:"Discuss feelings",harmed:"Gamers stigmatized, games banned unfairly",missing:"Mental health support",trafficLight:"Red"}},{title:"Shoe Size & Reading",story:"Bigger shoe size kids read better! Should we give bigger shoes to improve reading?",howItWorks:"Age causes both: older = bigger feet + better reading. Third cause age.",whereToSee:"Funny stat",discussionQ:"Will bigger shoes make you read better?",whatIf:"Give small kid big shoes, reading not improve.",ethics:{benefits:"Funny teaches confounder",harmed:"If taken seriously, waste money on shoes",missing:"Age",trafficLight:"Green"}},{title:"YouTube Late Night & Conspiracy",story:"People watching at 2am watch more conspiracy videos correlation.",howItWorks:"Insomnia causes both late watch and conspiratorial thinking (tired brain). Not conspiracy causing late night.",whereToSee:"Recommendation",discussionQ:"Should YouTube recommend conspiracy at night?",whatIf:"If YouTube thinks cat videos cause conspiracy (both late night), recommends conspiracy to cat lovers -> harm.",ethics:{benefits:"Understand algorithm harm",harmed:"Cat lovers get radicalized if correlation mistaken",missing:"Sleep health",trafficLight:"Red"}}],physicalComputing:{title:"Rooster Test - Experiment",wiring:"No micro:bit needed, but log rooster: button A = rooster crows, light sensor = sunrise brightness. See if sunrise without crow still happens (cover speaker).",codePseudo:["log light sunrise","log button crow","show correlation but experiment: mute crow (no press) still sunrise?","conclusion: no causation"],noTech:"Ice cream vs drowning months chart, find third cause heat",goal:"Design experiment to disprove causation"},communityData:{note:"Correlation differs by school context - pool needs diverse sample",schools:[{name:"Lincoln",rows:34,insight:"Sleep & grades r=0.4 but home stability confounder"},{name:"Riverside",rows:33,insight:"Game time & aggression r=0.2 weak, frustration confounder"},{name:"Your School",rows:33,insight:"Shoe size & reading r=0.7 but age confounder strong"}]},ethicsLensWeekly:"Mistaking correlation for causation can blame innocent (ice cream, games, roosters) and miss real cause (heat, frustration, Earth). Harmful.",lesson90Detailed:{prep15:["Rooster sunrise diagram","Ice cream/drowning chart months","Correlation cards","Experiment design sheet"],flow:[{phase:"Hook - Rooster Story",time:"0-10m",goal:"Feel correlation vs causation",teacherScriptExact:"Village thinks rooster causes sunrise because crow then sun every day. They protect rooster to get sun. One day rooster sick, no crow, sun still rises! Village learns correlation not causation. Today we find roosters in data.",studentAction:"Tell rooster story, predict what happens if no rooster",materials:"Rooster puppet",checkUnderstanding:"Can they say sun still rises? Green.",ifStuck:"Act out: one student rooster, one sun, one Earth."},{phase:"Ice Cream vs Drowning",time:"10-20m",goal:"Third cause",teacherScriptExact:"Chart: ice cream sales up, drowning up same months. Should we ban ice cream? No, third cause heat makes both. Heat = hidden puppeteer pulling two strings. Always ask: what third thing causes both?",studentAction:"Find third cause for 3 examples",materials:"Charts",checkUnderstanding:"Can name heat as third cause?",ifStuck:"Ask: what happens in summer besides ice cream and swimming? Heat."},{phase:"Correlation Strength",time:"20-35m",goal:"Strong vs weak correlation",teacherScriptExact:"Correlation 0 to 1: 1 = perfect together like rooster and sunrise time, 0 = no link like shoe color and math grade. But even 1 does NOT mean causation. Need experiment.",studentAction:"Rate correlation strength 0-1 for examples",materials:"Line 0-1",checkUnderstanding:"Shoe size reading strong but not causation.",ifStuck:"Use arm distance: close = strong."},{phase:"Unplugged - Experiment Design",time:"35-60m",goal:"Prove causation needs experiment",teacherScriptExact:"To prove cause, you must change one thing and keep rest same. Want to prove sleep causes grades? Take 2 groups same, one sleeps 8hr one 5hr, compare grades. That's experiment. Correlation alone never proves.",studentAction:"Design experiment for sleep->grades, write steps",materials:"Experiment sheet",checkUnderstanding:"Includes control group?",ifStuck:"Give template: Group A ___, Group B ___, keep same ___."},{phase:"Physical + Data",time:"60-80m",goal:"Test rooster",teacherScriptExact:"Log light sunrise without pressing rooster button. Does sun still rise? Yes, so rooster not cause. Same with ice cream: if we ban ice cream but keep heat, drowning still up, so ice cream not cause. Data needs experiments, not just charts.",studentAction:"Run no-rooster test, chart",materials:"micro:bit optional, paper chart",checkUnderstanding:"Concludes no causation via experiment.",ifStuck:"Do thought experiment only."},{phase:"Exit Ethics",time:"80-90m",goal:"Harm of false causation",teacherScriptExact:"If news says games cause violence because correlated, games banned, gamers blamed, real cause frustration ignored, harm. Our job as data detectives: don't blame rooster. Ticket: example where correlation mistaken causes harm and better explanation.",studentAction:"Exit ticket with harm analysis",materials:"Tickets",checkUnderstanding:"Shows harm of misattribution.",ifStuck:"Starter: 'Blaming ___ for ___ harms ___ because real cause is ___'."}]},unpluggedActivityEnlarged:{roles:["Trainer: tells correlation story","Model: acts variable A","Tester: acts variable B","Recorder: finds third cause C"],materials:["Story cards","String puppets","Experiment sheet"],steps:["1. Trainer: 'Ice cream sales up, drowning up'","2. Model = ice cream, Tester = drowning stand together","3. Recorder asks: what pulls both?","4. Find Heat = puppeteer with two strings","5. Show if remove ice cream (Model sits) drowning still stands if heat present","6. Design experiment: remove heat (cool pools) drowning down","7. Repeat with rooster/sun/Earth"],variations:{fast:"3 stories quickly, find confounders",slow:"One story deep experiment design"},observes:["Do they jump to causation?","Can they find third cause?","Do they design fair experiment?"],mistakes:["Saying correlation proves causation","Forgetting control group","Blaming innocent variable"]},workbook:[{task:"Shoe size & reading r=0.8 strong correlation, causation?",answer:"No, age confounder. Bigger shoes don't make better reader."},{task:"Design experiment: Does music cause better focus?",answer:"Group A music, Group B no music, same task, random assign, compare focus."}]},{id:"W6",title:"PROJECT 1 School Data Audit",tagline:"Audit is Detective Work - 100 rows, clean, visualize, find pattern",mentalModel:"Detective Work",mentalEmoji:"\uD83D\uDD75️",color:"#EA580C",teacherEmpowerment:{whatIsThisReally:"Data audit practice from 1990s corporate data quality movement, now essential for AI fairness audits. Audit = systematic check of 100 rows for errors, biases, missing, outliers, then clean, visualize, find surprising pattern. Detective work: look for clues, not just numbers. Real audits uncovered bias in hiring AI, healthcare AI. Students do same for school.",why7thGradersNeedThis:"They become detectives of their own school — not just users of data but auditors who find surprising patterns adults missed, like 'morning classes have more missing homework' or 'shared devices cause duplicates'. Gives agency and purpose.",realWorldBehindTheScenes:"School district audit: 1000 rows attendance, found 15% duplicates from shared Chromebooks, 20% date format mix causing absences miscounted, histogram showed bimodal engagement (morning vs afternoon). Fixed cleaning, improved attendance tracking, helped counselors see pattern.",kidQuestionsAndAnswers:[{q:"What is audit?",a:"Detective check: look at 100 rows, find what's dirty, clean, visualize, find surprising pattern, report."},{q:"Why 100 rows?",a:"Enough to see patterns, small enough to do by hand. Real auditors sample 100 from millions."},{q:"What if we find something uncomfortable?",a:"Good detective reports truth respectfully, suggests fix, protects privacy (counts not names)."}],vocabForTeacher:[{term:"Audit",teacherDef:"Systematic examination of data quality and bias.",kidDef:"Detective check",pronunciation:"AW-dit",visualCue:"Magnifying glass"},{term:"Sample Size",teacherDef:"Number of rows examined, affects confidence.",kidDef:"How many clues you checked",pronunciation:"SAM-pel",visualCue:"Stack of papers"},{term:"Anonymized",teacherDef:"Removed identifying info, kept counts.",kidDef:"No names, just numbers",pronunciation:"ah-NON-ih-mized",visualCue:"Mask"},{term:"Insight",teacherDef:"Non-obvious pattern with implication.",kidDef:"Surprising clue",pronunciation:"IN-site",visualCue:"Lightbulb"}]},mentalModelDeep:{nam  truancy letters wrong.",howItWorks:"Standardize dates, histogram of absences by month before/after cleaning differs.",whereToSee:"Attendance office",discussionQ:"Who is harmed by date mix?",whatIf:"If not fixed, families get false truancy.",ethics:{benefits:"Accurate letters",harmed:"Families false accused",missing:"Cultural date formats",trafficLight:"Red"}},{title:"Light Bimodal Discovery",story:"Audit light sensor 100 logs, histogram bimodal: 40% dark corner, 60% bright window. Surprise: dark corner kids less engaged?",howItWorks:"Two peaks correlate with engagement survey (correlation not causation, confounder maybe seating choice).",whereToSee:"Classroom",discussionQ:"Does dark cause less engagement?",whatIf:"If dark is chosen by shy kids, causation reversed.",ethics:{benefits:"Improve lighting",harmed:"Dark corner kids labeled",missing:"Choice vs assigned seats",trafficLight:"Yellow"}},{title:"Favorite Sport Mode vs Mean",story:"Favorite sport mode = soccer, but mean not applicable categorical. Audit shows bar chart not histogram needed.",howItWorks:"Use correct visualization for categorical vs numeric.",whereToSee:"Survey",discussionQ:"Can we average favorite sport?",whatIf:"If we average jersey numbers, nonsense.",ethics:{benefits:"Correct chart",harmed:"If wrong chart, misinforms",missing:"Sports not offered",trafficLight:"Green"}},{title:"Screen Time Correlation Insight",story:"Screen time vs sleep correlation -0.5 moderate negative. Audit finds confounder: homework load causes both less sleep and more screen (procrastination).",howItWorks:"Experiment needed, not just correlation.",whereToSee:"Wellness report",discussionQ:"Should we limit screen to improve sleep?",whatIf:"If limit screen but homework load same, sleep still low.",ethics:{benefits:"Focus on homework load not blame screen",harmed:"Screen blamed unfairly",missing:"Stress",trafficLight:"Yellow"}}],physicalComputing:{title:"Detective Audit Kit",wiring:"micro:bit logs 100 light readings around s
