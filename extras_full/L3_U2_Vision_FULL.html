earns 'R high + G low + B low = probably red object'. We have qualia, AI has statistics."},{q:"Why does my photo look bad when zoomed?",a:"You're seeing individual tiles of the mosaic! Each tile is one color. Zoom = bigger tiles, fewer tiles. AI struggles same way - low resolution = less information."},{q:"Can AI see better than humans?",a:"In some ways yes: can see 6M pixels at once, infrared, detect tiny changes. In other ways no: easily fooled by one pixel change (adversarial), no context understanding."}],vocab:[{term:"Pixel",def:"Picture Element = smallest square of color. Has 1 number (grayscale) or 3 numbers (RGB).",visual:"\uD83D\uDD32 zoomed screenshot showing squares"},{term:"Resolution",def:"Count of pixels: Width x Height. More pixels = sharper mosaic.",visual:"\uD83D\uDCF1 144p vs 4K side-by-side"},{term:"Channel",def:"Layer of color numbers. RGB = 3 channels. Depth = extra channel.",visual:"\uD83C\uDFA8 R layer + G layer + B layer = full color"},{term:"Grayscale",def:"1 channel, 0=black, 255=white. Simpler for AI to start.",visual:"⚫◐⚪ gradient bar 0-255"}]},mentalModelDeep:{teacherAnalogy:"Mosaic Masterpiece (Byzantine): Each tessera (pixel) is individually meaningless colored stone. Only from distance does image emerge. Artist chooses tesserae placement based on overall pattern. Similarly, CNN doesn't look at whole image first - aggregates local tesserae into meaning. Explain that Roman mosaics used ~10k tesserae/m²; modern phone uses 12M pixels. The key teaching: local numbers -> global meaning.",studentAnalogy:"Think of your Instagram photo as a LEGO mosaic board. Each stud is one pixel. You tell a friend the color number for each stud (like 'stud A1 = blue 34'). They rebuild it without seeing original. That's how AI gets images - just a long list of color numbers.",sketchSteps:["Draw 10x10 grid in notebook (30 sec)","Pick simple emoji (heart)","Color each cell: fill = 255 black, empty = 0 white","Write numbers under grid row by row","Trade with partner - can they rebuild from numbers only?"],wrongVsRight:{wrong:"AI sees like human eyes with lenses and brain instantly understanding",right:"AI receives spreadsheet of numbers and learns patterns in numbers that correlate with objects"},bridgeQuestion:"If I change ONE pixel's number from 0 to 255 in your heart mosaic, will your partner still recognize it as heart? What about 20 pixels? When does AI break?"},examplesBank:[{title:"Night Mode Photo Fail",story:"Aisha takes photo of blackboard at night, text unreadable. Phone AI brightens but makes it grainy.",howItWorks:"Low light = sensor gets few photons -> numbers noisy (random 20-40 instead of 5). AI multiplies numbers to brighten but also multiplies noise.",whereToSee:"Any phone night mode",discussionQ:"Should AI invent pixels it didn't see to make pretty photo?",whatIf:"What if AI hallucinates text that wasn't there?",ethics:{benefits:"Helps see in dark, safety",harmed:"Fake evidence in low-light",missing:"Dark-skinned faces often under-exposed in training",trafficLight:"Yellow",mitigation:"Show original vs enhanced badge"}},{title:"Minecraft Skin = Pixel Art",story:"Grade 8 student makes Minecraft skin, 64x64 pixels, each pixel = armor color.",howItWorks:"Same as AI input! 64x64x4 (RGBA). Game engine reads numbers exactly like vision model.",whereToSee:"Minecraft, Roblox avatars",discussionQ:"Why do game skins look blocky but photos don't?",whatIf:"AI trained only on Minecraft skins tries to recognize humans?",ethics:{benefits:"Low-res creativity accessible",harmed:"None",missing:"Bias toward blocky aesthetics",trafficLight:"Green",mitigation:"Use diverse art styles"}},{title:"QR Code is Pixels for Machines",story:"Canteen QR menu, black/white squares",howItWorks:"QR is 29x29 pixel image where 0=white, 1=black, with error correction numbers.",whereToSee:"Payments, tickets",discussionQ:"Why can phone read QR from far but not your handwriting?",whatIf:"Someone sticks fake QR over real?",ethics:{benefits:"Contactless, accessible",harmed:"QR phishing - sticker overlay scams",missing:"Blind users can't verify QR",trafficLight:"Yellow",mitigation:"Add human-readable URL nearby"}},{title:"Satellite Maps Zoom",story:"Google Maps satellite view of school, each pixel = 30cm ground",howItWorks:"Satellite sensor measures reflected light per 30cm square -> number. AI counts cars by grouping similar numbers.",whereToSee:"Maps, disaster response",discussionQ:"Should anyone be able to see your backyard pixels?",whatIf:"Higher resolution = 5cm, sees faces?",ethics:{benefits:"Disaster mapping, farming",harmed:"Privacy invasion, military misuse",missing:"Consent of people photographed",trafficLight:"Red",mitigation:"Blur faces, require warrant for <50cm"}},{title:"Face Filters Misalign",story:"Snapchat dog filter slips off when moving fast",howItWorks:"Filter needs pixel locations of nose/eyes each frame. Fast motion = blurry numbers -> landmark detector fails.",whereToSee:"TikTok, Snapchat",discussionQ:"Why does filter work better on light skin in dim room?",whatIf:"Filter used for hiring video interview scoring?",ethics:{benefits:"Fun, creative expression",harmed:"Beauty standards, skin lightening filters",missing:"Training data mostly light skin",trafficLight:"Red",mitigation:"Test on Fitzpatrick scale, disclose filter use"}},{title:"Old Family Photo Colorized",story:"AI colorizes 1960s grandma photo, makes skin too orange",howItWorks:"Grayscale = 1 number/pixel. Colorization AI guesses 3 numbers from 1, learned from modern photos where lighting is different.",whereToSee:"MyHeritage, Photoshop",discussionQ:"Is colorized photo true?",whatIf:"Historical archive all colorized with modern bias?",ethics:{benefits:"Engages youth with history",harmed:"Falsifies history, erases film aesthetic",missing:"Original context",trafficLight:"Yellow",mitigation:"Always keep original, label AI colorized"}}],physicalComputing:{title:"Pixel Mosaic Board - Colored Sticker Grid",materials:["10x10 grid paper (A3)","3 colors stickers: Red Yellow Blue (100 each)","Number cards 0-255","micro:bit + 5x5 LED matrix"],steps:["Teacher projects 8x8 emoji, students copy with stickers: 1 sticker = 1 pixel","Flip stickers, write numbers on back: 0=white, 1=color","Peer decoding: Partner rebuilds from number list only","micro:bit: Show 5x5 heart using led.plot(x,y) - each LED = pixel","Challenge: Create 5x5 school logo, exchange code"],wiring:"micro:bit USB -> laptop. No extra wiring. LED matrix is built-in. For larger: connect 8x8 NeoPixel matrix to P0, GND, 3V. Data In -> P0.",microbit:"basic.showLeds(` . # . # . ...` ) // heart. Loop: for x 0-4 for y 0-4 led.plot brightness = pixelValue/51",teacherOnly:"Answer: 8-bit = 256 levels. 24-bit color = 16.7M colors. Compression: JPEG discards high-freq pixel changes humans less notice."},communityData:{desc:"W7 Pool: Collect 20 low-light vs bright photos of same object",pool:"20 images/student x 15 students = 300 lighting variations",accuracy:"Classification accuracy 58% (mixed lighting) -> 81% after adding diverse lighting",privacy:"Anonymized: crop faces, only objects, local storage"},ethicsLensWeekly:{benefits:"Demystifies AI vision",harmed:"Students may think more pixels always better -> e-waste",missing:"Energy cost of high-res images",trafficLight:"Green",mitigation:"Discuss efficient resolution",scenario:"School installs 4K cameras everywhere to 'see better' - is more pixels more safety or more surveillance?"},lesson90:{prep:["Print 30x 10x10 grids","Buy dot stickers (3000)","Preload micro:bit MakeCode","Prepare 8x8 emoji slides","Charge micro:bits"],flow:[{phase:"Hook",time:"0-10",goal:"Aha! Images are numbers",script:"I have magic. I will send image WITHOUT showing it. *Reads numbers: 0 0 255 0...* Draw what you hear. Ready? ... What did you get? Yes - it's a pixel mosaic! Every photo on your phone is just a list of numbers. AI never sees photos - it reads numbers. Today you become the AI.",studentAction:"Draw 5x5 from teacher dictating numbers, guess shape",materials:"Grid paper",checkUnderstanding:"Green: Students can tell pixel count = grid size",ifStuck:"Orange: Show physical mosaic vs photo side-by-side, slow dictation"},{phase:"Direct",time:"10-25",goal:"Pixel anatomy + history",script:"1960 Russell Kirsch scanned first image - 176x176 numbers. Your phone - 12 million numbers. Each number 0-255 brightness. Color = 3 numbers: Red, Green, Blue. Demo: Photoshop eyedropper shows RGB. *Show grayscale 0-255 gradient*. Why 0-255? 8 bits, 2^8=256. This is how Snapchat filter finds your nose - it looks for pattern of numbers that is nose-shaped.",studentAction:"Use color picker on laptop, record RGB of 5 objects",materials:"Laptops, color picker site",checkUnderstanding:"Green: Can explain why zoom shows squares",ifStuck:"Orange: Physical analogy - paint by numbers"},{phase:"Mental Model",time:"25-40",goal:"Mosaic mastery",script:"Roman mosaic artists used tiny stones - tesserae. From far, you see emperor. Up close, just stones. AI is same - close up looks at 3x3 pixel patches, far aggregates. Your task: build school logo mosaic. But rule - you must write number code on back so someone else can rebuild. That's exactly what AI training data is - millions of mosaic codes with labels.",studentAction:"Build 10x10 mosaic with stickers, write code",materials:"Stickers, grids",checkUnderstanding:"Green: Code matches sticker pattern",ifStuck:"Orange: Start with 5x5, partner helps"},{phase:"Hands-On",time:"40-60",goal:"micro:bit pixels",script:"micro:bit has 5x5 pixel display. Each LED = pixel you can turn on/off. Let's code heart. *Live code led.plot*. Brightness is number 0-255 but micro:bit only 0-9, so we divide. Your mission: code your initials in pixels. Bonus: animate - make heart beat by changing brightness.",studentAction:"MakeCode: 5x5 initials, upload",materials:"micro:bits, USB",checkUnderstanding:"Green: LED pattern matches design",ifStuck:"Orange: Use showLeds block, copy example"},{phase:"Ethics",time:"60-75",goal:"Pixel bias",script:"Show two photos: same classroom, one overexposed window, one dark corner. Ask: which pixels are easiest for AI to read? AI trained mostly on bright well-lit photos from California. So when it sees dark skin or dark room, numbers are low (10-30) vs bright (200). It fails. This is why night mode and face unlock work worse for some. We call this data bias - mosaic missing dark tiles.",studentAction:"Audit: take photo of same object in 3 lightings, test Teachable Machine",materials:"Phones, Teachable Machine",checkUnderstanding:"Green: Can name one lighting bias impact",ifStuck:"Orange: Show Buolamwini video clip 2min"},{phase:"Wrap",time:"75-90",goal:"Workbook + exit ticket",script:"In workbook: draw 8x8 grid, encode letter 'A' as numbers, trade. Exit ticket: If image is 100x100 RGB, how many numbers total? Answer: 100*100*3=30,000. Tomorrow we use cookie cutters to find edges in these numbers.",studentAction:"Workbook p7, exit ticket",materials:"Workbook",checkUnderstanding:"Green: Calculates pixel count",ifStuck:"Orange: Formula on board: W*H*C"}]},unplugged:{name:"Human Pixel Printer",roles:["Scanner (reads color)","Encoder (shouts numbers)","Transmitter (whispers)","Decoder (draws)","Checker (verifies)"],steps:["Scanner looks at 6x6 image card behind screen","Encoder converts each cell to 0/1 and shouts row by row","Transmitter can only whisper one number at a time and may 'lose' one (simulates compression)","Decoder draws on grid from whispers","Checker compares original vs decoded, calculates accuracy = matching cells / 36","Rotate roles, try with 10x10","Discuss: what if we skip every 2nd pixel? (downsampling)"],variations:["Color: 0-3 instead of 0/1","Noisy channel: Transmitter randomly flips one number","Compression: Only transmit changing pixels"],mistakes:["Forgetting row order - need protocol","Encoder skips - need acknowledgment","Decoder assumes - must ask clarification"]},workbook:{tasks:[{q:"Draw 8x8 smiley, encode as 0/1 list",type:"draw"},{q:"How many numbers in 1920x1080 RGB image? Show calc",type:"calc",answer:"6,220,800"},{q:"Why does grayscale make AI faster? (1 number vs 3)",type:"explain",answer:"3x less data, 3x less compute"},{q:"Audit your phone: take same selfie in 3 lights, does filter work equally? Log",type:"audit"}],rubric:["Accurate grid encoding 4/4","Calculates pixel math","Names one lighting bias","micro:bit pixel art uploads"]}},{id:"W8",num:8,title:"Convolutional Filters - Edge Detection",tagline:"Filter is cookie cutter finding edges",mentalModel:"Cookie Cutter",mentalEmoji:"\uD83C\uDF6A",color:"from-cyan-500 to-blue-500",teacherEmpowerment:{whatIsThisReally:"Convolution = sliding tiny number grid (3x3 filter) over big pixel grid, multiply+add at each position. This detects patterns: edges, corners, textures. LeCun invented CNNs in 1989 for zip code reading. Filter example: [[-1,-1,-1],[-1,8,-1],[-1,-1,-1]] finds edges because flat areas sum ~0, edges sum high. AI learns 100s of such cookie cutters automatically.",whyNeed:"This is the 'how AI actually sees' magic. Without it, AI would need to memorize every pixel position (cat in corner vs center = different). Convolution gives translation invariance - cookie cutter finds edge anywhere. Builds intuition for why AI needs less data than naive memorization.",realWorld:["iPhone portrait mode: edge filter finds hair outline to blur background","Tesla: lane detection uses horizontal edge filters","Instagram Sharpen filter = edge filter","Medical: tumor edge detection"],history:[{year:"1989",event:"LeNet - LeCun",detail:"First CNN, 3x3 convolutions to read handwritten digits, Bell Labs"},{year:"2012",event:"AlexNet wins ImageNet",detail:"8 layers, 60M params, filters learned cat eyes, wheels automatically"},{year:"2015",event:"VGG shows depth",detail:"Stacking many 3x3 filters > one big filter - like many small cookie cutters"},{year:"2017",event:"Filters visualized",detail:"First layer = edges, second = textures, third = parts - hierarchy"}],kidQuestions:[{q:"Are filters like Instagram filters?",a:"Exactly! Instagram's 'Sharpen' IS an edge filter - same math. But AI's filters are learned, not hand-made. It invents its own Instagram filters to find cats."},{q:"How many cookie cutters does AI have?",a:"AlexNet first layer: 96 cutters. Modern: 512+. Each looks for different pattern - vertical edge, diagonal, orange blob, eye shape. Deeper layers combine them: eye + nose + fur = cat."},{q:"Why 3x3 small? Why not big cookie cutter?",a:"Small = efficient, can be stacked to see big area. 3x3 sees local, three 3x3 stacked sees 7x7 but with fewer numbers to learn. Like building with small LEGO vs one big mold."}],vocab:[{term:"Filter / Kernel",def:"Tiny 3x3 number grid that slides over image, cookie cutter pattern detector",visual:"\uD83C\uDF6A 3x3 grid overlapping large grid"},{term:"Convolution",def:"Slide + multiply + add operation. Output = where pattern matched strongly.",visual:"➡️ sliding animation"},{term:"Edge",def:"Sudden change in pixel numbers: 0->255. Filter finds these jumps.",visual:"◼️◼️◻️◻️ sharp boundary"},{term:"Feature Map",def:"Result after filter: bright where edge found, dark elsewhere. New image of features.",visual:"\uD83D\uDDFA️ heatmap of edges"}]},mentalModelDeep:{teacherAnalogy:"Cookie Cutter Factory: You have dough = image. You have 100 cutters = filters (star, heart, circle). You press each cutter everywhere on dough, you get pile of star-shaped pieces where stars matched dough bumps. Feature map = collection of where that cutter found matches. Next layer: you look at pile of shapes and use bigger cutters: 'if star above heart = person'. Hierarchy.",studentAnalogy:"You have highlighters that only highlight vertical lines. You slide highlighter across notebook page - wherever there's vertical pencil line, it glows. That's filter. Another highlighter only highlights horizontal. AI has many highlighters.",sketchSteps:["Draw 6x6 pixel grid with simple shape (L shape: left column and bottom row = 1)","Take filter 3x3: [-1 -1 -1; -1 8 -1; -1 -1 -1] (edge)","Place filter over top-left 3x3, calculate: sum(filter*grid)","Slide one right, recalculate, write result in new 4x4 grid","See: where L edge was, result high (5-8), flat area ~0"],wrongVsRight:{wrong:"Filter looks at whole image at once like human",right:"Filter looks at tiny 3x3 patch at a time, slides everywhere, builds map of matches"},bridgeQuestion:"If filter is vertical edge detector, what will feature map look like for image of vertical fence vs horizontal fence?"},examplesBank:[{title:"Phone Blur Background",story:"Portrait mode blurs background but keeps hair sharp - sometimes cuts ear",howItWorks:"Edge filter finds person boundary, depth sensor verifies. If edge weak (hair same color as background), filter fails -> blur leaks.",whereToSee:"iPhone/Android portrait",discussionQ:"Should phone show where it thinks edge is?",whatIf:"Edge detector used to crop ID photo automatically but cuts hijab?",ethics:{benefits:"Pro photography accessible",harmed:"Beauty bias, hijab cropping",missing:"Diverse hair textures in training",trafficLight:"Yellow",mitigation:"User can adjust edge mask"}},{title:"Self-Driving Lane Lines",story:"Tesla follows lane lines using edge detection",howItWorks:"Horizontal filter finds white paint edges, Hough transform connects into lines, AI predicts lane.",whereToSee:"Autopilot, Comma AI",discussionQ:"What if lane paint faded?",whatIf:"Road has tar snakes that look like lines?",ethics:{benefits:"Reduce accidents",harmed:"Fails in snow, harms those regions",missing:"Non-standard roads in Global South",trafficLight:"Red",mitigation:"HD maps + human fallback"}},{title:"Document Scanner Edge",story:"CamScanner finds document edges to crop",howItWorks:"Finds quadrilateral of strong edges, warps to rectangle",whereToSee:"Adobe Scan, CamScanner",discussionQ:"Convenient but what privacy?",whatIf:"Scans other papers on desk accidentally?",ethics:{benefits:"Paperless",harmed:"Uploads docs to cloud without consent",missing:"Privacy warning",trafficLight:"Yellow",mitigation:"On-device processing"}},{title:"Face Filter Glasses",story:"Glasses filter sticks to eyes",howItWorks:"Eye corner is strong edge + dark pixel pattern, filter finds it",whereToSee:"Snapchat",discussionQ:"Why filter jumps?",whatIf:"Used to track gaze for ads?",ethics:{benefits:"Fun",harmed:"Gaze tracking privacy",missing:"Consent",trafficLight:"Yellow",mitigation:"Local processing only"}},{title:"Medical X-Ray Edge",story:"AI highlights lung nodule edges",howItWorks:"Edge filter enhanced to find circular edges abnormal",whereToSee:"Radiology AI",discussionQ:"Should doctor trust AI edge?",whatIf:"AI misses edge because image noisy?",ethics:{benefits:"Early detection",harmed:"False negative fatal",missing:"Diverse body types",trafficLight:"Red",mitigation:"AI as second reader only"}},{title:"Captcha 'Select Traffic Lights'",story:"You click traffic lights to prove human",howItWorks:"You're labeling data for edge filters to learn traffic light shapes!",whereToSee:"reCAPTCHA",discussionQ:"Are we free workers for AI?",whatIf:"AI now better than humans at captcha?",ethics:{benefits:"Trains safer self-driving",harmed:"Unpaid labor",missing:"Informed consent",trafficLight:"Yellow",mitigation:"Pay or disclose"}}],physicalComputing:{title:"Cookie Cutter Edge Filter with Paper & Torch",materials:["Transparent 3x3 filter cards (acetate) with numbers","Large pixel grid posters","Flashlight","micro:bit + light sensor"],steps:["Make filter: card with holes, weights: center +8, surround -1","Shine torch through filter onto pixel poster, shadow intensity = convolution","Move filter across poster, students record brightness in new grid (feature map)","micro:bit: Use light sensor to read brightness of each cell, auto-calculate edge","Compare: vertical filter vs horizontal - which glows on which edges?"],wiring:"micro:bit P0 -> LDR + 10k resistor voltage divider. LDR to 3V, resistor to GND, junction to P0. Read analog.",microbit:"forever: light = pins.analogReadPin(P0); if light>600 led.plot brightest edge",teacherOnly:"Math: Conv = sum(I*K). Padding: add zeros border so output same size. Stride 1 = slide 1 each time. Teacher demo with Excel."},communityData:{desc:"W8: Collect edge images - 10 vertical, 10 horizontal per student",pool:"600 edge patches, train simple 3x3 filter",accuracy:"Manual filter 68% edge type accuracy -> learned filter 92%",privacy:"Only edges, no identifiable objects"},ethicsLensWeekly:{benefits:"Makes CNN concrete",harmed:"Edge filters can be used for surveillance (person silhouette)",missing:"Dual use",trafficLight:"Yellow",mitigation:"Discuss responsible use",scenario:"Mall uses edge detection to count people without consent - helpful for safety or privacy violation?"},lesson90:{prep:["Cut 30 acetate 3x3 filters","Print 30 large pixel posters (L shape, fence)","Flashlights 15","LDR sensors","MakeCode with analog read"],flow:[{phase:"Hook",time:"0-10",goal:"Recall pixels + need filters",script:"Last week we saw image = 6 million numbers. If AI had to memorize every possible cat position - 6M!* cat? Impossible. Real AI uses trick: tiny cookie cutter that slides. Today you ARE the cookie cutter. Who likes cookies? This cutter only likes vertical lines.",studentAction:"Quick recall: how many numbers in 10x10 RGB?",materials:"Slide",checkUnderstanding:"Green: Calculates 300",ifStuck:"Orange: W*H*3 formula on board"},{phase:"Direct",time:"10-25",goal:"Convolution math",script:"Look: image 6x6, filter 3x3 numbers. Put filter on top-left, multiply overlapping numbers, add up. That's convolution. Flat area: 0* -1 +0* -1 etc = 0. Edge: sudden jump 0 to 255 => high sum. So output bright where edge. *Live demo with numbers on board*. Why -1 and 8? 8*center - sum(surround) = how different center is from neighbors.",studentAction:"Calculate one position manually",materials:"Worksheet with grids",checkUnderstanding:"Green: Computes sum correctly",ifStuck:"Orange: Do 2x2 filter first"},{phase:"Mental Model",time:"25-40",goal:"Cookie cutter physical",script:"Take acetate filter card. Place on poster L shape. Shine torch. Brightness = result. Move. Record in feature map grid. You will see: vertical filter lights up vertical part of L only. Horizontal lights horizontal only. That's how AI knows orientation! Now we have two feature maps - brain combines them.",studentAction:"Slide filter, record 4x4 feature map",materials:"Acetate, posters, torch",checkUnderstanding:"Green: Feature map shows high where matching orientation",ifStuck:"Orange: Teacher guides one row together"},{phase:"Hands-On",time:"40-60",goal:"micro:bit edge sensor",script:"micro:bit can sense light. We'll make automatic edge detector. LDR measures brightness of pixel under it. Code reads analog. If reading jumps between two cells > threshold, we found edge! Let's code: read P0, compare previous, if diff >100, plot dot.",studentAction:"Wire LDR, code threshold",materials:"micro:bit, LDR, resistor",checkUnderstanding:"Green: micro:bit beeps/plots on edge",ifStuck:"Orange: Use pre-wired board, focus on code"},{phase:"Ethics",time:"60-75",goal:"Dual use edges",script:"Edge filters find people silhouettes - malls count customers. Useful? Yes. But also can track you without consent. And remember: if training data mostly has sharp images, edge filter fails on blurry images from cheap phones - again bias. Show: portrait blur fails on curly hair because edge weak. Who is harmed?",studentAction:"Debate: Should edge-based people counting need consent sign?",materials:"Case cards",checkUnderstanding:"Green: Names one harm + benefit",ifStuck:"Orange: Prompt with mall scenario"},{phase:"Wrap",time:"75-90",goal:"Workbook filter design",script:"Workbook: design your own 3x3 filter. What numbers would find diagonal edge? *Hint: -1 -1 2; -1 2 -1; 2 -1 -1*. Test on paper. Exit: Why is 3x3 better than 100x100 filter? Answer: fewer numbers to learn, works anywhere.",studentAction:"Design filter, exit ticket",materials:"Workbook",checkUnderstanding:"Green: Explains translation invariance",ifStuck:"Orange: Show stacking small filters = big receptive field"}]},unplugged:{name:"Human Convolution Line",roles:["Image Row (6 students holding 0/1 cards)","Filter (3 students holding -1, -1, 8 cards)","Calculator (multiplies)","Adder","Feature Map Writer"],steps:["Image Row stands: e.g., 0 0 1 1 0 0","Filter students stand in front of first 3 Image students","Calculator: each pair multiplies and shouts product","Adder sums products, shouts result","Writer writes result on board","Filter team steps one to right, repeat","After full slide, see feature map peaks at edge 0->1"],variations:["Vertical vs horizontal: rotate","Blur filter: [1 1 1;1 1 1;1 1 1]/9 - averaging","Sharpen: combine"],mistakes:["Forgetting to slide - staying in place","Adding before multiplying","Not resetting for each position"]},workbook:{tasks:[{q:"Compute convolution: image [[0,0,1],[0,1,1],[0,0,1]] filter [[-1,0,1],[-1,0,1],[-1,0,1]] at center",type:"calc",answer:"Detects vertical edge, sum ~3"},{q:"Why does AI need many filters not one?",type:"explain",answer:"One filter finds one pattern, need many for all patterns"},{q:"Draw feature map for L shape with vertical filter",type:"draw"},{q:"Audit: test portrait blur on 3 hair types, log failures",type:"audit"}],rubric:["Correct manual convolution","Explains multiple filters","Feature map accurate","Names bias in edge detection"]}},{id:"W9",num:9,title:"Object Detection - Bounding Boxes + Labels",tagline:"AI puts stickers around objects",mentalModel:"Sticker Finder",mentalEmoji:"\uD83C\uDFF7️",color:"from-blue-600 to-cyan-500",teacherEmpowerment:{whatIsThisReally:"Object detection = classification + localization. Output: list of boxes [x,y,w,h] + label + confidence. Two families: two-stage (R-CNN 2014: propose regions then classify) and one-stage (YOLO 2015: You Only Look Once - grid divides image, each cell predicts boxes). YOLO: 7x7 grid, each cell predicts 2 boxes. Real-time 45 fps. Anchor boxes = prior shapes (tall for person, wide for car).",whyNeed:"Classification tells 'image contains cat'. Detection tells 'cat at (120,80) size 200x150'. This is what enables real-world action: car needs WHERE pedestrian is, not just IF. For school project, need to locate backpack/bottle/chair.",realWorld:["Autonomous: detect pedestrians, cars, traffic lights with boxes","Warehouse robots: find boxes to pick","Snapchat: face box to place filter","Sports: player tracking boxes"],history:[{year:"2014",event:"R-CNN",detail:"Girshick: selective search proposes 2000 boxes, CNN classifies each - slow"},{year:"2015",event:"YOLO v1",detail:"Redmon: single CNN predicts boxes + labels directly, 45 fps, revolutionary"},{year:"2017",event:"Mask R-CNN",detail:"He et al: adds pixel masks inside boxes - segmentation"},{year:"2020",event:"DETR",detail:"Transformers for detection - no anchors, set prediction"}],kidQuestions:[{q:"How does AI know how big box to draw?",a:"It learns anchor boxes - typical shapes. Like you know backpack is roughly tall rectangle, bottle is skinny tall. AI starts with guesses (anchors) and adjusts: a bit wider, a bit taller."},{q:"What if two objects overlap?",a:"Non-Max Suppression! AI predicts many boxes, many overlap same object. It keeps highest confidence box, removes others that overlap too much (IoU >0.5). Like picking best sticker."},{q:"Can it find objects it never saw?",a:"No. If trained only on backpack/bottle/chair, it won't find laptop - will either ignore or mislabel as backpack. Need training data for each object. That's why we collect 100 images/class."}],vocab:[{term:"Bounding Box",def:"Rectangle around object: x,y,width,height. Like sticker border.",visual:"⬜ rectangle with x,y arrow"},{term:"IoU - Intersection over Union",def:"How much predicted box overlaps true box. 1=perfect, 0=no overlap.",visual:"\uD83D\uDD33 overlap shaded"},{term:"Anchor Box",def:"Preset box shapes AI starts with: tall, wide, square. Adjusts from there.",visual:"\uD83D\uDCE6 3 boxes different shapes"},{term:"Non-Max Suppression",def:"Remove duplicate boxes, keep most confident. Clean up stickers.",visual:"\uD83C\uDFF7️ many stickers -> one"}]},mentalModelDeep:{teacherAnalogy:"Sticker Finder Game: Give kid page full of objects (Where's Waldo) and 100 stickers. Task: put sticker around each backpack. You need to decide sticker position and label. YOLO approach: divide page into 7x7 grid, assign each grid cell responsibility: if backpack center falls in your cell, you must draw box. Each cell has 2 sticker shapes ready (tall/wide). That's exactly YOLO - grid cells predict boxes.",studentAnalogy:"You play sticker hunt: I give you photo of classroom, you put post-it around every chair. But post-it must be just right - not too big, not too small, must say 'chair'. If two post-its overlap same chair, keep better one.",sketchSteps:["Draw classroom scene with 2 backpacks, 1 bottle","Divide image into 3x3 grid lightly","For each cell, ask: does object center fall here? If yes, draw box from that cell","Draw 2 anchor boxes per cell (tall, square)","Pick anchor closest to true box, adjust: make a bit bigger","After all cells, erase overlapping boxes, keep best"],wrongVsRight:{wrong:"AI scans image randomly looking for objects",right:"AI systematically checks grid cells, each cell predicts boxes for objects whose center is inside it"},bridgeQuestion:"If bottle is very small (10 pixels), which grid cell size will fail to detect it? Why do we need multiple scales?"},examplesBank:[{title:"Self-Checkout Detects Fruit",story:"Supermarket self-checkout camera detects apple vs orange with box",howItWorks:"Box around fruit, label + weight check. If box confidence low, asks staff.",whereToSee:"Amazon Go, self-checkout",discussionQ:"What if box detects banana as plantain - price difference?",whatIf:"Shopper hides expensive item behind cheap?",ethics:{benefits:"Faster checkout, less staff cost",harmed:"Job loss, false theft accusation",missing:"Diverse produce",trafficLight:"Yellow",mitigation:"Human override, diverse training"}},{title:"School Security Camera Counts",story:"School camera counts students entering with boxes",howItWorks:"Person detection YOLO, counts boxes crossing line",whereToSee:"Security systems",discussionQ:"Is counting people okay? What about tracking?",whatIf:"Camera misidentifies backpack as weapon?",ethics:{benefits:"Safety, crowd management",harmed:"Surveillance chilling effect, false weapon alerts",missing:"Student consent, bias",trafficLight:"Red",mitigation:"Count only, no ID, blur faces, policy"}},{title:"Wildlife Camera Trap",story:"Forest camera detects tigers with boxes, sends alert",howItWorks:"Motion triggers, YOLO detects animal boxes, filters human vs animal",whereToSee:"Conservation tech",discussionQ:"Should we use AI to watch wildlife?",whatIf:"Poacher uses same tech to find tigers?",ethics:{benefits:"Conservation, anti-poaching",harmed:"Dual use by poachers",missing:"Indigenous consent",trafficLight:"Yellow",mitigation:"Encrypt location, limit access"}},{title:"Sports Player Tracking",story:"Soccer broadcast draws boxes around players + stats",howItWorks:"Detects each player box, tracks ID across frames, calculates speed",whereToSee:"ESPN, FIFA",discussionQ:"Cool but what privacy?",whatIf:"Track students in PE for grading automatically?",ethics:{benefits:"Training insights",harmed:"PE grading bias, pressure",missing:"Student autonomy",trafficLight:"Yellow",mitigation:"Opt-in, no grading"}},{title:"Face Box for Filter",story:"TikTok draws invisible box around face to place sunglasses",howItWorks:"Face detection = object detection where object = face, box guides filter placement",whereToSee:"All face filters",discussionQ:"Invisible boxes - should we see them?",whatIf:"Face box used to measure attention in class?",ethics:{benefits:"Fun",harmed:"Attention surveillance in school",missing:"Consent",trafficLight:"Red",mitigation:"No emotion/attention detection in schools ban"}},{title:"Litter Detection Robot",story:"Beach robot detects bottle with box and picks it",howItWorks:"Bottle box detection, robot arm moves to box center",whereToSee:"Beach cleanup bots",discussionQ:"Robot mistakes sea shell as bottle?",whatIf:"Picks rare shell?",ethics:{benefits:"Clean environment",harmed:"Ecosystem disruption if wrong",missing:"Marine biologist review",trafficLight:"Green",mitigation:"Human review, confidence threshold high"}}],physicalComputing:{title:"Bounding Box String Art",materials:["Large classroom photo print A1","Colored yarn/string 3 colors","Push pins","Rulers","micro:bit + ultrasonic sensor"],steps:["Pin photo on cork board","Use ruler to measure object: find x,y (top-left corner), w,h","Place 4 pins at corners, wrap yarn = bounding box","Label tag: object name + your confidence (1-5)","micro:bit: ultrasonic measures distance to object, box size should scale with distance (closer = bigger box) - code scaling","Create class dataset: all boxes on shared photo, calculate IoU between students"],wiring:"micro:bit: Ultrasonic HC-SR04: Trig P1, Echo P2, VCC 5V via battery pack, GND GND. Power micro:bit 3V separate? Use level shifter or 3V tolerant echo via resistor divider.",microbit:"pins.setPull(P2,PullDown); trigger 10us pulse P1; pulseIn P2; distance = pulse/58; box_scale = 100/distance",teacherOnly:"IoU calc: intersection area / union. NMS: sort by confidence desc, keep box, remove boxes with IoU>0.5 with kept. Anchor: k-means on training boxes to get typical shapes."},communityData:{desc:"W9: Each class annotates 50 images with boxes using LabelImg",pool:"3 classes x 50 = 150 images, ~300 boxes (backpack,bottle,chair)",accuracy:"IoU avg 0.62 student boxes vs 0.81 after teacher review + consensus",privacy:"Only school objects, no people in images, faces blurred if accidental"},ethicsLensWeekly:{benefits:"Enables real action from vision",harmed:"Surveillance, weaponization",missing:"Consent for detection",trafficLight:"Red",mitigation:"Discuss: detection vs recognition, when is box okay but ID not",scenario:"Should school use backpack detection to find lost items? Helpful or surveillance?"},lesson90:{prep:["A1 classroom photo prints 10","Cork boards, pins, yarn","LabelImg installed on laptops","Ultrasonic sensors 15","Sample COCO dataset images"],flow:[{phase:"Hook",time:"0-10",goal:"From classification to detection",script:"Last week filter found edges. But where is edge? We need box! Show image: *cat in corner*. Classification says 'cat'. But WHERE? For self-driving car, 'pedestrian somewhere' useless - need location to brake! Today we put stickers around objects. Each sticker = box + label.",studentAction:"Quick: draw box around bottle in projected image with finger",materials:"Projector",checkUnderstanding:"Green: Box roughly around object",ifStuck:"Orange: Show good vs bad box examples"},{phase:"Direct",time:"10-25",goal:"Box anatomy + YOLO grid",script:"Box = 4 numbers: x,y,width,height. *Draw*. YOLO trick: divide image into 7x7 grid. Each cell asks: is object's CENTER in me? If yes, I predict box. Why center? So each object claimed by one cell only. Each cell predicts 2 boxes different shapes (anchors) - tall like bottle, square like backpack. *Demo grid overlay*. Then Non-Max Suppression: many cells predict same backpack, keep best confidence, erase rest.",studentAction:"On printed grid, mark which cell owns which object center",materials:"Grid printouts",checkUnderstanding:"Green: Correct cell assignment",ifStuck:"Orange: Color center dot, find containing cell"},{phase:"Mental Model",time:"25-40",goal:"String bounding boxes",script:"Physically build boxes. Take classroom photo, measure: where is backpack? Use ruler: x=2cm from left, y=3cm from top, w=4cm, h=5cm. Pin yarn. This is annotation - how we make training data! Your boxes will train AI. Important: tight box - not too big, not too small. IoU measures tightness.",studentAction:"Create 3 boxes with yarn, measure, record numbers",materials:"Photos, yarn, pins",checkUnderstanding:"Green: Box snug, numbers logged",ifStuck:"Orange: Teacher demos one box, students replicate"},{phase:"Hands-On",time:"40-60",goal:"LabelImg + micro:bit distance scaling",script:"Now digital: LabelImg tool. Open image, drag box, label. This creates XML with your numbers. *Demo*. Also micro:bit: real detector boxes bigger when closer. Ultrasonic measures distance, we scale box size inversely. Code it - if distance <50cm, box large, else small. This is what self-driving does - close pedestrian = big box = urgent.",studentAction:"Annotate 5 images in LabelImg, code micro:bit scaling",materials:"Laptops, micro:bits, ultrasonic",checkUnderstanding:"Green: 5 annotations saved, micro:bit distance affects display",ifStuck:"Orange: Pair work, pre-loaded images"},{phase:"Ethics",time:"60-75",goal:"When boxes harm",script:"Boxes seem innocent, but boxes around people enable tracking. Show: mall counts people (boxes) - okay? What about school tracking how long you stay in bathroom via person boxes? Where line? Also: if our training data only has backpacks on chairs, AI learns backpack = chair. Bias. Need diverse backgrounds. Discuss traffic light.",studentAction:"Ethics cards: sort scenarios Red/Yellow/Green, justify",materials:"Scenario cards",checkUnderstanding:"Green: Can argue Red scenario with harm",ifStuck:"Orange: Provide sentence starter: This is Red because..."},{phase:"Wrap",time:"75-90",goal:"IoU calculation + exit",script:"Calculate IoU: overlap / union. *Demo with yarn boxes overlapping*. Two students box same bottle - calculate IoU. If IoU 0.8 = agreement good. If 0.3 = one too big. This is how we evaluate detectors. Workbook: draw two boxes overlapping, calculate IoU approximate. Exit: Why need NMS? Because multiple cells predict same object -> duplicate stickers.",studentAction:"IoU calc, workbook",materials:"Rulers, workbook",checkUnderstanding:"Green: IoU >0.5 considered match",ifStuck:"Orange: Visual overlap shading"}]},unplugged:{name:"Human YOLO Grid",roles:["Grid Cells (49 students or 7x7 tape on floor)","Object (student standing somewhere)","Anchor Holders (2 per cell holding different size hoops)","IoU Judge","NMS Filter"],steps:["Mark 7x7 grid on floor with tape","Object student stands somewhere, hidden","Each Grid Cell student checks: is object's feet inside my cell? Only center cell shouts 'Mine!'","Owner cell's Anchor Holders try hoops around object, pick better fitting hoop","All owner cells (if multiple objects) show their hoops","If two hoops overlap same object (IoU Judge measures overlap with rope), NMS Filter keeps higher confidence (taller student = higher confidence for demo) and removes other","Repeat with 3 objects"],variations:["Small object: needs finer grid (14x14)","Overlapping objects: two objects same cell - need more anchors","Add confidence: Grid cell rates 1-5 how sure"],mistakes:["Multiple cells claim same object - must check center only","Hoop too big - need tight","Forgetting NMS - duplicates remain"]},workbook:{tasks:[{q:"Draw box: x=20,y=30,w=100,h=80 on 200x200 image. What is center?",type:"calc",answer:"center 70,70"},{q:"IoU: Box A 0,0,10,10 Box B 5,5,10,10. Intersection 5x5=25 Union 175. IoU?",type:"calc",answer:"0.14"},{q:"Why 2 anchor boxes per cell not 1?",type:"explain",answer:"Different shapes - tall bottle vs square backpack"},{q:"Find 3 Red scenarios of object detection in school",type:"ethics"}],rubric:["Box coordinates correct","IoU calc method","Explains anchors","Identifies surveillance risk"]}},{id:"W10",num:10,title:"Image Classification Advanced - Confidence Scores",tagline:"Guessing Game with Confidence",mentalModel:"Guessing Game",mentalEmoji:"\uD83C\uDFAF",color:"from-cyan-600 to-blue-600",teacherEmpowerment:{whatIsThisReally:"Classifier outputs probability distribution over classes: softmax converts logits to 0-1 sum 1. Confidence = max probability. But neural nets are overconfident! 99% confident but wrong. Calibration: does 80% confidence mean 80% correct? Usually not. Need temperature scaling, top-5 accuracy. For school project: if confidence <0.6, say 'unsure' not guess.",whyNeed:"Students think AI 'knows'. Need to teach uncertainty. Real systems must know when unsure - autonomous car 60% pedestrian = brake anyway. Confidence teaches critical thinking: not all AI answers equal trust. Also introduces softmax math intuitively.",realWorld:["Medical AI: 90% cancer vs 55% - different action","Content moderation: low confidence -> human review","Face unlock: needs 99.9% confidence else reject","Autonomous: low confidence -> slow down"],history:[{year:"2012",event:"Softmax in AlexNet",detail:"Final layer softmax over 1000 classes, top-5 84% accuracy"},{year:"2015",event:"Confidence calibration problem discovered",detail:"Guo et al: modern nets overconfident, need calibration"},{year:"2017",event:"Temperature scaling",detail:"Simple fix: divide logits by T to soften confidence"},{year:"2020",event:"Conformal prediction",detail:"Instead of one label, output set that contains truth 90% of time"}],kidQuestions:[{q:"If AI says 99% cat but it's dog, is AI lying?",a:"Not lying - badly calibrated. Like student who always says '100% sure' even when guessing. We need to teach AI humility via calibration - show it many examples where it was 99% but wrong, adjust."},{q:"Should AI ever say 'I don't know'?",a:"Yes! Best AI says 'unsure, need human'. Better than confident wrong. We code threshold: if max confidence <0.6, output 'unsure'. This is safe AI."},{q:"Why not just always say 50%?",a:"Then not useful! Need sharp but honest. Good confidence: when says 90%, actually right 90% of time. We measure calibration curve."}],vocab:[{term:"Confidence Score",def:"0-1 number how sure AI is. 0.99=very sure, 0.51=barely.",visual:"\uD83C\uDFAF 99% bullseye vs 51% edge"},{term:"Softmax",def:"Turns raw scores into probabilities that sum to 1. Like converting points to percentages.",visual:"\uD83D\uDCCA bars -> 70% 20% 10%"},{term:"Calibration",def:"Does confidence match reality? 80% confidence should be right 80% time.",visual:"⚖️ scale balanced"},{term:"Top-5",def:"Is true label in AI's top 5 guesses? Easier than top-1.",visual:"\uD83C\uDFC5 1st-5th place"}]},mentalModelDeep:{teacherAnalogy:"Guessing Game with Betting: Student guesses animal from blurry photo, must bet chips on confidence. If says 90% and wrong, loses many chips. If says 60% and wrong, loses few. Over time learns to bet honestly. Softmax = betting distribution across all options. Calibration = honesty of betting. Temperature = how cautious bettor is.",studentAnalogy:"Multiple choice test where you must say how sure you are. If you say 100% sure for every answer but get half wrong, teacher knows you're overconfident. Good student says 100% only when truly sure.",sketchSteps:["Show blurry image: backpack or chair? List 3 options with initial gut scores (backpack 2, bottle 0, chair 1)","Softmax: convert scores to probabilities: exp(score)/sum(exp). Calc: e^2=7.4, e^0=1, e^1=2.7 total 11.1 => 67%,9%,24%","Confidence = max = 67% backpack","Threshold: if <60% say unsure, else output label","Plot: many predictions at 67% - how many actually correct? Calibration check"],wrongVsRight:{wrong:"High confidence = AI is correct",right:"High confidence = AI thinks it's correct, may still be wrong if miscalibrated"},bridgeQuestion:"If AI is 55% backpack, 45% chair, should we act? What if it's medical diagnosis? What threshold would you set?"},examplesBank:[{title:"Face Unlock Rejects in Dark",story:"Phone face unlock says 62% match in dark, rejects - asks PIN",howItWorks:"Confidence threshold 99% for unlock, 62% < threshold => safe fail. Good calibration prevents stranger unlock.",whereToSee:"Face ID, fingerprint",discussionQ:"Should threshold be lower for convenience?",whatIf:"Lower threshold -> twin unlocks phone?",ethics:{benefits:"Security",harmed:"Inconvenience, accessibility if fails often for some",missing:"Dark skin often lower confidence",trafficLight:"Yellow",mitigation:"Adaptive threshold + liveness"}},{title:"Medical AI Says 70% Cancer",story:"X-ray AI says 70% tumor, doctor orders biopsy",howItWorks:"70% not enough to operate, but enough to test further. Confidence guides next step, not final decision.",whereToSee:"Radiology",discussionQ:"Should patient be told 70%?",whatIf:"AI 95% but wrong -> unnecessary surgery?",ethics:{benefits:"Catches early",harmed:"Anxiety, false positive harm",missing:"Patient understanding of confidence",trafficLight:"Red",mitigation:"Explainable + human in loop, never auto-diagnose"}},{title:"Content Filter Low Confidence -> Human",story:"TikTok AI 55% sure video is bullying, sends to human moderator",howItWorks:"Low confidence queue for human review, high confidence auto-action. Balances scale and accuracy.",whereToSee:"All social platforms",discussionQ:"What if human moderators overwhelmed?",whatIf:"High confidence but wrong - innocent video removed?",ethics:{benefits:"Protects users",harmed:"Moderator trauma, censorship if miscalibrated",missing:"Appeal process",trafficLight:"Yellow",mitigation:"Transparent thresholds, appeal"}},{title:"Self-Driving 60% Pedestrian - Still Brakes",story:"Car 60% sure shadow is pedestrian, brakes anyway",howItWorks:"Safety critical: even low confidence for person = brake. Asymmetric cost: false brake annoying, false no-brake fatal.",whereToSee:"Autonomous",discussionQ:"Should car brake for 10% person?",whatIf:"Brakes too often -> rear-ended?",ethics:{benefits:"Safety first",harmed:"Traffic flow, rear collision",missing:"Pedestrian intent",trafficLight:"Yellow",mitigation:"Risk-sensitive thresholds"}},{title:"Grading AI 99% Plagiarism But Wrong",story:"Turnitin 99% plagiarism, but student quoted correctly",howItWorks:"Overconfident because training data lacked proper quotes. High confidence wrong = unfair punishment.",whereToSee:"Education tech",discussionQ:"Should high confidence auto-fail?",whatIf:"Student expelled?",ethics:{benefits:"Deters cheating",harmed:"False accusation, life altering",missing:"Due process",trafficLight:"Red",mitigation:"Never auto-punish, human review required"}},{title:"Wildlife AI Unsure -> Asks Expert",story:"Camera trap 51% tiger vs 49% leopard, flags as unsure, expert checks",howItWorks:"Good calibration knows when confused between similar species, asks help.",whereToSee:"Conservation",discussionQ:"Is unsure better than wrong?",whatIf:"Always unsure -> useless?",ethics:{benefits:"Accurate science",harmed:"None if designed well",missing:"Expert availability",trafficLight:"Green",mitigation:"Set useful unsure threshold"}}],physicalComputing:{title:"Confidence Voting with micro:bit Buttons",materials:["micro:bits 15","3 labeled boxes: Backpack, Bottle, Chair","Colored balls","Score board"],steps:["Show blurry image, each student votes by placing ball in box + sets micro:bit confidence 1-5 via A/B buttons","Count votes: softmax of counts = class probabilities","micro:bit displays bar graph of confidence: A=backpack, B=bottle, A+B=chair with brightness = confidence","Compare class confidence vs true label, calculate calibration: when we said 80% how often right?","Introduce threshold: only output if confidence >60% else 'unsure' - re-vote with clearer image"],wiring:"No wiring, micro:bits radio: group 7, send confidence via radio. Receiver micro:bit aggregates.",microbit:"radio.setGroup(7); on Button A: conf++; radio.sendValue('backpack', conf); display bar",teacherOnly:"Softmax formula on board: exp(z_i)/sum(exp(z_j)). Temperature: divide logits by T>1 to lower confidence (soften). Calibration plot: bin predictions by confidence 0-10%,...,90-100%, plot accuracy per bin - perfect = diagonal."},communityData:{desc:"W10: Collect confidence scores for same object under blur",pool:"Each student takes 5 photos same backpack at different blur distances, record model confidence",accuracy:"Confidence drops 92% (clear) -> 34% (blurry 3m). Good - model knows when blurry!",privacy:"No people, only objects"},ethicsLensWeekly:{benefits:"Teaches uncertainty and humility in AI",harmed:"Overconfident AI causes harm",missing:"Calibration often ignored",trafficLight:"Yellow",mitigation:"Always show confidence, allow unsure",scenario:"AI tutor 99% confident but wrong answer - student learns wrong. How to prevent?"},lesson90:{prep:["Blurry image set 20","Balls and boxes 3","micro:bits radio code","Calibration worksheet","Confidence slider printouts"],flow:[{phase:"Hook",time:"0-10",goal:"AI can be confidently wrong",script:"Show image: *highly confident cat but it's dog*. Model says 99% cat. Is it cat? No! AI can be 99% wrong. Like that friend who always says 'I'm 100% sure' and is wrong. Today we teach AI humility - confidence that matches reality.",studentAction:"Vote: is image cat? How sure 1-5?",materials:"Blurry images",checkUnderstanding:"Green: Students show spread of confidence",ifStuck:"Orange: Start with obvious vs blurry pair"},{phase:"Direct",time:"10-25",goal:"Softmax + confidence",script:"Raw scores: backpack 2.0, bottle 0.1, chair 0.5. How to turn into %? Softmax: e^score. e^2=7.4, e^0.1=1.1, e^0.5=1.6 total 10.1 => 73%,11%,16%. Confidence = 73% backpack. *Calculate together*. Threshold: if <60%, we say 'unsure' - safer. Medical AI 70% cancer -> not surgery but test.",studentAction:"Calculate softmax for given scores with calculator",materials:"Calculators, worksheet",checkUnderstanding:"Green: Sums to ~100%",ifStuck:"Orange: Use e^x button, do 2 classes only first"},{phase:"Mental Model",time:"25-40",goal:"Guessing game betting",script:"Each group gets blurry photo, 10 chips. Bet chips across 3 boxes based on confidence. If correct, win chips proportionally. If wrong but low bet, lose little. After 5 rounds, who has most chips? The honest bettor, not overconfident one. That's calibration - honesty pays long term.",studentAction:"Bet chips, reveal label, track score",materials:"Chips, boxes, photos",checkUnderstanding:"Green: Lowers bet when unsure",ifStuck:"Orange: Demo one round whole class"},{phase:"Hands-On",time:"40-60",goal:"micro:bit confidence voting",script:"micro:bit A = increase confidence for backpack, B for bottle, A+B for chair. Radio sends to central micro:bit which aggregates like softmax and shows bar graph. Let's test: clear backpack photo - what confidence? *Show* - 92%. Blurry same backpack 3 meters away - now? 34%. Good! AI knows it's unsure when blurry. That's good calibration.",studentAction:"Vote via micro:bit, observe aggregated confidence",materials:"micro:bits",checkUnderstanding:"Green: Confidence drops with blur",ifStuck:"Orange: Use one micro:bit as demo, not radio"},{phase:"Ethics",time:"60-75",goal:"High stakes confidence",script:"Show: grading AI 99% plagiarism but student innocent. If auto-fail, life ruined. Should 99% auto-punish? No. Need human review. Also: face unlock - if threshold too low, twin unlocks. Too high, you can't unlock in dark and miss emergency call. Confidence threshold is ethics choice. Discuss: what threshold for medical? For school grading? For self-driving?",studentAction:"Pick thresholds for 3 scenarios, justify",materials:"Scenario cards",checkUnderstanding:"Green: Higher stakes = higher threshold or human review",ifStuck:"Orange: Provide stakes ladder: fun -> safety -> life"},{phase:"Wrap",time:"75-90",goal:"Calibration plot",script:"We collected confidence vs correctness. Plot: x=confidence we said, y=actual accuracy. Perfect calibration = diagonal line. Overconfident = below diagonal. Let's plot class data. *Draw*. Our class? Slightly overconfident at 80% - we said 80% but only 65% right. So need to lower confidence. That's temperature scaling. Workbook: design 'unsure' response.",studentAction:"Plot calibration, workbook",materials:"Graph paper",checkUnderstanding:"Green: Can explain diagonal = honest",ifStuck:"Orange: Show ideal vs overconfident example plot"}]},unplugged:{name:"Human Softmax Choir",roles:["Logit Holders (3 students holding score cards)","Exp Calculator (with calculator)","Sum Singer","Probability Dancers (size proportional to prob)","Threshold Gatekeeper"],steps:["Logit Holders show scores e.g., 2,0,1","Exp Calculator computes e^score and shouts","Sum Singer sums exps","Probability Dancers: each takes space proportional to exp/sum - arms wide for high prob","Gatekeeper: if max prob <0.6 says 'UNSURE', else points to winner","Repeat with scores 3,0,0 => near 90% confident","Discuss: what scores give 33% each? (0,0,0)"],variations:["Add temperature: divide scores by 2 before exp => softer","Top-2: Dancers show top 2 only","Bluff: Logit Holders lie about scores - calibration broken"],mistakes:["Forgetting exp - using raw scores as prob (don't sum to 1)","Threshold too high -> always unsure","Not normalizing"]},workbook:{tasks:[{q:"Softmax: scores [3,1,0] compute probs",type:"calc",answer:"exp 20.1,2.7,1 total 23.8 => 84%,11%,4%"},{q:"When should AI say unsure? Give 2 examples",type:"explain"},{q:"Plot calibration: you said 90% 10 times but right 6 times - calibrated?",type:"calc",answer:"No, overconfident, should be 60%"},{q:"Design threshold for school lost-and-found detector: false alarm cost?",type:"ethics"}],rubric:["Softmax correct","Names unsure benefit","Identifies miscalibration","Threshold justified with stakes"]}},{id:"W11",num:11,title:"Vision Ethics - Facial Recognition Bias, Privacy",tagline:"Mirror reflects data bias",mentalModel:"Mirror with Bias",mentalEmoji:"\uD83E\uDE9E",color:"from-blue-700 to-cyan-600",teacherEmpowerment:{whatIsThisReally:"Vision bias = dataset bias + measurement bias. Buolamwini & Gebru 2018: commercial face detectors 99% light male, 65% dark female. Why? Training data 80% light. Also labeling bias: 'professional' = light male in data. Privacy: face is biometric PII, GDPR special category. Function creep: attendance system becomes emotion surveillance. Ethics frameworks: consent, minimization, purpose limitation.",whyNeed:"8th graders will be subject to facial recognition in school, airport, hiring. Must understand bias is not bug but mirror of data. Empower to audit, ask questions, advocate. Links to history: mirrors always reflected society - who was painted? Who was photographed?",realWorld:["School face recognition for attendance - banned in many districts","Hiring AI scans face for 'confidence' - pseudoscience","Police use: misidentification leads to wrongful arrest (Robert Williams 2020)","Phone unlock bias: fails more for dark skin in low light"],history:[{year:"2015",event:"Google Photos labels Black people as gorillas",detail:"Dataset bias, label bias - embarrassment, fix by removing gorilla label"},{year:"2018",event:"Gender Shades - Buolamwini",detail:"Audited IBM, Microsoft, Face++: 34% error dark female vs 1% light male"},{year:"2020",event:"Robert Williams wrongful arrest",detail:"Detroit police face recognition false match, Black man jailed 30h"},{year:"2023",event:"EU AI Act bans real-time facial recognition in public",detail:"High-risk classification, requires impact assessment"}],kidQuestions:[{q:"If AI trained mostly on light skin, is it racist?",a:"AI isn't racist like person with hate, but system produces racist outcomes because data reflects historical exclusion. Mirror with bias: mirror reflects world as it is, not as it should be. Our job is to fix mirror and world."},{q:"Can we fix bias by adding more dark skin photos?",a:"Partly, but also need diverse photographers, lighting, labels, testing. More data alone not enough if labels still biased. Need audit like Gender Shades - test on balanced benchmark."},{q:"Is face unlock okay but school tracking not?",a:"Context matters: consent, control, purpose. Phone: you control, opt-in, on-device. School: mandatory, central database, tracks all day, function creep to emotion detection. Same tech, different ethics - traffic light changes with use."}],vocab:[{term:"Bias (Dataset)",def:"Training data doesn't represent world. Mirror reflects only some people.",visual:"\uD83E\uDE9E mirror showing only half crowd"},{term:"False Match / MisID",def:"AI says two different people are same. Higher for underrepresented groups.",visual:"\uD83D\uDC65➡️\uD83D\uDC64 mistaken identity"},{term:"Consent & Purpose Limitation",def:"Data collected for one purpose (attendance) shouldn't be used for another (emotion) without consent.",visual:"\uD83D\uDCCB purpose written, can't reuse"},{term:"Audit",def:"Independent testing for bias across groups, like Gender Shades.",visual:"\uD83D\uDD0D magnifying glass over model"}]},mentalModelDeep:{teacherAnalogy:"Mirror with Bias: Imagine hall of mirrors at carnival - some mirrors stretch, some shrink. AI is mirror trained on historical photos. If historical photos mostly show CEOs as men, mirror learns 'CEO = man' shape. When you stand in front (dark-skinned woman CEO), mirror distorts you to fit training. Mirror doesn't hate you; it was built with distorted glass (biased data). Fix glass (data) and test with diverse people.",studentAnalogy:"Your TikTok For You Page is mirror: shows you more of what you already watch, so you think world is like your feed. AI mirror same - if trained on mostly one group, thinks world is that group.",sketchSteps:["Draw mirror frame","Inside mirror, draw dataset: 8 light faces, 2 dark faces (imbalanced)","Draw person standing before mirror: dark female student","Draw reflection: blurry, low confidence 52%, label 'uncertain' vs light male 98% 'confident'","Add fix: second mirror with balanced 5 light 5 dark, reflection clear 94% both","Label: Bias -> Harm (misID) -> Fix (audit + balance)"],wrongVsRight:{wrong:"Bias is fixed by making AI colorblind - ignore skin",right:"Colorblindness hides bias; need to measure across groups and ensure equal performance, not ignore differences"},bridgeQuestion:"If school uses face recognition for attendance and it fails more for some students, making them late marked absent, who is harmed and what would you do as designer?"},examplesBank:[{title:"Attendance System Marks Dark Skin Late",story:"School pilot face recognition attendance, dark-skinned students marked absent more often, need manual override, late to class",howItWorks:"Detector confidence lower for dark skin in classroom lighting (dataset bias + lighting), threshold 80% fails, requires teacher override",whereToSee:"School pilots in UK, US, China",discussionQ:"Should school use it?",whatIf:"Data used to track bathroom breaks?",ethics:{benefits:"Saves 5 min roll call",harmed:"Discrimination, lateness, privacy, chilling effect",missing:"Consent, diverse test, alternative",trafficLight:"Red",mitigation:"Ban in schools, use ID cards, audit required"}},{title:"Hiring AI Judges Smile",story:"HireVue analyzes face for 'enthusiasm' to screen candidates",howItWorks:"Claims to detect confidence from facial movements - pseudoscience, no validity, biased against neurodivergent",whereToSee:"Hiring tech",discussionQ:"Can smile predict job performance?",whatIf:"Autistic candidate doesn't smile normatively?",ethics:{benefits:"None evidence-based",harmed:"Discrimination against disabled, introverts, cultural differences",missing:"Science, consent",trafficLight:"Red",mitigation:"Ban emotion inference in hiring (EU AI Act does)"}},{title:"Phone Unlock Fails for Child",story:"Child face unlock fails, parent must unlock - child feels excluded",howItWorks:"Training mostly adult faces, child proportions different, confidence low",whereToSee:"Face ID",discussionQ:"Is child data collected?",whatIf:"Child's face data stored in cloud?",ethics:{benefits:"Security for adult",harmed:"Exclusion, child privacy",missing:"Child faces in training with consent",trafficLight:"Yellow",mitigation:"On-device, parental consent, age-appropriate threshold"}},{title:"Missing Person Search Uses Face Rec",story:"Police use face rec to find missing child, finds quickly",howItWorks:"Searches CCTV with probe image, high stakes justified",whereToSee:"Amber alerts",discussionQ:"When is face rec justified?",whatIf:"Used for all people, not just missing?",ethics:{benefits:"Finds missing, safety",harmed:"If misused for mass surveillance",missing:"Warrant, oversight",trafficLight:"Yellow",mitigation:"Warrant required, time-limited, oversight board, audit log"}},{title:"Filter Lightens Dark Skin",story:"Beauty filter auto-lightens dark skin, users protest",howItWorks:"Training data: 'beautiful' labeled mostly light skin, model learns light = beautiful",whereToSee:"Beauty filters",discussionQ:"Who decides beautiful?",whatIf:"Teen uses filter daily, self-esteem drops?",ethics:{benefits:"None",harmed:"Colorism, self-esteem, mental health",missing:"Diverse beauty labels",trafficLight:"Red",mitigation:"Remove skin lightening, add dark skin beauty training, user control"}},{title:"Museum Face Rec Finds Art Doppelganger",story:"Museum app finds your art look-alike, fun, opt-in, deletes after",howItWorks:"On-device face embedding, compares to art embeddings, no storage",whereToSee:"Google Arts",discussionQ:"Why is this Green but school attendance Red?",whatIf:"Museum sells data?",ethics:{benefits:"Education, fun, cultural connection",harmed:"Minimal if on-device",missing:"Clear deletion policy",trafficLight:"Green",mitigation:"On-device, opt-in, auto-delete, no third party"}}],physicalComputing:{title:"Bias Mirror Test with Diverse Faces + micro:bit Audit",materials:["Printed Fitzpatrick skin scale faces (6 tones) 30 sets","Light meter app","micro:bit + light sensor","Audit scorecards","3 lamps (dim, medium, bright)"],steps:["Set up 3 lighting conditions: dim (class corner), medium (center), bright (window)","For each face tone, take photo with phone face detection, record confidence + success/fail","micro:bit light sensor measures lux, log lighting level","Plot: confidence vs skin tone vs lighting - see drop for dark+dim","Calculate disparity: accuracy light vs dark, report audit like Gender Shades","Design fix: propose lighting improvement, threshold adjustment, or ban"],wiring:"micro:bit LDR as before, plus use micro:bit display to show audit result: smiley if disparity <10%, sad if >20%",microbit:"Read lux, display disparity bar, radio send audit data to teacher dashboard",teacherOnly:"Fitzpatrick scale I-VI. Buolamwini method: test 4 groups (dark female, dark male, light female, light male) - 4x disparity. Intersectional. Statistical: error rate = 1-accuracy. Disparity = max-min."},communityData:{desc:"W11: Audit class face detection (if allowed) or object detection for bias",pool:"Test backpack detection on 3 backgrounds: clean, cluttered, dark - measure confidence drop",accuracy:"Clean 89% confidence avg, cluttered 62%, dark 54% - shows background bias",privacy:"No faces photographed without explicit opt-in consent form, anonymized audit only"},ethicsLensWeekly:{benefits:"Critical consciousness",harmed:"Potential distress discussing bias - need care",missing:"Student agency",trafficLight:"Red",mitigation:"Create student audit report to principal, advocate",scenario:"Principal proposes face recognition for lunch payment - students audit and present findings, traffic light?"},lesson90:{prep:["Print diverse face cards (or use object bias if face consent issue)","Lamps, light sensors","Buolamwini 5min video","Audit cards","Consent forms"],flow:[{phase:"Hook",time:"0-10",goal:"Mirror reflects bias",script:"Show two mirrors: one normal, one carnival distorted. Which is AI? *Show Gender Shades results: 99% light male, 65% dark female*. This is not opinion, it's measurement. 2018 Joy Buolamwini, MIT student, found her dark face not detected until she wore white mask. She audited and changed industry. Today you become auditors.",studentAction:"Watch 2min Buolamwini clip, reaction",materials:"Video",checkUnderstanding:"Green: Can state disparity number",ifStuck:"Orange: Show side-by-side detection demo"},{phase:"Direct",time:"10-25",goal:"Bias types + history",script:"Bias sources: dataset (who photographed), measurement (lighting favors light skin), label (who labeled 'professional'), deployment (used for surveillance not just unlock). History: 2015 Google gorilla, 2018 Gender Shades, 2020 wrongful arrest Robert Williams - Black man jailed because face rec false match. Why more false matches for Black? Training data 80% white. Face is biometric - GDPR special category, needs consent. Function creep: attendance -> emotion detection.",studentAction:"Map bias source to example",materials:"Bias source cards",checkUnderstanding:"Green: Links dataset bias to outcome",ifStuck:"Orange: Use attendance example concrete"},{phase:"Mental Model",time:"25-40",goal:"Draw bias mirror",script:"Draw mirror with imbalanced dataset inside. Show reflection blurry for underrepresented. Then draw fixed mirror balanced. Key: colorblind approach fails - ignoring skin doesn't fix, need measure across groups. Intersectional: dark female worst - both skin and gender underrepresented. Audit must test intersectional, not just skin OR gender.",studentAction:"Draw mirror, label bias->harm->fix",materials:"Paper, markers",checkUnderstanding:"Green: Shows disparity in drawing",ifStuck:"Orange: Template with mirror outline"},{phase:"Hands-On",time:"40-60",goal:"Audit with lights + faces/objects",script:"We audit not people if consent issue - we audit backpack detector across backgrounds: clean, cluttered, dark. Same idea: does detector work equally? Setup 3 lamps, measure lux with micro:bit. Test detector, log confidence. Plot. You will see confidence drops in dark/cluttered - bias. If face consent given, test Fitzpatrick scale. This is exactly Gender Shades method - audit.",studentAction:"Measure lux, test detection, log on audit card",materials:"Lamps, micro:bits, detector (Teachable Machine)",checkUnderstanding:"Green: Logs disparity",ifStuck:"Orange: Teacher demos one condition"},{phase:"Ethics",time:"60-75",goal:"Traffic light + action",script:"Traffic light: Green = opt-in, on-device, fun, deletable (museum doppelganger). Yellow = warrant, time-limited, oversight (missing person). Red = mandatory, central DB, no consent, function creep, high stakes (school attendance, hiring emotion, police mass surveillance). Where does lunch payment face rec fall? *Debate*. Students: you can write audit report to principal with data - real advocacy. EU AI Act bans real-time public face rec - why?",studentAction:"Sort 6 scenarios Red/Yellow/Green, write recommendation",materials:"Scenario cards",checkUnderstanding:"Green: Justifies with consent/purpose",ifStuck:"Orange: Provide traffic light criteria list"},{phase:"Wrap",time:"75-90",goal:"Advocacy letter",script:"Workbook: write 1-page audit report: what you tested, disparity found, recommendation. Use evidence: 'In dim light, confidence 54% vs 89% bright - 35% disparity'. This is how Buolamwini changed IBM, Microsoft. Your voice matters. Exit: One action you will take when you see face rec? Example: ask 'Where does data go? Can I opt out?'",studentAction:"Write audit report, exit ticket",materials:"Workbook, audit cards",checkUnderstanding:"Green: Report includes data + recommendation",ifStuck:"Orange: Sentence starters"}]},unplugged:{name:"Human Bias Mirror Audit",roles:["Dataset Curators (choose 10 photos from pile - unconscious bias)","Model (wears biased glasses - e.g., blurry for dark)","Tester (brings diverse faces/objects)","Auditor (logs success/fail by group)","Advocate (writes fix)"],steps:["Curators pick 10 'professional' photos from 30 diverse - observe who they pick (usually light male)","Model wears glasses that blur for some groups (e.g., sunglasses for dark tone simulation)","Tester shows faces/objects one by one, Model tries to detect","Auditor logs accuracy by group on board: light vs dark, cluttered vs clean","Calculate disparity: max accuracy - min accuracy","Advocate proposes fix: add data, improve lighting, or ban use case","Repeat with balanced dataset - disparity drops"],variations:["No glasses but dim lighting for some groups","Label bias: Curators label 'professional' based on stereotype","Function creep: Model starts attendance then starts emotion"],mistakes:["Auditing only overall accuracy, not by group","Thinking more data always fixes - need diverse data","Ignoring intersectionality"]},workbook:{tasks:[{q:"What is Gender Shades result? Numbers",type:"recall",answer:"99% light male, 65% dark female - 34% gap"},{q:"Give Red/Yellow/Green example of face rec, justify with consent/purpose",type:"ethics"},{q:"Design audit: what groups, what metric, what threshold for Red?",type:"design"},{q:"Write 3 questions to ask principal proposing face rec lunch",type:"advocacy"}],rubric:["Recalls disparity data","Traffic light justified","Audit design includes groups","Advocacy questions cover consent, data, bias"]}},{id:"W12",num:12,title:"PROJECT 2 Object Detector for School",tagline:"School Detective - 3 objects 100 images/class",mentalModel:"School Detective",mentalEmoji:"\uD83D\uDD75️",color:"from-blue-500 to-cyan-500",teacherEmpowerment:{whatIsThisReally:"End-to-end detector: data collection (100/class x3 =300), annotation (LabelImg), training (Teachable Machine or YOLO nano), evaluation (IoU, mAP), deployment (micro:bit alert), ethics review. Community pooling: combine 3 classes = 300 images, accuracy 72% single class ->89% pooled (diversity). Real engineering: data > model.",whyNeed:"Culmination of W7-11: pixels + filters + boxes + confidence + ethics. Builds portfolio, community, agency: students solve real school problem (lost-and-found). Teaches that AI is not magic but data work - 80% time is data collection/cleaning.",realWorld:["Lost-and-found: detect backpacks left behind","Library: chair occupancy detection","Canteen: bottle recycling count","Safety: unattended bag detection"],history:[{year:"2015",event:"YOLO enables real-time",detail:"Makes school projects feasible on laptop"},{year:"2017",event:"Teachable Machine",detail:"Google makes training accessible no-code"},{year:"2019",event:"Edge AI",detail:"Models run on micro:bit / phone, no cloud"},{year:"2022",event:"Community datasets",detail:"Open Images, COCO show power of pooled community data"}],kidQuestions:[{q:"Why 100 images per class? Can't we use 10?",a:"Deep learning needs variety: different angles, lighting, backgrounds, occlusions. 10 images = memorizes those 10, fails on 11th. 100 = learns general backpack shape. Pooling 3 classes = 300 = even better, sees backpacks from different rooms."},{q:"What if AI still fails after 300 images?",a:"Then we debug data: are all photos from same angle? Same background? Same backpack color? Add missing cases. Engineering is iterative. Also check labels: tight boxes?"},{q:"Can we sell our detector?",a:"You built it, but data includes school - need consent, privacy review. Better open-source for other schools. If commercial, need to consider bias audit and liability if fails."}],vocab:[{term:"Dataset",def:"Collection of images + boxes + labels. Fuel for AI.",visual:"\uD83D\uDDC3️ folder of images"},{term:"mAP - mean Average Precision",def:"Overall detector score: averages precision across classes and IoU thresholds. 0-100%.",visual:"\uD83D\uDCC8 curve area"},{term:"Train/Test Split",def:"80% train, 20% test - test never seen during training, measures real performance.",visual:"✂️ split"},{term:"Edge Deployment",def:"Run model on micro:bit/phone, not cloud - private, fast, offline.",visual:"\uD83D\uDCF1 on device"}]},mentalModelDeep:{teacherAnalogy:"School Detective Agency: Clients report lost backpacks, bottles, chairs moved. Detective (AI) needs training: show 100 photos of each object in different places (evidence). Then detective learns pattern: backpack has straps, bottle skinny, chair has legs. When new photo comes, detective draws boxes around suspects with confidence. Community pooling = 3 detective agencies share evidence = smarter detective.",studentAnalogy:"You are training puppy to find backpack. Show puppy 100 backpacks, say 'backpack!'. Puppy learns. Show bottle, say 'bottle!'. After many, puppy barks and points (box) when sees backpack. More examples = smarter puppy. Three classes sharing photos = three trainers = super puppy.",sketchSteps:["Draw school map with 3 objects in different spots","Show data collection: 100 photos each object, diverse angles/lighting","Annotation: draw boxes around each","Training: feed into Teachable Machine, watch accuracy climb 72%->89% when pooling","Testing: new classroom photo, model draws 3 boxes with confidence","Deployment: micro:bit beeps when backpack left behind"],wrongVsRight:{wrong:"Project done when model trained",right:"Project done when model tested, audited for bias, privacy reviewed, deployed, and documented"},bridgeQuestion:"If pooled 300 images gives 89% but single class 100 gives 72%, why does diversity help more than quantity? What kind of diversity matters?"},examplesBank:[{title:"Lost-and-Found Backpack Alert",story:"Detector watches lost-and-found table, alerts when new backpack appears, counts days",howItWorks:"Camera takes photo hourly, detector finds backpack boxes, tracks new vs old by position, sends list",whereToSee:"School pilot",discussionQ:"Should it recognize whose backpack?",whatIf:"Alerts wrong backpack as lost?",ethics:{benefits:"Finds lost items, reduces waste",harmed:"If adds face recognition to identify owner -> privacy Red",missing:"Owner consent",trafficLight:"Green",mitigation:"Object only, no face, blur background people"}},{title:"Library Chair Occupancy",story:"Library shows free chairs via chair detection, no people tracking",howItWorks:"Detects chair boxes, if person sitting? Actually detect empty chairs only - no person boxes to avoid surveillance",whereToSee:"Library systems",discussionQ:"Should detect people sitting?",whatIf:"Counts person as chair?",ethics:{benefits:"Find seat quickly",harmed:"If person detection -> surveillance",missing:"Privacy by design",trafficLight:"Green",mitigation:"Detect chairs only, no people, on-device"}},{title:"Recycling Bottle Counter",story:"Canteen counts bottles recycled via detector, gamifies",howItWorks:"Bottle boxes in recycling bin, count per day, leaderboard",whereToSee:"Eco schools",discussionQ:"Gamification good?",whatIf:"Students throw non-bottle to increase count?",ethics:{benefits:"Eco awareness",harmed:"Gaming, cheating",missing:"Verification",trafficLight:"Green",mitigation:"Human spot check"}},{title:"Unattended Bag Safety",story:"Detector flags backpack alone >10min as unattended, alerts staff",howItWorks:"Backpack box with no person box nearby for time threshold",whereToSee:"Airports",discussionQ:"Safety vs false alarm?",whatIf:"Student bathroom, bag flagged?",ethics:{benefits:"Safety",harmed:"False alarm stress, profiling",missing:"Context",trafficLight:"Yellow",mitigation:"Human verifies, no auto-alarm, privacy"}},{title:"Classroom Setup Check",story:"Teacher photo, detector counts chairs vs students, checks setup",howItWorks:"Chair detection count, compare expected",whereToSee:"Facilities",discussionQ:"Useful?",whatIf:"Used to check if students standing?",ethics:{benefits:"Facilities management",harmed:"If used to monitor student posture",missing:"Purpose limitation",trafficLight:"Yellow",mitigation:"Only count chairs, not people"}},{title:"Yearbook Object Stats",story:"Yearbook uses detector to count how many bottles appear in year photos - fun stat",howItWorks:"Run detector over yearbook photos, aggregate counts, no ID",whereToSee:"Yearbook",discussionQ:"Fun vs creepy?",whatIf:"Counts people?",ethics:{benefits:"Fun insight, no harm",harmed:"If people counted",missing:"Consent for photo use",trafficLight:"Green",mitigation:"Objects only, aggregate only"}}],physicalComputing:{title:"Object Detector + micro:bit Alert System",materials:["Laptop with Teachable Machine / YOLO","micro:bit + buzzer + LED strip","3 objects: backpack, bottle, chair","Cardboard school diorama"],steps:["Collect 100 images per class: 30 backpack (different angles/lighting/backgrounds), 30 bottle, 30 chair, 10 empty","Annotate with LabelImg: tight boxes, export XML/CSV","Train Teachable Machine: upload, 80/20 split, observe accuracy","Pool with other classes: combine 300 images, retrain, compare accuracy 72%->89%","Deploy: Python script reads webcam, runs model, sends via serial to micro:bit: 'B:0.92' etc","micro:bit: if backpack confidence >0.8, beep + LED green + display B; if bottle >0.8 blue; chair >0.8 yellow","Test in diorama: place objects, see detection + alert","Audit: test on new classroom, different lighting, log failures, add missing data"],wiring:"micro:bit buzzer P0, LED strip P1 (Neopower 8 LEDs). Serial via USB. Power via battery pack for mobile demo.",microbit:"serial.onDataReceived: parse label+conf, if conf>80 show icon, music.playTone; radio broadcast to other micro:bits for community display",teacherOnly:"Teachable Machine export: TensorFlow.js. YOLO nano: ultralytics YOLOv8n train 50 epochs. mAP calculation: precision-recall curve per class. Data sheet: document sources, consent, diversity."},communityData:{desc:"Full Pool: 3 classes x 100 = 300 images, 100 per object type, diverse",pool:"Class A 100 (hallway), Class B 100 (library), Class C 100 (canteen) = 300 total, covers 3 backgrounds",accuracy:"Single class: 72% mAP. Pooled: 89% mAP. Diversity boost: +17% - shows community power",privacy:"Anonymized: no faces, no names, objects only, local training, consent forms, data sheet"},ethicsLensWeekly:{benefits:"Solves real problem, community collaboration",harmed:"If deployed without audit, could misidentify",missing:"Long-term maintenance",trafficLight:"Green",mitigation:"Audit, human in loop, purpose limited to objects only, no faces",scenario:"Deploy in school - need approval, audit, opt-out"},lesson90:{prep:["Teachable Machine accounts","LabelImg","Objects 3 types","Diorama","micro:bits with buzzer/LED","Data pooling folder"],flow:[{phase:"Hook",time:"0-10",goal:"Detective mission",script:"We are School Detectives. Mission: find lost backpacks, count bottles recycled, show free chairs. We have 100 photos each, but alone accuracy 72% - not enough. If we pool with other classes, 300 photos, accuracy 89%! Community makes AI smarter. Today we build final detector and deploy with micro:bit alert. Like real AI team.",studentAction:"See accuracy jump chart 72%->89%",materials:"Chart",checkUnderstanding:"Green: Explains why pooling helps",ifStuck:"Orange: Show diversity: hallway vs library vs canteen"},{phase:"Direct",time:"10-25",goal:"End-to-end pipeline",script:"Pipeline: 1. Collect 100 diverse images - angles, light, background. 2. Annotate boxes tight. 3. Split 80 train 20 test. 4. Train Teachable Machine - watch loss go down. 5. Test on unseen images, calculate mAP. 6. Audit for bias (does it work in dark?). 7. Deploy to micro:bit. *Show pipeline diagram*. Data work 80% of time - not coding.",studentAction:"Map pipeline on paper",materials:"Pipeline poster",checkUnderstanding:"Green: Can order pipeline steps",ifStuck:"Orange: Provide steps scrambled to order"},{phase:"Mental Model",time:"25-40",goal:"Detective agency",script:"You are detective agency. Evidence = photos. Training = studying evidence. Test = new case. Your puppy (model) learned. Now pool evidence with other agencies - super detective! Sketch: school map, objects, data collection points. Why diversity matters: backpack on floor vs chair vs dark corner - model must see all.",studentAction:"Sketch detective map + data plan",materials:"Paper",checkUnderstanding:"Green: Includes diverse locations",ifStuck:"Orange: Prompt: where do backpacks appear?"},{phase:"Hands-On",time:"40-60",goal:"Train + pool",script:"Each class has 100 images. First train on your 100 only - note accuracy. Then pool 300 - retrain - see jump 72%->89%. *Live train*. Why jump? Diversity of backgrounds. Now annotate 5 more images that failed - add to dataset. Retrain again. This is iterative improvement. Real AI teams do this daily.",studentAction:"Train single vs pooled, compare mAP",materials:"Laptops, Teachable Machine",checkUnderstanding:"Green: Observes accuracy increase",ifStuck:"Orange: Use pre-annotated pooled set if time"},{phase:"Ethics",time:"60-75",goal:"Deploy responsibly",script:"We can detect objects, but should we? Checklist: 1. Objects only no faces? Yes. 2. Consent for photos? Yes. 3. Audit bias? Test dark/cluttered. 4. Human in loop? Staff verifies alert. 5. Purpose limited? Only lost-and-found, not tracking. 6. Data anonymized? Yes. Traffic light Green. If we added face recognition to identify owner, becomes Red. So we stay Green - object only.",studentAction:"Ethics checklist for deployment",materials:"Checklist",checkUnderstanding:"Green: Identifies Red if faces added",ifStuck:"Orange: Provide Green vs Red examples"},{phase:"Wrap",time:"75-90",goal:"Demo + rubric",script:"Demo day: place backpack in diorama, webcam detects, micro:bit beeps B 92%. Show to class. Rubric: data diversity (20), box tightness (20), accuracy >80% (20), audit (20), ethics (20). Each team presents 2min: problem, data, accuracy, audit, ethics. Vote best detector. Next unit: how AI learns from language.",studentAction:"Demo + presentation",materials:"Diorama, micro:bits",checkUnderstanding:"Green: Demo works, explains pipeline",ifStuck:"Orange: Pre-record demo video backup"}]},unplugged:{name:"Detective Agency Data Pool",roles:["Photographers (3 classes)","Annotators (draw boxes)","Trainers (learn patterns)","Testers (new images)","Auditors (bias check)","Deployers (micro:bit alert)"],steps:["Photographers each take 10 photos of object in different locations","Annotators draw boxes with yarn, record numbers","Trainers study boxes, memorize pattern: backpack = straps + zip","Testers bring new photo
