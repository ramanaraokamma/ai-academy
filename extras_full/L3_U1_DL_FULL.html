n:Ht,color:"from-violet-600 to-fuchsia-600",teacherEmpowerment:{whatIsThisReally:"Capstone: Students build image classifier with 3 classes, 100 images/class, 300 total pooled community dataset. Uses transfer learning: MobileNet pretrained on ImageNet (1.2M images) as feature extractor (frozen early layers), retrain only last layer with their data. This is how real products built — no one trains from scratch. They will collect data, train, evaluate confusion matrix, iterate. Confusion matrix shows which classes confused: e.g., cat vs dog 10% confusion means need more data at boundary. This mirrors 2012 AlexNet workflow but accessible. Deployment on micro:bit optional via TinyML.",why8thGradersNeedThis:"They go from playing with LEGO neuron to building real AI that works on their own data — empowerment. Seeing confusion matrix makes error concrete, not magic. Pooling 300 images from 3 classes shows community data matters — my 100 alone 75% accuracy, our 300 together 88% — collaboration beats solo. Privacy lesson: 100 images/class must be consented, no faces without permission.",realWorldBehindTheScenes:"Teachable Machine uses MobileNetV2 (3.4M params) pretrained. When you add 100 images/class, it extracts 1280 features per image (hidden layer), then trains tiny 3-class head with backprop 50 epochs. Runs in browser via TensorFlow.js, no server. Confusion matrix computed on hold-out 15% of your images. If cat vs dog confused, you add more cat/dog boundary images — active learning loop.",kidQuestionsAndAnswers:[{q:"Why 100 images? Why not 10?",a:"10 = overfit to background, 70% accuracy. 100 diverse = 85-90%. Diminishing after 200. 100 is sweet spot for class time vs accuracy — discovered by Google's Teachable Machine team testing with kids."},{q:"What is confusion matrix?",a:"Table showing what model predicted vs truth. Diagonal = correct. Off-diagonal = confusion. If cat row shows 80 cat, 15 dog, 5 rabbit, means 15 times thought cat was dog — need more cat vs dog data."},{q:"Can we put on micro:bit?",a:"Yes via TinyML: export model, convert to TensorFlow Lite, flash to micro:bit with camera (HuskyLens). Then micro:bit can classify without laptop — edge AI, like real product."}],vocabForTeacher:[{term:"Transfer Learning",teacherDef:"Reuse pretrained network features, retrain only last layers on new data.",kidDef:"Use already built LEGO castle base, only build top custom — don't rebuild base.",pron:"TRANS-fer LUR-ning",visualCue:"Frozen base + new top"},{term:"Confusion Matrix",teacherDef:"N×N table of true vs predicted counts, reveals class confusions.",kidDef:"Scoreboard showing which classes model mixes up.",pron:"con-FYOO-zhun MAY-trix",visualCue:"Grid with diagonal highlighted"},{term:"Dataset",teacherDef:"Collection of labeled examples used for training/evaluation.",kidDef:"Pile of practice songs with answer keys.",pron:"DAY-ta-set",visualCue:"Stack of photos with labels"},{term:"Edge AI",teacherDef:"Model runs on device (micro:bit) not cloud.",kidDef:"AI brain lives in device, works without internet.",pron:"edge A-I",visualCue:"micro:bit with brain icon"}]},mentalModelDeep:{name:"Building with LEGOs",teacherAnalogy:"You have huge LEGO set with instruction for castle (MobileNet pretrained on 1.2M images). You don't need to build castle from scratch. You take castle base (frozen layers that already know edges, textures, shapes) and only build custom tower on top (your 3 classes). Your 100 images/class are custom bricks for tower. If tower wobbles (confusion), you add more bricks at wobbly joint (boundary data). Community pool 300 images = 3 groups combine towers into stronger fortress. This is exactly how startups build AI products in 2024 — transfer learning, not from scratch.",studentAnalogy:"Teachable Machine is like getting a half-built LEGO castle (already knows edges, shapes). You add 100 bricks for cat, 100 for dog, 100 for rabbit to finish custom top. If cat and dog confuse, add more bricks where they connect.",sketchSteps:["Draw big rectangle = pretrained MobileNet base (frozen)","Draw small 3-block tower on top = your 3 classes head","Label arrow: 100 images/class -> trains only tower, base stays","Draw confusion matrix 3x3 grid, diagonal green = correct","Show adding images to off-diagonal cell to fix"],commonWrongModel:{wrong:"Need to train whole huge network from scratch with 100 images",right:"Use pretrained base (already knows vision) + small head trained on 100 images. 100 images insufficient for full net, sufficient for head — transfer learning."},bridgeQuestion:"Why does pooling 300 images from 3 groups beat 100 from one group? What does that say about data diversity and community?"},examplesBank:[{title:"Recycling Sorter",story:"School wants AI to sort paper, plastic, metal for recycling bins.",howItWorks:"3 classes: paper, plastic, metal. 100 images each with varied lighting, angles. MobileNet base extracts texture features, head learns material. Confusion: plastic vs paper shiny — add more shiny paper images.",whereToSee:"Teachable Machine export to micro:bit + servo sorting",discussionQ:"Who benefits if sorter works? Who if fails (contamination)?",whatIf:"Training images only clean recyclables, not dirty?",ethicsLens:{benefits:"Less waste, saves planet",harmed:"If fails, recycling contaminated, workers",missing:"Custodians who sort today",trafficLight:"Green"}},{title:"Plant Health Detector",story:"Farmers detect healthy vs diseased vs pest leaves.",howItWorks:"3 classes: healthy, diseased (spots), pest (holes). 100 leaves each. Model learns spot pattern vs hole pattern. Confusion matrix shows diseased vs pest 20% confused — need closer leaf photos.",whereToSee:"PlantVillage dataset",discussionQ:"Should AI replace farmer eye or assist?",whatIf:"Diseased images only from one farm?",ethicsLens:{benefits:"Early disease catch, food security",harmed:"If wrong, wrong pesticide used",missing:"Small farmers without phone",trafficLight:"Yellow"}},{title:"Sign Language ABC",story:"Deaf students build AI that recognizes A,B,C signs to teach hearing peers.",howItWorks:"3 classes: A,B,C hand shapes. 100 images each varied skin tones, backgrounds, left/right hands. Model learns hand shape not skin. Confusion: A vs C similar fist — need side view data.",whereToSee:"MediaPipe hands",discussionQ:"Who should own sign language AI? Deaf community?",whatIf:"Training only light skin hands?",ethicsLens:{benefits:"Inclusion, education",harmed:"If light skin only, fails dark skin signers — exclusion",missing:"Deaf creators, diverse hands",trafficLight:"Red"}},{title:"Basketball Shot Form",story:"Coach builds AI to detect good vs bad vs ugly shooting form.",howItWorks:"3 classes from video frames: good form, bad elbow, bad feet. 100 frames each. Pose estimation + classifier. Confusion: bad elbow vs good when baggy clothes — need tighter clothes data.",whereToSee:"HomeCourt app",discussionQ:"Should AI coach replace human coach?",whatIf:"Training only tall players?",ethicsLens:{benefits:"Feedback at home",harmed:"Body shaming, over-optimization",missing:"Short players, different bodies",trafficLight:"Yellow"}},{title:"Coral Reef Health",story:"Divers build AI to classify coral healthy, bleached, dead from underwater photos.",howItWorks:"100 underwater images each, varied depth, light. Model learns color texture. Confusion bleached vs dead 15% — need more bleached examples. Community pool from 3 dive groups.",whereToSee:"CoralNet",discussionQ:"Who owns ocean data?",whatIf:"Images only from clear water, not murky?",ethicsLens:{benefits:"Climate monitoring",harmed:"If inaccurate, false optimism",missing:"Local fishers knowledge",trafficLight:"Green"}},{title:"Mood Music Box",story:"Build box that plays happy, calm, energetic music based on your face.",howItWorks:"3 classes: smile, neutral, energetic (mouth open). 100 selfies each with consent. Model runs on micro:bit + speaker. Confusion happy vs energetic both smile — need more energetic jumping images.",whereToSee:"Teachable Machine + micro:bit speaker",discussionQ:"Should device guess mood? Privacy?",whatIf:"Training only your face, not friends?",ethicsLens:{benefits:"Fun, emotional awareness",harmed:"Emotion surveillance, manipulation",missing:"Consent for face data, cultural smile differences",trafficLight:"Red"}}],physicalComputing:{title:"Build Neural Net - Teachable Machine Advanced",concept:"Transfer learning: pretrained base + custom head, 100 images/class, confusion matrix, community pool 300.",materials:["Laptop + webcam","3 classes objects (recycling)","micro:bit + HuskyLens optional","Consent forms"],wiringDesc:"No wiring for base project. For edge: HuskyLens camera -> micro:bit via I2C (GND,GND, SCL P19, SDA P20). micro:bit reads class ID from HuskyLens, triggers servo on P0 to sort. Power servo separate.",codeBlocksPseudo:["In Teachable Machine: CREATE 3 classes, ADD 100 images each (diverse)","TRAIN 50 epochs, CHECK confusion matrix","IF confusion >15% ADD more boundary images","EXPORT to TensorFlow.js, TEST with new objects","OPTIONAL: Upload to micro:bit via TinyML, IF class=0 THEN servo 0deg ELSE IF class=1 THEN 90deg"],steps:["Define driving question: What 3 classes solve real problem?","Collect 100 images/class diverse backgrounds/angles/lighting, consent","Train in Teachable Machine, note accuracy","Check confusion matrix, identify confused pair","Add 20 more boundary images for confused pair, retrain","Test with 10 new unseen objects, log accuracy","Pool with 2 other groups = 300 images, retrain, compare accuracy solo vs community"],microbitNote:"micro:bit TinyML: After export, use https://teachablemachine.withgoogle.com/models/ -> Download -> TensorFlow Lite. Use Edge Impulse to convert to micro:bit hex. Flash. Test offline."},communityData:{title:"Community Pool 300 Images",goal:"Combine 3 groups ×100/class = 300 total, show accuracy boost from 75% solo to 88% pooled",count:"300 images, 3 classes",privacy:"No faces unless consent form signed, only objects. Images stored local, not cloud, deleted after unit. Show privacy note.",whyMatters:"Real AI needs community data. Solo data biased to your room. Pooled diverse rooms = robust. Also shows data dignity: who contributed, who benefits."},lesson90Detailed:{prep15min:["Set 3 stations with objects for 3 classes (paper/plastic/metal)","Print consent forms","Test Teachable Machine on teacher laptop","Prepare confusion matrix blank 3x3","Charge micro:bits + HuskyLens"],flow:[{time:"0-10 Driving Question",goal:"Choose real problem for 3 classes",teacherScriptExact:"We have 6 weeks of LEGO neurons, assembly line, hot/cold, light switch, practice. Today you build real AI. Driving question: What problem in school could AI solve with 3 classes? Recycling sorter? Plant health? Sign language? You have 2 min with partner pick one. We will build 3-class classifier, 100 images each, 300 total with other groups. Your model must work on new objects, not just trained ones — generalization.",studentAction:"Partner pick problem, write driving question",materials:"Problem cards",checkUnderstanding:"\uD83D\uDFE9 Driving question has 3 clear classes",ifStuck:"\uD83D\uDFE7 Offer 3 choices: recycling, plants, sign language ABC."},{time:"10-25 Data Collection Protocol",goal:"Collect 100 diverse images/class with privacy",teacherScriptExact:"Data collection rules: 1) No faces without consent form signed. 2) Diverse: 20 backgrounds, 5 angles, 3 lightings, 2 distances per class = 100. 3) Hold object, not just table. 4) One person collects, one checks diversity checklist. I will demo: 10 images of paper class — same background = bad, varied = good. Start collecting — 10 min, goal 30 images each class now, 70 homework.",studentAction:"Collect 30 images/class diverse, checklist",materials:"Laptops, objects, diversity checklist, consent forms",checkUnderstanding:"\uD83D\uDFE9 Images varied background/angle/light",ifStuck:"\uD83D\uDFE7 Pair with teacher to demo diverse vs same background."},{time:"25-45 Train + Confusion Matrix",goal:"Train, read confusion matrix, identify confusion",teacherScriptExact:"Upload 30 images to Teachable Machine, 3 classes. Click Train — watch loss go down, accuracy up — that's your hot/cold game from W3. Training done. Now test with 5 new objects not in training. Check confusion matrix: rows true, columns predicted. Diagonal green correct. Off-diagonal red confused. Which pair confused? Paper vs plastic? Why? Shiny paper looks like plastic — need more shiny paper images. That's active learning.",studentAction:"Train, test new objects, fill confusion matrix blank",materials:"Teachable Machine, confusion sheet",checkUnderstanding:"\uD83D\uDFE9 Can point to confused pair in matrix",ifStuck:"\uD83D\uDFE7 Highlight diagonal: these should be big numbers. Off-diagonal small."},{time:"45-60 Iterate + Ethics",goal:"Add boundary data, discuss privacy",teacherScriptExact:"You found confusion paper vs plastic 30%. Add 10 more images of shiny paper — boundary data. Retrain. Test again — confusion down to 10%? That's iteration. Real engineers do 10 iterations. Now ethics: we have 30 face images? Did we get consent? Show privacy note: images stored local, deleted after unit, no cloud. Traffic light for recycling sorter — Green? Who benefits? Planet. Who harmed if fails? Custodians? Who missing? Custodians voice in design. Discuss.",studentAction:"Add boundary images, retrain, ethics traffic light",materials:"Example recycling sorter",checkUnderstanding:"\uD83D\uDFE9 Adds boundary images, accuracy improves",ifStuck:"\uD83D\uDFE7 Give boundary image ideas: shiny paper, crumpled plastic."},{time:"60-80 Community Pool",goal:"Pool 3 groups = 300 images, compare solo vs pooled accuracy",teacherScriptExact:"Now community: combine with 2 other groups — your 30 + their 30 + other 30 = 90 per class, 270 total. Retrain on pooled data. Test same 5 new objects. Accuracy? Usually jumps from 75% solo to 88% pooled. Why? More diverse rooms, hands, lighting — better generalization. This is why big tech pools data from millions — but should they? Who owns pooled data? We will credit all contributors on model card.",studentAction:"Pool data via shared drive, retrain, compare solo vs pooled accuracy graph",materials:"Shared folder, accuracy comparison chart",checkUnderstanding:"\uD83D\uDFE9 Pooled accuracy > solo, can explain diversity",ifStuck:"\uD83D\uDFE7 Show bar chart: solo 75%, pooled 88% — visual boost."},{time:"80-90 Demo + Rubric",goal:"Demo to class, self-assess rubric",teacherScriptExact:"Demo time! Each group 60 sec demo: show 3 classes, live classify new object, show confusion matrix, tell one ethical consideration. Audience: does it work on new object? Is confusion low? Rubric: Driving question clear? 100 images diverse? Confusion matrix read? Iteration done? Ethics traffic light? Demo script ready? You have built real neural net — from LEGO neuron W1 to this. Next week you present to community. Exit: write one thing you would add with 1000 images.",studentAction:"60 sec demos, peer feedback, exit ticket",materials:"Rubric sheet, demo script template",checkUnderstanding:"\uD83D\uDFE9 Demo works on unseen object",ifStuck:"\uD83D\uDFE7 Allow pre-recorded video demo if live fails."}]},unpluggedActivityEnlarged:{roles:[{name:"Data Collector (2)",job:"Takes 100 photos diverse"},{name:"Trainer",job:"Clicks Train, watches loss curve"},{name:"Tester",job:"Brings 10 new unseen objects, tests, fills confusion matrix"},{name:"Ethicist + Recorder",job:"Checks consent, logs accuracy solo vs pooled, writes model card"}],materials:["Laptop","Objects 3 classes","Consent forms","Confusion matrix blank","Model card template"],steps:["1. Define 3 classes + driving question","2. Collect 100 images/class diverse (checklist: 20 bg, 5 angles)","3. Train 50 epochs, watch loss ↓","4. Test 10 unseen, fill 3x3 confusion matrix","5. Find max off-diagonal = most confused pair","6. Add 20 boundary images for that pair, retrain","7.
