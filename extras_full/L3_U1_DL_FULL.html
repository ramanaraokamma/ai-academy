0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",key:"1lielz"}]]);var Sn=L("ShieldAlert",[["path",{d:"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z",key:"oel41y"}],["path",{d:"M12 8v4",key:"1got3b"}],["path",{d:"M12 16h.01",key:"1drbdi"}]]);var xt=L("Sparkles",[["path",{d:"M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z",key:"4pj2yx"}],["path",{d:"M20 3v4",key:"1olli1"}],["path",{d:"M22 5h-4",key:"1gvqau"}],["path",{d:"M4 17v2",key:"vumght"}],["path",{d:"M5 18H3",key:"zchphs"}]]);var Pr=L("Timer",[["line",{x1:"10",x2:"14",y1:"2",y2:"2",key:"14vaq8"}],["line",{x1:"12",x2:"15",y1:"14",y2:"11",key:"17fdiu"}],["circle",{cx:"12",cy:"14",r:"8",key:"1e1u0o"}]]);var Nt=L("TriangleAlert",[["path",{d:"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3",key:"wmoenq"}],["path",{d:"M12 9v4",key:"juzpu7"}],["path",{d:"M12 17h.01",key:"p32p05"}]]);var Tn=L("Users",[["path",{d:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2",key:"1yyitq"}],["circle",{cx:"9",cy:"7",r:"4",key:"nufk8"}],["path",{d:"M22 21v-2a4 4 0 0 0-3-3.87",key:"kshegd"}],["path",{d:"M16 3.13a4 4 0 0 1 0 7.75",key:"1da9ce"}]]);var Ar=L("Wrench",[["path",{d:"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z",key:"cbrjhi"}]]);var Rr=L("Zap",[["path",{d:"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z",key:"1xq2db"}]]);var wc=He(St(),1),jh=Symbol.for("react.element");var em=Object.prototype.hasOwnProperty,tm=wc.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,nm={key:!0,ref:!0,__self:!0,__source:!0};function kc(e,t,n){var r,i={},o=null,a=null;n!==void 0&&(o=""+n),t.key!==void 0&&(o=""+t.key),t.ref!==void 0&&(a=t.ref);for(r in t)em.call(t,r)&&!nm.hasOwnProperty(r)&&(i[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)i[r]===void 0&&(i[r]=t[r]);return{$$typeof:jh,type:e,key:o,ref:a,props:i,_owner:tm.current}}var l=kc,d=kc;var pe=[{id:1,title:"What is Deep Learning? Neurons",subtitle:"Brain vs AI - The LEGO Brick",mentalModelName:"LEGO Neurons",icon:Ht,color:"from-violet-600 to-indigo-600",teacherEmpowerment:{whatIsThisReally:"Deep Learning is a subset of Machine Learning that uses multi-layered neural networks inspired by the 1957 Perceptron by Frank Rosenblatt. While Rosenblatt built a single-layer learning machine, modern deep learning stacks hundreds of layers. The true breakthrough came in 2012 when AlexNet, a deep convolutional net, crushed ImageNet competition, proving depth matters. In 2017, Transformers replaced recurrence with attention, but they are still deep nets at heart. Today, deep learning is the engine behind almost all modern AI, from vision to language, because it learns hierarchical features automatically from raw data instead of needing hand-engineered rules.",why8thGradersNeedThis:"Every time they unlock a phone with their face, watch a YouTube recommendation, or ask Siri a question, a deep neural network is deciding. Understanding that it's not magic but math — lots of tiny LEGO-like neurons adding and thresholding — demystifies their daily world. It shifts them from passive consumers to informed creators who know they can build one too.",realWorldBehindTheScenes:"Face ID doesn't store your photo. It runs your depth map through a deep net with over 5 million neurons trained on millions of faces. Each early layer detects edges and curves, middle layers detect eyes/nose shapes, final layers compute a face embedding — a 128-number fingerprint. If the new embedding is close enough to the stored one, it unlocks. All on device, in 0.3 seconds.",kidQuestionsAndAnswers:[{q:"Is AI brain same as human brain?",a:"No. Human brain has 86 billion neurons that are chemical, grow, and use ~20 watts. AI neuron is just math: y = activation( w1*x1 + w2*x2 + b ). It needs thousands of GPUs and megawatts. Similar idea (connected units), totally different stuff."},{q:"How many neurons in AI?",a:"Small demo: 100. ChatGPT-4 class: estimates point to ~1.7 trillion parameters, which act like connections between hundreds of billions of virtual neurons. Your phone Face ID model is ~5 million. So huge range — like comparing a LEGO hut to LEGO city."},{q:"Can AI learn like we do?",a:"Sort of. We learn from few examples, with curiosity and sleep. AI learns from millions of examples by nudging numbers (weights) tiny bits at a time to make less error. It doesn't understand like you do — it finds patterns in data, really well."}],vocabForTeacher:[{term:"Neuron",teacherDef:"Computational unit: weighted sum of inputs + bias passed through non-linear activation.",kidDef:"Tiny LEGO brick that takes in numbers, adds them up, decides if it should shout.",pron:"NOO-ron",visualCue:"Draw circle with 3 arrows in, 1 arrow out"},{term:"Weights",teacherDef:"Learnable parameters scaling each input's influence; adjusted during training.",kidDef:"How loud each connection is — volume knob for each LEGO connection.",pron:"wayts",visualCue:"Thick vs thin lines between dots"},{term:"Bias",teacherDef:"Offset that lets neuron activate even when all inputs are zero, shifting activation function.",kidDef:"The neuron's mood — grumpy needs more input, cheerful fires easier.",pron:"BYE-us",visualCue:"Small + / - battery inside circle"},{term:"Deep Learning",teacherDef:"Learning representations via deep (many-layer) neural nets trained end-to-end with backprop.",kidDef:"Stacking many LEGO neuron layers so it can learn complex things by itself.",pron:"deep LUR-ning",visualCue:"Stack of 5+ layers vs 1 layer"}]},mentalModelDeep:{name:"LEGO Neurons",teacherAnalogy:"Each artificial neuron is exactly like a LEGO brick with studs on top (inputs) and tubes on bottom (output). A single brick does nothing fancy — it just connects. But when you click 10 bricks, you get a wall. 10,000 bricks, you get a castle with turrets, gates, hidden functions. The power isn't in the brick, it's in the connection pattern and how strongly you press (weights). Rosenblatt's perceptron was literally one brick. AlexNet was 650,000 bricks.",studentAnalogy:"A neuron is a LEGO brick. Inputs are the bumps on top. The brick decides: if enough bumps are pressed, it lights up and passes the light to the next brick.",sketchSteps:["Draw big circle = LEGO brick top view (30 sec)","Add 3 arrows in labeled x1,x2,x3 with small 'w' on each (10 sec)","Inside circle write Σ + b then arrow to a lightbulb icon = ReLU (10 sec)","Show output arrow to next brick (5 sec)","Color brick if active, grey if not — that's firing! (5 sec)"],commonWrongModel:{wrong:"Kids think neuron stores a memory like a mini-brain",right:"Neuron is a dumb calculator: multiply, add, threshold. Memory is in the pattern of weights across thousands of them."},bridgeQuestion:"If one LEGO brick can't be a house, why can 1000 bricks? What does that tell us about why we need MANY neurons, not one super neuron?"},examplesBank:[{title:"Face Unlock Detective",story:"Maya's phone unlocks only for her, not her twin brother. She wonders if phone knows soul.",howItWorks:"Early neurons detect edges of eyes. Middle neurons detect distance between eyes. Late neurons make a face ID number. If number close to stored one, unlock.",whereToSee:"iPhone Face ID settings -> Face scan animation",discussionQ:"Should school use Face ID for attendance? What could go wrong?",whatIf:"What if training data had only light skin faces? Twin confusion up, bias up.",ethicsLens:{benefits:"Fast, no passwords",harmed:"Twins, kids with masks, darker skin misrecognized historically",missing:"Consent of kids whose photos trained model",trafficLight:"Yellow"}},{title:"YouTube Rabbit Hole",story:"Jamal watches one basketball video, then YouTube shows 10 more, then game highlights for 2 hours.",howItWorks:"Each video is turned into numbers by neurons. Your watch history is another set of numbers. Network learns which numbers go together to keep you watching.",whereToSee:"YouTube Home feed -> Why this video?",discussionQ:"Is it your choice or algorithm's choice?",whatIf:"What if algorithm rewarded learning not watch time?",ethicsLens:{benefits:"Finds stuff you love",harmed:"Addiction, filter bubbles, extreme content amplification",missing:"Teens perspective on time",trafficLight:"Red"}},{title:"Siri Mishears",story:"Lena says 'Call Mom' Siri calls 'Mum's Pizza'. One sound difference, huge error.",howItWorks:"Audio wave -> neurons detect phonemes (sounds) -> neurons combine into words -> neurons guess intent. Noisy room = weak signals, wrong guess.",whereToSee:"Voice keyboard waveform",discussionQ:"Who is responsible when voice assistant makes a bad call?",whatIf:"Trained only on adult male voices?",ethicsLens:{benefits:"Hands-free help",harmed:"Accents, kids voices underrepresented",missing:"Non-native speakers",trafficLight:"Yellow"}},{title:"Doctor AI Eye Scan",story:"In Kenya, an AI scans eye photos to catch blindness early, better than one doctor alone.",howItWorks:"Neurons first learn edges of blood vessels, then blobs of bleeding, then disease pattern. Trained on 100k eye images labeled by doctors.",whereToSee:"Google ARDA diabetic retinopathy project",discussionQ:"Should AI be allowed to diagnose without doctor?",whatIf:"If training images only from US hospitals?",ethicsLens:{benefits:"Saves sight, scales to villages",harmed:"If biased, misses disease in darker retinal images",missing:"Local doctors training data",trafficLight:"Green"}},{title:"Self-Driving Stop Sign Trick",story:"Researchers put 4 small stickers on stop sign. Human still sees stop, AI sees 45mph sign.",howItWorks:"Neurons learned 'red octagon = stop' but overfit to texture. Stickers changed pixel pattern enough to flip neuron activations in late layers.",whereToSee:"YouTube: adversarial examples stop sign",discussionQ:"How safe must AI be before we trust it with lives?",whatIf:"What if attacker can print stickers?",ethicsLens:{benefits:"Autonomy potential",harmed:"Public safety, pedestrians",missing:"Adversarial testing in streets",trafficLight:"Red"}},{title:"Spotify Daylist Vibes",story:"Spotify creates 'Tuesday Afternoon Laundry Pop' — weirdly accurate mood mix.",howItWorks:"Neurons embed songs into mood space: happy/sad, fast/slow, acoustic/electronic. Your listening time/place maps to same space. Match = playlist.",whereToSee:"Spotify Daylist title that changes 3x/day",discussionQ:"Does AI know your mood better than you?",whatIf:"If data only includes your happy songs?",ethicsLens:{benefits:"Discovery, joy",harmed:"Emotional manipulation, data surveillance",missing:"Artists paid less if AI loops same songs",trafficLight:"Yellow"}}],physicalComputing:{title:"LEGO Neurons - Build a Neuron",concept:"Weights as physical connection strength. Each LEGO connector thickness = weight magnitude.",materials:["LEGO bricks (20 per group)","Small rubber bands (weights)","Sticky notes","LED tea light (activation)"],wiringDesc:"No wires. Build: Base plate = input layer (3 bricks with numbers 0/1). Rubber band from each input brick to middle brick = weight (1 band = weak 0.2, 3 bands = strong 0.8). Middle brick = neuron body with sum written. If sum > 1.0, turn on LED tea light = firing.",codeBlocksPseudo:["IF sum(inputs * bands) > threshold THEN LED=ON ELSE OFF","CHANGE bands to make LED turn ON for pattern [1,1,0]"],steps:["Group picks input pattern","Connect bands = set weights","Calculate sum","Test LED firing","Tweak bands until desired output, note weights"],microbitNote:"micro:bit extension: Use pin0,1,2 as inputs (buttons), pin reading sums, show happy/sad icon if neuron fires. Code: on button A, read analog, if > 500 show Yes."},communityData:{title:"Class Neuron Gallery",goal:"Collect 1 neuron design per student",count:"30 designs → 30 different weight combos",privacy:"No names on bricks, only group numbers. Photos of bricks only, no faces.",whyMatters:"Shows same task can be solved with many weight combos — no single right brain wiring."},lesson90Detailed:{prep15min:["Print LEGO neuron mats (1 per group)","Pre-make 2 example neurons (one fires, one not)","Set up slide: Rosenblatt 1957 photo + LEGO","Test projector for neuron visual"],flow:[{time:"0-10 Warm-up",goal:"Activate brain vs AI prior ideas",teacherScriptExact:"Show me with fingers — how many neurons do you think in your brain? Now, how many in your phone Face ID? Turn to partner, you have 30 seconds each. I'm hearing guesses from 100 to billions — perfect tension. Today we build one artificial neuron with LEGOs and test if it can think.",studentAction:"Finger estimate, partner share, write guess on sticky",materials:"Sticky notes, markers",checkUnderstanding:"\uD83D\uDFE9 Can name one difference between brain and AI neuron? Thumbs up if yes.",ifStuck:"\uD83D\uDFE7 If stuck: point to pre-built LEGO neuron, ask 'where do numbers enter?' Guide to input bumps."},{time:"10-25 Direct Teach LEGO Model",goal:"Define neuron = weighted sum + bias + activation",teacherScriptExact:"Watch me draw a neuron in 60 seconds — circle, three arrows in labeled w1,w2,w3, sum inside, lightbulb out. This is not a brain cell, it's math. Multiply each input by its weight, add them, add bias — that's the mood. If sum > 0, light on. That's it. Rosenblatt in 1957 built this with motors and knobs. We use LEGO.",studentAction:"Copy sketch in workbook, label w1,w2,w3,b",materials:"Whiteboard, workbook p1",checkUnderstanding:"\uD83D\uDFE9 Exit slip: write formula y = ReLU(w1x1+w2x2+b) in own words",ifStuck:"\uD83D\uDFE7 Use color: red rubber band = strong weight, yellow = weak. Make it visual."},{time:"25-45 Physical Build",goal:"Set weights physically to make neuron fire for AND pattern",teacherScriptExact:"Your challenge: make neuron fire ONLY when input is 1 AND 1, not 1+0. You have rubber bands = weights. Start with all thin. Test pattern [1,1] — does LED light? If not, add bands. You are now training! Rosenblatt did this manually for weeks. You have 10 minutes. Trainer role sets bands, Tester reads inputs.",studentAction:"Roles: Trainer adjusts bands, Tester calls inputs, Recorder logs weights, Model holds LED",materials:"LEGO, bands, LED",checkUnderstanding:"\uD83D\uDFE9 Group demo: show pattern [1,1]=ON, [1,0]=OFF",ifStuck:"\uD83D\uDFE7 Give hint card: AND needs both weights ~0.6, bias -0.8. Let them place."},{time:"45-60 Examples + Ethics",goal:"Connect neuron to 2 real products with traffic light",teacherScriptExact:"We just built one neuron. Face ID uses five million. Let's read Face Unlock Detective example. I will read story, you read how it works. Now traffic light: Green safe? Yellow caution? Red danger? Hold up colored card. I see mostly Yellow for Face ID — why? Who might be harmed? Turn and talk.",studentAction:"Read example, hold traffic light cards, partner talk bias",materials:"Example cards, RYG cards",checkUnderstanding:"\uD83D\uDFE9 Can name one group harmed if data biased?",ifStuck:"\uD83D\uDFE7 Prompt: twin brothers, masks, dark skin — who gets locked out?"},{time:"60-80 Unplugged Trainer/Model",goal:"Human chain as neuron: students pass numbers",teacherScriptExact:"Clear LEGOs. New game: 3 Input students hold numbers 0 or 1. Trainer whispers weights. Model student must sum in head, decide fire or not, shout YES/NO. Tester checks answer key. Recorder writes weights that worked. Go! First team to get AND and OR correct wins LEGO trophy.",studentAction:"Human neuron chain, role rotation every 2 min",materials:"Number cards 0/1, weight cards",checkUnderstanding:"\uD83D\uDFE9 Model can explain sum > threshold = fire",ifStuck:"\uD83D\uDFE7 Let Recorder use calculator, reduce to 2 inputs."},{time:"80-90 Wrap + Exit",goal:"Define deep learning = many LEGO neurons stacked",teacherScriptExact:"Hold your neuron sketch up. One brick — dumb. Stack 100 bricks — can learn AND. Stack 5 million — Face ID. Stack 1 trillion — ChatGPT. Deep = many layers. Tomorrow we stack them into assembly line. Exit ticket: draw 1 neuron, label weight, bias, and write one ethical yellow/red.",studentAction:"Hold sketches, complete exit ticket",materials:"Workbook p2 exit",checkUnderstanding:"\uD83D\uDFE9 Exit: weight = volume knob analogy correct",ifStuck:"\uD83D\uDFE7 Provide sentence starter: A weight is like ___ because ___"}]},unpluggedActivityEnlarged:{roles:[{name:"Trainer",job:"Sets weights (whispers numbers)"},{name:"Model (Neuron)",job:"Sums inputs * weights + bias, decides FIRE"},{name:"Tester",job:"Calls input pattern and checks answer key"},{name:"Recorder",job:"Logs weights that worked, draws final neuron"}],materials:["Number cards 0/1","Weight cards 0.2,0.5,0.8","Threshold card -0.5","YES/NO signs"],steps:["1. Tester shows [1,0]","2. Trainer picks weights [0.8,0.2] whispers to Model","3. Model calculates: 1*0.8+0*0.2=0.8, minus 0.5 =0.3 >0 => FIRE YES","4. Tester checks: for AND, [1,0] should be NO -> wrong","5. Trainer adjusts weights","6. Repeat until correct for all 4 patterns","7. Recorder draws winning weights, class gallery walk"],variations:{fast:"Use 3 inputs, race to solve OR in <2 min",slow:"Use visual blocks, sum with fingers, no math"},whatTeacherObserves:["Does Trainer understand weight = importance?","Does Model do sum or guess?","Are they stuck on bias concept?"],commonMistakes:["Thinking bigger weight always better (can cause false fires)","Forgetting bias shifts threshold","Trainer changes both weights randomly, not one at a time"]},workbook:{diagramTask:"Draw neuron: 3 inputs -> circle Σ -> ReLU lightbulb -> output. Label w1,w2,w3,b.",layersTask:"N/A for W1 - focus single neuron",questions:["What is a weight in kid words?","Write AND weights that work","Is AI neuron same as brain? Why not?"],exitTicket:"Draw firing vs non-firing neuron, write ethics traffic light for Face ID and why.",rubric:["Neuron sketch has inputs, weights, sum, activation (2pts)","AND weights correct example (2pts)","Ethics identifies harmed group (2pts)"]}},{id:2,title:"Neural Networks - Layers",subtitle:"Input, Hidden, Output - Assembly Line",mentalModelName:"Assembly Line",icon:kt,color:"from-blue-600 to-cyan-600",teacherEmpowerment:{whatIsThisReally:"A neural network stacks neurons into layers. Input layer is raw data (pixels, sound), hidden layers learn increasingly abstract features (edges -> eyes -> faces), output layer makes decision. This hierarchy is why deep learning in 2012 with AlexNet (8 layers) beat shallow models: depth allows compositionality. Each layer transforms representation. The assembly line metaphor is precise: station 1 stamps metal, station 2 shapes door, station 3 paints, final is car. You can't paint before stamping. Similarly, you can't detect face before edges.",why8thGradersNeedThis:"They see TikTok filters add dog ears instantly. That's a layered net: layer1 finds face landmarks, layer2 warps ears, layer3 blends. Knowing layers lets them debug: if filter puts ears on hands, which layer failed? It also explains why YouTube knows them — their data flows through layers that build a profile.",realWorldBehindTheScenes:"TikTok's face filter pipeline: Input = 128x128 selfie pixels. Hidden layer 1 (conv) finds edges. Layer 2 finds nose, mouth corners. Layer 3 maps 68 face points. Layer 4 decides where to paste ears based on points. Output = new pixels with ears. Runs 60x/sec on phone GPU. If lighting bad, layer1 fails, whole chain wobbles.",kidQuestionsAndAnswers:[{q:"Why need hidden layers? Why not direct?",a:"Direct input->output would need to memorize every face. Hidden layers break problem into steps: edges, shapes, faces — reusable. Like assembly line vs one person building whole car alone."},{q:"How many layers is deep?",a:"1-2 hidden = shallow, like 1980s nets. 3+ = deep. AlexNet had 8, modern have 100-200. Transformers have 96 layers. More layers = can learn more complex assembly steps, but needs more data and compute."},{q:"What is hidden? Why hidden?",a:"Hidden because we don't tell it what to learn — we only show input and final answer. It invents its own intermediate steps. We call hidden because humans didn't label them; network discovered them."}],vocabForTeacher:[{term:"Layer",teacherDef:"Collection of neurons operating at same depth, sharing input from previous layer.",kidDef:"One station on assembly line — all workers at same step doing similar job.",pron:"LAY-er",visualCue:"Vertical column of circles"},{term:"Hidden Layer",teacherDef:"Intermediate representation not directly observed; learns abstract features.",kidDef:"Middle stations — you don't see their work directly, but car wouldn't exist without them.",pron:"HID-en LAY-er",visualCue:"Shaded columns between input and output"},{term:"Input/Output",teacherDef:"Input = raw features, Output = predictions (class scores, bounding box).",kidDef:"Input = raw LEGO pieces dumped in. Output = finished toy.",pron:"IN-put / OUT-put",visualCue:"Leftmost and rightmost columns"},{term:"Depth",teacherDef:"Number of hidden layers; deeper = more hierarchical composition.",kidDef:"How long the assembly line is. Longer line = fancier toy possible.",pron:"depth",visualCue:"Count columns"}]},mentalModelDeep:{name:"Assembly Line",teacherAnalogy:"Henry Ford's assembly line in 1913 cut Model T build from 12 hours to 90 minutes by specialization. Neural network layers are identical: layer 1 is the stamper, it only cares about edges. It passes its stamped sheets to layer 2, which only cares about shapes made of edges. Layer 2 never sees raw pixels, only edges. This division of labor lets each layer become expert. If you remove middle stations, you get junk. Depth = specialization depth.",studentAnalogy:"Layers are like making a pizza on a line: Person 1 flattens dough, Person 2 adds sauce, Person 3 adds cheese, Person 4 boxes it. Each person only does one job, but together they make pizza fast.",sketchSteps:["Draw 3 columns of circles: left 4 (input), middle 6 (hidden), right 2 (output)","Connect all from left to middle with light lines","Connect middle to right with darker lines","Label top: Station 1 finds edges, Station 2 finds faces","Arrow flow left->right: raw -> smart -> decision"],commonWrongModel:{wrong:"Layers work in parallel, all at once like crowd",right:"Layers work serially like assembly line: output of layer1 is input of layer2. Information flows forward step by step."},bridgeQuestion:"If station 2 is bad at its job, can station 3 fix it? What does that mean for why we need good training for every layer?"},examplesBank:[{title:"Pizza Factory Vision",story:"Domino's uses AI to check if pizza is cooked right before delivery.",howItWorks:"Layer1 sees crust edge color. Layer2 sees cheese bubble pattern. Layer3 decides perfect vs burnt. Trained on 10k pizza photos labeled by chefs.",whereToSee:"Domino's DOM Pizza Checker video",discussionQ:"Would you trust AI to judge your pizza? What if you're vegan?",whatIf:"Trained only on pepperoni pizzas?",ethicsLens:{benefits:"Less waste, quality",harmed:"Workers replaced, vegan pizzas flagged wrong",missing:"Workers who lose jobs",trafficLight:"Yellow"}},{title:"Instagram Dog Ears",story:"Filter adds dog ears that stick even when you turn head.",howItWorks:"Input layer = camera pixels. Hidden1 = face edges. Hidden2 = 68 landmarks. Hidden3 = ear anchor points. Output = ear pixels pasted at anchor.",whereToSee:"IG filter try -> move head fast, see lag",discussionQ:"Why do filters sometimes put ears on your hand?",whatIf:"Training faces only light skin, straight hair?",ethicsLens:{benefits:"Fun, creativity",harmed:"Beauty standards, self-esteem, bias for face shapes",missing:"Kids with facial differences",trafficLight:"Yellow"}},{title:"Gmail Spam Catcher",story:"Spam email promising million dollars goes to spam, not inbox.",howItWorks:"Input = words as numbers. Hidden1 = suspicious phrases. Hidden2 = sender reputation pattern. Hidden3 = urgency pattern. Output = spam score 0-1.",whereToSee:"Gmail -> Show original -> Spam reason",discussionQ:"Should AI delete email without you seeing?",whatIf:"Trained only on English spam?",ethicsLens:{benefits:"Saves time, blocks scams",harmed:"Important email in spam (job offer)",missing:"Non-English speakers",trafficLight:"Green"}},{title:"YouTube Thumbnail Clickbait Detector",story:"YouTube demotes videos with misleading screaming faces thumbnails.",howItWorks:"Layer1 detects face, layer2 detects mouth open + text BIG RED ARROW, layer3 predicts clickbait likelihood. Trained on human raters labeling clickbait.",whereToSee:"YouTube Creator Studio -> thumbnail test",discussionQ:"Is it censorship or quality control?",whatIf:"If definition of clickbait changes by culture?",ethicsLens:{benefits:"Better videos surface",harmed:"Creators who depend on style",missing:"Small creators",trafficLight:"Yellow"}},{title:"Apple Handwriting Keyboard",story:"You scribble 'hello' with Apple Pencil, it turns into typed text perfectly.",howItWorks:"Input = stroke points (x,y,time). Hidden1 = stroke directions. Hidden2 = letter parts. Hidden3 = letter sequences. Output = 'hello'. Trained on millions of handwritings.",whereToSee:"iPad Scribble",discussionQ:"Whose handwriting was used to train? Did they consent?",whatIf:"Left-handed writers missing from data?",ethicsLens:{benefits:"Accessibility, dyslexia help",harmed:"Left-handed, messy writers misread",missing:"Writers of non-Latin scripts",trafficLight:"Green"}},{title:"Tesla Lane Lines",story:"Tesla draws blue lane lines on screen, even in rain.",howItWorks:"Input = 8 camera feeds. Hidden1 = edge detectors per camera. Hidden2 = lane marking segments. Hidden3 = 3D road shape fusion. Output = drivable path.",whereToSee:"Tesla dashcam visualization",discussionQ:"Should car show you what it thinks or hide it?",whatIf:"Snow covers lane lines?",ethicsLens:{benefits:"Safety assist",harmed:"Overreliance, fails in snow",missing:"Roads without clear markings (rural, Global South)",trafficLight:"Red"}}],physicalComputing:{title:"Assembly Line - Layers as Stations",concept:"Each table is a layer. Material moves physically; you can't skip stations.",materials:["3 tables (stations)","Play-Doh or paper pieces","Task cards per station","Timer"],wiringDesc:"Table1 (Input): sort shapes by color. Put sorted piles in tray = output to Table2. Table2 (Hidden): combine 2 shapes into pattern. Tray to Table3. Table3 (Output): decide final toy car or not. Data flows physically.",codeBlocksPseudo:["STATION1: IF color=red THEN binA ELSE binB","STATION2: IF binA has 2 circles THEN make wheel","STATION3: IF has 4 wheels THEN car = YES"],steps:["Group moves to Table1, sorts 20 pieces in 60 sec","Carry tray to Table2, combine","Carry to Table3, decision","Repeat with roles swapped, time improvement","Discuss bottleneck = slow layer"],microbitNote:"micro:bit as conveyor belt timer: show arrow on LED moving left->right to indicate data flow. Button A = jam, stops line, shows X."},communityData:{title:"Layer Speed Challenge",goal:"Time each station, find slowest layer (bottleneck)",count:"10 groups × 3 stations = 30 timing data points",privacy:"Only times, no names",whyMatters:"In real nets, some layers slower. Engineers optimize slowest layer (quantization, pruning)."},lesson90Detailed:{prep15min:["Set 3 tables in line with signs Station1 Input, Station2 Hidden, Station3 Output","Prepare 20 colored shape pieces per group","Print task cards","Load TikTok filter demo video (offline)"],flow:[{time:"0-10 Warm-up",goal:"Feel assembly line speed",teacherScriptExact:"We have 3 tables. Goal: build a car from random pieces. You have 2 minutes, all do everything. Go! Chaos? Now we try assembly line: Table1 only sorts, Table2 only makes wheels, Table3 only assembles. Go again. Which was faster? That's why deep nets use layers — specialization beats chaos.",studentAction:"Chaotic build then line build, compare times",materials:"Shape pieces, timer",checkUnderstanding:"\uD83D\uDFE9 Can say layer = specialized station?",ifStuck:"\uD83D\uDFE7 Show Ford Model T video 30 sec — same idea 1913."},{time:"10-25 Direct Layers",goal:"Draw 3-layer net, label what each learns",teacherScriptExact:"Draw 4-6-2 network. Input 4 dots: they are pixels. Hidden 6 dots: what do they learn? Not pixels, they learn combinations — edges, then shapes. Output 2 dots: cat vs dog. Important: hidden layer never sees raw pixels, only what layer1 learned. So knowledge builds. In 2012 AlexNet proved 8 layers beat 2 layers. Why? More steps = more abstract ideas.",studentAction:"Copy diagram, label Station1: edges, Station2: shapes, Station3: cat/dog",materials:"Workbook p3",checkUnderstanding:"\uD83D\uDFE9 Label what each layer detects for face filter",ifStuck:"\uD83D\uDFE7 Use pizza analogy: dough, sauce, cheese, box — each adds one thing."},{time:"25-45 Physical Assembly",goal:"Run data through physical layers, measure bottleneck",teacherScriptExact:"Each group is a neural network factory. Table1 Input: sort by color in 60 sec. Tray must have 2 piles to go to Table2. Table2 Hidden: make wheels — need 2 same color circles = wheel. Table3 Output: 4 wheels = car. Trainer times each table. After first run, which table slowest? That's your bottleneck — in AI we call slow layer, we make it smaller or faster. Swap roles, beat time.",studentAction:"Physical flow, timing, role rotation",materials:"Tables, trays, timer, role bands",checkUnderstanding:"\uD83D\uDFE9 Can point to bottleneck table and say why",ifStuck:"\uD83D\uDFE7 Reduce pieces to 10, or allow 2 workers at slow table — that's parallel neurons."},{time:"45-60 Examples Ethics",goal:"2 examples with layers + traffic light",teacherScriptExact:"Open Instagram Dog Ears example. Read story. Now draw layers: Input pixels -> Hidden1 edges -> Hidden2 landmarks -> Output ears. Where could bias enter? If training faces only light skin, Hidden1 edge detector fails on dark skin, ears float. Hold traffic light. I see Yellow — why? Harmed group? Missing group? Turn talk 1 min.",studentAction:"Draw layer flow for dog filter, traffic light vote",materials:"Example sheet, RYG cards",checkUnderstanding:"\uD83D\uDFE9 Names hidden layer that could fail due to bias",ifStuck:"\uD83D\uDFE7 Hint: layer1 learns edges from data — if data missing dark faces, edges weak."},{time:"60-80 Unplugged Human Network",goal:"Human chain = live neural net",teacherScriptExact:"We are now a living neural net. 4 Input students hold colored cards. 6 Hidden students each have rule card: e.g., 'I fire if I see 2 reds'. Output 2 students: Cat vs Dog, they count how many hidden fired. Input shows pattern, hidden raise hands if rule matches, output decides. Tester checks real answer. If wrong, which hidden should change rule? That's training, but for next week. Go!",studentAction:"Human network forward pass, role play",materials:"Rule cards, color cards",checkUnderstanding:"\uD83D\uDFE9 Output student explains why they decided cat (count of hidden fires)",ifStuck:"\uD83D\uDFE7 Give rule cards simpler: Hidden1 = red detector, Hidden2 = circle detector."},{time:"80-90 Wrap Exit",goal:"Depth = power",teacherScriptExact:"Show your layer sketch. One layer — can only do simple lines. Three layers — can do faces. Hundred layers — can do ChatGPT. Deep learning breakthrough 2012 was proving depth matters. Your exit: draw 3-layer net for pizza checker, label each station's job, and write one sentence: what happens if hidden layer missing?",studentAction:"Sketch pizza net, exit ticket",materials:"Workbook p4",checkUnderstanding:"\uD83D\uDFE9 Pizza net has logical hidden job",ifStuck:"\uD83D\uDFE7 Provide sentence starter: If hidden missing, net can't ___ because ___"}]},unpluggedActivityEnlarged:{roles:[{name:"Input Squad (4)",job:"Hold raw data cards, show to hidden"},{name:"Hidden Squad (6)",job:"Each has secret rule, raise hand if input matches rule"},{name:"Output Deciders (2)",job:"Count hidden hands, decide final answer"},{name:"Quality Check",job:"Holds answer key, says correct/wrong, notes which hidden should change"}],materials:["Color/shape cards","Rule cards for hidden","Cat/Dog answer key (10 patterns)","Scoreboard"],steps:["1. Input shows pattern: red circle, blue square","2. Hidden check rule: e.g., Hidden3 rule = 2 circles → raises hand","3. Output counts: 3 hidden hands = maybe cat","4. Quality Check says actual = dog → error","5. Discuss: which hidden rule wrong?","6. Swap Input pattern","7. After 5 rounds, graph accuracy"],variations:{fast:"Add noise: Input flips one card randomly — robustness test",slow:"Only 2 hidden, focus on rule matching"},whatTeacherObserves:["Do hidden understand they only see inputs, not answer?","Does output explain counting logic?","Can QC identify which hidden to blame? (credit assignment)"],commonMistakes:["Hidden look at answer key instead of inputs (cheating = data leakage)","Output decides without counting hidden (ignoring layers)","All hidden same rule (no diversity, like dead neurons)"]},workbook:{diagramTask:"Draw 4-6-2 network. Label Input: pixels, Hidden: edges+shapes, Output: cat/dog.",layersTask:"For pizza checker: Station1 detects crust color, Station2 detects bubble, Station3 decides cooked.",questions:["Why not go directly Input->Output?","What does hidden layer learn that we didn't program?","Name one real product that uses layers."],exitTicket:"Sketch Instagram filter layers, traffic light + harmed group.",rubric:["Layer diagram correct 3 columns (1pt)","Each layer has plausible job (2pts)","Bias identification: training data missing (2pts)"]}},{id:3,title:"How Neural Networks Learn - Backprop",subtitle:"Hot and Cold Game - Getting Warmer",mentalModelName:"Hot and Cold Game",icon:Rr,color:"from-amber-500 to-orange-600",teacherEmpowerment:{whatIsThisReally:"Backpropagation, formalized by Rumelhart, Hinton, Williams in 1986, is how nets learn. It's calculus chain rule applied to compute how much each weight contributed to error, then nudging weights opposite error gradient. Imagine treasure hunt: you guess, someone says warmer/colder (loss), you step towards warmer (gradient descent). The magic is backprop figures out which leg (which weight) should move to get warmer, even for early layers, by passing error backwards. Before 1986, we couldn't train deep nets — we didn't know how to assign blame to hidden layers. Backprop solved credit assignment.",why8thGradersNeedThis:"They think AI is programmed like rules. Backprop shows AI learns from mistakes like they do — try, get feedback, adjust. Hot/Cold is exactly loss + gradient. When YouTube recommends wrong video and you click Not Interested, that's colder signal propagating back to adjust weights so next time warmer.",realWorldBehindTheScenes:"When you tap Not Interested on YouTube, you generate a loss: predicted 90% you like, actual 0%. Backprop computes gradient: which weights made it think you like? It reduces those weights tiny bit (learning rate 0.001). Over millions of taps, recommendations get warmer. Same for ChatGPT: when you thumbs down, loss backprops to make that answer less likely.",kidQuestionsAndAnswers:[{q:"Does AI feel hot/cold?",a:"No feelings. It computes a number called loss: how wrong it was. Hot = loss going down, Cold = loss going up. It's math, but feeling analogy helps."},{q:"Why backward? Why not forward?",a:"Forward = guess. Backward = learn. You need to know error at end to know which early step was wrong. Like you only know you took wrong turn at end of maze, then trace back."},{q:"How many times does it play hot/cold?",a:"Millions to billions. ChatGPT saw ~10 trillion words, each word is a hot/cold round. That's why needs so much compute — like practicing piano 10 million times."}],vocabForTeacher:[{term:"Loss",teacherDef:"Error metric: how far prediction from truth. Cross-entropy, MSE.",kidDef:"How cold you are — distance from treasure.",pron:"loss",visualCue:"Thermometer cold = high loss, hot = low loss"},{term:"Gradient",teacherDef:"Derivative of loss w.r.t weight: direction to adjust weight to reduce loss.",kidDef:"Which way is warmer? Arrow pointing to treasure.",pron:"GRAY-dee-ent",visualCue:"Arrow up = warmer, down = colder"},{term:"Backpropagation",teacherDef:"Chain rule to propagate gradient from loss backward through layers to each weight.",kidDef:"Passing the warmer/colder message back to each person in line.",pron:"back-prop-a-GAY-shun",visualCue:"Arrows backward along assembly line"},{term:"Learning Rate",teacherDef:"Step size for weight update: too big overshoots, too small slow.",kidDef:"How big a step you take when someone says warmer — baby steps or giant leaps.",pron:"LUR-ning rate",visualCue:"Small foot vs big foot icon"}]},mentalModelDeep:{name:"Hot and Cold Game",teacherAnalogy:"Classic kids game: one child hides treasure, seeker walks, hiders shout warmer/colder. Warmer = loss decreasing, Colder = loss increasing. Backprop is like having 100 people in a line, each person took one step. Seeker ends far from treasure. How to know who stepped wrong? You shout warmer/colder from end, each person asks next person 'was I warmer after my step?' Message travels backward. Each person adjusts their step slightly opposite direction that made it colder. That's gradient descent with backprop — distributed blame.",studentAnalogy:"You guess where treasure is. Friend says warmer or colder. You move a little towards warmer each time. Eventually you find treasure. Backprop is friend telling every layer if it was warmer or colder.",sketchSteps:["Draw treasure chest top right","Draw stick figure bottom left = guess","Draw dotted path with 'cold, cold, warm, warm, HOT!'","Add arrows backward from treasure to figure labeled loss signal","Write Loss = distance to treasure"],commonWrongModel:{wrong:"AI learns by memorizing correct answers",right:"AI learns by getting wrong, measuring how wrong (loss), and adjusting weights to be slightly less wrong next time — not memorizing, improving guess."},bridgeQuestion:"If friend always says warm even when you're cold, what happens to your learning? Connect to bad data / wrong labels."},examplesBank:[{title:"YouTube Not Interested Button",story:"You click Not Interested on a prank video. Next day, fewer pranks.",howItWorks:"Click = loss high (predicted like, actual dislike). Backprop pushes weights that caused prank recommendation down. Over time prank score lowers.",whereToSee:"YouTube 3-dot menu -> Not Interested",discussionQ:"Does Not Interested punish creator? Should you tell them?",whatIf:"Everyone clicks Not Interested on educational videos?",ethicsLens:{benefits:"User control, personalization",harmed:"Creators, educational content suppressed",missing:"Why user dislikes — not captured",trafficLight:"Yellow"}},{title:"Tesla Shadow Mode",story:"Tesla drivers steer differently than autopilot would. Tesla learns from difference.",howItWorks:"Autopilot predicts steering angle, human does different angle. Difference = loss. Backprop adjusts steering weights. Fleet of 1M cars = 1M hot/cold games per second.",whereToSee:"Tesla AI Day video shadow mode",discussionQ:"Should your driving be used to train AI without pay?",whatIf:"Human driver is bad driver?",ethicsLens:{benefits:"Safer autopilot",harmed:"Bad driving learned if not filtered",missing:"Consent of drivers, pedestrians in data",trafficLight:"Red"}},{title:"Grammarly Fix",story:"You accept Grammarly suggestion 'their -> there'. Grammarly gets warmer.",howItWorks:"Model predicted 60% their, you chose there. Loss computed, backprop makes there more likely after same context next time.",whereToSee:"Grammarly -> see suggestion",discussionQ:"Is Grammarly learning your style or standard English?",whatIf:"Trained only on formal essays, you write slang?",ethicsLens:{benefits:"Better writing",harmed:"Homogenizes language, loses slang",missing:"Non-native English, dialects",trafficLight:"Yellow"}},{title:"Snapchat Lens Fails on Dark Skin",story:"Lens works on light skin, but dog ears float on dark skin — cold.",howItWorks:"Training loss was low for light skin, high for dark skin but dataset had 90% light. Gradient from dark examples too small, model stays cold for them. Need re-weight loss.",whereToSee:"Test same lens on different skin tones",discussionQ:"How to make model warm for everyone?",whatIf:"Fix by adding more dark skin data?",ethicsLens:{benefits:"Awareness of bias",harmed:"Dark skin users excluded",missing:"Dark skin testers in lab",trafficLight:"Red"}},{title:"Chess AI Learns Blunder",story:"Chess.com AI loses to same trap 3 times, then never again.",howItWorks:"Losing = high loss. Backprop traces which board evaluation weights led to bad move. Those weights decreased. Next time different move.",whereToSee:"Chess.com -> Game Review -> mistakes",discussionQ:"Is AI learning like you learning chess? Better?",whatIf:"AI only plays against weak players?",ethicsLens:{benefits:"Personalized coach",harmed:"Cheating if used during game",missing:"Beginners who need slower learning",trafficLight:"Green"}},{title:"Siri Learns Your Name",story:"You correct Siri pronunciation of 'Xochitl' 3 times, 4th time it gets right.",howItWorks:"Correction = loss. Backprop on-device adjusts pronunciation weights for that name only (personalization). Not sent to Apple (privacy).",whereToSee:"iPhone Contacts -> Add pronunciation",discussionQ:"Should personal learning stay on phone or go to cloud?",whatIf:"Everyone has unique names, model must keep many?",ethicsLens:{benefits:"Privacy-preserving learning",harmed:"If cloud, name data leak",missing:"Names from other cultures",trafficLight:"Green"}}],physicalComputing:{title:"Hot and Cold - Backprop Game",concept:"Loss = distance, Gradient = direction to move. Physical steps = weight updates.",materials:["Blindfold","Treasure (candy)","Grid tape on floor","Bell for warmer/colder"],wiringDesc:"Grid = weight space. Student blindfolded = model guessing. Class shouts warmer/colder = loss signal. Trainer moves student 1 step toward warmer direction = gradient descent. Repeat 10 steps.",codeBlocksPseudo:["LOSS = distance(treasure, guess)","IF warmer THEN keep direction ELSE turn","WEIGHT = WEIGHT - learningRate * gradient"],steps:["Hide treasure on grid","Blindfolded student starts corner","Class shouts warm/cold after each step","Trainer records path","After 10 steps, measure loss reduction","Switch treasure, try bigger steps (high LR) vs tiny steps (low LR)"],microbitNote:"micro:bit as loss meter: show number decreasing as you get warmer. Use accelerometer to tilt = weight change, display loss on LEDs."},communityData:{title:"Hot/Cold Steps Dataset",goal:"Log how many steps to find treasure with small vs big learning rate",count:"15 groups × 2 LRs = 30 trials",privacy:"No personal data",whyMatters:"Shows learning rate tradeoff: too big = overshoot, too small = slow — same in real training."},lesson90Detailed:{prep15min:["Tape 5x5 grid on floor","Hide 2 treasures","Print loss meter cards 10 to 0","Test bell","Prepare learning rate cards Small 0.1 vs Big 0.9"],flow:[{time:"0-10 Warm-up Treasure Hunt",goal:"Feel loss and gradient",teacherScriptExact:"I hid candy. One volunteer blindfolded is AI model guessing. You are loss function — shout warmer if closer, colder if farther. AI moves one step at a time toward warmer. Go! Count steps to treasure. That count is training time. Now we move treasure — retrain.",studentAction:"Blindfold hunt, shouting warmer/colder, counting steps",materials:"Grid, blindfold, candy",checkUnderstanding:"\uD83D\uDFE9 Can explain warmer = loss down?",ifStuck:"\uD83D\uDFE7 Let student peek first 2 steps, then blind."},{time:"10-25 Backprop Direct",goal:"Define loss, gradient, backward pass",teacherScriptExact:"Draw treasure top right, guess bottom left, path with cold/warm labels. Loss = distance to treasure. Gradient = which way is warmer. Backprop = passing warmer/colder back along path. In 1986 Rumelhart showed how to pass message to every weight, even first layer, using chain rule. Before that, deep nets couldn't learn — we didn't know who to blame. Now we do. Show formula: newWeight = oldWeight - LR * gradient.",studentAction:"Copy treasure map, label loss, gradient, LR",materials:"Workbook p5",checkUnderstanding:"\uD83D\uDFE9 Write in own words: backprop = passing blame backward",ifStuck:"\uD83D\uDFE7 Use assembly line: if final car bad, you tell station3, station3 tells station2, etc."},{time:"25-45 Physical LR Experiment",goal:"Test small vs big learning rate",teacherScriptExact:"Two rounds. Round1 Small LR: AI moves baby steps (1 tile). Round2 Big LR: giant steps (3 tiles). Which finds treasure faster? Which overshoots? Record steps. In real AI, LR 0.001 is baby steps — safe but needs 1000s of rounds. LR 0.9 giant leaps — fast but jumps over treasure. Good AI uses schedule: big steps early, baby late. You just discovered learning rate scheduling — 2024 technique!",studentAction:"Two hunts, log steps, compare overshoot",materials:"Grid, LR cards, log sheet",checkUnderstanding:"\uD83D\uDFE9 Can say big LR risks overshoot",ifStuck:"\uD83D\uDFE7 Demo on board: draw loss curve, show big step jumping over valley."},{time:"45-60 Examples Ethics",goal:"YouTube Not Interested = loss signal",teacherScriptExact:"Read YouTube example. When you click Not Interested, you give loss: predicted like, actual dislike. That loss backprops to reduce prank weights. But what if many people click Not Interested on educational videos because boring? Then educational weights go down — cold for education, warm for pranks. That's filter bubble. Hold traffic light. Is personalization always good? Who missing?",studentAction:"Read, traffic light, discuss filter bubble",materials:"Example cards",checkUnderstanding:"\uD83D\uDFE9 Explain Not Interested as loss",ifStuck:"\uD83D\uDFE7 Role play: student is YouTube, teacher clicks Not Interested, student must adjust."},{time:"60-80 Unplugged Backprop Chain",goal:"Human chain passes gradient backward",teacherScriptExact:"Human assembly line again, but now with error. Input shows cat, hidden fire, output says dog — wrong! Output shouts 'WRONG! I needed cat!' = loss. Output tells hidden: 'You fired but shouldn't' — hidden reduces rule weight. Hidden tells input: 'You showed red but needed...' Input adjusts. Message goes backward. That's backprop! Do 5 rounds, watch accuracy go from 20% to 80%. You just trained a human neural net!",studentAction:"Chain forward pass, then backward blame pass, adjust rule cards",materials:"Rule cards, loss bell",checkUnderstanding:"\uD83D\uDFE9 Can pass message backward: who to blame?",ifStuck:"\uD83D\uDFE7 Use string: pull string from output to hidden to input — physical backprop."},{time:"80-90 Wrap Exit",goal:"Backprop = learning from mistakes",teacherScriptExact:"Hold treasure map. One guess — dumb. Ten warmer/colder moves — smart. That's training: millions of guesses, each time measuring loss, moving weights toward warmer. Next week: ReLU — when should neuron fire? Exit: draw loss going down over time, label axes, and write one sentence: what is learning rate in hot/cold game?",studentAction:"Draw loss curve, exit ticket",materials:"Workbook p6",checkUnderstanding:"\uD83D\uDFE9 Loss curve decreasing, LR = step size",ifStuck:"\uD83D\uDFE7 Provide axes: Steps vs Loss, curve down."}]},unpluggedActivityEnlarged:{roles:[{name:"Model (Blindfolded)",job:"Guesses position, moves"},{name:"Loss Function (Shouter)",job:"Shouts warmer/colder, holds loss number"},{name:"Gradient Arrow (Pointer)",job:"Points direction of warmer"},{name:"Weight Updater (Mover)",job:"Moves model 1 step toward arrow, records weight"}],materials:["5x5 grid","Treasure","Loss cards 10-0","Arrow","Step log"],steps:["1. Loss shows 10 (far)","2. Model guesses corner","3. Loss shouts cold/warm + shows new loss 8","4. Gradient points to warmer direction","5. Updater moves model 1 step, logs new weight = position","6. Repeat until loss 0","7. Plot loss vs steps, compare small vs big LR"],variations:{fast:"Add 2 treasures, model must find both — multi-task",slow:"Use number line 1-10 instead of grid"},whatTeacherObserves:["Does Loss give consistent signal?","Does Updater move correct direction?","Do they log decreasing loss?"],commonMistakes:["Shouting warm when actually cold (noisy label)","Moving opposite gradient (sign error)","Using big LR and overshooting, thinking more steps = always better"]},workbook:{diagramTask:"Draw treasure map: guess path, label warm/cold, loss decreasing.",layersTask:"Show forward arrow (guess) and backward arrow (loss) on assembly line.",questions:["What is loss in kid words?","Why backward? What does it tell?","What happens if LR too big?"],exitTicket:"Plot loss vs training steps for good training, bad LR too big, bad LR too small.",rubric:["Loss = distance explained (2pts)","Backprop = passing blame back (2pts)","LR effect correct (2pts)"]}},{id:4,title:"Activation Functions - ReLU",subtitle:"When to Fire - Light Switch",mentalModelName:"Light Switch",icon:Nn,color:"from-fuchsia-600 to-purple-600",teacherEmpowerment:{whatIsThisReally:"Activation function decides if neuron fires. Sigmoid (1957-2010) was like dimmer switch 0-1, but caused vanishing gradient — deep nets couldn't learn. ReLU (Rectified Linear Unit), popularized by Nair & Hinton 2010 and proven in AlexNet 2011-12, is simply max(0, x): if input negative, output 0 (off), if positive, output input (on). This sparsity and linear positive part lets gradients flow, enabling 8+ layer training that sparked deep learning revolution. It's biologically plausible: real neurons have threshold too.",why8thGradersNeedThis:"They flip light switches daily. ReLU is same: below threshold, dark (0). Above, brightness equals how hard you push. Understanding threshold explains why some YouTube recommendations fire and others don't — sum must exceed bias. It also explains why AI can be confident (big positive) or silent (zero).",realWorldBehindTheScenes:"ChatGPT uses GELU, a smooth ReLU cousin. But idea same: each neuron's output is zero if negative, else something positive. When you type 'capital of France?', early neurons detecting question words fire, later neurons for geography fire, neurons for cooking stay off (0). Sparsity = only 10% of 1.7T params active per word — saves compute, like only lights on in rooms you use.",kidQuestionsAndAnswers:[{q:"Why not always fire?",a:"If all neurons fire always, net can't distinguish patterns — everything looks same bright. Need some off to create pattern: which neurons on matters. Like black and white pixels make image; all white is blank."},{q:"What is dead ReLU?",a:"If weights make input always negative, ReLU always 0, never fires, never learns — dead. Like light switch broken off. Fix: use Leaky ReLU tiny leak when negative."},{q:"ReLU vs Sigmoid?",a:"Sigmoid = dimmer 0-1, always some light, but gradients tiny deep down → learning stops. ReLU = sharp on/off, gradient 0 or 1, so deep layers still learn. That's why AlexNet switched in 2011 and won."}],vocabForTeacher:[{term:"Activation",teacherDef:"Function applied to weighted sum to introduce non-linearity, enabling complex functions.",kidDef:"Decision: should I shout? If sum big enough, shout (fire), else stay quiet.",pron:"ak-ti-VAY-shun",visualCue:"Light switch off/on"},{term:"ReLU",teacherDef:"f(x)=max(0,x); zero for negative, identity for positive; sparse, gradient 0/1.",kidDef:"Light switch: if push negative (pull), light off (0). If push positive, brightness = push.",pron:"RAY-loo",visualCue:"Graph hockey stick flat then diagonal"},{term:"Threshold / Bias",teacherDef:"Bias shifts sum before activation; determines firing threshold.",kidDef:"How hard you must push switch to turn on — grumpy bias needs hard push.",pron:"THRESH-hold",visualCue:"Dashed line at 0"},{term:"Non-linearity",teacherDef:"Without non-linear activation, deep net = single linear layer; can't learn curves.",kidDef:"Without switch, all LEGOs same — can't make interesting shape, only straight line.",pron:"non-lin-ee-AR-i-tee",visualCue:"Straight line vs kinked line"}]},mentalModelDeep:{name:"Light Switch",teacherAnalogy:"Old house had dimmer knob — sigmoid — always a little light, but you could never get true dark, and wiring heated up (vanishing gradient). Modern house has motion sensor switch — ReLU — either completely dark (0) or fully on with brightness proportional to motion (x). It's energy efficient (sparse, 50% off) and response is instant (gradient 1). AlexNet in 2012 was first to wire whole house with ReLU switches and showed it learns 6x faster than dimmers.",studentAnalogy:"ReLU is like a light switch: if number negative, light OFF (0). If positive, light ON and brightness = number. So -3 => OFF, 2 => brightness 2.",sketchSteps:["Draw number line -3 to +3","Mark 0 threshold with switch icon","Left of 0 draw flat line at 0 labeled OFF","Right of 0 draw diagonal line up labeled brightness = input","Add example: input -2 => 0, input 3 => 3"],commonWrongModel:{wrong:"ReLU makes negative positive (like absolute value)",right:"ReLU makes negative zero (off), not positive. -5 becomes 0, not 5. Important for sparsity."},bridgeQuestion:"If all inputs negative, what does ReLU output? What does that mean for next layer — does it get any info?"},examplesBank:[{title:"Flashlight in Tent",story:"In camping game, you only shout if you see something scary > threshold.",howItWorks:"Sum = scary points. ReLU: if sum <0, stay silent (0). If >0, shout loud = sum. Others only listen if you shout, saving energy.",whereToSee:"Play flashlight tag",discussionQ:"Is it better to always whisper or only shout when needed?",whatIf:"Threshold too high?",ethicsLens:{benefits:"Energy saving, clear signal",harmed:"If threshold too high, miss danger",missing:"Quiet kids never heard",trafficLight:"Green"}},{title:"Instagram Like Button Threshold",story:"You double-tap only if photo excitement > your internal threshold.",howItWorks:"Neurons compute excitement score. ReLU: if score negative (boring), no like (0). If positive, like strength = score. Instagram sums likes (activations).",whereToSee:"IG like animation",discussionQ:"Should apps have higher threshold to like to reduce addiction?",whatIf:"Threshold lowered to make you like more?",ethicsLens:{benefits:"Expression",harmed:"Addiction, dopamine loop if threshold low",missing:"Users who never get likes",trafficLight:"Yellow"}},{title:"Smoke Detector",story:"Detector beeps only if smoke > threshold, else silent.",howItWorks:"Sensor sum = smoke particles. ReLU: if sum < threshold, output 0 (silent). If > threshold, beep loud = sum - threshold. Prevents false alarms from toast.",whereToSee:"School smoke detector",discussionQ:"False alarm vs missed fire — which worse? Where set threshold?",whatIf:"Threshold too sensitive?",ethicsLens:{benefits:"Safety",harmed:"If biased threshold in some neighborhoods, slower response",missing:"Deaf people need visual ReLU",trafficLight:"Green"}},{title:"TikTok For You Page Gate",story:"Video only goes to For You if early viewers watch >50% (activation).",howItWorks:"Score = watch time - threshold. ReLU: if negative, 0 views to FYP (gate closed). If positive, pushed to more users proportionally.",whereToSee:"TikTok analytics watch time",discussionQ:"Is 50% fair gate? Who decides threshold?",whatIf:"Threshold favors dance vs education?",ethicsLens:{benefits:"Quality filter",harmed:"Educational videos with slower start suppressed",missing:"New creators without followers",trafficLight:"Red"}},{title:"Nike Self-Lacing Shoe",story:"Shoe tightens only if foot pressure > threshold.",howItWorks:"Pressure sensors sum, ReLU: if sum < threshold (foot not in), motor 0. If > threshold, motor tightens with force = sum. Saves battery when empty.",whereToSee:"Nike Adapt video",discussionQ:"Should shoe decide tightness or you?",whatIf:"Threshold wrong for kids feet?",ethicsLens:{benefits:"Accessibility for disabled",harmed:"If threshold miscalibrated, circulation cutoff",missing:"Kids, elderly feet data",trafficLight:"Yellow"}},{title:"ChatGPT Safety Filter",story:"ChatGPT refuses if harmfulness score > threshold.",howItWorks:"Safety classifier outputs harm score. ReLU-like gate: if score negative (safe), allow. If positive (unsafe), output 0 = block and replace with 'I can't...'. Threshold tuned for safety.",whereToSee:"Try prompt that triggers refusal",discussionQ:"Who sets safety threshold? Should it be same for all cultures?",whatIf:"Threshold too strict blocks medical info?",ethicsLens:{benefits:"Prevents harm",harmed:"Censorship, blocks legitimate info",missing:"Cultural context",trafficLight:"Red"}}],physicalComputing:{title:"Light Switch - ReLU Demo",concept:"Physical switch shows off/on + brightness proportional to input.",materials:["Flashlight or LED + potentiometer","Number cards -5 to +5","Threshold tape at 0"],wiringDesc:"Potentiometer = input sum. LED brightness = ReLU output. If pot turned left (negative), LED off. Turn right (positive), LED brightness increases. Mark 0 threshold with tape.",codeBlocksPseudo:["READ pot value -512 to +512","IF value <0 THEN LED=0 ELSE LED=value","SHOW graph: flat then diagonal"],steps:["Student picks number card -3","Sets pot to -3, observes LED off","Picks +4, LED bright 4","Tests 5 numbers, logs ReLU output","Finds dead zone (all negative)","Discusses sparsity: how many LEDs off?"],microbitNote:"micro:bit: Use pin0 reading, if <0 show 0 LEDs, if >0 show bar graph height = value. Shake to randomize input."},communityData:{title:"ReLU Sparsity Count",goal:"Count how many neurons off (0) vs on for random inputs",count:"30 students × 10 random inputs = 300 ReLU outputs",privacy:"Only numbers",whyMatters:"Real nets ~50% sparsity with ReLU — half off saves compute, like brain."},lesson90Detailed:{prep15min:["Set up LED + pot demo","Print number cards -5 to +5","Draw ReLU graph large on board","Prepare threshold tape","Print smoke detector story"],flow:[{time:"0-10 Warm-up Light Switch",goal:"Feel threshold",teacherScriptExact:"I have flashlight. If I say number negative, light off. Positive, light on brightness = number. You shout off/on. Ready? -3! +2! -10! +5! See pattern? Negative = 0, positive = itself. That's ReLU, invented 2010, made deep learning work in 2012. Your brain neurons do same — threshold then fire.",studentAction:"Shout off/on, track pattern",materials:"Flashlight",checkUnderstanding:"\uD83D\uDFE9 Can apply ReLU to -2 =>0, +3=>3",ifStuck:"\uD83D\uDFE7 Show graph: flat left, diagonal right. Point to sides."},{time:"10-25 ReLU Direct",goal:"Graph ReLU, explain why not sigmoid",teacherScriptExact:"Draw number line, 0 threshold with switch. Left flat 0 OFF, right diagonal ON. Formula f(x)=max(0,x). Old activation sigmoid was dimmer 0-1, always some light, gradients tiny deep, learning stopped — vanishing gradient. ReLU gradient is 0 if off, 1 if on — clean, fast. AlexNet used ReLU and trained 6x faster, won 2012. That's breakthrough. Without ReLU, no ChatGPT.",studentAction:"Copy graph, compute ReLU for -4,-1,0,2,5",materials:"Workbook p7",checkUnderstanding:"\uD83D\uDFE9 Compute ReLU correctly, explain why 0 for negative",ifStuck:"\uD83D\uDFE7 Use switch metaphor: pull switch wrong way = off, not reverse light."},{time:"25-45 Physical LED",goal:"See ReLU physically, test dead ReLU",teacherScriptExact:"Each group has pot = input sum, LED = output. Turn pot left = negative, what happens? Off. Turn right = positive, brightness = turn. Now try to make LED always off — turn fully left, that's dead ReLU, never fires, never learns. In real nets 10% die. Fix? Leaky ReLU lets tiny light even negative. Test: set to -1, -2, -3 all off. Set to +1,+2 brightness up. Log 6 values.",studentAction:"Manipulate pot, log ReLU table, find dead zone",materials:"LED, pot, log sheet",checkUnderstanding:"\uD83D\uDFE9 Log shows 0 for negatives, = input for positives",ifStuck:"\uD83D\uDFE7 Mark threshold with tape, label OFF side vs ON side."},{time:"45-60 Examples Ethics",goal:"Smoke detector threshold ethics",teacherScriptExact:"Read Smoke Detector example. Detector beeps only if smoke > threshold. If threshold too high, misses fire — dangerous. Too low, beeps for toast — annoying. Who sets threshold? For ChatGPT safety filter, who decides what is harmful? If threshold too strict, blocks medical info. Too loose, allows harm. Hold traffic light for ChatGPT filter — I see Red — why? Who missing? Cultural context?",studentAction:"Read, discuss threshold setting, traffic light",materials:"Examples",checkUnderstanding:"\uD83D\uDFE9 Can explain threshold tradeoff: safety vs censorship",ifStuck:"\uD83D\uDFE7 Ask: should school fire alarm be super sensitive or not?"},{time:"60-80 Unplugged Switch Chain",goal:"Human ReLU chain",teacherScriptExact:"Human assembly line again, but now each hidden student is light switch. Input gives number -2, hidden computes sum, then applies ReLU: if sum negative, they sit down (off, 0), if positive stand up bright (on). Output only counts standing hiddens. Show pattern [1,0] -> hidden sums -1, 2, 0.5 -> after ReLU: 0,2,0.5 => 2 standing. Output decides. If many sit, sparsity! Count how many off — that's brain saving energy.",studentAction:"Human ReLU: sit if negative, stand if positive, count sparsity",materials:"Number cards, sum cards",checkUnderstanding:"\uD83D\uDFE9 Applies ReLU rule: sit for negative",ifStuck:"\uD83D\uDFE7 Give sum cards pre-computed, focus only on ReLU decision."},{time:"80-90 Wrap Exit",goal:"ReLU = efficient firing",teacherScriptExact:"Hold ReLU graph up. Negative -> 0 OFF, positive -> brightness = input ON. That's why deep nets work — half off, half on, clear signal, no vanishing. Dead ReLU = always off, useless. Next week: Training needs data + compute + time = practice. Exit: draw ReLU graph, label dead zone, and write one sentence: why is ReLU better than dimmer for deep nets?",studentAction:"Draw graph, exit ticket",materials:"Workbook p8",checkUnderstanding:"\uD83D\uDFE9 Graph correct, mentions gradient flows",ifStuck:"\uD83D\uDFE7 Sentence starter: ReLU better because gradient is ___ not tiny."}]},unpluggedActivityEnlarged:{roles:[{name:"Sum Calculator",job:"Adds inputs*weights, shouts sum"},{name:"Switch (ReLU)",job:"If sum<0 sits (0), if >0 stands and shouts sum"},{name:"Counter",job:"Counts how many Switches standing (sparsity)"},{name:"Output",job:"Decides based on standing count"}],materials:["Sum cards","OFF/ON signs","Sparsity counter sheet"],steps:["1. Input shows pattern","2. Sum Calculator computes sum e.g., -1.5","3. Switch: -1.5 <0 => sit, output 0","4. Next sum 2.3 => stand, output 2.3","5. Counter counts standing vs sitting","6. Repeat 10 patterns, plot sparsity %","7. Introduce dead Switch: always sits, discuss fix"],variations:{fast:"Add Leaky ReLU: if negative, crouch (0.1) not sit",slow:"Use number line, physically move left/right of 0"},whatTeacherObserves:["Do Switches correctly map negative->sit?","Do they understand 0 = no signal to next layer?","Can Counter compute sparsity %?"],commonMistakes:["Thinking -3 => 3 (absolute) not 0","Thinking 0 is still signal (it's silence)","Forgetting bias shifts threshold"]},workbook:{diagramTask:"Draw ReLU: flat at 0 for x<0, diagonal y=x for x>0. Label OFF and ON. Mark threshold 0.",layersTask:"For 3 hidden neurons with sums -2, 0.5, 3, write ReLU outputs 0,0.5,3 and count sparsity 1/3 off.",questions:["What is ReLU in one sentence?","What is dead ReLU? Give example.","Why ReLU helped AlexNet win 2012?"],exitTicket:"Graph ReLU, show dead zone, write why half neurons off saves compute.",rubric:["Graph correct flat + diagonal (2pts)","Dead ReLU explained (2pts)","Sparsity benefit mentioned (2pts)"]}},{id:5,title:"Training Deep Nets - Data + Compute + Time",subtitle:"Practice Makes Perfect",mentalModelName:"Practice Makes Perfect",icon:Cr,color:"from-indigo-600 to-violet-600",teacherEmpowerment:{whatIsThisReally:"Training = adjusting weights via backprop over many examples, requiring three ingredients: Data (examples), Compute (GPUs to do math), Time (many epochs). Scaling laws (Kaplan et al 2020) show loss decreases predictably with more of each. AlexNet 2012 needed 1.2M images, 2 GPUs, 6 days. GPT-4 needs trillions of tokens, 25k GPUs, months, $100M. No data = memorizing, not learning. No compute = can't process. No time = underfit. Practice Makes Perfect is exact: 10 hours violin vs 10,000 hours master.",why8thGradersNeedThis:"They think AI is instant magic. Reality: training ChatGPT took months and cost more than their school building. Understanding data+compute+time explains why their Teachable Machine works poorly with 5 images/class but well with 100, why bias happens (not enough diverse data), and why AI isn't free — environmental cost. Also teaches growth mindset: practice matters for humans and AI.",realWorldBehindTheScenes:"Training Teachable Machine with 100 images/class: each image 224x224x3 = 150k numbers. Forward pass 150k -> weights -> prediction. Loss = wrong? Backprop updates weights tiny. Repeat 50 epochs (50×300=15k forward passes). On laptop GPU ~2 min. Same loop for GPT-4 but 10 trillion numbers × 100k epochs across 25k GPUs. Cost $100M electricity. Data = internet + books, Compute = GPU farm, Time = months.",kidQuestionsAndAnswers:[{q:"Can we train AI without data?",a:"No. Weights start random — like baby knowing nothing. Data is experience. No data = random guesses forever. Even 1 image is data, but 100 diverse images much better — like practicing violin with 1 song vs 100 songs."},{q:"Why needs so much time?",a:"Each weight needs many small nudges. If big nudges, overshoot. So tiny learning rate 0.001 means 1000s of steps to move weight from 0.1 to 0.8. Like moving piano 1mm at a time to perfect spot."},{q:"What is overfitting?",a:"Practicing only one song perfectly but can't play new song — memorized, not learned. AI that sees same 10 cat images 1000 times memorizes them, fails on new cat. Fix: more diverse data, stop early."}],vocabForTeacher:[{term:"Epoch",teacherDef:"One full pass over entire training dataset.",kidDef:"One full practice session of all songs once.",pron:"EE-pok",visualCue:"Circle arrow around dataset"},{term:"Overfitting",teacherDef:"Model memorizes training data, fails to generalize to new data.",kidDef:"Can play only practiced song, not new song — memorized not learned.",pron:"over-FIT-ing",visualCue:"Curve fitting dots too wiggly"},{term:"Compute",teacherDef:"FLOPs, GPU hours needed to process data.",kidDef:"How many pianos (GPUs) and how long you practice.",pron:"com-PYOOT",visualCue:"Stack of GPUs"},{term:"Generalization",teacherDef:"Performance on unseen data; goal of training.",kidDef:"Can play new song you've never seen, using patterns from practice.",pron:"gen-er-al-i-ZAY-shun",visualCue:"Training vs test gap"}]},mentalModelDeep:{name:"Practice Makes Perfect",teacherAnalogy:"10-year-old violin student: 1 hour practice = squeaky. 100 hours = Twinkle Twinkle. 1000 hours = concert piece but shaky on new piece. 10,000 hours = master, can sight-read new piece. Deep net identical: 10 images = random, 100 = 70% accuracy, 10k = 95% but overfits if same 10k repeated. Need diverse practice (data), good teacher feedback (loss), many hours (epochs), and good instrument (compute). The 2012 breakthrough wasn't new algorithm, it was finally enough data (ImageNet 1.2M) + enough compute (2 GPUs) + time (6 days) to practice enough.",studentAnalogy:"Training AI is like practicing instrument: more different songs (data), better instrument (compute), more hours (time) = better musician. Practice 5 times = bad, 100 times = good.",sketchSteps:["Draw 3 buckets: Data (stack of photos), Compute (GPU chip), Time (clock)","Draw arrow to brain getting bigger with practice","Draw graph: X=Practice hours, Y=Skill going up but flattening","Add second curve: overfit after too much same song practice goes down on new song","Label sweet spot: just enough practice, diverse songs"],commonWrongModel:{wrong:"More practice always better, even same song repeated",right:"More diverse practice better. Same song 1000x = overfitting, memorizing not learning. Need new songs + rest (validation)."},bridgeQuestion:"If you practice basketball only free throws, will you be good at 3-pointers? What does that tell us about needing diverse data?"},examplesBank:[{title:"Teachable Machine Needs 100 Images",story:"With 5 cat pics, model thinks all cats must be on sofa (background). With 100 diverse, learns cat itself.",howItWorks:"5 images = low data diversity, model overfits to background. 100 images varied backgrounds, angles, lighting = model must find true cat features (edges, fur) to reduce loss across all.",whereToSee:"Teachable Machine train with 5 vs 50 images, test new cat",discussionQ:"How many is enough? Is 100 enough for all cats in world?",whatIf:"100 images but all white cats?",ethicsLens:{benefits:"Shows data matters",harmed:"If diverse data missing, bias",missing:"Rare cats, shelter cats",trafficLight:"Yellow"}},{title:"Duolingo Streak Practice",story:"Duolingo says practice 15 min daily beats 2 hours one day.",howItWorks:"Spaced repetition = many epochs small LR, better generalization than one big cram (high LR). Brain and AI both need time to consolidate weights.",whereToSee:"Duolingo streak, skill decay",discussionQ:"Is daily small practice better than weekend cram? Why?",whatIf:"Only practice easy words?",ethicsLens:{benefits:"Learning science",harmed:"Addictive streak shaming",missing:"Kids without daily phone access",trafficLight:"Green"}},{title:"AlphaGo 30M Games",story:"AlphaGo played 30 million games against itself before beating human champion.",howItWorks:"Self-play generates data. Each game = loss signal. Compute = 1000s TPUs for months. Time = 40 days. Result superhuman. No human could play that much.",whereToSee:"AlphaGo documentary",discussionQ:"If AI practices 30M games, can human ever catch up?",whatIf:"Trained only on human games, not self-play?",ethicsLens:{benefits:"Superhuman strategy discovery",harmed:"Game enjoyment if AI unbeatable",missing:"Human creativity",trafficLight:"Green"}},{title:"Facial Recognition Bias 2018",story:"Study showed face AI 99% accurate light male, 65% dark female — data gap.",howItWorks:"Training data 80% light male. Loss low for them, high for dark female but few examples, gradient small. Model never got enough practice on dark female faces.",whereToSee:"Gender Shades study Joy Buolamwini",discussionQ:"Whose face data was missing? How fix?",whatIf:"Add more dark female data?",ethicsLens:{benefits:"Exposes bias",harmed:"Dark women misidentified, arrested wrongly",missing:"Dark women in dataset creation",trafficLight:"Red"}},{title:"ChatGPT Training Cost",story:"Training GPT-4 cost ~$100M, electricity of 1000 homes for a year.",howItWorks:"Compute = 25k A100 GPUs × 90 days × 24h. Data = 10T tokens. Time = months. Scaling law: loss ↓ with compute ↑, but cost ↑ exponentially. Environmental impact.",whereToSee:"News GPT-4 training cost",discussionQ:"Should we spend that energy? Who benefits? Who pays environmental cost?",whatIf:"If every school trained own GPT?",ethicsLens:{benefits:"Powerful tool",harmed:"Climate, concentration of power in few companies",missing:"Global South energy access",trafficLight:"Red"}},{title:"Your Phone Keyboard Learns You",story:"Phone keyboard after 1 week predicts your slang, after 1 month almost reads mind.",howItWorks:"On-device training: data = your typing, compute = phone chip at night, time = weeks. Personalization improves without cloud. Privacy-preserving.",whereToSee:"iOS Keyboard predictions change",discussionQ:"Should keyboard learn on phone or cloud? Tradeoff?",whatIf:"Keyboard trained on everyone, not just you?",ethicsLens:{benefits:"Personal, private",harmed:"If cloud, typing data leak",missing:"People who type little (elderly)",trafficLight:"Green"}}],physicalComputing:{title:"Practice - Training as Instrument",concept:"More diverse practice = better generalization. Same song repeated = overfit.",materials:["Instrument or ball","5 song cards (same song) vs 5 diverse song cards","Timer","Accuracy score sheet"],wiringDesc:"No wires. Group A practices same free throw 20x (overfit). Group B practices 5 different shots 4x each (diverse). Test both on new shot (3-pointer). B wins = generalization.",codeBlocksPseudo:["FOR epoch 1 to 5: practice same song","TEST new song => low score (overfit)","FOR epoch 1 to 5: practice 5 different songs","TEST new song => high score (generalize)"],steps:["Pick instrument or basketball","Group A: repeat same task 20x","Group B: 5 tasks x4","Test both on unseen task","Log scores","Discuss data diversity matters more than quantity"],microbitNote:"micro:bit as practice counter: button A = practice rep, shows count, plays happy tune when diverse practice >10."},communityData:{title:"Practice vs Performance Graph",goal:"Plot accuracy vs number of diverse examples",count:"Each group tests 10,30,100 images, logs accuracy",privacy:"Only accuracy numbers",whyMatters:"Shows scaling law: more diverse data → better accuracy, but diminishing returns, and overfitting if not diverse."},lesson90Detailed:{prep15min:["Print song cards: same song vs diverse","Set up basketball hoop or instrument corner","Prepare accuracy sheets","Load Teachable Machine demo","Draw 3 buckets Data/Compute/Time"],flow:[{time:"0-10 Warm-up Practice",goal:"Feel overfit vs generalize",teacherScriptExact:"Two teams. Team Same: shoot free throw 10 times same spot. Team Diverse: 2 free throws, 2 3-pointers, 2 layups, 2 left, 2 right. Now both teams shoot new shot — half-court. Which team better? Usually diverse team wins. That's training: same data repeated = overfitting, diverse = generalizing. AI same.",studentAction:"Shoot, compare, discuss",materials:"Ball, hoop",checkUnderstanding:"\uD83D\uDFE9 Can say diverse practice > same practice for new task",ifStuck:"\uD83D\uDFE7 Use music: play same song 5x vs 5 different songs, test new song."},{time:"10-25 Direct Data+Compute+Time",goal:"Define 3 ingredients, scaling law",teacherScriptExact:"Draw 3 buckets: Data pile of photos, Compute GPU chip, Time clock. All three needed. 2012 AlexNet: Data 1.2M images ImageNet, Compute 2 GPUs (GTX 580), Time 6 days. Without any one, no deep learning. GPT-4: Data 10 trillion words, Compute 25k GPUs, Time 3 months, $100M. Scaling law: more = better, but needs all three. Also overfitting: practicing same 10 images 1000 times = memorizing, fails new cat.",studentAction:"Copy 3 buckets, label AlexNet vs GPT-4",materials:"Workbook p9",checkUnderstanding:"\uD83D\uDFE9 Names 3 ingredients",ifStuck:"\uD83D\uDFE7 Analogy: cake needs flour (data), oven (compute), time baking — missing one = no cake."},{time:"25-45 Physical Data Diversity Test",goal:"Test 10 vs 100 images in Teachable Machine quick",teacherScriptExact:"Open Teachable Machine. Class1: 10 cat images same white cat sofa. Train 10 sec, test new orange cat — fails, predicts dog. Why? Overfit to sofa. Now add 90 diverse cats: different colors, backgrounds, angles. Retrain. Test same orange cat — now correct! See accuracy jump from 40% to 85%? That's data diversity. Compute same, time same, data changed, result changed. Data matters most for you.",studentAction:"Train 10 vs 100, test, log accuracy",materials:"Laptops, Teachable Machine, image sets",checkUnderstanding:"\uD83D\uDFE9 Accuracy higher with diverse data",ifStuck:"\uD83D\uDFE7 Provide pre-made 10 and 100 sets, focus on testing."},{time:"45-60 Examples Ethics",goal:"Facial recognition bias = data gap",teacherScriptExact:"Read Gender Shades example. 2018 study: light male 99% accurate, dark female 65%. Why? Data 80% light male. Loss low for light, so model practiced light faces 80% time, dark female 5% — like basketball team practicing only free throws, then surprised can't do 3-pointers. Is that fair? Hold traffic light — Red! Who harmed? Who missing from data collection? How fix? More diverse data, but also who collects?",studentAction:"Read, traffic light Red, discuss missing",materials:"Example sheet",checkUnderstanding:"\uD83D\uDFE9 Links bias to data imbalance",ifStuck:"\uD83D\uDFE7 Show pie chart of dataset: 80% light male slice huge."},{time:"60-80 Unplugged Epochs",goal:"Human epochs, track loss decreasing",teacherScriptExact:"Human net again. This time train for 5 epochs: same 10 patterns repeated 5 times, each epoch adjust weights via backprop. After epoch1 accuracy 50%, after epoch3 80%, after epoch5 95% but test on new patterns drops to 60% — overfit! Now train with 20 diverse patterns 2 epochs: train 85%, test 80% — better generalization. Plot train vs test accuracy — gap = overfit. That's why we need validation set — songs you never practice but test on.",studentAction:"Run 5 epochs same data vs diverse, plot train/test gap",materials:"Pattern cards, accuracy graph",checkUnderstanding:"\uD83D\uDFE9 Can spot overfit gap",ifStuck:"\uD83D\uDFE7 Use 2 colors: blue train accuracy up, red test accuracy up then down."},{time:"80-90 Wrap Exit",goal:"Practice makes perfect, but diverse",teacherScriptExact:"Hold 3 buckets sketch. Data = different songs, Compute = instrument quality, Time = hours. All three needed. Overfit = same song repeated. Generalization = new song good. Scaling law: more diverse data + compute + time = better, but cost huge — GPT-4 $100M, climate cost. Is it worth? Tomorrow final project: you will train with 300 images community pool. Exit: write one overfit example and how to fix with diverse data.",studentAction:"Sketch, exit ticket",materials:"Workbook p10",checkUnderstanding:"\uD83D\uDFE9 Overfit fix = diverse data or early stop",ifStuck:"\uD83D\uDFE7 Starter: Overfit is like ___ fix by ___"}]},unpluggedActivityEnlarged:{roles:[{name:"Data Collector",job:"Provides images (pattern cards)"},{name:"Trainer",job:"Adjusts weights after each epoch"},{name:"Validator",job:"Holds unseen test set, checks generalization"},{name:"Time Keeper",job:"Counts epochs, plots accuracy vs time"}],materials:["Pattern cards train 10 same vs 20 diverse","Test set 10 unseen","Accuracy graph","Epoch counter"],steps:["1. Epoch1: Train on 10 same cats, Trainer adjusts","2. Validator tests on unseen, logs 40%","3. Epoch2-5 repeat same data, train acc 100%, test stays 40% = overfit","4. Switch to diverse 20 cats","5. Epoch1 train 60% test 55%","6. Epoch2 train 85% test 80% = generalization","7. Plot both curves, compare gap"],variations:{fast:"Add compute limit: only 10 sec per epoch",slow:"Use 5 patterns only, focus on test vs train"},whatTeacherObserves:["Do they see train 100% but test low = overfit?","Does Time Keeper plot gap?","Can Validator explain why diverse better?"],commonMistakes:["Thinking 100% train accuracy = good (ignores test)","More epochs always better (not if same data)","Confusing data quantity with diversity"]},workbook:{diagramTask:"Draw 3 buckets Data/Compute/Time -> bigger brain. Draw overfit vs generalize curves.",layersTask:"Label train vs test accuracy, mark overfit gap.",questions:["What 3 ingredients needed? What happens missing one?","What is overfitting? Give basketball example.","Why did Gender Shades happen?"],exitTicket:"Write your practice plan for Teachable Machine: how many images, how diverse, how long?",rubric:["3 ingredients named (1pt)","Overfit explained with example (2pts)","Diverse data fix mentioned (2pts)"]}},{id:6,title:"PROJECT 1: Build a Neural Net",subtitle:"Teachable Machine Advanced - 3 Classes 100/class",mentalModelName:"Building with LEGOs",ico
