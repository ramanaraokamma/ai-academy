!km.hasOwnProperty(r)&&(o[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)o[r]===void 0&&(o[r]=t[r]);return{$$typeof:gm,type:e,key:i,ref:l,props:o,_owner:wm.current}}var cn=vm,u=Oc,c=Oc;var sr=[{id:"W7",num:7,title:"What is Classification?",subtitle:"Teaching computers to sort into boxes",mentalModel:"Bouncer at Club",mentalEmoji:"\uD83E\uDDCD‍♂️\uD83D\uDEAA",accent:"from-orange-500 to-amber-500",teacherEmpowerment:{whatIsThisReally:"Classification is one of the oldest tasks in machine learning, formalized by R.A. Fisher in 1936 with Linear Discriminant Analysis for sorting iris flowers. The Perceptron in 1957 showed a single neuron could learn a boundary. It stayed academic until 2012 when AlexNet proved deep classification could beat humans on ImageNet. Teachable Machine in 2017 made it click-to-train for kids. Today every spam filter, face unlock, and photo search is a classifier deciding which box something belongs to.",whyNeed:"7th graders already live inside classifiers. Their inbox sorts spam, TikTok sorts 'for you', and their phone sorts faces. If they don't understand sorting by features, they think AI is magic or always right. Teaching classification builds their power to question boxes and build better ones.",realWorld:"Gmail's spam classifier looks at 100+ features: sender reputation, word 'lottery', links, etc. It calculates P(spam | features). If probability > threshold, it goes to spam. Google tunes threshold for high precision (don't want real mail in spam) even if recall drops. YouTube's content classifier scans thumbnails + transcript to label 'made for kids'. It was trained on millions of human-labeled videos, then reviewed when creators appeal.",kidQuestions:[{q:"Is a classifier always right?",a:"No. It guesses based on patterns it saw. Like a bouncer who only saw red IDs for adults might reject a blue adult ID. We measure how often it guesses right with a confusion matrix. Good classifiers are 90-95%, never 100%."},{q:"Can AI be 100% accurate?",a:"In real life, no. Data is messy, lighting changes, people write new spam tricks. If someone claims 100% on real data, they probably tested on the same data they memorized (overfitting). In lab with 20 images it might say 100%, but give it 20 new photos and it drops."},{q:"Who labels the data?",a:"People! For Gmail, thousands of contractors label emails as spam/not spam for months. For waste sorter, YOU label photos recyclable/compost. No labels = no learning. That means label quality decides everything, and labeling jobs have bias and ethics."}],vocab:[{term:"Classifier",teacherDef:"Function f(x) -> discrete label, learns decision boundary from labeled data.",kidDef:"Computer that sorts things into boxes",pron:"KLASS-ih-fy-er",visual:"Draw 2 boxes, arrow from messy pile to boxes labeled by feature"},{term:"Feature",teacherDef:"Measurable property used for decision, e.g. color, word count, edge.",kidDef:"Clue the computer looks at",pron:"FEE-chur",visual:"Magnifying glass over object highlighting color/shape/text"},{term:"Label",teacherDef:"Ground-truth category assigned by human annotator.",kidDef:"Correct answer sticker we put on data",pron:"LAY-bel",visual:"Sticker tag on photo: 'recyclable'"},{term:"Decision Boundary",teacherDef:"Surface in feature space separating classes.",kidDef:"Invisible line where bouncer says yes/no",pron:"de-SIH-zhun BOWN-dree",visual:"Dots red/blue with line between them"}]},mentalModelDeep:{name:"Bouncer at Club",teacherAnalogy:"A bouncer doesn't know everyone. He checks ID features: age number, photo match, expiration. He learned rules from manager training (labeled examples). If features meet rule, you enter '21+ Club'. If not, 'Under 21 Line'. Classifier does same: it was trained on examples and now applies learned rule to new inputs, sometimes wrong if fake ID or bad lighting.",studentAnalogy:"Your computer is a bouncer. Photos come to door. Bouncer checks clues like color and shape. If it looks like training photos of 'dog', you go in Dog box. If not, Cat box.",sketchSteps:["Draw big door with two lines: LEFT line, RIGHT line","Stick figure bouncer with clipboard 'RULES'","Pile of photos coming","Zoom bubble: ID shows 'Furry, 4 legs'","Two boxes behind: DOGS ✅ CATS ✅ + one confused in middle"],commonWrong:{wrong:"Kids think classifier looks at whole picture like human and 'understands' it.",right:"It only checks tiny clues we gave it. Change clue, decision changes."},bridgeQ:"If bouncer only learned to check shoe color, what happens when someone wears new shoes? What other clues should we teach?"},examplesBank:[{title:"Spam Bouncer",story:"Mia gets 50 emails a day. Half are lottery scams. Gmail sorts them before she sees them.",howItWorks:"Classifier checks features: contains 'You won!!!', unknown sender, many links. Learns boundary from millions labeled spam/not spam.",where:"Gmail spam folder",discussionQ:"Should spam filter ever put real email in spam? Which mistake is worse?",whatIf:"If we only label English spam, what happens to Spanish spam?",ethicsLens:{benefits:"Saves time, safety",harmed:"Small business newsletters flagged",missing:"Non-English speakers underrepresented",trafficLight:"Yellow"}},{title:"Face Unlock Sorter",story:"Jamal's phone unlocks only for his face, not his sister's.",howItWorks:"Face embedding = 128-number feature. Classifier compares distance to stored face; if close enough, it's you.",where:"iPhone/Android face unlock",discussionQ:"What if you wear mask?",whatIf:"Training only on light skin?",ethicsLens:{benefits:"Convenient security",harmed:"Misidentifies darker skin more",missing:"Diverse faces",trafficLight:"Red"}},{title:"Photo App Sorter",story:"Google Photos auto groups 'Beach' vs 'Dog' without you tagging.",howItWorks:"Trained on millions of labeled beach images, learns color + texture features.",where:"Photos search",discussionQ:"Who decides categories?",whatIf:"Only beach photos from California?",ethicsLens:{benefits:"Find memories fast",harmed:"Cultural categories missing",missing:"Global beach types",trafficLight:"Green"}},{title:"School Hallway Bouncer",story:"Library scanner beeps only if book tag is 'checked out'.",howItWorks:"RFID feature 0/1 classifies allowed/not allowed.",where:"Library gates",discussionQ:"What if tag broken?",whatIf:"Battery dead changes feature?",ethicsLens:{benefits:"Prevents theft",harmed:"False beep embarrassment",missing:"Accessibility",trafficLight:"Green"}},{title:"Waste Bin Bouncer",story:"Recycling plant belt sorts plastic vs paper by camera.",howItWorks:"Camera + air puff classifier; learns from labeled waste images.",where:"MRF facilities",discussionQ:"Who cleans data?",whatIf:"Dirty plastic labeled recyclable?",ethicsLens:{benefits:"Saves planet",harmed:"Workers replaced",missing:"Informal waste pickers",trafficLight:"Yellow"}},{title:"Language Bouncer",story:"YouTube auto-detects if video is English vs Spanish.",howItWorks:"Audio features: frequency patterns classify language.",where:"Auto captions",discussionQ:"What about mixed language?",whatIf:"Only US English in training?",ethicsLens:{benefits:"Accessibility",harmed:"Dialects misclassified",missing:"Code-switching data",trafficLight:"Yellow"}}],physicalComputing:{title:"Button Classifier",goal:"Feel classification with one feature: button pressed.",microbit:"A+B = 2 features, classify shake gesture.",noTech:"Paper boxes: RECYCLE vs COMPOST. Students sort 20 cards using only color feature.",wiring:"micro:bit buttons -> serial -> Teachable Machine as input? Actually micro:bit sends 'A' or 'B' label.",codeBlocks:["on button A pressed: show 'Recyclable' icon, send serial 'A'","on button B: show 'Compost', send serial 'B'","if shake: classify as 'Compost' (messy)"],prompt:"Can one button sort well? Add second feature!"},lesson90:{prep:["20 waste cards printed (10 recyclable, 10 compost)","2 large boxes labeled","micro:bit + USB, chart paper","Slides: bouncer image, decision boundary"],flow:[{phase:"Hook",time:"0-10",goal:"Feel sorting problem",script:"Everyone, you are bouncers. I will flash 10 photos super fast. Sort into two boxes using ONLY color. Go! (timer). Stop. Count mistakes. That feeling? That's what computers feel without good features. Today we become better bouncers.",studentAction:"Rapid sort cards by color only",materials:"Cards, boxes, timer",check:"Ask: What was hard? When did color fail?",stuck:"If they sort perfectly, show tricky item: white paper vs white compostable plate - color same, material different. Reveal need more features."},{phase:"Concept + Mental Model",time:"10-25",goal:"Define classifier + bouncer model",script:"Classifier is a bouncer with a rulebook. Rulebook comes from labeled examples. Three words: feature = clue, label = correct box, boundary = line where decision flips. Draw on board: dots, line. Bouncer doesn't memorize every person, he learns line. Let's draw bouncer together 60 sec sketch.",studentAction:"Copy bouncer sketch, label feature/label/boundary",materials:"Board, markers",check:"Can you point to feature on your card?",stuck:"Draw magnifying glass: 'What clue are you using?' Make them name it out loud."},{phase:"Deep Dive 6 Examples",time:"25-45",goal:"See classification everywhere",script:"Six stories. For each, I tell story, you shout feature + where it fails. Story 1: Spam... Story 2: Face unlock... etc. After each, traffic light: Green good, Yellow careful, Red risky. By end, you will have ethics wall with 6 lights.",studentAction:"Fill examples bank sheet, traffic light",materials:"Examples slides, workbook",check:"One student explains how spam filter works in 2 sentences",stuck:"Give sentence starter: 'It checks ___ to decide ___ vs ___'"},{phase:"Unplugged Hands-On",time:"45-65",goal:"Human classifier simulation",script:"Four roles: Trainer holds answer key, Model wears blindfold and only hears features, Tester gives new cards, Recorder counts right/wrong. Train on 10, test on 10 new. Switch roles. You will see human classifier makes same mistakes as AI if features bad.",studentAction:"Role-play classifier with 20 cards",materials:"Role cards, 20 cards",check:"Recorder: what accuracy? Why not 100%?",stuck:"If Model gets 100%, Tester must bring 5 tricky cards from other group."},{phase:"Workbook Practice",time:"65-80",goal:"Calculate accuracy",script:"Open workbook page W7. You have confusion: 8 correct recycle, 7 correct compost, 2 mistakes each way. Calculate accuracy = correct/total. Draw boundary. This is your report card preview for next week.",studentAction:"Fill 2x2 matrix, compute accuracy",materials:"Workbook W7",check:"Peer check: Did you get 15/20 = 75%?",stuck:"Use green correct, red confused cards physical first, then numbers."},{phase:"Reflection + Preview",time:"80-90",goal:"Connect + preview features",script:"Exit ticket: One feature that matters for waste sorter? One that doesn't? Tomorrow we become detectives: which clues actually help? Bring 3 objects from lunch trash (clean). We will test features.",studentAction:"Exit ticket + collect objects",materials:"Exit slips",check:"Can they name 1 good feature (material, texture) vs bad (position)?",stuck:"Show two same-color different material: 'Color failed, what else?'"}]},unplugged:{title:"Human Bouncer Classifier",roles:["Trainer: knows labels, says feature only","Model: blindfolded, decides box","Tester: gives new cards","Recorder: marks green/red"],materials:"40 printed waste images, 2 boxes, blindfold, green/red stickers",steps:["Trainer shows 10 labeled cards, says one feature each time: 'white, smooth'","Model tries to learn rule without seeing label","Tester gives 10 new cards, Model predicts","Recorder places green if correct, red if wrong, counts","Swap roles, repeat","Class discusses: which features worked?","Draw final decision boundary on poster"],variations:["Fast: 5 cards train","Slow: 20 cards + add second feature"],observes:"Do they argue about feature? Do they overfit to first 3 cards?",mistakes:["Trainer leaks label verbally","Model peeks","Recorder forgets to shuffle test set (same as train)"]},workbook:{tasks:["Draw 2 boxes + 5 dots per class + boundary line","Fill confusion matrix: 8 TP, 7 TN, 2 FP, 2 FN, calculate accuracy","List 3 good features for waste, 2 bad features"],answerKey:"Accuracy = (8+7)/19? Actually 15/20=75%. Good features: material, texture, transparency. Bad: x-position, image size."}},{id:"W8",num:8,title:"Features that Matter",subtitle:"Which clues actually help?",mentalModel:"Detective Clues",mentalEmoji:"\uD83D\uDD0D",accent:"from-orange-600 to-red-500",teacherEmpowerment:{whatIsThisReally:"Feature engineering was 90% of ML work before 2012. Fisher's iris used petal length, not petal position. The breakthrough of deep learning is automatic feature learning, but for Teachable Machine kids still choose camera angle, lighting, background as features. Garbage features = garbage classifier. Good features separate classes in feature space. Adding irrelevant features adds noise and can actually hurt accuracy (curse of dimensionality).",whyNeed:"Kids think more data always better. They need to learn curation: a detective doesn't collect every fingerprint in city, only relevant ones. Same with waste: color alone fails white paper vs white compost plate, but texture + weight helps. This teaches critical thinking about what to measure.",realWorld:"YouTube's 'made for kids' classifier originally used thumbnail brightness as feature, flagged many dark adult videos as kids. They removed that feature. Gmail learned that 'number of exclamation marks' is strong feature, but 'email length' is weak. Engineers constantly A/B test features by checking precision/recall lift on holdout set.",kidQuestions:[{q:"Can we just give all features?",a:"No. Too many noisy features confuse classifier, like giving detective 1000 random clues. It finds fake patterns. Also slower. Best is 3-5 strong features."},{q:"Who decides feature?",a:"Humans decide what to measure, AI decides how to combine. In Teachable Machine, your camera angle IS your feature choice. Hold object close vs far changes feature."},{q:"Can AI find its own features?",a:"Deep nets can, but Teachable Machine is transfer learning on top of MobileNet that already learned edges and textures. You still control input features by how you take photos."}],vocab:[{term:"Feature Engineering",teacherDef:"Selecting/transforming raw data into informative inputs.",kidDef:"Choosing best clues for detective",pron:"FEE-chur en-jin-EER-ing",visual:"Detective board crossing out bad clues, circling good ones"},{term:"Noise",teacherDef:"Irrelevant variation that obscures signal.",kidDef:"Distracting clue that tricks you",pron:"NOYZ",visual:"Static TV over clear picture"},{term:"Signal",teacherDef:"Pattern that correlates with label.",kidDef:"Clue that really helps",pron:"SIG-nal",visual:"Loud bell vs whisper"},{term:"Curse of Dimensionality",teacherDef:"More features need exponentially more data.",kidDef:"Too many clues, not enough examples",pron:"KURSE of di-men-shun-AL-i-tee",visual:"Crowded detective wall impossible to read"}]},mentalModelDeep:{name:"Detective Clues",teacherAnalogy:"Detective has 100 clues at crime scene. Good detective asks: which 3 prove who was there? Shoe size matters if only one suspect size 12, but hair color doesn't if all suspects brown hair. Feature importance is measured by how much it reduces uncertainty. In class, we test each feature alone: can you sort with only color? Accuracy 60%. Add texture? Jumps to 85%. That's feature lift.",studentAnalogy:"You are detective. Trash is mystery. Color is one clue, but compostable fork is white like plastic fork. You need better clue: does it bend? Does it feel rough?",sketchSteps:["Draw detective with magnifier","Evidence table with 5 items: color swatch, texture, weight, position, time","Cross out position/time as noise","Circle texture + material as signal with stars","Arrow to solved case board"],commonWrong:{wrong:"If we add more features, accuracy always goes up.",right:"Bad features add confusion and make it worse. Test one at a time."},bridgeQ:"If I hide texture and only give you color, can you still solve? What new tool (sensor) gives you texture?"},examplesBank:[{title:"Color Fails",story:"White plastic fork vs white compostable fork, same color.",howItWorks:"Color feature space overlaps, boundary impossible. Add bend feature: plastic snaps, compost bends.",where:"Waste sorting",discussionQ:"What feature would robot use?",whatIf:"If factory paints compost green?",ethicsLens:{benefits:"Better sorting",harmed:"If color used alone, mis-sort hurts recycling",missing:"Blind people rely on texture not color",trafficLight:"Green"}},{title:"Word Clue Spam",story:"Email 'FREE MONEY!!!' vs 'Free study guide'.",howItWorks:"Feature 'all caps + !!!' strong, word 'free' weak alone.",where:"Gmail",discussionQ:"Should 'free' be banned?",whatIf:"Spammers write 'Fr33'?",ethicsLens:{benefits:"Catches scams",harmed:"Teachers sending free resources flagged",missing:"Non-English spam patterns",trafficLight:"Yellow"}},{title:"Face: Glasses Feature",story:"Face unlock fails when you wear sunglasses.",howItWorks:"Model used eye distance feature, glasses block it. Needs alternative: face shape.",where:"Phone unlock",discussionQ:"Is glasses a good feature?",whatIf:"User always wears glasses?",ethicsLens:{benefits:"Security",harmed:"Glasses wearers locked out",missing:"Religious headwear",trafficLight:"Yellow"}},{title:"Voice Accent",story:"Voice assistant understands US accent better than Indian accent.",howItWorks:"Training data mostly US speech, accent feature missing.",where:"Siri/Alexa",discussionQ:"Whose voice was training?",whatIf:"Add diverse accents?",ethicsLens:{benefits:"Accessibility",harmed:"Accent bias",missing:"Dialect diversity",trafficLight:"Red"}},{title:"Shoplift Suspicion",story:"Store camera flags 'suspicious' if person wears hoodie.",howItWorks:"Hoodie feature correlates weakly but biased.",where:"Retail AI",discussionQ:"Is hoodie fair?",whatIf:"Only young men labeled suspicious in training?",ethicsLens:{benefits:"Theft prevention claim",harmed:"Profiles youth",missing:"Context",trafficLight:"Red"}},{title:"Medical X-ray Feature",story:"AI detects pneumonia using chest X-ray but learns hospital tag location.",howItWorks:"Model cheats using tag position, not lung pattern.",where:"Healthcare AI",discussionQ:"How to catch cheating?",whatIf:"Test in different hospital?",ethicsLens:{benefits:"Could save lives",harmed:"Misdiagnosis if tag changes",missing:"External validation",trafficLight:"Red"}}],physicalComputing:{title:"Add a Sensor = Add a Feature",goal:"See accuracy jump when second sensor added.",microbit:"Light sensor + temperature as 2 features to classify sunny vs shade.",noTech:"Sort cards first by color (60% acc), then by color+texture (feel blindfolded) = 85% acc",wiring:"micro:bit: light level on pin0, temp onboard, button to label",codeBlocks:["read light level, read temp, show on LEDs","if light>150 and temp>25 => 'sunny' else 'shade'","log data to table"],prompt:"What happens if we add shake as third feature?"},lesson90:{prep:["30 waste objects: plastic forks, compost forks (same color)","Blindfolds, texture board","Feature testing sheet","micro:bit light sensor demo"],flow:[{phase:"Hook",time:"0-10",goal:"Fail with one feature",script:"Yesterday 75% with color. Today I trick you: white plastic vs white compost, same color. Sort! Go. You will fail. That's good. Failure shows we need better clues. Detectives, what other clue would help?",studentAction:"Attempt sort, fail, brainstorm features",materials:"Same-color items",check:"Can they name texture/bend?",stuck:"Let them touch blindfolded, feel difference. Texture is new feature."},{phase:"Concept + Mental Model",time:"10-25",goal:"Define good vs bad feature",script:"Detective board. List all possible clues: color, weight, bend, position, time of day. Good clue splits groups. Bad clue random. We will test each alone: color gives 60%, texture gives 80%, position gives 50% = useless. More is not always better.",studentAction:"Fill detective board, circle good clues",materials:"Chart paper",check:"Give example: is 'where it sits on table' useful?",stuck:"Shuffle positions, accuracy stays 50%, they see noise."},{phase:"Deep Dive 6 Examples",time:"25-45",goal:"See feature fails in real world",script:"Six detective stories where clue failed. For each, ask: what feature did AI use? What better feature? What bias if wrong feature? Emphasize ethics: bad feature harms people.",studentAction:"Analyze each example for signal/noise",materials:"Slides",check:"Can they explain medical X-ray cheating?",stuck:"Draw overlapping dots: color overlap = can't separate."},{phase:"Unplugged Hands-On",time:"45-65",goal:"Measure feature lift",script:"In groups: first sort by color only, record accuracy. Then add texture (touch blindfold). Record new accuracy. Then add bend test. See jump. This is feature engineering. Log on board: 60% -> 80% -> 92%.",studentAction:"Three rounds with 1,2,3 features",materials:"Objects, blindfolds, tally sheet",check:"Did accuracy improve? By how much?",stuck:"If still low, check if they mixed noisy feature like position."},{phase:"Workbook Practice",time:"65-80",goal:"Rank features",script:"Workbook W8: list 6 features for waste, rank 1-6 by helpfulness, justify. Then design experiment: how to test feature alone? This is science method.",studentAction:"Rank + experimental design",materials:"Workbook",check:"Reasonable ranking? Texture/material top",stuck:"Provide sentence: 'Feature X helps because ___ vs ___ differs in X.'"},{phase:"Reflection + Preview",time:"80-90",goal:"Preview training",script:"Tomorrow you train real AI with Teachable Machine. Your job tonight: collect 10 images per class with varied backgrounds = diverse features. If all photos same background, AI learns background, not object. That's tomorrow's trap.",studentAction:"Plan image collection",materials:"Homework sheet",check:"Do they understand background is bad feature?",stuck:"Show example: all recyclable on blue table, compost on wood => AI learns table."}]},unplugged:{title:"Feature Detective Lab",roles:["Feature Tester: proposes feature","Sorter: sorts by that feature only","Counter: calculates accuracy","Skeptic: argues why feature fails"],materials:"Waste objects, blindfolds, tally sheets, ranking poster",steps:["List 8 possible features on board","Test feature 1 alone, record accuracy","Test feature 2 alone, record","Combine best 2, record lift","Add bad feature (position), see drop","Debate: top 3 features","Write rule: If texture=rough and bends => compost"],variations:["Fast: test 3 features","Slow: test 6 + graph lift"],observes:"Do they recognize noise? Do they argue with evidence?",mistakes:["Testing multiple features at once without baseline","Forgetting to shuffle","Using label as feature (cheating)"]},workbook:{tasks:["Rank 6 features for waste sorter, justify top 2","Design experiment to test texture alone","Explain why background is bad feature using overlapping dots diagram"],answerKey:"Good: material, texture, bendability. Bad: position, lighting, background. Background bias causes 40% drop on new table."}},{id:"W9",num:9,title:"Training a Classifier with Teachable Machine",subtitle:"30 images/class live",mentalModel:"Teaching Baby to Sort",mentalEmoji:"\uD83D\uDC76",accent:"from-amber-600 to-orange-600",teacherEmpowerment:{whatIsThisReally:"Teachable Machine (2017, Google) uses transfer learning: MobileNet pre-trained on ImageNet (2012) already knows edges/textures. Last layer is retrained on your 30 images per class in browser with TensorFlow.js. No code needed. Training = adjusting weights to minimize misclassification on your examples. With 30 diverse images, you get ~70-85% on new data if features good. With 30 identical images, ~50% (memorizing background).",whyNeed:"Kids fear AI is hard. Doing live training demystifies: they are the teacher, AI is baby. They see their choices (how they hold object, lighting) directly affect accuracy. Builds agency: they can make AI, not just use it.",realWorld:"Waste sorting startup EverestLabs: they mount camera over conveyor, workers label 1000 images/hour, model retrains nightly. Same loop as kids: collect, label, train, test, fix mistakes by adding more diverse images of mistaken items. YouTube's classifier retrains weekly on appeals.",kidQuestions:[{q:"Why 30 images not 3?",a:"3 images = baby sees only 3 examples, memorizes them, fails new. 30 with different angles/lights = baby learns general idea 'fork shape', not 'fork on blue table'. More diverse = smarter baby."},{q:"Does training hurt computer?",a:"No, but uses energy. Training big model like ChatGPT uses as much as 100 homes/year. Our tiny model uses phone battery only. That's why we should not retrain wastefully."},{q:"Can baby forget?",a:"Yes if you close tab without saving. Also if you train new class badly, it forgets old. That's catastrophic forgetting. Save model."}],vocab:[{term:"Training",teacherDef:"Adjusting model weights to reduce error on labeled data.",kidDef:"Showing baby many examples until it gets it",pron:"TRAYN-ing",visual:"Baby looking at flashcards, brain growing"},{term:"Transfer Learning",teacherDef:"Reuse pretrained model, retrain last layer.",kidDef:"Baby already knows shapes, you teach new names",pron:"TRANS-fer LER-ning",visual:"Stack: bottom knows edges, top you teach labels"},{term:"Epoch",teacherDef:"One pass over all training data.",kidDef:"One round of flashcards",pron:"EE-pok",visual:"Loop arrow over 30 cards"},{term:"Diverse Data",teacherDef:"Variation in lighting, angle, background, instance.",kidDef:"Different looking examples of same thing",pron:"di-VERSE DAY-ta",visual:"Same fork 6 ways: close, far, dark, light"}]},mentalModelDeep:{name:"Teaching Baby to Sort",teacherAnalogy:"Baby doesn't know 'dog vs cat'. You show 30 dog photos saying 'dog' and 30 cat photos saying 'cat'. Baby starts babbling wrong, you correct. After many rounds, baby points correctly. If you only show white dogs, baby thinks all dogs white and fails on brown dog. That's lack of diversity. If you show dog photos all on same rug, baby learns rug, not dog.",studentAnalogy:"Teachable Machine is baby. You are teacher. Show it clear, varied examples. If you show same photo 30 times, baby memorizes, not learns.",sketchSteps:["Draw baby with big eyes, teacher with flashcards","3 identical cards -> baby confused face","6 diverse cards: different angles, lights -> baby lightbulb","Baby sorting correctly into boxes","Teacher clapping, baby proud"],commonWrong:{wrong:"More photos automatically better, even if same.",right:"Diverse photos better than many identical. 20 diverse > 100 identical."},bridgeQ:"If baby only saw your plastic forks on blue table, what will it think when it sees compost fork on blue table?"},examplesBank:[{title:"Baby Learns Dog",story:"Family shows baby 30 dog pics, but only white poodles. Baby calls brown lab 'cat'.",howItWorks:"Model overfits to color feature, fails on new color. Needs diverse colors.",where:"Teachable Machine demo",discussionQ:"How to fix?",whatIf:"Add brown dogs?",ethicsLens:{benefits:"Learning diversity concept",harmed:"Dog mislabeled",missing:"Brown dogs",trafficLight:"Green"}},{title:"Recycling Baby",story:"Class trains waste sorter with 30 plastic images all on desk, 30 compost on grass. Works in classroom but fails in cafeteria.",howItWorks:"Model learns background not object.",where:"Project",discussionQ:"How to make background not matter?",whatIf:"Mix backgrounds?",ethicsLens:{benefits:"Teaches bias",harmed:"Contamination if mis-sorted",missing:"Background diversity",trafficLight:"Yellow"}},{title:"Sign Language Baby",story:"Teachable Machine learns ASL A vs B with 30 images each.",howItWorks:"Hand shape features learned via MobileNet edges.",where:"Accessibility tools",discussionQ:"Who benefits?",whatIf:"Only one hand skin tone?",ethicsLens:{benefits:"Inclusion",harmed:"Fails darker hands if not in data",missing:"Skin tone diversity",trafficLight:"Yellow"}},{title:"Emotion Detector",story:"App claims to detect happy vs sad from face, trained on actors.",howItWorks:"Uses facial muscle features, but culture differs.",where:"EdTech",discussionQ:"Should we use it?",whatIf:"Training only US actors?",ethicsLens:{benefits:"None strong",harmed:"Misreads neurodivergent, punishes",missing:"Cultural expression",trafficLight:"Red"}},{title:"Plant Disease Sorter",story:"Farmer trains classifier: healthy vs sick leaves.",howItWorks:"Color spots as feature, needs diverse lighting.",where:"Agriculture",discussionQ:"What if sick leaf photo blurry?",whatIf:"Only one plant type?",ethicsLens:{benefits:"Saves crops",harmed:"Wrong pesticide if wrong",missing:"Small farms data",trafficLight:"Green"}},{title:"Gesture Controller",story:"micro:bit shake vs still to control waste bin lid.",howItWorks:"Accelerometer feature: shake = high variance.",where:"Physical Lab",discussionQ:"What threshold?",whatIf:"Person tremor?",ethicsLens:{benefits:"Hands-free hygiene",harmed:"Could trigger accidentally",missing:"Accessibility tremor",trafficLight:"Green"}}],physicalComputing:{title:"Teachable + micro:bit Gesture",goal:"Use body as input, see training loop physical.",microbit:"Shake = compost (throw), still = recyclable (place). micro:bit sends via serial to Teachable Machine? Or Teachable Machine uses webcam to see micro:bit gesture.",noTech:"Human baby: one student is model, others train with cards, model learns.",wiring:"micro:bit accelerometer -> if shake > threshold, show compost icon, else recycle.",codeBlocks:["forever: if acceleration > 1500 then show trash, send 'shake' else show recycle","on button A: calibrate threshold"],prompt:"Does shaking hard vs soft change feature?"},lesson90:{prep:["Laptops 1 per 3, Teachable Machine link","30+ waste items, varied tables","micro:bit with gesture code","Checklist: diverse backgrounds"],flow:[{phase:"Hook",time:"0-10",goal:"Live baby training",script:"Watch me train baby in 2 minutes. I will show 10 images same background. Let's test on new background - it fails! Why? Baby learned table, not fork. Today you will be better teachers than me. Goal: 80% on new table.",studentAction:"Watch demo fail, shout why",materials:"Projector, Teachable Machine",check:"Can they say 'background bias'?",stuck:"Freeze frame: show what baby sees - mostly table, little fork."},{phase:"Concept + Mental Model",time:"10-25",goal:"How training works",script:"Teachable Machine uses brain that already knows edges. We only teach last part: names. Like baby knows shapes, you teach words. Three rules: 1) diverse backgrounds, 2) diverse angles, 3) 30 images. Draw stack: bottom MobileNet, top your labels. Each epoch = one round flashcards.",studentAction:"Sketch transfer learning stack",materials:"Board",check:"Explain epoch in own words",stuck:"Use flashcard analogy: one pass over deck = one epoch."},{phase:"Deep Dive 6 Examples",time:"25-45",goal:"Ethics of teaching",script:"Six baby stories. For each, who is missing from training? What happens? Focus on skin tone, accent, disability. Traffic light. Good teachers include everyone.",studentAction:"Fill ethics lens for each",materials:"Slides",check:"Can they spot missing skin tones?",stuck:"Ask: would baby recognize your grandma if only trained on teens?"},{phase:"Unplugged Hands-On",time:"45-65",goal:"Train physical baby",script:"Roles: Trainer shows cards, Model (blindfolded) guesses, Trainer says correct label. Train 30 diverse, test 10 new. Then train 30 identical, test 10 new, compare accuracy. You will feel diversity matters.",studentAction:"Two training rounds, compare",materials:"Cards, blindfolds, tally",check:"Which training gave higher accuracy on new?",stuck:"If identical wins, Tester used same background as train - make them change table."},{phase:"Workbook Practice",time:"65-80",goal:"Collect + train digital",script:"Now real: open Teachable Machine. Create 2 classes: Recyclable, Compost. Take 30 each, must mix 3 backgrounds, 3 angles. Train, test with my 10 new images I never showed. Record accuracy. If <70%, add more diverse images.",studentAction:"Live training on laptops",materials:"Laptops, items, checklist",check:"Walk: are they varying background?",stuck:"If stuck <50%, check: are both classes on different tables? Mix them!"},{phase:"Reflection + Preview",time:"80-90",goal:"Preview confusion matrix",script:"You got accuracy. But which mistakes? Did recyclable get called compost more? That's confusion. Tomorrow we make report card for AI: confusion matrix. Save your model link.",studentAction:"Save model, note one confusion",materials:"Exit ticket",check:"Can they name one confused item?",stuck:"Show matrix empty: 'Where did it confuse?'"}]},unplugged:{title:"Human Teachable Machine",roles:["Teacher: shows labeled cards diverse vs identical","Baby Model: learns, blindfolded","Tester: new cards","Scientist: records accuracy difference"],materials:"60 cards (30 identical background, 30 diverse), blindfold, 2 tables",steps:["Round 1: train Baby with 30 identical (all blue table), test 10 new on wood table, record accuracy","Round 2: train with 30 diverse (mix tables), test same 10, record","Compare: diverse should be 20% higher","Discuss: what did Baby learn in round 1?","Repeat with angles: all close vs mix","Write rule: diverse > many","Plan for tomorrow's waste collection"],variations:["Fast: 10 vs 10","Slow: 30 vs 30 + micro:bit gesture"],observes:"Do they vary background without prompting?",mistakes:["All photos same hand, same shadow = background bias","Blurry photos","Labeling error"]},workbook:{tasks:["Log: how many backgrounds used? Angles?","Test your model on teacher's 10 new images, fill correct/incorrect","Calculate accuracy, note which items confused","Reflect: what would you add to improve?"],answerKey:"Expect 60-80% if diverse, 40-50% if not. Common confused: white plastic vs white compost fork."}},{id:"W10",num:10,title:"Confusion Matrix",subtitle:"Where AI Gets Confused - Report Card",mentalModel:"Report Card",mentalEmoji:"\uD83D\uDCCA",accent:"from-orange-500 to-red-600",teacherEmpowerment:{whatIsThisReally:"Confusion matrix invented 1904 by Karl Pearson to show true vs predicted. TP/TN = correct, FP/FN = confused. Accuracy = (TP+TN)/total. Precision = TP/(TP+FP) answers 'when I say recyclable, how often right?' Recall = TP/(TP+FN) answers 'of all recyclable, how many did I find?'. 2012 ImageNet win still had confusion between similar breeds. Gmail optimizes precision to avoid false spam.",whyNeed:"Single accuracy hides which mistakes matter. 90% accuracy could be 100% on compost but 0% on recyclable if data imbalanced. 7th graders need to see AI report card not just grade, but which subjects it fails, like they get math A but reading C. Teaches nuance.",realWorld:"Waste sorter: if FP = compost called recyclable, recycling gets contaminated and whole batch trashed. If FN = recyclable called compost, we lose material but not contaminate. So we want high precision for recyclable. Hospital: high recall for disease (don't miss sick). Gmail: high precision for spam (don't put real mail in spam).",kidQuestions:[{q:"Why 2x2 not just %?",a:"Because 80% could be all mistakes on one type. Matrix shows where confusion lives. If AI confuses plastic forks for compost always, we need more plastic fork training."},{q:"What's better precision or recall?",a:"Depends on cost of mistake. For waste, contamination (FP) worse than missing recyclable. So precision matters more. For disease, missing sick (FN) worse, so recall matters."},{q:"Can we have 100% both?",a:"Tradeoff. If you make threshold strict to increase precision, recall drops. You choose based on harm."}],vocab:[{term:"Confusion Matrix",teacherDef:"Table of actual vs predicted counts.",kidDef:"Report card showing right and wrong boxes",pron:"con-FEW-zhun MAY-trix",visual:"2x2 grid green diagonal correct, red off-diagonal confused"},{term:"Precision",teacherDef:"TP/(TP+FP). When predicted positive, how often true?",kidDef:"When you say recyclable, are you right?",pron:"pre-SIH-zhun",visual:"Magnifier over predicted recyclable pile counting correct"},{term:"Recall",teacherDef:"TP/(TP+FN). Of all positives, how many found?",kidDef:"Of all recyclable, how many did you catch?",pron:"re-KALL",visual:"Net catching fish, how many of total pond"},{term:"Accuracy",teacherDef:"(TP+TN)/total. Overall correct.",kidDef:"Overall grade",pron:"AK-yur-ah-see",visual:"Report card big letter grade"}]},mentalModelDeep:{name:"Report Card for AI",teacherAnalogy:"Student gets report card not just GPA but per subject: Math A, Reading C. You know where to help. Confusion matrix is AI report card per class: Recyclable A-, Compost B. Off-diagonal red shows confusion. Precision is like 'when teacher says you did homework, did you really?' Recall is 'of all homework assigned, how many did you turn in?'",studentAnalogy:"Your AI got 80% overall but got all recyclable right and half compost wrong. Report card shows C in compost. Need to study compost more.",sketchSteps:["Draw 2x2 grid, label Actual down, Predicted across","Green top-left: recyclable called recyclable (good)","Green bottom-right: compost called compost (good)","Red top-right: recyclable called compost (miss)","Red bottom-left: compost called recyclable (contamination, worse!)"],commonWrong:{wrong:"Accuracy alone tells if model good.",right:"Matrix tells where it confuses and which mistake costs more."},bridgeQ:"If compost called recyclable contaminates whole bin, which red square is more expensive? How would you change threshold to avoid it?"},examplesBank:[{title:"Waste Report Card",story:"Model: 8 recyclable correct, 2 called compost (miss), 3 compost called recyclable (contamination), 7 correct compost.",howItWorks:"Accuracy 75%, precision recyclable = 8/(8+3)=72% low contamination risk.",where:"Project",discussionQ:"Which mistake worse?",whatIf:"More compost training?",ethicsLens:{benefits:"Shows where to improve",harmed:"Contamination if FP high",missing:"Dirty items",trafficLight:"Yellow"}},{title:"Spam Report Card",story:"Gmail: 95 real mail correct, 4 spam correct, 1 real called spam (FP).",howItWorks:"Precision spam low? Actually FP=1 real in spam hurts user. So Gmail tunes for high precision.",where:"Email",discussionQ:"Would you rather miss spam or lose real mail?",whatIf:"Threshold looser?",ethicsLens:{benefits:"Saves time",harmed:"Lost job offer in spam",missing:"User control",trafficLight:"Yellow"}},{title:"Face Unlock Report",story:"Phone: 100 you correct, 0 sister correct? Actually sister 2 times unlocked (FP).",howItWorks:"FP = security breach. Need high precision for you.",where:"Security",discussionQ:"What FP cost?",whatIf:"Twin sister?",ethicsLens:{benefits:"Convenience",harmed:"Sibling privacy breach",missing:"Twin data",trafficLight:"Red"}},{title:"Medical Test",story:"Disease test: 90 healthy correct, 5 sick caught, 3 sick missed (FN), 2 healthy called sick (FP).",howItWorks:"Recall = 5/(5+3)=62% low, dangerous misses.",where:"Hospital",discussionQ:"Which error worse?",whatIf:"Lower threshold?",ethicsLens:{benefits:"Early detection",harmed:"Missed disease death",missing:"Diverse patients",trafficLight:"Red"}},{title:"Self-Driving Stop Sign",story:"Car: stop signs 99% recall, but 1% miss = crash.",howItWorks:"Need 99.99% recall for stop.",where:"Autonomous",discussionQ:"Acceptable recall?",whatIf:"Snowy sign?",ethicsLens:{benefits:"Safety",harmed:"Crash if miss",missing:"Snow data",trafficLight:"Red"}},{title:"YouTube Kids",story:"Video classifier: adult video called kids (FP) shows to kids.",howItWorks:"FP high harm, need precision for kids category.",where:"YouTube",discussionQ:"Who harmed?",whatIf:"Creators game thumbnail?",ethicsLens:{benefits:"Protects kids",harmed:"Kids see adult",missing:"Non-English",trafficLight:"Red"}}],physicalComputing:{title:"Physical Confusion Matrix",goal:"Feel FP vs FN with green/red cards.",microbit:"Button A = predict recyclable, B = compost, show green/red LED for correct/confused.",noTech:"2x2 floor mat, students stand in quadrants holding cards, green cards correct, red confused.",wiring:"micro:bit: on A: predict R, on B: predict C, compare to actual hidden, show check or X, count.",codeBlocks:["actual = random R/C","on A pressed: predicted=R, if actual==R green else red","increment TP/FP etc","show matrix on serial"],prompt:"Which quadrant costs more?"},lesson90:{prep:["Floor tape 2x2 matrix large","Green/red cards 40","Confusion matrix worksheets","Teachable Machine models from W9"],flow:[{phase:"Hook",time:"0-10",goal:"Feel confusion",script:"I am AI. I will sort 20 items fast. You check my work and put green if I am right, red if confused. We will build human confusion matrix on floor. Ready? Go! (sort). Count greens vs reds. Where are most reds?",studentAction:"Place green/red on floor matrix",materials:"Cards, floor mat",check:"Where is confusion cluster?",stuck:"If no confusion, introduce tricky white forks."},{phase:"Concept + Mental Model",time:"10-25",goal:"Define TP/TN/FP/FN",script:"Report card time. Draw 2x2. Top-left: actually recyclable, predicted recyclable = correct, green, TP. Bottom-right: compost correct = TN. Red squares = confused: FP contamination, FN missed. Precision = when I say recyclable, am I right? Recall = of all recyclable, did I catch? Draw formulas with colors.",studentAction:"Draw matrix, label",materials:"Board",check:"Can they point to FP and explain harm?",stuck:"Use money: FP costs whole batch, FN costs one item. Which worse?"},{phase:"Deep Dive 6 Examples",time:"25-45",goal:"Cost of mistakes",script:"Six report cards: waste, spam, face, medical, self-driving, YouTube. For each, ask: which mistake hurts more? Should we optimize precision or recall? Show traffic lights. Medical needs recall, spam needs precision.",studentAction:"Decide precision vs recall per story",materials:"Slides",check:"Explain why medical needs recall",stuck:"Give hint: miss disease = death vs false alarm = extra test."},{phase:"Unplugged Hands-On",time:"45-65",goal:"Build matrix physically",script:"Groups: Trainer knows actual, Model predicts, Recorder places card on floor matrix green/red. After 20, calculate accuracy, precision, recall using counters. Then swap threshold: be stricter to be recyclable only if very sure, see precision up recall down.",studentAction:"Physical matrix + threshold change",materials:"Floor mat, cards",check:"Did precision change when stricter?",stuck:"If not, make them require 2 features to say recyclable."},{phase:"Workbook Practice",time:"65-80",goal:"Calculate",script:"Workbook W10: Given matrix 8,2,3,7. Calculate accuracy 75%, precision recyclable 8/11=72%, recall 8/10=80%. Which class needs more data? Answer: compost confused as recyclable 3 times, need more compost examples. Also micro:bit code to count.",studentAction:"Compute metrics, decide action",materials:"Workbook",check:"Can they say action: add more compost images?",stuck:"Use green/red physical counters then numbers."},{phase:"Reflection + Preview",time:"80-90",goal:"Preview overfitting",script:"You have report card. Tomorrow: why does AI get 100% on homework but 60% on exam? That's memorizing vs understanding = overfitting. Bring your model link, we will test on totally new cafeteria items.",studentAction:"Exit ticket: one FP cost example",materials:"Exit slip",check:"Do they connect FP to real harm?",stuck:"Ask: if compost in recycle, whole truck to landfill?"}]},unplugged:{title:"Human Report Card",roles:["Model: predicts","Actual: knows truth (hidden)","Placer: puts green/red on floor matrix","Calculator: computes accuracy/precision/recall"],materials:"Floor 2x2 tape, 20 cards, green/red stickers, calculator",steps:["Actual holds answer key hidden","Model predicts each card","Placer puts card in correct quadrant, green if diagonal, red if off-diagonal","After 20, count TP,TN,FP,FN","Calculate accuracy, precision, recall","Change rule stricter: need 2 features to say recyclable, repeat, see metrics shift","Discuss which mistake costs more"],variations:["Fast: 10 cards","Slow: 30 cards + micro:bit counter"],observes:"Do they notice FP cluster on white forks?",mistakes:["Mixing actual/predicted axes","Counting only accuracy","Not discussing cost"]},workbook:{tasks:["Given matrix: TP=8 FP=3 FN=2 TN=7, calculate accuracy, precision, recall","Which error contaminates recycling? How to reduce it? (increase threshold)","Draw action plan: add more data for confused class"],answerKey:"Accuracy 75%, Precision R 72%, Recall R 80%, Precision C 77%, Recall C 70%. Contamination FP = 3 compost called recyclable. Action: stricter threshold + more compost training."}},{id:"W11",num:11,title:"Overfitting",subtitle:"Memorizing vs Learning",mentalModel:"Memorizing vs Understanding",mentalEmoji:"\uD83E\uDDE0",accent:"from-red-500 to-orange-600",teacherEmpowerment:{whatIsThisReally:"Overfitting known since 1900s: model memorizes training data noise, fails on new data. Formalized as bias-variance tradeoff. Deep learning 2012 showed huge models can memorize yet generalize if diverse data. In Teachable Machine, overfitting happens when 30 images same background: training accuracy 100%, test 50%. Solution: more diverse data, simpler model, holdout test set. Regularization = penalize memorizing.",whyNeed:"Kids memorize homework answers and fail exam - same as AI. They need to feel why understanding beats memorizing. Teaches study skills and AI literacy: if model says 100% accuracy, be suspicious.",realWorld:"Waste startup: model 99% in lab, 60% in real MRF because lab lighting different. They fixed by collecting data from 3 facilities, not one. YouTube: model 98% on US videos, 70% on Indian videos because overfit to US.",kidQuestions:[{q:"Is 100% accuracy good?",a:"Often bad sign = memorizing. Like student who memorized answer key but doesn't understand. Test on new data: if drops a lot, it's overfitting."},{q:"How to stop memorizing?",a:"Three ways: more diverse examples, test on new data you never trained on, keep model simple. For us: mix backgrounds, use holdout set."},{q:"Can AI understand like human?",a:"No, it finds patterns, not meaning. But with diverse data it looks like understanding. Still, it doesn't know what waste is, only pixels."}],vocab:[{term:"Overfitting",teacherDef:"Low training error, high test error; memorizing noise.",kidDef:"Memorizing homework, failing exam",pron:"OH-ver-FIT-ing",visual:"Student with flashcards memorized, exam blank, vs student understanding"},{term:"Generalization",teacherDef:"Performance on unseen data.",kidDef:"Doing well on new test you never saw",pron:"gen-er-al-i-ZAY-shun",visual:"Bridge from training island to test island"},{term:"Holdout Set",teacherDef:"Data never seen in training, used for honest test.",kidDef:"Secret exam",pron:"HOLD-out SET",visual:"Locked envelope labeled exam"},{term:"Bias-Variance",teacherDef:"Tradeoff: simple model high bias low variance, complex high variance.",kidDef:"Too simple = always wrong, too complex = memorizes",pron:"BYE-us VAIR-ee-ance",visual:"See-saw: simple vs complex"}]},mentalModelDeep:{name:"Memorizing vs Understanding",teacherAnalogy:"Two students: A memorizes 5 practice problems answers, B learns method. Exam has 10 new problems same method different numbers. A fails, B passes. Overfitting is student A. In AI, model that memorizes 30 identical images fails on new angle. Model that learns shape generalizes. Regularization is like teacher saying 'explain why, not just answer'.",studentAnalogy:"If you memorize where cards are on table, not what they are, you fail when table changes. Understanding = looking at object, not table.",sketchSteps:["Draw two brains: left full of exact photos memorized, right with idea 'fork shape'","Exam: new table","Left brain confused, right brain correct","Graph: training accuracy up, test accuracy down after point = overfitting","Cure: more diverse practice"],commonWrong:{wrong:"100% on training means good model.",right:"Need test on new data. Gap between train and test shows overfitting."},bridgeQ:"You got 100% training but 60% on my new cafeteria test. Did you memorize or understand? How to prove understanding?"},examplesBank:[{title:"Homework Memorizer",story:"Leo memorizes 5 math problems answers, fails exam with new numbers.",howItWorks:"Memorizing training set, no generalization.",where:"School",discussionQ:"How to study for understanding?",whatIf:"Exam same as homework?",ethicsLens:{benefits:"Teaches study skills",harmed:"Fails exam",missing:"Understanding check",trafficLight:"Green"}},{title:"Waste Lab vs Real",story:"Model 99% in classroom, 60% in cafeteria different lighting.",howItWorks:"Overfit to classroom lighting background.",where:"Project",discussionQ:"How to fix?",whatIf:"Collect from 3 places?",ethicsLens:{benefits:"Shows real gap",harmed:"Contamination in real",missing:"Real-world diversity",trafficLight:"Yellow"}},{title:"Face Unlock Twins",story:"Phone trained only on you, no other faces, unlocks for twin.",howItWorks:"Overfit to your face, no negative examples diverse.",where:"Security",discussionQ:"Need diverse negatives",whatIf:"Train with many faces not you?",ethicsLens:{benefits:"Security",harmed:"Twin privacy",missing:"Negative diversity",trafficLight:"Red"}},{title:"Chatbot Memorize",story:"Chatbot memorizes training dialogues, repeats when asked new.",howItWorks:"Large model memorizes if data small.",where:"AI",discussionQ:"Is that intelligent?",whatIf:"More diverse conversations?",ethicsLens:{benefits:"None",harmed:"Misinformation",missing:"Understanding",trafficLight:"Yellow"}},{title:"Medical Overfit",story:"Cancer detector 98% at hospital A, 70% at hospital B because learns scanner type.",howItWorks:"Learns hospital tag not tumor.",where:"Healthcare",discussionQ:"How to catch?",whatIf:"Test at 3 hospitals?",ethicsLens:{benefits:"Could save",harmed:"Miss cancer",missing:"Multi-site data",trafficLight:"Red"}},{title:"YouTube Overfit US",story:"Kids classifier works US, fails India because kids shows different.",howItWorks:"Cultural overfit.",where:"YouTube",discussionQ:"Who missing?",whatIf:"Include global shows?",ethicsLens:{benefits:"Protects",harmed:"Fails non-US kids",missing:"Global diversity",trafficLight:"Red"}}],physicalComputing:{title:"Memorize 5 vs Understand 10",goal:"Feel overfitting with cards.",microbit:"Train gesture with 5 identical shakes vs 5 diverse shakes, test.",noTech:"Memorize 5 cards positions, then shuffle to 10 new, fail vs learn rule.",wiring:"micro:bit: record 5 shakes identical, train, test new person shake.",codeBlocks:["Record 5 shakes, store pattern","Test: if pattern matches exactly => memorized","If allows variation => understanding"],prompt:"What happens when friend shakes differently?"},lesson90:{prep:["5 identical cards + 10 new diverse","Overfitting curve poster","Models from W9","New cafeteria test set 20 images teacher holds"],flow:[{phase:"Hook",time:"0-10",goal:"Shock with 100% -> 50%",script:"Yesterday you got 80% on my test. Today I will show model trained on 5 identical images: training 100%! Wow! Now test on new table: 40%! What happened? It memorized, not learned. Like memorizing homework.",studentAction:"Watch demo drop",materials:"Demo model",check:"Can they say memorizing?",stuck:"Ask: did it learn fork or table?"},{phase:"Concept + Mental Model",time:"10-25",goal:"Define overfitting",script:"Draw curve: x = training size/diversity, y = accuracy. Training accuracy goes up, test goes up then down = overfitting point. Two students: memorizer vs understander. How to avoid? More diverse data, test on secret exam (holdout), keep simple.",studentAction:"Draw curve, label overfit",materials:"Board",check:"Where is overfitting on graph?",stuck:"Use homework analogy again."},{phase:"Deep Dive 6 Examples",time:"25-45",goal:"Overfitting harms",script:"Six stories of overfitting: waste lab vs real, face twins, medical hospital tag, etc. For each: what did it memorize? What was real test? What harm? Traffic lights red where harm big.",studentAction:"Identify memorized noise",materials:"Slides",check:"Can they name noise vs signal memorized?",stuck:"Give cue: background, tag, lighting = noise."},{phase:"Unplugged Hands-On",time:"45-65",goal:"Feel memorize vs understand",script:"Round 1: memorize 5 cards positions exactly, I shuffle and add 5 new, you sort, fail. Round 2: learn rule (texture), sort 10 new, succeed. Record accuracies: memorize 100% train 50% test = overfit. Rule 80% train 80% test = good. See gap?",studentAction:"Two rounds, compare gaps",materials:"Cards",check:"Which had bigger gap?",stuck:"If gap small, they actually learned rule even in memorize round - point out they accidentally understood."},{phase:"Workbook Practice",time:"65-80",goal:"Detect overfitting",script:"Workbook: Two models. Model A: train 95% test 90% gap 5% = good. Model B: train 100% test 60% gap 40% = overfit. Which would you deploy? How to fix B? Add diverse data, mix backgrounds. Also draw curve.",studentAction:"Analyze gaps, propose fix",materials:"Workbook",check:"Can they calculate gap?",stuck:"Subtract test from train, big gap = bad."},{phase:"Reflection + Preview",time:"80-90",goal:"Preview final project",script:"Tomorrow final project: waste sorter with 60 images diverse, test 20 new, build confusion matrix, aim 85%+. You now know secrets: diverse backgrounds, check report card, avoid memorizing. Collect 20 images tonight from home for diversity.",studentAction:"Plan collection",materials:"Project brief",check:"Do they know diversity plan?",stuck:"Show checklist: 3 tables, 2 lights, 2 angles."}]},unplugged:{title:"Memorize vs Understand",roles:["Memorizer: memorizes exact cards","Understander: learns rule","Examiner: gives new test","Gap Calculator: computes train-test gap"],materials:"15 cards (5 identical, 10 diverse), 2 tables",steps:["Memorizer studies 5 identical cards on blue table for 1 min","Test on blue table: should be 100%","Examiner moves to wood table with 10 new cards: test, likely 40-60%","Understander studies 5 diverse cards learning rule","Test same wood table 10 new: likely 80%","Calculate gaps","Discuss which model to deploy"],variations:["Fast: 3 vs 6","Slow: micro:bit gesture identical vs diverse"],observes:"Do they notice identical training leads to background memorization?",mistakes:["Testing on same data as training and thinking good","Not mixing backgrounds","Thinking more identical = better"]},workbook:{tasks:["Model A train 95 test 90 gap 5, Model B train 100 test 60 gap 40, which overfits? How to fix?","Draw overfitting curve, label sweet spot","List 3 ways to avoid overfitting for waste sorter"],answerKey:"B overfits. Fix: diverse data, holdout test, simpler features. Ways: mix 3 tables, 2 lights, holdout 20 new."}},{id:"W12",num:12,title:"PROJECT 2: Waste Sorter Classifier",subtitle:"Recyclable vs Compost 60 images, test 20 new",mentalModel:"Trash Detective",mentalEmoji:"♻️",accent:"from-green-600 to-orange-600",teacherEmpowerment:{whatIsThisReally:"Capstone: full ML loop. Collect 60 images (30/class) diverse, train Teachable Machine, test 20 new holdout, build confusion matrix, calculate accuracy/precision/recall, iterate to improve. Community pooling: combine 3 classes 180 images shows sample size + diversity improves accuracy 72%->88% (law of large numbers). Final demo with micro:bit showing result. This mirrors real MRF startup workflow.",whyNeed:"Project-based learning cements. They become trash detectives solving real school waste problem. Seeing community pool jump proves collaboration matters. Also ethics: where does waste go? Who sorts? Privacy: anonymized images no faces.",realWorld:"EverestLabs + AMP Robotics: cameras over conveyor, 1000 images/hour labeling, model retrains nightly, robotic arm sorts. Accuracy 95%+ but needs constant diverse data because new packaging appears. School project is mini version.",kidQuestions:[{q:"Can our sorter work in real cafeteria?",a:"With 60 images maybe 80% in classroom, but cafeteria lighting different. With 180 pooled from 3 classes and diverse backgrounds, ~88% and more robust. Real facility uses 100k+ images."},{q:"What if someone puts trash in wrong bin?",a:"That's label noise. If we train on mislabeled data, model learns wrong. Need clean labels, double-check."},{q:"Who owns our data?",a:"You do. We anonymize: no faces, no names, only hands + objects. Pooled data stays in school. That's privacy."}],vocab:[{term:"Holdout Test",teacherDef:"Final exam data never used in training.",kidDef:"Secret test to prove you understand",pron:"HOLD-out",visual:"Locked envelope"},{term:"Iteration",teacherDef:"Loop: train, test, error analysis, fix.",kidDef:"Try, fail, fix, try again",pron:"it-er-AY-shun",visual:"Circular arrow"},{term:"Sample Size",teacherDef:"Number of examples, larger reduces variance.",kidDef:"How many examples you showed baby",pron:"SAM-ple SIZE",visual:"Small pile vs big pile"},{term:"Deployment",teacherDef:"Putting model into real use.",kidDef:"Using sorter for real trash",pron:"de-PLOY-ment",visual:"Robot arm sorting"}]},mentalModelDeep:{name:"Trash Detective",teacherAnalogy:"Detective solves trash mystery: which bin? Uses clues (features) learned from many cases (data). Works with other detectives (community pool) to see more cases, gets better. Must check report card (confusion matrix) to see where still confused, then collect more clues for that case. Finally deploys in cafeteria with micro:bit badge showing result.",studentAnalogy:"You are trash detective agency. Each class is precinct with 60 cases. Share cases = 180 cases, smarter agency. Your badge (micro:bit) shows answer.",sketchSteps:["Draw detective agency with 3 precincts","Each precinct 60 case files -> pile 180","Graph: 60 files 72% -> 180 files 88% accuracy arrow up","Badge micro:bit showing ♻️ or \uD83C\uDF31","Cafeteria deployment"],commonWrong:{wrong:"Project ends when model trained.",right:"Project needs test on new data, error analysis, iteration, ethics, deployment."},bridgeQ:"If pooled data still confuses white fork, what data would you collect next? Who would you ask for help?"},examplesBank:[{title:"School Cafeteria Deploy",story:"Agency deploys sorter in cafeteria, monitors contamination.",howItWorks:"Camera + micro:bit display, model 88% accurate, reduces contamination 50%.",where:"School",discussionQ:"What if accuracy drops over time?",whatIf:"New compostable packaging appears?",ethicsLens:{benefits:"Less landfill",harmed:"If wrong, contamination",missing:"New materials",trafficLight:"Green"}},{title:"Community Pool Power",story:"3 classes pool 60 each = 180, accuracy 72%->88%.",howItWorks:"Law of large numbers + diversity.",where:"Classroom",discussionQ:"Why not just one class 180?",whatIf:"One class all same background?",ethicsLens:{benefits:"Collaboration",harmed:"None if anonymized",missing:"Privacy if faces",trafficLight:"Green"}},{title:"Privacy First",story:"Students anonymize: only hands, no faces, no names.",howItWorks:"Data minimization, consent.",where:"Data ethics",discussionQ:"Why no faces?",whatIf:"Face in background?",ethicsLens:{benefits:"Privacy protects",harmed:"If face included, privacy breach",missing:"Consent forms",trafficLight:"Green"}},{title:"Label Noise",story:"One group mislabels dirty plastic as compost, model confused.",howItWorks:"Noisy labels hurt.",where:"Data quality",discussionQ:"How to catch?",whatIf:"10% mislabeled?",ethicsLens:{benefits:"Teaches quality",harmed:"Model learns wrong",missing:"Double-check",trafficLight:"Yellow"}},{title:"Bias: Expensive Packaging",story:"Model trained only on cheap lunch items, fails on expensive bento box.",howItWorks:"Socioeconomic
