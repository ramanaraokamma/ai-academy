g Hidden Clubs","Reinforcement – Learning by Points","PROJECT: Train a Sorting AI","Pixels – How Computers See","Seeing Faces – Face Detection","Hearing & Speaking – Voice AI","Words Are Numbers – NLP","Generative AI – Making New Things","PROJECT: Build a Chatbot","Bias – When Data Is Unfair","Ethics – Should We?","Safety – Guardrails & Seatbelts","Future Careers – AI and You","Final Prep – Polish for World","SHOWCASE EXPO – Teach the World"],Vf=["AI is a scoring machine that learned patterns from data, not a tiny human in the phone.","AI is already infrastructure, like electricity, running invisibly in apps you use daily.","AI history is 70 years of dreams, winters, and breakthroughs in 2012 and 2017.","All AI today is Narrow AI – super specialist, not general human-like intelligence.","Every AI does Input -> Process (pattern scoring) -> Output, just like you.","You can audit your own life and map where AI helps, nudges, or tricks you.","Data are the ingredients. No good ingredients, no good AI cake.","How you collect data decides what AI can learn – sampling and consent matter.","Bad data makes biased AI. Who's missing from the data matters most.","A picture reveals what a thousand numbers hide – visualization is thinking.","Privacy means you control your data story, not companies.","A class can run a full AI cycle: question, collect, clean, chart, decide.","Intelligence is noticing patterns that repeat and using them to predict.","Sorting and grouping is AI's first job – put similar things together.","A decision tree is just 20 Questions written down, and AI learns the best questions.","Prediction is mathy guessing using past patterns, with a confidence score.","AI fails confidently when data is new, messy, or adversarial – and that's data too.","You can run an AI on paper and test its accuracy like a real lab.","AI learns like you do: practice, mistakes, correction – not by being programmed step-by-step.","Training is practice with flashcards, testing is the real match with unseen cards.","Supervised learning means learning with an answer key and a loss score.","Unsupervised learning finds hidden clubs in data with no answer key given.","Reinforcement learns by points – try, get reward, adjust strategy like a game.","You can train a real image sorter in 5 minutes using your own examples.","A computer sees an image as a grid of numbers (pixels), not as a cat.","Face detection finds dots-to-dots patterns of eyes, nose, mouth in pixel grids.","Voice AI turns sound wiggles into shapes (spectrograms) and matches patterns.","Computers turn words into number addresses so 'king – man + woman = queen' works.","Generative AI is a remix machine that learned the pattern of real things to make new ones.","A chatbot is role-play with IF-THEN rules and pattern matching from examples.","Bias is a mirror that shows our history, not a bug you can just delete.","Ethics asks Should we? not just Can we? – who benefits, who could be hurt?","Safety means seatbelts, red-teaming, and filters before AI goes public.","AI won't replace you, but a person using AI as a co-pilot will change your job.","Polish means test with real users, listen, and iterate one more time.","Teaching others is the final test of understanding – expo is your stage."],ce=[{key:"youtube",title:"YouTube Next Up",emoji:"▶️",where:"YouTube, YouTube Kids",how:"Ranking model scores your watch time, clicks, and what similar viewers watched, then predicts the video with highest expected watch time."},{key:"keyboard",title:"Keyboard Autocomplete",emoji:"⌨️",where:"Gboard, iOS keyboard",how:"Language model trained on billions of typed sentences predicts the next word by pattern frequency, not by understanding you."},{key:"maps",title:"Maps ETA",emoji:"\uD83D\uDDFA️",where:"Google Maps, Waze",how:"Model trained on past trips, live speed data from phones, and road types predicts arrival by simulating traffic flow."},{key:"face",title:"Face Unlock",emoji:"\uD83D\uDD13",where:"Phone unlock, Snapchat lens",how:"Viola-Jones plus deep embeddings turn your face into a 128-number signature and compare distance to stored signature."},{key:"spam",title:"Spam Filter",emoji:"\uD83D\uDCE7",where:"Gmail, Outlook",how:"Classifier learned from millions of labeled spam/not-spam emails which word combinations signal spam, then scores new mail."},{key:"voice",title:"Voice Assistant",emoji:"\uD83C\uDF99️",where:"Siri, Alexa, Google Assistant",how:"Speech-to-text converts sound wiggles to text via acoustic model, then intent classifier picks action."},{key:"shopping",title:"Shopping Recs",emoji:"\uD83D\uDED2",where:"Amazon, Shopee",how:"Collaborative filtering: people who bought X also bought Y, plus your browsing pattern, scores next product."},{key:"weather",title:"Weather Prediction",emoji:"\uD83C\uDF26️",where:"Weather app, Windy",how:"Physics + ML model trained on 40 years of satellite data predicts next 24h by pattern matching pressure systems."},{key:"tiktok",title:"TikTok For You",emoji:"\uD83C\uDFB5",where:"TikTok, Instagram Reels",how:"Reinforcement model gives points for watch time, replay, share, and quickly learns your micro-interests."},{key:"snap",title:"Snapchat Filter",emoji:"\uD83D\uDC7B",where:"Snapchat, Instagram filters",how:"Face mesh model detects 468 face landmarks in real time, then overlays graphics anchored to nose and eyes."},{key:"translate",title:"Translate Camera",emoji:"\uD83C\uDF0D",where:"Google Translate, Lens",how:"OCR finds letters in image pixels, then Transformer translates by attention over millions of sentence pairs."},{key:"netflix",title:"Netflix Picks",emoji:"\uD83C\uDF7F",where:"Netflix, Spotify",how:"Matrix factorization learns hidden taste dimensions for you and movies, predicts rating you'd give."}];function xf(e){if([7,9,11,26,31,32,33].includes(e))return"red";if([2,4,6,8,10,14,17,18,21,24,28,29,30,34].includes(e))return"yellow";return"green"}function Jf(e,n){let t=xf(e),r={2:{benefits:"YouTube benefits when you keep watching (more ads).",harmed:"Kid who only sees one type of video gets narrow worldview.",missing:"Data about what helps you learn, not just what keeps you watching. Who decides watch-time = good?",trafficLight:"yellow",scenario:"W2 YouTube recommendations",kidQuote:"Who is missing from my For You page?"},7:{benefits:"AI company benefits if it uses millions of faces for free training.",harmed:"People whose faces used without asking, kids in school photos.",missing:"Consent, opt-out, diverse faces. Who decides it's OK to scrape?",trafficLight:"red",scenario:"W7 Data fuel: Should we use faces without asking?",kidQuote:"Did they ask before taking my picture?"},13:{benefits:"Company benefits if pattern = sales.",harmed:"If pattern = 'girls like pink', kids who don't fit get left out.",missing:"Pattern is not truth, it's past habit. Who decides pattern stays?",trafficLight:"yellow",scenario:"W13 Patterns: Is pattern = truth?",kidQuote:"Just because it repeats, does it mean it's fair?"}};if(r[e])return r[e];return{benefits:`If ${n} works well, ${e<=12?"app companies get more clicks and you get faster help":e<=24?"students who match training data get better predictions":"people who build safe AI get trust and jobs"}.`,harmed:`If data is missing, ${e<=12?"kids with different languages or games get ignored by keyboard and recommendations":e<=24?"groups not in training set get wrong labels and lose confidence":"artists, low-resource schools, or quiet kids get left out of generative remixes"}.`,missing:`What's missing? ${e%3===0?"Data from other cultures, consent, and human override.":e%3===1?"Context about why, not just what clicked. Who decides what counts as good data?":"Data about edge cases and failure, not just success. Who decides when to say no?"}`,trafficLight:t,scenario:`${n} in real product`,kidQuote:e%2===0?"Who benefits? Who could be hurt?":"What's missing in the data? Who decides?"}}function Om(e,n){let t=`Week ${e}: ${n}. 1956 Dartmouth coined AI, 1957 Perceptron learned from examples, 1986 backpropagation enabled deep learning, 2012 AlexNet proved data+GPUs beat hand-rules, 2017 Transformer invented attention, 2022 ChatGPT put generative in browser. This week's lens is ${n.toLowerCase()} – mechanism is always: data exhaust → pattern scoring → guess with confidence. Real product today scores thousands of options in ms.`;return{whatIsThisReally:{1:"AI is scoring machine not mini-human. 1956 McCarthy, 1957 Rosenblatt Perceptron, 2012 AlexNet 1.2M images. YouTube scores watch time not understanding.",5:"IPO from von Neumann 1945. Input sensors, Process = learned weights minimizing loss, Output = guess. Maps: Input GPS + live phone speeds, Process graph+ML, Output ETA. No input = no output.",10:"Visualization history: Playfair 1786 bar chart, Tukey 1970 exploratory data analysis. micro:bit light sensor shows number 0-255 changes when shade – that number is data. Chart makes invisible visible.",15:"Decision trees ID3 1986 Quinlan, information gain = best question. 20 Questions game is exact same. RPS with micro:bit is 3-branch tree."}[e]||t,why6thGradersNeedThis:`At 11 they live in apps using ${n.toLowerCase()}. Naming mechanism gives agency to ask what data, what pattern, who benefits. Without it they think AI knows them like friend. With it they can question and design.`,realWorldBehindTheScenes:"Example: TikTok For You – Input watch time/replay, Process scores 1000 videos for expected watch time using patterns from millions, Output next video. No rule 'kids like slime' – pattern emerged.",kidQuestionsAndAnswers:[{q:e===1?"Is AI alive?":e===5?"Does my phone think?":"Is AI smarter than me?",a:e===1?"No. Alive grows/eats/feels. AI scores patterns. Say: 'Calculator for patterns – fast but no feelings.'":e===5?"It processes IPO, not thinks with why. Say: 'Phone scores pattern it learned, doesn't know why you're sad.'":"Narrow yes, general no. Specialist vs generalist with heart. Say: 'AI sorts 1000 photos in 1 sec, you know when to be kind.'"},{q:e%3===0?"Can AI be wrong?":e%3===1?"Does AI spy on me?":"Why weird recommendations?",a:e%3===0?"Yes, confidently wrong on new/messy data. Like student who memorized tests not concepts. Check confidence.":e%3===1?"It follows data crumbs you leave – taps, pauses. Not person spying, but trail used to score.":"Learned from many people, not just you. If many clicked prank after homework, it guesses you will too."},{q:e>24?"Is generative stealing?":"Can I trick AI?",a:e>24?"Trained on real art often without asking – fairness debate. Doesn't copy-paste, learns style pattern. Should artists get credit?":"Yes! Sticker can fool face detector – adversarial example. Looks for pattern not meaning."}],vocabForTeacher:[{term:"Model",teacherDef:"Learned function mapping input to score, trained minimizing loss.",kidDef:"Brain built from practice that guesses",pronunciation:"MOD-uhl",visualCue:"Brain with bar chart"},{term:"Training Data",teacherDef:"Labeled examples adjusting weights via gradient descent.",kidDef:"Flashcards with answers to practice",pronunciation:"TRAYN-ing",visualCue:"Cards with checks"},{term:"Bias",teacherDef:"Systematic skew from data/design causing unfair predictions.",kidDef:"Unfair because practice was one-sided",pronunciation:"BYE-uss",visualCue:"Tipped scale"},{term:"Privacy",teacherDef:"Control over personal data: consent, minimization.",kidDef:"Your info, your choice",pronunciation:"PRY-va-see",visualCue:"Lock around person"}]}}function Xn(e,n){let t={1:{name:"Invisible Helper Tool, Not Mini-Human",teacherAnalogy:"Power drill vs tiny worker. Drill spins fast when pressed, no want. AI scores fast when given data, no intent. Removes intention keeps capability.",studentAnalogy:"Invisible elf with magnifying glass spots fast but doesn't know birthday.",sketchSteps:["Stick person + phone","Magnifying glass over phone with dots","Score list 1-100","Cross out tiny person","Write TOOL not PERSON"],commonWrongModel:{wrong:"AI is tiny smart human e as training AI changes process.",troubleshooting:"LED not showing? Check USB, re-flash. Paper version: If processor forgets rule, that's bug – need clearer rule.",whatToSee:"IPO is everywhere. Input not magic, must be sensed. Process can be changed."},10:{title:"Light Sensor Graph – Seeing Data",pillar:"Unit 2 Anchor – Data is numbers you can feel",microBitVersion:{wiring:"micro:bit light sensor is built-in on LEDs (reverse). No wiring. Uses display as sensor.",codeBlocks:["forever: plot bar graph light level (0-255)","if light < 50 -> show SAD, else HAPPY","Log to console every sec"],setup:"MakeCode -> Input -> light level block. Show bar graph extension. Shade with hand, see number drop 200->30."},noTechVersion:{title:"Windows vs Light Count",steps:["Count windows open vs lux feeling (bright/dim) by eye","Make table window count | bright?","Draw bar chart, see pattern: more windows = brighter, but curtain breaks pattern = bad data"]},materials:["micro:bit","Hand/shadow","Paper chart"],observation:"Numbers change when you shade – that's data! Visualization = bar height. Kids scream when number moves.",troubleshooting:"Light stuck? micro:bit v1 vs v2 sensor diff – use display brightness workaround. Cover top edge.",whatToSee:"Data = physical property turned into number. Visualization reveals pattern instantly."},15:{title:"Rock-Paper-Scissors Decision Tree",pillar:"Unit 3 Anchor – Tree = 20 Questions written down",microBitVersion:{wiring:"Buttons A+B + shake sensor = 3 inputs. No extra wiring.",codeBlocks:["on shake -> pick random 0-2","if random=0 show ROCK icon, 1 PAPER, 2 SCISSORS","Decision tree: IF shake THEN guess, ELSE ask 'fist?'"],setup:"Code RPS tree: Root Q: Did user shake? Branch: A=rock, B=paper. Flash, play tournament."},noTechVersion:{title:"20 Questions Fortune Teller",steps:["Fold paper fortune teller with 8 leaves: Dog/Cat/Car etc","First Q: Is it alive? Inside: YES/NO flaps","Second Q narrows, leaf = prediction","Kids design best first Q – which cuts 50%?"]},materials:["micro:bit","Paper fortune tellers","Markers"],observation:"Best first question halves options – that's information gain. Tree depth = number of questions.",troubleshooting:"micro:bit random feels unfair? Show seed. Fortune teller stuck? Re-fold with clearer YES/NO.",whatToSee:"Decision tree is playable, not abstract. AI learns best Q order from data."},20:{title:"Teachable Gesture – Training vs Testing",pillar:"Unit 4 Anchor – More data = better, test on unseen",microBitVersion:{wiring:"Accelerometer built-in is data source. USB for Teachable Machine + micro:bit via serial.",codeBlocks:["Teachable Machine: Add class SHAKE vs STILL, connect micro:bit accelerometer data","Collect 20 shakes, 20 stills (training)","Test on 10 unseen shakes, check accuracy","Show: 20 examples = 70% accuracy, 40 examples = 85%"],setup:"Teachable Machine -> Pose? Use micro:bit serial to send accel X,Y. Or mimic: kids shake phone, record."},noTechVersion:{title:"Human Gesture Flashcards",steps:["10 flashcards SHAKE vs STILL drawn by kid","Training pile 6 cards, learn rule: IF wiggly line THEN shake","Testing pile 4 unseen cards – does rule hold?","Add 10 more training, accuracy jumps"]},materials:["micro:bit or phone","Teachable Machine laptop","Flashcards"],observation:"Training = practice with answers, Testing = match without answers. More diverse shakes = better generalization.",troubleshooting:"Accuracy low? Training data too similar – add different shakes. Overfitting? Test on friend's shake fails.",whatToSee:"AI learns from your data, not programmer. Bigger diverse data wins."},25:{title:"Pixel Explorer – Phone as Microscope",pillar:"Unit 5 Anchor – Image = grid of numbers",microBitVersion:{wiring:"Phone camera = sensor, micro:bit shows you can't see pixels on its 5x5 but phone can.",codeBlocks:["Phone: Open magnifier app, zoom 10x into screen/photo","Count RGB: red 0-255, green, blue","micro:bit: show 5x5 image as 25 pixels – each LED brightness = number"],s
