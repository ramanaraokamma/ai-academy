o[r]===void 0&&(o[r]=t[r]);return{$$typeof:zm,type:e,key:i,ref:l,props:o,_owner:Gm.current}}var u=sc,c=sc;var yn=[{id:"W31",num:31,title:"Moonshot Thinking",subtitle:"10x not 10%",mentalModel:"Moonshot vs Ladder",color:"from-amber-400 to-orange-500",hero:"JUMP TO THE MOON",teacherBackground:{history:"Sept 12, 1962 - JFK at Rice University: 'We choose to go to the moon not because it is easy, but because it is hard.' This speech created Moonshot Thinking. In 2010, Google X (now X Development) was founded by Astro Teller to pursue moonshots - radical solutions, not incremental 10% improvements. Teller's rule: Must solve a huge problem, propose a radical solution, and use breakthrough tech. Failure is expected - if you aren't failing, you aren't moonshot enough. X killed projects like Loon and Makani, learning that moonshots need rapid kill signals.",why9th:"9th graders are trapped in ladder thinking by grades: 88% to 90% = ladder. Moonshot thinking is the antidote to learned helplessness. At 14-15, brain's prefrontal cortex is pruning - they need to learn that big goals rewire problem solving. Research from Stanford d.school: Students who practice 10x framing show 3.2x higher creative self-efficacy. For AI Innovators, they must learn to ask 'What if we could solve climate with AI?' not 'How do we get 10% better accuracy?'.",realWorld:["X Development: Waymo started as moonshot - self-driving was impossible in 2009, now 20M autonomous miles","Loon: Balloon internet for 300M people - failed but proved stratospheric networks","Wing: Drone delivery moonshot - 10x faster than van, now 350k+ deliveries in Australia","DeepMind AlphaFold: Moonshot to solve protein folding - 200M structures predicted, Nobel 2024"],kidQA:[{q:"If moonshots fail so often, why try?",a:"Because one moonshot success pays for 100 failures. Gmail was a 20% moonshot that became 1.8B users. Ladder thinking never creates Gmail."},{q:"Is moonshot just being unrealistic?",a:"No. Unrealistic = no physics. Moonshot = hard physics but possible. 10x forces you to abandon old tools and invent new ones. 10% keeps you polishing old tools."},{q:"How do I know if my idea is a moonshot or just big?",a:"Test: If you can explain it to your grandma using existing stuff, it's ladder. If you need to invent a new sentence, it's moonshot. 'AI drone that plants 1M trees/day' = moonshot."}],vocab:[{term:"Moonshot",def:"Radical solution that aims for 10x improvement, not 10%. Requires new approach.",example:"'Solve education with AI tutors for every child' not 'Better worksheets'"},{term:"10x Thinking",def:"Frame problem to demand ten-times better, not 10% better. Forces breakthrough.",example:"10%: faster grading. 10x: AI that makes grading obsolete"},{term:"Ladder Thinking",def:"Incremental improvement using existing methods. Safe but limited.",example:"Adding more features to same app"},{term:"Kill Signal",def:"Early metric that tells you moonshot won't work, so you pivot fast.",example:"Loon killed when balloons cost > $50k each"}]},mentalModelDeep:{teacherAnalogy:"Imagine two teams asked to cross a 20-foot chasm. Ladder team says 'Let's build a 21-foot ladder' - they measure wood, hammer nails, incremental. Takes 2 weeks, gets across, but only 1 foot higher. Moonshot team says 'We need to get to the moon side - ladders won't work. Let's build a rocket.' They fail 3 rockets, but 4th rocket doesn't just cross chasm - it flies. Ladder thinking optimizes existing path. Moonshot thinking questions if path exists at all. Teacher demo: Show two graphs - ladder is linear y=x+1, moonshot is exponential y=10^x. Ask 'Which graph solves climate?'",studentAnalogy:"You have a C+ in math. Ladder thinking: Study 10 mins more, go from 78% to 82%. Moonshot thinking: 'What if I could teach math to my whole class using an AI game I build? I would have to MASTER math to teach it.' You still end up with an A+, but you also built a game. Ladder = improve grade. Moonshot = become the teacher. One makes you slightly better, one makes you different.",sketchSteps:["1. Draw a tiny ladder (10%) - 3 rungs, label 'safe' - 10 sec","2. Draw a huge gap/chasm below ladder - label 'real problems need jump' - 10 sec","3. Draw a rocket launching OVER the chasm - label '10x' with flames - 15 sec","4. Draw moon with flag on other side - write your moonshot there - 15 sec","5. Draw X's on 2 failed rockets below + arrow 'fail fast = learn fast' - 10 sec"],wrongVsRight:{wrong:"Student says 'My moonshot is to make my chatbot 10% more accurate' - That's ladder thinking with moonshot word.",right:"Student says 'My moonshot is chatbot that replaces textbooks for my whole district - 10x cheaper, 10x more engaging, needs new tech I have to invent' - That's moonshot because it breaks textbook model entirely."},bridgeQuestion:"If SpaceX had used ladder thinking to get to Mars, what would they have built? (Bigger NASA rocket). With moonshot thinking? (Reusable Starship that lands itself - impossible in ladder world). How does this apply to your AI capstone?"},examples:[{title:"Ocean Cleanup AI Fleet",story:"18-year-old Boyan Slat dropped out to ask: What if we clean 90% of ocean plastic in 10 years, not 10%? Ladder: more beach cleanups. Moonshot: AI fleet that predicts garbage patches using satellite + ocean currents, autonomous boats harvest plastic.",howItWorks:"ML model ingests satellite imagery (Sentinel-2), ocean current data, wind. Predicts gyre concentration. Reinforcement learning routes 50 autonomous vessels to maximize collection per fuel. Vision AI sorts plastic type on deck.",whereToSee:"The Ocean Cleanup, X's Tidal project, ClearBot Mumbai",discussionQ:"Why can't 10% more volunteers solve this?",whatIf:"What if AI fleet accidentally collects baby turtles?",ethicsLens:{benefits:"Ocean ecosystems recover, fishing jobs return",harmed:"Marine life if not filtered, local fisher folk displaced",missing:"Whose ocean? Who owns plastic credits?",trafficLight:"Yellow"}},{title:"AI Tutor for 1B Kids",story:"Sal Khan's moonshot: Not 10% better Khan videos, but AI tutor that gives every child a personal Socrates. Ladder: more videos. Moonshot: LLM that asks questions, not answers, trained on Socratic method.",howItWorks:"Fine-tuned LLM on 10k Socratic dialogues. Knowledge tracing model tracks misconceptions. Generates personalized counter-examples, not solutions. Speech interface for low-literacy.",whereToSee:"Khanmigo, Duolingo Max, X's Project Green Light for education",discussionQ:"Does AI tutor replace teachers or make them moonshot-level?",whatIf:"What if tutor is wrong but confident?",ethicsLens:{benefits:"1B kids get tutoring impossible before",harmed:"Teachers fear replacement, bias to English speakers",missing:"Kids with no internet - voice over radio?",trafficLight:"Yellow"}},{title:"Carbon Capture Skyscraper Forest",story:"Ladder: Plant more trees. Moonshot: Buildings that breathe - skyscrapers covered in AI-managed algae that capture 10x CO2 vs forest.",howItWorks:"Computer vision monitors algae health per panel. RL controls water, light, pH. CO2 sensors verify capture. Harvested algae -> biofuel. Digital twin optimizes for weather.",whereToSee:"AlgenAir, X's Project Malta, Bosco Verticale Milan",discussionQ:"Is this moonshot or just greenwashing?",whatIf:"Algae escapes, blooms in city?",ethicsLens:{benefits:"Cities become carbon negative",harmed:"High water use, gentrification if luxury only",missing:"Community consent for living building?",trafficLight:"Green"}},{title:"Disaster Prediction Swarm",story:"Ladder: Better weather reports. Moonshot: 1000 cheap sensor drones that predict wildfire 24h early with 95% accuracy, not 50%.",howItWorks:"TinyML on drone: temp, humidity, smoke particles. Mesh network shares data. Federated learning builds fire risk model without cloud. Swarm moves to high-risk zones predicted by satellite.",whereToSee:"Pano AI, X's Bellwether for disasters, FireSwarm Stanford",discussionQ:"Would you trust AI to evacuate your town?",whatIf:"False alarm empties town, people stop trusting?",ethicsLens:{benefits:"Save 10k lives/year from wildfire",harmed:"Privacy drones overhead, false evacuations cost",missing:"Indigenous fire knowledge not in data",trafficLight:"Red"}},{title:"Protein Printer for Vaccines",story:"Ladder: Faster factory. Moonshot: Fridge-sized printer that prints any vaccine in village using AI-designed proteins - 10x faster than supply chain.",howItWorks:"AlphaFold predicts variant. RFdiffusion designs stable antigen. LLM converts to mRNA sequence. Microfluidic printer synthesizes. Quality check via on-board vision.",whereToSee:"BioNTech BioNTainer, Gingko Bioworks, X's Project Tapestry",discussionQ:"If anyone can print vaccines, who controls safety?",whatIf:"Someone prints harmful protein?",ethicsLens:{benefits:"End pandemic delays for Global South",harmed:"Dual use risk, needs bio-security",missing:"Who decides which village gets printer?",trafficLight:"Red"}},{title:"Trash to Treasure AI Robot",story:"Ladder: More recycling bins. Moonshot: Robot that sees any trash and instantly makes it into useful product - 10x recycling rate.",howItWorks:"Vision model classifies waste (500+ categories). Robotic arm with tactile sensors sorts. Generative design creates product from waste - e.g., plastic -> filament -> 3D print school desk. RL optimizes design for material.",whereToSee:"AMP Robotics, X's Everyday Robots, TrashBot",discussionQ:"Does this stop us from reducing trash first?",whatIf:"Robot makes product no one wants, more waste?",ethicsLens:{benefits:"Zero waste cities, jobs in repair",harmed:"Waste pickers lose livelihood if not included",missing:"Design for reuse, not just recycle",trafficLight:"Green"}}],physicalComputing:{title:"Moonshot Launcher Board",goal:"Build micro:bit that distinguishes 10% (ladder) vs 10x (moonshot) by shake force",wiring:"micro:bit alone + paper rocket slider on A0. No extra wiring - uses accelerometer. Tape micro:bit to cardboard rocket.",code:"onShake: if acceleration < 800mg = Ladder (show ladder icon, dim LEDs). If > 1500mg = MOONSHOT (rocket animation, blast sound, radio send 'MOONSHOT'). Log count to serial. Teacher version shows threshold tuning.",challenge:"Calibrate so only true jumps trigger moonshot. Present: What required you to throw harder? Link to effort for 10x."},communityData:{prompt:"Submit your moonshot sentence: 'What if we could _____ for _____ using _____?'",sampleData:[]},script90:[{name:"Ignite",minutes:"0-10",teacherSays:"1962 JFK said we go to moon because it's hard. Today you choose a hard problem worth 10 years. Ladder is safe, moonshot changes world. Which will you be?",studentDoes:"Stand up if you've ever been told 'be realistic'. Now shout your unrealistic dream. Write moonshot vs ladder for your life.",materials:"JFK clip 60s, X moonshot video",checks:"Can students give example of 10x vs 10%?"},{name:"Model",minutes:"10-25",teacherSays:"Draw chasm. Ladder team builds ladder. Moonshot team builds rocket. Ladder gets 1ft higher. Rocket gets to moon. 10x forces new physics.",studentDoes:"60-sec sketch: ladder vs rocket. Pair-share: Where are you using ladder when you need moonshot?",materials:"Sketch sheet, markers",checks:"Sketches show failure as part of rocket path"},{name:"Examples",minutes:"25-45",teacherSays:"6 moonshots that looked crazy. For each: What was ladder? What was moonshot? What failed first?",studentDoes:"Jigsaw 6 groups, each becomes expert on one example, traffic light debate",materials:"Example cards, traffic light dots",checks:"Groups can articulate 10x difference"},{name:"Build",minutes:"45-65",teacherSays:"Your micro:bit is a moonshot detector. Ladder shake = dim. Moonshot shake = blast. What force do you need to change world?",studentDoes:"Code accelerometer threshold, test, calibrate. Log moonshot attempts.",materials:"micro:bit, MakeCode",checks:"Code distinguishes thresholds, explains link to effort"},{name:"Moonshot Studio",minutes:"65-80",teacherSays:"Write moonshot: What if we could __ for __ using __? Must be 10x, must scare you, must help world.",studentDoes:"Draft 3 moonshots, peer vote most audacious but possible. Submit to pool.",materials:"Moonshot canvas",checks:"Moonshots use 10x language, not 10%"},{name:"Launch",minutes:"80-90",teacherSays:"Mission Control: State your moonshot. What will you kill first? What fails?",studentDoes:"1-min moonshot pitch + kill signal. Class votes top 3 to carry forward.",materials:"Timer, voting dots",checks:"Pitch includes problem, 10x, kill signal"}],unplugged:{title:"Human Rocket vs Ladder",roles:["Captain (decides moonshot vs ladder)","Engineer (builds with constraints)","Astronaut (tests)","Mission Control (calls kill signal)"],steps:["Round 1: Team gets 2 min to build tallest paper tower (ladder) - measure height","Round 2: Same materials, build tower that can hold textbook 10x higher - must invent new structure, 3 failures allowed","Round 3: Trade materials with other team - moonshot requires new resources","Debrief: Which round felt like moonshot? Why did Round 2 need failure?"],variations:["Blindfold Engineer - Captain must communicate 10x vision only, not steps","Budget cut halfway - kill signal test"]},workbook:{questions:["Define moonshot vs ladder with your own example","Write 3 moonshots for your school, community, planet - rank by audacity","Draw your rocket with 2 failed versions below","What is your kill signal? How will you know to pivot?"],assessment:{criteria:["Moonshot uses 10x language, not 10%","Identifies huge problem worth solving","Names radical solution needing new tech","Includes kill signal + first failure plan"],rubric:"Gold = All 4 + scares you a bit; Purple = 3; Needs launch = 2 or less"}}},{id:"W32",num:32,title:"AI for Good",subtitle:"Problems worth solving",mentalModel:"Superhero Mission",color:"from-purple-500 to-indigo-600",hero:"CHOOSE YOUR MISSION",teacherBackground:{history:"2017: Google launched AI for Social Good, but concept older: 2010 UN Global Pulse used AI for famine. 2018 Microsoft AI for Good, 2019 Nobel for climate AI. Key shift: From 'AI can do X' to 'What SHOULD AI do?' Fei-Fei Li's 2018 quote: 'AI needs north star of humanity.' AI for Good framework: Intentional (good is goal, not side effect), Inclusive (with communities, not for them), Impactful (measures real lives changed). 2023 AI for Good Summit: 2000 projects, but only 12% had community co-design - failure pattern.",why9th:"9th graders face 'tech is neutral' myth. They need moral imagination before technical skill. At this age, identity formation includes 'what kind of innovator am I?' Without Superhero Mission, they build cool tech that harms. Research: Adolescents who frame tech as mission show 40% more persistence when debugging for social good vs personal project. Also counters doom: Climate anxiety high, but agency via AI for Good builds hope + skills.",realWorld:["AI for Good projects: Flood forecasting for 200M in India (Google), mPharma drug availability Ghana, Wildlife Insights cameras, Project Relate for speech impairment","Failures: Predictive policing biased, facial rec for Uyghurs - not AI for Good because not inclusive","Teen examples: 17-year-old built AI to detect illegal mining Amazon, won $50k"],kidQA:[{q:"Can AI really help climate? Isn't AI using huge energy?",a:"Yes, training GPT-3 = 1,200MWh. BUT AI for Good must prove net good: e.g., AI optimizes wind farms +20% efficiency, saving 100x training energy. Must measure."},{q:"What if I pick mission but tech doesn't exist?",a:"Perfect - that's moonshot + mission overlap. AI for Good missions often need you to invent tech. That's W33 blueprint job."},{q:"Who decides what is 'good'?",a:"Not you alone. Good missions are co-designed with community affected. If you build for farmers without farmers, it's not good. That's our ethics test."}],vocab:[{term:"Superhero Mission",def:"Problem you choose because world needs it, not because it's easy or profitable. Has villain (problem), power (AI), and people to protect.",example:"Mission: End crop failure for small farmers using AI disease detection"},{term:"Intentional Good",def:"Good is primary goal, not accidental side effect. Measured in lives changed.",example:"Not 'app that happens to help', but 'built to help 10k farmers'"},{term:"Inclusive Design",def:"Design WITH community, not FOR them. Community are co-creators.",example:"Farmers test prototype in field, not just lab"},{term:"Net Positive",def:"AI's benefit outweighs its cost (energy, bias, access). Must calculate.",example:"Drone uses battery but saves 100x CO2 by planting trees"}]},mentalModelDeep:{teacherAnalogy:"Superheroes don't get powers then look for problems. They see Gotham burning, THEN decide to become Batman. Same for AI Innovator. Ladder thinking: 'I know image recognition, what can I do?' Mission thinking: 'Farmers in my region lose 40% crops to disease - I must learn image recognition to stop it.' Villain first, power second. Teacher demo: Show three capes: Climate (red), Health (blue), Education (gold). Each cape has a villain card: 'Climate: 1B face floods', 'Health: 400M no diagnosis', 'Education: 260M no school'. Students physically pick cape. Mission chooses you as much as you choose it - where does your heart hurt?",studentAnalogy:"Think about Marvel origin story: Peter Parker bit by spider AFTER he sees Uncle Ben die. The loss creates mission. Your mission comes from something you care about that hurts. Not 'AI is cool' but 'My grandma's village floods every year and no one warns them - I'm angry, so I'll build flood AI.' Anger + love = mission fuel. Ladder thinking runs out of battery. Mission thinking recharges when you fail because you remember who you're fighting for.",sketchSteps:["1. Draw villain - big scary blob - label problem - 10 sec","2. Draw tiny you looking at villain - label 'Why I care' - 10 sec","3. Draw superhero you with cape + AI symbol - 15 sec","4. Draw people behind you protected - who benefits? - 15 sec","5. Draw net positive scale - benefits vs costs - 10 sec"],wrongVsRight:{wrong:"Student picks mission because 'AI for Good is trending' - builds random chatbot for mental health without talking to anyone with mental health issues.",right:"Student picks mission because cousin has dyslexia and struggles reading - interviews 5 dyslexic students, co-designs text-to-speech that reads in their dialect, measures if they read 2x more."},bridgeQuestion:"Batman could fight any crime but chooses Gotham. Why does choosing ONE mission make you stronger, not weaker? How does this help your W31 moonshot focus?"},examples:[{title:"Flood Forecasting for 200M",story:"Villain: Monsoon floods kill 1k/year India, no warning. Ladder: better news. Mission: AI predicts flood 48h early, sends alert in local language via SMS (no smartphone needed).",howItWorks:"LSTM trained on 10 years river levels, rainfall, elevation. Runs on low compute. Downscales to village level. Alerts via IVR call + SMS in 9 languages. Co-designed with farmers who said 'need time to move cows, not just people'.",whereToSee:"Google Flood Forecasting, SEEDS India, Jeevit Flood App",discussionQ:"What if alert is wrong and farmers move cows for nothing?",whatIf:"Government uses data to deny insurance?",ethicsLens:{benefits:"200M get warning, lives saved",harmed:"False alarm erodes trust, government misuse",missing:"Women who don't own phones - need community radio",trafficLight:"Green"}},{title:"Crop Disease Doctor",story:"Villain: Small farmers lose 40% yield, can't afford agronomist. Mission: Phone camera = instant diagnosis, in local language, free.",howItWorks:"MobileNet on phone (no internet). Trained on 100k diseased leaf images from farmers themselves. Gives treatment using local plants first, chemicals second. Federated learning improves without sharing farmer data.",whereToSee:"PlantVillage Nuru, Wadhwani AI cotton pest, FarmWise",discussionQ:"Who owns the farmer photos? Who profits?",whatIf:"AI says healthy but crop dies - who is liable?",ethicsLens:{benefits:"Yield +30%, reduces pesticide",harmed:"Wrong diagnosis risk, data extraction from farmers",missing:"Female farmers who don't own phones",trafficLight:"Yellow"}},{title:"Hearing AI for Deaf Inclusion",story:"Villain: 430M deaf excluded from meetings, classes. Ladder: captions that lag. Mission: Real-time AI that turns speech to sign language avatar you can personalize.",howItWorks:"ASR -> LLM corrects context -> sign language translation (not word-for-word, but meaning). Avatar renders with customizable skin, speed. Trained on Deaf community videos, not hearing interpreters alone.",whereToSee:"Signapse, X's Project Euphonia, Be My Eyes + AI",discussionQ:"Is avatar better than human interpreter? When?",whatIf:"Avatar signs wrong, causes misunderstanding at hospital?",ethicsLens:{benefits:"Inclusion, independence",harmed:"Could replace interpreter jobs if not co-designed",missing:"Deaf culture - sign is not just translation",trafficLight:"Green"}},{title:"Wildlife Crime Stopper",story:"Villain: Poachers kill 1 rhino/day, rangers can't patrol 1000s km2. Mission: AI ears in forest that hear chainsaw/gunshot, alert rangers in 2 min.",howItWorks:"Acoustic sensors + TinyML classifies chainsaw vs thunder (95% acc). Solar powered, LoRa mesh. Rangers get GPS + sound clip. Trained on ranger knowledge: 'gunshot echoes different in valley'.",whereToSee:"Rainforest Connection, Wildlife Insights, TrailGuard AI",discussionQ:"Should AI decide to alert police who may be corrupt?",whatIf:"Poachers learn to avoid sensors?",ethicsLens:{benefits:"Poaching down 90% in pilots",harmed:"Surveillance in Indigenous land without consent",missing:"Community rangers vs external enforcement",trafficLight:"Yellow"}},{title:"Mental Health First Responder",story:"Villain: Teens wait 6 months for therapist, crisis at 2am. Mission: AI that listens, not diagnoses - connects to human when needed, trained on peer counselors, not just doctors.",howItWorks:"LLM fine-tuned on 10k peer support chats (consented). Detects risk via language patterns, but never says 'you have X'. Offers coping strategies from CBT, then asks 'Want me to connect you to...' with consent. Human in loop.",whereToSee:"Wysa, Koko (ethics lessons), Crisis Text Line AI",discussionQ:"Can AI be trusted with suicidal thoughts?",whatIf:"AI misses crisis signal?",ethicsLens:{benefits:"Immediate help, reduces stigma",harmed:"False reassurance, data privacy huge risk",missing:"Cultural concepts of mental health beyond DSM",trafficLight:"Red"}},{title:"Energy Access Optimizer",story:"Villain: 600M Africans no electricity, solar microgrids fail because demand unpredictable. Mission: AI predicts village demand, optimizes battery + shares excess.",howItWorks:"Smart meters + ML forecast (cooking times, festivals). RL controls battery. Peer-to-peer trading: if you have excess, sell to neighbor via mobile money. Co-designed with women who manage energy at home.",whereToSee:"X's Project Tapestry, Husk Power AI, Okra Solar",discussionQ:"Does AI make energy more or less equitable?",whatIf:"Richest household buys all energy?",ethicsLens:{benefits:"Energy access + income for sellers",harmed:"Could entrench inequality if not capped",missing:"Community ownership vs private AI",trafficLight:"Green"}}],physicalComputing:{title:"Superhero Mission Badge",goal:"micro:bit becomes mission detector - tilt to climate/health/education, press to log mission choice",wiring:"micro:bit + cardboard cape with 3 colored stickers (red climate, blue health, gold education). Use accelerometer tilt.",code:"Tilt left = Climate (show thermometer), right = Health (heart), flat = Education (book). A button logs mission to radio + flash your cape color. B shakes to show villain problem statement from serial.",challenge:"Interview family: Which mission hurts them? Change badge to show their mission, not yours."},communityData:{prompt:"Choose cape: Climate / Health / Education - why does this villain matter to you?",sampleData:[]},script90:[{name:"Villain Reveal",minutes:"0-12",teacherSays:"3 villains: Climate floods 1B, Health 400M no doctor, Education 260M no school. Which keeps you up? Mission chooses you.",studentDoes:"Walk to corner: Climate/Health/Education. Share personal story of why.",materials:"Villain cards, cape props",checks:"Students connect personal emotion to mission"},{name:"Hero Model",minutes:"12-27",teacherSays:"Superhero doesn't start with powers. Sees Gotham burning, then becomes Batman. Powers serve mission, not other way.",studentDoes:"Sketch: Villain, you caring, superhero you, people protected, net positive scale",materials:"Superhero canvas",checks:"Sketches show people protected, not just tech"},{name:"Good or Not?",minutes:"27-47",teacherSays:"6 projects. Some look good but fail inclusion test. Ask: Who designed WITH community? Net positive?",studentDoes:"Analyze examples, traffic light vote, debate red ones",materials:"Example cards, traffic light",checks:"Can articulate why co-design matters"},{name:"Badge Build",minutes:"47-67",teacherSays:"Your badge shows mission. Tilt to choose, press to commit. Superheroes wear symbol to remember who they fight for.",studentDoes:"Code micro:bit tilt + logo, test, show mission to partner",materials:"micro:bit, cape templates",checks:"Badge changes with tilt, logs mission"},{name:"Mission Draft",minutes:"67-82",teacherSays:"Write mission statement: I fight [villain] for [people] because [personal why] using [AI power]. Must be intentional, inclusive.",studentDoes:"Draft, peer review for inclusion: 'Did you ask community?'",materials:"Mission canvas",checks:"Mission includes people + personal why"},{name:"Oath",minutes:"82-90",teacherSays:"Superheroes take oath. State your mission + who you'll co-design with next week.",studentDoes:"30-sec oath pitch, class witnesses",materials:"None",checks:"Oath names community partner"}],unplugged:{title:"Villain vs Hero Debate",roles:["Villain Advocate (argues why problem hard)","Community Member (affected person)","AI Hero (proposes mission)","Ethics Judge (asks who missing)"],steps:["Villain Advocate describes climate villain with data","Community Member says how it affects daily life (roleplay)","AI Hero proposes mission, must include community co-design","Ethics Judge asks: Who benefits/harmed? Net positive? Vote Green/Yellow/Red","Swap roles, new villain"],variations:["No AI allowed round - how would you solve without AI? Then add AI, what's net gain?","Add investor who only cares profit - how does hero respond?"]},workbook:{questions:["What villain makes you angry + why personal?","Write mission: I fight __ for __ because __ using __","List 3 people you must co-design with + how you'll ask them","Calculate net positive: energy/cost vs lives changed for your mission"],assessment:{criteria:["Mission names huge problem + people","Personal why clear","Names community co-design partners","Calculates net positive + risks"],rubric:"Gold = All 4 + interview done; Purple = 3; Needs cape = 2 or less"}}},{id:"W33",num:33,title:"Innovator Blueprint",subtitle:"From moonshot to plan",mentalModel:"Treasure Map",color:"from-emerald-500 to-teal-600",hero:"DRAW THE MAP",teacherBackground:{history:"Treasure maps evolved from pirate myths to modern blueprints. 1960s NASA used 'blueprint' for moonshot - 3M blueprints for Saturn V. X Development uses 'Blueprint' as stage 2 after moonshot: 6-month deep dive to kill 90% of moonshots fast. Blueprint asks: Problem deep dive, tech breakthrough needed, team, cost, timeline. 2015: Astro Teller said 'We want to be pirates who draw maps, not just dream of treasure.' Innovator Blueprint = pirate map for AI capstone.",why9th:"9th graders jump from idea to prototype and skip planning, then fail and quit. Blueprint teaches that map is not treasure, but without map you dig random holes. Executive function still developing - externalizing plan into visual map reduces cognitive load. Research: Students who draw blueprint before coding are 2.5x more likely to complete capstone. Also teaches that blueprint is hypothesis, not promise - you will redraw map as you learn. That's mission control prep for W35.",realWorld:["X Blueprint process: 6 months, kills 80% projects - e.g., X killed Foghorn (CO2 to fuel) after blueprint showed energy cost too high","DeepMind blueprint for AlphaFold: 5 years from idea to map to Nobel","Student blueprints: 16-year-old blueprint for AI to detect illegal fishing led to Global Fishing Watch"],kidQA:[{q:"Is blueprint just boring planning?",a:"No, blueprint IS treasure hunting. You interview pirates (users), test if X marks spot (tech), calculate if treasure worth cost. Without map, you dig entire island."},{q:"What if my blueprint shows moonshot impossible?",a:"Then you pivot treasure, not quit. X killed Loon balloons but kept mission (internet for all) - now uses laser. Blueprint tells you which part impossible."},{q:"How detailed should blueprint be?",a:"Enough to test 3 riskiest assumptions in 2 weeks. If you can't list 3 risks, blueprint too vague."}],vocab:[{term:"Treasure Map",def:"Visual plan from current spot to moonshot treasure, marking risks (sea monsters), resources, and X.",example:"Map shows: Interview 5 farmers -> test model on 100 photos -> prototype cost $50"},{term:"Riskiest Assumption",def:"The part most likely to kill your moonshot. Test this first.",example:"'Farmers have smartphones' is riskier than 'Model accuracy'"},{term:"Blueprint Kill",def:"Decision to stop or pivot after blueprint shows treasure not worth cost or not possible.",example:"X killed project when CO2 capture needed 10x more energy than saved"},{term:"X Marks Spot",def:"Measurable proof your moonshot works for real users.",example:"X = 10 farmers use prototype weekly for 1 month"}]},mentalModelDeep:{teacherAnalogy:"Pirates don't dig entire island. They have map: Start here, avoid sea monsters (risks), need ship (resources), X marks spot (proof). Innovator Blueprint is same: You are on Island 'Now' (idea), treasure is on Island 'Moonshot'. Between is ocean of unknowns. Sea monsters = riskiest assumptions: 'Do farmers have phones?' 'Does model work on dark skin?' If you don't mark monsters, you sail into them. Map also shows: You need crew (who), supplies (data), and how you know you found treasure (metrics). Teacher draws huge map on board, adds monsters from student ideas. Key: Map is drawn in pencil, not pen - you will erase and redraw as you learn. That's innovator mindset.",studentAnalogy:"You want to ask crush to dance - that's moonshot. Ladder: 'I'll just stand near them.' Blueprint: Map it. Start: current spot (shy). Monsters: 'What if they say no? What if I trip?' Resources: 'Need friend to introduce, need to practice dance, need to check if they like same music.' X marks spot: 'We dance 1 song.' You test riskiest first: Do they even want to dance with anyone? Ask friend. If no, you pivot - ask someone else, not quit dancing. Capstone same: Map risks before you code.",sketchSteps:["1. Draw two islands - 'Now' left, 'Moonshot Treasure' right - 10 sec","2. Draw ocean with 3 sea monsters labeled with your riskiest assumptions - 15 sec","3. Draw ship labeled with resources you need (data, people, micro:bit) - 10 sec","4. Draw dotted path avoiding monsters + X on treasure island with metric - 15 sec","5. Draw pencil eraser near path - label 'redraw as you learn' - 10 sec"],wrongVsRight:{wrong:"Blueprint is list of features: 'I'll build app with login, camera, database, AI model, dashboard.' No risks, no metrics, no kill signals.",right:"Blueprint: 'Riskiest: Farmers don't have Android 10+ for model. Test: Interview 10 farmers this week. If <5 have it, pivot to SMS. X = 5 farmers correctly diagnose disease using prototype in field, not lab.'"},bridgeQuestion:"If your W31 moonshot is island, and W32 mission is why you want treasure, what does W33 map do that moonshot + mission alone can't? (Answer: Makes you confront monsters early, before you waste months building wrong ship)"},examples:[{title:"Blueprint: Flood Alert SMS",story:"Moonshot: Flood warning for 200M. Blueprint monsters: 1) Farmers have phones? 2) Can LSTM run on low data? 3) Will they trust AI? Map: Week1 interview 20 farmers, Week2 test model on 2019 floods data, Week3 fake SMS test with 5 families.",howItWorks:"Risks tested cheapest first: Interviews cost $0, data test cost laptop time, prototype cost $30 micro:bits. Kill signal: If <50% farmers have phones that get SMS at night, pivot to community radio + siren.",whereToSee:"X Blueprint templates, Google Design Sprint map",discussionQ:"What monster would you test first?",whatIf:"Interviews show farmers trust radio more than SMS - what changes?",ethicsLens:{benefits:"Fails fast, saves months",harmed:"None if done inclusive",missing:"Women's phone access",trafficLight:"Green"}},{title:"Blueprint: Crop Doctor App",story:"Monsters: 1) 100k leaf images? 2) Model works on local dialect? 3) Farmers will photograph?",howItWorks:"Map: Get 100 images from 5 farmers (not Google). Test MobileNet on 20 photos in field with glare. Measure: Can farmer get diagnosis in <30 sec with <2 tries?",whereToSee:"PlantVillage blueprint diary",discussionQ:"Why get images from farmers, not internet?",whatIf:"Images are all healthy - no disease data?",ethicsLens:{benefits:"Community data ownership",harmed:"If extraction, not co-design",missing:"Consent for photos",trafficLight:"Yellow"}},{title:"Blueprint: Sign Language Avatar",story:"Monsters: 1) Deaf community wants avatar? 2) Can we translate meaning not words? 3) Avatar uncanny?",howItWorks:"Map: Co-design session with 3 Deaf students first, not code first. Show storyboard avatar, ask 'Would you use this at hospital?' Metrics: Would use weekly? Kill if <2 say yes.",whereToSee:"Signapse co-design videos",discussionQ:"Why ask before building?",whatIf:"Deaf community says 'We want human interpreters, not avatar' - pivot?",ethicsLens:{benefits:"Avoids building unwanted tech",harmed:"Wastes Deaf people's time if no follow-through",missing:"Payment for co-designers",trafficLight:"Green"}},{title:"Blueprint: Wildfire Ears",story:"Monsters: 1) Can TinyML distinguish chainsaw vs chainsaw toy? 2) Solar enough in forest shade? 3) Rangers respond in 2 min?",howItWorks:"Map: Record 50 forest sounds, test model accuracy. Put solar panel in shade 3 days, measure charge. Shadow ranger for day, time response.",whereToSee:"Rainforest Connection blueprint",discussionQ:"Which monster is technical vs human?",whatIf:"Rangers take 30 min, not 2 - does moonshot fail?",ethicsLens:{benefits:"Realistic expectations",harmed:"Surveillance concerns need mapping too",missing:"Indigenous consent for sensors",trafficLight:"Yellow"}},{title:"Blueprint: Mental Health Chat",story:"Monsters: 1) Teens will talk to AI? 2) Risk detection without diagnosing? 3) Privacy safe?",howItWorks:"Map: Anonymous survey 30 teens: Would you chat at 2am? What would make you stop? Legal review: Can we store chats? Kill: If requires storing identifiable data, stop.",whereToSee:"Koko blueprint failure post-mortem",discussionQ:"Should blueprint include therapist review before code?",whatIf:"Teens say 'We want anonymous, no data' - can AI still help?",ethicsLens:{benefits:"Safety by design",harmed:"High if privacy not mapped",missing:"Cultural safety",trafficLight:"Red"}},{title:"Blueprint: Solar Microgrid Trade",story:"Monsters: 1) Can AI predict demand with only 2 weeks data? 2) Will neighbors trust trading? 3) Mobile money fees kill profit?",howItWorks:"Map: Get 1 week meter data, test forecast error. Play trading game with play money - who trades? Calculate fees: If fee > 10% of trade, pivot to battery sharing not selling.",whereToSee:"Husk Power blueprint",discussionQ:"What is X that proves treasure?",whatIf:"Forecast error 50% - still useful?",ethicsLens:{benefits:"Economic modeling early",harmed:"Could worsen inequality if not capped",missing:"Women manage energy but not phones",trafficLight:"Green"}}],physicalComputing:{title:"Treasure Map Navigator",goal:"micro:bit shows map progress - A to mark monster avoided, B to mark resource found, shake to redraw path",wiring:"micro:bit + paper treasure map overlay. Use buttons to move along path drawn on paper.",code:"A = log 'Monster: tested assumption X - result Y'. B = 'Resource: got data from farmer'. Tilt to show progress bar. Radio sends map updates. Teacher version: logs to CSV for blueprint tracking.",challenge:"Map your capstone: What 3 monsters will you test W33? Program them as A,B,shake."},communityData:{prompt:"Share blueprint monsters - what is your riskiest assumption?",sampleData:[]},script90:[{name:"Pirate Story",minutes:"0-10",teacherSays:"Pirates who dig entire island die. Pirates with map find treasure. X killed 80% moonshots after blueprint - that's success, not failure.",studentDoes:"Draw islands Now and Treasure, name treasure (moonshot)",materials:"Island template",checks:"Treasure = moonshot from W31"},{name:"Monsters",minutes:"10-25",teacherSays:"Sea monsters = riskiest assumptions. Not 'Will code work?' but 'Do users have phones? Trust AI? Have data?' Test monsters first.",studentDoes:"List 5 assumptions, circle 3 riskiest, draw as monsters on ocean",materials:"Monster cards",checks:"Monsters include human/data risks, not just tech"},{name:"Blueprint Gallery",minutes:"25-45",teacherSays:"6 blueprints that killed or pivoted fast. What did they test cheapest first? Interviews $0, data test laptop, prototype $30.",studentDoes:"Analyze examples, identify cheapest test for each monster",materials:"Blueprint examples",checks:"Can order tests by cost"},{name:"Map Build",minutes:"45-65",teacherSays:"Code map navigator: A = monster test, B = resource found. Your map is now physical.",studentDoes:"Program micro:bit map tracker, test with own monsters",materials:"micro:bit + map paper",checks:"Code logs assumptions"},{name:"My Map",minutes:"65-80",teacherSays:"Draw your treasure map: Now, monsters (3), ship resources, path, X metric, pencil eraser - you will redraw.",studentDoes:"Complete blueprint canvas, peer review: 'Did you mark human monsters?'",materials:"Blueprint canvas",checks:"Map has X metric that proves treasure"},{name:"Kill or Sail",minutes:"80-90",teacherSays:"Present monster + cheapest test. Class decides: Sail, pivot, or kill? Killing fast is gold.",studentDoes:"1-min map pitch + kill signal",materials:"None",checks:"Includes kill signal"}],unplugged:{title:"Island Survival Map",roles:["Map Keeper (draws)","Monster Spotter (names risks)","Resource Scout (lists needs)","X Checker (defines success)"],steps:["Team stranded on Now island, treasure on far island. List what you need to survive crossing","Monster Spotter names 3 things that will kill you (no food, wrong direction, storm)","Resource Scout says how to test cheapest: 'Taste berry before eating all'","X Checker: How do you know you found right island? Not just any island","Draw map with pencil, then teacher says 'Storm! One resource gone' - redraw"],variations:["No speaking, only drawing map - tests visual clarity","Add traitor who hides monster - ethics of hiding risks"]},workbook:{questions:["Draw Now -> Treasure map with 3 monsters","For each monster, cheapest test ($0, $10, $100)?","Define X that proves you found treasure (measurable)","When would you kill your moonshot? What is your kill signal?"],assessment:{criteria:["Map visual with Now/Treasure","3 riskiest assumptions marked","Cheapest test ordered","X metric measurable"],rubric:"Gold = X measurable + kill signal; Purple = 3 criteria; Needs map = 2 or less"}}},{id:"W34",num:34,title:"Prototyping at Scale",subtitle:"Advanced prototype",mentalModel:"Skyscraper Model",color:"from-slate-600 to-gray-800",hero:"BUILD THE MODEL",teacherBackground:{history:"Architects build skyscraper models before building - not to show pretty building, but to test wind, light, structure. Frank Gehry builds 100 models. Same for AI: Prototype at scale means not final robot, but model that tests riskiest parts at 1/10 scale. 2010: X's 'Model before rocket' rule - build cheap model that answers 'Will it work in real world?' MIT Media Lab: Prototype is question, not answer. W34 shifts from blueprint (paper) to skyscraper model (works but not scaled). Key: Model must be tested by real users in real place.",why9th:"9th graders build prototype then fall in love with it, won't kill it. Skyscraper Model teaches: Model is disposable, learning is not. They need to learn to prototype to test, not to show. Also teaches scale: What works in lab fails in field (dust, no internet, low literacy). Research: Students who test prototype with 1 real user improve 3x vs those who test with friends. W34 is bridge to capstone - model must be testable by W35 mission control.",realWorld:["X's model for Everyday Robots: Started with cardboard robot pushed by human to test if people want robot help","Starship model: SpaceX builds 1/3 scale to test landing before full scale - 5 exploded models taught more than 1 perfect","Student: 15-year-old built cardboard + phone AI to test crop disease detection in field before coding app - found glare problem"],kidQA:[{q:"Is prototype same as final product?",a:"No. Skyscraper model is not skyscraper - no plumbing. But it tests wind. Your model tests riskiest monster, not all features. If your monster is 'farmers will use it', model is paper + phone, not full app."},{q:"What if model fails?",a:"Great! Model is cheap, failure is cheap. Failure of model saves you from building full skyscraper that collapses. Redraw map."},{q:"How big should model be?",a:"Small enough to build in 1 week, real enough to test with 1 real user outside school. If only friends test, too small."}],vocab:[{term:"Skyscraper Model",def:"Small, cheap, works-like version that tests riskiest assumption in real world, not in lab.",example:"Not app with login, but phone taped to stick that farmers test in field"},{term:"Works-like vs Looks-like",def:"Works-like tests function (does AI detect disease?), looks-like tests design (is button clear?). W34 is works-like.",example:"Works-like: Model accuracy. Looks-like: App colors"},{term:"Field Test",def:"Test with real user in real place, not friend in classroom. Real place has dust, noise, stress.",example:"Test flood alert at 6am when farmer milks cows, not 10am class"},{term:"Model Kill",def:"Model proves assumption wrong, so you pivot model, not quit mission.",example:"Model shows farmers can't photograph leaf with one hand while holding plant - pivot to voice"}]},mentalModelDeep:{teacherAnalogy:"Architect doesn't build skyscraper to test if wind blows it over. Builds 1/100 model, puts in wind tunnel. If model falls, redesign cheap. AI prototype same: You don't build full AI drone that plants 1M trees. Build 1 drone that plants 10 trees with AI vision, test with ranger. If ranger says 'Trees need water, not just planting', you learned without building 1000 drones. Skyscraper Model asks: What is wind tunnel for your moonshot? Who is real user who will tell you truth, not friend who says 'cool'? Model is question: 'Will farmers use this in field at 6am?' Answer is data, not opinion. Teacher shows Gehry models - 100 crumpled papers before one building.",studentAnalogy:"You design new sneaker. Ladder: Draw sneaker, show friends, they say cool. Skyscraper model: Build one shoe from cardboard, wear it to run 1 mile. Does it blister? That's works-like. Your AI capstone: Don't build app with 10 screens. Build 1 screen that does riskiest thing - e.g., takes photo, shows diagnosis. Give to farmer at market, watch silent - does farmer know what to do without you explaining? If you have to explain, model failed - redesign.",sketchSteps:["1. Draw skyscraper + tiny model on table - label 'model tests wind' - 10 sec","2. Draw your moonshot as skyscraper - huge - 10 sec","3. Draw tiny model version that tests 1 monster - label which monster - 15 sec","4. Draw wind tunnel = real user + real place - 15 sec","5. Draw model falling + arrow 'cheap fail = smart' - 10 sec"],wrongVsRight:{wrong:"Student builds polished app with login, database, beautiful UI but never tests with farmer. Model looks like skyscraper but doesn't test wind.",right:"Student tapes phone to stick, asks farmer to photograph diseased leaf while holding plant. Watches farmer struggle, learns need voice command. Model is ugly but tests real monster - one-handed use."},bridgeQuestion:"Your W33 map had 3 monsters. Which monster does your W34 model test? Why that one first? What will you do if model fails this week?"},examples:[{title:"Model: Flood Alert Cardboard Phone",story:"Moonshot: 200M alerts. Model: Not app, but paper phone with 3 buttons: 'Flood?', 'Cows?', 'Help?'. Villager tests at night with flashlight. Tests: Can illiterate user understand icons? Do they press at 2am?",howItWorks:"Paper prototype + human behind curtain sends SMS. Measure: Time to understand, errors. Tech: None yet, just paper. Learning: Icons need cow + person, not just water.",whereToSee:"IDEO flood prototype, X cardboard robots",discussionQ:"Why paper before AI?",whatIf:"Villager can't read icons, what pivot?",ethicsLens:{benefits:"Finds usability monsters cheap",harmed:"None",missing:"Women's test - do they get phone at night?",trafficLight:"Green"}},{title:"Model: Crop Doctor Stick",story:"Model: Phone taped to stick so farmer can photograph leaf with one hand. No AI yet - human expert behind app says disease. Tests: Can farmer hold plant + stick? Glare?",howItWorks:"Works-like: Tests one-handed use + outdoor glare, not AI accuracy. AI accuracy already tested in lab. Field monster is bigger. Measure: Photos usable? Time?",whereToSee:"PlantVillage field test diary",discussionQ:"What monster does this test?",whatIf:"Photos blurry - pivot to video?",ethicsLens:{benefits:"Real place learning",harmed:"Farmer time, need compensation",missing:"Left-handed farmers?",trafficLight:"Green"}},{title:"Model: Sign Avatar Paper",story:"Model: Flipbook of avatar signs, Deaf tester watches. Tests: Can Deaf person understand avatar or is it uncanny? Do they prefer avatar vs text?",howItWorks:"Looks-like model tests avatar acceptance, not translation accuracy. Translation tested separately. Measure: Comprehension score, preference.",whereToSee:"Signapse flipbook test",discussionQ:"Why test looks before works?",whatIf:"Deaf tester says avatar creepy - kill avatar, use text + human video?",ethicsLens:{benefits:"Co-design, avoids uncanny valley",harmed:"If tester not paid",missing:"Deaf children's comprehension vs adults",trafficLight:"Yellow"}},{title:"Model: Wildfire Sound Box",story:"Model: Single sound sensor box in school forest, not 1000. Tests: Does TinyML distinguish chainsaw from school bell? Does solar work under trees? Do rangers get alert?",howItWorks:"Works-like: One box, real forest, real ranger phone. Measure: False alarms per day, battery life, ranger response time. Scale later if works.",whereToSee:"Rainforest Connection single node pilot",discussionQ:"Why one box, not ten?",whatIf:"100 false alarms/day - model kill?",ethicsLens:{benefits:"Cheap test",harmed:"Noise data privacy",missing:"Birds scared by box?",trafficLight:"Green"}},{title:"Model: Mental Health Chat Script",story:"Model: Human pretends to be AI, follows script, chats with teen. Tests: Will teen talk? What makes them stop? Does script feel supportive?",howItWorks:"Wizard of Oz: Human behind screen, not AI. Tests conversation flow, not AI tech. Measure: Length of chat, teen says 'felt heard'?, asks for human?",whereToSee:"Koko Wizard of Oz test",discussionQ:"Why human not AI for model?",whatIf:"Teen says 'You sound like robot' - pivot script?",ethicsLens:{benefits:"Safe, no AI risk yet",harmed:"Deception if not told it's human test",missing:"Crisis protocol during test",trafficLight:"Red"}},{title:"Model: Solar Trade Game",story:"Model: Monopoly money + paper meters, villagers play trading game. Tests: Will they trade? Do they understand? What price fair?",howItWorks:"Works-like for human behavior, not AI forecast. Measure: Trades per hour, disputes, fair price set by players. AI forecast tested separately.",whereToSee:"Husk Power trading game",discussionQ:"Why game not app?",whatIf:"No one trades - mission kill?",ethicsLens:{benefits:"Community rules, not imposed",harmed:"None if voluntary",missing:"Elite capture in game too?",trafficLight:"Green"}}],physicalComputing:{title:"Skyscraper Wind Tunnel",goal:"micro:bit as wind sensor + model stability tester - shake model, micro:bit logs if model falls",wiring:"micro:bit taped to cardboard model + second micro:bit as wind (fan button). Radio between.",code:"Model micro:bit: if tilt > 45deg = 'FELL - redesign'. Wind micro:bit: B = blow (send wind force). Log falls vs wind force. Teacher: plot stability curve.",challenge:"Build model of your capstone (cardboard + micro:bit), test in wind tunnel (fan + shake), log failures."},communityData:{prompt:"Show model - what monster did you test? Did it fall?",sampleData:[]},script90:[{name:"Gehry Models",minutes:"0-10",teacherSays:"Gehry builds 100 models, crumples 99. Model is question, not trophy. Your model asks: Will real user in real place use this?",studentDoes:"Look at 5 models of same building, discuss: What question did each test?",materials:"Gehry model photos",checks:"Students see model as disposable"},{name:"Model vs Product",minutes:"10-25",teacherSays:"Skyscraper model tests wind, not plumbing. Your model tests 1 riskiest monster, not all features. Works-like vs looks-like.",studentDoes:"Choose 1 monster from W33 map, define model that tests only that monster",materials:"Model canvas",checks:"Model tests 1 monster, not everything"},{name:"Cheap Fail Gallery",minutes:"25-45",teacherSays:"6 models that failed cheap and taught. Paper phone, stick phone, flipbook avatar - ugly but smart.",studentDoes:"Analyze examples, identify what monster each tested, what they learned from fail",materials:"Model cards",checks:"Can name monster + learning"},{name:"Wind Tunnel Build",minutes:"45-65",teacherSays:"Build cardboard model of your capstone, tape micro:bit, test wind (shake/fan). Does it fall?",studentDoes:"Build model, code fall detector, test, log",materials:"Cardboard, micro:bit, fan",checks:"Model tests real monster, logs data"},{name:"Field Test Plan",minutes:"65-80",teacherSays:"Model must be tested by 1 real user outside school this week. Who? Where? When? How will you watch silent?",studentDoes:"Plan field test: user, place, time, what to measure, consent",materials:"Field test template",checks:"Test includes real user + real place + silent observation"},{name:"Model Pitch",minutes:"80-90",teacherSays:"Pitch: My model tests monster X, it will fall if Y, I will pivot to Z.",studentDoes:"1-min model + field test plan",materials:"None",checks:"Pitch names monster + pivot"}],unplugged:{title:"Wind Tunnel Test",roles:["Model Builder (builds)","Wind Maker (shakes/fan)","Data Logger (records fall)","User Tester (real user roleplay)"],steps:["Builder builds tower from cards that must hold book","Wind Maker shakes table - does it fall? Logger records force","User Tester (blindfolded) tries to use model without instructions - Builder watches silent","Redesign based on fall + user struggle, test again","Measure: How many redesigns before holds book + usable blindfolded?"],variations:["User Tester is left-handed, or holds baby (one hand) - inclusive test","Wind is not shake but 'No internet' - model must work offline"]},workbook:{questions:["What monster does your model test? Why riskiest?","Draw model - label what it tests and what it does NOT test","Field test plan: Who (real user), where (real place), what measure, consent?","If model falls, what is pivot?"],assessment:{criteria:["Model tests 1 riskiest monster","Works-like focus","Field test with real user outside school","Pivot defined if fails"],rubric:"Gold = Field test done + pivot; Purple = 3 criteria; Needs wind = 2 or less"}}},{id:"W35",num:35,title:"Capstone Prep",subtitle:"Problem + Data + Model + Robot/Agent + Business + Ethics + Next Step",mentalModel:"Mission Control Prep",color:"from-indigo-600 to-purple-700",hero:"MISSION CONTROL READY?",teacherBackground:{history:"NASA Mission Control: Gene Kranz 1965 created checklist culture - every mission has GO/NO-GO poll: Problem, Data, Model, Hardware, Business (cost), Ethics (safety), Next Step. 7 polls must be GO before launch. Apollo 13: Mission Control prep saved crew because they had rehearsed failure. For AI Innovator, Mission Control Prep is final check before Demo Day W36. W35 is not building new, but integrating W31-34 into 7-poll canvas. 2020: X's Mission Control for Loon launch had 12 polls - same idea.",why9th:"9th graders often demo tech, not mission. They show model accuracy, not problem solved. Mission Control forces 7 lenses: If ethics is NO-GO, you don't launch, even if model 99%. Teaches systems thinking - capstone is not model, but system: Problem + Data + Model + Robot/Agent + Business + Ethics + Next Step. Also teaches that Next Step is part of prep, not afterthought - what happens after Demo Day? Who continues? Research: Students with 7-poll prep show 50% more coherent Demo Day pitches.",realWorld:["NASA GO/NO-GO: Flight, Surgeon, EECOM, etc - each says GO/NO-GO. For AI: Problem GO?, Data GO?, Model GO?, Robot GO?, Business GO?, Ethics GO?, Next Step GO?","X Loon launch GO/NO-GO had balloon, navigation, airspace, business, ethics polls","Student example: Capstone prep revealed business NO-GO - model worked but cost $500/month for farmer - pivoted to SMS before Demo Day"],kidQA:[{q:"Do we need all 7? Can't we just show AI model?",a:"Model alone is like rocket engine without rocket. NASA never launches engine alone. Problem + Data + Model + Robot + Business + Ethics + Next Step = mission. Missing one = NO-GO."},{q:"What if one poll is NO-GO week before Demo Day?",a:"Then you fix or you present NO-GO honestly at Demo Day and say next step to make it GO. Honest NO-GO is more innovator than fake GO."},{q:"What is Next Step poll?",a:"Who continues after you? Handoff plan. If your capstone dies after Demo Day, it wasn't mission, it was project. Mission continues."}],vocab:[{term:"Mission Control Prep",def:"7-poll checklist before launch: Problem, Data, Model, Robot/Agent, Business, Ethics, Next Step. All must be GO or honestly NO-GO with fix.",example:"Problem GO if real user says problem real"},{term:"GO/NO-GO",def:"Each poll says GO (ready) or NO-GO (not ready) with reason and fix. NO-GO is okay if honest.",example:"Data NO-GO: Only 50 images, need 500 - next step: partner with school"},{term:"7-Poll Canvas",def:"Visual board with 7 polls, each has status, evidence, next step.",example:"Canvas on wall, each poll sticky"},{term:"Handoff Plan",def:"Who continues mission after Demo Day? Not you alone.",example:"Handoff to local NGO, open source, next 9th graders"}]},mentalModelDeep:{teacherAnalogy:"Apollo 13: 'Houston, we've had a problem.' Mission Control had 7 polls. Flight said GO/NO-GO for trajectory, Surgeon for crew health, EECOM for power. Because they had rehearsed GO/NO-GO, they saved crew with 15 min to spare. Your capstone is Apollo 13 before launch - you run GO/NO-GO to find problem before Demo Day, not after. Each poll asks: Do you have evidence? Not opinion. Problem poll: Do you have interview video of farmer saying problem real? Data poll: Do you have 100+ images from farmers with consent? Model poll: Did real user test it? Robot poll: Does hardware work in field? Business poll: Can farmer afford? Ethics poll: Who harmed? Next Step: Who continues? If any NO-GO, you don't hide, you say at Demo Day: 'Data NO-GO, here's fix.' That's innovator honesty.",studentAnalogy:"You plan road trip with friends. Mission Control Prep is checking: Car (Robot) GO? Gas money (Business) GO? Map (Problem/Data) GO? Driver license (Ethics) GO? What if car breaks after you leave? Next Step: AAA number. Without check, you stranded. Capstone same - check before Demo Day, not during. And you need handoff - who drives after you graduate? If no one, trip ends at Demo Day, not mission.",sketchSteps:["1. Draw Mission Control room - 7 desks - label polls - 10 sec","2. Draw rocket on launch pad - label capstone - 10 sec","3. Draw 7 lights Red/Yellow/Green for each poll - 15 sec","4. Draw 1 light Red - label NO-GO with fix - 15 sec","5. Draw handoff arrow to next crew - Next Step - 10 sec"],wrongVsRight:{wrong:"Prep is 7 slides of features: Problem slide, data slide, model accuracy 95%, robot photo, business 'we will sell', ethics 'no bias', next step 'scale globally.' No evidence, all GO, no NO-GO.",right:"Prep: Problem GO - video farmer interview. Data NO-GO - only 50 images, need 200 - fix: partner with 2 schools. Model YELLOW - 80% acc, fails on dark skin - fix: collect more. Robot GO - stick works. Business NO-GO - costs $30/month, farmer can pay $5 - pivot to SMS. Ethics YELLOW - data consent done, but women's access missing - fix. Next Step GO - NGO will continue."},bridgeQuestion:"Why is honest NO-GO more powerful at Demo Day than fake GO? How does this connect to W31 moonshot kill signal?"},examples:[{title:"Prep: Flood Alert 7-Poll",story:"Problem GO: Video 3 farmers saying no warning. Data YELLOW: 5 years river data but no village-level. Model YELLOW: 75% acc, fails flash flood. Robot GO: Paper phone works. Business GO: SMS $0.02. Ethics YELLOW: Women no phones. Next Step GO: Local radio handoff.",howItWorks:"Canvas shows evidence per poll: Video, data sample, test logs, cost calc, ethics interview, handoff letter from radio. NO-GO honest.",whereToSee:"NASA GO/NO-GO video, X Loon checklist",discussionQ:"Would you launch with 2 YELLOW?",whatIf:"Business NO-GO, can't afford SMS - what next step?",ethicsLens:{benefits:"Honest launch",harmed:"If NO-GO hidden",missing:"Long-term maintenance",trafficLight:"Yellow"}},{title:"Prep: Crop Doctor 7-Poll",story:"Problem GO, Data NO-GO (50 images), Model YELLOW (glare issue), Robot YELLOW (one-hand hard), Business NO-GO ($30), Ethics YELLOW, Next Step GO (agri school).",howItWorks:"Fixes: Partner for 200 images, add voice, cost to $0 via SMS, women's group for ethics. Demo Day presents NO-GOs + fixes - stronger than fake GO.",whereToSee:"Student capstone prep videos",discussionQ:"Is it okay to demo with NO-GOs?",whatIf:"All GO but Next Step NO-GO - no one continues?",ethicsLens:{benefits:"Sustainable handoff",harmed:"If handoff not real",missing:"Who owns data after handoff?",trafficLight:"Green"}},{title:"Prep: Sign Avatar 7-Poll",story:"Problem GO, Data YELLOW (not enough Deaf signers), Model RED (uncanny), Robot GO, Business YELLOW, Ethics RED (Deaf community says no avatar), Next Step NO-GO.",howItWorks:"Ethics RED kills launch. Pivot: Don't build avatar, build tool for human interpreters to work faster. Honest NO-GO at Demo Day = innovator.",whereToSee:"Signapse ethics red case",discussionQ:"Should ethics RED stop launch even if tech works?",whatIf:"Tech works but community says no - what is GO?",ethicsLens:{benefits:"Community veto power",harmed:"If ignored",missing:"Deaf ownership",trafficLight:"Red"}},{title:"Prep: Wildfire Ears 7-Poll",story:"All YELLOW, no RED. Problem GO, Data GO (100 sounds), Model YELLOW (false alarms), Robot YELLOW (battery), Business GO (solar free), Ethics YELLOW (Indigenous consent pending), Next Step GO (rangers). Launch with YELLOW monitoring.",howItWorks:"YELLOW means launch but watch. Monitor false alarms, battery, consent. Next Step: Ranger training.",whereToSee:"Rainforest Connection GO/NO-GO",discussionQ:"When is YELLOW okay to launch?",whatIf:"False alarms cause ranger to ignore - becomes RED?",ethicsLens:{benefits:"Monitored launch",harmed:"Alert fatigue",missing:"Forest animals",trafficLight:"Yellow"}},{title:"Prep: Mental Health 7-Poll",story:"Problem GO, Data RED (no consent for chats), Model RED (risk detection not safe), Robot GO, Business YELLOW, Ethics RED, Next Step NO-GO. NO-GO launch - don't demo AI, demo research + next step to get consent + therapist review.",howItWorks:"Honest NO-GO: 'We cannot launch AI chat safely yet. Next step: Partner with counselor, get consent, test with 5 teens.' Shows maturity.",whereToSee:"Koko NO-GO case",discussionQ:"Is NO-GO failure?",whatIf:"You launch RED and teen harmed?",ethicsLens:{benefits:"Safety first",harmed:"Huge if RED launched",missing:"Teen agency",trafficLight:"Red"}},{title:"Prep: Solar Trade 7-Poll",story:"Problem GO, Data GO, Model GO (forecast 85%), Robot GO, Business YELLOW (fees), Ethics YELLOW (inequality), Next Step GO (co-op). Launch with fee cap and community rule.",howItWorks:"Business fix: Cap fee 5%, community vote price. Ethics fix: Max energy per household. Next Step: Co-op owns AI.",whereToSee:"Husk Power GO/NO-GO",discussionQ:"Can business + ethics both be GO with caps?",whatIf:"Rich buy all energy despite cap?",ethicsLens:{benefits:"Community owned",harmed:"If caps bypassed",missing:"Women's energy needs",trafficLight:"Green"}}],physicalComputing:{title:"Mission Control GO/NO-GO Board",goal:"7 micro:bits = 7 polls, each shows Red/Yellow/Green, central micro:bit counts GO",wiring:"7 micro:bits (or 1 micro:bit cycling 7 polls). Use buttons to set status. Radio to central.",code:"Each poll micro:bit: A = cycle Red->Yellow->Green, B = send status. Central: Count GO, show launch status. If any RED = NO-GO alarm. Teacher: logs history of polls.",challenge:"Set your capstone polls honestly. Present to class Mission Control, get GO/NO-GO vote."},communityData:{prompt:"Post your 7-poll status - which is RED/YELLOW?",sampleData:[]},script90:[{name:"Apollo 13",minutes:"0-12",teacherSays:"Gene Kranz: GO/NO-GO saved Apollo 13. 7 polls, each says GO or NO-GO with evidence. Honest NO-GO saves lives. Your capstone needs same.",studentDoes:"Watch GO/NO-GO video, list 7 polls for AI capstone",materials:"NASA video, 7-poll template",checks:"Can name 7 polls"},{name:"7-Poll Model",minutes:"12-27",teacherSays:"Problem GO needs user video, not your opinion. Data GO needs 100+ images with consent. Model GO needs real user test. Business GO needs cost farmer can pay. Ethics GO needs who harmed + fix. Next Step GO needs handoff letter.",studentDoes:"Sketch Mission Control with 7 lights",materials:"Mission Control canvas",checks:"Lights labeled with evidence needed"},{name:"NO-GO Gallery",minutes:"27-47",teacherSays:"6 preps with RED/YELLOW. Honest NO-GO is gold, fake GO is failure. Which would you fund? Honest or fake?",studentDoes:"Analyze examples, vote: Which honest NO-GO is most innovator?",materials:"Prep cards",checks:"Values honest NO-GO"},{name:"Control Board",minutes:"47-67",teacherSays:"Build GO/NO-GO board: 7 polls, set Red/Yellow/Green honestly. Central counts GO.",studentDoes:"Code poll boards, set status for own capstone",materials:"micro:bits",checks:"Status honest, not all Green"},{name:"My Control",minutes:"67-82",teacherSays:"Fill 7-poll canvas for your capstone with evidence + NO-GO fixes. Must have at least 1 YELLOW/RED honestly.",studentDoes:"Complete canvas, peer GO/NO-GO poll",materials:"7-poll canvas",checks:"Has evidence, at least 1 non-Green"},{name:"Launch Poll",minutes:"82-90",teacherSays:"Mission Control poll: Problem? Data? Model? Robot? Business? Ethics? Next Step? Class votes GO/NO-GO for each team.",studentDoes:"Teams present polls, class says GO/NO-GO",materials:"None",checks:"Teams accept NO-GO with fix"}],unplugged:{title:"Mission Control Simulation",roles:["Flight Director (runs poll)","7 Poll Officers (Problem, Data, Model, Robot, Business, Ethics, Next Step)","Capstone Team (answers)"],steps:["Poll Officers get evidence envelope (some weak)","Flight Director calls each poll: 'Problem, GO/NO-GO?' Officer must say GO/NO-GO with evidence","If NO-GO, team proposes fix + timeline","After 7 polls, Flight Director says 'We are GO/NO-GO for Demo Day'","Debrief: Did any Officer say GO when evidence NO-GO? Why honesty matters"],variations:["Add surprise failure: 'Data officer, your data was deleted, now NO-GO' - test resilience","Next Step officer must have handoff letter from real person - if not, NO-GO"]},workbook:{questions:["Fill 7-poll canvas with evidence for each","Which poll is RED/YELLOW? What is fix + timeline?","Who continues after Demo Day? Show handoff letter/email","If you had to launch with 1 RED, which RED is okay vs not okay? Why?"],assessment:{criteria:["7 polls with evidence, not opinion","At least 1 YELLOW/RED honest","Business cost farmer can pay","Next Step handoff real"],rubric:"Gold = All 7 with evidence + honest NO-GO + handoff; Purple = 6; Needs control = 5 or less"}}},{id:"W36",num:36,title:"Capstone Expo",subtitle:"Innovator Demo Day",mentalModel:"Demo Day for World Change",color:"from-amber-500 to-purple-600",hero:"DEMO DAY FOR WORLD CHANGE",teacherBackground:{history:"Demo Day started Y Combinator 2005 - startups pitch 3 min to change world. 2010: Stanford d.school added Demo Day for social good. X Development Demo Day: Not 'look what we built' but 'look what problem we solved, what we learned, what next.' 2019: First AI for Good Demo Day with 100 teen capstones. Structure: Moonshot (30s) + Demo (60s) + Metrics (30s) + Ethics (30s) + Business (30s) + Next Step (30s) = 3 min. Why 3 min? Forces clarity. If you can't explain in 3 min, you don't understand.",why9th:"9th graders think Demo Day is show, not tell. Need to learn demo is story: Moonshot (why), Demo (what), Metrics (proof), Ethics (who harmed), Business (can it live), Next Step (who continues). This is final integration W31-36. Also teaches audience: Demo Day is not for grade, but for world - invite community, farmers, rangers, not just teachers. Research: Students who demo to real community show 2x more likely to continue mission after class. W36 is not end, it's launch.",realWorld:["YC Demo Day: 3 min, 1 slide, metrics, next step - same structure","AI for Good Summit Demo Day: Teen flood alert demoed to 200M alert team, got internship","Student: Capstone demoed to city council, got $5k to pilot"],kidQA:[{q:"What if demo fails live?",a:"Then you show what you learned from fail + next step. Apollo 13 demo failed but story saved future. Live fail with honest learning is more innovator than fake success video."},{q:"Who should be in audience?",a:"Not just teacher. Invite community you designed with - farmer, Deaf student, ranger. They are judges of mission, not teacher."},{q:"What happens after Demo Day?",a:"Next Step poll from W35 happens. Handoff. If no handoff, capstone was project, not mission. Mission continues without you - that's success."}],vocab:[{term:"Demo Day for World Change",def:"3-min pitch: Moonshot + Demo + Metrics + Ethics + Business + Next Step, for community, not just grade.",example:"Demo to farmers, not just teacher"},{term:"Metrics that Matter",def:"Proof lives changed, not just accuracy. 10 farmers used weekly > 95% accuracy.",example:"Metric: 5 farmers diagnosed disease correctly in field"},{term:"Ethics Card",def:"30s honest: Who benefits, who harmed, who missing, traffic light, fix.",example:"Card: Benefits farmers, harmed if wrong diagnosis, missing women, Yellow, fix: women's group"},{term:"Handoff",def:"Who continues mission after you. Letter, email, open source, next class.",example:"Handoff to NGO with data + model"}]},mentalModelDeep:{teacherAnalogy:"Demo Day is not talent show. Talent show: 'Look at me.' Demo Day for World Change: 'Look at problem we solved together, and who continues.' Structure is story arc: Moonshot (why we jumped), Demo (what we built), Metrics (proof it works for real people), Ethics (who we harmed + fix), Business (can it live without us?), Next Step (who continues). 3 min forces you to cut fluff. If you spend 2 min on model architecture, you missed point - community cares if farmer can use it, not if transformer. Teacher demo: Show 2 pitches - one tech-focused (fails), one mission-focused (wins). Ask: Which would farmer fund?",studentAnalogy:"You made short film for family, not for Oscar. Family cares: What story (moonshot), did it make them laugh/cry (metrics - did it work?), who was left out (ethics), can they watch again (business - can it live?), will you make sequel (next step). Demo Day same - audience is community, not teacher. If farmer in audience understands and says 'I want this', you win, even if model 80% not 95%. If teacher understands but farmer doesn't, you lost mission.",sketchSteps:["1. Draw stage with 6 boxes: Moonshot, Demo, Metrics, Ethics, Business, Next Step - 10 sec","2. Draw audience - not teacher, but farmer, Deaf student, ranger - 15 sec","3. Draw timer 3 min - label 30s each box - 10 sec","4. Draw metrics as people, not % - 5 stick figures using product - 15 sec","5. Draw handoff arrow off stage to next crew - 10 sec"],wrongVsRight:{wrong:"Demo: 3 min of model architecture, accuracy 95%, code screenshot, 'future work scale globally', no community, no ethics, no handoff. Audience: teacher nods, farmer sleeps.",right:"Demo: 30s moonshot + personal why, 60s live demo with farmer using it (or video of farmer), 30s metrics: 5 farmers used, 30s ethics card honest Yellow + fix, 30s business: SMS $0.02 farmer can pay, 30s next step: NGO continues + open source. Farmer audience says 'When can I get it?'"},bridgeQuestion:"How does W36 Demo Day prove W31 moonshot, W32 mission, W33 blueprint, W34 model, W35 prep were worth it? What would happen if you skipped W33 blueprint and went straight to demo?"},examples:[{title:"Expo: Flood Alert Demo",story:"Moonshot: 10x flood warning for 200M. Demo: Paper phone + real SMS alert video at 2am. Metrics: 3 farmers got alert, moved cows, saved $500. Ethics: Yellow - women no phones, fix radio. Business: SMS $0.02, govt pays. Next Step: Radio station handoff + open source.",howItWorks:"3-min pitch with farmer video testimonial, not tech. Metrics people not %. Ethics card honest. Handoff letter from radio.",whereToSee:"AI for Good Demo Day 2023 recordings",discussionQ:"Why farmer video > accuracy chart?",whatIf:"Demo fails - SMS doesn't arrive?",ethicsLens:{benefits:"Community centered",harmed:"If no handoff",missing:"Long term funding",trafficLight:"Green"}},{title:"Expo: Crop Doctor Demo",story:"Moonshot: End crop loss. Demo: Farmer at market uses stick phone, diagnoses. Metrics: 5/5 correct, 30 sec. Ethics: Yellow, data consent done, women access fix. Business: Free via agri extension. Next Step: Agri school continues data collection.",howItWorks:"Live demo with farmer, not student. Metrics: time + correct. Ethics + business + next step each 30s.",whereToSee:"PlantVillage Demo Day",discussionQ:"What if farmer in audience asks hard question?",whatIf:"Model wrong live - how handle?",ethicsLens:{benefits:"Real user demo",harmed:"Farmer time",missing:"Payment",trafficLight:"Green"}},{title:"Expo: Sign Avatar Demo",story:"Moonshot: End exclusion. Demo: Deaf student tests avatar, says 'creepy' - pivot demoed: tool for interpreters, not avatar. Metrics: Interpreter 2x faster. Ethics: RED became YELLOW after pivot. Business: Interpreter org pays. Next Step: Deaf org co-owns.",howItWorks:"Demo shows pivot due to ethics RED - more powerful than fake success. Shows listening.",whereToSee:"Signapse pivot demo",discussionQ:"Is pivot demo failure or success?",whatIf:"Audience says 'Why not just human interpreters?'",ethicsLens:{benefits:"Shows ethics veto",harmed:"If Deaf org not paid",missing:"Deaf ownership",trafficLight:"Yellow"}},{title:"Expo: Wildfire Ears Demo",story:"Moonshot: Save forests. Demo: Sound box plays chainsaw, ranger gets alert in 1 min video. Metrics: 90% detection, 1 false alarm/day. Ethics: Yellow, Indigenous consent letter. Business: Solar free, rangers maintain. Next Step: Rangers own 10 boxes.",howItWorks:"Sound demo + ranger video, not tech specs. Metrics false alarm matters. Ethics consent shown.",whereToSee:"Rainforest Connection demo",discussionQ:"What metric matters to ranger? Accuracy or false alarms?",whatIf:"Ranger says 'We need 100 boxes, not 1'?",ethicsLens:{benefits:"Ranger centered",harmed:"Surveillance",missing:"Animals",trafficLight:"Green"}},{title:"Expo: Mental Health Demo - NO-GO",story:"Moonshot: Help teens. Demo: NO-GO honest - cannot demo AI safely yet. Shows research, teen interviews, next step: counselor partnership, consent process, 5-teen pilot. Metrics: 20 teens said they'd chat, but safety RED. Ethics: RED, so NO-GO. Business: School counselor would pay. Next Step: Counselor co-design.",howItWorks:"NO-GO demo is gold - shows maturity to not launch unsafe AI. More innovator than unsafe launch.",whereToSee:"Koko NO-GO demo",discussionQ:"Would you fund NO-GO team or unsafe GO team?",whatIf:"Audience says 'Just launch, teens need help now'?",ethicsLens:{benefits:"Safety first",harmed:"If launched RED",missing:"Teen agency",trafficLight:"Red"}},{title:"Expo: Solar Trade Demo",story:"Moonshot: Energy for 600M. Demo: Villagers play trading game, then show AI forecast + real trade via phone money. Metrics: 10 trades, $5 saved. Ethics: Yellow, cap prevents rich buying all. Business: 5% fee, co-op owns. Next Step: Co-op continues.",howItWorks:"Game + real trade, community rules demoed. Metrics $ saved, not forecast accuracy.",whereToSee:"Husk Power demo",discussionQ:"What metric would co-op care?",whatIf:"Trade game shows no one wants to trade?",ethicsLens:{benefits:"Community owned",harmed:"If elite capture",missing:"Women's control",trafficLight:"Green"}}],physicalComputing:{title:"Demo Day Timer & Clapper",goal:"micro:bit is Demo Day timer - 30s per section, applause meter",wiring:"micro:bit + buzzer. Timer for 3 min, beep each 30s. Sound sensor for applause.",code:"A = start 3-min time
