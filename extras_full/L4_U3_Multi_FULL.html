 2.3 7.286 7.286",key:"1wuzzi"}],["circle",{cx:"11",cy:"11",r:"2",key:"xmgehs"}]]);var wt=F("Play",[["polygon",{points:"6 3 20 12 6 21 6 3",key:"1oa8hb"}]]);var kt=F("Shield",[["path",{d:"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z",key:"oel41y"}]]);var Cn=F("Sparkles",[["path",{d:"M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z",key:"4pj2yx"}],["path",{d:"M20 3v4",key:"1olli1"}],["path",{d:"M22 5h-4",key:"1gvqau"}],["path",{d:"M4 17v2",key:"vumght"}],["path",{d:"M5 18H3",key:"zchphs"}]]);var Et=F("Users",[["path",{d:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2",key:"1yyitq"}],["circle",{cx:"9",cy:"7",r:"4",key:"nufk8"}],["path",{d:"M22 21v-2a4 4 0 0 0-3-3.87",key:"kshegd"}],["path",{d:"M16 3.13a4 4 0 0 1 0 7.75",key:"1da9ce"}]]);var Ct=F("Volume2",[["path",{d:"M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z",key:"uqj9uw"}],["path",{d:"M16 9a5 5 0 0 1 0 6",key:"1q6k2b"}],["path",{d:"M19.364 18.364a9 9 0 0 0 0-12.728",key:"ijwkga"}]]);var Or=F("Zap",[["path",{d:"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z",key:"1xq2db"}]]);var ms=He(Nn(),1),Z0=Symbol.for("react.element");var G0=Object.prototype.hasOwnProperty,J0=ms.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,q0={key:!0,ref:!0,__self:!0,__source:!0};function ys(e,n,t){var r,l={},u=null,o=null;t!==void 0&&(u=""+t),n.key!==void 0&&(u=""+n.key),n.ref!==void 0&&(o=n.ref);for(r in n)G0.call(n,r)&&!q0.hasOwnProperty(r)&&(l[r]=n[r]);if(e&&e.defaultProps)for(r in n=e.defaultProps,n)l[r]===void 0&&(l[r]=n[r]);return{$$typeof:Z0,type:e,key:u,ref:o,props:l,_owner:J0.current}}var i=ys,f=ys;var Lr=[{id:"W13",num:13,title:"What is Multi-modal?",subtitle:"Text + Image + Voice together",mentalModel:"Senses Together",mentalEmoji:"\uD83D\uDC41️\uD83D\uDC42\uD83D\uDDE3️",color:"from-indigo-600 to-violet-600",teacherBackground:{history:"Multi-modal AI emerged in 2021 with OpenAI CLIP. Before that, AI models were 'siloed' - vision models only saw, language models only read. CLIP was first to learn joint embedding: 400M image-text pairs trained to understand that 'a photo of a dog' and an actual dog photo live in same vector space. 2022: DeepMind Flamingo, Google PaLI. 2023: GPT-4V made multi-modal mainstream. The breakthrough was contrastive learning - teaching AI that senses belong together, like human brain's superior colliculus integrating senses.",whyGrade9:"9th graders already live multi-modally: TikTok combines text+audio+video, they read memes (text+image), voice-note friends. They think AI is just ChatGPT text. This week shatters that - shows intelligence is sensory integration. Needed for their future: all 2030 interfaces are multi-modal (AR glasses, voice + gesture). Cognitive science: adolescents develop abstract integration at 14-15, perfect timing to understand fusion.",realWorld:["TikTok search: type 'funny cat falling' finds video by understanding visuals + captions","Google Lens: point phone at plant + ask 'is this poisonous?' uses image+text","Snapchat filters: tracks face (vision) + voice commands","Self-driving cars fuse LiDAR+camera+map text"],kidQA:[{q:"Is my brain multi-modal?",a:"YES! When you eat pizza, eyes see cheese pull, nose smells basil, tongue tastes salt, ears hear crunch - brain fuses all into 'pizza!'. AI now copies that.",followUp:"What happens if you close eyes while eating? How does taste change?"},{q:"Can AI hallucinate in multi-modal?",a:"Yes and it's weirder. Text AI might make up facts. Multi-modal AI might see a cat but describe a dog because its text bias overrides vision. That's called modality dominance.",followUp:"If AI must choose between what it sees vs what caption says, which should win?"},{q:"Why not just use text?",a:"Because world isn't text. A photo of a spilled chemical has info text can't capture - color, amount, spread. Doctor needs X-ray image + patient text notes + voice cough. Single modality misses 70% of reality.",followUp:"List 3 things you understand better with image+text than text alone."}],vocab:[{term:"Modality",def:"A channel of information",example:"Vision is one modality, audio is another, like different senses"},{term:"Fusion",def:"Combining modalities into one understanding",example:"Your brain fuses sight of ball + sound of bounce = ball is real"},{term:"Embedding",def:"Turning anything into numbers AI can compare",example:"CLIP turns both 'dog' word and dog photo into same number pattern"},{term:"Cross-modal",def:"Task requiring two senses together",example:"Describe this image needs vision+language cross-modal"}]},mentalModelDeep:{teacherAnalogy:"Imagine teaching someone to cook biryani only via text recipes, never showing them, never letting them smell spices. They'd fail. Humans learn by integrating: mother shows (vision), says 'add pinch' (audio), lets child taste (gustatory). Multi-modal AI is moving from blind recipe-reader to apprentice who watches, listens, tastes. The superior colliculus in midbrain literally has neurons that fire only when visual+audio together - e.g., seeing lips move + hearing speech = understanding. CLIP is artificial colliculus.",studentAnalogy:"You and friends playing 'guess the song' - one friend hums (audio), another acts (visual), another mouths lyrics (text). Alone each clue is weak. Together you get it in 2 seconds. Multi-modal AI = all three friends in one brain.",sketchSteps:[{step:"Draw brain with 3 arrows in",sec:12,draw:"Brain center, eye icon arrow, ear icon arrow, mouth/text icon arrow"},{step:"Add fusion circle in middle",sec:12,draw:"Overlap area where arrows meet = fusion zone, label 'UNDERSTANDING'"},{step:"Show single modality fail",sec:12,draw:"Eye alone sees 'jaguar' animal? car? Draw confusion bubble"},{step:"Show multi-modal success",sec:12,draw:"Eye + text 'Amazon rainforest' = animal jaguar clearly, draw checkmark"},{step:"Label with life example",sec:12,draw:"Add your example: meme = image + text joke, arrow to brain"}],wrongVsRight:{wrong:"AI that only looks at image OR only reads text, like covering one eye",right:"AI that looks AND reads AND listens together, using all to decide",fix:"Ask: Would a human solve this with one sense? If not, AI needs multi-modal too"},bridgeQuestion:"If you had to teach an alien what a 'birthday party' is, would you use only words, or would you show photos + play happy birthday song + describe? What does alien need most?"},examples:[{title:"Meme Understander",story:"Aisha sees meme: image of distracted boyfriend looking at other girl, text 'Me looking at new iPhone while my old phone still works'. Without text, just cheating. Without image, no joke. Together = relatable tech guilt.",howItWorks:"CLIP encodes image into vector (boyfriend looking away) + text into vector (iPhone desire). Fusion model measures alignment + cultural context embedding.",whereToSee:"Instagram Explore uses this to rank memes",discussionQ:"Can AI find meme funny? What does it need beyond image+text?",whatIf:"What if AI only trained on Western memes - would it get Indian meme about Sharma ji ka beta?",ethics:{benefits:"Accessibility - describe memes to blind users",harmed:"If training data lacks cultural memes, cultures become invisible",missing:"Whose humor is considered 'funny' in dataset?",trafficLight:"yellow",reason:"Bias in humor; low risk but cultural erasure"}},{title:"Doctor's Assistant",story:"Dr. Chen gets chest X-ray + patient note 'dry cough 3 weeks, night sweats' + audio of cough. Each alone ambiguous. Together = clear TB pattern.",howItWorks:"Vision model spots lung opacity, language model parses symptoms, audio model classifies cough. Multi-modal transformer attends across all three, weights X-ray highest.",whereToSee:"Qure.ai in India hospitals",discussionQ:"Should AI diagnose or only assist? Where to draw line?",whatIf:"What if audio says smoker's cough but patient denies smoking - which modality to trust?",ethics:{benefits:"Faster TB detection in rural clinics",harmed:"If trained only on adult males, misses TB in children",missing:"Patient privacy - voice is biometric identifier",trafficLight:"red",reason:"High stakes medical + privacy sensitive voice"}},{title:"Lost and Found",story:"Rahul loses backpack at school. He types 'blue Adidas backpack with Naruto keychain' + uploads photo of similar backpack + voice note 'has torn left strap'. Security AI fuses all to find.",howItWorks:"Text embedding: blue+Adidas+Naruto. Image embedding: shape+color. Audio embedding: torn strap = damage detection. Joint search across camera footage.",whereToSee:"Airport baggage systems",discussionQ:"Is it okay for school to scan camera footage for objects?",whatIf:"What if two backpacks match description - how should AI decide?",ethics:{benefits:"Finds lost items fast",harmed:"Constant camera scanning = surveillance",missing:"Consent to be searched via cameras",trafficLight:"yellow",reason:"Surveillance trade-off"}},{title:"Cooking with Grandma",story:"Grandma's recipe says 'add spices until aroma good'. Text vague. Granddaughter video calls, shows color (vision), Grandma says 'more red' (audio), texts 'haldi 1 tsp' (text). Together works.",howItWorks:"Multi-modal instruction following: language model parses recipe, vision model estimates color, audio model detects sizzle sound for doneness.",whereToSee:"YouTube cooking - auto chapters use audio+vision+transcript",discussionQ:"Can AI ever learn 'until aroma good' - something humans smell?",whatIf:"What if AI has no smell sensor - how to learn aroma?",ethics:{benefits:"Preserves oral recipes via video+audio",harmed:"If AI standardizes recipes, regional variations lost",missing:"Who owns grandma's recipe knowledge?",trafficLight:"green",reason:"Low risk cultural preservation"}},{title:"Self-Driving Sees",story:"Car sees stop sign partially covered by sticker (vision says 45 mph?), map text says 'stop intersection ahead', driver voice says 'whoa stop!'. Car fuses: must stop.",howItWorks:"Sensor fusion: camera 60% confidence stop, HD map text 90% stop ahead, cabin mic detects urgency. Bayesian fusion decides stop > safety threshold.",whereToSee:"Tesla, Waymo",discussionQ:"If modalities conflict, which should win? Why?",whatIf:"What if vandal changes map data to say no stop - how to protect?",ethics:{benefits:"Safer roads",harmed:"Over-reliance; drivers stop paying attention",missing:"Liability when AI mis-fuses",trafficLight:"red",reason:"Life-critical; conflict resolution crucial"}},{title:"Homework Helper",story:"Priya stuck on physics diagram: pulley system image + problem text 'Find tension' + voice 'I don't get which direction'. AI uses diagram + text + her confusion tone.",howItWorks:"OCR reads diagram labels, vision parses pulley arrangement, language parses question, audio sentiment detects frustration -> adjusts explanation style.",whereToSee:"Photomath + Khanmigo multi-modal",discussionQ:"Should AI give answer or guide? Does seeing diagram change that?",whatIf:"What if student uploads answer key photo asking 'explain this' - is that cheating?",ethics:{benefits:"Personalized learning",harmed:"Cheating at scale if misused",missing:"Does AI replace teacher's eye for confusion?",trafficLight:"yellow",reason:"Learning integrity vs support"}}],physical:{title:"Senses Together Board",goal:"Build micro:bit that needs BOTH light sensor + button press + shout to unlock - no single modality works",materials:["micro:bit","light sensor (built-in)","USB cable","cardboard box"],steps:["Program: if light > 150 AND button A pressed AND loud sound > threshold -> show heart","Build box with lid - needs light (open), button (touch), shout (voice)","Test: try only light -> fails, only shout -> fails, all three -> success","Debate: which real AI needs this?","Iterate: add shake as 4th modality"],code:"input.onSound(DetectedSound.Loud, ()=>{ loud=true }); basic.forever(()=>{ if(input.lightLevel()>150 && input.buttonIsPressed(Button.A) && loud){ display.show(Heart) } })",success:["Fails with 1 modality","Succeeds with 3 fused","Can explain fusion"]},community:{prompt:"Collect 10 objects where text alone fails but image+text together works. Photograph + caption.",contribution:"Photo + 1-sentence why needs both",galleryTitle:"Senses Together Gallery"},script90:{phases:[{name:"Hook: Blind Taste Test",mins:"0-10",teacher:"Blindfold 3 volunteers, feed lemon vs orange, ask identify with taste only, then with sight+taste",student:"Experience single vs multi-modal, journal: which was easier?",check:"Can students name 2 modalities used?",tip:"Use safe foods, have wipes"},{name:"Direct: Senses Together Model",mins:"10-25",teacher:"Draw brain fusion diagram, story of CLIP 2021 breakthrough, demo CLIP search live",student:"Sketch 5 steps, label own example (meme, cooking)",check:"Sketch has 3 inputs + fusion?",tip:"Keep CLIP demo simple - search 'cat' vs 'cat meme'"},{name:"Explore: Meme Lab",mins:"25-45",teacher:"Give 6 memes with/without text, students rate funniness single vs multi-modal",student:"Rate 1-5, discuss in groups: what missing?",check:"Can explain why both needed?",tip:"Use school-appropriate memes"},{name:"Build: Fusion Board",mins:"45-70",teacher:"Guide micro:bit fusion code, troubleshoot modality thresholds",student:"Wire, code, test failure cases, present",check:"Device requires 3 modalities?",tip:"Pre-set light thresholds for room"},{name:"Ethics: Who's Missing?",mins:"70-80",teacher:"Show dataset bias: CLIP fails on non-Western weddings",student:"Audit: whose senses are in AI training data?",check:"Can name harmed group?",tip:"Use traffic light protocol"},{name:"Reflect: Gallery Prep",mins:"80-90",teacher:"Introduce community pool, assign object hunt homework",student:"Plan object, write caption draft, exit ticket: define modality",check:"Exit ticket correct?",tip:"Show exemplar gallery entry"}]},unplugged:{scenario:"Human Fusion Machine - 3 students become one AI",roles:[{role:"Eye (vision)",does:"Can only see image, cannot speak, must draw"},{role:"Ear (audio)",does:"Can only hear description, must hum/clap pattern"},{role:"Brain (fusion)",does:"Cannot see/hear directly, must combine drawings + sounds to guess object"}],steps:["Eye sees secret object photo (e.g., bicycle)","Eye draws outline silently","Ear hears teacher whisper 'two wheels, pedals' - translates to rhythm (two claps)","Brain gets drawing + rhythm, guesses, must justify using both","Rotate roles, new object","Discuss: when did brain ignore one modality? Why?"],variations:["Add Mouth role: can only write text label","Noisy channel: Ear wears headphones with music","Conflict: Eye sees cat, Ear hears 'dog' - Brain must resolve"]},workbook:{keyIdeas:["Modality = sense channel","Fusion = combining senses","Single modality often ambiguous","CLIP = first big fusion model 2021"],tasks:[{q:"Draw your morning routine using 3 modalities: what you see, hear, read",type:"sketch"},{q:"Find 3 TikToks that need both audio + text to understand. Explain.",type:"analysis"},{q:"If you were blind, how would you understand memes? Design alternative.",type:"design"}],assessment:{mcq:[{q:"Which is multi-modal?",opts:["Only text ChatGPT","Image + caption search","Only image classifier","Only voice recorder"],ans:1},{q:"CLIP was released in:",opts:["2018","2021","2015","2023"],ans:1}],rubric:"3 pts: Defines modality + example, 2 pts: Explains why fusion helps, 2 pts: Gives real-world use, 1 pt: Sketch includes fusion zone"}}},{id:"W14",num:14,title:"CLIP - Text and Image Matching",subtitle:"Matching captions to pictures",mentalModel:"Matching Game",mentalEmoji:"\uD83E\uDDE9",color:"from-violet-600 to-purple-600",teacherBackground:{history:"Jan 2021: OpenAI released CLIP (Contrastive Language-Image Pre-training). Trained on 400M image-text pairs scraped from web. Key insight: don't label images with fixed categories (cat/dog), instead learn from natural language captions. Used contrastive loss: push matching pairs together in embedding space, non-matching apart. Zero-shot: could classify images it never trained on by comparing to text prompts. Before CLIP, vision models needed 1000s of labeled examples per class. CLIP needed zero. 2022: OpenCLIP open-source, 2023: SigLIP improvement. Foundation for DALL-E, Stable Diffusion.",whyGrade9:"Matching is intuitive for 14-year-olds: they play memory match, Tinder swipe, Instagram caption guess. CLIP is just super-powered matching. They already do zero-shot: see new meme format, understand instantly without training. CLIP formalizes that. Also critical AI literacy: reverse image search, why Google finds images from text - that's CLIP. Understand embedding = understand how TikTok recommends.",realWorld:["Google Images search: type words, finds pictures = CLIP","E-commerce: upload photo of dress, find similar text description","Content moderation: match image to banned text descriptions","DALL-E uses CLIP to judge if generated image matches prompt"],kidQA:[{q:"How does CLIP know my caption matches image?",a:"CLIP turns both into numbers (vectors) in same 512-dimension space. If caption 'dog on beach' and dog beach photo, their vectors point same direction (cosine similarity high). Like two arrows pointing same way = match.",followUp:"If vectors point opposite, what does that mean?"},{q:"Can CLIP be tricked?",a:"Yes! Write 'apple' on a picture of orange with marker - CLIP often reads text not image (typographic attack). Because it trusts text modality too much. Researchers printed 'iPod' label on apple, CLIP said iPod.",followUp:"How would you defend against text trick?"},{q:"Does CLIP understand or just match?",a:"Hot debate. CLIP matches patterns, but does it understand dog is animal that barks? It passes some understanding tests, fails others (can't count dogs). We say 'shallow understanding' - good at matching, weak at reasoning.",followUp:"What's difference between matching and understanding?"}],vocab:[{term:"Contrastive Learning",def:"Learn by comparing: push matches together, non-matches apart",example:"Like learning friends vs strangers by grouping photos"},{term:"Zero-shot",def:"Do task without training on that exact task",example:"CLIP never trained on 'Indian wedding' but can find it from text"},{term:"Embedding Space",def:"Map where similar meanings cluster",example:"Dog photos and 'dog' words live near each other in space"},{term:"Cosine Similarity",def:"Measure of arrow direction match",example:"1 = same direction = perfect match, 0 = unrelated"}]},mentalModelDeep:{teacherAnalogy:"Imagine library with 400M books, each book has photo on left, caption on right. Librarian's job: organize so that books about dogs are near each other regardless of whether you search by photo or caption. CLIP librarian reads every book, learns to place dog photo book near dog caption book in same shelf section (embedding space). Later, new book arrives with only photo of unknown animal - you find shelf by comparing to all captions 'this looks most like caption: axolotl'. That's zero-shot. The trick: librarian doesn't memorize, learns pattern of what makes dog-ness.",studentAnalogy:"It's like matching game in family function: aunt shows baby photos, you match to name chits. You never met baby, but you match by clues: 'chubby cheeks + bald' = baby Aarav. CLIP plays this with 400M photos, gets super good.",sketchSteps:[{step:"Draw two towers: Image Tower, Text Tower",sec:12,draw:"Left tower: photos stacked, right tower: captions stacked"},{step:"Draw embedding space in middle as cloud",sec:12,draw:"Cloud with dots, label '512-D space' - where both go"},{step:"Show matching arrows",sec:12,draw:"Dog photo arrow to dot, 'dog' text arrow to same dot - they meet!"},{step:"Show non-matching repelled",sec:12,draw:"Cat photo dot far from 'car' text dot, with push arrows"},{step:"Zero-shot query",sec:12,draw:"New image: unicycle -> finds nearest caption 'one-wheeled bike' even if never trained"}],wrongVsRight:{wrong:"Think CLIP labels images like old classifier with fixed list (cat/dog/car)",right:"CLIP matches image to any open-ended text you give - infinite labels, not fixed list",fix:"Test: can CLIP find 'lonely bench at sunset' even if never saw that phrase? Yes = matching not labeling"},bridgeQuestion:"If you had to find a photo among 1000 using only one sentence, what sentence would be most useful? What makes a good caption for matching?"},examples:[{title:"Search Engine Magic",story:"Kabir types 'aesthetic study desk with plants' into Pinterest. No tags, but CLIP finds perfect desks. He didn't need exact keywords.",howItWorks:"Text encoder: 'aesthetic study desk' -> vector. Image encoder: every Pinterest image -> vector. Nearest neighbor search finds top matches by cosine similarity.",whereToSee:"Pinterest, Google Images, Shutterstock",discussionQ:"Why is this better than old keyword tags?",whatIf:"What if someone tags plant photo as 'study desk' to get views - does CLIP get fooled?",ethics:{benefits:"Find images without manual tagging",harmed:"Artists' styles can be copied via text search without consent",missing:"Whose aesthetic is 'aesthetic'? Western minimalism bias",trafficLight:"yellow",reason:"Copyright + aesthetic bias"}},{title:"Typographic Attack",story:"Researchers stick paper saying 'iPod' on an apple fruit. CLIP says it's iPod with 99% confidence, ignores fruit shape.",howItWorks:"CLIP overweights text in image (OCR bias) because web data has many images with text labels. Text modality dominates vision.",whereToSee:"AI security research",discussionQ:"If self-driving car sees stop sign with 'go' sticker, what happens?",whatIf:"Should AI trust what it reads on image or what shape it sees?",ethics:{benefits:"Reveals model weaknesses safely",harmed:"Could be used to bypass content filters",missing:"Who is responsible if attack causes accident?",trafficLight:"red",reason:"Security vulnerability in safety-critical"}},{title:"Zero-shot Safari",story:"Safari guide in Kenya has no labeled dataset of 'striped hyena'. She types 'striped hyena at night' into camera trap AI, finds 3 photos out of 10k without training.",howItWorks:"Zero-shot classification: encode text 'striped hyena', compare to all image embeddings, top similarity wins. No hyena training needed.",whereToSee:"Wildlife conservation camera traps (Wildlife Insights)",discussionQ:"When is zero-shot better than training custom model?",whatIf:"What if text query is ambiguous like 'big cat' - lion or tiger?",ethics:{benefits:"Conservation without expensive labeling",harmed:"Poachers could use same search to find rare animals",missing:"Local trackers knowledge not in English text queries",trafficLight:"yellow",reason:"Dual-use conservation vs poaching"}},{title:"Meme Caption Generator",story:"Ananya uploads dog photo, wants funny caption. AI suggests 'When you realize it's Monday tomorrow' because it matched dog's sad eyes to Monday mood captions.",howItWorks:"CLIP finds captions that previously paired with similar sad-dog embeddings, ranks by similarity.",whereToSee:"Instagram caption suggestions",discussionQ:"Is AI being creative or just copying?",whatIf:"What if AI suggests offensive caption matched from biased data?",ethics:{benefits:"Helps creators",harmed:"Copies creators' captions without credit",missing:"Original caption writers not compensated",trafficLight:"yellow",reason:"IP + creativity"}},{title:"Shopping by Photo",story:"Riya sees influencer's shoes on Instagram, screenshots, uploads to Myntra. Finds same shoes by matching image to product descriptions.",howItWorks:"Image embedding of screenshot -> search over product catalog text+image embeddings. Cross-modal retrieval.",whereToSee:"Myntra, Amazon StyleSnap",discussionQ:"What if shoes are fake copy - should AI show it?",whatIf:"What if you upload photo of person, AI finds their clothes - privacy?",ethics:{benefits:"Convenient shopping",harmed:"Enables fast fashion copycat, facial recognition creep",missing:"Consent of person in photo",trafficLight:"yellow",reason:"Privacy + counterfeit"}},{title:"Content Moderation",story:"Platform needs to find violent images. Can't list all violent images. Moderator types 'person holding weapon with blood', CLIP finds matches even new types.",howItWorks:"Text query embedding as detector. No need to train violent classifier, just describe violation.",whereToSee:"Meta, YouTube moderation",discussionQ:"Who decides what text queries count as violent?",whatIf:"What if query 'protest with police' flagged as violence - bias?",ethics:{benefits:"Scales safety",harmed:"Over-censorship of activism, bias in query wording",missing:"Appeal process for false matches",trafficLight:"red",reason:"Free speech impact"}}],physical:{title:"CLIP Cards Matching Game",goal:"Physical card game that simulates contrastive learning - players learn embeddings by sorting",materials:["30 image cards","30 caption cards","large floor mat with similarity scale"],steps:["Lay image cards left, caption cards right","Players place string between matching pairs","Measure distance: short string = high similarity","Introduce distractor: add 'iPod' label to apple image - watch match break","Score: correct matches, discuss why some hard"],code:"No code - unplugged. Extension: micro:bit shows similarity score when cards NFC-tapped (if available)",success:["Can explain contrastive push/pull","Identifies typographic attack","Creates own tricky caption"]},community:{prompt:"Create 5 image-caption pairs that would be HARD for CLIP (e.g., sarcasm, culture-specific). Upload.",contribution:"Image + caption + why hard",galleryTitle:"Hard for CLIP Gallery"},script90:{phases:[{name:"Hook: Caption Match Race",mins:"0-10",teacher:"Show 6 images, 6 captions mixed, teams race to match - discuss strategy",student:"Match quickly, note which easy/hard",check:"Can match 4/6 quickly?",tip:"Use funny images"},{name:"Direct: CLIP Deep Dive",mins:"10-25",teacher:"Explain 400M pairs, demo CLIP search live, show embedding visualization",student:"Sketch two towers + cloud, annotate push/pull",check:"Sketch shows embedding space?",tip:"Use CLIP demo site"},{name:"Explore: Zero-shot Lab",mins:"25-45",teacher:"Students invent new categories never seen, test CLIP zero-shot",student:"Create 3 novel queries, test, record accuracy",check:"Can define zero-shot in own words?",tip:"Queries like 'person doing bhangra'"},{name:"Build: Attack the Model",mins:"45-70",teacher:"Give stickers with words, let students try typographic attacks",student:"Stick 'cat' on dog photo, test if AI fooled, design defense",check:"Can create successful attack?",tip:"Have printed word labels"},{name:"Ethics: Moderation Dilemma",mins:"70-80",teacher:"Debate: should 'protest' be flagged? Who writes queries?",student:"Role play: moderator vs activist, traffic light",check:"Can name bias risk?",tip:"Use real moderation example"},{name:"Reflect: Hard Gallery",mins:"80-90",teacher:"Show hard pairs, assign community contribution",student:"Design 1 hard pair, exit ticket: cosine similarity",check:"Hard pair explanation valid?",tip:"Show exemplar hard pair"}]},unplugged:{scenario:"Human CLIP - Students become embedding space",roles:[{role:"Image Encoders (3 students)",does:"Look at image, then position self in room (embedding space) - near similar images"},{role:"Text Encoders (3)",does:"Read caption, position self near matching image encoders"},{role:"Similarity Judge",does:"Measures distance with tape, declares match if < 1m"}],steps:["Image encoders get secret images, move to corners representing features (color, size)","Text encoders get captions, must find matching encoder by proximity","Judge measures, if far, encoders adjust (contrastive learning)","Repeat with new images, watch space organize","Introduce attack: give text encoder sign 'cat' to hold while image is dog"],variations:["Add noise: blindfold one encoder","Scale to 10 encoders","Use music: different genres as modalities"]},workbook:{keyIdeas:["CLIP = contrastive image-text matching","400M pairs from web","Embedding space = shared map","Zero-shot = no training needed for new labels"],tasks:[{q:"Create 4 image-caption pairs and plot where they'd be in embedding space (draw)",type:"map"},{q:"Design a typographic attack that would fool CLIP and explain why",type:"attack design"},{q:"List 3 apps that use CLIP without you knowing",type:"research"}],assessment:{mcq:[{q:"CLIP uses what learning?",opts:["Supervised labeling","Contrastive matching","Reinforcement","Clustering only"],ans:1},{q:"Zero-shot means:",opts:["Needs zero data","No training on that label needed","Zero accuracy","Zero images"],ans:1}],rubric:"3 pts: Explains embedding + similarity, 2 pts: Gives zero-shot example, 2 pts: Describes attack, 1 pt: Real app identified"}}},{id:"W15",num:15,title:"Whisper / Speech to Text",subtitle:"Voice to text - Ear to Pen",mentalModel:"Ear to Pen",mentalEmoji:"\uD83D\uDC42✍️",color:"from-purple-600 to-indigo-600",teacherBackground:{history:"Speech recognition 1970s: Hidden Markov Models. 2010s: Deep learning (DeepSpeech). 2022 Sep: OpenAI Whisper released - trained on 680k hours of multilingual audio from web, weakly supervised. Breakthrough: robust to accents, background noise, handles 99 languages, translates. Unlike prior ASR needing clean studio audio, Whisper works on messy real audio. Architecture: encoder-decoder transformer, log-Mel spectrogram in, text out. 2023: Distil-Whisper faster. Open-source, runs locally. Basis for voice assistants, captions.",whyGrade9:"9th graders use voice notes daily (WhatsApp), see captions on YouTube, but think it's magic. Need to understand spectrogram: voice is wavy, AI converts wave to picture (spectrogram) then to text. Also critical: their accents (Indian English) often misrecognized - why? Training data bias. Whisper improves but still biases. They can test with own voice. Also future job skill: podcast transcription, accessibility.",realWorld:["YouTube auto-captions = Whisper-like","WhatsApp voice note transcription","Doctor dictation to text","Courtroom transcription","Alexa wake word detection (tiny ASR)"],kidQA:[{q:"How does AI turn my voice wave into text?",a:"Step 1: Mic captures pressure wave (like wiggly line). Step 2: Convert to spectrogram - picture where x=time, y=frequency, color=loudness. So 'hello' picture has blobs. Step 3: Transformer reads picture like reading, outputs letters. So Ear (mic) -> Eye (spectrogram image) -> Pen (text).",followUp:"Why convert sound to image first?"},{q:"Why does AI understand American accent better?",a:"Training data: 680k hours, but ~60% English, mostly US. Indian English 'schedule' vs 'shedule' less represented. Whisper better than old models but still bias. Solution: more diverse data.",followUp:"How could we collect more Indian English data ethically?"},{q:"Can Whisper understand Hindi + English mix (Hinglish)?",a:"Yes! Whisper handles code-switching better than before because trained on multilingual data. It can transcribe 'Mujhe ek coffee chahiye' even mid-English sentence. Still errors on slang.",followUp:"Test Whisper with your Hinglish - where does it fail?"}],vocab:[{term:"Spectrogram",def:"Picture of sound: time x frequency",example:"Like sheet music - shows which notes loud when"},{term:"ASR (Automatic Speech Recognition)",def:"AI task: audio -> text",example:"Whisper is ASR model"},{term:"Accent Bias",def:"Model works worse for underrepresented accents",example:"American 'water' vs Indian 'vater' recognized differently"},{term:"Code-switching",def:"Mixing languages in one sentence",example:"Hinglish: 'Yaar, this is too much'"}]},mentalModelDeep:{teacherAnalogy:"Imagine you are a courtroom stenographer but you are deaf to meaning initially - you only hear sounds. You have learned to map sound patterns to letters by seeing 680k hours of people speaking while reading their transcripts. You develop intuition: 'sh' sound = s+h pattern in spectrogram (high frequency hiss). You become so good you can transcribe even mumbled speech. That's Whisper. Ear to Pen: ear hears vibration, brain converts to visual pattern (spectrogram), pen writes. The pen doesn't understand meaning, just maps sound->text. Later language model adds understanding.",studentAnalogy:"Like you learning to write Hindi by listening: teacher says 'Namaste', you hear, you picture Devanagari letters, you write. If teacher mumbles or has accent, you might write wrong. Whisper is student who practiced 680k hours.",sketchSteps:[{step:"Draw wavy line: raw audio wave",sec:12,draw:"Squiggly line labeled 'mic pressure'"},{step:"Convert to spectrogram picture",sec:12,draw:"Grid: x=time, y=pitch, blobs = loud, label 'ear -> eye'"},{step:"Transformer reads picture",sec:12,draw:"Eye icon looking at spectrogram, outputting letters H-E-L-L-O"},{step:"Add noise/accent failure",sec:12,draw:"Noisy wave + question mark, wrong text output"},{step:"Human correction loop",sec:12,draw:"Pen erases, rewrites with context, arrow back to ear"}],wrongVsRight:{wrong:"Think ASR understands meaning - it just converts sound to text, like copying without understanding",right:"ASR converts sound to text (Ear to Pen), then separate model understands text. Two steps.",fix:"Ask: If you transcribe French you don't know, can you still write it? Yes - that's ASR without understanding"},bridgeQuestion:"If you had to transcribe your grandmother who speaks fast with accent, what would be hardest? How would you handle code-switching?"},examples:[{title:"YouTube Captions",story:"Arjun watches physics lecture with auto-captions. Professor says 'photons', captions say 'photoons' - wrong but close. Arjun edits.",howItWorks:"Whisper listens to audio track, generates spectrogram chunks, decoder predicts words sequentially, language model fixes grammar.",whereToSee:"YouTube auto-caption",discussionQ:"Should wrong captions be allowed? Who is harmed?",whatIf:"What if lecture is in Tamil + English mix?",ethics:{benefits:"Accessibility for deaf learners",harmed:"Wrong captions misinform; accent bias excludes",missing:"Who checks caption accuracy?",trafficLight:"yellow",reason:"Accessibility vs misinformation"}},{title:"Doctor's Scribe",story:"Dr. Patel dictates 'patient has hypertension' while examining. Whisper types into record, saves 2 hours daily.",howItWorks:"Medical fine-tuned Whisper with medical vocab, runs locally for privacy, streaming transcription.",whereToSee:"Suki AI, Nabla",discussionQ:"Should AI listen to private doctor-patient talk?",whatIf:"What if AI mishears 'hyper' vs 'hypo' -tension - life risk?",ethics:{benefits:"Doctors spend more time with patients",harmed:"Privacy - voice is health data, misdiagnosis risk",missing:"Patient consent to recording?",trafficLight:"red",reason:"Health privacy + high stakes error"}},{title:"WhatsApp Voice to Text",story:"Simran gets long voice note in bus, can't play loud. Taps 'transcribe' - gets text: 'Mum says come home early'.",howItWorks:"On-device tiny Whisper (20MB) converts voice note to text without sending to server, works offline.",whereToSee:"WhatsApp beta transcription",discussionQ:"Is it okay to transcribe friend's voice without asking?",whatIf:"What if voice note is emotional crying - text loses emotion?",ethics:{benefits:"Convenience, accessibility",harmed:"Voice biometrics - could clone voice",missing:"Emotional nuance lost in text",trafficLight:"yellow",reason:"Privacy + emotional loss"}},{title:"Courtroom Record",story:"Court stenographer sick. Whisper transcribes hearing. Lawyer says 'objection, hearsay' - Whisper writes 'objection, here say'. Judge notices.",howItWorks:"Legal vocab model, but still struggles with jargon, needs human verification. Speaker diarization: who said what.",whereToSee:"US courts using AI transcription",discussionQ:"Should legal record rely on AI?",whatIf:"What if AI misattributes who said what - changes case?",ethics:{benefits:"Faster court records, cheaper",harmed:"Wrong transcript = injustice",missing:"Human oversight mandatory?",trafficLight:"red",reason:"Justice system - high stakes"}},{title:"Podcast Search",story:"Neha wants to find where in 3-hour podcast they discussed 'climate anxiety'. Searches text, jumps to timestamp - Whisper made podcast searchable.",howItWorks:"Transcribe full audio, index text, allow keyword search with timestamps aligned to audio.",whereToSee:"Spotify podcast search",discussionQ:"If podcast is private conversation, should it be searchable?",whatIf:"What if someone searches your voice without consent?",ethics:{benefits:"Makes audio knowledge accessible",harmed:"Private conversations become searchable",missing:"Consent for transcription?",trafficLight:"yellow",reason:"Searchability vs privacy"}},{title:"Accent Challenge",story:"Class tests Whisper: American says 'water', Indian says 'water' (vater), Tamil accent 'water'. Accuracy: 98%, 92%, 85% - bias visible.",howItWorks:"Model confidence lower for underrepresented accents due to training data imbalance. Shows bias.",whereToSee:"AI bias testing",discussionQ:"How to fix accent bias? More data? Different model?",whatIf:"What if job interview uses ASR and penalizes accent?",ethics:{benefits:"Reveals bias to fix",harmed:"Accent discrimination in hiring",missing:"Whose accent counts as 'standard'?",trafficLight:"red",reason:"Discrimination risk"}}],physical:{title:"Ear to Pen with micro:bit",goal:"micro:bit listens to clap patterns and writes Morse-like text - physical Whisper",materials:["micro:bit","USB"],steps:["Program: loud sound = dot, long loud = dash, silence = space","Clap 'SOS': 3 short claps, 3 long, 3 short -> micro:bit shows SOS","Test with voice: say 'hi' loudly - does it map?","Discuss: how is this like spectrogram? Loudness = amplitude","Improve: add button to confirm/correct transcription"],code:"let morse=''; input.onSound(Loud, ()=>{ morse+='.'; basic.showString(morse) }); // simplified",success:["Clap pattern -> text","Can explain spectrogram analogy","Identifies noise failure"]},community:{prompt:"Record 10-sec audio in your accent/language mix, transcribe with Whisper, note errors.",contribution:"Audio (text description) + transcript + errors found",galleryTitle:"Accent Atlas"},script90:{phases:[{name:"Hook: Deaf Stenographer",mins:"0-10",teacher:"Play audio in unknown language (e.g., Korean), ask students to transcribe sounds they hear (not meaning)",student:"Try write what heard, feel difficulty of ASR without understanding",check:"Can they write sounds even without meaning?",tip:"Use clear audio"},{name:"Direct: Whisper Architecture",mins:"10-25",teacher:"Show spectrogram animation, 680k hours stat, demo Whisper with student voice live",student:"Sketch wave->spectrogram->text, note accent bias",check:"Sketch has 3 stages?",tip:"Test with diverse accents live"},{name:"Explore: Accent Lab",mins:"25-45",teacher:"Students record same sentence in different accents, test transcription accuracy",student:"Record, transcribe, calculate accuracy, graph bias",check:"Can quantify bias?",tip:"Use whisper web demo"},{name:"Build: Clap Morse",mins:"45-70",teacher:"Guide micro:bit sound->text code",student:"Code clap to text, test, iterate",check:"Clap -> text works?",tip:"Adjust loud threshold"},{name:"Ethics: Private Voice?",mins:"70-80",teacher:"Debate: should doctors record patients? Court?",student:"Traffic light for each example, discuss consent",check:"Can name privacy risk?",tip:"Use medical example"},{name:"Reflect: Atlas Contribution",mins:"80-90",teacher:"Show Accent Atlas gallery, assign recording",student:"Plan recording, exit ticket: define spectrogram",check:"Exit ticket correct?",tip:"Model consent statement"}]},unplugged:{scenario:"Telephone Game Whisper",roles:[{role:"Speaker (with accent)",does:"Reads sentence with heavy accent/mumbling"},{role:"Spectrogram Artist",does:"Listens, draws wave pattern (loud=big, high pitch=top)"},{role:"Transcriber",does:"Looks only at drawing, writes text, cannot hear speaker"}],steps:["Speaker reads sentence facing away","Artist draws spectrogram without writing words","Transcriber guesses text from drawing only","Compare original vs transcribed - where errors?","Rotate, add noise (other students chatter)"],variations:["Add code-switching: mix Hindi-English","Whisper chain: 3 transcribers in row","Medical jargon vs everyday words"]},workbook:{keyIdeas:["Voice -> wave -> spectrogram picture -> text","Whisper = 680k hours training","Accent bias from data imbalance","Code-switching challenge"],tasks:[{q:"Draw spectrogram for 'hello' vs 'helloooo' (long o). How different?",type:"draw"},{q:"Record yourself saying 5 sentences, transcribe, list errors by type",type:"experiment"},{q:"Design fix for accent bias - how collect diverse data ethically?",type:"design"}],assessment:{mcq:[{q:"Whisper converts audio to what first?",opts:["Directly to text","To spectrogram image then text","To video","To binary"],ans:1},{q:"Main bias in Whisper?",opts:["Gender","Accent/language","Age","All same"],ans:1}],rubric:"3 pts: Explains 3-step pipeline, 2 pts: Gives accent bias example + data, 2 pts: Designs ethical data collection, 1 pt: Spectrogram drawing labeled"}}},{id:"W16",num:16,title:"Text to Speech - Voice AI",subtitle:"Pen to Mouth - Text becomes voice",mentalModel:"Pen to Mouth",mentalEmoji:"✍️\uD83D\uDDE3️",color:"from-indigo-600 to-blue-600",teacherBackground:{history:"2018: Google Tacotron 2 - first natural TTS using seq2seq + WaveNet vocoder. 2019: Microsoft FastSpeech. 2023: ElevenLabs, OpenAI TTS, VALL-E - zero-shot voice cloning from 3 sec audio. How it works: Text -> phonemes -> mel-spectrogram -> waveform via vocoder. Early TTS robotic (Stephen Hawking). Modern TTS indistinguishable from human, captures emotion, accent. VALL-E can clone voice with 3 sec sample, raises deepfake concerns. 2024: Voice agents like Hume AI detect emotion in voice.",whyGrade9:"They use TTS daily: Google Assistant, Instagram voiceover, but think it's pre-recorded human. Need to know it's generated. Critical for deepfake literacy: if anyone can clone your voice with 3 sec TikTok clip, what are risks? Also accessibility: TTS helps dyslexic learners. They can build own voice assistant. Ethics heavy: consent for voice cloning.",realWorld:["Google Maps voice directions = TTS","Accessibility screen readers","ElevenLabs audiobooks with celebrity voices","Scam calls cloning child's voice 'Mum help!' - FBI warning 2023"],kidQA:[{q:"How can AI clone my voice with 3 seconds?",a:"VALL-E learns speaker's timbre (voice texture) from 3 sec, separates timbre from content. Then generates new content with same timbre. Like learning your handwriting style from one letter, then writing new sentences in your handwriting. Needs only texture, not all words.",followUp:"Is 3 seconds enough to be safe? Should we limit?"},{q:"Can TTS show emotion?",a:"New models yes: Hume AI, ElevenLabs control emotion via text tags [whispers], [shouts], or by analyzing text sentiment. Old TTS flat, new TTS adds prosody - pitch variation, pauses, breaths. Still struggles with sarcasm.",followUp:"How would you make TTS sound sarcastic?"},{q:"Is TTS voice real person?",a:"No - generated waveform, not concatenated recordings. Vocoder generates each sound wave sample (24k per second). So it's synthetic, not human, but trained on human data. Legally gray: whose voice is it?",followUp:"If AI trained on your voice without consent, is that theft?"}],vocab:[{term:"TTS (Text-to-Speech)",def:"AI task: text -> spoken audio",example:"Maps saying 'Turn left'"},{term:"Vocoder",def:"Turns spectrogram picture into sound wave",example:"Like reverse of Whisper - picture to wave"},{term:"Voice Cloning",def:"Copy someone's voice timbre",example:"3 sec sample -> speak anything in that voice"},{term:"Prosody",def:"Rhythm, stress, intonation of speech",example:"Question goes up at end - that's prosody"}]},mentalModelDeep:{teacherAnalogy:"Think of a master mimic in Bollywood: he listens to Amitabh Bachchan 3 sec, captures his heavy baritone timbre, then can say any new dialogue in Bachchan voice. How? He separates WHAT is said from HOW it sounds. TTS does same: encoder learns content (phonemes), speaker encoder learns timbre (voice fingerprint). Decoder combines: content + timbre + emotion -> mel-spectrogram -> vocoder -> wave. Pen to Mouth: pen writes words, mouth decides how to speak them - fast, slow, happy, with whose voice.",studentAnalogy:"You text friend 'I am so happy' - friend reads in happy voice in head. If text 'I am so happy...' with dots, friend reads sad. TTS does that: reads punctuation as emotion. Pen tells mouth how to feel.",sketchSteps:[{step:"Draw pen writing 'Hello!' + emotion tag",sec:12,draw:"Pen writing, tag [excited]"},{step:"Text -> phonemes",sec:12,draw:"'Hello' -> H-eh-l-ou phoneme blocks"},{step:"Add voice fingerprint",sec:12,draw:"Fingerprint icon labeled 'your timbre' merges with phonemes"},{step:"Mel-spectrogram with prosody",sec:12,draw:"Spectrogram with wavy pitch line going up for excited"},{step:"Vocoder -> wave -> speaker",sec:12,draw:"Picture -> wavy line -> speaker icon playing"}],wrongVsRight:{wrong:"Think TTS is just playing pre-recorded words stitched together",right:"TTS generates entirely new waveform sample-by-sample, not stitching",fix:"Ask: Can TTS say word it never heard before like 'supercalifragilisticexpialidocious'? Yes = generation not stitching"},bridgeQuestion:"If you could make any historical figure speak your essay (e.g., Gandhi), should you? What consent needed? What if figure is dead 100 years?"},examples:[{title:"Grandmother's Stories",story:"Dadi's voice recorded reading 3 bedtime stories. Now TTS can read any new story in Dadi's voice for grandson when Dadi sick.",howItWorks:"Fine-tune TTS on Dadi's 10 min audio, clone timbre, generate new stories with same warmth, preserves prosody.",whereToSee:"Storyteller apps, Apple Personal Voice",discussionQ:"Is it comforting or creepy? Does family consent?",whatIf:"What if Dadi didn't consent to cloning?",ethics:{benefits:"Preserves loved ones' voices, accessibility",harmed:"If cloned without consent, identity theft",missing:"Consent for deceased? Family vs individual?",trafficLight:"yellow",reason:"Consent + grief tech"}},{title:"Scam Call - Kidnapped Voice",story:"2023: Parents get call: child's voice 'Mum, I'm kidnapped, send money!' Actually AI cloned from TikTok 3 sec. FBI warning.",howItWorks:"Scraper gets TikTok audio, VALL-E clones, generates urgent script with crying prosody, spoofs caller ID.",whereToSee:"FBI alert 2023, FTC reports",discussionQ:"How to verify it's really your child?",whatIf:"What if scammer clones teacher's voice to cancel school?",ethics:{benefits:"None for scam - shows risk",harmed:"Financial loss, trauma, trust broken",missing:"Regulation - should 3-sec cloning be illegal?",trafficLight:"red",reason:"Impersonation + fraud"}},{title:"Audiobook Revolution",story:"Publisher uses ElevenLabs to make audiobook in author's voice without author spending 20 hours recording. Author approves, gets royalties.",howItWorks:"Author records 30 min, TTS learns voice, generates 10-hour audiobook with emotion tags from text.",whereToSee:"Spotify AI audiobooks, Apple Books",discussionQ:"Should author be paid same as human-narrated?",whatIf:"What if publisher clones author after death without estate permission?",ethics:{benefits:"More audiobooks, accessibility",harmed:"Voice actors lose jobs, posthumous cloning",missing:"Who owns voice after death?",trafficLight:"yellow",reason:"Labor + IP"}},{title:"Screen Reader for Blind",story:"Blind student uses TTS to read physics textbook. Can change speed 3x, choose calm voice for study.",howItWorks:"TTS with SSML tags for formulas: 'E=mc squared' spoken correctly, adjustable prosody.",whereToSee:"NVDA, JAWS",discussionQ:"Should TTS be free for accessibility?",whatIf:"What if TTS misreads formula - learning harmed?",ethics:{benefits:"Education access",harmed:"If paywalled, inequality",missing:"Quality for low-resource languages",trafficLight:"green",reason:"Clear benefit, low risk"}},{title:"Language Learning",story:"Priya learning French, TTS speaks French with slow prosody, then normal speed, helps pronunciation.",howItWorks:"Multilingual TTS with accent control: can speak French with Indian accent to help transition.",whereToSee:"Duolingo, Google Translate",discussionQ:"Should TTS mimic native or learner accent?",whatIf:"What if TTS teaches wrong pronunciation - fossilized error?",ethics:{benefits:"Language access",harmed:"Wrong pronunciation if model biased",missing:"Native speaker teachers displaced?",trafficLight:"green",reason:"Learning aid"}},{title:"Protest Voice",story:"Activist in danger cannot speak publicly. Uses TTS with anonymous voice to share message safely.",howItWorks:"TTS anonymizes voice, removes biometric fingerprint, protects identity while delivering speech.",whereToSee:"Human rights tech",discussionQ:"When is anonymous voice good vs harmful?",whatIf:"What if anonymous voice used to spread hate without accountability?",ethics:{benefits:"Protects activists",harmed:"Enables anonymous harassment",missing:"Accountability balance",trafficLight:"yellow",reason:"Dual-use anonymity"}}],physical:{title:"Pen to Mouth Speaker",goal:"micro:bit receives text via Bluetooth and speaks via TTS (using speech synthesis on laptop) + shows emotion via LEDs",materials:["micro:bit","laptop with Web Speech API","Bluetooth"],steps:["Laptop: type text + emotion [happy/sad/angry]","Send to micro:bit via radio","micro:bit displays emoji for emotion, laptop TTS speaks with prosody","Test: 'I won!' happy vs 'I won...' sad - same text different prosody","Add voice fingerprint: choose voice (male/female/robot)"],code:"radio.onReceivedString((txt)=>{ if(txt.includes('happy')){ display.show(Happy) } }); // laptop side: speechSynthesis.speak()",success:["Text -> emotion -> voice","Can explain prosody","Discusses cloning risk"]},community:{prompt:"Write 3 sentences that should sound different in TTS (e.g., question vs excitement) and record how you'd want them spoken.",contribution:"Text + prosody description + why",galleryTitle:"Prosody Lab"},script90:{phases:[{name:"Hook: Guess Human or AI?",mins:"0-10",teacher:"Play 4 audio clips: 2 human, 2 ElevenLabs clone. Students vote human/AI",student:"Vote, discuss cues - breath, emotion",check:"Can they tell? Usually no - hook for deepfake",tip:"Use same sentence different voices"},{name:"Direct: Tacotron to VALL-E",mins:"10-25",teacher:"Timeline: 2018 robotic to 2023 clone, demo cloning with 3 sec student volunteer (with consent)",student:"Sketch pen->phoneme->timbre->wave, note 3-sec risk",check:"Sketch includes timbre separation?",tip:"Get consent before cloning demo"},{name:"Explore: Prosody Lab",mins:"25-45",teacher:"Give same text 'Really?' - students speak as question, sarcasm, excitement. TTS tries",student:"Speak with different prosody, test TTS tags [whispers]",check:"Can change prosody with punctuation?",tip:"Use ElevenLabs free tier"},{name:"Build: Pen to Mouth",mins:"45-70",teacher:"Guide micro:bit + laptop TTS with emotion",student:"Code emotion display + voice, test",check:"Emotion changes voice?",tip:"Pre-install voices"},{name:"Ethics: Scam Call Roleplay",mins:"70-80",teacher:"Roleplay scam call, discuss verification, FBI warning",student:"Design verification question only real child knows, traffic light",check:"Can name harm + mitigation?",tip:"Sensitive - no real fear"},{name:"Reflect: Voice Consent",mins:"80-90",teacher:"Discuss: should cloning need consent? Draft class consent form",student:"Write consent pledge, exit ticket: define vocoder",check:"Consent form includes key elements?",tip:"Show Apple Personal Voice consent flow"}]},unplugged:{scenario:"Human TTS - Pen to Mouth Relay",roles:[{role:"Pen (Writer)",does:"Writes sentence + emotion tag secretly"},{role:"Phoneme Breaker",does:"Breaks sentence into sounds (not letters) e.g., 'cat' -> k-ae-t"},{role:"Voice Actor",does:"Gets phonemes + emotion, must speak in assigned voice (e.g., grandma voice) without seeing original text"}],steps:["Pen writes 'I am so tired...' [sad, grandma voice]","Breaker converts to phonemes, passes emotion tag","Actor speaks in grandma sad voice, class guesses original text + emotion","Discuss: what lost? Prosody preserved?","Add timbre: actor must mimic specific classmate (with consent)"],variations:["Add language: write in Hindi, speak in English accent","Whisper chain: 2 voice actors sequential","Deepfake: Actor says something Pen never wrote - trust break"]},workbook:{keyIdeas:["Text -> phonemes -> spectrogram + timbre -> wave","3-sec cloning possible (VALL-E 2023)","Prosody = emotion in voice","Deepfake risk"],tasks:[{q:"Write same sentence 3 ways: happy, sarcastic, scared. How would TTS know?",type:"prosody writing"},{q:"Design verification method to detect cloned voice scam call",type:"security design"},{q:"Should voice cloning require consent? Write 5-point policy",type:"policy"}],assessment:{mcq:[{q:"Vocoder does:",opts:["Text to phonemes","Spectrogram to waveform","Wave to text","Text to image"],ans:1},{q:"VALL-E can clone voice with:",opts:["3 hours","3 seconds","3 days","3 words"],ans:1}],rubric:"3 pts: Explains TTS pipeline + timbre, 2 pts: Gives deepfake example + harm, 2 pts: Prosody examples, 1 pt: Consent policy elements"}}},{id:"W17",num:17,title:"Multi-modal Reasoning",subtitle:"Detective with Photos and Notes",mentalModel:"Detective with Photos and Notes",mentalEmoji:"\uD83D\uDD75️\uD83D\uDCF8\uD83D\uDCDD",color:"from-blue-600 to-violet-600",teacherBackground:{history:"2023 March: OpenAI GPT-4V (vision) released - first model that could reason across image+text. Example: given meme, explains why funny (needs vision+text+culture). 2023 Dec: Gemini Ultra multi-modal. Architecture: vision encoder (CLIP-like) + language model + fusion transformer that attends across modalities. Key advance: not just matching, but reasoning: 'If image shows X and text says Y, then Z because...'. Chain-of-thought across modalities. Benchmark: MMMU (Massive Multi-discipline Multi-modal Understanding) - college-level questions needing image+text.",whyGrade9:"9th grade is when reasoning develops: they start asking 'why' not just 'what'. Multi-modal reasoning is exactly that - detective work. They already do it: see friend's Instagram photo (party) + caption 'worst day' = infer sarcasm, something bad happened. That's reasoning. Need to formalize: what clues from each modality, how combine, how avoid jumping to conclusions. Also critical for misinformation: photo + misleading caption = need reasoning to detect.",realWorld:["GPT-4V: upload graph + question 'why sales dropped?' - reasons using both","Medical: X-ray + lab report + doctor notes -> diagnosis reasoning","Crime investigation: CCTV + witness text + audio","Education: student draws diagram + writes explanation, AI gives feedback on mismatch"],kidQA:[{q:"How is reasoning different from matching?",a:"Matching: find image that matches caption. Reasoning: given image of kitchen on fire + text 'Mom left stove on' + question 'What should child do?' -> reason: fire dangerous, child should leave, call adult, not pour water on oil fire. Needs causal chain, not just similarity.",followUp:"Give example where matching gives wrong answer but reasoning needed?"},{q:"Can AI reason like detective?",a:"Partly. GPT-4V can do 5-step reasoning: 1. List what see in image, 2. List what text says, 3. Find connections/conflicts, 4. Use world knowledge, 5. Conclude. But fails on counting, spatial relations. Like junior detective - good but misses details.",followUp:"What would make AI better detective?"},{q:"What if photo and notes contradict?",a:"Key skill! Example: photo shows sunny day, note says 'it rained'. Detective must decide: maybe photo old? Maybe note lies? Good reasoning weighs evidence: photo timestamp? Note author trustworthy? Multi-modal reasoning must handle conflict, not just fusion.",followUp:"How would you decide which to trust?"}],vocab:[{term:"Reasoning",def:"Chain of thought using evidence to conclude",example:"Detective uses clues + logic to find culprit"},{term:"Chain-of-Thought",def:"Step-by-step thinking aloud",example:"Let's think: first, image shows... second, text says... so..."},{term:"Modality Conflict",def:"When different senses say different things",example:"Image shows cat, text says dog - conflict"},{term:"Grounding",def:"Linking words to specific image region",example:"'The red car' grounded to pixels of red car"}]},mentalModelDeep:{teacherAnalogy:"Sherlock Holmes crime scene: photo of broken window, note 'I heard loud bang at 10pm', audio of dog barking. Junior detective says 'burglar!'. Holmes reasons: window broken from inside (glass outside), bang at 10pm was dog knocking vase, note writer wanted to fake burglary. Holmes does multi-modal chain: observes each modality, checks consistency, uses world knowledge (dogs knock vases), infers motive. GPT-4V tries to be Holmes but sometimes junior. The method: list clues per modality, find contradictions, hypothesize, test.",studentAnalogy:"You see friend's Instagram: photo smiling at party, caption 'Best night ever!!!', but you know her dog died yesterday. You reason: photo old or fake smile? You check timestamp, comments, previous stories. You are multi-modal detective - using photo + caption + your memory to detect lie/sarcasm.",sketchSteps:[{step:"Draw crime scene: photo + note + audio wave",sec:12,draw:"Three evidence bags labeled V, T, A"},{step:"List clues per modality",sec:12,draw:"V: window broken, glass outside. T: 'bang 10pm'. A: dog bark"},{step:"Find conflict/link",sec:12,draw:"Arrows: glass outside contradicts burglar from outside - link!"},{step:"World knowledge injection",sec:12,draw:"Brain: dogs knock things, glass outside = broken from inside"},{step:"Conclusion with confidence",sec:12,draw:"Conclusion: fake burglary, confidence 80%, needs more evidence"}],wrongVsRight:{wrong:"Look at image only and ignore text, or read text only and ignore image - single modality detective",right:"List all clues from each modality, check agreement/conflict, reason with world knowledge",fix:"Force: before concluding, write 2 clues from image, 2 from text, 1 conflict if any"},bridgeQuestion:"Your friend sends photo of A+ grade + text 'I failed'. Is this sarcasm, lie, or mistake? How do you reason using both? What extra info needed?"},examples:[{title:"Meme Detective",story:"Meme: image of man looking at butterfly labeled 'Is this a pigeon?' Text 'When I try to explain AI'. Why funny? Need image + text + knowledge that meme is about mislabeling.",howItWorks:"GPT-4V: 1. See image: man confused looking at butterfly, label says pigeon. 2. Read text: about explaining AI. 3. Connect: person mislabels AI concepts like man mislabels butterfly. 4. Funny because relatable mislabeling.",whereToSee:"GPT-4V meme explanation",discussionQ:"Can AI understand humor or just explain pattern?",whatIf:"What if meme requires culture-specific knowledge AI lacks?",ethics:{benefits:"Helps understand internet culture",harmed:"If AI explains offensive meme as funny, normalizes harm",missing:"Whose humor is training data?",trafficLight:"yellow",reason:"Cultural bias in humor"}},{title:"Math Diagram Reasoning",story:"Student uploads geometry diagram: triangle with 2 equal sides marked + text 'Find angle x'. AI reasons: isosceles triangle, base angles equal, uses marked clues.",howItWorks:"Grounding: links text 'equal sides' to tick marks in image, chain-of-thought: mark -> isosceles -> theorem -> solve.",whereToSee:"MathGPT, Khanmigo vision",discussionQ:"Should AI give answer or guide reasoning?",whatIf:"What if diagram has mistake - AI follows wrong diagram or text?",ethics:{benefits:"Personalized math help",harmed:"If diagram wrong, AI learns wrong",missing:"Teacher's role in checking diagram",trafficLight:"green",reason:"Learning aid low risk"}},{title:"Fake News Detector",story:"Post: image of shark swimming on highway + text 'Shark spotted in Mumbai floods!'. AI reasons: image is fake (shark on highway impossible, check shadows, past flood photos), text sensational - likely fake.",howItWorks:"Checks image authenticity (noise pattern), cross-references text claim with knowledge (sharks don't swim on highways), flags inconsistency.",whereToSee:"Fact-checking tools",discussionQ:"Can AI ever be 100% sure image is fake?",whatIf:"What if image is real but rare - AI says fake, suppresses truth?",ethics:{benefits:"Fights misinformation",harmed:"False flag as fake = censorship",missing:"Who decides truth?",trafficLight:"yellow",reason:"Truth arbitration high stakes"}},{title:"Medical Reasoning",story:"X-ray shows lung spot + lab report: high white cells + note: 'patient smoker'. AI reasons: spot + high WBC + smoker -> likely infection not cancer, but recommends biopsy to confirm.",howItWorks:"Fusion transformer attends to X-ray region, lab numbers, text history, generates differential diagnosis with reasoning chain.",whereToSee:"Med-PaLM M",discussionQ:"Should AI give diagnosis or only assist doctor?",whatIf:"What if AI misses rare disease not in training?",ethics:{benefits:"Second opinion, catches misses",harmed:"Over-reliance, misses rare",missing:"Patient consent for AI use",trafficLight:"red",reason:"Medical high stakes + rare disease"}},{title:"Sarcasm Detective",story:"Tweet: photo of long queue at government office + text 'Wow, super efficient service! Love it!'. AI detects sarcasm via conflict: image negative, text positive, cue.",howItWorks:"Sentiment conflict detection: vision sentiment (queue = negative) vs text sentiment (positive words) = sarcasm indicator.",whereToSee:"Sentiment analysis tools",discussionQ:"Can AI ever truly understand sarcasm?",whatIf:"What if sarcasm is culture-specific?",ethics:{benefits:"Better social media understanding",harmed:"Mislabels genuine praise as sarcasm",missing:"Cultural sarcasm styles",trafficLight:"yellow",reason:"Misinterpretation"}},{title:"Science Experiment",story:"Photo of experiment: beaker with blue liquid + text 'I added copper sulfate to water'. Question: 'Why blue?' AI reasons: copper sulfate blue, dissolution, links image color to text chemical.",howItWorks:"Grounds 'blue' in text to blue region in image, uses chemistry knowledge to explain cause-effect.",whereToSee:"Lab assistant AI",discussionQ:"Can AI do science reasoning or only recall facts?",whatIf:"What if experiment photo shows unexpected result (no blue) - can AI hypothesize why?",ethics:{benefits:"Science education",harmed:"If AI hallucinates explanation",missing:"Hands-on lab safety",trafficLight:"green",reason:"Educational"}}],physical:{title:"Detective Board",goal:"Physical detective game: solve case using photo + note + audio clue - must reason across",materials:["Printed photos","Note cards","micro:bit with recorded barks","Detective notebook"],steps:["Setup: 3 evidence bags - photo (broken vase), note (says 'cat did it'), audio (dog bark)","Students list clues per modality in notebook","Find conflict: cat vs dog bark","Reason: dog bark suggests dog, but note says cat - which trustworthy? Check photo: paw prints size","Conclude + present chain-of-thought","Micro:bit plays different barks for different animals"],code:"input.onButtonPressed(Button.A, ()=>{ music.playTone(262, 500) }) // bark simulator",success:["Lists clues per modality","Identifies conflict","Uses world knowledge","Presents chain-of-thought"]},community:{prompt:"Create a 'detective puzzle' where image and text conflict or need both to solve. Share.",contribution:"Image + text + solution reasoning chain",galleryTitle:"Detective Puzzles"},script90:{phases:[{name:"Hook: Sarcasm Test",mins:"0-10",teacher:"Show image of messy room + text 'My room is so clean!' - ask: sarcasm? How you know?",student:"Detect sarcasm via conflict, discuss cues",check:"Can explain conflict?",tip:"Use relatable student examples"},{name:"Direct: GPT-4V Reasoning",mins:"10-25",teacher:"Demo GPT-4V on meme + math diagram, show chain-of-thought",student:"Sketch detective model: list clues, find conflict, reason",check:"Sketch includes 3 evidence + conflict?",tip:"Live demo with student meme"},{name:"Explore: Conflict Lab",mins:"25-45",teacher:"Give 5 image+text pairs with conflicts, students reason which to trust",student:"Write chain-of-thought for each, vote trust",check:"Can identify conflict type?",tip:"Include ambiguous ones"},{name:"Build: Detective Board",mins:"45-70",teacher:"Setup physical detective game",student:"Solve case using all modalities, present reasoning",check:"Presents 3-step chain?",tip:"Pre-make evidence bags"},{name:"Ethics: Fake News",mins:"70-80",teacher:"Show shark on highway fake, discuss detection vs censorship",student:"Design fact-check checklist: image check, text check, source",check:"Can name harm of false flag?",tip:"Use recent fake example"},{name:"Reflect: Puzzle Creation",mins:"80-90",teacher:"Assign detective puzzle creation for community",student:"Draft puzzle, exit ticket: define grounding",check:"Puzzle has solvable conflict?",tip:"Show exemplar puzzle"}]},unplugged:{scenario:"Crime Scene Fusion",roles:[{role:"Photographer (Vision)",does:"Sees crime scene photo, can only draw, no words"},{role:"Witness (Text)",does:"Heard something, writes note, cannot see photo"},{role:"Detective (Reasoner)",does:"Gets drawing + note, must reason, cannot see original photo or hear original audio"},{role:"Audio (Sound)",does:"Heard bark/meow, can only make sound effect"}],steps:["Photographer sees photo (e.g., fish bowl broken)","Witness writes 'I heard meow'","Audio makes meow sound","Detective gets drawing + note + meow, reasons: cat knocked bowl","Detective presents chain: drawing shows fish bowl, note says meow, sound confirms cat","Rotate, add conflict: note says dog but sound is meow"],variations:["Add red herring evidence","Time pressure: 2 min to reason","Multiple detectives must agree"]},workbook:{keyIdeas:["Reasoning = chain across modalities","List clues per modality","Find conflicts/links","Use world knowledge","Ground words to image regions"],tasks:[{q:"Take a meme you like, write chain-of-thought how you'd explain why funny using image+text",type:"reasoning chain"},{q:"Create image+text conflict puzzle and solve it with 4-step chain",type:"puzzle design"},{q:"Find a news post with image+text - is there conflict? Fact-check",type:"fact-check"}],assessment:{mcq:[{q:"Multi-modal reasoning needs:",opts:["Only image","Only text","Chain across image+text+knowledge","Only audio"],ans:2},{q:"Grounding means:",opts:["Putting on ground","Linking word to image region","Ignoring image","Only text"],ans:1}],rubric:"3 pts: Chain-of-thought with 3 steps, 2 pts: Identifies conflict, 2 pts: Uses world knowledge, 1 pt: Grounds example"}}},{id:"W18",num:18,title:"PROJECT 3: Multi-modal Storyteller",subtitle:"Image + Voice + Text story",mentalModel:"Storyteller with Pictures and Voice",mentalEmoji:"\uD83D\uDCD6\uD83C\uDF99️\uD83D\uDDBC️",color:"from-violet-600 to-indigo-600",teacherBackground:{history:"2023-2024: Multi-modal generation emerges: DALL-E 3 generates images from text, ElevenLabs generates voice, GPT-4V reasons across. 2024: Sora (text to video), Suno (text to music), combined into storyteller agents. Project-based learning roots: Papert's constructionism - learn by making shareable artifact. Multi-modal storyteller is culmination: uses CLIP (W14) to match story to image, Whisper (W15) for voice input, TTS (W16) for narration, reasoning (W17) to ensure story coherent across modalities. Real product: children's personalized storybooks (Wonderbly).",whyGrade9:"Capstone: integrates 5 weeks. Storytelling is human universal, low floor high ceiling: simple story with one image+voice, advanced with branching narrative. They become creators not consumers. Also portfolio: can share with family, school exhibition. Builds AI literacy + creativity + ethics: they must consider voice consent, image copyright, bias in story.",realWorld:["Wonderbly personalized books: child's name + avatar + story","YouTube Kids: AI storyteller with images+voice","Museum audio guides: image of artifact + story + voice","Accessibility: picture books narrated for blind"],kidQA:[{q:"Can AI make full story with pictures and voice alone?",a:"Yes, but quality varies. AI can generate story text (GPT), images (DALL-E), voice (ElevenLabs), but coherence across is hard: character looks different each image, voice emotion mismatch. Human curation needed - that's your job as director.",followUp:"What would you do if AI generates character with 3 hands?"},{q:"Who owns story made with AI images + AI voice + my text?",a:"Complex! Your text = yours. AI image trained on artists = maybe artists' IP? AI voice cloned = voice owner? US Copyright Office 2023: AI-only not copyrightable, human-AI collaboration maybe. Best: use own photos, your voice, AI assists.",followUp:"How would you credit AI vs human?"},{q:"How to make story not biased?",a:"Check: who are heroes? All one gender? All one skin tone? Use diverse characters intentionally. Test story with different image prompts: 'doctor' -> does AI show only men? If yes, fix prompt to 'female doctor'. Audit.",followUp:"Audit your story for bias using checklist"}],vocab:[{term:"Storyteller Agent",def:"AI system that combines text+image+voice to tell story",example:"Your project: image + narration + text"},{term:"Coherence",def:"Story makes sense across modalities",example:"Image shows cat, text says cat, voice says cat - coherent"},{term:"Curation",def:"Human selects and fixes AI outputs",example:"AI gives 4 images, you choose best"},{term:"Attribution",def:"Giving credit for creation",example:"Story by Priya, images by DALL-E, voice by ElevenLabs"}]},mentalModelDeep:{teacherAnalogy:"Bollywood director: has scriptwriter (text), cinematographer (image), music director (voice). Director's job not to do all, but to ensure all tell same story coherently. If script says sad, but image shows party and voice happy, audience confused. Director curates. You are director of multi-modal storyteller: you write story beats, choose images that match (CLIP matching), choose voice emotion that matches (TTS prosody), ensure reasoning holds (detective checks coherence). AI are your crew, you are director.",studentAnalogy:"Making Instagram reel: you choose photo (image), write caption (text), add voiceover (voice). If photo is beach but caption about mountains, followers confused. Good reel = all three tell same vibe. You already are storyteller, now with AI crew.",sketchSteps:[{step:"Draw director chair, 3 crew members",sec:12,draw:"Director you in center, crew: text, image, voice"},{step:"Storyboard 3 panels",sec:12,draw:"Panel 1: image + text + voice note, Panel 2, Panel 3"},{step:"Check coherence arrows",sec:12,draw:"Arrows between panels: does character same? Emotion same? Checkmarks"},{step:"Curation decision",sec:12,draw:"AI gives 4 images, you circle 1 best, cross others"},{step:"Audience test",sec:12,draw:"Audience (classmate) watches, gives feedback, you iterate"}],wrongVsRight:{wrong:"Let AI generate everything automatically without checking - incoherent story, bias, wrong voice",right:"Human directs: writes outline, curates AI outputs, checks coherence + bias + consent, iterates",fix:"Use checklist: coherence? bias? consent? attribution?"},bridgeQuestion:"If AI generates story where hero always boy, how would you fix? What if AI voice clones your friend without permission - what to do?"},examples:[{title:"Personalized Bedtime Story",story:"Aarav's little sister loves dinosaurs. He makes story: image of cute dino (DALL-E), text 'Dino goes to school', voice in his own cloned voice (with consent) reading story. Sister loves.",howItWorks:"Text: GPT generates story beats. Image: DALL-E prompt 'cute baby dinosaur with backpack, consistent style'. Voice: ElevenLabs clone Aarav's voice (consented). Reasoning: checks dino same across images.",whereToSee:"Wonderbly, Bedtime Stories AI",discussionQ:"Is it okay to clone your own voice? What about sister's?",whatIf:"What if sister thinks dino real because images realistic?",ethics:{benefits:"Personalized learning, family bonding",harmed:"If child thinks AI dino real, confusion",missing:"Consent for voice, reality vs fiction",trafficLight:"green",reason:"Consensual personal use"}},{title:"History Comes Alive",story:"Class makes story of Rani Lakshmibai: image (historical painting), text (her bravery), voice (dramatic narration). But AI shows Rani with light skin - bias.",howItWorks:"Prompts must be engineered: 'Rani Lakshmibai, Indian queen, dark skin, historical accuracy'. Curation fixes bias.",whereToSee:"Museum exhibits",discussionQ:"How to ensure historical accuracy with AI images?",whatIf:"What if AI generates inaccurate history - who responsible?",ethics:{benefits:"Engaging history",harmed:"Historical inaccuracy, whitewashing",missing:"Historian review needed",trafficLight:"yellow",reason:"Accuracy + representation"}},{title:"Accessibility Storybook",story:"Blind student needs storybook: images described via alt-text (CLIP), text large, voice narration with emotion. Multi-modal for accessibility.",howItWorks:"Image -> alt-text via CLIP+GPT-4V, text -> TTS with prosody, tactile images via embossing.",whereToSee:"Accessible books",discussionQ:"How to make multi-modal accessible for all d
