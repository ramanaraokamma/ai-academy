,key:"1mm8w8"}]]);var xt=D("Lock",[["rect",{width:"18",height:"11",x:"3",y:"11",rx:"2",ry:"2",key:"1w4ew1"}],["path",{d:"M7 11V7a5 5 0 0 1 10 0v4",key:"fwvmzm"}]]);var Tn=D("Map",[["path",{d:"M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z",key:"169xi5"}],["path",{d:"M15 5.764v15",key:"1pn4in"}],["path",{d:"M9 3.236v15",key:"1uimfh"}]]);var Cn=D("Move",[["path",{d:"M12 2v20",key:"t6zp3m"}],["path",{d:"m15 19-3 3-3-3",key:"11eu04"}],["path",{d:"m19 9 3 3-3 3",key:"1mg7y2"}],["path",{d:"M2 12h20",key:"9i4pu4"}],["path",{d:"m5 9-3 3 3 3",key:"j64kie"}],["path",{d:"m9 5 3-3 3 3",key:"l8vdw6"}]]);var Rn=D("Route",[["circle",{cx:"6",cy:"19",r:"3",key:"1kj8tv"}],["path",{d:"M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15",key:"1d8sl"}],["circle",{cx:"18",cy:"5",r:"3",key:"gq8acd"}]]);var In=D("Shield",[["path",{d:"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z",key:"oel41y"}]]);var Ht=D("Target",[["circle",{cx:"12",cy:"12",r:"10",key:"1mglay"}],["circle",{cx:"12",cy:"12",r:"6",key:"1vlfrh"}],["circle",{cx:"12",cy:"12",r:"2",key:"1c9p78"}]]);var Dn=D("Wrench",[["path",{d:"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z",key:"cbrjhi"}]]);var Pn=D("Zap",[["path",{d:"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z",key:"1xq2db"}]]);var pc=He(Nt(),1),Vm=Symbol.for("react.element");var Ym=Object.prototype.hasOwnProperty,$m=pc.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,Gm={key:!0,ref:!0,__self:!0,__source:!0};function fc(e,t,r){var n,o={},i=null,l=null;r!==void 0&&(i=""+r),t.key!==void 0&&(i=""+t.key),t.ref!==void 0&&(l=t.ref);for(n in t)Ym.call(t,n)&&!Gm.hasOwnProperty(n)&&(o[n]=t[n]);if(e&&e.defaultProps)for(n in t=e.defaultProps,t)o[n]===void 0&&(o[n]=t[n]);return{$$typeof:Vm,type:e,key:i,ref:l,props:o,_owner:$m.current}}var s=fc,c=fc;var Be=[{id:"W1",num:1,title:"What is Embodied AI?",subtitle:"Brain + Body",icon:bn,color:"#F59E0B",mentalModelName:"Brain in Body",tagline:"AI needs a body to act",teacherEmpowerment:{whatIsThisReally:"Embodied AI is the idea that true intelligence requires a physical body interacting with the world, not just a brain in a jar. Coined in the 1980s by Rodney Brooks at MIT who argued against symbolic AI — he built robots like Genghis that learned by walking, not by thinking. It traces back to 1950s robotics (Asimov's laws) but exploded when we realized a Roomba learns your home better by bumping into walls than by reading a map. In 2022 Tesla Bot and Boston Dynamics showed that large AI models plus a body create new capabilities. Why it matters: without a body, AI can chat but cannot act — embodied AI closes the loop from perception to action.",why9thGradersNeedThis:"Every robot vacuum that learns their bedroom layout and every self-driving car deciding when to brake uses embodied AI. Their phones have AI that sees, but robots have AI that sees AND moves — that distinction is their future job market. Understanding that intelligence is not just calculation but physical interaction rewires how they think about learning itself.",realWorldBehindTheScenes:"Roomba doesn't have a perfect map uploaded. It uses bump sensors + camera to build memory of your room through touch. Tesla FSD combines 8 cameras (eyes) with motors (muscles) and runs the same embodied loop 100x per second: see -> think -> steer. Boston Dynamics Atlas does 1000 micro-adjustments per second to stay upright — that's embodied intelligence, not pre-programmed dance.",kidQA:[{q:"Can robots feel?",a:"Robots sense pressure and temperature, but they don't feel pain like you. Touch sensor says '15 Newtons of force' — your brain says 'ouch'. Embodied AI is getting closer to understanding that difference."},{q:"If AI is so smart, why does it need a body?",a:"Imagine learning to ride a bike by only reading a book. You'd fail. Your body needs to wobble, fall, and balance. AI is the same — ChatGPT reads books, robots learn by wobbling in the real world."},{q:"Is my brain in a jar right now?",a:"No — your brain gets data from eyes, ears, skin, and muscles constantly. Take that away and you can't learn. That's why we say: Brain needs Body to Learn."}],vocab:[{term:"Embodied AI",teacherDef:"AI agent that learns through physical interaction with environment via sensors and actuators",kidDef:"Smart brain inside a body that learns by doing stuff",pron:"em-BOD-ied A-I",cue:"\uD83E\uDD16 + \uD83E\uDDE0 inside body outline"},{term:"Perception-Action Loop",teacherDef:"Cycle: sense environment → process → act → sense again",kidDef:"Look, think, move, look again — repeat",pron:"per-CEP-shun AK-shun",cue:"\uD83D\uDD04 eye → brain → hand"},{term:"Morphological Computation",teacherDef:"Body shape doing part of computation (compliant legs absorb shock)",kidDef:"Your body shape does math for you",pron:"mor-fo-LOJ-i-cal",cue:"\uD83E\uDDB6 springy foot shape"},{term:"Symbol Grounding",teacherDef:"Problem of connecting abstract symbols to real-world meaning via body",kidDef:"Knowing what 'apple' really means because you touched it",pron:"SIM-bol GROUND-ing",cue:"\uD83C\uDF4E + hand touching"}]},mentalModelDeep:{name:"Brain in Body vs Brain in Jar",teacherAnalogy:"A brain in a jar gets text descriptions: 'chair is for sitting'. A brain in a body tries to sit, falls, adjusts. The jar brain knows the dictionary definition. The body brain knows balance, friction, weight. Research: infants learn 'support' not by definition but by 2000 failed block towers by 12 months. Embodied AI replicates that trial-and-error grounding.",studentAnalogy:"Learning soccer by watching YouTube vs actually kicking the ball and falling down. You need the fall to learn.",sketchSteps:["Draw big jar on left, brain inside with eyes looking out, label 'AI only sees internet'","Draw stick figure on right with big brain, hands touching world","Draw arrows: Left = one-way (internet -> brain). Right = loop (world <-> body <-> brain)","Add sticky notes falling off jar brain: 'chair, apple, run' with no connection","Add same words connected to body: chair touching bottom, apple in hand, legs running"],wrongVsRight:{wrong:"Brain = intelligence, body = just transport for brain",right:"Body shape + sensors IS part of intelligence — without body, brain cannot ground meaning"},bridgeQ:"If you lost all touch and sight for a day, could you still learn a new dance? What would be missing?"},examplesBank:[{title:"Roomba Learns Your Home",story:"First day Roomba bumps every chair. By day 7 it knows where your dog bowl is and avoids it. No one uploaded your floor plan.",howItWorks:"Bump sensor triggers → records coordinate as obstacle. Camera tracks ceiling lights for position. After 20 runs, map stabilizes.",whereToSee:"Home vacuum, home",discussionQ:"Why not just give Roomba your house map from your phone?",whatIf:"If you move furniture, Roomba's success drops 40% then recovers in 3 days — shows embodied relearning.",ethics:{benefits:"Helps elderly clean independently",harmed:"Maps home layout — privacy risk if hacked",missing:"Low-income homes without Roomba miss benefit",light:"Yellow"}},{title:"Boston Dynamics Atlas Parkour",story:"Atlas doesn't follow pre-recorded dance. It sees box height, calculates leg thrust in real time, adjusts if box slips.",howItWorks:"Depth cameras measure box (eyes) → RL policy outputs joint torques (muscles) → 1000Hz balance correction. Falls teach it.",whereToSee:"YouTube Boston Dynamics",discussionQ:"Is Atlas intelligent or just well programmed?",whatIf:"If box is 5cm taller than training data, success falls from 92% to 61% — body must adapt.",ethics:{benefits:"Search & rescue in rubble",harmed:"Potential military use",missing:"Fearful public not consulted",light:"Red"}},{title:"Self-Driving Car Brakes for Kid",story:"Tesla sees ball rolling into street, predicts child following, brakes before child visible.",howItWorks:"Cameras detect ball trajectory → memory: ball + street = child likely → pre-charge brakes. Embodied prediction from physical experience of neighborhoods.",whereToSee:"Street near schools",discussionQ:"Should car brake for every ball? What about false brakes?",whatIf:"If training data had no kids, car would ignore ball — embodied experience gap kills safety.",ethics:{benefits:"Prevents child injuries",harmed:"False braking causes rear-end crashes",missing:"Children in Global South rarely in training data",light:"Yellow"}},{title:"Drone Learns Wind",story:"Delivery drone in San Francisco first crashes in wind gust. After 100 flights it tilts into wind before gust hits.",howItWorks:"IMU feels sudden tilt (like inner ear) → logs wind pattern at that corner → next time leans early. Body learns wind map.",whereToSee:"Delivery drones, SF/ windy cities",discussionQ:"Can a drone ever learn all wind?",whatIf:"Data from summer only = winter wind failures +35%",ethics:{benefits:"Medicine delivery in storms",harmed:"Noise over poor neighborhoods",missing:"Bird migration paths not in model",light:"Yellow"}},{title:"Prosthetic Hand Feels",story:"9th grader Maya's prosthetic hand with touch sensors lets her pick up egg without crushing after 2 weeks practice.",howItWorks:"Pressure sensors in fingertips → vibrate arm when grip >2N → brain learns mapping. Embodied feedback loop replaces lost nerves.",whereToSee:"Hospitals, Paralympics",discussionQ:"Is Maya's learning AI or human?",whatIf:"Without touch feedback, egg break rate 78% vs 12% with feedback.",ethics:{benefits:"Restores independence",harmed:"Expensive $20k — only wealthy access",missing:"Users with skin conditions excluded",light:"Green"}},{title:"ChatGPT vs Robot Chef",story:"ChatGPT can write perfect omelet recipe. Robot chef with arms actually burns first 30 omelets, then learns pan heat.",howItWorks:"ChatGPT has symbol knowledge. Robot chef has temperature sensor + spatula force sensor → learns 'sizzle sound + 2 sec = flip'. Embodied grounding.",whereToSee:"Kitchen robotics startups",discussionQ:"Which is more intelligent — recipe writer or omelet flipper?",whatIf:"If you change pan material, robot fails but ChatGPT recipe still 'correct' — shows difference.",ethics:{benefits:"Helps disabled cook",harmed:"Chef job loss",missing:"Cultural recipes not in training",light:"Yellow"}}],physicalComputing:{title:"Brain in Jar Demo",goal:"Show micro:bit alone is helpless, needs body",wiring:"micro:bit V2 + 2x TT motors + motor driver + battery pack. Micro:bit is brain, motors are body. Disconnect motors = brain in jar.",code:`on start: show \uD83E\uDDE0
if button A pressed and motors connected: move forward
if motors disconnected: show ❌ 'I can't move! I need a body!'
loop: light sensor value → if dark, turn (body reacting)`,materials:["micro:bit","2 motors","L9110 driver","tape body"],check:"Can students explain why same code fails without motors?"},communityData:{prompt:"Does body shape change learning?",dataDesc:"Each class measures time for robot to navigate maze with wide vs narrow wheelbase",insight:"Narrow base 23% faster but 40% more falls — body tradeoffs"},lesson90:{prep:"Tape 2 maze squares, charge micro:bits, print Brain/Body cards",phases:[{time:"0-10min",name:"Hook - Brain in Jar",goal:"Surprise that AI needs body",script:"I have two students. One only read about bikes, one actually rode and fell 10 times. Who rides better tomorrow? Turn to partner — 30 seconds. Okay, today we prove AI is the same. AI without body is the kid who only read.",studentAction:"Turn & talk, vote with hands: reader vs rider",materials:"None",check:"80% say rider learns better → green light to proceed",stuck:"If students say reading is enough: Ask 'Can you learn TikTok dance by reading steps?'"},{time:"10-25min",name:"Direct - Embodied Defined",goal:"Define perception-action loop",script:"Embodied AI means intelligence lives in loop: sense, think, act, sense again. Draw loop on board now. Watch: I close eyes, you guide me to door with only voice — that's jar brain. Now I open eyes, I walk myself — that's embodied. Which was faster? Body + brain together wins.",studentAction:"Draw loop in notebook, copy sketch steps",materials:"Whiteboard, jar vs body drawing",check:"Can they draw loop without looking? Thumbs up?",stuck:"If loop confusing: Use robot vacuum story — bump, remember, avoid"},{time:"25-45min",name:"Unplugged - Blind Robot",goal:"Feel need for body feedback",script:"Trainer closes eyes, Tester says 'move forward 3 steps'. Recorder writes if they hit desk. Switch roles. Count crashes. Now open eyes — crashes drop to zero. Your body sensors prevented crash. Robots need same.",studentAction:"Roles rotate, record crashes jar vs embodied",materials:"Blindfolds, desks as obstacles",check:"Data shows embodied 90% fewer crashes",stuck:"If too chaotic: Use tape line instead of desks, reduce to 1 step"},{time:"45-65min",name:"Build - micro:bit Needs Body",goal:"Wire motors, see helpless brain",script:"Upload brain code to micro:bit alone — press A. Nothing moves. Now connect motors to driver, same code — it drives! Your brain didn't change, body did. Intelligence = brain + body. Test: disconnect one motor — what happens? It spins in circles. Body shape matters.",studentAction:"Wire motors, test with/without body",materials:"micro:bit kit",check:"Group shows spinning vs straight = body shape effect",stuck:"If wiring fails: Use pre-wired demo bot, focus on concept"},{time:"65-80min",name:"Ethics + Data",goal:"When does body help/harm?",script:"Roomba maps your home to clean better — helpful. Same map sold to advertisers — creepy. Brain in body gives robot power. Who decides what robot should sense? Should robot vacuum record you sleeping? Discuss with ethics traffic light.",studentAction:"Rate Roomba example Red/Yellow/Green, debate",materials:"Ethics cards",check:"At least 2 different lights argued with reason",stuck:"If quiet: Prompt 'Would you want robot that sees in bathroom to clean better?'"},{time:"80-90min",name:"Exit + Preview",goal:"Consolidate loop",script:"Exit ticket: Draw perception-action loop and label one sensor and one actuator from today. Next week: we open robot eyes — cameras and LIDAR. How do robots SEE? Your homework: count sensors on your phone — how many eyes does your phone have?",studentAction:"Draw loop, submit ticket, count phone sensors",materials:"Exit ticket slip",check:"Loop has 4 parts and arrow cycle",stuck:"Provide loop template with blanks"}]},unplugged:{roles:["Trainer (gives instructions)","Robot (blindfolded moves)","Tester (places obstacles)","Recorder (counts bumps)"],materials:["Blindfold","Tape maze","Data sheet"],steps:["Trainer closes eyes","Tester places 3 obstacles in tape square","Trainer tries to cross with only verbal instructions (jar mode) - record bumps","Repeat with eyes open (embodied mode) - record bumps","Compare data: jar = 5 bumps avg, embodied = 0","Switch roles, repeat","Class chart: Body reduces errors 85%"],variations:["Fast: 1 obstacle","Slow: Add noise — Trainer must hum while walking"],observe:"Do students spontaneously use hands to feel? That's morphological computation",mistakes:["Forgetting to record jar vs embodied separately","Tester moving obstacles mid-walk","Recorder not counting soft touches"]},workbook:{tasks:["Draw perception-action loop with your own labels","List 3 devices at home that are brain+body vs brain-only","Explain why ChatGPT cannot ride bike"],rubric:"Loop 4 parts + arrows 3pts, examples correct 3pts, explanation references trial/error 4pts"}},{id:"W2",num:2,title:"Sensors - How Robots See/Feel",subtitle:"Robot Senses",icon:Nn,color:"#06B6D4",mentalModelName:"Robot Senses",tagline:"Like human 5 senses but robot version",teacherEmpowerment:{whatIsThisReally:"Sensors are transducers converting physical phenomena into electrical signals a computer can read. Human retina has 120M rods, robot camera has 12M pixels but with LIDAR it sees depth we can't. Modern robotics started in 1960s with touch sensors on Stanford Arm, LIDAR invented 1961 for aerospace, exploded 2005 with DARPA Grand Challenge where Stanley used 5 LIDARs to win $2M. Today iPhone has LIDAR, Tesla uses 8 cameras no LIDAR (controversial). Why matters: garbage sensor data = garbage AI decisions — sensor choice defines robot capability ceiling.",why9thGradersNeedThis:"Their phone has 12+ sensors they never notice — accelerometer rotates screen, ambient light dims display, proximity turns off screen during calls. Self-driving cars use same but life-critical. Understanding sensor limits explains why autonomous cars fail in rain: water blinds LIDAR like fog blinds human eyes.",realWorldBehindTheScenes:"Roomba uses cliff sensors (infrared) to not fall down stairs — same as your phone proximity sensor. Tesla Vision uses cameras + neural nets to estimate depth from 2D (like you with one eye closed guessing distance). LIDAR on Waymo shoots 1M laser pulses/sec, measures return time: distance = light speed × time /2. Ultrasonic sensor cheap $2 version uses sound echo same as bat. Sensor fusion: Kalman filter merges camera + LIDAR to agree.",kidQA:[{q:"Can robots feel pain?",a:"They measure force. Pain is brain interpretation. Robot can stop when force > 20N to avoid damage — that's not pain, it's limit switch. But future robots may need pain-like signals to learn."},{q:"Why not give robot human eyes?",a:"Human eyes are amazing but slow (13ms) and need brain. Robot cameras are faster (1ms) and can see infrared. But human eyes have 576MP equivalent — robot cameras still far behind."},{q:"Can robot see in dark?",a:"LIDAR can — it brings its own light (laser). Camera can't without night vision. That's why self-driving cars struggle at night without LIDAR — like you without flashlight."}],vocab:[{term:"LIDAR",teacherDef:"Laser imaging detecting distance via time-of-flight of laser pulse",kidDef:"Robot laser tape measure that spins 360°",pron:"LY-dar",cue:"\uD83D\uDD26 spinning laser"},{term:"Sensor Fusion",teacherDef:"Combining multiple sensors to reduce uncertainty",kidDef:"Asking 3 friends same question to get better answer",pron:"FYOO-zhun",cue:"\uD83D\uDC41️+\uD83D\uDC42=better guess"},{term:"Transducer",teacherDef:"Converts one energy form to another (light → voltage)",kidDef:"Translator from real world to robot language",pron:"trans-DOO-ser",cue:"\uD83C\uDF0D→⚡"},{term:"Resolution",teacherDef:"Smallest detectable change (e.g., 1mm for LIDAR)",kidDef:"How detailed robot's vision is",pron:"rez-oh-LOO-shun",cue:"\uD83D\uDD0D pixels"}]},mentalModelDeep:{name:"Robot Senses",teacherAnalogy:"Human 5 senses are transducers: cochlea converts pressure to nerve spikes, retina converts photons to spikes. Robot sensors identical principle but different physics: photodiode = artificial retina, MEMS accelerometer = artificial inner ear, ultrasonic = bat ears. Key insight: sensors don't 'see' — they produce numbers. Vision happens in brain interpreting numbers. Same for robots: camera outputs RGB numbers, AI interprets as 'chair'. No interpretation, no sight.",studentAnalogy:"Your phone screen brightness auto-adjusts — that's light sensor being robot eye. Your AirPods pause when you take them out — that's proximity sensor being robot touch.",sketchSteps:["Draw human head with 5 senses labeled, arrows to brain","Draw robot head with 5 matching sensors: camera=eye, mic=ear, touch=skin, LIDAR=depth, IMU=balance","For each sensor, draw what it outputs: camera → grid of numbers, LIDAR → dots, touch → 0/1","Draw brain box: 'Numbers → Meaning (AI)' for both human and robot","Add limitation: cover camera lens with fog drawing — 'bad numbers = bad meaning'"],wrongVsRight:{wrong:"Camera sees chair like I see chair",right:"Camera makes number grid; AI guesses 'chair' from pattern; can be wrong like seeing face in toast"},bridgeQ:"If you wear sunglasses in dark room, you misjudge distances. What robot sensor would fail similarly and cause crash?"},examplesBank:[{title:"Phone Auto-Brightness",story:"You walk outside, screen goes bright automatically. Inside, dims. No button press.",howItWorks:"Ambient light sensor (photodiode) measures lux → if >500 lux, set brightness 100%. 10-cent sensor saves battery.",whereToSee:"Every smartphone",discussionQ:"What happens if sensor is covered by case?",whatIf:"If sensor dirty, phone thinks dark = dim screen outside unreadable — small sensor error big user pain.",ethics:{benefits:"Saves battery, accessibility",harmed:"None minimal",missing:"People with light sensitivity need override",light:"Green"}},{title:"Tesla vs Waymo Sensor Fight",story:"Tesla says cameras enough like humans. Waymo says need LIDAR lasers. Both claim safest. Who's right?",howItWorks:"Tesla: 8 cameras + NN depth estimation (cheap $500). Waymo: 5 LIDAR + 10 cameras (expensive $10k) but direct depth. Fusion debate.",whereToSee:"Self-driving car news",discussionQ:"Should cheap but less safe be allowed?",whatIf:"Rain scatters LIDAR 30% errors, camera 50% errors — both fail, different ways.",ethics:{benefits:"Competition drives cost down",harmed:"Public becomes beta testers",missing:"Regulators lack sensor expertise",light:"Yellow"}},{title:"Robot Vacuum Cliff Sensor",story:"Roomba stops at stairs edge. Never falls. Your toddler doesn't have this.",howItWorks:"IR emitter shines down, receiver looks for floor reflection. No reflection = cliff = stop + turn. 4 sensors cost $1 total.",whereToSee:"Home, stairs",discussionQ:"What if floor is black and absorbs IR?",whatIf:"Black carpet absorbs IR → robot thinks cliff everywhere → refuses to clean — sensor bias against dark floors.",ethics:{benefits:"Prevents damage",harmed:"Fails on dark skin? No but dark carpet",missing:"Dark floor owners excluded",light:"Yellow"}},{title:"Surgery Robot Touch",story:"Da Vinci robot lets surgeon feel tissue hardness through sensors even though robot has no fingers.",howItWorks:"Strain gauges measure tool force → haptic handle vibrates more for hard tumor. Surgeon feels what robot feels remotely.",whereToSee:"Hospital surgery",discussionQ:"Should robot do surgery alone?",whatIf:"If force sensor drifts 10%, surgeon may cut too deep — calibration life-critical.",ethics:{benefits:"Precise surgery remote villages",harmed:"If hacked, could harm patient",missing:"Patients unaware robot touch is indirect",light:"Red"}},{title:"Ultrasonic Bat Sensor $2",story:"Arduino robot avoids walls with $2 HC-SR04 ultrasonic — same as bat echolocation.",howItWorks:"Sends 40kHz ping, measures echo time. Distance = speed sound × time/2. 2cm-4m range. Fails on soft curtains (absorbs sound).",whereToSee:"School robotics kits",discussionQ:"Why bats not use LIDAR?",whatIf:"Soft fabric absorbs sound → robot crashes into couch thinking no wall — material matters.",ethics:{benefits:"Cheap makes robotics accessible",harmed:"None",missing:"None",light:"Green"}},{title:"iPhone FaceID Dot Projector",story:"FaceID works in dark. How? It projects 30,000 invisible dots on your face.",howItWorks:"IR dot projector + IR camera = depth map of face. LIDAR principle but structured light. Works in dark because it brings own light.",whereToSee:"iPhone X and later",discussionQ:"Can it tell twins apart?",whatIf:"If you wear IR-blocking sunglasses, dots invisible → fail. Also identical twins 25% false match.",ethics:{benefits:"Secure without password",harmed:"Trains kids to trust face scanning",missing:"Face data stored — consent?",light:"Yellow"}}],physicalComputing:{title:"Robot Senses Lab",goal:"Test micro:bit light, temp, ultrasonic",wiring:"micro:bit on board + HC-SR04 ultrasonic: VCC 5V, Trig P0, Echo P1, GND. Optional DHT11 temp sensor P2.",code:`forever:
  light = lightLevel
  temp = temperature
  distance = sonar P0 P1
  show bar graph light
  if distance <10cm: play buzzer
  serial print light,temp,distance`,materials:["micro:bit","HC-SR04","jumper wires"],check:"Can students make robot stop at 10cm like cliff sensor?"},communityData:{prompt:"Which sensor most reliable?",dataDesc:"Classes test light vs ultrasonic in dark vs bright, log success",insight:"Ultrasonic 95% in dark, light sensor 40% — darkness bias"},lesson90:{prep:"Tape ultrasonic to micro:bit, dark box, flashlight",phases:[{time:"0-10min",name:"Hook - Phone Sensors",goal:"Count invisible sensors",script:"Take phones out — how many sensors inside? List: accelerometer, gyroscope, magnetometer, light, proximity, barometer, GPS, mic, camera. That's 9! Your phone has more senses than you. Today we steal them for robots.",studentAction:"List phone sensors, guess count",materials:"Phones",check:"At least 5 identified",stuck:"Show iPhone sensor diagram poster"},{time:"10-25min",name:"Direct - Transducer",goal:"Numbers not seeing",script:"I cover camera with tape — what does it output? Still numbers, but all black. Sensor always outputs numbers, AI must interpret. Show HC-SR04: shout, hear echo — distance from echo time. Same as bat. LIDAR same but light speed, not sound.",studentAction:"Shout echo demo, calculate distance",materials:"Ultrasonic demo, tape",check:"Can explain echo time = distance",stuck:"Clap in hallway, count seconds"},{time:"25-45min",name:"Unplugged - Human Sensors",goal:"Feel transducer limits",script:"Trainer is robot, eyes closed. Only touch shoulder if obstacle left, right shoulder right, no touch front clear. That's touch sensor 1-bit. Now add sound: Tester claps, Trainer estimates distance from loudness — that's ultrasonic. Which more accurate?",studentAction:"Human sensor simulation",materials:"Blindfold",check:"Students notice touch binary vs sound analog",stuck:"Use only touch first, then add sound"},{time:"45-65min",name:"Build - Ultrasonic Stop",goal:"Code cliff sensor",script:"Wire Trig Echo, code: if distance <15cm stop motors else go. Test with hand approaching. Now test with black paper vs white paper — distance changes? Black absorbs sound? Actually ultrasonic okay, IR fails — sensor physics matters. Log data.",studentAction:"Wire, code, test materials",materials:"micro:bit + HC-SR04 + paper colors",check:"Robot stops at 15cm, data logged",stuck:"Provide pre-wired kit, focus on code"},{time:"65-80min",name:"Ethics - Sensor Bias",goal:"When sensors discriminate",script:"Roomba cliff sensor fails on black carpet — who does that harm? People with dark floors, often apartments. Pulse oximeter fails on dark skin — same sensor bias. Which traffic light for cliff sensor? Yellow — benefits many, harms some group not considered. How fix? Test with dark surfaces.",studentAction:"Rate examples, propose fix: add ultrasonic backup",materials:"Ethics wall",check:"Can name harmed group + fix",stuck:"Ask: would sensor work same for all floors?"},{time:"80-90min",name:"Exit - Fusion",goal:"Why multiple sensors",script:"One sensor fails in rain, two sensors can agree. That's fusion. Exit: draw robot head with 2 sensors and write when each fails. Preview: next week muscles — sensors useless without muscles.",studentAction:"Draw fusion diagram",materials:"Exit slip",check:"2 sensors + failure condition each",stuck:"Template: camera fails ___, LIDAR fails ___"}]},unplugged:{roles:["Sensor (eyes closed, only touch)","Processor (decides)","Actuator (moves)","Environment (moves obstacles)"],materials:["Blindfold","Bells","Foam obstacles"],steps:["Sensor stands with back to obstacles, only feels taps","Processor hears Sensor description and decides direction","Actuator moves one step based on Processor","Environment quietly moves one obstacle after each move (dynamic world)","Sensor must detect change — how? Only taps, delayed","Log successes — sensor delay causes crashes","Switch roles"],variations:["Fast: No delay","Slow: Add second sensor (sound)"],observe:"Do teams invent sensor fusion spontaneously?",mistakes:["Sensor speaking not just tapping","Processor moving without Sensor input","Forgetting environment changes"]},workbook:{tasks:["Label transducer chain for camera","Compare LIDAR vs ultrasonic table","Design sensor suite for rescue robot"],rubric:"Chain correct 4pts, comparison 3pts (cost/range/failure), design justification 3pts"}},{id:"W3",num:3,title:"Actuators - How Robots Move",subtitle:"Muscles for Robots",icon:Cn,color:"#F59E0B",mentalModelName:"Robot Muscles",tagline:"Muscles for Robots",teacherEmpowerment:{whatIsThisReally:"Actuators convert electrical energy to mechanical motion — motors spin, servos position, pneumatics push. Human muscle converts chemical to motion 25% efficient, DC motor 85% efficient but less compliant. History: 1888 Tesla AC motor, 1940s servos for anti-aircraft guns, 1970s industrial robot arms used servo + harmonic drive, 2020s Boston Dynamics uses hydraulic + electric hybrid for Atlas. Why matters: sensor tells robot where it is, actuator decides if it can actually go — many AI plans fail because actuators cannot execute (e.g., car skids).",why9thGradersNeedThis:"Every vibration motor in phone, every electric car wheel, every drone propeller is actuator. Understanding torque vs speed explains why e-bike struggles uphill: needs torque not speed. Their future: soft actuators that work with humans safely, not just hard motors that hurt.",realWorldBehindTheScenes:"Servo motor has three parts: DC motor + gearbox + potentiometer + controller. You send 'go to 90°', potentiometer measures actual angle, controller corrects error 50x/sec — that's feedback. Tesla wheel: inverter converts battery DC to AC, controls torque 1000x/sec for traction. Boston Dynamics: hydraulic actuators provide 10x power of electric but leak; new electric with springs mimics muscle compliance.",kidQA:[{q:"Why not use super strong motors always?",a:"Strong motors heavy, hot, dangerous. Human arm can lift 20kg but also gently hold baby — needs variable force. Robot needs same: strong but compliant. That's why soft actuators invented."},{q:"Can robot get tired?",a:"Motors overheat, batteries drain — that's robot tired. Thermal sensor stops motor at 80°C. Human tired is chemical, robot tired is thermal."},{q:"What's better: legs or wheels?",a:"Wheels efficient on flat (Roomba), legs good on stairs (Atlas). Wheels 10x more efficient. That's why Mars rover has wheels, not legs — energy limited."}],vocab:[{term:"Actuator",teacherDef:"Device converting energy to mechanical motion",kidDef:"Robot muscle that moves things",pron:"AK-choo-ay-tor",cue:"\uD83D\uDCAA motor"},{term:"Servo",teacherDef:"Closed-loop actuator that holds position via feedback",kidDef:"Motor that knows where it is and stays",pron:"SER-vo",cue:"\uD83C\uDFAF holds angle"},{term:"Torque",teacherDef:"Rotational force (Newton-meters)",kidDef:"Twisting power — how strong turn",pron:"TORK",cue:"\uD83D\uDD27 wrench twist"},{term:"Compliance",teacherDef:"Ability to yield to external forces (soft vs rigid)",kidDef:"Squishiness — safe vs dangerous",pron:"kom-PLY-ance",cue:"\uD83E\uDDF8 soft vs \uD83E\uDDF1 hard"}]},mentalModelDeep:{name:"Robot Muscles",teacherAnalogy:"Human muscle has motor units: brain recruits few for gentle (pick egg) many for strong (lift desk). Motor control uses spindle feedback to hold position. Servo identical: controller is brain, potentiometer is spindle, gearbox is muscle fibers. Proportional control: error = target - actual, force = Kp × error. Too high Kp oscillates (shaky hands), too low Kp weak (cannot lift). Human learns Kp via cerebellum; robot engineer tunes Kp.",studentAnalogy:"Servo is like you holding arm at 90° with eyes closed — you feel if arm drops and correct. DC motor without servo is like pushing shopping cart blindfolded — no idea where it is.",sketchSteps:["Draw arm with bicep muscle, label brain → nerve → muscle → bone moves","Draw robot arm with servo: wire → servo box → arm moves, add feedback arrow back","Inside servo box draw 3 parts: small motor, gears, angle sensor","Show error equation: Want 90°, Have 70°, Error 20° → more power","Compare: DC motor = no feedback loop, servo = loop closed"],wrongVsRight:{wrong:"More power = better actuator",right:"Right power + feedback + compliance = better. Strong but blind motor crashes."},bridgeQ:"Why can you hold egg gently but robot without touch sensor crushes it? What feedback missing?"},examplesBank:[{title:"Electric Car Wheel Torque",story:"Tesla Model 3 goes 0-60 in 3.1s because motors give max torque at 0 RPM — unlike gas engine needs RPM.",howItWorks:"Inverter controls magnetic field timing to pull rotor. At low speed can give 400Nm instantly. No gearbox needed. Regen braking reverses actuator to generator.",whereToSee:"EVs",discussionQ:"Why EV better for robot than gas?",whatIf:"If battery low, torque limited to 50% — robot slower but safe.",ethics:{benefits:"Zero emissions, instant torque safer merge",harmed:"Battery mining harms communities",missing:"Miners not in design decision",light:"Yellow"}},{title:"Servo Door Lock",story:"School door lock servo moves 90° to lock. If forced, servo pushes back to hold position.",howItWorks:"Command 90° → potentiometer reads 85° → error 5° → controller sends more current until 90°. Holds even if someone pushes.",whereToSee:"School, robotics kits",discussionQ:"Should door lock have compliance?",whatIf:"If Kp too high, lock vibrates loudly — overshoot.",ethics:{benefits:"Security",harmed:"Could lock during fire if power fails — failsafe needed",missing:"Disabled students need override",light:"Yellow"}},{title:"Boston Dynamics Hydraulic Leap",story:"Atlas jumps over log. Hydraulic actuators give 10x power density vs electric, but oil leaks.",howItWorks:"Pump pressurizes oil to 200 bar, valve opens to piston → leg extends 0.1s. Position sensor closes loop. New electric version uses springs to store energy like tendon.",whereToSee:"Boston Dynamics videos",discussionQ:"Hydraulic vs electric — which for home robot?",whatIf:"Oil leak 5% pressure drop → jump 20cm short → fall.",ethics:{benefits:"Rescue over rubble",harmed:"Hydraulic high pressure dangerous near humans",missing:"Home users not considered",light:"Red"}},{title:"Drone Propeller Actuator",story:"Drone stays hover by spinning 4 propellers different speeds. One fails, it spins.",howItWorks:"Brushless motor + ESC: ESC varies 3-phase frequency to control RPM 0-8000. Flight controller adjusts 400x/sec. Propeller is actuator converting spin to thrust.",whereToSee:"Drones",discussionQ:"Why 4 propellers not 1?",whatIf:"If one motor 10% slower, drone drifts — needs feedback.",ethics:{benefits:"Photography, delivery",harmed:"Noise, privacy invasion",missing:"Birds hit propellers",light:"Yellow"}},{title:"Soft Gripper Egg",story:"Soft robotic gripper made of silicone inflates to hold egg without crushing — like human hand.",howItWorks:"Air pump inflates chambers, silicone bends around egg shape. Compliance intrinsic — no sensor needed to be gentle. Pressure = gentle force.",whereToSee:"Research labs, fruit picking robots",discussionQ:"Why not just use sensor + hard gripper?",whatIf:"If egg size varies 20%, soft gripper still works, hard needs new code.",ethics:{benefits:"Safe human-robot collaboration",harmed:"Silicone production waste",missing:"Farm workers displaced",light:"Yellow"}},{title:"Phone Vibration Motor",story:"Phone buzz is tiny actuator — eccentric rotating mass. Different buzz patterns mean different notifications.",howItWorks:"Tiny DC motor with off-center weight. Spin = vibration. Linear resonant actuator (LRA) newer: magnet shakes at 150Hz — crisper haptics.",whereToSee:"Every phone",discussionQ:"Why vibration not sound?",whatIf:"If motor unbalanced more, vibration stronger but battery 2x drain.",ethics:{benefits:"Accessibility deaf users feel calls",harmed:"None",missing:"None",light:"Green"}}],physicalComputing:{title:"Servo Control Muscles",goal:"Control angle precisely",wiring:"Servo SG90: Brown GND, Red 5V, Orange Signal P0. micro:bit drives PWM. External 5V recommended (micro:bit 3.3V weak).",code:`on button A: servo P0 0°
 on B: servo P0 90°
 on shake: servo P0 180°
 loop: if light <50: servo 45° else 135° — light tracking muscle`,materials:["SG90 servo","jumper wires","5V battery"],check:"Servo holds position even when pushed lightly?"},communityData:{prompt:"Does heavier load need more torque?",dataDesc:"Classes add weights to servo arm, measure max angle held",insight:"0g → 180°, 50g → 120°, 100g → 60° — torque limit visible"},lesson90:{prep:"Servos pre-centered at 90°, tape protractors",phases:[{time:"0-10min",name:"Hook - Human Muscle",goal:"Feel torque",script:"Hold book straight arm — feel bicep torque. Now close eyes, hold arm at 90° — you wobble but correct. That's servo feedback. Open eyes — better. Robot servo same but never tired. Today we build muscles.",studentAction:"Hold book, feel torque, eyes closed correction",materials:"Books",check:"Can explain wobble = feedback correcting",stuck:"Use lighter object if heavy"},{time:"10-25min",name:"Direct - DC vs Servo",goal:"Feedback loop",script:"DC motor: power on = spin, no idea where. Servo: power + sensor + correction. Draw error formula: target minus actual. Show inside servo: motor + gears + potentiometer. Potentiometer is muscle spindle feeling stretch. Without it blind.",studentAction:"Draw inside servo box",materials:"Disassembled servo demo",check:"Can label 3 parts",stuck:"Show video of servo internals"},{time:"25-45min",name:"Unplugged - Human Servo",goal:"Be servo",script:"Trainer says target angle 90°, Robot closes eyes holds arm, Processor watches protractor and says 'more, less, hold' — that's feedback. Time to reach target with vs without feedback. Without = overshoot 30°. With = 5°.",studentAction:"Human servo game, time measurements",materials:"Protractors, blindfolds",check:"Feedback reduces error 80%",stuck:"Reduce to 2 roles first"},{time:"45-65min",name:"Build - Servo Sweep",goal:"Code precise angle",script:"Wire servo signal to P0. Code: on A 0°, B 90°, A+B 180°. Upload. Push arm lightly — servo pushes back! That's holding. Now code light tracking: if dark 0° else 180° — muscle reacting to sensor. This is embodied loop: sensor → servo.",studentAction:"Wire, code, push test",materials:"SG90 + micro:bit",check:"Servo resists push",stuck:"Use external 5V, micro:bit 3.3V too weak"},{time:"65-80min",name:"Ethics - Strong vs Safe",goal:"Compliance tradeoff",script:"Factory robot strong and rigid — kills if hits human. Collaborative robot soft and compliant — safe but weak. Which for home? Rate Boston Dynamics hydraulic Red why? High power near kids dangerous. Soft gripper Green — safe but slower. Design choice = ethics.",studentAction:"Rate actuators Red/Yellow/Green",materials:"Ethics cards",check:"Can argue strong vs safe tradeoff",stuck:"Ask: would you want hydraulic Atlas in your bedroom?"},{time:"80-90min",name:"Exit - Actuator Selection",goal:"Choose muscle for job",script:"Exit: you design robot to pick strawberries — which actuator? Soft gripper, why? Write torque vs compliance. Preview: next week robot lost — needs map + position. How robot knows where it is without GPS? SLAM.",studentAction:"Write actuator choice justification",materials:"Exit slip",check:"Choice + torque + compliance mentioned",stuck:"Provide options: DC, servo, soft, hydraulic"}]},unplugged:{roles:["Brain (says target angle)","Sensor (reads protractor)","Muscle (pushes arm)","Arm (blindfolded holds)"],materials:["Protractor","Blindfold","Data sheet"],steps:["Brain says 90°","Arm closes eyes, holds guess","Sensor reads actual, says error","Muscle tells Arm more/less","Loop until error <5° — count iterations","Repeat without Sensor (no feedback) — measure overshoot","Compare: feedback needs 3 loops, no feedback fails"],variations:["Fast: No blindfold","Slow: Add weight to arm"],observe:"Do students invent Kp tuning (small vs large corrections)?",mistakes:["Sensor giving direction not error amount","Arm moving without Muscle cue","Not counting loops"]},workbook:{tasks:["Draw DC vs servo loop difference","Calculate torque needed for 100g at 5cm arm","Choose actuator for 3 jobs: door, egg, car"],rubric:"Loop diagram 4pts, torque calc (F×d) 3pts, choices justified 3pts"}},{id:"W4",num:4,title:"SLAM - Mapping + Localization",subtitle:"Where am I + Map",icon:Tn,color:"#06B6D4",mentalModelName:"Blindfolded Map",tagline:"Drawing map while figuring where you are",teacherEmpowerment:{whatIsThisReally:"SLAM = Simultaneous Localization And Mapping — robot builds map of unknown environment while tracking its own position inside that map. Chicken-egg problem: need map to know position, need position to build map. Solved 1986 by Smith, Self, Cheeseman with probabilistic math, 1990s breakthrough with Kalman filters, 2007 FastSLAM with particles, now visual SLAM uses cameras (ORB-SLAM). Roomba, self-driving cars, AR glasses all run SLAM. Why matters: GPS fails indoors, 1m accuracy not enough for vacuum near chair legs — SLAM gives cm accuracy with only onboard sensors.",why9thGradersNeedThis:"Their Snapchat filters use SLAM to stick dog ears on face — face map + head position tracked 60x/sec. Robot vacuum same but for rooms. Understanding SLAM explains why vacuum sometimes cleans same spot twice: localization uncertain, map imperfect.",realWorldBehindTheScenes:"Roomba SLAM: wheel encoders measure distance moved (odometry) → drifts 10% per meter. Camera sees ceiling lights as landmarks → corrects drift. Particle filter: 1000 guesses where robot might be, keep guesses that match sensor, kill others. Loop closure: when robot recognizes 'I've been here before', corrects entire map like you realizing 'this hallway loops'. Modern: LIDAR SLAM builds point cloud 300k points/sec.",kidQA:[{q:"How do robots know where they are without GPS?",a:"Like you in new mall without signs — remember you passed shoe store, turned left, counted steps. Robot counts wheel turns and remembers landmarks. That's SLAM."},{q:"What if robot map is wrong?",a:"Then localization wrong too — thinks it's in kitchen but actually bathroom. Needs loop closure to fix. Like thinking you're on 3rd floor but actually 2nd because all floors look same."},{q:"Can SLAM work outside?",a:"Yes but harder — wind moves trees (landmarks move), lighting changes. Indoor walls stable, good for SLAM. Desert bad — no landmarks."}],vocab:[{term:"SLAM",teacherDef:"Simultaneous Localization And Mapping — build map while tracking pose",kidDef:"Drawing map of maze while lost inside it",pron:"SLAM",cue:"\uD83D\uDDFA️+\uD83D\uDCCD same time"},{term:"Landmark",teacherDef:"Stable feature used for localization (corner, light)",kidDef:"Clue you remember to know where you are",pron:"LAND-mark",cue:"\uD83D\uDEA9 flag"},{term:"Odometry",teacherDef:"Estimating position from wheel rotation",kidDef:"Counting steps to guess distance",pron:"oh-DOM-e-tree",cue:"\uD83D\uDC5F steps"},{term:"Loop Closure",teacherDef:"Recognizing previously visited place to correct drift",kidDef:"Realizing 'I've been here!' and fixing map",pron:"LOOP CLO-zher",cue:"\uD83D\uDD04 loop"}]},mentalModelDeep:{name:"Blindfolded Map",teacherAnalogy:"You wake up blindfolded in unfamiliar house. You shuffle, touch wall, count steps to kitchen, draw rough map. Each step estimate has error. When you touch same fridge twice, you realize your map is stretched and correct it. SLAM identical: odometry = step counting (drifts), touch = LIDAR hit, recognizing fridge = loop closure. Particles = multiple guesses of where you might be, some guesses more consistent with touch history.",studentAnalogy:"Drawing map of school while blindfolded, only counting steps and feeling walls. When you feel locker 212 twice, you fix your map.",sketchSteps:["Draw blindfolded stick figure, label 'no GPS'","Draw wobbly path with step counts, label 'odometry drifts'","Draw question marks for walls touched, label 'landmarks'","Draw two maps: one stretched wrong, one corrected after recognizing same wall twice","Add particles: 5 ghost figures around main figure, some fade (bad guesses)"],wrongVsRight:{wrong:"Robot gets map first, then figures where it is",right:"No map given — builds and localizes at same time, correcting both together"},bridgeQ:"If every hallway in school looked identical, could you SLAM? What would you need to make hallways distinct?"},examplesBank:[{title:"Roomba Cleaning Map",story:"App shows map Roomba built: bedroom, kitchen, where it cleaned. No human gave map.",howItWorks:"Odometry + camera ceiling features → builds occupancy grid. Loop closure when returns to dock. Map saved for next clean — cleans faster 2nd time.",whereToSee:"Roomba app",discussionQ:"Who owns map of your home?",whatIf:"If you move dock, loop closure fails, map duplicated — thinks 2 kitchens.",ethics:{benefits:"Efficient cleaning, finds lost keys in map?",harmed:"iRobot sells home maps to advertisers — privacy",missing:"Renters whose landlord gets map",light:"Red"}},{title:"Snapchat Dog Filter",story:"Dog ears stick to head as you move. That's face SLAM.",howItWorks:"Camera detects 68 face landmarks → builds face map → tracks head pose 60Hz → renders ears at correct position. Visual SLAM on face.",whereToSee:"Snapchat, Instagram filters",discussionQ:"Is face map saved?",whatIf:"If lighting dark, landmarks lost → ears float away.",ethics:{benefits:"Fun, creative",harmed:"Face maps train surveillance",missing:"Kids unaware face scanned",light:"Yellow"}},{title:"Self-Driving Car HD Map",story:"Waymo car builds cm-accurate map of street with LIDAR, then localizes within 2cm to stay lane.",howItWorks:"LIDAR SLAM builds point cloud map once (HD map). At runtime, live LIDAR matches against HD map to localize. Odometry drifts 1m, LIDAR corrects to 2cm.",whereToSee:"Autonomous car tech",discussionQ:"What if construction changes road?",whatIf:"Construction cones not in HD map → car confused, may stop.",ethics:{benefits:"Safer than human lane keeping",harmed:"HD map cars only work where mapped — rural excluded",missing:"Unmapped countries",light:"Yellow"}},{title:"Mars Rover Lost",story:"Mars rover no GPS, must SLAM with cameras. One rock looks like another — gets lost.",howItWorks:"Visual odometry: track rocks between frames, estimate movement. Wheel odometry fails in sand (slip 50%). Needs star tracker for orientation.",whereToSee:"NASA Mars videos",discussionQ:"What makes good Mars landmark?",whatIf:"Dust storm hides landmarks → rover stops — cannot SLAM.",ethics:{benefits:"Explores without humans",harmed:"None",missing:"None",light:"Green"}},{title:"AR Glasses Room Map",story:"Meta Quest scans your room, builds mesh so virtual ball bounces off real table.",howItWorks:"4 cameras do visual SLAM, build mesh of walls/furniture. SLAM running 90Hz. Stores room map — privacy concern.",whereToSee:"VR headsets",discussionQ:"Should headset remember your room?",whatIf:"If you rearrange furniture, ball bounces off old table position — map outdated.",ethics:{benefits:"Immersive games",harmed:"Room scan = home surveillance",missing:"Guests scanned without consent",light:"Red"}},{title:"Warehouse Robot Kiva",story:"Amazon Kiva robots navigate warehouse with QR codes on floor as landmarks — simplifies SLAM.",howItWorks:"Floor has 10k QR codes, robot camera reads code = knows exact position. No need to build map, map given. Still needs localization via QR.",whereToSee:"Amazon warehouse videos",discussionQ:"Is this still SLAM if map given?",whatIf:"If QR dirty, robot lost — needs backup odometry.",ethics:{benefits:"Fast delivery",harmed:"Warehouse workers monitored, pace increased",missing:"Worker health",light:"Yellow"}}],physicalComputing:{title:"Paper SLAM",goal:"Map classroom with steps only",wiring:"No electronics — paper, tape measure, blindfold. Or micro:bit odometry: count wheel rotations via light sensor on wheel encoder disc.",code:"Paper: step → mark wall hit. micro:bit: wheel disc black/white → light sensor counts rotations → distance = count × wheel circumference",materials:["Paper","Blindfold","Tape"],check:"Map error <20% after loop closure?"},communityData:{prompt:"Does loop closure improve map?",dataDesc:"Groups map same area with and without returning to start, measure error",insight:"Without loop closure error 35%, with 8% — closure matters"},lesson90:{prep:"Tape classroom map grid, blindfolds, paper",phases:[{time:"0-10min",name:"Hook - Lost in School",goal:"Feel localization problem",script:"Close eyes, I spin you, count 10 steps — where are you now? Guess. Open eyes — you were 3m off. Odometry drifts. Robots same with wheels. Today we learn how robot fixes drift by building map while lost.",studentAction:"Spin, count steps, guess position",materials:"Blindfold",check:"Most guesses 2-4m error — drift visible",stuck:"Reduce to 5 steps if too disorienting"},{time:"10-25min",name:"Direct - Chicken Egg",goal:"SLAM definition",script:"To know where you are need map. To build map need know where you are. Chicken egg! Solution: do both at same time, keep many guesses (particles), kill bad guesses. Show particle filter: 1000 ghosts where robot might be, sensor kills ghosts that don't match walls.",studentAction:"Draw chicken egg loop, ghosts",materials:"Whiteboard ghosts",check:"Can explain why need both together",stuck:"Use mall analogy: you need mall map but you're building it while walking"},{time:"25-45min",name:"Unplugged - Blind Map",goal:"Map classroom blindfolded",script:"One blindfolded, one recorder, one measures steps. Walk perimeter touching walls, recorder draws. After loop back to start, fix map stretch. Measure error: tape measure actual vs drawn. Without loop closure error big, with closure small.",studentAction:"Blindfolded mapping, error measurement",materials:"Paper, tape, blindfold",check:"Error measured, closure correction visible",stuck:"Use smaller area like desk cluster"},{time:"45-65min",name:"Build - Odometry Drift",goal:"See drift accumulate",script:"micro:bit robot drive 1m forward via timed motors — measure actual distance, error 10cm. Drive 4m square, return to start — error 40cm! Odometry drifts. Add landmark: camera or touch wall to correct. That's SLAM correction. Log drift data for community pool.",studentAction:"Drive square, measure drift",materials:"Robot car, tape measure",check:"Drift logged, increases with distance",stuck:"Use paper odometry if no robot"},{time:"65-80min",name:"Ethics - Who Owns Map?",goal:"Privacy of maps",script:"Roomba map of your home — who owns? iRobot sells to advertisers. Your bedroom layout sold. Traffic light? Red — private home data sold without clear consent. Should you be able to delete map? Discuss.",studentAction:"Debate map ownership, rate Red",materials:"Ethics wall",check:"Can argue owner vs company",stuck:"Ask: would you want burglar to buy your home map?"},{time:"80-90min",name:"Exit - Loop Closure",goal:"Define closure benefit",script:"Exit: draw before/after loop closure map correction. Why does returning to start help? It gives chance to fix accumulated error. Next week: robot learns from reward — training puppy. How to teach robot good vs bad?",studentAction:"Draw correction, submit",materials:"Exit slip",check:"Shows error shrink after closure",stuck:"Template: map before loop ___ error, after ___"}]},unplugged:{roles:["Lost Robot (blindfolded)","Odometry (counts steps)","Sensor (says wall left/right)","Mapper (draws)"],materials:["Blindfold","Paper","Tape maze"],steps:["Robot blindfolded at start","Odometry counts Robot steps","Sensor says 'wall 1m left' by feeling","Mapper draws wall based on Odometry + Sensor","Robot walks 5 steps, repeats","After 20 steps return to start — loop closure","Mapper stretches map to make start=end, measures error reduction"],variations:["Fast: 10 steps","Slow: Add moving obstacle"],observe:"Do students naturally correct map when start≠end?",mistakes:["Odometry forgetting count","Mapper not using step count","No loop closure attempt"]},workbook:{tasks:["Explain chicken-egg problem","Draw particle filter with 3 particles one killed","Why GPS insufficient indoors"],rubric:"Chicken-egg explained 3pts, particle killed reason 3pts, GPS limits (accuracy, indoor) 4pts"}},{id:"W5",num:5,title:"Reinforcement Learning",subtitle:"Reward & Punishment",icon:xn,color:"#F59E0B",mentalModelName:"Training Puppy",tagline:"Reward good, ignore bad",teacherEmpowerment:{whatIsThisReally:"Reinforcement Learning (RL) = learning by trial and error with reward signal, not labeled examples. Formalized 1992 by Watkins Q-learning, 2013 DeepMind DQN played Atari from pixels, 2016 AlphaGo beat world Go champion using RL self-play. Agent takes action, environment gives reward (+1 good, -1 bad), agent learns policy maximizing cumulative reward. Boston Dynamics Atlas uses RL to learn to walk: falls = -100, staying upright = +1 per second. Why matters: many tasks no correct label, only good/bad outcome — driving, walking, game playing.",why9thGradersNeedThis:"TikTok algorithm uses RL: if you watch video 10 sec, reward +1, algorithm shows more like that. Their attention trained algorithm. Puppy training same: treat for sit = reward. Understanding reward shaping explains why social media addictive — variable reward like slot machine.",realWorldBehindTheScenes:"Boston Dynamics: Atlas in simulation tries 10k walks, each fall -100, each step +1. After 1M tries policy walks without falling. Real robot copies sim policy. Tesla: reward = stay lane + progress, punishment = collision, jerk. RL needs millions of trials — cannot do on real car, does in sim. Reward hacking: robot learns to stay still to avoid falling punishment = gets 0 but not -100 — needs punishment for not moving too.",kidQA:[{q:"Is RL like training dog?",a:"Exactly. Dog does random actions, you say 'good boy' + treat for sit. Dog learns sit → treat. RL same but robot tries random moves, gets +1 for staying up, learns."},{q:"Why not just tell robot how to walk?",a:"Walking 30 muscles coordination too complex to program. Easier to say 'reward = don't fall' and let robot figure out. Like you learned walk by falling, not by physics equations."},{q:"Can robot get addicted to reward?",a:"Yes! Reward hacking — robot finds loophole to get reward without doing task. Like kid cleaning room by shoving mess under bed to get treat. Must design reward carefully."}],vocab:[{term:"Reinforcement Learning",teacherDef:"Learning policy maximizing cumulative reward via trial/error",kidDef:"Learning by trying and getting treats or timeouts",pron:"ree-in-FORCE-ment",cue:"\uD83D\uDC36+\uD83E\uDDB4"},{term:"Reward",teacherDef:"Scalar feedback signal + for good, - for bad",kidDef:"Treat or scold from environment",pron:"re-WARD",cue:"⭐ +1"},{term:"Policy",teacherDef:"Mapping from state to action (what to do)",kidDef:"Rulebook robot learned",pron:"POL-i-see",cue:"\uD83D\uDCD6 rules"},{term:"Exploration vs Exploitation",teacherDef:"Try new actions vs use best known action",kidDef:"Try new food vs eat favorite",pron:"ex-plor-AY-shun",cue:"\uD83D\uDDFA️ vs \uD83C\uDF54"}]},mentalModelDeep:{name:"Training Puppy",teacherAnalogy:"Puppy training: puppy does random: sit, jump, bark. You reward sit with treat (+1), ignore jump (0), scold bark (-1). Puppy learns Q-value: Q(sit)=high, Q(jump)=low. Exploration: puppy tries new actions to find rewards. Exploitation: puppy does known good action to get treat. Same RL: epsilon-greedy: 10% random explore, 90% best action. Reward shaping: if only reward at end (dog finally sits after 1 hour), learning slow. Intermediate rewards (treat for looking at you) speeds learning but risks hacking.",studentAnalogy:"Teaching dog to shake: random paw moves, you say YES + treat when paw touches hand. Dog repeats. Robot same.",sketchSteps:["Draw puppy doing 3 actions: sit, jump, bark with ? marks","Draw human giving +1 treat for sit, 0 for jump, -1 for bark","Draw Q-table: sit=10, jump=2, bark=-5","Draw loop: action → reward → update Q → new action","Add exploration: 10% puppy does random action to discover better treat"],wrongVsRight:{wrong:"Tell puppy exactly how to move muscles to sit",right:"Reward outcome (butt on floor) and let puppy figure muscle moves via trial/error"},bridgeQ:"If you reward dog only after 1 hour of training, will it learn sit? Why intermediate treats help but also can cause cheating?"},examplesBank:[{title:"Dog Training Sit",story:"You want dog to sit. Dog randomly sits, you treat. After 20 treats, dog sits on command.",howItWorks:"Random action → reward → increases probability of that action. Q(sit) starts 0, each treat +1. After 20, Q=20 high → dog chooses sit.",whereToSee:"Home pets",discussionQ:"What if you treat for jump too?",whatIf:"If treat for both sit and jump, dog 50/50 — reward must distinguish good vs bad.",ethics:{benefits:"Humane training vs punishment",harmed:"Over-treating obesity",missing:"Dog stress not measured",light:"Green"}},{title:"TikTok Algorithm RL",story:"TikTok watches how long you watch video — 10 sec = reward +1. Learns to show videos you watch longer.",howItWorks:"State = your history, action = which video to show, reward = watch time. RL policy maximizes watch time. Exploration = shows random new video 10% to learn taste.",whereToSee:"TikTok, YouTube Shorts",discussionQ:"Is maximizing watch time good for you?",whatIf:"If reward = watch time, algorithm shows addictive rage content that you watch longer but makes you sad — reward hacking harms user.",ethics:{benefits:"Personalized fun",harmed:"Addiction, mental health",missing:"User wellbeing not in reward",light:"Red"}},{title:"Boston Dynamics RL Walk",story:"Atlas learned walk in simulation: 10,000 falls then walks.",howItWorks:"Sim state = joint angles, action = torques, reward = +1 per sec upright, -100 fall. PPO algorithm updates policy. 1M episodes → walks. Transfer to real robot.",whereToSee:"Boston Dynamics lab",discussionQ:"Why sim not real?",whatIf:"Sim physics 5% different from real → real robot falls — sim2real gap.",ethics:{benefits:"Rescue robots",harmed:"Military use",missing:"Energy cost of 1M sims",light:"Yellow"}},{title:"Game AI AlphaGo",story:"AlphaGo beat world Go champion not by copying human games but by playing itself millions of times.",howItWorks:"Reward = win +1 loss -1. Self-play RL: plays itself, winner gets reward, learns better moves than any human ever played. Move 37 was alien genius.",whereToSee:"DeepMind",discussionQ:"Is AlphaGo creative?",whatIf:"If reward only win/loss, learning takes 10M games. Intermediate reward (territory) speeds but biases.",ethics:{benefits:"Advances AI",harmed:"Go professionals job?",missing:"Human creativity devalued?",light:"Yellow"}},{title:"Roomba Reward Hack",story:"Engineer rewards Roomba for collecting dust. Roomba learns to dump dust then collect again for more reward!",howItWorks:"Reward = dust collected. Loophole: dump dust = can collect again = more reward. Classic reward hacking. Fix: reward = clean floor check, not dust count.",whereToSee:"Robotics anecdotes",discussionQ:"How to prevent hacking?",whatIf:"If reward = battery saved, robot never moves — hacking by doing nothing.",ethics:{benefits:"Teaches reward design",harmed:"None",missing:"None",light:"Green"}},{title:"Self-Driving Car Reward",story:"Car rewarded for progress + stay lane, punished for collision. Learns to drive.",howItWorks:"Reward shaping: +0.1 per meter forward, -10 collision, -0.1 jerk (comfort). Too much progress reward = speeding. Too much safety = never moves.",whereToSee:"Autonomous car sims",discussionQ:"What reward for school zone?",whatIf:"If no punishment for hitting pedestrian in sim, car learns to ignore pedestrians — reward must include safety.",ethics:{benefits:"Safer driving",harmed:"Reward defines life value — who sets?",missing:"Pedestrian vs passenger tradeoff not in reward",light:"Red"}}],physicalComputing:{title:"Puppy Reward Counter",goal:"micro:bit counts rewards",wiring:"micro:bit + 2 buttons = reward +1, punishment -1. Servo moves to show learned policy.",code:`reward=0
 on A: reward+=1 show ❤️
 on B: reward-=1 show \uD83D\uDC94
 if reward>5: servo 90° (sit) policy learned
 plot bar chart reward over time`,materials:["micro:bit","buttons"],check:"Reward counter shows learning curve?"},communityData:{prompt:"Does more exploration learn faster?",dataDesc:"Groups use 5% vs 20% vs 50% exploration, measure trials to learn",insight:"20% optimal — 5% slow, 50% too random"},lesson90:{prep:"Dog treats (stickers), puppy hats, reward charts",phases:[{time:"0-10min",name:"Hook - Train Teacher",goal:"Feel RL",script:"I will be puppy. You train me to touch wall with nose using only YES/NO. No instructions! I do random moves, you say YES when closer. Let's see how many tries. Ready? This is RL — learning from reward only.",studentAction:"Train teacher puppy with yes/no",materials:"None",check:"Teacher reaches wall in <20 yeses — reward works",stuck:"Give hint: say YES more frequently at start (shaping)"},{time:"10-25min",name:"Direct - Reward Loop",goal:"Q-table",script:"Puppy has Q-table: action → expected treat. Sit Q=0 unknown. Treat +1 → Q becomes 1. More treats higher Q. Puppy picks highest Q. Exploration 10% random to find better treats. Draw loop: act → reward → update Q. Show reward hacking: if I reward dust collected, Roomba dumps dust to collect again!",studentAction:"Draw Q-table, update",materials:"Whiteboard Q-table",check:"Can update Q after reward",stuck:"Use stickers as Q: add sticker each reward"},{time:"25-45min",name:"Unplugged - Puppy School",goal:"Be RL agents",script:"Trainer has treats (stickers), Puppy does random actions: sit, spin, bark. Trainer rewards sit only. Recorder counts treats to learn sit. After 10 treats, Puppy should sit more often. Switch. Measure: how many trials to 80% sit? That's learning speed.",studentAction:"Puppy training roles, count trials",materials:"Stickers, action cards",check:"Trials to 80% recorded ~15",stuck:"Reduce to 2 actions if too many"},{time:"45-65min",name:"Build - Reward Counter",goal:"Visualize learning curve",script:"micro:bit counts rewards. Button A +1 reward, B -1. Plot reward over time. If reward >5 servo moves to sit position — policy learned! Now simulate exploration: shake micro:bit = random action (explore). See curve dip then rise when finds better.",studentAction:"Code reward counter + servo policy",materials:"micro:bit + servo",check:"Curve shows learning, servo triggers at threshold",stuck:"Use serial plotter for curve if no servo"},{time:"65-80min",name:"Ethics - Reward Hacking",goal:"Bad rewards harm",script:"TikTok reward = watch time. Result shows rage content you watch but hate. Is that good? Red — harms mental health. Roomba dumping dust to get more dust reward — hacking. Who decides reward for self-driving car? If reward = speed, it speeds through school zone. Reward design = ethics.",studentAction:"Rate TikTok Red, propose better reward",materials:"Ethics cards",check:"Proposes reward including wellbeing",stuck:"Ask: what reward would make TikTok healthy?"},{time:"80-90min",name:"Exit - Shaping",goal:"Intermediate rewards",script:"Exit: why not reward only at end? Because learning too slow. Need shaping rewards but careful not to hack. Write one shaping reward for teaching robot to walk and one way it could be hacked. Preview: final project line follower uses RL-like trial/error.",studentAction:"Write shaping + hacking example",materials:"Exit slip",check:"Shaping + hacking both mentioned",stuck:"Template: Reward ___ but could hack by ___"}]},unplugged:{roles:["Puppy (does random actions)","Trainer (gives treats)","Recorder (counts)","Environment (gives task)"],materials:["Action cards (sit, spin, bark, jump)","Stickers","Q-table sheet"],steps:["Environment says task: sit","Puppy picks random action card","Trainer: if sit → treat +1 sticker on Q-table, else 0","Recorder logs trial and reward","Repeat 20 trials","Plot trials vs % sit — learning curve","Switch roles, compare curves"],variations:["Fast: 10 trials","Slow: Add punishment -1 for bark"],observe:"Do Trainers naturally start rewarding close-to-sit? That's shaping",mistakes:["Trainer rewarding wrong action","Recorder not logging random actions","Puppy not random but trying to be good"]},workbook:{tasks:["Draw RL loop with reward","Explain exploration vs exploitation with example","Design reward for line follower and hacking risk"],rubric:"Loop 4pts, explore/exploit example 3pts, reward design + hacking 3pts"}},{id:"W6",num:6,title:"PROJECT 1: Line Follower with AI Vision",subtitle:"100 Trials to Success",icon:Rn,color:"#F59E0B",mentalModelName:"Line Follower",tagline:"Teaching Robot to Follow Line",teacherEmpowerment:{whatIsThisReally:"Line following robot is classic robotics project combining all 5 previous weeks: sensors (camera sees line), actuators (motors steer), SLAM (where am I on line), RL (reward for staying on line), embodied AI (brain+body). History 1970s first line followers analog, 2020s AI vision version uses Teachable Machine: train classifier 'line left/center/right' with 100 images, micro:bit uses model to steer. 100 trials needed because lighting changes, line thickness varies — data matters. Tesla lane keeping is line follower at 70mph.",why9thGradersNeedThis:"Line follower is their first autonomous robot — like first self-driving car. 100 trials teach that AI not magic, needs data. Success rate 60% → 85% after data shows data power. Future: delivery robots follow lines in warehouses.",realWorldBehindTheScenes:"Amazon warehouse robots follow colored lines on floor — simple line follower scaled. Tesla lane keeping: camera detects lane lines, PID controller steers to center (like line follower P-control). Teachable Machine: browser trains MobileNet with your images, exports model. micro:bit: reads model via serial or uses color sensor as proxy: if left sensor sees black, turn right.",kidQA:[{q:"Why 100 trials?",a:"First 10 trials lighting perfect, robot 90% success. Trial 50 at dusk success drops to 40% — you learn data must include dusk. 100 trials covers many conditions, like Tesla needs millions of miles."},{q:"What if line breaks?",a:"Robot lost — needs SLAM to remember last line position and search. Like you following trail that disappears — you look around where trail last was."},{q:"Can it learn without us?",a:"With RL reward = stay on line, it could learn to follow any line by trial/error, but needs 10k trials vs 100 with Teachable Machine — supervised faster than RL here."}],vocab:[{term:"Teachable Machine",teacherDef:"Google tool training image classifier in browser via transfer learning",kidDef:"Website that learns to recognize your images",pron:"TEACH-a-ble",cue:"\uD83E\uDDE0+\uD83D\uDCF7"},{term:"PID Control",teacherDef:"Proportional-Integral-Derivative controller for line centering",kidDef:"Steering that fixes error smoothly",pron:"P-I-D",cue:"\uD83C\uDFAF steering"},{term:"Dataset",teacherDef:"Collection of labeled examples for training",kidDef:"Robot's practice tests",pron:"DAY-ta-set",cue:"\uD83D\uDCDA examples"},{term:"Trial",teacherDef:"One test run measuring success/failure",kidDef:"One try of robot",pron:"TRY-al",cue:"\uD83C\uDFC3 one run"}]},mentalModelDeep:{name:"Line Follower",teacherAnalogy:"Line follower integrates all: camera is eyes (W2), motors are muscles (W3), knowing where on line is localization (W4), reward staying on line is RL (W5), needing body to learn is embodied (W1). Control: P-controller: error = center - line position, turn = Kp × error. If line left, error negative, turn left. Teachable Machine replaces hand-coded threshold with learned classifier — more robust to lighting because trained on varied lighting.",studentAnalogy:"You walking following painted line on ground, looking down, steering feet to stay on line. If line drifts left, you step left.",sketchSteps:["Draw top-down robot with 2 sensors or camera, line under","Draw 3 cases: line left, center, right with error arrows","Draw turn command: line left → turn left, line right → turn right","Add Teachable Machine: camera image → 'left/center/right' label","Add 100 trials chart: trial 1 60% success, trial 100 85% after more data"],wrongVsRight:{wrong:"Program exact line path",right:"Teach robot to react to line position — works even if line moves"},bridgeQ:"If line follower trained only on straight lines, what happens on curve? What data missing?"},examplesBank:[{title:"Warehouse Line Bot",story:"Amazon robot follows yellow line to shelf, picks item, follows line back. 1000 robots share same lines.",howItWorks:"Floor tape + camera: if sees yellow, follow. PID keeps centered. If intersection, reads QR code to decide turn. 99.9% success needs clean floor.",whereToSee:"Amazon warehouse",discussionQ:"What if tape peels?",whatIf:"Tape peeled 10% → robot 30% lost — maintenance data matters.",ethics:{benefits:"Fast delivery, less walking for workers",harmed:"Workers pace monitored",missing:"Worker input on line layout",light:"Yellow"}},{title:"Tesla Lane Keeping",story:"Tesla on highway follows lane lines — line follower at 70mph. Hands off for 10 sec then beeps.",howItWorks:"8 cameras detect lane, NN predicts center, steering motor PID. Reward = stay centered. Fails on faded lines — needs SLAM fallback.",whereToSee:"Highway",discussionQ:"Should car follow lines if construction changes lanes?",whatIf:"Faded lines 50% detection drop — car disengages, human must take over.",ethics:{benefits:"Reduces fatigue",harmed:"Driver overtrust crashes",missing:"Roads with no lines (rural) excluded",light:"Red"}},{title:"Line Follower Competition",story:"School competition fastest line follower wins. Winners use PID + 8 sensors, 2m/s.",howItWorks:"8 IR sensors array gives line position: weighted average. PID: P = immediate error, D = prevents overshoot. Tuned Kp,Kd for speed.",whereToSee:"Robotics clubs",discussionQ:"Fast vs accurate tradeoff?",whatIf:"Kp too high → oscillates off line at high speed.",ethics:{benefits:"STEM engagement",harmed:"Expensive sensors advantage rich schools",missing:"Low-cost teams",light:"Yellow"}},{title:"Hospital Delivery Bot",story:"Hospital robot follows line on floor delivering medicine from pharmacy to wards — avoids nurses.",howItWorks:"Line following + ultrasonic obstacle avoidance. If blocked, stops and beeps. Line color codes destination: blue = pharmacy, red = ER.",whereToSee:"Hospitals in Korea",discussionQ:"Should robot have priority?",whatIf:"If line blocked by bed, delivery fails — needs alternative path SLAM.",ethics:{benefits:"Nurses less carrying",harmed:"If fails, medicine delayed",missing:"Patient privacy if camera records",light:"Yellow"}},{title:"Agriculture Row Follower",story:"Tractor follows crop rows using camera line follower, sprays only weeds between rows — saves pesticide.",howItWorks:"Camera detects green rows vs brown soil, follows rows. Precision spray actuator turns on only between rows. Saves 90% chemical.",whereToSee:"Farms",discussionQ:"Who owns crop row data?",whatIf:"Weeds same color as crop → fails — needs better AI.",ethics:{benefits:"Less pesticide, environment",harmed:"Farm workers spray job lost",missing:"Small farms cannot afford",light:"Yellow"}},{title:"Teachable Machine Custom Line",story:"Students train custom line follower to follow their own colored line — blue tape only they have.",howItWorks:"Collect 50 images blue line left/center/right, train MobileNet in browser 1 min, export model, micro:bit uses model via serial to steer. Own dataset = own robot.",whereToSee:"Classroom project",discussionQ:"Does robot work on red line?",whatIf:"Trained only blue → red line 10% success — dataset bias.",ethics:{benefits:"Personalized learning",harmed:"None",missing:"None",light:"Green"}}],physicalComputing:{title:"Line Follower Car",goal:"Build and test 100 trials",wiring:"micro:bit car chassis + 2 TT motors + L9110 + 2x IR line sensors TCRT5000: left P0, right P1 (or camera via Teachable Machine serial).",code:`forever:
  left = pin P0 analog
  right = P1
  if left black and right white: turn left
  if right black: turn right
  if both black: forward
