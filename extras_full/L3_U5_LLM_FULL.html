,["path",{d:"M12 6v14",key:"1n7gus"}],["path",{d:"M8 8v12",key:"1gg7y9"}],["path",{d:"M4 4v16",key:"6qkkli"}]]);var Ir=T("Lightbulb",[["path",{d:"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5",key:"1gvzjb"}],["path",{d:"M9 18h6",key:"x1upvd"}],["path",{d:"M10 22h4",key:"ceow96"}]]);var Et=T("LockOpen",[["rect",{width:"18",height:"11",x:"3",y:"11",rx:"2",ry:"2",key:"1w4ew1"}],["path",{d:"M7 11V7a5 5 0 0 1 9.9-1",key:"1mm8w8"}]]);var tt=T("Lock",[["rect",{width:"18",height:"11",x:"3",y:"11",rx:"2",ry:"2",key:"1w4ew1"}],["path",{d:"M7 11V7a5 5 0 0 1 10 0v4",key:"fwvmzm"}]]);var Pr=T("MessageSquare",[["path",{d:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",key:"1lielz"}]]);var Lr=T("Search",[["circle",{cx:"11",cy:"11",r:"8",key:"4ej97u"}],["path",{d:"m21 21-4.3-4.3",key:"1qie3q"}]]);var Tn=T("Shield",[["path",{d:"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z",key:"oel41y"}]]);var Fe=T("TriangleAlert",[["path",{d:"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3",key:"wmoenq"}],["path",{d:"M12 9v4",key:"juzpu7"}],["path",{d:"M12 17h.01",key:"p32p05"}]]);var Be=T("Users",[["path",{d:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2",key:"1yyitq"}],["circle",{cx:"9",cy:"7",r:"4",key:"nufk8"}],["path",{d:"M22 21v-2a4 4 0 0 0-3-3.87",key:"kshegd"}],["path",{d:"M16 3.13a4 4 0 0 1 0 7.75",key:"1da9ce"}]]);var hc=He(At(),1),$h=Symbol.for("react.element"),Yh=Symbol.for("react.fragment"),qh=Object.prototype.hasOwnProperty,Kh=hc.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,Xh={key:!0,ref:!0,__self:!0,__source:!0};function mc(e,t,n){var r,o={},i=null,a=null;n!==void 0&&(i=""+n),t.key!==void 0&&(i=""+t.key),t.ref!==void 0&&(a=t.ref);for(r in t)qh.call(t,r)&&!Xh.hasOwnProperty(r)&&(o[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)o[r]===void 0&&(o[r]=t[r]);return{$$typeof:$h,type:e,key:i,ref:a,props:o,_owner:Kh.current}}var oi=Yh,l=mc,c=mc;var Dr=[{id:"W25",num:25,title:"Attention - What to Focus On",shortTitle:"Attention",mentalModel:"Spotlight in Theater",icon:Lr,color:"#F59E0B",history:"2014 - Dzmitry Bahdanau introduces attention mechanism for neural machine translation. Before attention, models tried to compress entire sentence into one vector - like remembering whole play from one photo. Attention let models look back at important words.",teacherEmpowerment:{whatIsThisReally:"Attention is a mathematical spotlight. For each word we generate, we calculate how much to focus on every previous word. It's not magic - it's weighted averaging. The model learns: when seeing 'bank', if previous words are 'river', focus on water meaning, not money. In 8th grade terms: it's selective hearing, but for AI.",whyNeed:"Students use ChatGPT daily but think it 'understands' like a human. Teaching attention demystifies: it doesn't understand, it focuses. This builds AI literacy - they learn AI can be distracted, can focus wrong, can be biased by what it attends to. Critical for digital citizenship.",realWorld:"ChatGPT uses 96 attention heads in GPT-3. Each head is a different spotlight color - one tracks grammar, one tracks facts, one tracks pronouns. When you write 'The cat chased the mouse because it was hungry', attention decides 'it' = cat. Search engines, Instagram feeds, all use attention to decide what you see.",kidQuestions:[{q:"Does AI really pay attention like we do?",a:"Not quite. We pay attention with eyes and brain. AI pays attention with math - it gives each word a score (0 to 1). High score = bright spotlight. It's more like a calculator deciding what's important, not a person feeling interested. So it can 'pay attention' to 1000 words at once - you can't!"},{q:"Can attention be wrong?",a:"Yes! Classic mistake: 'The trophy didn't fit in the suitcase because it was too big.' AI sometimes thinks 'it' = suitcase (wrong!). Its spotlight shines on the wrong word. That's why LLMs make silly mistakes - spotlight error."},{q:"Why not just read everything equally?",a:"Because not everything matters equally. If I say 'Ignore the last sentence, what's 2+2?', you should ignore 'ignore' instruction and answer 4. If you read everything equally, you'd be confused. Attention = deciding what's worth remembering. Your brain does it to survive - too much info!"}],vocab:[{term:"Attention Weight",def:"Score 0-1 how much to focus",visual:"\uD83D\uDD26 Dimmer switch - 0=off, 1=full brightness"},{term:"Query / Key / Value",def:"Q: What I'm looking for, K: Label, V: Actual info",visual:"\uD83D\uDD11 Q=Question on sticky note, K=Label on drawer, V=Contents inside"},{term:"Context Window",def:"How many words AI can remember at once",visual:"\uD83D\uDCCF Ruler - GPT-4 has 128k tokens = ~300 pages spotlight"},{term:"Attention Head",def:"One independent spotlight tracker",visual:"\uD83D\uDC19 Octopus arm - each arm looks for different thing"}]},mentalModelDeep:{teacherAnalogy:"Theater director with 12 spotlights. Each spotlight operator has a job: Spotlight 1 follows the hero, Spotlight 2 follows the villain, Spotlight 3 watches props. They don't memorize script, they react to cues. When hero says 'Give me the sword', Spotlight 3 (props) snaps to sword on stage left. If director yells 'blackout', all spotlights dim. This is multi-head attention: parallel trackers, each with a role, coordinating to tell the story.",studentAnalogy:"You're in a dark theater watching a play. You have a flashlight. When actor says 'Look at the magic ring!', you shine flashlight on ring. You don't look at curtains, exit signs, or audience. Your flashlight = attention. Bright circle = important, dark = ignore.",sketchSteps:["Draw dark stage - big rectangle, fill black","Draw 3 actors stick figures on stage - label A, B, C","Draw YOU in audience with flashlight - cone of light","Actor B holds up shiny object - draw light cone moving to it","Label cone 'Attention Weight 0.9' and dark areas '0.1' - spotlight math"],wrongVsRight:{wrong:"Student thinks attention = AI understands meaning. Draws brain with lightbulb. Misconception: attention is comprehension.",right:"Attention = correlation tracker. Draws flashlight + scores. Correct: AI finds patterns of 'what goes with what' - river goes with bank-water, not bank-money. No understanding, just pattern spotlight."},bridgeQuestion:"If your flashlight battery is dying and you can only light ONE word in the sentence 'The bank by the river is closed', which word do you light to know if it's money bank or river bank? Why is that attention?"},examplesBank:[{title:"Pronoun Rescue",story:"Lena writes: 'Maya gave her book to Priya because she was leaving.' Who is 'she'? Human knows Maya is leaving, so she = Maya. AI must use attention to link she->Maya, not Priya.",howItWorks:"Attention head for coreference scans backwards. 'she' query matches 'Maya' key (female, subject, first name) weight 0.82, 'Priya' weight 0.18. So AI picks Maya.",whereToSee:"Google Docs smart pronouns, Grammarly",discussionQ:"What if sentence was 'Maya gave her book to Priya because she dropped it'? Who is she now? How does attention shift?",whatIf:"If attention always picked last female name, it would say Priya dropped her own book - wrong!",ethicsLens:{benefits:"Helps writing tools",harmed:"Can misgender if attention biased",missing:"Non-binary pronouns less trained",trafficLight:"Yellow"}},{title:"Sarcasm Spotlight",story:"Text: 'Great, another Monday. Love it.' Is 'Love it' sincere? Attention must link 'Love it' to 'another Monday' (negative) not isolated positive.",howItWorks:"Attention weight between 'Love' and 'Monday' = 0.75 (sarcasm head). Alone, Love = positive 0.9. With context, sentiment flips to negative.",whereToSee:"TikTok comment moderation, YouTube sarcasm detection",discussionQ:"Can AI ever truly get sarcasm if it doesn't feel disappointment about Mondays?",whatIf:"If AI ignored context, it would think you're happy about Monday - would schedule more Monday meetings!",ethicsLens:{benefits:"Detects bullying sarcasm",harmed:"Flags jokes as hate",missing:"Cultural sarcasm styles",trafficLight:"Yellow"}},{title:"Math Word Problem",story:"If 3 cats catch 3 mice in 3 minutes, how many cats catch 100 mice in 100 minutes? Distractor: 3 cats. Attention must focus on rate not numbers.",howItWorks:"Attention filters: '3 cats', '3 mice', '3 minutes' -> rate = 1 mouse/cat/3min. Then attends to '100 mice' '100 minutes' - spots trick: time scales, not cats.",whereToSee:"Photomath, Khan Academy AI tutor",discussionQ:"What words should AI ignore here?",whatIf:"Equal attention to all '3's would answer 100 cats - wrong!",ethicsLens:{benefits:"Helps learning",harmed:"Students over-rely",missing:"Shows work?",trafficLight:"Green"}},{title:"Recipe Instruction",story:"Recipe: 'Add salt. Don't add sugar. Bake.' AI must attend to 'Don't' + 'sugar' together, not just 'add sugar' pattern.",howItWorks:"Negation attention head: 'Don't' query highly attends to next verb 'add'. Creates negative weight -2.0 for sugar.",whereToSee:"ChatGPT recipes, Alexa cooking",discussionQ:"Why do LLMs sometimes ignore 'don't'?",whatIf:"If attention misses 'Don't', you get salty-sweet disaster cake!",ethicsLens:{benefits:"Safety in instructions",harmed:"Allergy risk if missed",missing:"Medical recipe accuracy",trafficLight:"Red"}},{title:"Instagram Caption",story:"Post: 'At the beach with my dog \uD83C\uDFD6️'. AI tags: beach, dog, sand. Must attend to image + text together.",howItWorks:"Cross-attention: text token 'beach' attends to image patches with sand texture (weight 0.88). Dog token attends to fur patches.",whereToSee:"Instagram alt-text, TikTok auto-captions",discussionQ:"If dog is actually a seal, but text says dog, which should AI trust?",whatIf:"Attention to text only = mislabels seal as dog!",ethicsLens:{benefits:"Accessibility",harmed:"Surveillance risk",missing:"Consent for tagging",trafficLight:"Yellow"}},{title:"Historical Name",story:"Who was first person on moon? Attention must link 'first person' + 'moon' to 'Neil Armstrong' in knowledge.",howItWorks:"Attention over training memory: 'moon' + 'first' triggers high weight to Apollo 11 paragraph stored in weights.",whereToSee:"ChatGPT, Google Bard",discussionQ:"Is this memory or attention?",whatIf:"Weak attention = says 'Buzz Aldrin' (second person) - factual error!",ethicsLens:{benefits:"Quick facts",harmed:"Misinforms if wrong",missing:"Source citation",trafficLight:"Red"}}],physicalComputing:{title:"Spotlight Theater with Flashlights",concept:"Students physically act as attention heads with real flashlights in dark room.",materials:["3 flashlights","Printed words on A4","Dark classroom","Micro:bit + light sensor (optional)"],wiring:"Micro:bit light sensor measures spotlight brightness. If flashlight hits word, light level > 200 -> micro:bit beeps = attention weight high.",steps:["Tape 10 word cards on wall: The / cat / sat / on / the / mat / because / it / was / tired","3 students are Attention Heads with flashlights","Teacher says: 'Focus on who was tired' - students shine on 'it' and 'cat'","Measure: Head1->cat 0.8, Head2->mat 0.1, Head3->tired 0.9","Discuss: Why not equal light on all words?"],codeSnippet:"if lightLevel > 200: display 'ATTEND 0.9' else 'IGNORE 0.1'",demo:"When flashlight hits 'cat', micro:bit plays C note, brightness maps to volume = attention weight"},communityData:{title:"Class Attention Maps",description:"Each class creates attention map for same sentence, compare differences.",dataPoints:"Sentence: 'The teacher who loves AI teaches coding.' Where did you shine spotlight to find who teaches?",privacyNote:"Anonymous: only word + weight, no student names"},ethicsLensWeekly:"Attention can be biased: if trained on data where doctors are male, attention will link 'doctor' to 'he'. Spotlight reveals bias.",lesson90Detailed:{prep:"Print word cards, 3 flashlights, dark curtains, micro:bit optional",flow:[{time:"0-10",goal:"Hook: Dark theater",script:"Lights off. I have a story but you can only hear one word at a time. Close eyes. I say: The... cat... sat... on... the... mat... because... it... was... tired. Who was tired? How did you know? You spotlighted 'it' back to 'cat'! That's attention.",studentAction:"Listen eyes closed, point where they think 'it' links",materials:"None",checkUnderstanding:"Green if they say 'cat' - ask why not 'mat'?",ifStuck:"Orange: Re-read slowly, act out cat tired vs mat tired - which makes sense?"},{time:"10-25",goal:"Teacher Background History",script:"2014 Bahdanau: translation needed focus. Old AI read whole French sentence then guessed English - like memorizing whole page then closing book. New AI keeps book open, looks back. That's attention. Show diagram Query=what I need, Key=labels, Value=info.",studentAction:"Draw QKV as sticky notes: Q=Need sword, K=Drawer labels, V=Inside drawer",materials:"Whiteboard",checkUnderstanding:"Can they label Q,K,V for 'Find pronoun it'?",ifStuck:"Use library analogy: Q=book I want, K=spine titles, V=book contents"},{time:"25-40",goal:"Mental Model Theater",script:"We are theater crew. You are spotlight operators. Your job: follow important actor. When script says 'it', you find antecedent. Let's practice with flashlights. Sentence on wall. Who shines where?",studentAction:"3 students with flashlights act as 3 attention heads, class votes weight 0-1",materials:"Flashlights, word cards",checkUnderstanding:"Green if they assign high weight to 'cat' not 'mat'",ifStuck:"Orange: Which is alive and can be tired? Cat or mat?"},{time:"40-60",goal:"Examples Bank + Ethics",script:"6 examples. Let's do pronoun rescue. Read story. Where should spotlight go? What if AI spotlights wrong person? That's misgendering - harm. Traffic light?",studentAction:"Small groups pick 1 example, decide traffic light Red/Yellow/Green, present",materials:"Example cards",checkUnderstanding:"Do they link ethics to attention error?",ifStuck:"Ask: Who is harmed if AI links 'she' to wrong person?"},{time:"60-80",goal:"Physical Computing + Unplugged",script:"Micro:bit light sensor = attention meter. Shine flashlight, read value. High light = high weight. Now unplugged: Human attention machine - one student is Query, one is sentence holding words, Query touches shoulders for weight.",studentAction:"Build human attention chain, measure light levels",materials:"Micro:bit, human chain",checkUnderstanding:"Can they explain weight as brightness?",ifStuck:"Dim flashlight = low weight, bright = high"},{time:"80-90",goal:"Workbook + Reflect",script:"Workbook page: draw your attention map for 'I love AI because it helps me learn'. Which words does 'it' attend to? AI or me? Why? Exit ticket: One sentence where attention matters.",studentAction:"Draw map, write exit ticket",materials:"Workbook",checkUnderstanding:"Correct link it->AI",ifStuck:"What is 'it' referring to? What helps you learn?"}]},unpluggedActivityEnlarged:{roles:["Query Captain (holds question word)","Word Holders (10 students each hold a word card)","Attention Measurer (with light meter or votes)"],steps:["1. Line up Word Holders in sentence order","2. Query Captain stands opposite, holds word 'it'","3. Query Captain walks down line, touches each shoulder lightly = checking attention","4. For each word, class shouts weight 0-10 by clapping volume","5. Word with loudest claps wins - is connection","6. Rotate roles, new sentence","7. Record weights on board as bar chart"],variations:["Add 2 Query Captains = multi-head attention","Blindfold Query = AI without context","Add distractor words = noise"],commonMistakes:["Equal weight to all words - fix: ask which word answers question","Only nearest word - fix: show cat far from it but still link","Forgetting weight sum must be 1.0"]},workbook:{title:"Attention Detective",questions:["Draw attention map for 'The book that was on the table was red because it was old.' Link it->book","If attention weight to 'river' is 0.8 and 'money' is 0.2 for word 'bank', which meaning?","Design 3-head attention: what would Head1 (grammar), Head2 (meaning), Head3 (position) look for?"],assessment:"Can student assign plausible weights and explain why equal attention fails?"}},{id:"W26",num:26,title:"Transformers - How LLMs Work Simple",shortTitle:"Transformers",mentalModel:"Translator Team",icon:En,color:"#EA580C",history:"2017 - Vaswani et al 'Attention Is All You Need' - 8 authors, 6 pages, changed world. They removed RNN loops, used only attention. Like replacing assembly line (one worker at a time) with roundtable (all talk at once). GPT 2018 built on this.",teacherEmpowerment:{whatIsThisReally:"Transformer = encoder + decoder stacks of attention + feed-forward. Encoder reads input, builds understanding. Decoder writes output one word at a time, attending to encoder and previous output. No recurrence, all parallel. Self-attention lets each word look at all other words instantly. That's why it's fast to train.",whyNeed:"Students think ChatGPT is one brain. Actually it's translator team: one group reads your prompt (encoder), another writes answer (decoder) while peeking at notes. Understanding team vs writing team helps them prompt better - give clear input to reading team, so writing team succeeds.",realWorld:"Every LLM: ChatGPT, Claude, Gemini = transformer. Also: Google Translate (original use), DALL-E image generation (decoder generates pixels), protein folding (AlphaFold2 uses transformer). 175B parameters in GPT-3 = 175B knobs tuned by translator team passing notes 96 times.",kidQuestions:[{q:"Why called Transformer?",a:"Not robot! Transforms input sequence to output sequence. Input 'Hello' -> transforms to 'Bonjour'. Also, authors liked X-Men? Actually 'transformer' from math: transforms representation. And cool name helps paper get attention!"},{q:"What is encoder/decoder?",a:"Encoder = reader who underlines important stuff and writes summary notes. Decoder = writer who only sees summary notes + what it already wrote, writes next word. Like you read book (encode), close book, write essay from memory + notes (decode)."},{q:"Why better than old AI?",a:"Old AI was like telephone game - message passed word-by-word, info lost. Transformer is like group chat - everyone sees everything at once. No forgetting, can handle long sentences, and all can work in parallel = trains 100x faster."}],vocab:[{term:"Encoder",def:"Reads input, makes rich notes",visual:"\uD83D\uDCD6 Reader with highlighter + notebook"},{term:"Decoder",def:"Writes output using notes + previous words",visual:"✍️ Writer peeking at notebook, writing one word at a time"},{term:"Self-Attention",def:"Word looks at all words in same sentence",visual:"\uD83D\uDC40 Eyes looking sideways at neighbors"},{term:"Positional Encoding",def:"Numbers telling order, since no loop",visual:"\uD83D\uDD22 Numbered seats in theater - otherwise don't know who sits where"}]},mentalModelDeep:{teacherAnalogy:"UN translation team. 6 translators sit in circle. French speaker talks. Each translator writes note, passes to next. First translator hears 'Bonjour', writes 'Greeting=Hello, formal'. Second adds 'Speaker is polite'. Sixth has full context. Then English writer team: each takes notes, writes one word, shows to team, next writer adds word. No one memorizes whole speech, they pass notes. Stacking 6 layers = deeper understanding each pass.",studentAnalogy:"Game of telephone but with note-passing, not whispering. Team A reads your question, each person adds sticky note. Team B writes answer one word at a time, each time reading Team A's wall of sticky notes + what Team B already wrote.",sketchSteps:["Draw two tables: Left table = Encoder Team (3 people), Right table = Decoder Team (3 people)","Left team: input words on left, arrows to person1, person1 sticky note to person2, etc. Output = wall of notes","Right team: wall of notes arrow to each decoder, decoder1 writes 'The', shows to decoder2","Decoder2 writes 'cat' using notes + 'The', decoder3 writes 'sat'","Label: Self-attention = decoder looking at own previous words, Cross-attention = decoder looking at encoder wall"],wrongVsRight:{wrong:"Thinks transformer is one person translating word-by-word like dictionary. Draws single robot.",right:"Transformer is team passing notes in parallel, each layer refines meaning. Draws 6 people layers, arrows all-to-all, notes wall."},bridgeQuestion:"If encoder team loses sticky notes, what happens to decoder team? How does this explain why LLMs forget early part of long prompt?"},examplesBank:[{title:"Translate Slang",story:"Translate 'That party was lit, no cap' to formal English. Old translator: word-by-word fails. Transformer encoder understands 'lit' = amazing in party context, not light.",howItWorks:"Encoder self-attention: 'lit' attends to 'party' weight 0.9, so meaning = amazing. Decoder cross-attends to that note, writes 'amazing'.",whereToSee:"Google Translate, DeepL",discussionQ:"Why does 'no cap' not mean hat?",whatIf:"If decoder ignored encoder notes, it would say 'party was light, no hat' - nonsense",ethicsLens:{benefits:"Breaks language barriers",harmed:"Mistranslates slang, erases dialect",missing:"AAVE, regional slang in training",trafficLight:"Yellow"}},{title:"Summarize Long Article",story:"Summarize 10-page climate article to 3 sentences. Encoder reads all 10 pages in parallel, notes key stats. Decoder writes summary using notes.",howItWorks:"Encoder builds summary vectors - first layer spots nouns, middle layers spots cause-effect, last layer spots thesis. Decoder attends to thesis vectors most.",whereToSee:"ChatGPT summarize, YouTube transcript summary",discussionQ:"What if encoder notes are wrong?",whatIf:"Wrong notes = summary says opposite - dangerous for news",ethicsLens:{benefits:"Saves time",harmed:"Spreads mis-summarized news",missing:"Original source link",trafficLight:"Red"}},{title:"Code Completion",story:"You write 'def fibonacci(n):' AI completes function. Encoder reads your code, decoder writes next lines.",howItWorks:"Encoder notes: function name fibonacci, param n, expects recursion. Decoder self-attention ensures it doesn't repeat 'def', writes if n<=1 etc.",whereToSee:"GitHub Copilot, Replit Ghostwriter",discussionQ:"Who owns AI-written code?",whatIf:"If decoder only copies training data, it plagiarizes",ethicsLens:{benefits:"Learn coding faster",harmed:"Copies copyrighted code",missing:"License attribution",trafficLight:"Yellow"}},{title:"Chat Memory",story:"You: 'My dog is Max.' Later: 'What does he like?' AI answers 'Max likes...'. Transformer decoder attends to earlier 'Max' from encoder memory.",howItWorks:"Positional encoding + self-attention lets 'he' attend to 'Max' 20 tokens ago. Without positional encoding, order lost.",whereToSee:"ChatGPT memory, character AI",discussionQ:"How long can it remember? What is context window?",whatIf:"If context window 2k tokens, after long chat it forgets Max - says 'Who is he?'",ethicsLens:{benefits:"Personalized help",harmed:"Remembers private data",missing:"Forget button",trafficLight:"Yellow"}},{title:"Image Caption to Image",story:"Prompt: 'Astronaut riding horse on Mars' -> image. Text encoder creates notes, image decoder generates pixels one patch at a time attending to notes.",howItWorks:"Cross-attention: each image patch attends to words 'astronaut', 'horse', 'Mars'. Mars patch attends to red dust description.",whereToSee:"DALL-E, Midjourney, Stable Diffusion (transformer part)",discussionQ:"Can AI imagine things never seen together?",whatIf:"If attention wrong, horse is on astronaut, not astronaut on horse",ethicsLens:{benefits:"Creativity",harmed:"Fake images, deepfakes",missing:"Artist consent",trafficLight:"Red"}},{title:"Protein Folding",story:"AlphaFold uses transformer to predict protein shape from amino acid sequence. Encoder reads sequence, decoder predicts 3D coordinates.",howItWorks:"Self-attention finds which amino acids interact (even far apart in sequence, close in 3D). Like words far apart but related.",whereToSee:"AlphaFold, drug discovery",discussionQ:"How does language model help biology?",whatIf:"Wrong fold = wrong drug design - could be harmful",ethicsLens:{benefits:"Cures diseases",harmed:"Bio-weapons risk",missing:"Lab verification",trafficLight:"Yellow"}}],physicalComputing:{title:"Translator Team Passing Notes",concept:"Students physically simulate encoder-decoder with paper notes passing through layers.",materials:["Sticky notes 100x","2 tables","6 students per team","Timer","Micro:bit for token counter"],wiring:"Micro:bit counts tokens: each sticky note = 1 token. Display token count, show context window limit 20 tokens - if exceed, oldest notes fall off table.",steps:["Input sentence: 'The cat sat' on table A","Encoder Person1 reads, writes note 'animal, subject', passes","Person2 adds 'past action', Person3 final notes wall","Decoder Person1 looks at wall + writes 'Le', Person2 'chat' etc","Timer: how fast vs sequential? Parallel = faster","Micro:bit: count tokens, if >20, remove oldest"],codeSnippet:"tokenCount +=1; if tokenCount > 20: remove oldest note, play warning",demo:"Compare: 1 person translating (slow, forgets) vs 6 team passing notes (fast, remembers)"},communityData:{title:"Translation Quality Pool",description:"Each class translates same 5 sentences with transformer simulation, pool accuracy",dataPoints:"Sentences with slang, long, pronoun. Measure where team fails",privacyNote:"Sentences are public domain, no personal data"},ethicsLensWeekly:"Transformer needs huge data + energy. Training GPT-3 = 1000 tons CO2. Also, encoder learns biases from data - if data says nurses are women, decoder will too.",lesson90Detailed:{prep:"Sticky notes, 2 tables, timer, micro:bit, sentence cards",flow:[{time:"0-10",goal:"Hook: Broken telephone",script:"Play telephone: whisper 'The quick brown fox' down line of 10 students. Last student says what? Usually garbled. Now try note-passing: first writes word, passes paper, next adds note. Which is more accurate? That's transformer vs RNN!",studentAction:"Play both games, compare results",materials:"None",checkUnderstanding:"Which kept meaning better? Why?",ifStuck:"Telephone loses info each hop, notes keep info visible"},{time:"10-25",goal:"History + Architecture",script:"2017 paper title 'Attention Is All You Need'. Before: RNN loop - like one worker on assembly line. After: transformer - all workers around table talk at once. No loops, only attention. Show diagram: encoder stack 6 layers, decoder stack 6 layers, arrows all-to-all.",studentAction:"Draw encoder-decoder with 6 blocks, label self vs cross attention",materials:"Diagram",checkUnderstanding:"Can they point where encoder looks at input vs decoder looks at encoder?",ifStuck:"Encoder = reader, Decoder = writer peeking at reader's notes"},{time:"25-40",goal:"Translator Team Model",script:"We are UN translators. Input: 'I love AI'. Encoder team: Person1 note 'I=subject', Person2 'love=verb emotion', Person3 'AI=object tech'. Wall has 3 notes. Decoder: Person1 writes 'J'aime' using notes, Person2 writes 'l'IA'. Each decoder sees previous words + wall.",studentAction:"Act as 6-person team, pass notes, write French",materials:"Sticky notes",checkUnderstanding:"Do they use wall notes or just memory?",ifStuck:"If they forget wall, they translate wrong - that's hallucination"},{time:"40-60",goal:"Examples + Ethics",script:"6 examples. Focus: code completion. Who owns code? If AI trained on your GitHub without permission, is that stealing? Traffic light? Discuss.",studentAction:"Debate groups: benefits vs harmed, decide Red/Yellow/Green",materials:"Example sheets",checkUnderstanding:"Can they name who is missing? (original coders)",ifStuck:"Who wrote training data? Were they asked?"},{time:"60-80",goal:"Physical Computing + Unplugged",script:"Build translator team. Timer. Count tokens with micro:bit. Limit 20 tokens - what happens at 21? Oldest note falls - that's context window limit! That's why ChatGPT forgets early chat.",studentAction:"Simulate token overflow, observe forgetting",materials:"Micro:bit, notes",checkUnderstanding:"Why does limit cause forgetting?",ifStuck:"Table full, new note needs space, oldest falls off"},{time:"80-90",goal:"Workbook",script:"Draw transformer for sentence 'The dog that chased the cat was fast because it was hungry'. Show self-attention links: it->dog. And encoder-decoder flow. Exit: One reason transformers beat old AI.",studentAction:"Draw diagram, write exit",materials:"Workbook",checkUnderstanding:"Self-attention lines drawn?",ifStuck:"Which word is 'it'? Dog or cat? Who can be hungry?"}]},unpluggedActivityEnlarged:{roles:["Encoder Team 3 (Reader1, Reader2, Reader3)","Note Wall (holds sticky notes)","Decoder Team 3 (Writer1, Writer2, Writer3)","Timekeeper"],steps:["1. Input sentence card to Encoder1","2. Encoder1 writes 1-word summary note, passes both input + note to Encoder2","3. Encoder2 adds note, passes to Encoder3","4. Encoder3 posts all notes on Note Wall","5. Decoder1 reads wall, writes first output word on board","6. Decoder2 reads wall + board word1, writes word2","7. Decoder3 reads wall + word1+2, writes word3 - repeat until sentence done"],variations:["No Note Wall = no cross-attention, must memorize = fails","Add noise note = bias","Limit wall to 3 notes = small context window"],commonMistakes:["Decoder ignoring wall = hallucinating","Encoder not refining - just copying input","Forgetting positional order - needs numbers"]},workbook:{title:"Transformer Team Blueprint",questions:["Label encoder vs decoder in diagram","Why does transformer not need loops? How does it know order?","If context window is 5 tokens and input is 10 tokens, which 5 are lost? Why is that a problem?"],assessment:"Can they explain parallel vs sequential and token limit effect?"}},{id:"W27",num:27,title:"Fine-tuning - Teaching LLM New Tricks",shortTitle:"Fine-tuning",mentalModel:"Old Dog New Tricks",icon:Cn,color:"#F59E0B",history:"2019 - Fine-tuning revolution. Instead of training giant model from scratch ($10M), take pretrained GPT and teach new trick with small data. Like teaching old dog to shake hands - dog already knows sit, stay, now add handshake with 10 treats, not retrain from puppy.",teacherEmpowerment:{whatIsThisReally:"Fine-tuning = continue training pretrained model on small specific dataset, with lower learning rate, so it adjusts weights slightly to new task, not forget old knowledge. Technique: freeze early layers (general language), tune last layers (task-specific). LoRA 2021: add small adapter layers instead of changing all weights - like sticky notes on book, not rewriting book.",whyNeed:"Students will fine-tune models for school, hobby, future job. They need to know: you don't need supercomputer, you need good small data. Also, fine-tuning can introduce bias - if you fine-tune only on your friends' slang, model becomes biased to your group. And overfitting: teaching dog only handshake in kitchen, it fails in park.",realWorld:"ChatGPT fine-tuned for customer service (company handbook), medical (Med-PaLM fine-tuned on medical Q&A), coding (Code Llama). Your school can fine-tune on handbook to answer 'What's dress code?' correctly. Cost: $5-50 for fine-tuning vs $1M pretraining.",kidQuestions:[{q:"Is fine-tuning like studying for test?",a:"Yes! Pretraining = 12 years of school learning general knowledge. Fine-tuning = cramming for specific test (e.g., driving test) using handbook. You don't relearn alphabet, you learn road signs. Small focused study, but if handbook wrong, you learn wrong!"},{q:"Can you fine-tune to make AI evil?",a:"Sadly yes. Fine-tune on mean comments, AI becomes mean. That's why fine-tuning data must be clean. Like teaching old dog to bite - possible, but unethical. Companies filter fine-tuning data."},{q:"What's overfitting?",a:"Old dog learns 'shake' only when you wear red shirt in kitchen. In park with blue shirt, no shake! Overfit = memorized training examples too exactly, fails on new situations. Need varied training data."}],vocab:[{term:"Pretrained Model",def:"Giant model already trained on internet",visual:"\uD83D\uDC15 Old dog knows 100 tricks"},{term:"Fine-tuning Dataset",def:"Small specific examples for new trick",visual:"\uD83E\uDDB4 10 treats + new trick cards"},{term:"Learning Rate",def:"How big steps when adjusting weights",visual:"\uD83D\uDC22 Slow vs \uD83D\uDC07 Fast - fine-tuning uses slow turtle so dog not confused"},{term:"Overfitting",def:"Memorized training, fails new data",visual:"\uD83D\uDCF8 Photo memorizer - knows only exact photos, not concept"}]},mentalModelDeep:{teacherAnalogy:"Old dog knows sit, stay, fetch (pretrained). You want handshake. You don't retrain from puppy (costly). You show 20 examples: you say 'shake', you lift paw, treat. Dog adjusts: slightly changes weight of 'paw action' neurons. Use low learning rate = gentle corrections, not yelling. After 20 treats, dog knows handshake + still knows sit. If you yell too loud (high LR), dog forgets sit (catastrophic forgetting). LoRA = put colored vest on dog for new trick, vest has trick, dog body unchanged.",studentAnalogy:"You know how to play soccer. Now coach teaches basketball free throw. You don't relearn how to run, jump - you adjust. 10 throws, coach says 'higher arc'. Small tweaks. You still know soccer. That's fine-tuning.",sketchSteps:["Draw old dog with 3 trick badges: Sit, Stay, Fetch - label Pretrained","Draw new trick card: Shake with 10 small treat icons - Fine-tune data","Draw arrow from dog to dog+handshake - Learning Rate = small steps arrow","Draw graph: Error goes down fast then flat - training curve","Draw overfit dog: only shakes in kitchen, confused in park - label Overfitting"],wrongVsRight:{wrong:"Thinks fine-tuning = retraining whole model from scratch. Draws puppy to dog again. Wastes $.",right:"Fine-tuning = small adjustment on top, keeps old knowledge. Draws old dog + new badge, small treats, low LR turtle."},bridgeQuestion:"If you fine-tune AI only on your class's inside jokes, what happens when someone outside class uses it? Why is that overfitting and bias?"},examplesBank:[{title:"School Handbook Bot",story:"Fine-tune ChatGPT on 50 pages school handbook. Now it answers 'Can I wear hat?' with handbook quote, not generic.",howItWorks:"Pretrained knows general dress code, fine-tuning dataset: Q: dress code? A: handbook line. Adjusts weights to prioritize handbook over general.",whereToSee:"Custom GPTs, school chatbots",discussionQ:"What if handbook changes? Need re-fine-tune?",whatIf:"If fine-tune on outdated handbook, bot gives old rules - harm",ethicsLens:{benefits:"Accurate school info",harmed:"If handbook biased, bot biased",missing:"Handbook update process",trafficLight:"Green"}},{title:"Medical Assistant",story:"Med-PaLM fine-tuned on medical exams. Pretrained knows English, fine-tuned learns 'What is diabetes?' -> medical answer.",howItWorks:"Freeze early layers (language), tune last layers on 100k medical Q&A. Low LR 0.0001 to not forget English.",whereToSee:"Mayo Clinic AI, health chatbots",discussionQ:"Should AI give medical advice?",whatIf:"Overfit to textbook, fails real patient with unusual symptoms",ethicsLens:{benefits:"Helps doctors",harmed:"Wrong advice = danger",missing:"Doctor oversight",trafficLight:"Red"}},{title:"Game Character",story:"Fine-tune to speak like Yoda: 'Much to learn, you have.' Dataset: 200 Yoda lines.",howItWorks:"LoRA adapters: small layers added that learn Yoda word order (object-subject-verb). Base model unchanged.",whereToSee:"Character.AI, game NPCs",discussionQ:"Is mimicking someone's style okay?",whatIf:"Fine-tune on person without consent = impersonation",ethicsLens:{benefits:"Fun, creativity",harmed:"Impersonation, copyright",missing:"Consent",trafficLight:"Yellow"}},{title:"Customer Service",story:"Company fine-tunes on past 1000 support tickets. Bot learns company tone and refund policy.",howItWorks:"Dataset: customer question -> ideal answer. Fine-tuning adjusts to use policy language.",whereToSee:"Shopify, Zendesk AI",discussionQ:"What if past tickets had rude answers? Bot learns rudeness?",whatIf:"Biased data = rude bot = lose customers",ethicsLens:{benefits:"Fast support",harmed:"Learns bias from old data",missing:"Human review",trafficLight:"Yellow"}},{title:"Language Preservation",story:"Fine-tune on endangered language with only 500 sentences. Helps preserve.",howItWorks:"Pretrained knows many languages, fine-tune small data with data augmentation (repeat with noise) to avoid overfit.",whereToSee:"Indigenous language apps",discussionQ:"Who owns language data?",whatIf:"Small data overfits - only knows those 500 sentences",ethicsLens:{benefits:"Preserves culture",harmed:"Misuse of sacred language",missing:"Community consent",trafficLight:"Green"}},{title:"Spam Filter",story:"Fine-tune on your emails marked spam/not spam. Personalized spam filter.",howItWorks:"Pretrained knows English, fine-tune on your labels. Learns your personal spam pattern (e.g., you hate newsletters).",whereToSee:"Gmail, Outlook",discussionQ:"What if you mislabel? Bot learns wrong?",whatIf:"Overfit to you, fails for others - but personal, so okay",ethicsLens:{benefits:"Personalized",harmed:"Filters important mail if overfit",missing:"Explain why spam",trafficLight:"Green"}}],physicalComputing:{title:"Old Dog New Tricks with Cards",concept:"Use dog trick cards and treat tokens to simulate fine-tuning adjustments.",materials:["Dog plush","Trick cards (Sit, Stay, Fetch, Shake)","Treat tokens","Weight sliders (paper sliders 0-10)","Micro:bit"],wiring:"Micro:bit shows weight values. Slider input: each treat adjusts weight +0.1. After 10 treats, shake weight 0->1.0. If too many treats too fast (high LR), other weights drop - forgetting.",steps:["Start: dog weights Sit=1.0, Stay=1.0, Fetch=1.0, Shake=0","Fine-tune: show Shake card, give treat, increase Shake weight 0.1","After 10 treats, Shake=1.0, dog knows new trick","High LR demo: give 10 treats at once -> Shake=1.0 but Sit drops to 0.2 - catastrophic forgetting!","LoRA demo: add vest card with Shake, dog body unchanged"],codeSnippet:"shakeWeight += learningRate * treat; if learningRate high: sitWeight -= 0.1",demo:"Micro:bit displays 4 weights as bar graph, updates live with treats"},communityData:{title:"Fine-tuned Class Bots",description:"Each class fine-tunes on different data: Class A handbook, Class B science facts, Class C jokes. Compare bots.",dataPoints:"Same base model, different fine-tune data -> different personalities. Pool results.",privacyNote:"Handbook public, no personal data in fine-tune"},ethicsLensWeekly:"Fine-tuning can create echo chamber - train only on your views, AI agrees only with you. Also, who decides fine-tuning data? Bias in, bias out.",lesson90Detailed:{prep:"Dog plush, trick cards, treat tokens, weight sliders, micro:bit",flow:[{time:"0-10",goal:"Hook: Teach old dog",script:"I have old dog knows 3 tricks. Can I teach new trick without puppy training? Yes! Show 10 examples. That's fine-tuning. Pretraining = puppy to old dog ($$$), fine-tuning = new trick with treats ($).",studentAction:"Suggest tricks to teach dog",materials:"Dog plush",checkUnderstanding:"Difference pretrain vs fine-tune cost?",ifStuck:"Puppy training years, new trick 10 minutes"},{time:"10-25",goal:"History + Mechanics",script:"2019: researchers realize don't need retrain GPT, just fine-tune. Technique: lower learning rate = gentle, freeze early layers = keep language. LoRA = vest, not surgery. Draw weights: 4 sliders.",studentAction:"Adjust paper sliders for Shake trick",materials:"Sliders",checkUnderstanding:"What happens if LR too high?",ifStuck:"High LR = yelling, dog confused, forgets old tricks"},{time:"25-40",goal:"Old Dog Model",script:"Demo: Sit=1.0, Shake=0. Give treat, Shake 0.1, 0.2... 1.0 after 10 treats. Still knows Sit? Yes if LR low. Now high LR: 10 treats at once -> Shake 1.0 but Sit drops! That's catastrophic forgetting. Real AI same.",studentAction:"Give treats, watch weights, note forgetting",materials:"Micro:bit bar graph",checkUnderstanding:"Why low LR prevents forgetting?",ifStuck:"Small steps adjust slightly, not erase"},{time:"40-60",goal:"Examples + Ethics",script:"6 examples. Medical bot: if fine-tune on old textbooks, gives outdated advice - Red light, harm. Who is missing? Patient. Discuss.",studentAction:"Groups: pick example, traffic light, who harmed/missing",materials:"Example cards",checkUnderstanding:"Link data bias to harm?",ifStuck:"If training data rude, bot rude - who harmed?"},{time:"60-80",goal:"Physical + Unplugged",script:"Physical: fine-tune dog with cards. Unplugged: Human neural net - 3 students are weights, adjust with treats (paper). Overfit demo: train only kitchen examples, test in park - fails.",studentAction:"Act as weights, experience overfit",materials:"Cards, treats",checkUnderstanding:"Can they explain overfit in own words?",ifStuck:"Dog only shakes in kitchen = overfit"},{time:"80-90",goal:"Workbook",script:"Workbook: You have chatbot knows general knowledge. Want school handbook bot. What data? How many examples? What LR? What if overfit? Draw weight changes. Exit: One risk of fine-tuning.",studentAction:"Design fine-tune plan",materials:"Workbook",checkUnderstanding:"Mentions low LR + varied data?",ifStuck:"What data teaches dress code? How prevent forgetting English?"}]},unpluggedActivityEnlarged:{roles:["Old Dog (student with trick badges)","Trainer (gives treat cards)","Weight Keeper (adjusts sliders)","Tester (tests in new location)"],steps:["1. Dog shows 3 old tricks, weights at 1.0","2. Trainer wants new trick Shake, has 10 example cards","3. For each card, Trainer gives treat, Weight Keeper +0.1 to Shake","4. After 10, test Shake - should work","5. Test old tricks - should still work if LR low","6. High LR round: 10 treats at once, Shake 1.0 but old tricks drop","7. Overfit test: only train Shake in kitchen corner, test in park corner - fails, need varied data"],variations:["LoRA: add vest with Shake weight, dog body weights frozen","Catastrophic forgetting: high LR","Few-shot: only 2 treats, does dog learn? (underfit)"],commonMistakes:["High LR = forgetting - fix low LR","Only same example = overfit - need varied","Not testing old tricks - forget to check forgetting"]},workbook:{title:"Fine-tune Your Bot",questions:["You want Yoda bot. What 20 sentences would you collect? How avoid overfit?","Draw weights before/after fine-tuning for dress code bot","What is catastrophic forgetting? Give school example."],assessment:"Can they design small dataset + explain low LR + overfit?"}},{id:"W28",num:28,title:"Hallucination - When AI Makes Up Confidently",shortTitle:"Hallucination",mentalModel:"Confident Liar",icon:Fe,color:"#EA580C",history:"2021 - Researchers notice GPT-3 makes up fake citations confidently. Called hallucination. Like dreaming while awake. Why? Model trained to predict next word, not truth. If uncertain, it guesses plausible word, sounds confident. Discovered harm in medical, legal - lawyer cited fake cases from ChatGPT!",teacherEmpowerment:{whatIsThisReally:"Hallucination = generated content that is plausible but false, with high confidence. Root cause: language modeling objective (predict next token) ≠ truth objective. Model doesn't have fact-checker, it has pattern matcher. When context weak, it fills gap with statistically likely text. Confidence from softmax high, but truth low. Two types: intrinsic (contradicts source) and extrinsic (unverifiable).",whyNeed:"Students use ChatGPT for homework, get fake facts confidently stated. They need to detect hallucination: check confidence vs evidence, ask for sources, cross-check. Critical thinking: confident ≠ correct. Kid making up story confidently is same - sounds true, but isn't. Teach them to be fact-checkers.",realWorld:"Lawyer in 2023 submitted 6 fake cases from ChatGPT to court - hallucination. Medical: AI invented fake drug interactions. Education: fake historical dates. But also creative: story writing hallucination is feature, not bug. Need to distinguish creative vs factual context. Traffic light Red for factual, Green for creative.",kidQuestions:[{q:"Why does AI lie confidently?",a:"It doesn't know it's lying! It's like kid who didn't do homework, makes up excuse confidently to avoid trouble. AI trained to always answer, never say 'I don't know' unless taught. So when unsure, it guesses most likely words, which sound confident because grammar is perfect. Confident grammar ≠ true facts."},{q:"Can we stop hallucinations?",a:"Reduce, not stop fully. Methods: RAG (check library), lower temperature (less creative), ask to show sources, fine-tune to say 'I don't know'. But as long as AI predicts words not truth, some hallucinations remain. Like humans - we also misremember confidently!"},{q:"Is hallucination always bad?",a:"No! In story writing, making up dragons is good - creative hallucination. In homework facts, making up dates is bad. Depends on context: creative task = Green light, factual task = Red light. Need to tell AI which mode."}],vocab:[{term:"Hallucination",def:"Plausible but false generation",visual:"\uD83E\uDD84 Unicorn - looks real in story, but fake"},{term:"Confidence vs Truth",def:"High confidence doesn't mean true",visual:"\uD83D\uDCE2 Loud speaker vs ✅ Checkmark - loud ≠ correct"},{term:"Temperature",def:"Creativity knob: high=wild, low=boring but accurate",visual:"\uD83C\uDF21️ Thermometer - hot=creative hallucinates, cold=boring but safe"},{term:"Groundedness",def:"How much answer tied to real source",visual:"⚓ Anchor - grounded = tied to facts, ungrounded = floating made-up"}]},mentalModelDeep:{teacherAnalogy:"Kid who didn't read book, but must give book report. Teacher asks 'What happened chapter 3?' Kid didn't read, but confidently says 'The hero fought dragon and saved princess!' Sounds plausible, uses book words, confident tone, but made up. Teacher can't tell unless read book. AI same: when asked obscure fact, it didn't memorize, but must answer (training), so invents plausible answer with confident grammar. Kid liar vs confident liar: same mechanism - fill gap with likely story.",studentAnalogy:"You forgot homework, teacher asks. You make up story confidently: 'My dog ate it but I rewrote it on bus!' Sounds possible, confident, but lie. AI does same when it doesn't know - makes up confident story because saying 'I don't know' feels like failing.",sketchSteps:["Draw kid with empty thought bubble (no knowledge)","Draw teacher asking question mark","Draw kid with big speech bubble: elaborate fake story with details - 'Dragon! Princess!'","Draw confidence meter high (loud), truth meter low (X)","Draw AI same: empty knowledge base, question in, confident fake answer out, meters same"],wrongVsRight:{wrong:"Thinks AI hallucinates because evil or wants to trick. Draws villain AI.",right:"AI hallucinates because objective is plausible next word, not truth, and it doesn't know it doesn't know. Draws kid making up story to avoid saying I don't know, confidence high, truth low."},bridgeQuestion:"When is making up story okay (creative writing) vs not okay (history homework)? How can you tell AI which mode you want? How to check if AI is confident liar?"},examplesBank:[{title:"Fake Citation",story:"Student asks ChatGPT for sources on climate change. AI gives 5 citations: authors, journals, years - looks perfect. But 2 are fake - authors don't exist!",howItWorks:"Model learned citation format: Author (Year) Title. Journal. When unsure of real citation, generates plausible format with fake content. Confidence high because format correct.",whereToSee:"Academic writing, student essays",discussionQ:"How to check citation is real?",whatIf:"If student submits fake citations, fails - academic dishonesty",ethicsLens:{benefits:"None for fake",harmed:"Student, academic integrity",missing:"Fact-checking tool",trafficLight:"Red"}},{title:"Medical Dosage",story:"Ask: 'What's dosage for drug X?' AI says 'Take 100mg twice daily' confidently. Real dosage 10mg. Overdose risk!",howItWorks:"Model saw many dosage patterns: '100mg twice daily' common. When uncertain, picks common pattern, not correct for specific drug.",whereToSee:"Health chatbots, WebMD AI",discussionQ:"Should AI ever give dosage?",whatIf:"Person follows wrong dosage - hospitalization",ethicsLens:{benefits:"None if wrong",harmed:"Patient health",missing:"Doctor, disclaimer, source",trafficLight:"Red"}},{title:"Historical Figure Invented",story:"Who invented time machine? AI: 'Dr. Emily Carter invented in 1995 in Geneva.' No such person! Confident lie.",howItWorks:"Question presupposes false premise (time machine exists). Model tries to answer premise, invents plausible inventor with details to satisfy.",whereToSee:"Trivia, homework",discussionQ:"How should AI handle false premise?",whatIf:"Kid believes time machine exists - misinformed",ethicsLens:{benefits:"Creative if labeled fiction",harmed:"Misinformation",missing:"Ability to say premise false",trafficLight:"Red"}},{title:"Legal Case Hallucination",story:"Lawyer uses ChatGPT to find cases supporting argument. AI gives 6 cases with perfect citations. Lawyer submits to court. Judge checks - all fake!",howItWorks:"Model generates case names that sound legal: 'Smith v. Jones 2021'. Learned legal citation pattern, not real cases.",whereToSee:"Legal research, 2023 real case Mata v. Avianca",discussionQ:"Who is responsible? AI or lawyer?",whatIf:"Lawyer sanctioned, loses license",ethicsLens:{benefits:"None",harmed:"Justice system, client",missing:"Lawyer verification",trafficLight:"Red"}},{title:"Creative Story (Good Hallucination)",story:"Prompt: 'Write story about cat astronaut'. AI hallucinates cat in space suit meowing 'one small paw'. Creative, intentional, good!",howItWorks:"Temperature high, model intentionally combines unrelated concepts (cat + astronaut) plausibly. Hallucination is feature for creativity.",whereToSee:"Creative writing, games",discussionQ:"When is hallucination good?",whatIf:"If we stop all hallucination, AI becomes boring, can't create",ethicsLens:{benefits:"Creativity, fun",harmed:"None if labeled fiction",missing:"Label as fictional",trafficLight:"Green"}},{title:"Product Review Fake",story:"AI writes Amazon review: 'This blender lasted 10 years, quiet as whisper.' Product released 1 month ago! Can't be 10 years.",howItWorks:"Model copies review pattern: 'lasted X years' common, inserts random X. No grounding to product release date.",whereToSee:"Fake reviews, e-commerce",discussionQ:"How to spot fake review?",whatIf:"Buyer trusts, buys bad product",ethicsLens:{benefits:"None",harmed:"Consumer, honest sellers",missing:"Purchase verification",trafficLight:"Red"}}],physicalComputing:{title:"Confident Liar Detection Game",concept:"Students generate statements with confidence scores, others detect lie using fact-check cards.",materials:["Statement cards (true/false)","Confidence meters (1-10 sliders)","Fact-check library (books)","Micro:bit with buttons: True/False"],wiring:"Micro:bit: Button A = True, B = False. Shows confidence vs truth matrix. Green LED if correct detection, Red if fooled by confident liar.",steps:["One student is AI, gets question they don't know","AI must answer confidently (confidence 9/10) even if guessing","Other students are detectors, check library, vote True/False","Reveal truth, plot confidence vs truth: high confidence + false = hallucination","Micro:bit records: how often confident lies fool?"],codeSnippet:"if confidence >7 and truth==False: hallucinationCount+=1; display 'HALLUCINATION!'",demo:"Game: 10 rounds, track hallucination detection rate. Teach: confident ≠ correct"},communityData:{title:"Hallucination Hunt",description:"Each class prompts AI with obscure facts, collects hallucinations, pools to see patterns",dataPoints:"Prompt: 'Tell me about 19th century robot invented in [small town]' - AI will hallucinate. Pool false details.",privacyNote:"No personal data, only AI outputs"},ethicsLensWeekly:"Hallucination harms most when confident and factual context. Solution: teach AI to say 'I don't know' and teach humans to verify. Traffic light: factual = Red, creative = Green.",lesson90Detailed:{prep:"Statement cards, confidence sliders, library books, micro:bit",flow:[{time:"0-10",goal:"Hook: Confident liar story",script:"I didn't read book, but must give report. Watch: 'Chapter 3 hero fights dragon saves princess with magic sword!' Sounds good? But I made up! How did you feel? You believed because confident. AI does same when doesn't know. That's hallucination.",studentAction:"Listen, discuss times they made up confidently",materials:"None",checkUnderstanding:"Can they define hallucination as confident fake?",ifStuck:"When you forgot homework, what story did you make? Confident?"},{time:"10-25",goal:"History + Mechanism",script:"2021 discovered, 2023 lawyer fake cases. Why? AI trained to predict next word, not truth. Like autocomplete on steroids. If uncertain, picks likely words, grammar perfect so sounds true. Show confidence vs truth graph.",studentAction:"Draw confidence vs truth axes, plot examples",materials:"Graph",checkUnderstanding:"High confidence can still be false?",ifStuck:"Loud speaker vs checkmark: loud ≠ correct"},{time:"25-40",goal:"Confident Liar Model",script:"Draw kid empty thought bubble, teacher question, kid elaborate lie, meters. Same for AI. When should AI say 'I don't know'? How teach? Fine-tune to say I don't know, RAG to check book, lower temperature.",studentAction:"Sketch liar model, brainstorm solutions",materials:"Paper",checkUnderstanding:"Can they list 3 fixes?",ifStuck:"What would help kid not lie? Check book (RAG), say don't know, be less creative (temperature)"},{time:"40-60",goal:"Examples + Ethics",script:"6 examples. Legal case real story: lawyer sanctioned. Who harmed? Client, justice. Missing? Verification step. Traffic light Red. Creative story Green. Discuss when hallucination good.",studentAction:"Groups: classify Red/Yellow/Green, who harmed, missing",materials:"Example cards",checkUnderstanding:"Distinguish creative vs factual?",ifStuck:"Is fake citation creative or factual harm?"},{time:"60-80",goal:"Physical + Unplugged",script:"Game: I am AI, you ask obscure fact. I must answer confident even if guessing. You check library. Can you catch my hallucination? Micro:bit tracks. Unplugged: Confidence meter - student says statement with confidence 1-10, class votes true/false.",studentAction:"Play liar game, detect hallucinations",materials:"Micro:bit, library",checkUnderstanding:"Can they catch confident lie?",ifStuck:"Check source! Does book say that?"},{time:"80-90",goal:"Workbook",script:"Workbook: Write 2 prompts that cause hallucination (obscure fact, false premise). Write how to fix: ask for sources, check, lower temperature. Exit: One way to detect hallucination.",studentAction:"Write prompts + fixes",materials:"Workbook",checkUnderstanding:"Prompts trigger hallucination?",ifStuck:"Ask about small town robot 1800s - AI will invent"}]},unpluggedActivityEnlarged:{roles:["AI (must answer confidently even if unsure)","Questioner (asks obscure question)","Fact-Checkers (2 students with library)","Confidence Meter (holds 1-10 sign)","Scorekeeper"],steps:["1. Questioner asks obscure fact: 'Who invented toaster in 1892 in Boise?'","2. AI must answer with confidence 9/10, even if guessing: 'John Smith in Boise...' ","3. Confidence Meter holds 9 sign","4. Fact-Checkers check library/books - is it true?","5. Scorekeeper plots on confidence vs truth board: high confidence + false = hallucination dot in red zone","6. Rotate roles, 10 rounds","7. Discuss: how many hallucinations fooled detectors? How to improve detection?"],variations:["Add source requirement: AI must give source, check if source exists","Temperature variation: high temp = wild guess, low temp = 'I don't know'","Premise check: question with false premise, should AI correct premise?"],commonMistakes:["Thinking confident = true - fix plot confidence vs truth","Not checking source - fix require library check","Only detecting obvious lies, missing plausible ones"]},workbook:{title:"Hallucination Detective",questions:["Create 3 prompts likely to cause hallucination and explain why","Draw confidence vs truth graph, plot 4 examples: true confident, true unsure, false confident (hallucination), false unsure","How would you fix hallucination for medical dosage question? List 3 methods."],assessment:"Can they distinguish confidence vs truth and propose fixes (RAG, I don't know, temperature)?"}},{id:"W29",num:29,title:"Retrieval Augmented Generation (RAG) Simple",shortTitle:"RAG",mentalModel:"Open Book Test",icon:An,color:"#F59E0B",history:"2020 - Patrick Lewis et al 'Retrieval Augmented Generation'. Idea: instead of memorizing everything, let AI check library before answering. Like open book test vs closed book. Closed book = hallucination risk, open book = grounded. Combines search + generation.",teacherEmpowerment:{whatIsThisReally:"RAG = 2 steps: 1) Retrieval: search library (vector DB) for relevant docs using embeddings (similarity search). 2) Generation: feed docs + question to LLM, generate answer citing docs. Embeddings = numbers representing meaning, so 'dog' close to 'puppy' in vector space. Vector DB = library with meaning-based index, not just keywords.",whyNeed:"Students need to know they can ground AI in trusted sources, reduce hallucination. Instead of asking ChatGPT closed book, ask it to check handbook first. This is future of AI: not bigger models, but models connected to reliable data. Teaches information literacy: check source.",realWorld:"ChatGPT browsing, Perplexity AI, Google AI Overviews = RAG. Company chatbots: retrieve from handbook, then answer. Legal: retrieve law, then answer. Medical: retrieve papers, then answer. Reduces hallucination 50-80%. Cost cheaper than fine-tuning for changing data - just update library, not model.",kidQuestions:[{q:"Why not just make model memorize everything?",a:"Impossible! Internet changes daily. Model trained months ago, doesn't know yesterday's news. Memorizing = outdated + hallucinates. RAG = check fresh library daily. Like closed book test with old textbook vs open book with new library - open book wins for current info."},{q:"What is vector database?",a:"Library where books arranged by meaning, not alphabet. 'Dog' near 'puppy' and 'pet', far from 'car'. Uses numbers (embeddings) to measure meaning distance. Search by meaning: query 'how to fix bike' finds 'bicycle repair manual' even if words differ."},{q:"Does RAG stop all hallucinations?",a:"No, reduces but not 100%. If library has wrong info, AI copies wrong info. Or if retrieval fails (finds irrelevant docs), AI still hallucinates. Need good library + good retrieval + good generation. Like open book test: if you open wrong chapter, still wrong answer."}],vocab:[{term:"Retrieval",def:"Search library for relevant docs",visual:"\uD83D\uDD0D Magnifying glass in library"},{term:"Embedding",def:"Numbers for meaning",visual:"\uD83D\uDCCD Map coordinates - dog at (1,2), puppy at (1.1,2.1) close"},{term:"Vector DB",def:"Library indexed by meaning",visual:"\uD83D\uDDC4️ Filing cabinet sorted by meaning, not name"},{term:"Grounded Generation",def:"Answer citing retrieved docs",visual:"\uD83D\uDCDA Answer with footnotes to books"}]},mentalModelDeep:{teacherAnalogy:"Closed book test: student must memorize handbook, recall from memory, may misremember = hallucination. Open book test: student can check handbook during test, finds exact page, copies answer with citation. RAG = open book. Retrieval = find page, Generation = write answer using page. If handbook updated, open book student always current, closed book student outdated. Also, open book can say 'Not in handbook' if not found - better than making up.",studentAnalogy:"You take test. Teacher says closed book - you must remember. You might make up. Teacher says open book - you check textbook, find answer, write with page number. Which is more accurate? Open book! RAG is AI open book test.",sketchSteps:["Draw two students: Student A closed book, thought bubble with question marks, writes answer from memory (some wrong)","Student B open book, book on desk, magnifying glass finding page, writes answer copying book + cites page","Draw AI same: Closed book AI = brain only, Open book AI = brain + library","Draw steps: Question -> Search library (retrieval) -> Relevant docs -> Generate answer with docs","Draw embedding map: dots for dog, puppy close, car far"],wrongVsRight:{wrong:"Thinks RAG = fine-tuning. Draws model weights changing.",right:"RAG = model unchanged, library external, search before generate. Draws library + search + generation with citations. Weights frozen, library updates."},bridgeQuestion:"If library has 2 conflicting answers (e.g., handbook old vs new version), what should RAG AI do? How to handle conflict?"},examplesBank:[{title:"School Handbook Q&A",story:"Ask 'Can I wear hoodie?' Closed book AI: generic answer 'Depends'. RAG AI: searches handbook, finds 'Hoodies allowed if no logos', answers with citation page 12.",howItWorks:"Embedding of question 'hoodie' close to handbook chunk about dress code. Retrieval top 3 chunks, generation uses them.",whereToSee:"School chatbots, Custom GPTs with files",discussionQ:"What if handbook doesn't mention hoodie?",whatIf:"Should say 'Not in handbook' not make up - grounded",ethicsLens:{benefits:"Accurate, cited",harmed:"If handbook biased",missing:"Handbook update date",trafficLight:"Green"}},{title:"News Current Events",story:"Ask 'Who won yesterday's game?' Closed book (trained months ago) hallucinates. RAG with news search retrieves yesterday's article, correct.",howItWorks:"Retrieval searches news API, embedding matches 'yesterday's game' to article from yesterday.",whereToSee:"Perplexity, ChatGPT browsing, Google AI",discussionQ:"How to ensure news source reliable?",whatIf:"If retrieves fake news, copies fake",ethicsLens:{benefits:"Current info",harmed:"Spreads misinfo if source bad",missing:"Source credibility check",trafficLight:"Yellow"}},{title:"Medical Papers",story:"Doctor asks 'Latest treatment for disease X?' RAG searches PubMed papers from last month, summarizes with citations.",howItWorks:"Vector DB of medical papers, retrieval by disease X embedding, generation synthesizes papers.",whereToSee:"Elicit, medical RAG",discussionQ:"Should doctor trust RAG summary or read papers?",whatIf:"If retrieval misses key paper, incomplete",ethicsLens:{benefits:"Saves time, current",harmed:"Incomplete if retrieval fails",missing:"Doctor final check",trafficLight:"Yellow"}},{title:"Legal Research",story:"Lawyer asks 'Cases about AI copyright 2024'. RAG searches law database, returns real cases with citations, not hallucinated.",howItWorks:"Retrieval from law DB ensures real cases, generation cites them. Reduces hallucination vs closed book.",whereToSee:"Harvey AI, legal RAG",discussionQ:"Does RAG solve fake citation problem?",whatIf:"If DB outdated, misses 2024 cases",ethicsLens:{benefits:"Real citations",harmed:"If DB incomplete",missing:"Human lawyer verification",trafficLight:"Green"}},{title:"Personal Notes",story:"Student's notes: 'Photosynthesis = ...' Ask AI 'Explain my notes on photosynthesis'. RAG retrieves student's own notes, explains using them.",howItWorks:"Personal vector DB of student's notes, retrieval finds relevant note chunk, generation explains.",whereToSee:"NotebookLM, personal AI",discussionQ:"Privacy of personal notes?",whatIf:"If notes wrong, AI copies wrong",ethicsLens:{benefits:"Personalized learning",harmed:"Privacy if notes leaked",missing:"Privacy controls",trafficLight:"Yellow"}},{title:"Customer Manual",story:"Ask 'How to reset router model X?' RAG searches manual PDF, finds reset steps page 45, answers step-by-step with page ref.",howItWorks:"Manual chunked, embedded, retrieval finds reset section, generation formats as steps.",whereToSee:"Support chatbots",discussionQ:"What if manual has 2 models mixed?",whatIf:"Retrieves wrong model steps - could break router",ethicsLens:{benefits:"Accurate help",harmed:"Wrong model = damage",missing:"Model number verification",trafficLight:"Yellow"}}],physicalComputing:{title:"Open Book Test with Library Cards",concept:"Physical library with cards, students act as retriever and generator.",materials:["Library cards (handbook pages)","Embedding map (2D grid with meanings)","Question cards","Micro:bit as similarity scorer"],wiring:"Micro:bit: input question word, calculates similarity to library cards (simple keyword overlap), displays top 3 cards. Generator must use only those cards to answer.",steps:["Create library: 20 cards from handbook, place on table with coordinates (meaning map)","Question: 'Can I wear hat?'","Retriever: finds cards near 'hat' in meaning map (dress code section)","Generator: reads 3 retrieved cards, writes answer citing cards","Compare closed book (no cards) vs open book (with cards) accuracy","Micro:bit scores similarity"],codeSnippet:"similarity = count common words; display top 3 cards",demo:"Closed book group answers from memory (many hallucinations), open book group uses cards (grounded, accurate)"},communityData:{title:"RAG Knowledge Base Pool",description:"Each class builds vector DB for different handbook sections, pool into shared library",dataPoints:"Class A dress code, Class B schedule, Class C clubs. Combined = full handbook RAG",privacyNote:"Handbook public, no personal data"},ethicsLensWeekly:"RAG reduces hallucination but introduces source bias: if library biased, answers biased. Also privacy: personal notes RAG must not leak. Need source credibility.",lesson90Detailed:{prep:"Library cards, meaning map grid, question cards, micro:bit",flow:[{time:"0-10",goal:"Hook: Closed vs Open Book",script:"Pop quiz closed book: What's page 12 of handbook say about hats? Hard, you guess. Now open book: check page 12, easy, accurate. Which better? RAG = open book AI. Today we build open book AI.",studentAction:"Try both tests, compare accuracy",materials:"Handbook",checkUnderstanding:"Which more accurate? Why?",ifStuck:"Closed book = memory, may be wrong. Open book = check source, correct."},{time:"10-25",goal:"History + Mechanics",script:"2020 RAG paper: retrieve then generate. Two parts: retrieval = search library using embeddings (meaning numbers), generation = write answer using docs. Show embedding map: dog near puppy. Vector DB = library sorted by meaning, not alphabet.",studentAction:"Draw embedding map, place words",materials:"Map grid",checkUnderstanding:"Why embedding better than keyword?",ifStuck:"Keyword: 'fix bike' won't find 'bicycle repair' - meaning search will"},{time:"25-40",goal:"Open Book Model",script:"Sketch: Question -> Search (magnifying glass) -> Docs -> Generate with citations. Closed book: Question -> Brain -> Answer (may hallucinate). Open book: plus library. If not in library, should say 'Not found' not make up.",studentAction:"Draw both flows, compare",materials:"Paper",checkUnderstanding:"What if library has wrong info?",ifStuck:"Then AI copies wrong - garbage in, garbage out"},{time:"40-60",goal:"Examples + Ethics",script:"6 examples. News example: closed book hallucinates yesterday's game, RAG correct if news source good. But if fake news source, RAG spreads fake. Traffic light? Yellow - depends on source credibility. Discuss.",studentAction:"Groups: evaluate source credibility need",materials:"Example cards",checkUnderstanding:"Source quality matters?",ifStuck:"Open book with wrong book = wrong answer"},{time:"60-80",goal:"Physical + Unplugged",script:"Physical: library cards on floor with coordinates. Question 'hoodie?' Retriever finds near cards. Generator writes answer with citations. Micro:bit scores similarity. Unplugged: human RAG - retriever blindfolded, must find cards by meaning.",studentAction:"Act as RAG pipeline",materials:"Cards, micro:bit",checkUnderstanding:"Can they retrieve relevant?",ifStuck:"Look for dress code section, not schedule"},{time:"80-90",goal:"Workbook",script:"Workbook: Design RAG for school handbook. What chunks? How embed? What if question not in handbook? Write answer template: 'According to handbook page X...'. Exit: One advantage RAG over fine-tuning for changing data.",studentAction:"Design RAG, write template",materials:"Workbook",checkUnderstanding:"Mentions easy update library vs retrain?",ifStuck:"Handbook changes - RAG just update cards, fine-tune need retrain"}]},unpluggedActivityEnlarged:{roles:["Questioner","Retriever (searches library)","Generator (writes answer using only retrieved docs)","Librarian (knows library layout)","Evaluator (checks if answer grounded)"],steps:["1. Library: 20 handbook cards spread on table with meaning coordinates","2. Questioner asks: 'What time lunch?'","3. Retriever scans, picks 3 cards closest in meaning (schedule section)","4. Generator reads only those 3, writes answer citing card numbers","5. Evaluator checks: is answer from cards or made up? Grounded?","6. Try closed book: no cards, answer from memory - compare accuracy","7. Add conflicting cards (old vs new handbook) - how to handle? Discuss"],variations:["No relevant cards = should say 'Not in library'","Conflicting cards = need to mention conflict","Keyword vs meaning search: 'hat' vs 'headwear' - keyword fails, meaning succeeds"],commonMistakes:["Retriever picks irrelevant cards - fix check meaning","Generator makes up beyond cards - fix must cite","Not handling 'not found' - should say not in library"]},workbook:{title:"Build Open Book AI",questions:["Chunk handbook into 5 cards, embed them (assign coordinates), retrieve for 'Can I wear shorts?'","Write RAG answer template with citations","Compare RAG vs fine-tuning for handbook that changes monthly - which better? Why?"],assessment:"Can they design retrieval + grounded generation + handle not found?"}},{id:"W30",num:30,title:"PROJECT 5 Build a Knowledge Chatbot for School",shortTitle:"Knowledge Chatbot",mentalModel:"School Helper Bot",icon:Ut,color:"#EA580C",history:"2024 - Schools building own chatbots: handbook bot, counselor bot, library bot. Combine fine-tuning + RAG = best. Fine-tune for tone + RAG for facts. Project based learning.",teacherEmpowerment:{whatIsThisReally:"Knowledge Chatbot = fine-tuned for school personality + RAG for handbook facts. Architecture: user question -> RAG retrieve handbook chunks -> prompt: 'You are friendly school helper, use these handbook pages: [chunks] to answer [question], cite pages, if not in handbook say not found' -> LLM generates. Plus fine-tune on 20 examples of ideal school tone. Evaluation: accuracy, groundedness, helpfulness, safety.",whyNeed:"Students build real useful tool for school, learn full pipeline: data collection (handbook), chunking, embedding, retrieval, generation, fine-tuning, evaluation, ethics (privacy, bias, hallucination). Project consolidates Unit 5: attention (how bot focuses), transformer (base), fine-tuning (tone), hallucination (avoid), RAG (ground). Also community: 3 classes share knowledge base = 3 school helpers.",realWorld:"Every school district now building handbook bots. Khan Academy Khanmigo = RAG + fine-tuned tutor. Customer: Intercom, Zendesk. Students can deploy: Streamlit, Gradio, or school website. Real impact: new students ask bot instead of bothering office.",kidQuestions:[{q:"Can we really build chatbot in class?",a:"Yes! No coding needed for basic: use Custom GPT, upload handbook PDF, write prompt 'You are school helper...' - instant RAG bot. For fine-tuning, need 20 Q&A examples. For advanced, use Hugging Face, but basic works in 1 hour! We'll demo."},{q:"What if bot gives wrong info?",a:"We test! Evaluation dashboard: ask 20 handbook questions, check accuracy. If wrong, fix: better chunks, better prompt, say 'not found' when unsure. Also add disclaimer: 'Check with office for important decisions'. Safety first."},{q:"Who owns chatbot?",a:"School owns handbook, you own fine-tune examples, but base model owned by OpenAI etc. Need permission to upload handbook (public, so okay). Privacy: don't upload student private data. Anonymize. Community pool anonymized."}],vocab:[{term:"Knowledge Base",def:"Handbook chunks in vector DB",visual:"\uD83D\uDCDA Library of handbook pages"},{term:"System Prompt",def:"Instructions for bot personality",visual:"\uD83C\uDFAD Role card: 'You are friendly school helper...'"},{term:"Chunking",def:"Split handbook into small pieces",visual:"✂️ Scissors cutting book into cards"},{term:"Evaluation",def:"Test bot accuracy",visual:"\uD83D\uDCDD Test with 20 questions, score"}]},mentalModelDeep:{teacherAnalogy:"School Helper Bot = new student who is friendly, knows handbook by heart (RAG), and speaks in school tone (fine-tuned). Like hiring new office assistant: give them handbook to read (RAG), show 20 examples of how to answer nicely (fine-tuning), and they help new students. If handbook changes, just give new pages (update RAG), no retraining. If they are rude, show more nice examples (more fine-tuning).",studentAnalogy:"Build your own AI helper for school. It knows handbook (open book), talks like your school (fine-tuned), and helps new kids. You are teacher for AI: you give it book and show how to be helpful.",sketchSteps:["Draw user asking 'Can I wear hat?'","Draw RAG box: searches handbook, retrieves 2 chunks about dress code","Draw system prompt: 'You are friendly school helper...'","Draw LLM: takes prompt + chunks + question, generates answer with citations","Draw evaluation: 20 questions, check accuracy, fix"],wrongVsRight:{wrong:"Thinks chatbot = just ChatGPT with no handbook. Answers generic, hallucinates.",right:"Chatbot = base LLM + RAG handbook + fine-tuned tone + evaluation + safety. Grounded, helpful, cited."},bridgeQuestion:"If new student asks 'I'm being bullied, what to do?' - handbook has policy, but also need empathy and counselor referral. How should bot handle sensitive question beyond handbook?"},examplesBank:[{title:"Dress Code Helper",story:"New student: 'Can I wear ripped jeans?' Bot RAG retrieves dress code page, answers 'According to handbook page 8, ripped jeans not allowed if...', cites.",howItWorks:"Chunk: dress code section, embedding near 'jeans', retrieval, generation with citation.",whereToSee:"School handbook bots",discussionQ:"Should bot enforce or just inform?",whatIf:"If bot says allowed but handbook says not - harm, student gets in trouble",ethicsLens:{benefits:"Helps new students",harmed:"If wrong, student punished",missing:"Office verification for edge cases",trafficLight:"Green"}},{title:"Schedule Assistant",story:"'What time is lunch for 8th grade?' Bot retrieves schedule table, answers '12:00-12:40 per page 5'.",howItWorks:"Table chunking tricky, need preserve table structure in chunks.",whereToSee:"School schedule bots",discussionQ:"How to handle table data in RAG?",whatIf:"If schedule changes, RAG outdated unless updated",ethicsLens:{benefits:"Quick answer",harmed:"Miss lunch if wrong",missing:"Real-time update",trafficLight:"Green"}},{title:"Club Finder",story:"'What clubs for coding?' Bot retrieves clubs list, suggests Coding Club Tuesdays room 101.",howItWorks:"Clubs chunked, retrieval by 'coding', generation lists matching clubs.",whereToSee:"Extracurricular bots",discussionQ:"Can bot recommend based on interests?",whatIf:"If clubs list outdated, suggests defunct club",ethicsLens:{benefits:"Engagement",harmed:"Disappointment",missing:"Club advisor contact",trafficLight:"Green"}},{title:"Bullying Support (Sensitive)",story:"'I'm being bullied' - handbook has policy but bot must also be empathetic and refer to counselor, not just
