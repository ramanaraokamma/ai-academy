=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)o[r]===void 0&&(o[r]=t[r]);return{$$typeof:mh,type:e,key:i,ref:a,props:o,_owner:vh.current}}var c=zc,p=zc;var cn=[{id:"W31",weekNum:"W31",title:"Data Collection Ethics",subtitle:"Consent, privacy, permission",mental:"Permission Slip",color:"#6D28D9",accent:"#0D9488",teacherEmpowerment:{whatIsThisReally:"Data collection ethics is the set of rules about how we ask for, store, and use people's information. It became a major tech field in the early 2010s after social apps scraped photos without permission, and was spotlighted by ProPublica's 2016 investigation showing data can be biased if collected without consent. At its core, it's about respecting that data = people, not just numbers. Like medical consent forms, AI needs explicit, informed, reversible permission. Without it, even accurate models are unethical.",why7thGradersNeedThis:`Every day students' photos, voice, and clicks are collected when they use filters, games, and school apps. Understanding consent helps them spot when an app says "Allow access to photos?" and decide what is okay. This builds agency: they learn they can say no, ask why, and demand transparency before AI uses them.`,realWorldBehindTheScenes:"In real products, before logging data, engineers show a consent screen explaining what is collected, why, and how long it's kept. The data is tagged with a consent ID, stored in a privacy vault, and can be deleted on request (GDPR right to be forgotten). Telemetry pipelines check this tag before training - if consent = false, the data is skipped. No consent tag, no training.",kidQA:[{q:"Should AI use my photo without asking?",a:"No. Your face is your data. Good AI asks first, tells you why it needs it, and lets you say no - just like borrowing someone's bike needs a permission slip."},{q:"If I click Accept, does the company own my data forever?",a:"Not if consent is done right. Real consent is reversible - you should be able to delete it later. Think of it like lending a book, not giving it away."},{q:"Why does privacy matter if I have nothing to hide?",a:"Because data can be used to guess things about you you didn't share - like your location, health, or family income. Privacy protects your future choices."}],vocab:[{term:"Consent",teacherDef:"Informed, freely given, specific agreement to collect/use data",kidDef:"Saying yes after knowing what will happen",pronunciation:"con-SENT",visualCue:"\uD83D\uDCDD signed slip"},{term:"Privacy",teacherDef:"Right to control access to personal information",kidDef:"Your right to keep some info just for you",pronunciation:"PRY-vuh-see",visualCue:"\uD83D\uDD12 locked diary"},{term:"Anonymization",teacherDef:"Removing identifiers so data can't trace to a person",kidDef:"Taking name tags off data",pronunciation:"uh-non-uh-my-ZAY-shun",visualCue:"\uD83D\uDE48 face blurred"},{term:"Data Minimization",teacherDef:"Collect only what is needed for the task",kidDef:"Don't take extra data you don't need",pronunciation:"MIN-ih-my-ZAY-shun",visualCue:"\uD83C\uDF92 small backpack"}]},mentalModelDeep:{name:"Permission Slip",teacherAnalogy:"Like a field trip permission slip, data consent requires who is asking, what will happen, risks, and parent/student signature. Without a signed slip, the student doesn't go. Without data consent, the data doesn't go into the model. The slip must be understandable, not hidden in 30 pages of legal text.",studentAnalogy:"You need a permission slip before using someone's photo, just like you need a slip before a field trip.",sketchSteps:["Draw a clipboard","Write WHO: 'Photo App' WHAT: 'Use my selfie to train filter'","Add two checkboxes: YES / NO","Add line: Why? How long? Can I delete?","Add signature line + big stamp APPROVED or DENIED"],wrongVsRight:{wrong:"Accept = company can use everything forever",right:"Accept = specific use, specific time, you can take it back"},bridgeQ:"If your friend wants to use your photo for their AI project, what 3 things must their permission slip say?"},examples:[{title:"Filter App Selfies",story:"Maya uses a beauty filter that asks to use her selfies to improve the filter for everyone. She wasn't told it would be stored for 2 years.",howItWorks:"App uploads selfies to cloud, labels them 'smile', adds to training set. Better filter but private faces in dataset.",whereToSee:"Instagram, TikTok filters permission screen",discussionQ:"Is it okay if filter gets better but Maya didn't know storage time?",whatIf:"What if Maya could choose 'use only on my phone, not cloud'?",ethicsLens:{benefits:"Better filters for all",harmed:"Maya - facial data reused without clear time limit",missing:"Kids under 13 in dataset, no age check",trafficLight:"Yellow"}},{title:"School Voice Recorder",story:"Class records voices to train a pronunciation AI. One student doesn't want his stutter recorded.",howItWorks:"Microphones collect voice samples, stored with student ID. Model learns accent but keeps identifiable voiceprints.",whereToSee:"Language learning apps, school AI pilot",discussionQ:"Should the team still include his voice if he said no?",whatIf:"If they anonymize voice - remove ID - is it now okay without consent?",ethicsLens:{benefits:"Helps non-native speakers",harmed:"Student with stutter if identifiable",missing:"Opt-out alternative assignment",trafficLight:"Red"}},{title:"Fitness Tracker Steps",story:"A free step counter sells aggregated step data to insurance research.",howItWorks:"App logs GPS + steps, strips names but keeps zip code + age. Researchers see patterns.",whereToSee:"Strava, Fitbit privacy policy",discussionQ:"If name removed but zip+age can identify you, is it private?",whatIf:"What if users get paid $1 per month for sharing?",ethicsLens:{benefits:"Health research",harmed:"Low-income zip codes could face higher premiums",missing:"Clear disclosure that data is sold",trafficLight:"Yellow"}},{title:"Meme Dataset Scrape",story:"AI company scrapes 1M memes from public Instagram to train funny-caption AI without asking posters.",howItWorks:"Crawler downloads public images. Public = technically allowed but creators didn't expect AI training.",whereToSee:"LAION dataset, meme AI generators",discussionQ:"If it's public, is it automatically okay to use for AI?",whatIf:"What if meme has a child's face in it?",ethicsLens:{benefits:"Funny AI for everyone",harmed:"Teen creators whose jokes are monetized",missing:"Creator credit, child photos",trafficLight:"Red"}},{title:"Hallway Camera Count",story:"School installs camera to count hallway traffic for safety, but stores faces.",howItWorks:"Camera runs person-detection. Should blur faces but default saves full video for 7 days.",whereToSee:"School security systems",discussionQ:"Safety vs privacy - where is line?",whatIf:"If camera only counts dots, not faces, changes ethics?",ethicsLens:{benefits:"Prevent crowding",harmed:"All students surveilled",missing:"Student council approval",trafficLight:"Yellow"}},{title:"Good Consent: Library Check",story:"Library AI recommends books. Asks: 'Can we use your checkout history for 30 days to recommend? You can delete anytime.'",howItWorks:"Consent screen with plain language, toggle, expiry date, delete button. Data auto-deletes after 30 days.",whereToSee:"Good example - library app design",discussionQ:"What makes this GOOD consent?",whatIf:"Would you say yes to this one? Why?",ethicsLens:{benefits:"Better recommendations, clear control",harmed:"None if implemented",missing:"None - gold standard",trafficLight:"Green"}}],physical:{title:"Permission Slip Switch",concept:"micro:bit asks permission before logging light sensor data",materials:["micro:bit","paper consent slips","A/B buttons as YES/NO"],wiring:"No wiring. micro:bit on table. Button A = YES, Button B = NO. LED shows lock icon until consent given.",code:["on start: show \uD83D\uDD12, dataAllowed = false","on Button A: dataAllowed=true, show ✅, play happy tone","on Button B: dataAllowed=false, show ❌, clear log","if dataAllowed: every 2s log light level, else show 'NO CONSENT'"],noTech:"Paper slips: students sign slip before partner can write down their favorite color. Without slip, recorder must keep hands behind back.",tip:"Emphasize reversible: press B anytime to revoke. Data light should turn off immediately."},community:{prompt:"Design a consent slip for your capstone data",pooled:["Voice: 'Can I record 10 words? Delete after demo'","Photos: 'Blur faces, keep only hands for gesture AI'","Survey: 'Anonymous, optional, skip any question'"],privacy:"All examples anonymized, no names, no photos of students"},lesson90:{prep:{objective:"Students can design an ethical consent flow and explain why reversible consent matters",materials:"Consent slip templates, micro:bits, case cards, green/orange cards",setup:"Print 30 slips, set 6 stations with one case card each, pre-load micro:bit code"},flow:[{phase:"Hook",time:"0-10m",goal:"Feel consent violation",script:"I'm going to take a photo of your notebooks right now for my AI. Say cheese! ... Just kidding, I didn't. But how did that feel? A little creepy? That's exactly how apps feel when they take data without a permission slip. Today we fix that.",action:"React, discuss creepy feeling, quick poll thumbs up/down",materials:"Phone prop",check:"Green: Students can name one feeling when data taken without asking",stuck:"Orange: Ask - have you ever had app ask for photos? How did you decide?"},{phase:"Mental Model",time:"10-25m",goal:"Introduce Permission Slip model",script:"A permission slip has four parts: Who wants data, What exactly, How long, Can I take it back? Let's draw it together. Who remembers a real field trip slip? Same structure protects your data. If any part missing, you say NO or ask more.",action:"Copy 5-step sketch, label WHO/WHAT/HOW LONG/REVOKE",materials:"Whiteboard, sketch steps",check:"Green: Student sketch includes 4 parts + signature line",stuck:"Orange: Point to field trip slip on wall, map each line to data version"},{phase:"Explore",time:"25-45m",goal:"Analyze 6 example cases with traffic light",script:"You are ethics inspectors. Each table gets one case card. Read story, find benefits, who could be harmed, what's missing, then set traffic light: Green good to go, Yellow needs fix, Red stop. You have 12 minutes then gallery walk.",action:"Groups read case, fill ethics lens, set light, rotate",materials:"6 case cards, traffic light stickers",check:"Green: Group can justify Yellow/Red with missing consent element",stuck:"Orange: Use prompt: Would you want your little sibling in this dataset?"},{phase:"Build",time:"45-70m",goal:"Build permission switch on micro:bit",script:"Now we code consent. Your micro:bit wants to log light data. It must ask first. Button A is yes, B is no. If no, it must NOT log and show a lock. If yes, it logs. And you can change your mind anytime by pressing B. Code that rule - no permission, no data.",action:"Wire logic, test YES/NO, show teacher revoke works",materials:"micro:bit, MakeCode",check:"Green: Pressing B stops logging and clears screen within 1 second",stuck:"Orange: Start with if dataAllowed block, show where to put log"},{phase:"Ethics Discuss",time:"70-80m",goal:"Debate public vs private",script:"Quick debate: Someone said 'If it's public on Instagram, I can use it for AI.' Do you agree? Turn to partner, 60 seconds each side. I'll pick two to share. There is no perfect answer, but consent culture says public doesn't equal permission for AI training.",action:"Partner debate, 2 shares, vote",materials:"Debate timer",check:"Green: Student can give one reason public ≠ AI consent",stuck:"Orange: Example: Your public yearbook photo used for face recognition ad - okay?"},{phase:"Reflect",time:"80-90m",goal:"Create own consent slip",script:"Exit ticket: Design a consent slip for your future capstone. You need 10 voice samples from friends. Write your slip with WHO, WHAT, HOW LONG, and REVOKE. Make it so your grandma would understand. Best slips go on Ethics Wall.",action:"Write slip, submit, gallery",materials:"Slip template, markers",check:"Green: Slip includes expiry and delete option in kid-friendly language",stuck:"Orange: Provide sentence starters: 'I want to... I will keep it for... You can delete by...'"}]},unplugged:{title:"Consent Chain",roles:{Trainer:"Asks for data",Model:"Decides yes/no",Tester:"Checks if data used correctly",Recorder:"Writes if consent honored"},materials:"Color cards (favorite color), consent slips, basket for data",steps:["Trainer asks: Can I collect your favorite color for AI?","Model reads slip, decides YES/NO, signs","If YES, Model whispers color to Trainer","Trainer writes color on card, puts in basket ONLY if slip signed YES","Tester audits basket vs slips - any data without slip must be shredded","Switch roles, round 2 with revoke: Model can take slip back","Debrief: How many data points removed after revoke?"],variations:{fast:"10 colors, speed round",slow:"Include how long data kept, add expiry dates"},observe:"Do Trainers try to sneak data without slip? Do Models feel pressure? Does Tester catch violations?",mistakes:["Collecting before signature","Forgetting revoke means delete","Thinking verbal yes equals written informed consent"]},workbook:{ethicsCase:"App collects location to recommend lunch spots but keeps it forever. Redesign consent - write new flow with 3 screens.",task:"Fill Permission Slip Template for your capstone data source. Identify 2 harms if consent missing.",exit:"What are 4 parts of a good permission slip? Give example for photo data."}},{id:"W32",weekNum:"W32",title:"Who Owns the Model?",subtitle:"Data labor, ownership, cake",mental:"Who Owns Cake?",color:"#7C3AED",accent:"#059669",teacherEmpowerment:{whatIsThisReally:"Model ownership asks: who contributed labor to an AI and who should benefit? In the 2010s, we realized AI models are not built by one company alone - thousands of labelers, photographers, writers, and users created the data. The cake analogy: flour (data collectors), recipe (researchers), oven (compute), and decorating (labelers) all matter. Legally, current US law gives ownership to the company that trained it, but ethically, data labor deserves credit and compensation. This sparked data cooperatives and artist opt-out movements in 2022-2023.",why7thGradersNeedThis:"When students label images for a class AI, they are doing real work that makes the model valuable. If a company later sells that model, should students get credit or payment? Understanding this helps them value their own contributions and question unfair deals where they do free labor for tech giants.",realWorldBehindTheScenes:"Behind the scenes, companies hire data labelers often paid cents per image. Their labels are tracked with worker IDs. Some new platforms record provenance: each image keeps a chain of who created, who labeled, who verified. When model earns money, smart contracts could split payment. Most products today don't do this yet - ownership is centralized.",kidQA:[{q:"Who owns AI if I trained it?",a:"You own the work you did, but if you used someone else's data or a company's computer, they may claim part. Like group project - who gets A? Best is to agree BEFORE you start."},{q:"If I label 100 cat photos, should I get paid?",a:"Yes, that's labor. In real world, labelers are paid. In class, you get credit, skills, and your name on the model card. Future jobs may pay for quality data."},{q:"Can I say no to my art being used for AI?",a:"You should be able to. Artists are fighting for opt-out tools. Ethical builders provide a way to remove your data if you didn't consent."}],vocab:[{term:"Data Labor",teacherDef:"Human work creating, labeling, cleaning data that powers AI",kidDef:"Work people do to make data useful for AI",pronunciation:"DAY-tuh LAY-bor",visualCue:"\uD83C\uDFF7️ labeling tags"},{term:"Ownership",teacherDef:"Legal/ethical rights to control and benefit from a model",kidDef:"Who gets to decide and get credit for AI",pronunciation:"OWN-er-ship",visualCue:"\uD83C\uDF82 cake slices"},{term:"Provenance",teacherDef:"Record of where data came from and who touched it",kidDef:"Data's family tree",pronunciation:"PROV-uh-nance",visualCue:"\uD83C\uDF33 family tree"},{term:"Cooperative",teacherDef:"Group that jointly owns and shares benefits",kidDef:"Team that shares cake fairly",pronunciation:"co-OP-er-uh-tiv",visualCue:"\uD83E\uDD1D hands together"}]},mentalModelDeep:{name:"Who Owns Cake?",teacherAnalogy:"Imagine class bakes a cake. Ana brought flour (data), Ben gave recipe (algorithm), Carlos provided oven (compute), Dana decorated (labeling). Who owns the final cake? If only Ben sells it and keeps money, that's unfair. Fair ownership means deciding slices BEFORE baking, tracking contributions, and sharing. AI is same: data, code, compute, labeling all deserve slices.",studentAnalogy:"If many people bake a cake together, who owns it? Everyone who helped should get a slice.",sketchSteps:["Draw big cake with 4 layers","Label layers: Data Flour, Code Recipe, Compute Oven, Label Decor","Draw 4 stick figures each holding one layer","Slice cake into 4 parts but sizes can differ","Add question: Who decides slice size? Write AGREE BEFORE BAKE"],wrongVsRight:{wrong:"Company that pressed 'train' owns 100% automatically",right:"All contributors have claim, should agree on shares before training"},bridgeQ:"In your capstone, who contributes data? How will you give them credit on your model card?"},examples:[{title:"Class Pet Classifier",story:"Students label 200 hamster vs gerbil photos to train class AI. Principal wants to sell model to other schools.",howItWorks:"Student labels become training data. Model weights encode their work. Selling without credit ignores labor.",whereToSee:"School AI projects, Teachable Machine",discussionQ:"Should students get part of sale?",whatIf:"What if students agreed upfront: credit + pizza party, no money?",ethicsLens:{benefits:"Model helps other schools",harmed:"Students if no credit",missing:"Prior agreement on ownership",trafficLight:"Yellow"}},{title:"Artist Style Copy",story:"AI trained on artist's Instagram without asking, now generates art in her style for $5.",howItWorks:"Scraper collects images, model learns style patterns. Artist's labor becomes product she doesn't control.",whereToSee:"Stable Diffusion artist protest 2023",discussionQ:"Is learning style same as copying?",whatIf:"What if artist could opt-out and get paid if opted in?",ethicsLens:{benefits:"Cheap art for buyers",harmed:"Original artist livelihood",missing:"Consent and compensation",trafficLight:"Red"}},{title:"Labeler in Kenya",story:"Workers in Kenya label violent content for $2/hour to make chatbot safe, get no mental health support.",howItWorks:"Labelers flag toxic text, that data trains safety filter. Their labor protects users but they are invisible.",whereToSee:"Time article on OpenAI labelers 2023",discussionQ:"Who owns safety filter they helped build?",whatIf:"If company shares 1% profit with labelers?",ethicsLens:{benefits:"Safer AI",harmed:"Labelers underpaid, trauma",missing:"Fair wage, credit, care",trafficLight:"Red"}},{title:"Family Recipe AI",story:"Grandma's recipes collected by family to train recipe AI, family agrees all names on cover.",howItWorks:"Data provenance kept: each recipe tagged with contributor. Model card lists all grandmas.",whereToSee:"Community dataset projects",discussionQ:"Why does listing names matter?",whatIf:"One cousin says remove my recipes later - should they be able to?",ethicsLens:{benefits:"Preserves culture, shared ownership",harmed:"None if agreement honored",missing:"None - good example",trafficLight:"Green"}},{title:"YouTube Recommendation",story:"You watch videos, YouTube learns your taste. Your watch history trains model that keeps you watching.",howItWorks:"Your clicks = free data labor. Model owned by YouTube, you get no slice though you trained it with behavior.",whereToSee:"YouTube, TikTok For You",discussionQ:"Are you working for free when you scroll?",whatIf:"What if you could download your taste model and take it to another app?",ethicsLens:{benefits:"Personalized feed",harmed:"Users addicted, no ownership of their taste profile",missing:"Data portability",trafficLight:"Yellow"}},{title:"Co-op Dataset",story:"Students form data co-op: they pool plant photos, decide together how model used, share profit from plant sale.",howItWorks:"Co-op charter, voting, ledger of contributions. Model owned by co-op, not one person.",whereToSee:"Data co-ops emerging 2024",discussionQ:"Is co-op fairer than company ownership?",whatIf:"What if someone contributes 10x more photos?",ethicsLens:{benefits:"Fair sharing, democratic",harmed:"Slower decisions",missing:"Need governance rules",trafficLight:"Green"}}],physical:{title:"Ownership Labels",concept:"micro:bit shows who contributed to dataset",materials:["micro:bit","paper labels","ownership pie chart"],wiring:"Button A cycles contributors, Button B adds your contribution slice. Display shows pie growing.",code:["contributors = []","on A: show contributor name from list","on B: add YOU to contributors, grow pie slice animation","on shake: show total slices = len(contributors)"],noTech:"Bake paper cake, each student adds ingredient slip, then cut and discuss slice sizes before eating (or sharing stickers).",tip:"Make invisible labor visible - ask who cleaned data? That counts as slice."},community:{prompt:"Map who owns your capstone: data collectors, labelers, coders, compute provider",pooled:["Plant co-op: 60% data collectors, 20% labelers, 20% coders","Game AI: 50% players who tested, 50% builders","Recipe AI: all grandmas listed alphabetically"],privacy:"Only first names or team names, no personal data"},lesson90:{prep:{objective:"Students can map data labor and propose fair ownership agreement",materials:"Cake diagram, ingredient cards, pie chart templates",setup:"Draw cake on board, prepare 4 ingredient stations"},flow:[{phase:"Hook",time:"0-10m",goal:"Feel unfair ownership",script:"I baked a cake at home but used your flour, sugar, and recipe ideas from yesterday's brainstorm. I will now sell it and keep all money. Fair? Shout fair or not fair. You did work but get nothing. That's what happens in AI when data labor is ignored.",action:"Vote fair/not fair, discuss feeling",materials:"Cake photo",check:"Green: Students say not fair and name one labor type",stuck:"Orange: Ask who brought flour in real baking - would they expect thank you?"},{phase:"Mental Model",time:"10-25m",goal:"Cake model deep",script:"Let's draw Who Owns Cake. Four layers: Data Flour, Code Recipe, Compute Oven, Label Decor. Each needs a person. If we don't agree on slices before baking, fight after. Good teams write agreement first. Sketch with me - 60 seconds.",action:"Sketch 5 steps, label",materials:"Board",check:"Green: Sketch shows 4 contributors + AGREE BEFORE BAKE text",stuck:"Orange: Show pre-drawn cake, ask students to add labels"},{phase:"Explore",time:"25-45m",goal:"Analyze ownership cases",script:"Six cases around room - artist, labeler, class pet, YouTube, family, co-op. Your job: for each, list who contributed, who currently owns, who SHOULD own, traffic light. Spend 3 min per case, then pick one that made you angriest and why.",action:"Gallery walk, fill ownership table",materials:"Case cards, table worksheet",check:"Green: Can list 3 contributors for one case",stuck:"Orange: Use prompt: Who would be sad if model sold without them?"},{phase:"Build",time:"45-70m",goal:"Physical ownership pie",script:"Build ownership pie on micro:bit. Button A shows contributors, Button B adds you. Shake to see total slices. Your task: make pie that shows fair shares for your capstone. If someone gave 100 photos vs 10, should slices be equal? Decide and code your rule.",action:"Code pie, test, present fair rule",materials:"micro:bit",check:"Green: Pie changes when new contributor added, rule explained",stuck:"Orange: Start with equal slices, then ask should more data = bigger slice?"},{phase:"Ethics Discuss",time:"70-80m",goal:"Opt-out and co-ops",script:"Should artists be able to opt-out of AI training? Show of hands. Now: if they opt-in, should they be paid? This is happening now - 2023 artists protested. There is no perfect law yet. What would you propose as fair rule for your school?",action:"Debate opt-out vs opt-in, draft school rule",materials:"None",check:"Green: Student proposes one rule in sentence",stuck:"Orange: Give starter: 'Anyone whose data is used should get...'"},{phase:"Reflect",time:"80-90m",goal:"Ownership agreement for capstone",script:"Write your capstone ownership agreement: Who contributes? What slice do they get? Credit? Can they revoke? Use sentence: We, [names], agree that... Sign it. This goes in your blueprint.",action:"Write agreement, pair share",materials:"Agreement template",check:"Green: Agreement lists at least 2 contributor types and credit method",stuck:"Orange: Provide fill-in: Data from ___, labels by ___, credit will be ___"}]},unplugged:{title:"Cake Factory",roles:{Trainer:"Brings data ingredients",Model:"Mixes algorithm",Tester:"Tastes/tests",Recorder:"Tracks who did what"},materials:"Paper ingredients, bowl, pie chart, play money",steps:["Trainer collects ingredient cards from team","Model mixes: reads recipe, combines cards","Tester checks cake: does it match request? 3 trials","Recorder logs: who brought what, time spent","Team decides: how to split $10 if cake sold? Write agreement BEFORE sale","Sell cake to another group, pay according to agreement","Debrief: Did agreement feel fair? What would you change?"],variations:{fast:"One cake, quick split",slow:"Track quantity: 20 photos = bigger slice, discuss proportional vs equal"},observe:"Do students notice cleaning/labeling as labor? Do they argue about slice sizes?",mistakes:["Forgetting labeling is labor","Assuming coder owns all","Agreement after baking not before"]},workbook:{ethicsCase:"AI trained on your class's drawings sold to sticker company without asking. Who owns? What would fair look like?",task:"Draw ownership pie for your capstone with 3-5 slices, label %, justify.",exit:"Name 3 types of data labor and who does them in real AI."}},{id:"W33",weekNum:"W33",title:"Explainable AI",subtitle:"Why did AI say that?",mental:"Show Your Work",color:"#6D28D9",accent:"#10B981",teacherEmpowerment:{whatIsThisReally:`Explainable AI (XAI) is about making AI show its reasoning, not just answer. It grew after 2016 when LIME (Local Interpretable Model-Agnostic Explanations) by Ribeiro et al. showed how to highlight which features mattered for a prediction. Before that, deep learning was a black box. Why it matters: if AI says "this loan denied" or "this image is a wolf," we need to know if it looked at credit score or at snow background. Without explanation, we can't catch bias or build trust.`,why7thGradersNeedThis:`Kids hear "AI said so" as final answer. They need to ask "Why did AI say that? What did it look at?" When their image classifier says "cat" but looked at background, that's a clue model is cheating. Showing work is same as math class - answer without work gets partial credit.`,realWorldBehindTheScenes:"Real XAI uses feature importance: for an image, it masks parts and sees if prediction changes - if covering the ears changes cat to dog, ears were important. LIME does this locally. For text, it highlights words. Dashboards show bar charts: feature X contributed 70%. Engineers use this to debug bias - if zip code is top feature for loan denial, that's red flag.",kidQA:[{q:"Why did AI say that?",a:"Because it found patterns in data - like pointed ears for cats. Explainable AI shows which patterns it used, so we can check if pattern makes sense."},{q:"If AI is accurate, why need explanation?",a:"Accurate for wrong reason is dangerous. AI might classify wolves by snow, not wolves. It will fail when no snow. Explanation catches cheating."},{q:"Can AI lie about why?",a:"It can give explanation that sounds good but isn't true reason. That's why we test by covering features and seeing if prediction really changes - like checking math work, not just final sentence."}],vocab:[{term:"Explainable AI",teacherDef:"Methods that make AI decisions understandable to humans",kidDef:"AI that shows its work",pronunciation:"ex-PLAIN-uh-bul A-I",visualCue:"\uD83D\uDD0D magnifying work"},{term:"Feature Importance",teacherDef:"How much each input contributed to output",kidDef:"Which clues mattered most",pronunciation:"FEE-cher im-POR-tance",visualCue:"\uD83D\uDCCA bars"},{term:"Black Box",teacherDef:"Model where internal reasoning hidden",kidDef:"Box you can't see inside",pronunciation:"BLACK BOX",visualCue:"⬛ box"},{term:"LIME",teacherDef:"Local Interpretable Model-Agnostic Explanations - perturbs input to explain",kidDef:"Cover parts to see what matters",pronunciation:"LIME like fruit",visualCue:"\uD83C\uDF4B lime covering"}]},mentalModelDeep:{name:"Show Your Work",teacherAnalogy:"Math teacher says show your work, not just answer, to catch mistakes. XAI is same: AI must show which features it used. If student writes 2+2=5 with no work, you can't fix. If AI says sick but looked at hospital watermark not symptoms, you need work to fix. Feature importance bars are like underlining the clues used.",studentAnalogy:"Like math class - don't just give answer, show which clues you used to get it.",sketchSteps:["Draw brain with answer 'CAT' coming out","Draw arrow back to input photo","Highlight ears with yellow marker + label 70%","Highlight background with gray 5%","Write rule: If cover important part, answer should change - test it!"],wrongVsRight:{wrong:"AI is right, so we trust it, no need to explain",right:"Even right answers need work check to ensure not right for wrong reason"},bridgeQ:"If your plant AI says 'sick' but explanation shows it looked at your hand holding pot, is that trustworthy? What fix?"},examples:[{title:"Wolf vs Husky",story:"AI claims 95% accuracy distinguishing wolves vs huskies, but actually looks at snow background, not animal.",howItWorks:"Training data: wolves in snow, huskies on grass. Model learns snow = wolf. LIME would highlight snow, not fur.",whereToSee:"Classic XAI example - Ribeiro 2016",discussionQ:"How would explanation reveal cheating?",whatIf:"If we add huskies in snow to data, what happens to explanation?",ethicsLens:{benefits:"High accuracy on test set",harmed:"Users in forest without snow misclassified",missing:"Diverse backgrounds, explanation check",trafficLight:"Red"}},{title:"Loan Denial",story:"Bank AI denies loan. Applicant told 'AI said no' but not why. Later found zip code was top feature.",howItWorks:"Model trained on historical biased loans. Feature importance shows zip code = proxy for race.",whereToSee:"ProPublica 2016 COMPAS",discussionQ:"Why must bank show feature importance?",whatIf:"If explanation shows income is top feature, is that fairer?",ethicsLens:{benefits:"Fast loan decisions",harmed:"Applicants from certain zip codes",missing:"Fairness audit, explanation to user",trafficLight:"Red"}},{title:"Doctor Helper",story:"AI helps doctor detect skin disease. Shows heatmap over mole, not background, so doctor trusts.",howItWorks:"Saliency map highlights mole border irregularity. Doctor verifies same clue they use.",whereToSee:"Medical AI FDA approved",discussionQ:"Does explanation help doctor or replace?",whatIf:"If heatmap shows ruler in photo as important?",ethicsLens:{benefits:"Doctor faster, catches early",harmed:"None if explanation matches medical knowledge",missing:"Need doctor training to read maps",trafficLight:"Green"}},{title:"Essay Grader",story:"AI grades essays, gives low score to good essay because it uses short words, not ideas.",howItWorks:"Feature importance: length and fancy words high, argument quality low. Model learned bad proxy.",whereToSee:"Automated essay scoring",discussionQ:"What features SHOULD matter for good essay?",whatIf:"If we hide word count, can model still cheat?",ethicsLens:{benefits:"Fast grading",harmed:"Students with simple clear writing",missing:"Content quality features",trafficLight:"Yellow"}},{title:"Plant Doctor - Good",story:"Student's plant disease AI shows leaf spots as important, stem as not. Matches biology textbook.",howItWorks:"LIME masks leaf parts, prediction drops when spots covered. Bars: spots 60%, color 25%, background 5%.",whereToSee:"Student capstone - ideal",discussionQ:"Why is this explanation trustworthy?",whatIf:"What if background pot color was 50% important?",ethicsLens:{benefits:"Students learn biology + AI",harmed:"None",missing:"None - gold",trafficLight:"Green"}},{title:"Hiring Filter",story:"Resume filter favors 'football' but not 'softball' as important word for tech job.",howItWorks:"Word importance: football high positive, softball negative - reflects historical male hires.",whereToSee:"Amazon hiring AI scrapped 2018",discussionQ:"How would showing word importance reveal bias?",whatIf:"If we remove gendered sports words, does bias disappear?",ethicsLens:{benefits:"Speeds hiring",harmed:"Women applicants",missing:"Bias test, diverse training",trafficLight:"Red"}}],physical:{title:"Cover to Discover",concept:"Cover features to see prediction change - LIME style",materials:["micro:bit","light + temp sensors","paper covers"],wiring:"micro:bit reads light and temp to predict 'inside/outside'. Cover light sensor with hand, see if prediction flips.",code:["Read light, temp","if light > 150 and temp > 25: predict OUTSIDE","Show prediction","Cover test: if cover light sensor, does prediction change? Log importance"],noTech:"Partner guesses if drawing is cat/dog. Other partner covers ears, tail, background one at a time. Does guess change? Record which cover mattered most.",tip:"Make bar chart on paper: each feature's importance = how much prediction changed when covered."},community:{prompt:"For your capstone, list 3 features your AI uses and predict importance",pooled:["Plant AI: spot texture 60% - leaf color 30% - background 10%","Gesture AI: hand shape 70% - background 5% - lighting 25%","Mood AI: word choice 50% - emojis 30% - punctuation 20%"],privacy:"No real user data, only feature names"},lesson90:{prep:{objective:"Students can test feature importance by covering and explain why explanation matters",materials:"Printed cat/dog images, sticky notes to cover, bar chart templates",setup:"6 stations each with image + classifier (teacher acts as model)"},flow:[{phase:"Hook",time:"0-10m",goal:"Experience black box failure",script:"I have an AI that says this is a wolf with 95% confidence. Who believes it? Now I'll show you it looked at snow, not wolf. Look - I covered the wolf, left snow, still says wolf. It cheated! Today we learn to catch cheaters by making AI show its work.",action:"Watch demo, gasp, discuss",materials:"Wolf/husky images",check:"Green: Student says model looked at background not animal",stuck:"Orange: Ask what part of photo is wolf vs background?"},{phase:"Mental Model",time:"10-25m",goal:"Show Your Work",script:"In math, teacher says show your work. AI must too. We do LIME style: cover a clue, see if answer changes. If answer changes a lot, that clue was important. Let's sketch: brain, answer CAT, arrows to ears 70% important, background 5%. If cover ears, answer should flip. That's test.",action:"Sketch, copy steps, practice covering",materials:"Board",check:"Green: Can explain cover test in own words",stuck:"Orange: Demo with own face - cover eyes, can friend still recognize you?"},{phase:"Explore",time:"25-45m",goal:"Test 6 cases with feature importance",script:"At each station, you are the explainer. Model says answer. You cover features with sticky notes and record: did prediction change? Make bar chart of importance. Then decide traffic light: Green explanation matches human logic, Red cheating, Yellow unsure. Go!",action:"Rotate stations, cover features, chart importance",materials:"Images, sticky notes, charts",check:"Green: Bar chart shows at least 2 features with different heights",stuck:"Orange: Start with 2 features only: animal vs background, which matters more?"},{phase:"Build",time:"45-70m",goal:"Physical LIME on micro:bit",script:"Your micro:bit predicts inside vs outside using light and temperature. Your job: figure out which feature is more important. Cover light sensor with hand, does prediction change? Cover temp by warming? Log changes. Build bar chart of importance. This is exactly what LIME does.",action:"Code, cover sensors, log, chart",materials:"micro:bit, hands",check:"Green: Can say light is X% important because covering changed prediction Y times",stuck:"Orange: Test one sensor at a time, write yes/no changed"},{phase:"Ethics Discuss",time:"70-80m",goal:"Bias via explanation",script:"Loan AI denied Maya because zip code was top feature. Is zip code fair? What should be top? Income, payment history maybe. Explanation revealed bias. Without explanation, we'd never know. Should AI be required to explain high-stakes decisions like loans, jobs, health? Vote.",action:"Discuss, vote, propose law",materials:"Loan case card",check:"Green: Student names one high-stakes area needing explanation",stuck:"Orange: Would you want doctor AI to explain why it says surgery needed?"},{phase:"Reflect",time:"80-90m",goal:"Explain your capstone",script:"Exit: For your capstone AI, what 3 features should be important? What should NOT be important? Draw your ideal feature importance bars. If background becomes important, what's your fix? Add more diverse backgrounds. Put on Ethics Wall.",action:"Draw ideal bars, share",materials:"Bar template",check:"Green: Bars include expected important features and low background",stuck:"Orange: For plant AI, what would biologist look at? Spots, not pot."}]},unplugged:{title:"Show Your Work Detective",roles:{Trainer:"Knows true rule",Model:"Guesses using secret rule",Tester:"Covers features",Recorder:"Charts importance"},materials:"Feature cards (ears, tail, whiskers, background), answer cards",steps:["Trainer picks secret rule: e.g., cat = pointy ears","Model sees 5 examples, guesses rule but doesn't tell","Model predicts new animal","Tester covers one feature at a time, asks Model to re-predict","Recorder notes: when did prediction change? That feature important","Reveal true rule, compare to importance chart","Discuss: Did Model use correct features?"],variations:{fast:"2 features only",slow:"Add noisy feature like background color, see if Model cheats"},observe:"Do Models rely on background? Can Testers design good cover tests?",mistakes:["Covering two features at once","Thinking high accuracy means correct reasoning","Not testing background as feature"]},workbook:{ethicsCase:"Hiring AI says no to qualified candidate. Feature importance shows 'female' hobby words low. Redesign.",task:"Pick one example, draw feature importance bars as AI currently does vs how it SHOULD.",exit:"What is LIME cover test? Give example with your capstone."}},{id:"W34",weekNum:"W34",title:"AI & Jobs",subtitle:"Builder perspective - New tools new jobs",mental:"New Tools New Jobs",color:"#581C87",accent:"#0D9488",teacherEmpowerment:{whatIsThisReally:`AI and jobs debate started in 2010s with automation fears - Frey & Osborne 2013 predicted 47% jobs automatable. History shows calculators didn't kill math jobs, they created spreadsheet jobs, data analyst jobs. Since 2017, we see augmentation, not just automation: AI handles repetitive parts, humans do creative, ethical, relational parts. Builder perspective: instead of asking "Will AI take my job?" ask "What new jobs can I build with AI? And how do I design AI that helps workers, not replaces?"`,why7thGradersNeedThis:"Students worry AI will take all jobs. They need builder mindset: tools change jobs, don't just delete. When calculator came, mathematicians didn't disappear - they solved harder problems. Students can imagine new jobs: AI ethicist, prompt engineer, data curator - jobs that didn't exist 5 years ago. They can design AI that makes their community's work easier, not harder.",realWorldBehindTheScenes:"In real workplaces, AI does draft, human does edit. Designer uses AI to generate 10 logo drafts, then picks and refines. Doctor uses AI to transcribe notes, spends more time with patient. Product teams now include human-in-the-loop: AI proposes, human approves. Metrics track time saved and job satisfaction, not just cost cut.",kidQA:[{q:"Will AI take my dream job?",a:"It will change it. If you want to be artist, AI can be your assistant for boring parts, but your taste, story, and ethics are still yours. New jobs will exist that we can't name yet - you can create one."},{q:"What new jobs does AI create?",a:"AI trainer, data label quality checker, explainability designer, AI ethicist, human-AI collaboration manager. Also old jobs become more creative - teacher uses AI to grade quick quizzes, spends more time mentoring."},{q:"Should we build AI that replaces people?",a:"Responsible builders ask: does this AI help people do their best work, or push them out? Good AI augments - like calculator helps math, doesn't replace mathematician."}],vocab:[{term:"Automation",teacherDef:"Machine doing task without human",kidDef:"AI does it alone",pronunciation:"aw-toe-MAY-shun",visualCue:"\uD83E\uDD16 solo"},{term:"Augmentation",teacherDef:"AI helping human do task better",kidDef:"AI as helper, not replacer",pronunciation:"awg-men-TAY-shun",visualCue:"\uD83E\uDDBE human+AI"},{term:"New Collar",teacherDef:"New jobs combining tech + human skills",kidDef:"New jobs that didn't exist before AI",pronunciation:"NEW COLL-ar",visualCue:"\uD83D\uDC54✨"},{term:"Displacement",teacherDef:"Workers moving from old tasks to new",kidDef:"Job shifts, people need retraining",pronunciation:"dis-PLACE-ment",visualCue:"\uD83D\uDD04 arrow"}]},mentalModelDeep:{name:"New Tools New Jobs",teacherAnalogy:"Calculator didn't kill math jobs. Before calculator, humans did long division all day. After calculator, accountants used calculator to do taxes faster and invented financial planning, data analysis. Same with AI: it automates repetitive pattern matching, freeing humans for creativity, ethics, relationships. Builder asks: what boring part can AI do so human can do more meaningful part? Tool, not replacement.",studentAnalogy:"Calculator didn't kill math jobs, it created new ones. AI is new calculator.",sketchSteps:["Draw calculator","Draw arrow to mathematician looking bored doing long division","Draw same mathematician now smiling doing big graph with calculator helping","List old job: calculator (boring) vs new job: analyst (creative)","Add formula: AI + Human > AI alone or Human alone"],wrongVsRight:{wrong:"AI will take all jobs, no work left",right:"AI changes tasks inside jobs, creates new tasks, humans still needed for judgment and care"},bridgeQ:"What boring part of your capstone work could AI do, so you can focus on creative/ethical part?"},examples:[{title:"Artist Assistant",story:"Maya is comic artist. Uses AI to color backgrounds quickly, spends saved time on story and characters.",howItWorks:"AI does pattern fill, human does creative direction. Time: 2h coloring -> 10min, +1h50m for story.",whereToSee:"Procreate AI assist, Photoshop generative fill",discussionQ:"Is Maya still artist if AI colors?",whatIf:"What if AI also writes story?",ethicsLens:{benefits:"More comics, artist focuses on story",harmed:"Background colorists if not retrained",missing:"Credit for AI assist",trafficLight:"Green"}},{title:"Teacher Grader",story:"Mr. Lee uses AI to grade 100 spelling quizzes, uses saved time to mentor struggling students 1-1.",howItWorks:"AI matches exact answers, flags unsure for human review. Teacher reviews 10%, not 100%.",whereToSee:"Gradescope, school pilots",discussionQ:"Does this help or hurt teachers?",whatIf:"If AI also writes report cards comments?",ethicsLens:{benefits:"More mentoring time",harmed:"None if teacher still controls grades",missing:"Need teacher oversight",trafficLight:"Green"}},{title:"Fast Food Kiosk",story:"Burger place replaces cashiers with kiosks. Cashiers lose jobs, but new jobs: kiosk fixer, app helper.",howItWorks:"Automation of order taking. Displacement: 3 cashier jobs -> 1 technician + 1 helper + cost savings.",whereToSee:"McDonald's kiosks",discussionQ:"Who benefits, who harmed?",whatIf:"What if company retrains cashiers as techs?",ethicsLens:{benefits:"Faster orders, fewer errors",harmed:"Cashiers without retraining",missing:"Retraining program",trafficLight:"Yellow"}},{title:"Doctor Scribe",story:"Doctor uses AI to transcribe patient visits, so doctor looks at patient not laptop.",howItWorks:"Speech-to-text + summary. Doctor verifies. Saves 2h paperwork daily.",whereToSee:"Nabla, Nuance DAX",discussionQ:"Is patient care better with AI scribe?",whatIf:"If AI makes mistake in medical note?",ethicsLens:{benefits:"More eye contact, less burnout",harmed:"Patient if error not caught",missing:"Human review step",trafficLight:"Green"}},{title:"Factory Vision",story:"Factory worker used to inspect bottles for cracks 8h/day. Now AI camera flags cracks, worker fixes machine and trains AI.",howItWorks:"Computer vision does repetitive inspection, human does problem-solving when AI unsure.",whereToSee:"Manufacturing AI",discussionQ:"Is new job better or worse?",whatIf:"What if worker not trained to fix machine?",ethicsLens:{benefits:"Less eye strain, more skilled work",harmed:"Workers not retrained",missing:"Training for new role",trafficLight:"Yellow"}},{title:"New Job: Prompt Engineer",story:"12-year-old's older brother gets job writing good prompts for company's customer service AI.",howItWorks:"Job didn't exist in 2020. Combines writing, psychology, testing. Created by new tool.",whereToSee:"Job boards 2023-2024",discussionQ:"What new jobs could YOUR capstone create?",whatIf:"What new job will exist in 2030?",ethicsLens:{benefits:"New creative tech jobs",harmed:"None",missing:"Training pathways for kids",trafficLight:"Green"}}],physical:{title:"Tool vs Replacement",concept:"micro:bit as tool that helps human",materials:["micro:bit","tasks list: count steps, measure light"],wiring:"micro:bit counts steps automatically, human decides if steps = healthy. Shows augmentation.",code:["on shake: count++","show count","Human decides: if count > 20, show \uD83D\uDE0A else suggest walk","AI counts, human judges"],noTech:"One student does 20 addition problems alone, another uses calculator for addition but must explain what answer means. Which is more creative?",tip:"Emphasize human judgment remains essential."},community:{prompt:"How does your capstone help a worker? Does it augment or automate?",pooled:["Garden AI: helps gardener spot disease early, not replace gardener","Homework helper: drafts outline, student writes final","Sorting AI: sorts recyclables, human does creative reuse"],privacy:"Focus on job types, not personal worker info"},lesson90:{prep:{objective:"Students can distinguish augmentation vs automation and design AI that helps workers",materials:"Job cards, calculator, task lists",setup:"Stations: old job tasks vs new job tasks"},flow:[{phase:"Hook",time:"0-10m",goal:"Feel automation fear + hope",script:"Raise hand if worried AI will take your dream job. Keep hand up. Now: who uses calculator for math homework? Did calculator kill mathematicians? No. It changed their job. Today we will design AI that creates jobs and helps people, not just replaces.",action:"Hands up, calculator show, quick poll",materials:"Calculator",check:"Green: Student can name one job that changed with calculator",stuck:"Orange: What did accountants do before calculator? Long division all day!"},{phase:"Mental Model",time:"10-25m",goal:"New Tools New Jobs",script:"Draw calculator, bored mathematician doing division, then happy mathematician doing big graphs with calculator. Formula: Human + AI > Human alone or AI alone. Augmentation means AI does boring part, human does creative, ethical, caring part. Let's sketch together.",action:"Sketch, copy formula",materials:"Board",check:"Green: Sketch shows boring vs creative split",stuck:"Orange: What boring part of drawing could AI do? Coloring background?"},{phase:"Explore",time:"25-45m",goal:"Analyze job cases",script:"Six job cards: artist, teacher, cashier, doctor, factory, prompt engineer. For each, mark: A for automation replaces, H for augmentation helps, and who benefits/harmed. Then pick one and propose retraining to make it Green light.",action:"Sort cards, mark A/H, propose fix",materials:"Job cards",check:"Green: Can explain difference between A and H with example",stuck:"Orange: Does AI do whole job or just part? If part, it's H"},{phase:"Build",time:"45-70m",goal:"micro:bit as helper",script:"Your micro:bit will count shakes as steps. It automates counting. But YOU decide what count means healthy. Code: AI counts, human judges. Show how AI + human better than alone. If AI says 1000 steps, you say great or need more? Human judgment.",action:"Code count + judgment, demo",materials:"micro:bit",check:"Green: Device shows count and human decision message",stuck:"Orange: Start with shake counting, then add if count > threshold"},{phase:"Ethics Discuss",time:"70-80m",goal:"Responsible builder question",script:"Builder question: Should we build AI that replaces people just because we can? Turn and talk: when should we NOT automate even if possible? Example: robot teacher vs human teacher for emotional support. When is human essential?",action:"Debate, list human-essential tasks",materials:"None",check:"Green: Names one task where human essential (care, ethics, creativity)",stuck:"Orange: Would you want AI to comfort you when sad?"},{phase:"Reflect",time:"80-90m",goal:"Capstone jobs lens",script:"For your capstone: what worker does it help? What boring task does AI take? What new creative task does human now do? And what new job could your project create? Write job ad for 2030: Wanted: ... for your AI.",action:"Write job ad, share",materials:"Job ad template",check:"Green: Job ad includes AI tool + human skill",stuck:"Orange: Fill: Wanted: Person who uses [your AI] to help [worker] by [task]"}]},unplugged:{title:"Automation vs Augmentation Sort",roles:{Trainer:"Does task manually",Model:"Proposes AI to do part",Tester:"Checks if human still needed",Recorder:"Logs A vs H"},materials:"Task cards (grading, drawing, diagnosing, counting), A/H labels",steps:["Pick task card","Trainer does task alone, time it","Model proposes AI does boring subtask","Team does task with AI help, time it","Tester asks: is human still needed for judgment/care? If yes, H, else A","Recorder logs time saved and new creative time gained","Switch tasks, debate which should NOT be fully automated"],variations:{fast:"3 tasks",slow:"Design retraining plan for displaced worker"},observe:"Do students see human judgment as valuable? Can they propose retraining?",mistakes:["Thinking faster always better","Forgetting care/empathy needs human","Not proposing new job created"]},workbook:{ethicsCase:"Burger kiosk replaces cashiers. Design augmentation version + retraining plan to make traffic Green.",task:"List 3 boring subtasks your capstone AI can do and 3 human creative tasks it enables.",exit:"Define augmentation vs automation with example from your life."}},{id:"W35",weekNum:"W35",title:"Capstone Prep",subtitle:"Problem + Data Plan + Metric + Blueprint",mental:"Blueprint",color:"#4C1D95",accent:"#10B981",teacherEmpowerment:{whatIsThisReally:"Capstone prep is project-based learning framework from engineering: before building house, need blueprint - problem definition, data plan, success metric, ethics check. In AI education since 2010s, capstones moved from just accuracy to responsible builder framework: what problem, whose data, how measured, who harmed. It uses backward design: start with impact and metric, then data, then model. This prevents building cool tech that solves no real problem.",why7thGradersNeedThis:"Students often jump to building AI without asking what problem it solves or how they'll know it works. Blueprint forces them to think: what real person has this problem? Where will data come from ethically? How will I prove it helps? This is exactly how real product managers plan AI - not code first, problem first.",realWorldBehindTheScenes:"In industry, team writes 1-page blueprint: Problem statement (user + pain), Data plan (source + consent + size), Metric (accuracy + fairness + latency), Ethics card (who benefits/harmed), Next step. Only after approval do they code. This saves months of building wrong thing.",kidQA:[{q:"Why need blueprint before building?",a:"To avoid building something nobody needs or that is unfair. Like building house without blueprint - walls in wrong place. Blueprint makes sure AI helps real person."},{q:"What if my data plan fails?",a:"Then revise blueprint - maybe use public dataset with permission, or collect smaller ethical dataset. Good builders iterate on plan, not just code."},{q:"What metric besides accuracy?",a:"Fairness: does it work for all skin tones? Time saved: does it actually help worker? Consent: did everyone agree? Accuracy alone not enough."}],vocab:[{term:"Blueprint",teacherDef:"Plan with problem, data, metric, ethics before building",kidDef:"Map before building house",pronunciation:"BLUE-print",visualCue:"\uD83D\uDCD0 plan"},{term:"Problem Statement",teacherDef:"Clear description of user, pain, and desired outcome",kidDef:"Who needs help and what hurts",pronunciation:"PROB-lem STATE-ment",visualCue:"❓ who/what"},{term:"Metric",teacherDef:"Measurable way to know if AI works",kidDef:"How you know you succeeded",pronunciation:"MET-rik",visualCue:"\uD83D\uDCCF ruler"},{term:"Data Plan",teacherDef:"Where data from, how much, consent, storage",kidDef:"Where you'll get permission-slip data",pronunciation:"DAY-tuh PLAN",visualCue:"\uD83D\uDDC2️ data boxes"}]},mentalModelDeep:{name:"Blueprint",teacherAnalogy:"Architect doesn't start laying bricks, they draw blueprint: who lives there, how many rooms, what materials, how to know it's safe. AI blueprint same: who is user, what problem hurts, what data permission, what metric proves help, what ethics risks. Without blueprint, you build fast but wrong house. With blueprint, team can give feedback before costly building.",studentAnalogy:"Before building house, need blueprint - who lives there, how many rooms, how to know it's good.",sketchSteps:["Draw house outline","Label 4 corners: Problem (top left), Data (top right), Metric (bottom left), Ethics (bottom right)","Add arrow: Problem -> Data -> Metric -> Ethics -> back to Problem","Write 'APPROVE BEFORE BUILD' stamp in middle","Add checklist under each corner"],wrongVsRight:{wrong:"Start coding AI immediately, figure out problem later",right:"Write 1-page blueprint, get feedback, then code"},bridgeQ:"What happens if you collect data first and then realize you have no user problem? Waste?"},examples:[{title:"Plant Doctor Blueprint",story:"User: school gardener, Problem: can't spot sick plants early, loses crops. Data: 100 leaf photos with consent, labeled healthy/sick.",howItWorks:"Metric: 85% accuracy + works for all leaf colors + gardener says saves 2h/week. Ethics: benefits gardener, harmed none if anonymized, missing: diverse lighting.",whereToSee:"Capstone template example",discussionQ:"Is metric enough?",whatIf:"What if data only from sunny days?",ethicsLens:{benefits:"Saves crops, helps gardener",harmed:"None if done ethically",missing:"Night photos, rainy",trafficLight:"Green"}},{title:"Hallway Traffic Blueprint",story:"Problem: crowded hallway at 3rd period. Data: camera counts dots, not faces, consent from principal.",howItWorks:"Metric: count accuracy 90% + no faces stored + students feel safe survey. Ethics: consent for counting, not identifying.",whereToSee:"School safety project",discussionQ:"Why dots not faces matters?",whatIf:"What if principal wants faces later?",ethicsLens:{benefits:"Less crowding",harmed:"Students if faces stored",missing:"Student voice in decision",trafficLight:"Yellow"}},{title:"Recycling Sorter",story:"Problem: recycling bins contaminated. Data: 200 photos of trash with permission from custodians.",howItWorks:"Metric: 80% correct sorting + custodians report less contamination. Ethics: benefits custodians, not replacing them.",whereToSee:"Eco capstone",discussionQ:"Who owns model?",whatIf:"What if data from internet, not school bins?",ethicsLens:{benefits:"Cleaner recycling",harmed:"None if augments",missing:"Different bin types",trafficLight:"Green"}},{title:"Mood Helper - Risky",story:"Problem: detect sad students from messages. Data: private messages scraped without consent.",howItWorks:"Metric: 95% sad detection but privacy violation, no consent, could harm vulnerable students.",whereToSee:"Risky example - do NOT do",discussionQ:"Why is this Red light even if accurate?",whatIf:"What if with consent and counselor involved?",ethicsLens:{benefits:"Could help counselor",harmed:"Students privacy, trust",missing:"Consent, counselor partnership, opt-in",trafficLight:"Red"}},{title:"Lost & Found",story:"Problem: lost items in lost&found not claimed. Data: photos of lost items with permission, labeled.",howItWorks:"Metric: 75% match found item to owner description + front desk saves 30min/day.",whereToSee:"School ops",discussionQ:"Good problem?",whatIf:"What if includes faces on items?",ethicsLens:{benefits:"Items returned",harmed:"None if items only",missing:"None",trafficLight:"Green"}},{title:"Homework Helper Blueprint",story:"Problem: students stuck on math at night. Data: 50 practice problems created by students, with consent to share.",howItWorks:"Metric: helps student get unstuck within 5 min + does NOT give direct answer + students report learning.",whereToSee:"Learning aid capstone",discussionQ:"Should AI give answer or hint?",whatIf:"If it gives answers, does it help learning?",ethicsLens:{benefits:"Learning support",harmed:"If gives answers, harms learning",missing:"Teacher guidance on hint vs answer",trafficLight:"Yellow"}}],physical:{title:"Blueprint Boards",concept:"Physical blueprint with 4 corners",materials:["micro:bit","poster board","sticky notes"],wiring:"micro:bit displays Problem -> Data -> Metric -> Ethics in loop. Button to pause on current corner.",code:["on start: show Problem icon ❓","on A: next corner: Data \uD83D\uDDC2️ -> Metric \uD83D\uDCCF -> Ethics ⚖️ -> Problem","on B: show checklist for current corner","Loop reminder: No code until blueprint approved"],noTech:"Poster divided into 4 quadrants, team fills sticky notes, gets peer approval stamp before building.",tip:"Require peer signature: another team must approve blueprint before coding allowed."},community:{prompt:"Share blueprint drafts for peer feedback",pooled:["Plant: Problem gardener, Data 100 photos consent, Metric 85% + gardener survey","Lost&Found: Problem front desk, Data item photos, Metric time saved","Recycling: Problem custodian, Data bin photos, Metric contamination reduction"],privacy:"Only problem + data plan summaries, no personal photos"},lesson90:{prep:{objective:"Students draft complete blueprint: problem + data plan + metric + ethics card",materials:"Blueprint template 1-page, 12 problem example cards, stamp APPROVED",setup:"Print templates, set peer review stations"},flow:[{phase:"Hook",time:"0-10m",goal:"Feel building without blueprint waste",script:"I will build a house with no blueprint. *starts stacking random boxes* Where is door? Oops. Windows? This is what happens when we code AI without plan - we waste time. Today we draw blueprint so we build right house first time. Who has built Lego without instructions? Chaos?",action:"Watch chaotic building, laugh, discuss",materials:"Boxes",check:"Green: Student says need plan before build",stuck:"Orange: Ask what happens if you bake cake without recipe?"},{phase:"Mental Model",time:"10-25m",goal:"Blueprint 4 corners",script:"Blueprint has 4 corners: Problem - who hurts and what? Data - where from, permission? Metric - how know it works besides accuracy? Ethics - who benefits, harmed, missing? We loop Problem -> Data -> Metric -> Ethics until all Green. Sketch with me and stamp APPROVE BEFORE BUILD.",action:"Sketch 4 corners, copy",materials:"Board",check:"Green: Sketch shows loop and approval stamp",stuck:"Orange: Show pre-made blueprint poster, point corners"},{phase:"Explore",time:"25-45m",goal:"Critique 6 blueprints",script:"Six blueprints on wall - some Green, some Red. Your job: use checklist, mark traffic light. Which is missing consent? Which metric only accuracy no fairness? Which problem not real? You have 15 min, then vote best blueprint to build.",action:"Gallery walk, critique, vote",materials:"Blueprint examples",check:"Green: Can name one flaw in Red blueprint",stuck:"Orange: Check consent: does data have permission slip?"},{phase:"Build",time:"45-70m",goal:"Draft own blueprint",script:"Now your turn. Pick problem from 12 examples or own idea. Fill 1-page blueprint: Problem sentence: As a [user], I need [help] because [pain]. Data plan: source, consent, size. Metric: accuracy + fairness + time saved. Ethics card. Use template. No coding yet - blueprint first.",action:"Fill template, peer review",materials:"Template, problem cards",check:"Green: Blueprint includes consent plan and metric beyond accuracy",stuck:"Orange: Provide sentence starters for each corner"},{phase:"Ethics Discuss",time:"70-80m",goal:"Peer approval",script:"Swap blueprints with another team. They act as ethics board: check traffic light for each corner. If any Red, give feedback how to make Green. They must sign APPROVED only if all Yellow or Green. No approval, no building. Real companies do this.",action:"Peer review, sign",materials:"Approval stamp",check:"Green: Received feedback and revised one corner",stuck:"Orange: Use checklist: consent? ownership? explainability? jobs?"},{phase:"Reflect",time:"80-90m",goal:"Next step plan",script:"Final 10 min: write next step list for W36 build week. What data to collect tomorrow? Who to ask for consent? What micro:bit prototype? Put blueprint on wall. We start building next week only if blueprint approved. Great builders plan.",action:"Write next steps, post blueprint",materials:"Wall space",check:"Green: Next steps list includes data collection with consent",stuck:"Orange: List 3 tasks: ask gardener, make consent slip, take 10 photos"}]},unplugged:{title:"Blueprint Approval Board",roles:{Trainer:"Proposes problem",Model:"Proposes data plan",Tester:"Proposes metric",Recorder:"Proposes ethics card"},materials:"Blueprint poster, sticky notes, approval stamp",steps:["Trainer writes problem sentence","Model adds data plan with consent","Tester adds metric including fairness","Recorder adds ethics card benefits/harmed","Team rotates to next team's board, acts as board, checks traffic lights","If Red, write fix-it note, return","Revise until approved, stamp"],variations:{fast:"One blueprint team",slow:"Include ownership pie and explainability bars in blueprint"},observe:"Do teams skip ethics corner? Do metrics include only accuracy?",mistakes:["Problem too vague: 'help everyone'","Data plan no consent","Metric only accuracy"]},workbook:{ethicsCase:"Mood helper blueprint uses private messages without consent - rewrite to make Green.",task:"Fill full blueprint template for your chosen problem. Get peer approval signature.",exit:"What are 4 corners of blueprint and why approve before build?"}},{id:"W36",weekNum:"W36",title:"Capstone Expo",subtitle:"AI Builder Showcase - Demo + Metrics + Ethics",mental:"Science Fair",color:"#6D28D9",accent:"#059669",teacherEmpowerment:{whatIsThisReally:"Capstone Expo is culminating science-fair style showcase where students demo AI that helps community, with metrics and ethics card. Origin in project-based learning and MIT App Inventor showcases. Structure: 3-minute pitch - Problem 30s, Demo 60s, Data 30s, Metrics 30s, Ethics 30s, Next Step 30s. Why matters: builds communication, accountability, and pride. Students shift from consumer to builder who can explain not just what they built but why it matters and who it impacts.",why7thGradersNeedThis:"Students need audience beyond teacher - real users like gardener, custodian, librarian. Expo gives purpose and feedback. They practice explaining AI without jargon, showing metrics like fairness, and owning ethical choices. This is builder identity: I can build AI that helps everyone, and I can explain how.",realWorldBehindTheScenes:"Real demo days: founders have 3 min, live demo, metrics slide, ethics/limitations slide, next step ask. Judges ask: how did you get data ethically? How do you know it works for everyone? What would you do with $1000 more? Students rehearse same.",kidQA:[{q:"What if my demo fails live?",a:"Have backup video. Real builders always have backup. Explain what failed and what you learned - failure is data."},{q:"Do I need to be 100% accurate?",a:"No. Show your metric, explain limitations, and next step to improve. Honest metrics + ethics > perfect accuracy."},{q:"What goes on ethics card?",a:"Who benefits, who could be harmed, what's missing in data, traffic light, and your fix plan. Like nutrition label for AI."}],vocab:[{term:"Capstone",teacherDef:"Culminating project showing all skills",kidDef:"Final showcase of what you learned",pronunciation:"CAP-stone",visualCue:"\uD83C\uDFDB️ top stone"},{term:"Demo",teacherDef:"Live demonstration of working prototype",kidDef:"Show it working live",pronunciation:"DEM-oh",visualCue:"\uD83C\uDFAC play"},{term:"Pitch",teacherDef:"Short persuasive explanation of problem and solution",kidDef:"3-min story to convince",pronunciation:"PITCH",visualCue:"\uD83C\uDFA4 mic"},{term:"Metrics",teacherDef:"Numbers proving it works + fair",kidDef:"Proof it helps",pronunciation:"MET-riks",visualCue:"\uD83D\uDCCA"}]},mentalModelDeep:{name:"Science Fair",teacherAnalogy:"Science fair has board: Question, Method, Data, Results, Conclusion, Next Steps. Capstone Expo same: Problem (question), Data Plan (method), Demo (experiment), Metrics (results), Ethics Card (limitations), Next Step (future). Judges ask not just did it work, but how do you know, who did it help, what would you do next. 3-minute pitch forces clarity.",studentAnalogy:"Like science fair - show problem, demo, data, metrics, ethics, next step in 3 minutes.",sketchSteps:["Draw science fair board with 6 boxes","Label: Problem 30s | Demo 60s | Data 30s | Metrics 30s | Ethics 30s | Next 30s","Add timer 3:00 at top","Draw audience with question marks","Write rule: Demo + Backup video + Ethics card must be visible"],wrongVsRight:{wrong:"Show only accuracy and cool demo, skip ethics and limitations",right:"Show accuracy + fairness + who benefits/harmed + what missing + next step"},bridgeQ:"If you have only 3 minutes, what would you cut and what must stay?"},examples:[{title:"Plant Doctor Live",story:"Team shows gardener app: photo leaf, AI says healthy 90%, sick 10%, shows explanation spots important. Gardener tests live.",howItWorks:"Demo: take photo, prediction, LIME bars. Metrics: 85% accuracy, works for 3 lighting, gardener saves 2h. Ethics Green.",whereToSee:"Expo demo example",discussionQ:"What makes this pitch strong?",whatIf:"What if gardener says not helpful?",ethicsLens:{benefits:"Saves crops",harmed:"None",missing:"More plant species",trafficLight:"Green"}},{title:"Recycling Helper",story:"Team demos bin camera: shows trash, AI says recycling vs compost, displays ownership pie - custodians co-owners.",howItWorks:"Live sorting, metric contamination down 30%, ethics card shows custodians benefit, not replaced.",whereToSee:"Eco expo",discussionQ:"How does ownership pie help?",whatIf:"If accuracy 60% only?",ethicsLens:{benefits:"Cleaner bins",harmed:"None if augments",missing:"Need more bin images",trafficLight:"Green"}},{title:"Lost & Found Matcher",story:"Front desk lady tests: describes lost water bottle, AI finds top 3 matches from photos.",howItWorks:"Demo with real lost items, metric time saved 20min/day, ethics: only items, no faces.",whereToSee:"School ops expo",discussionQ:"Why time saved is good metric?",whatIf:"What if matches wrong owner?",ethicsLens:{benefits:"Items returned faster",harmed:"Wrong match risk low",missing:"Need owner verification step",trafficLight:"Yellow"}},{title:"Library Recommender",story:"Librarian tests: student likes adventure books, AI recommends 3 with explanation: adventure 70% + age appropriate 30%.",howItWorks:"Shows consent: uses only 30-day history, deletable. Metric: students say 80% recommendations liked.",whereToSee:"Library expo",discussionQ:"Why explanation matters for books?",whatIf:"If it only recommends popular books?",ethicsLens:{benefits:"More reading",harmed:"None if diverse",missing:"Diverse authors check",trafficLight:"Green"}},{title:"Hallway Counter",story:"Shows dot counting not face tracking. Principal asks privacy, team shows no faces stored, only counts.",howItWorks:"Demo: camera shows dots, count 12, no images saved. Metric: 92% count accuracy + 100% students feel safe in survey.",whereToSee:"Safety expo",discussionQ:"How does dot vs face change ethics?",whatIf:"If school wants faces for safety?",ethicsLens:{benefits:"Safety without surveillance",harmed:"None with dots",missing:"Student council approval documented",trafficLight:"Green"}},{title:"Failed Demo + Learning",story:"Team's gesture AI fails live - lighting changed. They show backup video, explain limitation, propose next step: add diverse lighting data.",howItWorks:"Honest metrics: 70% in classroom, 40% in hallway. Ethics Yellow due to lighting bias. Next: collect hallway data.",whereToSee:"Great expo - failure as learning",discussionQ:"Is this still good project?",whatIf:"Should they hide failure?",ethicsLens:{benefits:"Honesty, learning",harmed:"None",missing:"Hallway data",trafficLight:"Yellow"}}],physical:{title:"3-Min Pitch Timer",concept:"micro:bit as pitch timer with sections",materials:["micro:bit","pitch script"],wiring:"Button A starts 3-min timer, shows section: Problem 30s -> Demo 60s -> Data 30s -> Metrics 30s -> Ethics 30s -> Next 30s with beep.",code:["on A: start timer 180s","0-30s: show P for Problem","30-90s: show D for Demo beep","90-120s: Data","120-150s: Metrics","150-180s: Ethics","180s: NEXT beep, show ✅"],noTech:"Human timer holds cards: Problem, Demo, Data, Metrics, Ethics, Next, flips every 30/60s.",tip:"Practice with timer - most teams run long on demo, cut ethics. Force ethics stays."},community:{prompt:"Gallery of capstones from other schools - vote and remix",pooled:["Plant Doctor v2 from Lincoln MS - added night photos - 89% accuracy","Recycling Sorter - Jefferson MS - 200 bin photos - Green ethics","Lost&Found - Riverside - front desk testimonial: saves 15min/day","Library Recommender - Parkside - consent toggle for 30 days"],privacy:"School names only, no student names, no photos, anonymized metrics"},lesson90:{prep:{objective:"Students deliver 3-min pitch with demo + metrics + ethics card",materials:"Pitch timer, ethics card template, metrics template, backup video setup",setup:"Expo stations, judges (other teachers, gardener, librarian), voting dots"},flow:[{phase:"Hook",time:"0-10m",goal:"Feel expo energy",script:"Welcome to AI Builder Expo! Today you are not students, you are builders showing work that helps our school. We have real users here - gardener, librarian, custodian. You have 3 minutes to convince them your AI helps and is ethical. Let's watch one perfect pitch video - 3 min timer. Notice structure.",action:"Watch example pitch, note structure",materials:"Video example",check:"Green: Can name 6 parts of pitch",stuck:"Orange: Show checklist on wall: Problem Demo Data Metrics Ethics Next"},{phase:"Mental Model",time:"10-25m",goal:"Science Fair model",script:"Science fair board = our pitch. Problem 30s: who hurts? Demo 60s: show it live! Data 30s: where from, consent? Metrics 30s: accuracy + fairness + time saved. Ethics 30s: who benefits, harmed, traffic light. Next 30s: what would you do with $100 or more time? Sketch board with me.",action:"Sketch board, allocate times",materials:"Board",check:"Green: Can allocate time per section",stuck:"Orange: Which part would you cut if only 2 min? Can't cut ethics!"},{phase:"Explore",time:"25-45m",goal:"Critique pitches",script:"We have 6 pitch videos - some strong, some missing ethics, some no metrics beyond accuracy. You are judges. Use rubric: Problem clear? Demo live? Data consent? Metrics beyond accuracy? Ethics card? Next step? Give one glow, one grow. 12 minutes gallery.",action:"Watch pitches, judge with rubric",materials:"Rubric, videos",check:"Green: Can give one glow one grow using rubric language",stuck:"Orange: Focus on one: did they show consent?"},{phase:"Build",time:"45-70m",goal:"Rehearse pitch with timer",script:"Now rehearse your pitch with micro:bit timer. Button A starts. Problem 30s, Demo 60s - have backup video ready if live fails, Data 30s, Metrics 30s show your chart, Ethics 30s show traffic light, Next 30s. Practice twice, partner gives feedback: too long on demo? Ethics clear? Go!",action:"Rehearse with timer, feedback",materials:"micro:bit timer, scripts",check:"Green: Completes within 3:15 with all 6 parts",stuck:"Orange: Use script template fill-in: As a [user], I built... My demo shows... My data... Metrics... Ethics... Next..."},{phase:"Ethics Discuss",time:"70-80m",goal:"Live expo",script:"Expo time! Each team pitches to real audience. Audience will ask: How did you get consent? How know it works for everyone? Who could be harmed? What next? Be honest about limitations - honesty scores higher than perfect accuracy. I will time, you pitch.",action:"Live pitches, Q&A",materials:"Expo stations",check:"Green: Team answers ethics question with traffic light and fix",stuck:"Orange: If stuck, point to ethics card: who benefits/harmed?"},{phase:"Reflect",time:"80-90m",goal:"Vote and next step",script:"Vote for favorite capstone not your own with dot. But also write one idea you want to remix for future - what would you borrow? And write your next step if you had $100 and one more month. Put ethics card on Ethics Wall. You are now AI Builders who help everyone.",action:"Vote, remix note, next step, post ethics card",materials:"Dots, wall",check:"Green: Next step includes data or fairness improvement, not just accuracy",stuck:"Orange: What data missing? What group not tested?"}]},unplugged:{title:"Expo Pitch Practice",roles:{Trainer:"Problem presenter 30s",Model:"Demo doer 60s",Tester:"Metrics + Ethics 60s",Recorder:"Next step + timekeeper"},materials:"Timer, pitch cards, ethics cards",steps:["Trainer: 30s Problem - who hurts","Model: 60s Demo - live or video","Tester: 30s Data + 30s Metrics","Recorder: 30s Ethics card + 30s Next step","Audience asks 1 ethics question","Switch roles, pitch again faster","Vote best pitch, give glow/grow"],variations:{fast:"2 min pitch",slow:"Add ownership pie and explainability bars to pitch"},observe:"Do teams spend too long on demo and skip ethics? Do metrics include fairness?",mistakes:["Demo only, no metrics","Accuracy only, no fairness","No ethics card","Running over time, skipping next step"]},workbook:{ethicsCase:"Your demo fails live. Write backup plan and how to honestly present limitation as learning.",task:"Fill pitch template: Problem 30s script, Demo steps, Data consent note, Metrics chart, Ethics card, Next step.",exit:"What are 6 parts of 3-min pitch and why ethics must stay?"}}],wh=[{id:"learn",label:"Learn W31-36",icon:"\uD83D\uDCDA"},{id:"physical",label:"Physical Lab",icon:"\uD83D\uDD27"},{id:"community",label:"Community Pool",icon:"\uD83C\uDF10"},{id:"studio",label:"Project Studio",icon:"\uD83C
