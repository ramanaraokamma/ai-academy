-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z",key:"1xq2db"}]]);var vc=Ve(xt(),1),Xf=Symbol.for("react.element");var Zf=Object.prototype.hasOwnProperty,Jf=vc.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,jf={key:!0,ref:!0,__self:!0,__source:!0};function yc(e,t,n){var r,i={},o=null,a=null;n!==void 0&&(o=""+n),t.key!==void 0&&(o=""+t.key),t.ref!==void 0&&(a=t.ref);for(r in t)Zf.call(t,r)&&!jf.hasOwnProperty(r)&&(i[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)i[r]===void 0&&(i[r]=t[r]);return{$$typeof:Xf,type:e,key:o,ref:a,props:i,_owner:Jf.current}}var u=yc,d=yc;var wc=[{id:"W19",num:19,title:"Lean Startup for AI",subtitle:"Build - Measure - Learn",mentalModel:"Science Experiment for Business",mentalModelDesc:"Test hypothesis quickly like a scientist, not like a CEO with a 100-page plan.",color:"#10B981",accent:"#059669",teacherBackground:{history:"Lean Startup was codified by Eric Ries in 2011 after his startup IMVU nearly failed building something nobody wanted for 6 months. He borrowed from Toyota's Lean Manufacturing (1950s) and Steve Blank's Customer Development (2005). For AI, Lean is even more critical because model training is expensive. The 2022-2023 generative AI boom showed this: thousands of AI wrappers failed because they built without testing demand. The core loop is Build a tiny test -> Measure real user behavior -> Learn if hypothesis was true. In 2011 Ries said 'The only way to win is to learn faster than anyone else.' For 9th graders, this reframes business from 'have a big idea' to 'run cheap experiments.'",whyNeed:"9th graders think entrepreneurship = Shark Tank big pitch with perfect product. That leads to fear of starting and waste. Lean Startup teaches experimental mindset, embraces failure as data, and saves compute cost. In AI, a single GPT-4 fine-tune can cost $500. If you test your idea with 10 interviews first, you avoid burning money. This builds scientific thinking + financial literacy. Students learn that successful founders are not gamblers but rigorous testers. It's also a direct anti-perfectionism tool for Gen Z anxiety.",realWorld:["OpenAI: Before ChatGPT, they tested GPT-3 via API playground with 20 companies to see which use-cases stuck (writing, not search).","Midjourney: Started as private Discord bot with 1,000 beta testers measuring image satisfaction before building a website.","Dropbox: Drew Houston made a 3-min video MVP to test if people wanted sync, got 75k signups overnight - no code built yet."],kidQA:[{q:"But don't you need money to start a startup?",a:"No - Lean says start with a conversation. The cheapest experiment is asking 5 people: 'How do you currently solve this problem?' If they don't have the problem, you saved months."},{q:"What if my experiment fails?",a:"Then you learned! Science experiments fail 90% of time. In Lean, a failed test is success because you didn't waste time building. You pivot - change one thing, test again."},{q:"Can AI really be lean when training is expensive?",a:"Yes - use existing models! Don't train your own. Use ChatGPT API, prompt engineering, or a rule-based fake. Test value before cost. That's AI Lean."}],vocab:[{term:"Hypothesis",def:"A testable guess about your customers.",example:"'9th graders want AI to summarize their history notes.'"},{term:"Validated Learning",def:"Learning proven by real user data, not opinion.",example:"10/10 students clicked your summary button = validated."},{term:"Pivot",def:"Changing strategy based on what you learned.",example:"From summarizing notes to generating quiz questions after interviews."},{term:"Build-Measure-Learn",def:"The 3-step loop to run experiments fast.",example:"Build landing page, measure signups, learn if idea works."}]},mentalModelDeep:{teacherAnalogy:"Imagine you think plants grow better with soda vs water. You don't write a 50-page book about soda. You run an experiment: 2 plants, one soda, one water, measure for a week. Business is the same. Your startup idea is a hypothesis like 'Students will pay $5/month for AI homework help.' You design the smallest experiment to test it. This is opposite of old business plans that took 6 months to write and were wrong anyway. Lean says: Be a scientist, not a fortune teller.",studentAnalogy:"You think a new TikTok dance will go viral. You don't rent a stadium and hire dancers. You film a 15-sec version on your phone, post it, measure views/comments in 1 hour. If it flops, you change the music. That's Build-Measure-Learn. Lean Startup = TikTok for business.",sketchSteps:[{step:"Question",draw:"Draw magnifying glass + '?': What do I believe about users?",sec:"0-12s: Write hypothesis sentence."},{step:"Smallest Test",draw:"Draw tiny Lego brick, not castle: Smallest thing to test it.",sec:"12-24s: e.g., interview, landing page, paper prototype."},{step:"Measure Real Behavior",draw:"Draw eye + chart: What did users actually DO?",sec:"24-36s: Count clicks, not likes."},{step:"Learn & Decide",draw:"Draw brain with check/X: Was hypothesis true?",sec:"36-48s: Persevere or pivot."},{step:"Repeat Faster",draw:"Draw circular arrow with speed lines: Loop again cheaper.",sec:"48-60s: Next experiment even smaller."}],wrongVsRight:{wrong:"Wrong: Spend 3 months building AI app, then show friends who say 'cool' to be nice. Build big, measure late, learn nothing. Costs $200 in API calls, 100 hours.",right:"Right: Day 1: Ask 5 classmates to show how they study. Day 2: Fake AI summaries manually in Google Docs and see if they use it. Day 3: Only then build. Costs $0, 3 hours, real data."},bridgeQuestion:"If your AI startup idea is a science experiment, what is the ONE risky assumption that would kill it if false? How could you test that in 24 hours with $0?",deepDive:"In AI, Lean has extra layers: Data hypothesis (do we have data?), Model hypothesis (can AI do it well enough?), Value hypothesis (will users pay/change behavior?), Growth hypothesis (can we reach them?). Most AI founders test Model first (cool tech) but should test Value first (real pain). The riskiest assumption is almost never tech - it's that people care."},examples:[{title:"StudyBuddy AI - The Interview Test",story:"Maya thought 9th graders wanted AI to write essays. She interviewed 5 friends and learned they were scared of cheating detection. Real pain was organizing notes before tests.",howItWorks:"Build: 5 question interview script. Measure: Tally pains mentioned. Learn: Pivot from writing to organizing. No code needed.",whereToSee:"Look at Y Combinator Startup School interviews - they require 20 customer interviews before code.",discussionQ:"Why is asking about past behavior better than asking 'Would you use this?'",whatIf:"What if all 5 students say different pains? How do you decide?",ethics:{benefits:"Students get real help, not cheating tool",harmed:"If she built essay writer, could harm academic integrity",missing:"Students who don't speak up in interviews",trafficLight:"green"}},{title:"The $0 Landing Page",story:"Jamal made a fake homepage for 'AI Math Tutor' on Canva, added a 'Join Waitlist' button linked to Google Form. Shared in Discord. Got 2 signups in 3 days vs his hypothesis of 30.",howItWorks:"Build fake product image. Measure waitlist clicks. Learn demand is low or message wrong. Change headline and retest.",whereToSee:"Carrd.co + Google Forms - real founders use this stack in 10 minutes.",discussionQ:"Is a fake landing page lying? When does Lean become deceptive?",whatIf:"What if you get 100 signups but no product?",ethics:{benefits:"Saves waste, validates demand",harmed:"Waitlist users might feel misled",missing:"People not in your Discord",trafficLight:"yellow"}},{title:"Wizard of Oz AI",story:"Team built 'AI' schedule maker where behind the scenes, Priya manually made schedules for 5 teachers for a week, pretending it was AI.",howItWorks:"User thinks AI, human does work. Measures if automation is even wanted before building AI. Classic lean for AI.",whereToSee:"Zappos started with Nick Swinmurn photographing shoes at stores - he was the AI.",discussionQ:"How long can you be the wizard before you must build?",whatIf:"What if manual work is too hard to fake?",ethics:{benefits:"Tests value without compute cost",harmed:"User might trust fake AI accuracy",missing:"Discloses it's manual?",trafficLight:"yellow"}},{title:"Concierge MVP - AI Tutor",story:"Instead of app, Sofia did 1:1 tutoring but used ChatGPT to prep materials, measured if students improved. She was the concierge delivering service manually.",howItWorks:"Deliver service fully manual first. If students pay for manual, then automate parts.",whereToSee:"Food delivery apps started with founders personally delivering.",discussionQ:"How do you know when concierge is too much work vs good learning?",whatIf:"What if students love YOU, not AI?",ethics:{benefits:"High learning, human connection",harmed:"Not scalable, burnout risk",missing:"AI dependency hidden",trafficLight:"green"}},{title:"The Piecemeal MVP - No-Code AI",story:"Team connected Typeform -> Zapier -> ChatGPT API -> Gmail. No code. User fills form, gets AI summary via email. Built in 45 mins.",howItWorks:"Glue existing tools together. Measures real usage before custom code. Tests core value prop.",whereToSee:"Bubble.io, Glide, Zapier showcase pages full of this.",discussionQ:"If no-code works, do you ever need to code?",whatIf:"What if Zapier costs $50/month and you have 0 revenue?",ethics:{benefits:"Democratizes AI building",harmed:"Data flows through 3 companies - privacy?",missing:"Users with data privacy needs",trafficLight:"yellow"}},{title:"A/B Test Your Pitch",story:"Two headlines: A 'AI Makes Homework 10x Faster' vs B 'AI Helps You Understand, Not Cheat'. B got 3x more teacher shares.",howItWorks:"Same product, two messages. Measures which framing resonates. Cheap test of positioning, not product.",whereToSee:"Google Optimize, or just two Instagram stories with poll stickers.",discussionQ:"Should you change product or just message?",whatIf:"What if both fail?",ethics:{benefits:"Finds honest framing",harmed:"Clickbait version could mislead",missing:"Non-English speakers",trafficLight:"green"}}],physical:{title:"Lean Lab: Science Experiment Simulator",goal:"Run 3 lean experiments in 30 minutes with micro:bit as measurement tool.",materials:["micro:bit x1","Cardboard","Sticky notes","Marker","Phone timer"],steps:[{title:"Setup Hypothesis Board",detail:"Write: 'We believe [student type] wants [AI help] to [outcome].' Pin on cardboard."},{title:"Build Counter",detail:"Program micro:bit: Button A = interview completed, Button B = pain validated. Shows count. Shake to reset. Code counts experiments."},{title:"Run Interview Sprint",detail:"In pairs, 5-min interviews with 3 other students. Press A after each. Tally pains on sticky notes."},{title:"Measure Pivot Decision",detail:"If <2/3 mention same pain, must pivot hypothesis and retest. Press B if validated."},{title:"Debrief Loop",detail:"How many loops did you run? Fastest team wins. Reflect: What surprised you?"}],code:`let interviews=0, validated=0
input.onButtonPressed(Button.A, ()=>{interviews++; basic.showNumber(interviews)})
input.onButtonPressed(Button.B, ()=>{validated++; basic.showNumber(validated)})
input.onGesture(Gesture.Shake, ()=>{interviews=0; validated=0; basic.clearScreen()})`,microbitUse:"Acts as lean experiment counter - tangible Build-Measure-Learn loop tracker."},community:{prompt:"Submit your hypothesis + # interviews + pivot decision to class pool.",dataFields:["Hypothesis sentence","Interviews done","Top pain found","Pivot or persevere?","Time taken"],galleryExample:"Class 9A: 67% pivoted after interviews from 'AI writes essay' to 'AI organizes sources'."},script:{phases:[{name:"Hook - The $100k Mistake",minutes:10,teacherDoes:"Tell story of startup Juicero ($120M raised, built $400 juice press, nobody wanted it). Ask: How to avoid?",studentsDo:"Shout guesses. Write their own big idea that could fail.",checkFor:"They feel risk of building without testing."},{name:"Mental Model - Science Experiment",minutes:15,teacherDoes:"Draw experiment steps. Model your own hypothesis test live. Show magnifying glass sketch.",studentsDo:"Sketch 5 steps in 60-sec challenge. Share with partner. Identify wrong vs right.",checkFor:"Can explain why small test > big plan."},{name:"Examples - Lean Bank",minutes:15,teacherDoes:"Show 2 examples: Wizard of Oz and Landing Page. Deconstruct Build-Measure-Learn for each.",studentsDo:"In groups, analyze 2 more examples. Fill ethics lens traffic light.",checkFor:"Can label Build, Measure, Learn for new case."},{name:"Build - Lean Lab",minutes:30,teacherDoes:"Distribute micro:bits, show counter code. Time interview sprint. Facilitate pivots.",studentsDo:"Run interviews, use micro:bit counter, decide pivot/persevere, post to community pool.",checkFor:"Runs at least 2 loops, uses real data."},{name:"Share - Data Pool",minutes:15,teacherDoes:"Pull up live pool gallery. Highlight patterns: most common pivot.",studentsDo:"Gallery walk. Vote best pivot story. Add comment.",checkFor:"Compares their data to others."},{name:"Reflect - Experiment Journal",minutes:5,teacherDoes:"Bridge question: What's your riskiest assumption?",studentsDo:"Write 1-sentence hypothesis + 24hr $0 test in workbook.",checkFor:"Specific, testable next step."}]},unplugged:{roles:[{role:"Scientist",job:"Writes hypothesis and designs test"},{role:"Customer",job:"Role-plays user, gives honest pain"},{role:"Counter",job:"Tracks interviews with tally, calls pivot time"},{role:"Skeptic",job:"Asks 'How do you know?' - demands evidence"}],steps:["Form groups of 4, assign roles","Scientist writes hypothesis on paper","Customer interviews (3 min)","Counter tracks validations","Skeptic challenges evidence","Decide pivot/persevere, rotate roles, repeat"],variations:["Silent interview - only sticky notes","Hostile customer who hates AI","No talking - only landing page sketch","Time pressure - 2 min per loop"]},workbook:{prompts:["Write your AI idea as hypothesis: We believe [who] needs [what] because [why].","What is riskiest assumption? How to test with $0 in 24h?","Interview notes: 3 pains heard","Pivot decision: Keep or change? What changed?"],assessment:[{q:"Explain Build-Measure-Learn in your own words with example.",type:"short answer"},{q:"Design a Wizard of Oz test for your AI idea.",type:"diagram + text"},{q:"Analyze ethics: Who is missing from your interviews?",type:"ethics lens"}],rubric:["Hypothesis is specific and testable","Test costs $0 and under 24h","Uses real user behavior not opinion","Identifies pivot based on data","Ethics: considers who is excluded"]}},{id:"W20",num:20,title:"MVP - Minimum Viable Product with AI",subtitle:"Skateboard to Car",mentalModel:"Skateboard to Car",mentalModelDesc:"Don't build car parts in order. Build skateboard that moves, then bike, then car. Each version usable.",color:"#10B981",accent:"#047857",teacherBackground:{history:"MVP term coined by Frank Robinson in 2001, popularized by Ries and Steve Blank. But the Skateboard-to-Car visual was made by Henrik Kniberg at Spotify in 2013 to fix misunderstanding: MVP is not a broken car (wheel + chassis). It's a skateboard that actually gets you moving. For AI, this is critical because AI models are never 'done.' Midjourney's MVP was 10 Discord images, not a full app. The idea: Every increment must deliver value, not just be a component. 9th graders love building perfect apps - this breaks that.",whyNeed:"Students suffer from feature creep: 'My AI app will have chat, voice, images, scheduling, everything!' They never ship. MVP teaches constraint as creativity. Also teaches AI-specific: Use pre-trained models, don't train. An MVP for AI can be a prompt, not a model. This reduces compute anxiety and lets them ship in 90 minutes. Builds confidence and product thinking.",realWorld:["Midjourney MVP: Just a Discord bot with /imagine - no website, no app, no account system for 6 months. Still grew to $200M revenue.","ChatGPT MVP: Internal research demo with simple box, not product. They measured if people chatted more than 1 turn.","Amazon: Started as book list, not everything store. First version was literally Jeff emailing book list."],kidQA:[{q:"Is MVP just a crappy version?",a:"No - crappy car with no engine is not MVP. Skateboard is great at being skateboard. It moves you. Crappy car moves nobody. MVP = smallest thing that delivers real value."},{q:"How small is minimum?",a:"Can a stranger use it and get value in 5 minutes? If yes, it's viable. If you need to explain 10 minutes, too big."},{q:"What about AI accuracy? MVP will be bad.",a:"Perfect! Start with human help or set expectations: 'Beta - 70% accurate.' Measure if people still use it despite errors. That's learning."}],vocab:[{term:"MVP",def:"Smallest thing you can build that delivers value and teaches you.",example:"Paper sketch that people can click through."},{term:"Viable",def:"Actually usable, not broken.",example:"Skateboard moves; car wheel alone doesn't."},{term:"Iteration",def:"Version 2, 3, 4 improving each time.",example:"Skateboard -> Scooter -> Bike -> Car."},{term:"Fake Door",def:"Button that looks real but measures interest.",example:"'AI Voice Tutor' button that shows 'Coming soon' and counts clicks."}]},mentalModelDeep:{teacherAnalogy:"Imagine you need to cross a river. Wrong way: Build 1/4 of a bridge - you drown. Right way: Build a raft (skateboard), then rowboat (scooter), then ferry (bike), then bridge (car). Each gets you across, just better. For AI startup: Don't build 1/4 of your dream AI (data pipeline but no UI). Build a tiny raft that solves one tiny pain fully. My raft might be me manually summarizing notes with ChatGPT for 3 friends. That's skateboard - moves, viable.",studentAnalogy:"You want to make a viral YouTube channel. Wrong: Buy $2k camera, lights, intro animation, 10 videos at once. Right: Film 1 video on phone, post, see. Skateboard = 1 phone video that helps one person. Then improve.",sketchSteps:[{step:"List Dream Car",draw:"Draw car with 20 features: chat, voice, images...",sec:"0-12s: Write all features you WANT."},{step:"Find Skateboard",draw:"Circle 1 feature that alone helps: e.g., summarize notes.",sec:"12-24s: What is smallest usable?"},{step:"Build in 30min",draw:"Draw timer + hammer: Can you build skateboard in 30min?",sec:"24-36s: If not, smaller!"},{step:"Test Ride",draw:"Draw person on skateboard: Can 3 users get value now?",sec:"36-48s: Watch them use it."},{step:"Next Version",draw:"Draw scooter: What one thing makes skateboard -> scooter?",sec:"48-60s: Plan iteration, not final car."}],wrongVsRight:{wrong:"Wrong: AI Study App MVP = login + dashboard + chat + voice + PDF upload + quiz generator + progress tracker - none work well. Takes 20 hours, demo fails, no learning.",right:"Right: MVP = Paste notes into box, get 3 bullet summary using ChatGPT API. 1 page, 1 button, works. Takes 1 hour. 3 users say 'useful.' Next: add quiz button."},bridgeQuestion:"If your AI startup was a skateboard, what would it be? Can a stranger get value from it in 2 minutes with zero instructions?",deepDive:"AI MVP types: 1) Prompt MVP - just a good prompt in ChatGPT shared as template. 2) No-code MVP - Typeform + API. 3) Human-powered MVP - you do AI's job. 4) Single-feature app - one API call. Rule: If your MVP needs training a model, it's not an MVP. Use someone else's model. Your skateboard should roll on existing wheels (OpenAI, HuggingFace)."},examples:[{title:"The One-Button Summarizer",story:"Team's dream: full study app. Skateboard: one webpage with textarea and 'Summarize' button calling GPT-3.5. Used by 12 students in 2 days.",howItWorks:"Frontend only, API call, displays bullets. No login, no history. Measures: Do people paste notes? Do they copy summary?",whereToSee:"Try it: glitch.com ~ 'summarize-mvp' - 30 lines of JS.",discussionQ:"What did they learn by NOT building login?",whatIf:"What if summarizer is wrong 30% time?",ethics:{benefits:"Saves study time, accessible",harmed:"Over-reliance, wrong summary could mislead",missing:"Students without internet",trafficLight:"yellow"}},{title:"Paper Phone MVP",story:"Before code, Aisha drew phone screens on paper, had user tap with finger, she swapped papers as 'AI response.' Found users wanted voice, not text.",howItWorks:"Paper prototype, Wizard of Oz. No tech. Learns UX before code. Cheapest MVP.",whereToSee:"Stanford d.school paper prototype videos.",discussionQ:"When is paper better than code?",whatIf:"User says paper feels fake?",ethics:{benefits:"Inclusive, no tech barrier",harmed:"None",missing:"Blind users can't see paper",trafficLight:"green"}},{title:"Fake Door for AI Tutor Voice",story:"Added 'Talk to AI' button in app. Click shows 'Join waitlist for voice beta - we are testing if you want it.' 2% clicked vs 40% expected.",howItWorks:"Button measures demand without building voice tech. Saves months of work.",whereToSee:"Many apps use this - see Notion AI waitlist button history.",discussionQ:"Is fake door deceptive?",whatIf:"What if 60% click - you must build fast?",ethics:{benefits:"Avoids building unwanted feature",harmed:"Frustrates users who clicked",missing:"Users who don't notice button",trafficLight:"yellow"}},{title:"Midjourney's Discord Skateboard",story:"Midjourney didn't build app. MVP = Discord bot in one channel. Users typed /imagine. No gallery, no accounts. Just images. Validated demand for AI art before infrastructure.",howItWorks:"Used Discord as free hosting + community. Focused only on image quality, not UI.",whereToSee:"Midjourney history blog 2022.",discussionQ:"Why was Discord a good skateboard?",whatIf:"What if Discord banned them?",ethics:{benefits:"Low cost, community feedback",harmed:"Discord owns community, content moderation issues",missing:"People not on Discord",trafficLight:"yellow"}},{title:"Prompt as MVP",story:"Instead of app, Leo shared Google Doc with perfect prompt: 'Act as 9th grade biology tutor. Explain [topic] with analogy + 3 quiz Qs.' Shared link, 20 classmates used it.",howItWorks:"Prompt IS product. Zero code, pure prompt engineering. Tests value prop instantly.",whereToSee:"PromptBase marketplace - prompts sold as products.",discussionQ:"Can a prompt be a business?",whatIf:"What if OpenAI changes model and prompt breaks?",ethics:{benefits:"Zero compute, teachable",harmed:"Prompt could be copied easily",missing:"People without ChatGPT access",trafficLight:"green"}},{title:"Concierge to Automated - Gradual Skateboard",story:"Week1: Human does AI job. Week2: Human + template. Week3: API + human review. Week4: Full auto. Each week skateboard got better.",howItWorks:"Gradual automation, not big bang. Each version viable and teaches what to automate next.",whereToSee:"How Monzo bank started - humans approved loans before AI.",discussionQ:"How do you know what to automate next?",whatIf:"What if human is better than AI forever?",ethics:{benefits:"Safe transition, human oversight",harmed:"Human labor hidden as AI",missing:"Labor rights of human doing AI work",trafficLight:"yellow"}}],physical:{title:"Cardboard Skateboard to Car Lab",goal:"Physically build skateboard, scooter, bike, car from cardboard for AI idea.",materials:["Cardboard large","Scissors","Markers","micro:bit","Tape"],steps:[{title:"Dream Car Brainstorm",detail:"List 15 features of dream AI app on cardboard car outline."},{title:"Find Skateboard",detail:"Cut small cardboard rectangle - that's skateboard. Write ONE feature that alone helps. Must be buildable in 20 min."},{title:"Build Physical MVP",detail:"Build skateboard UI from cardboard + paper. Add micro:bit as 'AI button' that lights up when pressed (shows working)."},{title:"User Test Roll",detail:"3 classmates try to get value from skateboard in 60 sec. Note friction. micro:bit counts successful uses."},{title:"Iterate to Scooter",detail:"Add one more cardboard piece (scooter handle) = one more feature. Retest. What's next?"}],code:`input.onButtonPressed(Button.A, ()=>{basic.showIcon(IconNames.Happy); basic.pause(500); basic.clearScreen()})
input.onButtonPressed(Button.B, ()=>{for(let i=0;i<3;i++){basic.showIcon(IconNames.Skull); basic.pause(200); basic.clearScreen(); basic.pause(200)}})`,microbitUse:"Button A = MVP works (happy), Button B = MVP fails (skull). Counts viable uses."},community:{prompt:"Post photo of cardboard skateboard + 1-sentence value prop + # users who got value.",dataFields:["Skateboard feature","Photo","Users tested","Value delivered?","Next iteration"],galleryExample:"Gallery shows skateboards: 'Paste essay get thesis' 'Photo of notes get flashcards' etc."},script:{phases:[{name:"Hook - The Bridge",minutes:10,teacherDoes:"Show image: 1/4 built bridge vs raft. Which gets across river? Story of team who built half car and failed demo.",studentsDo:"Debate: What is viable vs not? Draw quick bridge vs raft.",checkFor:"Understand viable = usable alone."},{name:"Mental Model - Skateboard",minutes:15,teacherDoes:"Live demo: list dream app features (15), circle skateboard. Show cardboard example. 60-sec sketch challenge.",studentsDo:"Sketch 5 steps, find their skateboard feature. Pair share.",checkFor:"Can reduce dream to one-feature MVP."},{name:"Examples - MVP Bank",minutes:15,teacherDoes:"Dissect One-Button Summarizer and Midjourney examples. Show traffic lights.",studentsDo:"Groups analyze 2 examples, decide skateboard vs car parts. Ethics lens.",checkFor:"Labels viable vs component."},{name:"Build - Cardboard Lab",minutes:30,teacherDoes:"Give cardboard, show micro:bit happy/skull code. Timebox: 10 min skateboard, 10 min test, 10 min scooter.",studentsDo:"Build cardboard MVP, test with users, iterate, log to pool.",checkFor:"Physical artifact tested by 3 peers."},{name:"Share - Pool Gallery",minutes:15,teacherDoes:"Project gallery, highlight smallest skateboards that delivered most value.",studentsDo:"Gallery walk, vote 'Most Viable Skateboard', comment improvements.",checkFor:"Can articulate why smallest worked."},{name:"Reflect - MVP Promise",minutes:5,teacherDoes:"Bridge Q: What's your skateboard?",studentsDo:"Write MVP sentence: My skateboard is [feature] that helps [who] do [what] in [time].",checkFor:"One feature, specific user, time-bound."}]},unplugged:{roles:[{role:"Dreamer",job:"Lists all dream features"},{role:"Cutter",job:"Forces team to cut to one feature - the skeptic"},{role:"Builder",job:"Builds cardboard skateboard fast"},{role:"Tester",job:"Tries to break/use it, times value delivery"}],steps:["Dreamer lists 15 features in 2 min","Cutter must cut to 1 with team debate","Builder builds cardboard in 10 min","Tester times 3 users getting value","If >2 min, Cutter cuts more","Add one piece for scooter iteration"],variations:["Blind build - Builder can't see dream list","No tape - only folds","Tester is teacher","One-hand building"]},workbook:{prompts:["List 20 features of dream AI app, then circle skateboard (1 feature).","Draw skateboard -> scooter -> bike -> car for your idea.","What did users struggle with in skateboard test?","Fake Door test: What button would you add to measure demand for next feature?"],assessment:[{q:"Draw wrong vs right MVP for AI homework helper.",type:"diagram comparison"},{q:"Build a paper MVP and test with 2 users - document results.",type:"field test"},{q:"Ethics: If your skateboard AI is 70% accurate, how do you communicate that?",type:"ethics writing"}],rubric:["One feature clearly defined","Viable: user gets value without explanation","Buildable in <1 hour","Tested with 3 users","Next iteration identified based on test"]}},{id:"W21",num:21,title:"Business Model for AI",subtitle:"How AI Makes Money",mentalModel:"Lemonade Stand with AI",mentalModelDesc:"Compute costs like lemons. If lemons cost more than lemonade price, you lose money even if popular.",color:"#059669",accent:"#047857",teacherBackground:{history:"Business Model Canvas created by Alexander Osterwalder in 2008 PhD, now used by 5M+ startups. For AI, traditional models break because: 1) Compute cost is variable and high (GPT-4 query $0.03), 2) Data is asset and liability, 3) Model improvement costs. 2022 AI boom revealed many AI startups have 70% gross margins vs 90% for SaaS due to inference costs. Key AI business models: API (OpenAI), Subscription (Midjourney $30/mo), Usage-based (per image), Freemium + compute limits, Data flywheel (better with more users). 9th graders need lemonade stand because they understand COGS (cost of goods sold) intuitively.",whyNeed:"Students think AI = free magic. They don't realize every ChatGPT query costs electricity, GPUs, data center. If they build AI startup without pricing compute, they'll lose money even if viral. Lemonade stand makes cost tangible: Lemons = tokens/compute, Cups = users, Price = subscription. Also teaches data as ingredient: better lemons = better lemonade, but need to source ethically. Builds financial literacy + systems thinking.",realWorld:["OpenAI API: Charges per 1k tokens ~ $0.002-0.06. If you build app charging $5/mo but users use $10 of API, you bankrupt.","Midjourney: $30/mo for ~200 images. Each image costs them ~$0.02 compute. So gross margin = ($30 - $4)/30 = 87% - must manage.","Character.ai: Free but burns $200k/month in compute, relies on future monetization - classic AI business risk."],kidQA:[{q:"Why not just make it free?",a:"Free = you pay compute. If 10k users each cost $0.10/day = $1k/day = $30k/month. Who pays? Either investors, ads, or you shut down. Free is a business model only if you have plan for money later."},{q:"Can't we train our own AI to avoid API costs?",a:"Training costs even more! Training small model can cost $10k+ in GPUs. Plus you still pay inference. API is actually cheaper to start - like buying lemonade mix vs growing lemons."},{q:"What is data flywheel?",a:"More users -> more data -> better AI -> more users. Like lemonade stand where customer feedback makes recipe better, attracting more customers. But flywheel only works if you can collect data ethically."}],vocab:[{term:"COGS - Cost of Goods Sold",def:"Direct cost to make one unit.",example:"One lemonade: lemon $0.5, sugar $0.1, cup $0.1 = COGS $0.7"},{term:"Gross Margin",def:"(Price - COGS)/Price. Must be >50% to survive.",example:"Sell $2 lemonade, COGS $0.7, margin = 65% - good!"},{term:"Unit Economics",def:"Do you make money on ONE customer?",example:"One user pays $5, costs $6 in compute = bad unit economics."},{term:"Freemium",def:"Free basic, paid premium.",example:"Free 10 summaries/month, $5 for 100."}]},mentalModelDeep:{teacherAnalogy:"Lemonade stand: You buy lemons $20, sugar $5, cups $5 = $30 cost. You make 50 cups. Cost per cup $0.60. You sell at $1. Profit $0.40 per cup. If you sell 50, profit $20. AI version: Lemons = API tokens (GPT calls), Sugar = data labeling, Cups = hosting. If your AI tutor uses $0.05 per question in API, and user asks 100 questions/month, cost $5. If you charge $5, profit $0 - but you forgot hosting, so you lose. Many AI startups died this way in 2023. You must price above compute. Also, better lemons (better data) = better lemonade (better AI) = can charge more.",studentAnalogy:"You sell custom Spotify playlists made with AI. Each playlist costs you 1 ChatGPT call ($0.01) + 2 minutes of your time. If you charge $0, you lose. If you charge $0.50 and make 100 playlists, profit $49 but time cost? Business model = how you make money without burning out or going broke.",sketchSteps:[{step:"Ingredients Cost",draw:"Draw lemon pile with $: List all costs per use.",sec:"0-12s: Tokens, hosting, your time."},{step:"One Cup Math",draw:"Draw one cup + calculator: Price - cost = profit per user?",sec:"12-24s: Unit economics."},{step:"Customers Flow",draw:"Draw people line: How get customers? Free? Paid? School?",sec:"24-36s: Channels."},{step:"Lemonade Better?",draw:"Draw star on cup: What makes yours special vs others?",sec:"36-48s: Value prop + data flywheel."},{step:"When Profit?",draw:"Draw piggy bank: How many cups to break even?",sec:"48-60s: Break-even math."}],wrongVsRight:{wrong:"Wrong: 'My AI app will be free, get 1M users, then figure money.' Result: API bill $10k, no revenue, shutdown. Like giving free lemonade to whole school with no money for more lemons.",right:"Right: 'Free 5 uses/day to test, $3/mo for 100 uses. Each free user costs $0.02, paid user costs $0.50 but pays $3, margin $2.50. Need 20 paid to cover 100 free.' Explicit math."},bridgeQuestion:"For your AI MVP, what is your lemon (compute cost per use)? If 100 classmates use it daily, what is monthly cost? How will you price it to not lose money?",deepDive:"AI business model canvas 9 blocks: Customer Segments (who), Value Prop (why they care), Channels (how reach), Relationships (support), Revenue Streams (how money), Key Resources (data, model, team), Key Activities (prompting, evaluation), Key Partners (OpenAI, school), Cost Structure (tokens, data, labor). For 9th graders, focus on 3: Cost, Price, Value. If Cost > Price, no business. If Value < Price, no customers. Must balance. Also ethics: Data you use - did you get consent? Are you selling data?"},examples:[{title:"Token Lemonade Calculator",story:"Priya's summarizer: 500 tokens per summary ~ $0.001. 10 summaries/day per user = $0.01/day. 30 days = $0.30/month cost. She charges $2/month. Margin = 85% good! But if user does 100 summaries/day, cost $3 > $2, she loses.",howItWorks:"Calculate: tokens * price per token = cost per use. Multiply by usage. Set price higher. Add usage limits.",whereToSee:"OpenAI pricing page - calculate your app's cost right now.",discussionQ:"Should you limit heavy users or charge them more?",whatIf:"What if OpenAI doubles price?",ethics:{benefits:"Transparent cost, sustainable",harmed:"Heavy users (who need most help) pay more",missing:"Students who can't pay $2",trafficLight:"green"}},{title:"Midjourney Subscription Farm",story:"Midjourney: $10/mo basic = 200 images. Each image ~ 1 GPU second ~ $0.02. Cost 200*0.02=$4. Revenue $10. Profit $6. But users who generate 1000 images cost $20 > $10, so they limit or upgrade to $30 plan.",howItWorks:"Tiered subscriptions based on compute. More images = higher tier. Manages cost.",whereToSee:"Midjourney.com/pricing - see tiers.",discussionQ:"Is it fair to limit creativity by compute?",whatIf:"What if someone builds tool to bypass limits?",ethics:{benefits:"Predictable revenue, covers compute",harmed:"Low-income artists can't afford",missing:"Artists whose art was in training data without pay",trafficLight:"yellow"}},{title:"Duolingo AI Freemium",story:"Duolingo free with ads + limited hearts. Paid Super $7/mo unlimited + AI features. Free users see ads (revenue), convert 5% to paid. AI explains mistakes - costs tokens but drives conversion.",howItWorks:"Free tier as marketing, AI as premium incentive. Ads pay for free compute.",whereToSee:"Duolingo app - try free vs Super.",discussionQ:"Do ads harm learning?",whatIf:"What if free users never convert?",ethics:{benefits:"Free education for all",harmed:"Ads can be distracting, data tracking",missing:"Kids under 13 data",trafficLight:"yellow"}},{title:"Data Flywheel - Better Lemons",story:"Grammarly: More users write -> more corrections data -> better AI -> more users. Flywheel. But they must get consent to use data.",howItWorks:"User data improves model, model attracts users. Loop. Need privacy policy.",whereToSee:"Grammarly blog on how they improve model.",discussionQ:"Should users be paid if their data improves AI that makes money?",whatIf:"What if data is biased?",ethics:{benefits:"Product gets better for everyone",harmed:"If consent not clear, privacy violation",missing:"Users who opt out get worse product?",trafficLight:"yellow"}},{title:"API Business - Selling Lemons",story:"OpenAI doesn't sell lemonade, sells lemons (API) to others who make lemonade. $ per token. Pure B2B model. Very profitable if you own lemon farm (models).",howItWorks:"Build one great model, let 10k startups pay to use it. No need to find end users.",whereToSee:"OpenAI API docs - playground.",discussionQ:"Is it better to sell lemons or lemonade?",whatIf:"What if someone builds better lemon farm cheaper?",ethics:{benefits:"Enables many startups",harmed:"Centralized power, high prices for small devs",missing:"Open source alternatives",trafficLight:"green"}},{title:"School License - B2B Lemonade Stand",story:"Instead of charging students, sell to school: $500/year for all 500 students. School pays, students free. Cost $0.30*500*9 months=$1350, revenue $500 = loss! Need price $2000.",howItWorks:"B2B2C: Business sells to school who gives to kids. Must calculate total students * usage.",whereToSee:"Google Workspace for Education pricing.",discussionQ:"Should schools pay for AI or should it be free?",whatIf:"School says no budget?",ethics:{benefits:"Equitable access if school pays",harmed:"Schools with no budget excluded",missing:"Students not in that school",trafficLight:"green"}}],physical:{title:"Lemonade Stand Business Model Lab",goal:"Run real lemonade stand but with AI token costs as lemons.",materials:["Lemons or paper lemons","Cups","micro:bit","Price tags","Fake money"],steps:[{title:"Cost Your Lemons",detail:"Each paper lemon = $0.02 API call. Count lemons needed per AI summary. Write cost per cup."},{title:"Price Your Cup",detail:"Decide price: $1, $2, $3. Calculate profit per cup. Use micro:bit to track profit: A= sale, B= cost."},{title:"Sell to Customers",detail:"Other students are customers with fake $5. They decide to buy based on value prop you pitch in 20 sec."},{title:"Track Unit Economics",detail:"After 10 sales, micro:bit shows profit. If negative, must pivot price or reduce lemons (use fewer tokens)."},{title:"Flywheel Upgrade",detail:"If you get 5 customers, you unlock 'better lemons' (better prompt) that lets you charge $1 more. Simulate data flywheel."}],code:`let profit=0
input.onButtonPressed(Button.A, ()=>{profit+=100; basic.showNumber(profit/100)})
input.onButtonPressed(Button.B, ()=>{profit-=60; basic.showNumber(profit/100)})
// A= $1 sale, B= $0.60 cost`,microbitUse:"Tracks profit/loss in real time as you sell lemonade - tangible unit economics."},community:{prompt:"Submit your business model: cost per use, price, margin, break-even # users.",dataFields:["Cost per use","Price","Margin %","Break-even users","Free or paid?"],galleryExample:"Class average margin: 45% - many forgot hosting costs! Lesson: Compute matters."},script:{phases:[{name:"Hook - The Viral Bankruptcy",minutes:10,teacherDoes:"Story: AI app viral on TikTok, 100k users overnight, founder gets $20k API bill, shuts down. Ask: How could pricing have saved?",studentsDo:"Calculate: 100k * $0.05 = $5000/day! Shock.",checkFor:"Feel cost urgency."},{name:"Mental Model - Lemonade Stand",minutes:15,teacherDoes:"Draw lemonade stand with costs. Show token = lemon. Live calc: summarizer cost. Sketch 5 steps.",studentsDo:"Sketch steps, calculate their own lemon cost for MVP.",checkFor:"Can compute cost per use."},{name:"Examples - Business Models",minutes:15,teacherDoes:"Compare 3 models: subscription (Midjourney), freemium (Duolingo), API (OpenAI). Show margins.",studentsDo:"Groups pick one example, calculate margin, discuss ethics traffic light.",checkFor:"Can compute margin and identify who pays."},{name:"Build - Lemonade Lab",minutes:30,teacherDoes:"Set up stands, distribute micro:bits as profit trackers, be customer.",studentsDo:"Price lemonade, sell, track profit on micro:bit, adjust price based on data, post to pool.",checkFor:"Real profit/loss tracking, pivots price."},{name:"Share - Pool Math",minutes:15,teacherDoes:"Show pool: average margin, who has sustainable model? Highlight ethical pricing.",studentsDo:"Gallery walk, vote most sustainable + fair model.",checkFor:"Compares unit economics across ideas."},{name:"Reflect - Your Model",minutes:5,teacherDoes:"Bridge Q: Will you make or lose money at 100 users?",studentsDo:"Fill lean canvas cost & revenue boxes in workbook.",checkFor:"Specific numbers, not 'we will be free'."}]},unplugged:{roles:[{role:"Lemon Counter",job:"Counts token cost per use"},{role:"Price Setter",job:"Sets price, justifies value"},{role:"Customer",job:"Decides to buy or not with fake money"},{role:"Accountant",job:"Tracks profit, calls break-even"}],steps:["Counter calculates cost per AI use","Price Setter proposes price","Customer role-plays buying decision","Accountant calculates profit for 10, 100, 1000 users","If loss, team must change cost or price","Repeat with new value prop"],variations:["No calculators - estimate","Customer has $0 - must make free tier work","Sudden lemon price doubles","Competitor sells cheaper"]},workbook:{prompts:["My AI uses ____ tokens per use. At $0.002/1k tokens, cost = $____ per use.","If 50 classmates use it 5x/week, monthly cost = $____","Price I will charge: $____. Margin = ____%. Break-even = ____ users.","Data flywheel: What data do I get? How does it make AI better? Do I have consent?"],assessment:[{q:"Calculate unit economics for your MVP with real OpenAI pricing.",type:"math"},{q:"Compare 2 business models (freemium vs subscription) for your idea - pros/cons.",type:"comparison"},{q:"Ethics: Is it fair to charge students who need help most? Alternative model?",type:"ethics"}],rubric:["Cost per use calculated with real numbers","Price > cost with margin >50%","Break-even calculated","Considers free tier for equity","Ethics: consent for data flywheel discussed"]}},{id:"W22",num:22,title:"Pitch - How to Pitch AI Product",subtitle:"Story + Demo + Numbers",mentalModel:"Movie Trailer",mentalModelDesc:"Pitch is trailer for your product - not full movie. Show best scenes to make them want to watch.",color:"#059669",accent:"#10B981",teacherBackground:{history:"Pitch culture from Hollywood (trailer = 2 min to sell 2-hour movie) to Silicon Valley. First startup pitch decks: 1990s. Sequoia's famous writing a business plan template. For AI pitches, new element: Demo or it didn't happen. In 2023, AI demos became essential because AI is hard to understand without seeing. Key structure: Hook (problem), Hero (user), Magic (AI demo), Numbers (traction), Ask. Storytelling research: 65% retention for story vs 5% for facts. 9th graders need to pitch because they will pitch ideas whole life - to teachers, parents, investors, teammates.",whyNeed:"Students think pitch = reading slides. Movie trailer model teaches selection, emotion, brevity. Also crucial for AI: You must show AI working, not just describe. Live demo risk teaches preparation. Numbers teach honesty - no vanity metrics. Builds communication + confidence. Many students fear public speaking - trailer format makes it fun, not formal. They already know trailers from Marvel.",realWorld:["OpenAI ChatGPT launch: 5-min demo with live typing, not slides. Went viral.","Midjourney pitch: Just showed images, no words needed - demo as trailer.","Typical YC pitch: 3-min, 10 slides max: Problem, Solution, Demo, Traction, Team, Ask."],kidQA:[{q:"What if demo fails live?",a:"Have backup video of demo. Pros do both: live demo + recorded backup. Also pre-load prompts. Failing live is okay if you recover - shows real product."},{q:"Do I need to be charismatic?",a:"No - clarity > charisma. Trailer works because story, not actor. Structure your story: person with problem -> your AI helps -> life better. Practice 10x."},{q:"What numbers if I have no users?",a:"Use learnings: 'Interviewed 20 students, 15 said X' or 'MVP tested with 12, 10 completed task.' That's traction for early stage. Never fake numbers."}],vocab:[{term:"Hook",def:"First 10 sec to grab attention.",example:"'Raise hand if you've spent 2 hours on notes that AI could summarize in 2 minutes.'"},{term:"Traction",def:"Proof people want it.",example:"'12 students used MVP, 80% said they'd pay $2.'"},{term:"Ask",def:"What you want from audience.",example:"'We ask for $500 for API credits to test with 100 students.'"},{term:"Demo",def:"Live show of product working.",example:"Paste real notes, show summary in real time."}]},mentalModelDeep:{teacherAnalogy:"Movie trailer for Avengers: They don't show 2-hour plot. They show: 1) World in danger (problem), 2) Hero appears (your product), 3) 3 best action scenes (demo), 4) 'In theaters May' (ask). No trailer shows boring meetings or credits. Your AI pitch same: Don't show how you trained model (boring). Show: Student crying over notes (problem), your AI summary (hero), before/after demo (action scenes), 'We need testers' (ask). Trailer makes you FEEL, not just understand. AI pitches must make audience feel pain and relief.",studentAnalogy:"You want friends to play new game. You don't read rulebook. You show 10-sec clip of coolest moment: 'Look at this boss fight!' That's trailer. Pitch = 10-sec coolest moment of your AI product that makes them say 'Whoa, I want that.'",sketchSteps:[{step:"Problem Scene",draw:"Draw sad person + big problem: Who hurts?",sec:"0-12s: Hook with relatable pain."},{step:"Hero Enters",draw:"Draw your AI as superhero cape: How you solve?",sec:"12-24s: One-sentence solution."},{step:"Best 3 Shots",draw:"Draw 3 film frames: Demo 3 wow moments.",sec:"24-36s: Show, don't tell."},{step:"Numbers Flash",draw:"Draw chart rising: Proof it works.",sec:"36-48s: Traction, not hype."},{step:"Coming Soon",draw:"Draw 'Ask' marquee: What do you need?",sec:"48-60s: Clear ask + thanks."}],wrongVsRight:{wrong:"Wrong: 20 slides, reads each, explains transformer architecture, no demo, ends with 'Any questions?' Audience asleep. Like trailer that shows entire movie plot + credits.",right:"Right: 5 slides max, 2-min story: 'Maya, 9th grader, spends 3 hours on bio notes. We built AI that summarizes in 30 sec. Watch [demo]. 12 students saved 2 hours/week. We need 20 more testers this week.' Leaves wanting more."},bridgeQuestion:"If your AI startup was a movie, what is the 10-second scene that would make your classmates say 'I need that'? Can you demo it live in 30 seconds?",deepDive:"Pitch structure for AI: 1) Hook (10s): Question or story. 2) Problem (20s): Who, how painful, how many. 3) Solution (20s): Your AI in one sentence + why now (AI makes it possible). 4) Demo (60s): Live, real data, before/after. 5) How it works (20s): Simple - 'Uses GPT API + our prompt, costs $0.01/use' - no jargon. 6) Traction (20s): Real numbers. 7) Business (20s): Lemonade math. 8) Team (10s): Why you? 9) Ask (10s): Specific. Total 3 min. Practice with timer. Record yourself."},examples:[{title:"The Before/After Demo",story:"Team showed messy 2-page history notes (before) then AI summary 5 bullets (after) in 15 seconds. Audience gasped. No slides needed.",howItWorks:"Visual contrast is powerful. Show ugly real input -> beautiful AI output. Live.",whereToSee:"ChatGPT launch demo - before/after writing.",discussionQ:"Why is before/after more powerful than just after?",whatIf:"What if AI output is wrong during demo?",ethics:{benefits:"Shows real value",harmed:"If cherry-picked example, misleading",missing:"Cases where AI fails",trafficLight:"yellow"}},{title:"User Story Trailer",story:"'Meet Alex, 9th grader with dyslexia. Reading takes 2x longer. Our AI reads notes aloud and quizzes. Alex's grade went C to B.' Story, not stats.",howItWorks:"One persona, one journey, emotional arc. Audience remembers Alex, not features.",whereToSee:"Apple product launches - always user story.",discussionQ:"Is it okay to use real student's story? Privacy?",whatIf:"What if story is exaggerated?",ethics:{benefits:"Humanizes AI, shows impact",harmed:"If story not consented or anonymized",missing:"Other users with different needs",trafficLight:"yellow"}},{title:"The 10-Second Hook",story:"Started pitch with: 'Raise hand if you spent >1 hour on homework last night that AI could do in 1 min.' 90% raised hand. Instant attention.",howItWorks:"Question that makes audience feel problem in their body. Not 'Our TAM is...'",whereToSee:"Great TED talks - first 10 sec hook.",discussionQ:"What makes a good hook vs cringe?",whatIf:"What if no one raises hand?",ethics:{benefits:"Engages, makes relevant",harmed:"Could shame students who struggle",missing:"Students not in room",trafficLight:"green"}},{title:"Numbers That Matter",story:"Instead of 'We have AI', said: '12 students tested MVP, 10 finished homework 40% faster, 8 said they'd pay $2.' Real, small, honest > fake big.",howItWorks:"Traction = evidence, not claims. Small real > big fake.",whereToSee:"Y Combinator's 'What not to say' - no 'We will get 1% of market.'",discussionQ:"Is 12 users enough traction?",whatIf:"What if numbers are bad?",ethics:{benefits:"Honest, builds trust",harmed:"If numbers cherry-picked",missing:"Users who dropped off",trafficLight:"green"}},{title:"The Failure Trailer",story:"Team showed first MVP that failed: 'Our first summarizer was wrong 50% time. We learned users wanted quiz, not summary. So we pivoted.' Audience trusted them more.",howItWorks:"Shows learning, not perfection. Lean startup in pitch form. Vulnerability = credibility.",whereToSee:"Failure resume trend.",discussionQ:"Should you show failure in pitch?",whatIf:"What if failure is too big?",ethics:{benefits:"Models growth mindset",harmed:"None",missing:"None",trafficLight:"green"}},{title:"The Ask - Specific",story:"Bad ask: 'We need support.' Good ask: 'We need 15 students to test our MVP this week and $50 for API credits. Who will test? [hands]'. Specific, actionable.",howItWorks:"Ask must be so clear audience can say yes immediately. Not money, but next step.",whereToSee:"Kickstarter asks.",discussionQ:"What is appropriate ask for 9th graders?",whatIf:"What if no one says yes?",ethics:{benefits:"Respects audience time, clear",harmed:"Pressure to say yes",missing:"Those who can't volunteer",trafficLight:"green"}}],physical:{title:"Movie Trailer Pitch Lab",goal:"Create 60-sec pitch with live micro:bit timer and demo.",materials:["Phone for recording","micro:bit as timer/teleprompter","Cardboard clapperboard","Notes for demo"],steps:[{title:"Write Trailer Script",detail:"5 sentences: Hook (Q), Problem (story), Solution (1 line), Demo (what you'll show), Ask (specific). Under 60 sec."},{title:"Program Pitch Timer",detail:"micro:bit: Shows countdown 60->0, buzzes at 50 sec (wrap), 60 sec (stop). Button A starts timer."},{title:"Rehearse with Timer",detail:"Practice 3x with timer. Cut words if over. Record on phone, watch back."},{title:"Demo Dry Run",detail:"Prepare real notes to summarize live. Have backup screenshot if WiFi fails. Test 2x."},{title:"Pitch to 3 Audiences",detail:"Pitch to 1 friend (peer), 1 teacher (adult), 1 stranger (other class). Note different reactions. Log."}],code:`let time=60
input.onButtonPressed(Button.A, ()=>{
  time=60
  for(let i=0;i<60;i++){
    basic.showNumber(time-i)
    basic.pause(1000)
  }
  music.playTone(262,500)
})`,microbitUse:"Countdown timer and pace keeper - buzzes when time almost up, like real pitch event."},community:{prompt:"Upload 60-sec pitch video + transcript + traction numbers.",dataFields:["Pitch video link","Hook used","Demo worked? Y/N","Ask","# hands raised"],galleryExample:"Top pitches: 'Alex dyslexia story' got 22 test signups - best hook."},script:{phases:[{name:"Hook - Worst Pitch Ever",minutes:10,teacherDoes:"Show cringe pitch: reads slides, jargon, no demo, 10 min over. Ask: What went wrong?",studentsDo:"Roast pitch, list mistakes. Feel what bad feels like.",checkFor:"Can identify bad pitch traits."},{name:"Mental Model - Movie Trailer",minutes:15,teacherDoes:"Show Marvel trailer vs movie plot summary. Map to pitch structure. 60-sec sketch.",studentsDo:"Sketch trailer steps, rewrite cringe pitch as trailer.",checkFor:"Can transform features into story."},{name:"Examples - Pitch Bank",minutes:15,teacherDoes:"Show Before/After demo and User Story examples. Deconstruct hook, demo, numbers, ask.",studentsDo:"Groups analyze 2 pitches, score on story/demo/numbers, ethics check.",checkFor:"Can label hook/demo/traction."},{name:"Build - Trailer Lab",minutes:30,teacherDoes:"Distribute micro:bit timers, give script template, time rehearsals. Be audience.",studentsDo:"Write 60-sec script, program timer, rehearse 3x, record, pitch to 3 people, upload.",checkFor:"Under 60 sec, live demo, specific ask."},{name:"Share - Pitch Festival",minutes:15,teacherDoes:"Play top 3 pitches from pool, audience votes with hands for ask.",studentsDo:"Watch festival, vote, give one glow one grow feedback.",checkFor:"Gives actionable feedback."},{name:"Reflect - Trailer Promise",minutes:5,teacherDoes:"Bridge Q: What's your 10-sec wow scene?",studentsDo:"Write final pitch sentence in workbook + one improvement.",checkFor:"One wow moment identified."}]},unplugged:{roles:[{role:"Director",job:"Keeps pitch under time, calls cut"},{role:"Actor",job:"Delivers pitch"},{role:"Demo Operator",job:"Runs live demo, has backup"},{role:"Audience",job:"Watches, decides if they'd say yes to ask"}],steps:["Director gives clapperboard","Actor pitches 60 sec","Operator runs demo at 30 sec mark","Audience raises hand if they'd say yes to ask","Rotate roles, each pitches","Best pitch wins - re-shoot with feedback"],variations:["No slides allowed","Pitch in 30 sec only","Demo must fail once - recover","Audience is 5th graders - simplify","Pitch with only 5 words per slide"]},workbook:{prompts:["My hook: Question or story that makes audience feel problem in 10 sec: ___","Before/After demo: What messy input -> clean output will I show live?","Traction: Real numbers from tests: __ users, __% said __","Ask: Specific thing I need this week: ___","Record pitch, watch: What to cut?"],assessment:[{q:"Write 60-sec trailer script for your AI MVP with hook, problem, demo plan, numbers, ask.",type:"script"},{q:"Record pitch and self-evaluate: timing, clarity, demo success.",type:"video self review"},{q:"Ethics: Does your trailer overpromise? How to stay honest?",type:"ethics"}],rubric:["Under 60 sec (micro:bit timer)","Hook grabs in 10 sec","Live demo of real MVP","Real traction numbers, not hype","Specific ask audience can say yes to","Honest about limitations"]}},{id:"W23",num:23,title:"Ethics of AI Business",subtitle:"Who Benefits? Dark Patterns?",mentalModel:"Spider-Man Business",mentalModelDesc:"With great profit comes great responsibility. Power to help many = power to harm many.",color:"#047857",accent:"#10B981",teacherBackground:{history:"AI ethics in business emerged 2018 after scandals: Cambridge Analytica (data misuse), Amazon hiring AI bias, YouTube radicalization for profit. Researchers like Timnit Gebru, Joy Buolamwini showed AI harms. 2019: 84+ AI ethics guidelines published. 2022: EU AI Act. Key idea: Ethics not afterthought, but business model question. Dark patterns: UI tricks to make you do things you didn't intend (e.g., hiding cancel button). For AI startups, dark patterns are easy: addictive feeds, fake human, hidden costs. Spider-Man principle from 1962 comics but perfect for AI: Profit scales harm. 9th graders must learn before they build.",whyNeed:"Students will build AI that could affect 100s. Without ethics, they could build addictive homework app that keeps kids up until 2am, or plagiarize without attribution. Spider-Man gives them heroic identity: responsible builder, not just profitable builder. Also teaches critical consumer lens: Recognize dark patterns in apps they use. Builds moral reasoning + long-term thinking: Companies that are ethical last longer.",realWorld:["YouTube: Optimized for watch time -> promoted conspiracy -> profit but harmed democracy. Business model (ads) caused harm.","Character.ai: Teens formed attachments to AI bots, some harmed mental health. Who is responsible? Business that profits from engagement?","Duolingo: Uses streaks (dark pattern? motivator?) - ethical line. When does motivation become manipulation?"],kidQA:[{q:"If my AI makes money, isn't that enough?",a:"Money tells you people pay, not if you helped. Cigarettes make money but harm. For AI, if your study app helps grades but causes anxiety and cheating, is that success? Spider-Man asks: Who benefits AND who is harmed?"},{q:"What is dark pattern in AI?",a:"Example: AI tutor that says 'Your friends are ahead of you!' to make you anxious and pay. Or hides that it's AI, pretends human. Or makes cancel hard. Design that tricks."},{q:"Can ethical business still make money?",a:"Yes! Patagonia, Duolingo (mostly), Khan Academy. Ethical = trust = long-term profit. Unethical = short spike then crash when users realize."}],vocab:[{term:"Dark Pattern",def:"Trick in design that benefits business, harms user.",example:"Fake countdown 'Only 2 left!' to pressure buy."},{term:"Stakeholder",def:"Anyone affected by your business, not just customers.",example:"For AI tutor: students, teachers, parents, school, future self."},{term:"Consent",def:"Clear yes with understanding.",example:"User knows data is used to improve AI and says okay."},{term:"Bias",def:"AI works worse for some groups.",example:"AI summarizer works for English but not Spanish notes."}]},mentalModelDeep:{teacherAnalogy:"Spider-Man: Peter gets powers (great profit potential). He can use webs to save people or rob banks. Uncle Ben: 'With great power comes great responsibility.' AI startup power: You can reach 1000 students with one prompt. That means 1000x help OR 1000x harm if biased, addictive, or cheating tool. Responsibility scales with power. So before you launch, ask: If 1000x people use this, world better or worse? Example: AI that writes essays for you: 1 user cheats, small harm. 1000 users cheat, school system breaks, learning stops. Your business model must include responsibility: How prevent misuse? How ensure benefit?",studentAnalogy:"You have cheat code in video game that gives infinite money. You can use to help friends or ruin game economy. Same with AI business. You have code that can do homework for everyone. Do you sell cheat code or sell learning tool? Both make money, one helps, one harms.",sketchSteps:[{step:"Power List",draw:"Draw spider with webs: What power does your AI give you/users?",sec:"0-12s: Reach, speed, knowledge."},{step:"Who Benefits?",draw:"Draw happy faces: Who wins if this scales?",sec:"12-24s: List stakeholders who benefit."},{step:"Who Harmed?",draw:"Draw sad faces + cracks: Who could be harmed at 1000x?",sec:"24-36s: Cheating, bias, addiction, privacy."},{step:"Dark Pattern Check",draw:"Draw magnifying glass over UI: Any tricks? Hidden costs? Fake human?",sec:"36-48s: Audit your design."},{step:"Responsibility Fix",draw:"Draw shield: What guardrail will you add?",sec:"48-60s: Limit, disclaimer, opt-out, human review."}],wrongVsRight:{wrong:"Wrong: 'Our AI essay writer makes money, we add countdown timer to pressure buy, hide that it's AI, no limits. Profit first.' Spider-Man villain origin story.",right:"Right: 'Our AI study helper shows 'AI generated - verify' disclaimer, limits 5 summaries/day to prevent over-reliance, has teacher dashboard, doesn't write essays fully, includes ethics card. Profit + responsibility.' Spider-Man hero."},bridgeQuestion:"If 10,000 students use your AI startup tomorrow, what is one good and one harmful thing that could happen? What guardrail will you build this week to prevent harm?",deepDive:"Ethics framework: 1) Benefits: Who gains? How much? 2) Harmed: Who could be hurt, even indirectly? 3) Missing: Whose voice not in room? (Non-English, disabled, low-income). 4) Traffic Light: Green = helps without harm, Yellow = helps but watch, Red = harm outweighs help - don't launch. Dark patterns checklist: Forced continuity (hard to cancel), Hidden costs, Fake urgency, Misleading AI human, Addiction by design, Data hoarding. For AI, add: Plagiarism without attribution, Over-reliance, Bias, No consent for data. Students must fill ethics card for their MVP."},examples:[{title:"Essay Writer - Red Light",story:"AI that writes full essay from prompt. Benefits: Saves time. Harmed: Student doesn't learn, teacher can't assess, school integrity collapses at scale. Missing: Teachers, future employers who need real skills. Traffic Light: RED - don't build as essay writer, pivot to outline helper.",howItWorks:"Full automation of learning task = replaces learning, not augments. Harm scales.",whereToSee:"Turnitin AI detection debate.",discussionQ:"Is there ethical version of essay helper?",whatIf:"What if student says 'I will use responsibly'?",ethics:{benefits:"Time saved",harmed:"Learning loss, cheating, teacher trust",missing:"Students who want to learn",trafficLight:"red"}},{title:"Addictive Streaks - Yellow Light",story:"AI vocab app with streaks, push notifications at 11pm 'Don't break streak!' Benefits: Motivation. Harmed: Anxiety, sleep loss, guilt. Missing: Students with anxiety disorders. Yellow - need guardrail: streak freeze, no late notifications, opt-out.",howItWorks:"Gamification can be dark pattern if exploits fear.",whereToSee:"Duolingo streak debate.",discussionQ:"When does motivation become manipulation?",whatIf:"What if streaks really help grades?",ethics:{benefits:"Motivation, habit",harmed:"Anxiety, sleep loss",missing:"Mental health considerations",trafficLight:"yellow"}},{title:"Transparent Tutor - Green Light",story:"AI tutor that says 'I'm AI, 80% accurate, verify with teacher, I don't replace studying.' Shows sources, limits use to 30 min/day, teacher dashboard. Benefits: Helps, honest. Harmed: Minimal. Green.",howItWorks:"Transparency + limits + human in loop = responsible design.",whereToSee:"Khan Academy Khanmigo ethics page.",discussionQ:"Does disclaimer reduce usefulness?",whatIf:"What if students ignore disclaimer?",ethics:{benefits:"Learning support, honest",harmed:"None major if guardrails",missing:"None if inclusive design",trafficLight:"green"}},{title:"Hidden Human - Dark Pattern",story:"App pretends AI tutor is human teacher 'Ms. Smith' to build trust, charges more. Users think human cares. Actually AI. Benefits: More signups. Harmed: Deception, betrayal when discovered, undermines trust in real teachers.",howItWorks:"Fake human is classic AI dark pattern - violates consent.",whereToSee:"Replika AI pretending human partner controversies.",discussionQ:"Should AI ever pretend human?",whatIf:"What if AI is better than human?",ethics:{benefits:"Short-term trust",harmed:"Deception, trust erosion",missing:"Real teachers",trafficLight:"red"}},{title:"Bias in Summarizer - Yellow",story:"Summarizer works great for typed English notes, fails for handwritten Spanish notes. Benefits English speakers. Harmed: Spanish speakers, students with messy handwriting, dyslexic students. Missing: Those users not tested. Yellow - need inclusive testing.",howItWorks:"Training data bias -> performance bias -> equity harm.",whereToSee:"Joy Buolamwini's Gender Shades.",discussionQ:"How to test for bias with no budget?",whatIf:"What if fixing bias costs too much?",ethics:{benefits:"Helps some",harmed:"Excludes others, widens gap",missing:"Non-English, handwritten, disabled",trafficLight:"yellow"}},{title:"Data Consent - Green with Guardrail",story:"Team wants to use student summaries to improve AI. Instead of taking, they add opt-in: 'Help improve AI? We will use anonymized summaries. You can opt out anytime, no impact.' 60% opt in. Ethical flywheel.",howItWorks:"Consent + anonymization + opt-out + no penalty = ethical data use.",whereToSee:"Apple's opt-in data collection.",discussionQ:"Is 60% enough for flywheel?",whatIf:"What if no one opts in?",ethics:{benefits:"Improves AI, respects autonomy",harmed:"None if done right",missing:"Students who don't understand consent form",trafficLight:"green"}}],physical:{title:"Spider-Man Ethics Shield Lab",goal:"Audit your MVP for dark patterns and build shield (guardrail).",materials:["Printed MVP screenshots","Red/yellow/green stickers","micro:bit","Shield template cardboard"],steps:[{title:"Dark Pattern Hunt",detail:"Look at your MVP UI. Check list: Fake urgency? Hidden cost? Hard to cancel? Fake human? Addiction? Data hoarding? Place red stickers where found."},{title:"Stakeholder Map",detail:"Draw 5 stakeholders around your product (student, teacher, parent, future self, non-user). Write one benefit and one harm for each."},{title:"Program Ethics Traffic Light",detail:"micro:bit code: Button A=green (ethical), B=yellow (watch), A+B=red (don't launch). Team decides light for their MVP and shows color."},{title:"Build Shield Guardrail",detail:"On cardboard shield, write guardrail: e.g., 'Limit 5/day' 'AI disclaimer' 'Opt-in data' 'Teacher view'. Attach to MVP."},{title:"Ethics Card",detail:"Fill card: Benefits, Harmed, Missing, Traffic Light, Guardrail. Add to pitch."}],code:`input.onButtonPressed(Button.A, ()=>{basic.showColor(Colors.Green)})
input.onButtonPressed(Button.B, ()=>{basic.showColor(Colors.Yellow)})
input.onButtonPressed(Button.AB, ()=>{basic.showColor(Colors.Red)})
// Need neopixel or use icons: green=happy, yellow=meh, red=sad`,microbitUse:"Traffic light indicator for ethics decision - tangible red/yellow/green judgment."},community:{prompt:"Submit ethics card: benefits, harmed, missing, traffic light, guardrail.",dataFields:["Traffic Light","Top benefit","Top harm risk","Guardrail built","Dark patterns found"],galleryExample:"70% yellow - most found addictive element. Common guardrail: daily limits."},script:{phases:[{name:"Hook - The Power Story",minutes:10,teacherDoes:"Tell Spider-Man origin + Uncle Ben quote. Show YouTube scandal: profit caused harm. Ask: With AI power, hero or villain?",studentsDo:"Debate: Is profit alone enough? Write hero vs villain business.",checkFor:"Feels responsibility scale."},{name:"Mental Model - Spider-Man Business",minutes:15,teacherDoes:"Draw power -> benefit/harm. Sketch 5 steps. Show dark pattern examples (fake countdown, hidden cancel).",studentsDo:"Sketch steps, audit popular app for dark patterns (TikTok, Duolingo).",checkFor:"Can identify dark pattern."},{name:"Examples - Ethics Bank",minutes:15,teacherDoes:"Dissect Essay Writer RED and Transparent Tutor GREEN. Show traffic light system.",studentsDo:"Groups rate 2 examples with ethics lens: benefits/harmed/missing/light.",checkFor:"Uses 4-part lens."},{name:"Build - Shield Lab",minutes:30,teacherDoes:"Give stickers, shield template, micro:bit traffic light code. Facilitate stakeholder mapping.",studentsDo:"Audit MVP, map stakeholders, program traffic light, build shield guardrail, fill ethics card, post to pool.",checkFor:"Physical shield + card with guardrail."},{name:"Share - Ethics Wall",minutes:15,teacherDoes:"Project ethics wall pool, cluster reds/yellows/greens. Discuss patterns.",studentsDo:"Gallery walk ethics wall, vote most responsible design, comment.",checkFor:"Compares ethics across projects."},{name:"Reflect - Hero Promise",minutes:5,teacherDoes:"Bridge Q: At 10k users, hero or villain?",studentsDo:"Write hero promise: 'With my AI power, I will... and will not...' in workbook.",checkFor:"Specific responsibility commitment."}]},unplugged:{roles:[{role:"Hero",job:"Argues benefit"},{role:"Villain",job:"Argues how it could harm at scale"},{role:"Detective",job:"Finds dark patterns and missing voices"},{role:"Guardian",job:"Designs guardrail shield"}],steps:["Hero lists benefits","Villain lists harms at 1000x scale","Detective finds dark patterns + missing stakeholders","Guardian proposes shield","Team votes traffic light","Rewrite product with guardrail"],variations:["Devil's advocate - Villain wins if finds harm","No tech - only paper audit","Stakeholder role-play: be teacher/parent","Red team - try to misuse product"]},workbook:{prompts:["My AI power: What can it do at scale? ___","Benefits: Who wins? ___ Harmed: Who could be hurt at 1000x? ___","Missing: Whose voice not in room? ___","Dark patterns in my MVP: ___","Guardrail I will build: ___ Traffic Light: ___","Hero promise: With my AI, I will... I will not..."],assessment:[{q:"Fill full ethics card for your MVP with benefits/harmed/missing/light/guardrail.",type:"ethics card"},{q:"Audit 2 popular apps for dark patterns using checklist.",type:"audit"},{q:"Redesign your MVP to be green light - what changed?",type:"redesign"}],rubric:["Lists 3+ stakeholders including non-users","Identifies harm at scale","Finds at least one dark pattern risk","Proposes specific guardrail (not vague 'be ethical')","Traffic light justified with evidence","Hero promise specific"]}},{id:"W24",num:24,title:"PROJECT 4: Build AI Startup MVP",subtitle:"Pitch + MVP + Business Plan + Ethics Card - Shark Tank",mentalModel:"Shark Tank for AI Startups",mentalModelDesc:"Real sharks (audience) decide if your AI startup gets 'funded' (tested). Not about money, about value + ethics.",color:"#059669",accent:"#10B981",teacherBackground:{history:"Shark Tank premiered 2009, but pitch competitions started 1980s. Y Combinator Demo Day 2005 created modern startup pitch event. For AI, 2023 saw AI Demo Days where 9-year-olds pitched AI apps to VCs. Project-based learning research: Students learn 2x more when building real product for real audience. This project synthesizes W19-24: Lean (tested), MVP (built), Business Model (priced), Pitch (trailer), Ethics (shield). Final deliverables mirror real AI startup: Not just code, but business + ethics. Assessment is authentic: Would real users want it? Would real sharks fund it? Is it responsible?",whyNeed:"9th graders need to see themselves as builders, not just consumers of AI. This project gives agency: They can build AI startup in 2 weeks that helps their community. Also teaches integration: Business without ethics = villain, pitch without MVP = hot air, MVP without lean = waste. Shark Tank format makes it celebratory, not stressful. Every student has role: builder, pitcher, ethics guardian. Even if startup 'fails,' they learn validated learning. Builds portfolio for high school.",realWorld:["BuildSpace: 15-year-olds building AI startups, demoing weekly, getting $500 grants.","School AI startups: Student built AI hall pass, AI lunch menu translator, AI math tutor - all pitched to principal, some adopted.","Shark Tank for kids: Many schools run it, real local entrepreneurs as sharks, not just teachers."],kidQA:[{q:"What if my MVP doesn't work on pitch day?",a:"Show what you learned! Sharks fund learning too. Show interviews, pivots, ethics card. Failure with learning > fake success. Have backup video."},{q:"Do we need to make real money?",a:"No - 'Funded' means classmates sign up to test. Real traction is signups, not dollars. But you must show you wouldn't lose money if you did charge."},{q:"What if team fights?",a:"Use roles from unplugged. Assign clear jobs. Do daily standup: What I did, what I'll do, blocker. Shark Tank teams that fight often have unclear roles."}],vocab:[{term:"Shark Tank",def:"Pitch event where audience decides to support.",example:"Our class Shark Tank - 3 min pitch, 2 min Q&A, vote."},{term:"Portfolio",def:"Collection showing your work and learning.",example:"MVP link + pitch video + business model + ethics card."},{term:"Demo Day",def:"Day you show working product.",example:"W24 Friday is Demo Day."},{term:"Traction",def:"Evidence people want it.",example:"Signups, interviews, usage."}]},mentalModelDeep:{teacherAnalogy:"Shark Tank is not about sharks being mean, it's about real-world test. Sharks ask: 'Who is customer? How make money? What if Google does this? Why you?' Those are lean, business model, ethics questions. For AI Shark Tank, sharks are your users + guardians: Students, teacher, maybe principal. They will ask: Does it work? Does it help without harm? Would I use it? Can it sustain? Your job: 3 min trailer that answers. Think: Movie trailer that makes sharks want to watch full movie (fund you). Trailer = pitch + MVP demo + business math + ethics shield. If you only have code, no trailer, sharks bored. If only trailer, no movie, sharks say 'Where's product?' Need both.",studentAnalogy:"You made a TikTok that could go viral. Shark Tank = you show TikTok to friends, they decide to duet or not. If they duet (sign up), you got funded. You need to show TikTok (MVP) + explain why it will go viral (business) + why it's not harmful (ethics) + ask them to duet (ask).",sketchSteps:[{step:"The Team",draw:"Draw 3-4 people with roles: Builder, Pitcher, Ethics, Data.",sec:"0-12s: Assign Shark Tank roles."},{step:"The Movie",draw:"Draw clapperboard: What is your AI startup movie about?",sec:"12-24s: One-sentence story."},{step:"The Trailer",draw:"Draw trailer reel: 60-sec pitch + 30-sec demo + 30-sec numbers/ethics.",sec:"24-36s: Script trailer."},{step:"The Sharks",draw:"Draw sharks as audience: Who are sharks? What will they ask?",sec:"36-48s: Prepare Q&A."},{step:"The Ask",draw:"Draw hand raising: What do you want from sharks? Testers? Feedback?",sec:"48-60s: Specific ask."}],wrongVsRight:{wrong:"Wrong: Team builds in silence, no user tests, 20-slide deck reading features, no demo, no numbers, no ethics, ends with 'We think it's cool, give us money.' Sharks: 'Where's evidence? Where's responsibility?'",right:"Right: Team interviewed 15, built skateboard in 2 hours, tested with 10, margin 80%, green light ethics with guardrail, 90-sec demo of real notes summarized, asks 'Who will test this week?' 10 hands. Sharks fund."},bridgeQuestion:"If you had 3 minutes in front of real principal to get your AI startup approved for school use, what would you show to prove value, sustainability, and responsibility?",deepDive:"Project structure - Week A (W24a): Lean + MVP + Business Model + Ethics card draft. Week B (W24b): Polish + Pitch + Shark Tank. Deliverables: 1) MVP link (working, skateboard), 2) 90-sec pitch video (trailer), 3) Business model canvas (cost, price, margin, break-even), 4) Ethics card (benefits/harmed/missing/light + guardrail), 5) Demo script + backup video, 6) Community pool submission. Rubric: Value (does it help?), Viability (does it work? Can it sustain?), Responsibility (ethical?), Learning (evidence of lean loops?), Pitch (clear trailer?). Team roles: CEO (pitch), CTO (MVP), CFO (business model), Ethics Officer (shield). Daily standup."},examples:[{title:"NoteNinja - AI Study Buddy",story:"Team: 3 students. Lean: Interviewed 20, found pain = organizing bio notes. MVP: Paste notes -> 5 bullets + 3 quiz Qs using GPT-3.5. Business: Cost $0.005/use, free 10/day, $2/mo for 100. Margin 75% at scale. Ethics: Green, disclaimer 'Verify, not cheat', limit 10/day, opt-in data. Pitch: Hook 'Who spent 2 hours on bio?' Demo: Real bio notes summarized live. Traction: 18 tested, 14 would pay $2. Ask: 20 more testers. Sharks: Funded (22 signups).",howItWorks:"Full stack example: Lean -> MVP -> Business -> Ethics -> Pitch. Each part evidence-based.",whereToSee:"Live at noteninja-mvp.glitch.me (example)",discussionQ:"What made this fundable vs just cool?",whatIf:"What if principal says no AI in school?",ethics:{benefits:"Saves time, helps organize, quiz aids learning",harmed:"If used to skip reading, over-reliance",missing:"Non-English bio notes",trafficLight:"green"}},{title:"LinguaSnap - Photo Translate Menu",story:"School with many ESL families: Lunch menu only English. Team built: Photo menu -> AI translates to Spanish + adds picture. MVP: Upload photo, get Spanish + image search. Business: School license $300/year, cost $0.02/photo * 200 photos = $4/year, margin 98%. Ethics: Green, helps inclusion, opt-in photos, no data stored. Pitch: Story of Maria who couldn't read menu. Demo: Photo of pizza -> Spanish + pizza image. Traction: 5 ESL families tested, 100% said helpful. Ask: Principal approval to pilot in cafeteria. Funded by principal!",howItWorks:"Niche, high value, low cost, ethical, B2B2C model. Perfect AI for good.",whereToSee:"Similar to Google Lens but niche.",discussionQ:"Why was school license better than charging students?",whatIf:"What if translation wrong and allergy risk?",ethics:{benefits:"Inclusion, equity, safety",harmed:"Wrong translation risk",missing:"Other languages beyond Spanish",trafficLight:"green"}},{title:"FocusGuard - Anti-Addiction",story:"Team noticed AI study apps addictive. Built FocusGuard: AI summarizes but after 30 min, says 'Take break, go outside, you've learned enough.' Limits use. Business: Freemium, free with limits, $1/mo to support. Cost low. Ethics: Green, anti-dark pattern, promotes wellbeing. Pitch: Hook about 2am study guilt. Demo: Timer + break message. Traction: 10 students, 8 said break message helped. Ask: Testers who want healthy study. Funded as ethical example.",howItWorks:"Ethics as feature, not afterthought. Business model aligns with wellbeing, not addiction.",whereToSee:"One Sec app, Screen Time.",discussionQ:"Can ethical design be business advantage?",whatIf:"What if users disable guardrail?",ethics:{benefits:"Wellbeing, prevents over-reliance",harmed:"None",missing:"None",trafficLight:"green"}},{title:"QuizCraft - Pivot Story",story:"Started as essay writer (red light). Ethics check failed. Pivoted to quiz generator from notes. Same tech, different job: Helps learn, not cheat. Business: $3/mo. Ethics: Green. Shows lean + ethics working together. Pitch included failure story -> more trust.",howItWorks:"Ethics caused pivot - powerful story for sharks. Shows responsible building.",whereToSee:"Pivot stories from YC.",discussionQ:"Should you share failure in final pitch?",whatIf:"What if team attached to original idea?",ethics:{benefits:"Learning, not cheating",harmed:"Minimal",missing:"Students who need essay outline help - could add",trafficLight:"green"}},{title:"VoiceNote - Accessibility First",story:"Student with dyslexia on team: Built voice notes -> AI summarizes -> reads aloud. MVP: Record voice, transcribe via Whisper API, summarize. Business: Freemium, free for students with IEP, paid otherwise - equity model. Ethics: Green, accessibility core, consent for voice data, opt-in. Pitch: Team member story. Demo: Voice note -> summary read aloud. Traction: Tested with 3 students with learning differences, all found helpful. Ask: School counselor to refer students. Funded.",howItWorks:"Accessibility as core, not add-on. Inclusive design = better for all.",whereToSee:"Otter.ai, but student-built.",discussionQ:"How to price equitably?",whatIf:"What if voice data sensitive?",ethics:{benefits:"Accessibility, inclusion",harmed:"Voice privacy risk if not handled",missing:"Deaf students - need captions",trafficLight:"green"}},{title:"EcoSort - AI Recycling Helper",story:"Photo of trash -> AI says recyclable? Helps school recycling. Business: School license, cost $0.01/photo, $200/year. Ethics: Green, environmental good, no personal data. Pitch: Show trash photo -> AI says 'Compost'. Demo live. Traction: 20 photos tested in cafeteria, 85% accurate. Ask: Custodian to pilot. Funded by eco club.",howItWorks:"AI for environment, tangible, low risk, high good. Great for Shark Tank because visual.",whereToSee:"Similar to RecycleNet.",discussionQ:"What if AI wrong and contaminates recycling?",whatIf:"What if custodian says no?",ethics:{benefits:"Environment, education",harmed:"Wrong sort could harm recycling",missing:"Students who don't have phones",trafficLight:"green"}}],physical:{title:"Shark Tank Startup Build",goal:"Build and pitch full startup in 90 min with micro:bit as pitch timer and vote counter.",materials:["Laptops","Cardboard shark tank set","micro:bit x2 (timer + vote counter)","Printed canvases: Lean, Business, Ethics"],steps:[{title:"Team Roles & Standup",detail:"Assign CEO (pitch), CTO (MVP), CFO (business), Ethics Officer (shield). 2-min standup: What will we build in 30 min?"},{title:"MVP Sprint 30min",detail:"CTO builds skateboard MVP (prompt or no-code). Must be usable by end. CEO writes hook, CFO calculates cost/price, Ethics fills card."},{title:"Pitch Script 20min",detail:"Write 90-sec trailer: Hook (10s), Problem (15s), Demo (30s), Numbers (15s), Ethics (10s), Ask (10s). Program micro:bit timer: 90 sec countdown."},{title:"Dress Rehearsal",detail:"Rehearse 2x with timer. Record backup demo video in case WiFi fails. Prepare Q&A: 3 hard questions sharks will ask."},{title:"Shark Tank - Live",detail:"Pitch to other teams (sharks). Sharks use micro:bit B to vote: A= fund (green), B= no fund (red). Count votes. Collect signups for testing."},{title:"Pool & Portfolio",detail:"Submit to community pool: MVP link, pitch video, business model, ethics card. Gallery walk portfolio."}],code:`// Timer micro:bit
