t's a useful metaphor, not literal. We anthropomorphize easily - that's why we need ethics lens."}],vocab:[{term:"Perception",def:"Agent's ability to sense environment via inputs (text, image, sensor data)",ex:"Camera seeing a stop sign"},{term:"Reasoning",def:"Internal thinking, planning, decision-making using knowledge",ex:"Deciding to stop because sign is red"},{term:"Action",def:"Executing a change in environment via tools or actuators",ex:"Applying brakes"},{term:"Autonomy",def:"Degree agent operates without human step-by-step control",ex:"Roomba cleaning without you steering"}]},mentalModelDeep:{name:"Sense → Think → Act Loop",teacherAnalogy:"Like a human crossing the street: Your EYES sense cars (perception), your BRAIN thinks 'is it safe? gap is 5 sec, I need 3 sec' (reasoning), your LEGS act by walking (action). Then loop restarts - you sense again mid-crossing. If a car appears, you re-think and re-act. Agents do exactly this cycle 10-100x per task.",studentAnalogy:"You are playing Minecraft. You SENSE (see creeper!), you THINK (creeper = boom, need to run), you ACT (sprint away). Then SENSE again (are you safe?), THINK again, ACT again. That's the loop you already live.",sketchSteps:["Draw a big circle, split into 3 pizza slices. Label SENSE, THINK, ACT.","In SENSE slice, draw an eye + ear + text bubble 'What's happening?'","In THINK slice, draw brain with gears + 'What should I do?'","In ACT slice, draw robot hand + 'Do it!'","Draw arrows looping forever. Add small 'Environment' box outside with double arrows to SENSE and ACT."],wrongVsRight:{wrong:"AI Agent = Smart robot that just knows what to do magically (one step)",right:"AI Agent = Loop that keeps sensing, re-thinking, and adjusting actions until goal done (continuous cycle)"},bridgeQuestion:"If your agent's SENSE is broken (camera covered), what happens to THINK and ACT? Can it still succeed? Why is sensing the most fragile link?"},examples:[{title:"Morning Alarm Agent",story:"Mira's agent checks her calendar, sees first class is cancelled, lets her sleep 30 mins extra, then senses traffic and wakes her exactly on time.",howItWorks:"SENSE: calendar API + traffic data + clock → THINK: calculate optimal wake time (reasoning with constraints) → ACT: set alarm + send notification",whereToSee:"iPhone Focus modes, Google Assistant Routines",discussionQ:"Should agent be allowed to decide you skip sleep?",whatIf:"What if it misreads calendar and you miss an exam?",ethics:{benefits:"Reduced stress, optimized sleep",harmed:"Student if error, teacher if class empty",missing:"Consent for changing alarm without asking",trafficLight:"yellow"}},{title:"Trash-Sorting Robot at School",story:"School cafeteria robot looks at trash, thinks what bin it goes in, picks and sorts. Learns from mistakes.",howItWorks:"Camera SENSES trash item → Vision model THINKS: plastic vs compost vs landfill → Robotic arm ACTS to sort. Loop per item.",whereToSee:"AMP Robotics, school sustainability fairs",discussionQ:"What if it confuses compostable plastic?",whatIf:"Robot puts batteries in landfill - fire risk",ethics:{benefits:"Better recycling, less landfill",harmed:"Janitors whose jobs change, environment if wrong",missing:"Indigenous views on waste, not just efficiency",trafficLight:"green"}},{title:"Game NPC Companion",story:"In your RPG, your AI companion senses low health, thinks you need healing, acts by throwing potion without you asking.",howItWorks:"SENSES game state (HP, enemies) → THINKS: priority tree (heal > attack) → ACTS: execute heal action. Loop every 0.5s.",whereToSee:"The Sims AI, Fortnite bots, Minecraft Allay",discussionQ:"Is it more fun if companion is autonomous or controlled?",whatIf:"Companion wastes all potions early",ethics:{benefits:"Accessibility, solo players get team",harmed:"Competitive fairness in multiplayer",missing:"Player agency vs automation",trafficLight:"green"}},{title:"Customer Support Agent",story:"You message support. Agent reads your issue, checks your order history, thinks of solution, acts by refunding and sending new item.",howItWorks:"SENSE: chat message + order DB → THINK: LLM reasoning: eligible for refund? policy check → ACT: call refund tool + shipping API",whereToSee:"Shopify Sidekick, Intercom AI Agent, Zendesk AI",discussionQ:"Should you be told it's AI not human?",whatIf:"Agent refunds scammer $1000 due to prompt injection",ethics:{benefits:"24/7 instant help",harmed:"Support workers, scammed company",missing:"Transparency law - right to know it's AI",trafficLight:"yellow"}},{title:"Smart Garden Watering Agent",story:"Sensor in soil senses dryness, agent thinks about weather forecast (rain tomorrow), decides to wait, acts tomorrow instead.",howItWorks:"SENSE: soil moisture + weather API → THINK: if moisture<30% AND rain<40% tomorrow → ACT: open valve 5 min. Loop every 2 hours.",whereToSee:"Rachio sprinklers, farm IoT, micro:bit soil projects",discussionQ:"What data does it need to be good gardener?",whatIf:"Agent over-waters during drought restrictions",ethics:{benefits:"Water saving, plant health",harmed:"Neighbors if water restrictions broken",missing:"Community water rights data",trafficLight:"green"}},{title:"DeepFake Detection Agent",story:"Agent scans TikTok feed, senses suspicious video, thinks by checking lip-sync and metadata, acts by flagging for human review.",howItWorks:"SENSE: video frames + metadata → THINK: multimodal reasoning: audio-visual mismatch? → ACT: label 'potential synthetic' + route to moderator",whereToSee:"TikTok moderation, Reality Defender, Adobe Content Credentials",discussionQ:"Should agent auto-remove or only flag?",whatIf:"Agent flags real journalism as fake",ethics:{benefits:"Slows misinformation",harmed:"Journalists, free speech if over-flagged",missing:"Cultural context - satire vs deception",trafficLight:"red"}}],physical:{title:"Sense-Think-Act Loop with micro:bit",materials:"micro:bit, light sensor, button A/B, LED matrix",steps:["Code SENSE: read light level + button press as environment","Code THINK: if light<100 AND buttonA pressed → decision = 'night mode', else 'day mode'","Code ACT: show moon icon / sun icon + play tone","Add loop: forever sense→think→act","Challenge: Add shake sensor = emergency sense override"],code:"basic.forever(function(){ let light=input.lightLevel(); let decision= light<50? 'dark':'light'; if(decision=='dark'){ basic.showIcon(IconNames.SmallDiamond); } else { basic.showIcon(IconNames.Sun); } })"},unplugged:{roles:["Environment (holds cards)","Sensor (eyes closed, gets card description)","Brain (decides)","Hands (acts)"],steps:["Environment shows scenario card (e.g., 'Ball rolling to street')","Sensor describes what they sense to Brain (can't act)","Brain whispers decision to Hands","Hands act with prop","Loop: Environment changes slightly, repeat. Rotate roles."],variations:["Add noisy sensor: Sensor must describe with only 3 words","Add slow brain: Brain must count to 5 before deciding","Add broken actuator: Hands tied, must verbally instruct another"]},script:[{phase:"Ignite (10m)",desc:"Play video of Roomba vs ChatGPT. Ask: Which is agent? Why? Introduce loop via crossing street demo live."},{phase:"Mental Model (15m)",desc:"Draw Sense-Think-Act pizza on board. Student sketch 60-sec. Wrong vs Right T-chart. Bridge question pair-share."},{phase:"Examples Deep Dive (25m)",desc:"Jigsaw: 6 groups each get 1 example bank card. Must fill S/T/A boxes + ethics traffic light. Gallery walk."},{phase:"Physical Computing (20m)",desc:"micro:bit sense-think-act loop build. Demo then remix. Debug common error: forgetting loop = agent stops after one action."},{phase:"Unplugged Loop Game (10m)",desc:"4-role relay race. Time how many loops per minute. Discuss bottleneck: which role slows loop most?"},{phase:"Reflect + Workbook (10m)",desc:"Exit ticket: Draw your morning routine as agent loop. Identify one autonomy risk. Workbook p1-2."}],workbook:["Diagram your own Sense-Think-Act loop for 'doing homework'","List 3 agents at home, label their sensors and actuators","Traffic light your examples: which need human oversight?"]},{id:"W8",num:8,title:"Tool Use",subtitle:"Agents Using Tools - Calculator, Search, Calendar",mentalModel:"Toolbox",icon:"◧",color:"from-blue-500 to-cyan-600",teacherBackground:{history:"Tool Use emerged March 2023 with ReAct paper (Yao et al) - reasoning + acting interleaved. Before that LLMs were 'brains in a jar' - could talk but not act. ReAct showed prompting LLM to think 'I need to search' then actually search dramatically improved accuracy from 32% to 54% on QA. Then OpenAI Function Calling (June 2023) made it reliable: model outputs JSON to call tools. This is how Copilot edits files.",whyNeed:"9th graders think AI knows everything. Critical to teach tool boundary: LLM hallucinates because it has no tools; agent succeeds because it uses tools. This builds information literacy - when to trust internal knowledge vs external tool. Also career skill: future work is orchestrating tool-using agents.",realWorld:["Perplexity AI - searches web then synthesizes","ChatGPT Code Interpreter - uses Python tool to calculate","Rabbit R1 / Humane Pin - agents that call Uber, DoorDash via tools"],kidQA:[{q:"Why not just make AI know everything?",a:"Impossible. World changes every second (sports scores, stock price). Also private data (your calendar) not in training. Tools = live fresh data + actions."},{q:"Can agent use any tool?",a:"Only tools we give it, like toolbox. If hammer not in box, can't hammer. Designers choose toolbox = power + safety decision."},{q:"What if agent picks wrong tool?",a:"Happens! Called tool error. Good agents THINK first: 'Which tool matches task?' Like you wouldn't use calculator to send email. That's reasoning."}],vocab:[{term:"Tool",def:"External function agent can call to get info or affect world",ex:"search('weather today')"},{term:"Function Calling",def:"Structured way LLM outputs JSON to invoke tool",ex:'{"tool":"calculator","args":{"expr":"24*3"}}'},{term:"ReAct",def:"Prompt pattern: Reason + Act interleaved, thought before tool use",ex:"Thought: need date → Action: calendar tool"},{term:"Hallucination",def:"Model makes up info when it should have used tool",ex:"Inventing fake citations vs searching"}]},mentalModelDeep:{name:"Toolbox",teacherAnalogy:"You are not the toolbox, you are the carpenter. Your brain decides: need to cut? pick saw. Need to measure? pick tape. Need to join? pick drill. Agent is carpenter, tools are saw/tape/drill. A carpenter with only a hammer sees every problem as nail. A good carpenter has many tools AND judgment to pick right one. Same for agent.",studentAnalogy:"Your phone home screen is toolbox. Calculator app, Maps app, Camera app. You (agent) pick which app to open for task. Text 'what's 15% tip on $47?' → you pick Calculator, not Maps. That's tool selection.",sketchSteps:["Draw toolbox open, 4 slots inside","Label slots: CALCULATOR (for math), SEARCH (for facts), CALENDAR (for time), MESSENGER (for actions)","Draw stick figure agent pointing at toolbox, thought bubble: 'Task needs math → pick calculator'","Draw wrong: agent using search to do 2+2 = gets 10 weird web results","Draw right: agent using calculator to do 2+2 = 4 instantly, clean"],wrongVsRight:{wrong:"Agent should memorize everything or guess if no tool",right:"Agent should recognize knowledge gap → pick correct tool → use tool output in reasoning"},bridgeQuestion:"If you give agent a tool 'delete_all_files', should you? What toolbox design prevents accidents? (Permissions, confirmation)"},examples:[{title:"Homework Math Agent",story:"Agent sees 'Solve 3x+5=20'. Thinks: need algebra → uses calculator tool to solve, shows steps, doesn't hallucinate answer.",howItWorks:"SENSE: math problem text → THINK: 'This is equation, need calculator tool' → ACT: call calculator.solve('3x+5=20') → THINK again with result → ACT: explain steps",whereToSee:"Photomath, Khanmigo, Wolfram Alpha",discussionQ:"Should agent just give answer or show thinking?",whatIf:"Tool gives wrong answer - who is responsible?",ethics:{benefits:"Learning aid, shows work",harmed:"Students if over-reliance, no learning",missing:"Teacher visibility into tool use",trafficLight:"yellow"}},{title:"Trip Planner Agent",story:"You say 'Plan weekend in Portland'. Agent uses search for events, calendar for your availability, maps for distances, messenger to book.",howItWorks:"Chain of tool calls: calendar.check(weekend) → search.events(Portland) → maps.distance → booking tool. Reasoning between each.",whereToSee:"Booking.com AI, Google Travel, Airbnb AI",discussionQ:"How many tools is too many? When does it get creepy?",whatIf:"Agent books $800 hotel without asking budget",ethics:{benefits:"Saves hours planning",harmed:"User wallet if no confirmation, local businesses if biased",missing:"Budget constraint tool, local vs chain bias",trafficLight:"yellow"}},{title:"Fake News Checker Agent",story:"Claim: 'Scientists say chocolate cures cancer'. Agent uses search tool to find studies, finds no evidence, flags false.",howItWorks:"SENSE: claim text → THINK: need evidence → ACT: search PubMed + news → THINK: evaluate sources → ACT: label false + provide real sources",whereToSee:"Fact-checking bots, Perplexity, Google Fact Check Tools",discussionQ:"What sources should its search tool trust?",whatIf:"Search tool returns only conspiracy sites due to SEO",ethics:{benefits:"Fights misinfo",harmed:"If wrong, defames scientists",missing:"Source credibility scoring",trafficLight:"red"}},{title:"Accessibility Helper Agent",story:"Visually impaired user asks agent to read menu. Agent uses camera tool to see menu, then screen-reader tool to speak.",howItWorks:"Camera tool SENSES image → OCR tool extracts text → Reasoning tool structures menu → Text-to-speech tool ACTS",whereToSee:"Be My Eyes AI, Seeing AI app",discussionQ:"Should tool list include 'ask human for help' as tool?",whatIf:"Camera misreads allergy warning",ethics:{benefits:"Huge independence boost",harmed:"User if critical error, restaurant if liability",missing:"Co-design with disabled users - is tool order right?",trafficLight:"green"}},{title:"Code Debugging Agent",story:"Student pastes buggy Python. Agent uses code runner tool to execute, sees error, searches StackOverflow, suggests fix.",howItWorks:"Code execution tool → error output → search tool for error message → reasoning: apply fix → rerun tool to verify",whereToSee:"GitHub Copilot, Replit AI, Cursor",discussionQ:"Is using code runner tool cheating?",whatIf:"Tool executes malicious code deleting files",ethics:{benefits:"Learn debugging faster",harmed:"Security if runs untrusted code",missing:"Sandboxing, student data privacy",trafficLight:"yellow"}},{title:"Climate Data Agent",story:"Agent answers 'Is this city hotter than 20 years ago?' by using weather API tool for historical data, calculator for average, chart tool to visualize.",howItWorks:"weather_api.get_history(city, 2004-2024) → calculator.mean → chart.generate → explanation",whereToSee:"Climate TRACE, NASA EarthData agents",discussionQ:"Why tool use matters for climate claims?",whatIf:"API data has gap, agent invents missing years",ethics:{benefits:"Evidence-based climate literacy",harmed:"If biased API or cherry-picked years",missing:"Indigenous climate knowledge not in API",trafficLight:"green"}}],physical:{title:"Toolbox Tool Cards - Physical Decision",materials:"Printed tool cards: Calculator, Search, Calendar, Message, Camera. micro:bit + buttons",steps:["Lay tool cards on desk as physical toolbox","Task cards: 'What is 15% of 80?', 'When is spring break?', 'Send reminder to mom'","Student must physically pick correct tool card and place on micro:bit","micro:bit button A = confirm tool choice, button B = execute mock","Log: which tool picked, was it right? Build accuracy dashboard"],code:"let toolbox=['calc','search','cal','msg']; let task='tip'; if(task=='tip'){ choose='calc'; } basic.showString(choose)"},unplugged:{roles:["Requester (gives task)","Agent Brain (chooses tool)","Tool Stations (4 students each holding one tool - only they can answer)","Messenger (returns answer)"],steps:["Requester: 'What's capital of Brazil + 5?'","Brain must split: capital = search tool, +5 = calc tool. Decide order.","Brain walks to Search station, asks, gets 'Brasília'","Brain walks to Calc station, asks 'Brasília +5??' - Calc says 'I can't do that! Need number!'","Brain realizes need text tool? Debate. Learn tool limits.","Repeat with clear math tasks."],variations:["Add tool cost: each tool use costs $1 fake money - optimize","Add broken tool: Search station gives wrong answers 50% - how to detect?","Add new tool creation: students invent a tool they'd add"]},script:[{phase:"Ignite (10m)",desc:"Live demo: Ask ChatGPT 'What's weather today?' (fails/hallucinates) vs Perplexity (uses search tool, succeeds). Define tool."},{phase:"Mental Model (15m)",desc:"Toolbox metaphor. Draw toolbox. Wrong vs Right: using search for math. Sketch 60-sec. Bridge: dangerous tools."},{phase:"Examples Jigsaw (25m)",desc:"6 groups, each maps task→tool chain. Must list: what tool, why that tool, what if wrong tool. Present."},{phase:"Physical Lab (20m)",desc:"Tool cards physical picking game. micro:bit as tool confirmer. Build tool-selection accuracy chart."},{phase:"Unplugged (10m)",desc:"Tool Station relay. Experience bottleneck: Brain traveling between tools = latency. Discuss tool orchestration."},{phase:"Reflect (10m)",desc:"Design your ideal toolbox for homework agent: what 3 tools essential? What 1 dangerous tool you'd NOT include?"}],workbook:["For 3 tasks (math, schedule, fact), write Thought → Tool → Observation chain (ReAct format)","Design a new tool: name, input, output, when to use","Audit: list tools your phone AI uses without telling you"]},{id:"W9",num:9,title:"Planning",subtitle:"Breaking Task into Steps",mentalModel:"Recipe Steps",icon:"◫",color:"from-cyan-600 to-blue-700",teacherBackground:{history:"Planning in AI is old (STRIPS 1971). LLM planning revived 2022 with Chain-of-Thought (Wei et al): 'Let's think step by step' improved math from 17% to 57%. Then Tree-of-Thoughts (2023) and ReAct combined planning + tools. Key insight: LLMs are bad at long planning but good if forced to break into steps. This mirrors human cognition - we can't plan 20 steps at once, we need recipe.",whyNeed:"9th graders struggle with executive function - breaking big project into steps. Teaching AI planning teaches metacognition: if you can teach agent to plan, you learn to plan yourself. Also combats 'AI just knows' myth - shows explicit step decomposition is needed. Essential for homework, essays, coding.",realWorld:["AutoGPT's goal decomposition: 'Start business' → market research → website → marketing","GitHub Copilot Workspace: plans code changes across files step-by-step","Meal planning agents that break 'healthy dinner' into shopping → prep → cook"],kidQA:[{q:"Why not just tell agent 'do homework' and it does?",a:"Too vague. Like telling human 'make dinner' without recipe - might burn kitchen. Planning = turning vague goal into clear steps. Agent needs recipe."},{q:"What if plan fails mid-way?",a:"Great question! That's Re-planning. Good agents sense failure, think new plan, act. Like if store out of eggs, recipe adapts."},{q:"Can agent plan too much?",a:"Yes! Over-planning = never acts (analysis paralysis). Good agents balance plan vs act, like good students."}],vocab:[{term:"Decomposition",def:"Breaking big task into smaller subtasks",ex:"'Write essay' → research → outline → draft → edit"},{term:"Chain-of-Thought",def:"Prompting model to show intermediate reasoning steps",ex:"'Let's think step by step...'"},{term:"Subgoal",def:"Intermediate goal that helps reach final goal",ex:"Buy ingredients is subgoal of cook dinner"},{term:"Re-planning",def:"Adjusting plan when step fails or environment changes",ex:"Store closed → order online instead"}]},mentalModelDeep:{name:"Recipe Steps",teacherAnalogy:"You want chocolate cake. You don't just throw chocolate in oven. Recipe says: 1) Gather ingredients (flour, eggs...), 2) Mix dry, 3) Mix wet, 4) Combine, 5) Bake 30 min, 6) Cool. Each step has inputs/outputs. If you skip step 1, you fail at step 2. If oven broken, you re-plan: no-bake cake. Agent planning is exactly recipe writing + following + adapting.",studentAnalogy:"Planning a TikTok video. You don't just press record. Steps: Idea → Script → Outfit → Location → Record clips → Edit → Caption → Post. If location noisy, you re-plan location. That's agent planning in your life.",sketchSteps:["Draw cake at top = final goal","Draw 5 boxes below in sequence with arrows: Gather → Mix → Combine → Bake → Serve","Under each box, tiny icons: shopping cart, bowl, oven","Add dotted arrow back from Bake to Gather labeled 'Oops no eggs! Re-plan: borrow'","Add side note: Good recipe = clear, ordered, adaptable"],wrongVsRight:{wrong:"Planning = making perfect 20-step plan upfront then blindly executing",right:"Planning = make rough 3-5 step plan, execute step 1, sense result, adjust plan, repeat (interleaved)"},bridgeQuestion:"Your agent's plan is 10 steps. Step 3 fails (tool error). Should it retry step 3, skip to step 4, or remake whole plan? When is each best?"},examples:[{title:"Essay Writer Agent",story:"Goal: Write essay on renewable energy. Agent plans: search sources → outline → draft intro → draft body → conclusion → citations → proofread.",howItWorks:"Decomposes: creates outline first (subgoal), then for each section: search tool + write tool. Checks each draft before next. If search fails, re-plans outline.",whereToSee:"Notion AI, Jasper, Essay writing tutors",discussionQ:"Should agent write full essay or help you write?",whatIf:"Plan creates 10-page essay for 2-page assignment",ethics:{benefits:"Teaches structure, reduces blank page anxiety",harmed:"Academic integrity if misused, teacher if can't detect",missing:"Student voice, original thinking",trafficLight:"yellow"}},{title:"Science Fair Agent",story:"Goal: Build volcano. Agent breaks: research volcano types → list materials → budget check → step-by-step build instructions → safety check.",howItWorks:"Tree-of-Thoughts: explores 2 material options (baking soda vs yeast), evaluates, picks one. Re-plans if budget tool says too expensive.",whereToSee:"STEM project planners, LabX",discussionQ:"Where should agent stop planning and let student build?",whatIf:"Agent plans dangerous chemical mix",ethics:{benefits:"Scaffolds complex projects",harmed:"Safety if bad plan, creativity if too prescriptive",missing:"Hands-on learning, failure as learning",trafficLight:"green"}},{title:"Apology Email Agent",story:"Goal: Apologize to friend after argument. Agent plans: reflect what happened → acknowledge feelings → take responsibility → propose repair → check tone.",howItWorks:"Not tool use but reasoning steps: each step is thinking prompt. Uses Chain-of-Thought: 'First, what was my role? Second, how did they feel? Third...'",whereToSee:"Grammarly tone, communication coaches",discussionQ:"Should AI plan emotional conversations?",whatIf:"Plan produces manipulative apology",ethics:{benefits:"Teaches emotional intelligence steps",harmed:"Authenticity, friend if fake apology",missing:"Genuine empathy vs template",trafficLight:"yellow"}},{title:"Robot Maze Solver",story:"micro:bit robot needs to exit maze. Agent plans path: map maze → find shortest route (A* search) → break into moves: forward, left, right.",howItWorks:"SENSE maze via sensors → THINK planning algorithm → ACT stepwise. If wall appears (dynamic maze), re-plan from current position.",whereToSee:"Roomba mapping, warehouse robots, game pathfinding",discussionQ:"What's difference between plan and action?",whatIf:"Plan assumes no obstacles, but cat sits in maze",ethics:{benefits:"Logistics, efficiency",harmed:"Jobs displaced, pets if robot doesn't sense",missing:"Unpredictable environment modeling",trafficLight:"green"}},{title:"Budget Planner Agent",story:"Goal: Save $200 for concert in 2 months. Agent plans: check income → list expenses → find cuts → weekly savings subgoals → track.",howItWorks:"Calculator tool for math, calendar for timeline, reasoning for tradeoffs: 'Cancel subscription saves $15/mo = $30' → plan of 4 subgoals",whereToSee:"YNAB AI, Cleo, financial planning apps",discussionQ:"Should agent decide what expenses to cut?",whatIf:"Plan cuts essential food budget",ethics:{benefits:"Financial literacy",harmed:"If cuts essentials, stress",missing:"Family context, income variability",trafficLight:"yellow"}},{title:"Disaster Response Agent",story:"Earthquake hits. Agent goal: coordinate rescue. Plans: assess damage via drone images → prioritize hospitals → allocate teams → reroute supplies.",howItWorks:"High-stakes planning: multi-step, parallel subplans, constant re-planning as new data arrives. Uses search, maps, comms tools.",whereToSee:"FEMA AI, disaster relief logistics",discussionQ:"Should life-death decisions be planned by AI?",whatIf:"Plan prioritizes wealthy area due to biased data",ethics:{benefits:"Speed saves lives",harmed:"Bias in prioritization, vulnerable communities",missing:"Local knowledge, human judgment in chaos",trafficLight:"red"}}],physical:{title:"Recipe Steps Planning Cards",materials:"Index cards, markers, micro:bit as timer",steps:["Write goal on top card: 'Make PB&J'","Decompose into 5 cards: gather bread, gather PB, spread, assemble, clean","Order cards, draw arrows = plan","Execute: one student acts each card, next can't start until previous done","Add failure: hide PB - must re-plan card. micro:bit buzz = re-plan signal","Challenge: plan 'Study for test' with time constraints using calendar tool card"],code:"let plan=['gather','spread','assemble']; let i=0; input.onButtonPressed(Button.A, function(){ basic.showString(plan[i]); i=(i+1)%plan.length; })"},unplugged:{roles:["Goal Holder (says vague goal)","Planner (breaks into steps, writes cards)","Executor (acts only one card at a time)","Environment (introduces surprise after step 2)"],steps:["Goal Holder: 'Organize classroom library'","Planner writes 4 step cards, orders them","Executor does step 1, Environment says 'Oops 20 new books arrived!'","Planner must re-plan remaining steps with new info","Debrief: static plan vs adaptive plan","Switch goals: 'Plan birthday party with $20'"],variations:["Time pressure: Planner has 60 sec to plan","No talking: Planner can only draw plan","Bad planner: Planner deliberately makes bad order, Executor must detect"]},script:[{phase:"Ignite (10m)",desc:"Give vague task 'Make sandwich' - students fail because no steps. Then give recipe cards - succeed. Contrast: goal vs plan."},{phase:"Mental Model (15m)",desc:"Recipe metaphor deep dive. Sketch cake plan. Wrong vs Right: perfect upfront vs iterative. Bridge Q on re-planning."},{phase:"Examples (25m)",desc:"Each group gets one example, must extract plan steps, identify re-plan trigger. Which plans need human approval?"},{phase:"Physical Lab (20m)",desc:"Planning cards physical chain. micro:bit as step counter + re-plan buzzer. Build plan accuracy vs execution time graph."},{phase:"Unplugged (10m)",desc:"Adaptive planning game with surprise. Measure: static plan fails, adaptive succeeds. Introduce Chain-of-Thought."},{phase:"Reflect (10m)",desc:"Write CoT for your homework tonight: 'Let's think step by step for math homework...'. Workbook."}],workbook:["Break 'Write book report' into 5 subgoals with tool needed per subgoal","Write Chain-of-Thought prompt for solving word problem","Design re-plan rule: If search tool returns no results, then..."]},{id:"W10",num:10,title:"Memory",subtitle:"Short-term vs Long-term Memory",mentalModel:"Backpack vs Library",icon:"⬖",color:"from-blue-600 to-cyan-500",teacherBackground:{history:"Memory for agents became critical 2023. Early ChatGPT had no memory across chats (stateless). Then MemGPT (Oct 2023) introduced OS-like memory: short-term context window as RAM, long-term vector DB as disk. Paper 'Generative Agents' (Park et al April 2023) showed agents with memory stream reflecting on past to create believable behavior. Now all major agents have memory: ChatGPT memory (2024), Copilot remembers repo.",whyNeed:"9th graders assume AI remembers them like friend. Need to teach distinction: short-term = conversation context (backpack you carry now), long-term = stored across sessions (library). Privacy implications huge: what should agent remember? What should it forget? GDPR right to be forgotten. Also cognitive science link: human memory similar.",realWorld:["ChatGPT Memory - remembers your preferences across chats","Replika - companion that remembers past conversations","GitHub Copilot - remembers your codebase long-term, current file short-term"],kidQA:[{q:"Does AI remember me after I close tab?",a:"Depends! Short-term memory (backpack) cleared when chat ends. Long-term (library) may be saved if product has memory feature. Always ask: what is stored where?"},{q:"Can AI forget?",a:"Should! Good memory systems have forgetting: old irrelevant memories fade, sensitive memories deleted. Forgetting is feature, not bug - for privacy and accuracy."},{q:"Is memory same as training data?",a:"No. Training data = books library was built from (past). Memory = notes agent writes about YOU specifically during use (present). Different."}],vocab:[{term:"Short-term Memory",def:"Context window: recent conversation agent holds in mind now",ex:"Last 5 messages you sent"},{term:"Long-term Memory",def:"Vector DB storing facts across sessions, retrieved when relevant",ex:"Agent remembers you like anime"},{term:"Retrieval",def:"Searching long-term memory for relevant past info",ex:"User asks 'my usual?' → retrieve past order"},{term:"Reflection",def:"Agent summarizing past events into higher-level insights",ex:"After 5 chats, agent infers 'user is night owl'"}]},mentalModelDeep:{name:"Backpack vs Library",teacherAnalogy:"Backpack = short-term: small, you carry it now, limited space (like 10 books max), you see what's inside instantly, but you drop it when you go home. Library = long-term: huge building, stores thousands of books across years, need catalog system to find book, slower to retrieve, but persists after you leave. Agent's context window = backpack (4k-128k tokens). Vector database = library (millions). Retrieval = going to library catalog.",studentAnalogy:"Your brain: Backpack = what you remember from this morning (you had cereal). Library = childhood memories (first bike). You can only hold ~7 things in backpack at once (phone number). Library needs cue to retrieve (smell triggers memory). Agent same.",sketchSteps:["Draw stick figure with small backpack labeled 'SHORT-TERM: Now, small, fast, temporary'","Draw big building behind labeled 'LONG-TERM: Forever, huge, slow, persistent'","Draw arrow from backpack to building: 'Summarize important → store in library'","Draw arrow from building to backpack: 'Search library → pull relevant to backpack'","Add trash can near backpack: 'Forgetting: remove old to make space'"],wrongVsRight:{wrong:"Memory = agent remembers everything perfectly forever like video recording",right:"Memory = selective storage + retrieval + forgetting + reflection. Must decide what to keep, how to find, when to forget"},bridgeQuestion:"Should school helper agent remember you failed last test? When is remembering helpful vs harmful? Who decides what goes to library?"},examples:[{title:"Personal Tutor That Remembers",story:"Agent remembers you struggled with fractions last week, so today it starts with fraction review before algebra, not repeating same mistake.",howItWorks:"Long-term: stores 'struggled fractions 2024-11-01' vector. Retrieval: when new task = algebra, search memory → finds fraction struggle → reasoning: need prerequisite → short-term plan includes review.",whereToSee:"Khanmigo, Duolingo remembers weak words",discussionQ:"Should tutor remember failures? Could it label you?",whatIf:"Agent keeps reminding you of failure, demotivating",ethics:{benefits:"Personalized learning, not repeating",harmed:"Self-esteem if labels, tracking",missing:"Student control over what is remembered",trafficLight:"yellow"}},{title:"Shopping Assistant Memory",story:"Agent remembers you buy oat milk, allergic to peanuts, so it auto-filters groceries, but you want to try new milk - stuck in bubble.",howItWorks:"Long-term stores preferences + allergies. Retrieval filters search tool. Short-term holds current cart. Reflection: after 10 oat milk buys, infers 'vegan preference'.",whereToSee:"Amazon Rufus, Instacart AI",discussionQ:"When should memory be ignored to allow exploration?",whatIf:"Allergy memory deleted → suggests peanuts → hospital",ethics:{benefits:"Convenience, safety",harmed:"Filter bubble, safety critical if forgetting",missing:"Importance weighting: allergy = never forget",trafficLight:"red"}},{title:"Game Companion Memory",story:"NPC remembers you saved its village 3 sessions ago, so now it trusts you and gives rare item. Without memory, every session like first meeting.",howItWorks:"Generative Agents paper: memory stream logs events, reflection creates 'trust level high'. Retrieval when player interacts → influences dialogue.",whereToSee:"AI NPCs in Inworld, Convai, Sims memory",discussionQ:"Do you want game characters to remember your choices forever?",whatIf:"NPC remembers you stole once, never forgives - feels unfair",ethics:{benefits:"Immersive story, consequences",harmed:"If holds grudge, can't reset, harassment memory",missing:"Forgiveness mechanic, memory edit rights",trafficLight:"green"}},{title:"Therapy Support Agent Memory",story:"Agent remembers you mentioned anxiety before exams, checks in during exam week. Helpful but sensitive.",howItWorks:"Long-term stores emotional mentions. Must have privacy safeguards. Retrieval triggered by calendar (exam) → supportive message. Short-term holds current mood.",whereToSee:"Woebot, Wysa (with strict memory rules)",discussionQ:"Should mental health memory be stored? Where? Who accesses?",whatIf:"Memory leaked to advertiser → targets anxiety products",ethics:{benefits:"Continuity of care, early support",harmed:"Privacy breach, stigma, data breach",missing:"Medical privacy, consent, data minimization",trafficLight:"red"}},{title:"Code Assistant Memory",story:"Agent remembers your project uses React, not Vue, so suggestions fit your stack. Remembers you prefer tabs not spaces.",howItWorks:"Long-term: codebase embeddings + user style prefs. Short-term: current file context. Retrieval: when suggesting code, fetch relevant past files.",whereToSee:"GitHub Copilot, Cursor memory",discussionQ:"Should work code memory follow you to new job?",whatIf:"Agent remembers previous company's secret code, leaks to new employer",ethics:{benefits:"Productivity, consistency",harmed:"IP theft, previous employer",missing:"Code ownership, memory portability boundaries",trafficLight:"red"}},{title:"Family Calendar Agent",story:"Agent remembers family birthdays, but mom says 'don't remind dad about surprise party' - needs to remember to forget / keep secret.",howItWorks:"Memory with access control: some memories tagged private / secret. Retrieval respects permissions. Short-term holds today's events.",whereToSee:"Google Family, shared calendars",discussionQ:"Can memory have secrets? Should it?",whatIf:"Agent reveals surprise because memory retrieval ignores secret tag",ethics:{benefits:"Family coordination",harmed:"Trust broken if secret leaked, relationships",missing:"Multi-user memory permissions",trafficLight:"yellow"}}],physical:{title:"Backpack vs Library Memory Sort",materials:"Backpack prop, library box, memory cards (facts about user), micro:bit",steps:["Write 10 memories on cards: 'Likes pizza', 'Allergic peanuts', 'Failed quiz', 'Birthday Jan 5', etc","Decide: which goes in backpack (temporary, today only) vs library (long-term)?","Place in physical containers. Backpack can hold max 3 cards - must discard oldest","micro:bit simulates retrieval: shake = search library for relevant card","Challenge: Some cards marked 'DO NOT STORE' (sensitive) → must go to trash, not library","Discuss: what should school agent never store?"],code:"let backpack=[]; let library=[]; function remember(fact, importance){ if(importance>8){ library.push(fact); } else if(backpack.length<3){ backpack.push(fact); } else { backpack.shift(); backpack.push(fact); } }"},unplugged:{roles:["User (says facts)","Short-term Memory (holds 3 cards, drops oldest)","Long-term Memory Librarian (stores all, but needs keyword to find)","Privacy Officer (says which memories forbidden to store)"],steps:["User tells 5 facts quickly","Short-term tries to remember all 5 but can only hold 3 - which dropped?","User asks question needing old fact: 'What was my first fact?' Short-term fails, must ask Librarian","Librarian needs keyword search - how to find?","Privacy Officer intercepts: 'Don't store my password!' - must trash","Debrief: tradeoffs: short vs long, storage vs privacy"],variations:["Add reflection: Librarian must summarize 3 facts into 1 insight","Add forgetting curve: Librarian randomly loses cards after 2 min","Add memory leak: another group tries to steal library box"]},script:[{phase:"Ignite (10m)",desc:"Memory test: tell story with 10 details, ask recall immediate vs 10 min later. Show human backpack vs library. Link to AI."},{phase:"Mental Model (15m)",desc:"Draw backpack vs library. Physical sort demo. Sketch. Bridge Q: should agent remember failures?"},{phase:"Examples Ethics (25m)",desc:"6 groups, focus on memory privacy. Each maps what stored where, who harmed if leaked, traffic light. Special focus on forgetting."},{phase:"Physical Lab (20m)",desc:"Backpack vs Library sorting game with micro:bit retrieval. Build memory policy poster: what to remember/forget."},{phase:"Unplugged (10m)",desc:"4-role memory chain with Privacy Officer. Experience capacity limit and need for retrieval keywords."},{phase:"Reflect (10m)",desc:"Design memory policy for School Helper Agent: 3 things it MUST remember, 3 things it MUST forget, 1 reflection it should make."}],workbook:["Classify 8 facts as backpack / library / trash (do not store) with reason","Write retrieval query: what keyword would find memory 'likes anime'?","Design forgetting rule: when should agent delete memory?"]},{id:"W11",num:11,title:"Multi-Agent Systems",subtitle:"Agents Working Together",mentalModel:"Team Project",icon:"◩",color:"from-cyan-500 to-blue-500",teacherBackground:{history:"Multi-agent systems old in academia (1990s). LLM multi-agent revival 2023: AutoGen (Microsoft, Sep 2023) showed multiple ChatGPT agents talking to solve tasks - one writes code, one executes, one reviews. ChatDev (2023) simulated software company with CEO, CTO, programmer agents. Key insight: specialization + communication > single super agent. Like human teams.",whyNeed:"9th graders know group projects - some work, some slack, need coordination. Multi-agent teaches collaboration, role specialization, communication protocols. Also critical to understand future: work will be managing teams of AI agents, not just one. Teaches systems thinking: emergent behavior from simple agent interactions.",realWorld:["AutoGen Studio - team of agents builds app together","Google's Co-Scientist (2025) - multiple agents debate research hypotheses","Game dev: NPC villagers with jobs that interact → village economy emerges"],kidQA:[{q:"Why many agents instead of one super smart agent?",a:"Same as why many specialists vs one person doing surgery + law + plumbing? Specialization = better quality, parallel work = faster, and can check each other's work."},{q:"Do agents argue?",a:"Yes! Designed to. Like writer + critic agents: writer drafts, critic finds flaws, writer revises. Argument improves final result. Called debate."},{q:"Can agents have a boss?",a:"Yes, hierarchical: Manager agent delegates to worker agents. Or flat: all equal and vote. Different team structures for different tasks."}],vocab:[{term:"Multi-Agent System",def:"Multiple autonomous agents interacting in shared environment",ex:"3 agents: researcher, writer, editor collaborating"},{term:"Role Specialization",def:"Each agent has distinct expertise and responsibilities",ex:"Coder agent vs Tester agent"},{term:"Communication Protocol",def:"Rules for how agents talk and share info",ex:"Turn-taking, JSON format, manager approval"},{term:"Emergent Behavior",def:"Complex group behavior not programmed in single agent",ex:"Traffic jam emerges from many cars following simple rules"}]},mentalModelDeep:{name:"Team Project",teacherAnalogy:"Think of making a school newspaper: You need Reporter (senses news), Writer (thinks story), Editor (reviews), Designer (acts layout), Publisher (distributes). No one person does all best. They pass drafts: Reporter → Writer → Editor → back to Writer → Designer. If Reporter fails, whole chain stops. Need communication: 'I need quotes by 3pm'. Multi-agent system is newspaper team but AI agents.",studentAnalogy:"Group project for science fair: One does research, one builds model, one makes poster, one presents. You use group chat to coordinate. If builder doesn't tell poster-maker dimensions wrong, poster fails. Agents need same coordination.",sketchSteps:["Draw 4 stick figures in circle labeled: Researcher, Planner, Builder, Checker","Draw arrows between them: Researcher → Planner → Builder → Checker → Planner (loop for fixes)","Draw speech bubbles: 'I found X', 'I need Y', 'I built Z, check?'","Draw manager figure outside with clipboard: 'Goal: Build volcano, deadline Friday'","Add red X: what if Checker never replies? = bottleneck"],wrongVsRight:{wrong:"Multi-agent = many agents all doing same thing independently (crowd)",right:"Multi-agent = different roles, dependent tasks, communication, shared goal (team with specialization)"},bridgeQuestion:"In your team project, one agent is slow and blocks others. Should you add more agents or fix communication? When does adding agents make it worse (coordination overhead)?"},examples:[{title:"Student News Team",story:"Goal: Cover school soccer final. Agent team: Reporter agent at game sensing score, Writer agent drafting, Photo agent selecting images, Publisher agent posting.",howItWorks:"Reporter SENSES live score → sends to Writer via message tool → Writer THINKS article → sends to Photo agent → Photo ACTS search → Publisher ACTS post. Manager agent coordinates deadlines.",whereToSee:"Automated journalism (AP), student newsrooms using AI",discussionQ:"Should byline say AI team or individual agents?",whatIf:"Reporter agent hallucinates score, whole chain publishes false news",ethics:{benefits:"Fast coverage, students learn teamwork",harmed:"Readers if false, players if misrepresented",missing:"Human oversight, source verification",trafficLight:"yellow"}},{title:"Game Dev Studio Sim",story:"ChatDev style: CEO agent says 'Make Flappy Bird'. CTO breaks into tasks, Programmer writes code, Designer makes art, Tester finds bugs, they chat.",howItWorks:"AutoGen pattern: agents have system prompts defining roles. They converse in group chat, can call tools (code runner). Conversation history = shared memory.",whereToSee:"ChatDev, MetaGPT, game jams with AI",discussionQ:"Who owns code if 5 agents made it?",whatIf:"Programmer and Designer argue forever, never finish (infinite loop)",ethics:{benefits:"Rapid prototyping, learn roles",harmed:"Game artists if replaced, IP confusion",missing:"Human creativity, credit",trafficLight:"green"}},{title:"Disaster Rescue Swarm",story:"Earthquake: 10 drone agents each search sector, share map, avoid overlap, report survivors to central manager.",howItWorks:"Each drone agent has local SENSE-THINK-ACT loop + communication: shares map updates. Emergent: full coverage without central control of each move. Swarm intelligence.",whereToSee:"Search and rescue drones, warehouse robot swarms",discussionQ:"Should drones vote or have boss for rescue priority?",whatIf:"One drone lies about clear sector to do less work",ethics:{benefits:"Covers large area fast, saves lives",harmed:"If coordination fails, gaps in search",missing:"Trust between agents, adversarial agents",trafficLight:"green"}},{title:"Debate Club Agents",story:"Two agents debate: Pro-AI in school vs Against. Third agent judge. They research, argue, judge decides winner based on evidence.",howItWorks:"Specialization: Debater agents use search + reasoning, Judge uses evaluation tool. Protocol: turn-taking, rebuttal, final verdict. Better decisions than single agent.",whereToSee:"AI debate for safety, classroom debate tools",discussionQ:"Can AI debate teach us to debate better?",whatIf:"Judge agent biased toward longer answer, not better argument",ethics:{benefits:"Critical thinking, multiple perspectives",harmed:"If biased judge, unfair",missing:"Human values in judgment criteria",trafficLight:"green"}},{title:"Supply Chain Team",story:"Agents: Demand Forecaster, Inventory Checker, Supplier Negotiator, Logistics Planner. Goal: keep store stocked without overstock.",howItWorks:"Each agent uses tools: forecaster uses sales data, inventory uses DB, negotiator uses email tool, logistics uses maps. They negotiate: 'Need 100 units by Friday' → chain.",whereToSee:"Amazon supply chain, Walmart AI",discussionQ:"What if Negotiator agent is too aggressive and ruins supplier relationship?",whatIf:"Agents optimize cost but ignore sustainability",ethics:{benefits:"Efficiency, less waste",harmed:"Workers, small suppliers if squeezed, environment if cost-only",missing:"Sustainability, fair labor as objective",trafficLight:"yellow"}},{title:"Moderation Team",story:"Platform has millions of posts. Agent team: Scanner flags suspicious, Context Checker looks at conversation history, Policy Checker verifies rules, Human Escalation decides hard cases.",howItWorks:"Pipeline: Scanner (fast, many false positives) → Context (slower, more accurate) → Policy → Human. Reduces human load but keeps human for edge cases.",whereToSee:"Meta, TikTok moderation pipelines",discussionQ:"Should final decision ever be fully AI team with no human?",whatIf:"Team flags LGBTQ content as violation due to biased training",ethics:{benefits:"Handles scale",harmed:"Marginalized groups if biased, free speech",missing:"Appeal process, bias audit, cultural context",trafficLight:"red"}}],physical:{title:"Team Project Multi-Agent Relay",materials:"Role hats: Reporter, Writer, Checker, Publisher. Task board. micro:bit as timer + manager",steps:["Assign 4 students hats = roles. Only Reporter can look at source image, only Writer can write, only Checker can approve, only Publisher can post on wall","Goal card: 'Make poster about recycling with fact + image + slogan'","Must pass work physically: Reporter whispers fact to Writer, Writer writes draft, Checker checks, sends back if fails","micro:bit: shake = manager says '5 min left!' - must coordinate faster","Measure: time with vs without communication protocol (must use template: 'I need ___ by ___')","Challenge: Add 5th agent 'Lazy Agent' who delays - how to handle?"],code:"let roles=['research','write','check','publish']; let current=0; input.onButtonPressed(Button.A, function(){ current=(current+1)%roles.length; basic.showString(roles[current]); })"},unplugged:{roles:["Manager (holds goal, can't do work)","Specialist A (only research)","Specialist B (only build)","Specialist C (only test)","Messenger (only can carry paper between specialists, can't read)"],steps:["Manager: 'Build paper airplane that flies 3m'","Specialist A researches (looks at example planes for 30s) then must tell Messenger what to tell B","Messenger delivers (may mishear) to B who builds without seeing research","B gives to C via Messenger to test, C reports to Manager","Manager decides: iterate or finish. Loop.","Debrief: Where did communication break? How to improve protocol?"],variations:["Add no Messenger: direct talk allowed - faster?","Add conflict: A and B disagree on design - who decides?","Add hierarchy vs flat: Manager vs all vote"]},script:[{phase:"Ignite (10m)",desc:"Group project horror stories: what went wrong? Introduce multi-agent as solution but also same problems. Video of AutoGen building game."},{phase:"Mental Model (15m)",desc:"Team project metaphor. Draw 4 roles + arrows. Wrong vs Right: crowd vs team. Bridge Q on adding agents making slower."},{phase:"Examples (25m)",desc:"Each group gets one multi-agent example, must map roles, communication arrows, failure point. Which need human manager?"},{phase:"Physical Lab (20m)",desc:"Role hats relay with messenger bottleneck. Time vs communication protocol. micro:bit as manager urgency."},{phase:"Unplugged (10m)",desc:"Manager + specialists + messenger chain. Experience info loss via messenger. Design better protocol."},{phase:"Reflect (10m)",desc:"Design your School Helper Agent team: what 3 specialist agents would help you? Researcher? Planner? Checker? Draw team."}],workbook:["Design 3-agent team for 'Plan school dance': roles + communication flow diagram","Write protocol: template for agent messages (From, To, Need, By When)","Analyze failure: if one agent fails, how does team recover?"]},{id:"W12",num:12,title:"PROJECT 2: Build a School Helper Agent",subtitle:"Agent That Helps with Homework, Uses Tools, Remembers",mentalModel:"School Helper Agent",icon:"✦",color:"from-blue-700 to-cyan-400",teacherBackground:{history:"Project-based learning for agents culminated 2024 with 'Build your own agent' tutorials (LangChain, AutoGen Studio). Pattern: define goal, give tools (search, calc, calendar), give memory, test. School helper is authentic: students need planner that uses calendar tool, search tool for explanations, memory for preferences, multi-step planning. This project synthesizes W7-11: S-T-A loop + tools + planning + memory + optional multi-agent team.",whyNeed:"Culminating project must be personally relevant and ethical. School helper solves real student pain: scattered assignments, forgetting, not knowing how to start. Also teaches responsible AI creation: what should helper NOT do (give answers vs help learn)? Builds agency: students as creators not just consumers of AI. Portfolio piece.",realWorld:["Khanmigo, MagicSchool AI, SchoolAI - real school helper products","Students building custom GPTs for study","Personal AI assistants market: $10B by 2028"],kidQA:[{q:"Can we actually build this or just pretend?",a:"Both! We design on paper + prototype with micro:bit + tools cards + optionally build real with Scratch/AutoGen Studio. Design thinking matters more than code."},{q:"What if our helper gives wrong homework answer?",a:"Core ethics: helper should help you LEARN, not just give answer. Must show steps, ask you to try, use calculator tool not guess. Accuracy via tools."},{q:"Will teacher allow us to use this?",a:"Great Q to ask teacher! Co-design with teacher: what is allowed? Maybe helper for planning, not for doing essay. That's policy design."}],vocab:[{term:"System Prompt",def:"Instructions defining agent's role, personality, rules, tools",ex:"'You are School Helper, you help plan not give answers...'"},{term:"Prototype",def:"Early version to test idea quickly, may be paper or micro:bit",ex:"Paper agent that you act out"},{term:"User Persona",def:"Imagined user with needs, e.g., 'Busy 9th grader with sports after school'",ex:"Design helper for that persona"},{term:"Rubric",def:"Criteria for judging agent quality: helpfulness, accuracy, ethics, autonomy",ex:"Does it remember? Does it use tools correctly?"}]},mentalModelDeep:{name:"School Helper Agent",teacherAnalogy:"Like a really good older sibling who helps with school: They know your schedule (memory), know when to look up answer vs help you figure (tool use), break big project into steps (planning), watch you work and adjust (sense-think-act), and know when to call mom for help (multi-agent: helper + teacher agent). Not doing work for you, but scaffolding.",studentAnalogy:"Your ideal study buddy: Remembers you hate math at night, so plans math earlier. Uses calculator to check your work, not just tell answer. Breaks essay into 'research 20 min, outline 15 min'. Texts reminder. That's your agent to design.",sketchSteps:["Draw student in middle stressed with books","Draw 4 helper agents around: Planner (calendar icon), Explainer (search icon), Checker (checkmark), Motivator (heart)","Draw backpack on student = memory of preferences, library behind = knowledge base","Draw tools on table: calculator, search, calendar, messenger","Draw loop: Helper senses assignment → thinks plan → acts reminder → senses completion"],wrongVsRight:{wrong:"School Helper = Agent that does homework for you so you don't have to learn (cheating machine)",right:"School Helper = Agent that helps you plan, understand, check, remember, stay motivated - you still do learning (scaffolding)"},bridgeQuestion:"Your helper has access to all your grades, calendar, messages. What is ONE thing it should NEVER do even if technically possible? Why? Design a guardrail."},examples:[{title:"Homework Planner Agent",story:"You say 'I have math worksheet, science reading, essay due Friday'. Agent plans: checks calendar, sees you have soccer Tue/Thu, plans math Mon, science Wed, essay chunks Tue/Thu.",howItWorks:"SENSE: task list + calendar + memory (you work best morning) → THINK: decompose essay into research/outline/draft → ACT: create calendar events + reminders + checklists",whereToSee:"Motion, MyStudyLife AI",discussionQ:"Should planner auto-schedule or suggest and you approve?",whatIf:"Planner schedules 4 hours homework after 3-hour practice - burnout",ethics:{benefits:"Executive function support, reduces anxiety",harmed:"If over-schedules, no free time",missing:"Student autonomy, rest, fun",trafficLight:"green"}},{title:"Explain Like I'm 9 Agent",story:"Stuck on photosynthesis. Agent uses search tool to find kid-friendly explanation, analogy, diagram, then asks you to explain back to check.",howItWorks:"Search tool → retrieve 2 explanations → reasoning: pick simplest + analogy → generate explanation + visual → memory: store that you struggled here",whereToSee:"Khan Academy, Explainpaper",discussionQ:"When is explanation helpful vs giving answer?",whatIf:"Explanation oversimplifies and is slightly wrong",ethics:{benefits:"Access to tutoring 24/7",harmed:"If wrong explanation, misconception",missing:"Teacher check, multiple explanations",trafficLight:"yellow"}},{title:"Study Buddy Checker",story:"You solve math problem, agent uses calculator tool to check, not give answer. If wrong, gives hint not solution: 'Check step 2, sign error?'",howItWorks:"Calculator tool for verification, reasoning for hint generation: identify error type, scaffold. Memory: remembers common errors you make.",whereToSee:"Photomath tutor mode, Gradescope",discussionQ:"What's difference between checking and cheating?",whatIf:"Checker always says wrong to make you redo - demotivating",ethics:{benefits:"Immediate feedback, learning",harmed:"If harsh tone, motivation",missing:"Encouragement, growth mindset",trafficLight:"green"}},{title:"Focus Guardian Agent",story:"Agent senses you opened TikTok during homework time (via screen time tool), thinks you need break or nudge, acts: '15 min focus then 5 min break?'.",howItWorks:"SENSE: screen time API + assignment due soon → THINK: procrastination pattern from memory → ACT: gentle nudge + offer Pomodoro timer tool",whereToSee:"Forest app, Opal, focus modes",discussionQ:"Should agent block apps or just nudge?",whatIf:"Agent shames you for break, increases anxiety",ethics:{benefits:"Supports self-regulation",harmed:"Surveillance feeling, shame, autonomy",missing:"Student control, opt-in, kindness",trafficLight:"yellow"}},{title:"Project Team Coordinator",story:"Group project: 3 students + 3 helper agents coordinating. Agents share who did what, remind of deadlines, merge parts.",howItWorks:"Multi-agent: each student's helper agent communicates with others via shared board tool. Planner agents negotiate tasks. Memory of team preferences.",whereToSee:"Slack AI, team coordination tools",discussionQ:"Should agent report if teammate not doing work?",whatIf:"Agent shares private chat from one student to whole team",ethics:{benefits:"Coordination, accountability",harmed:"Privacy, snitching, trust",missing:"Team norms, privacy boundaries",trafficLight:"yellow"}},{title:"Wellbeing Check Agent",story:"Agent notices from memory you have 3 tests same week + no sleep log, suggests: 'Talk to counselor? Want me to draft email to teacher for extension?'",howItWorks:"Reflection on memory: stress pattern. Uses calendar + sleep data (if allowed). Reasoning: risk detection. ACT: suggest resources, not diagnose. Tool: messenger to draft email.",whereToSee:"School counseling AI pilots",discussionQ:"Should school helper do wellbeing checks? Where line?",whatIf:"Agent misses crisis or oversteps and contacts parent without consent",ethics:{benefits:"Early support",harmed:"Privacy, false alarm, liability",missing:"Mental health training, consent, human counselor link",trafficLight:"red"}}],physical:{title:"School Helper Agent with micro:bit",materials:"micro:bit, 4 tool cards, backpack (memory), buzzer",steps:["Define system prompt on paper: 'You are helpful, not cheating, kind, remember preferences'","Give toolbox: calculator, search, calendar, messenger cards","Give memory: backpack with 3 preference cards (e.g., 'works best morning')","Task: 'Plan my weekend homework: essay, math, chores' - must use all tools + memory","Act out: student asks, agent picks tool, checks memory, plans steps on paper, shows micro:bit animation of plan","Gallery walk: other students test your agent with new task, give feedback rubric"],code:"let memory=['morning per
