!km.hasOwnProperty(n)&&(i[n]=t[n]);if(e&&e.defaultProps)for(n in t=e.defaultProps,t)i[n]===void 0&&(i[n]=t[n]);return{$$typeof:gm,type:e,key:l,ref:o,props:i,_owner:wm.current}}var jo=vm,s=Oc,p=Oc;var Lt=[{id:"W19",num:19,title:"Accuracy Isn't Enough",subtitle:"Precision, Recall",mentalModel:"Fishing Net",emoji:"\uD83C\uDFA3",color:"from-pink-500 to-rose-500",tag:"Foundation",teacherEmpowerment:{whatIsThisReally:"Precision and Recall were formalized in the 1950s for Information Retrieval at Cranfield. Precision answers: Of everything you retrieved, how many were truly relevant? Recall answers: Of all relevant items that exist, how many did you find? Together they reveal trade-offs that raw accuracy hides, especially with imbalanced classes. Understanding this split is how modern search, spam filters, and medical AI are actually evaluated.",why7thGradersNeedThis:"Kids think 95% accuracy means 'good.' But a spam filter that says 'not spam' for everything is 95% accurate if only 5% are spam - yet useless. They live this daily when TikTok shows them irrelevant videos or misses ones they love. Precision/Recall gives them language for that frustration.",realWorldBehindTheScenes:"Gmail doesn't chase pure accuracy. If it marks a real job offer as spam (low precision), you lose trust. If it lets 30% of spam through (low recall), you're annoyed. Google tunes thresholds: strict for inbox (high precision), looser for spam folder review (high recall). Engineers plot Precision-Recall curves to pick the sweet spot per user - no code shown, just threshold sliders.",kidQuestionsAndAnswers:[{q:"Is high accuracy always good?",a:"No! Imagine a test that always says 'healthy' - 99% accurate if 99% are healthy, but it misses every sick person. Accuracy lies when data is unbalanced. Precision and Recall tell the truth."},{q:"Why can't we have 100% precision AND recall?",a:"It's like a fishing net: tiny holes catch everything (high recall) but also trash (low precision). Big holes catch only big good fish (high precision) but miss many good small fish (low recall). You choose based on what's worse to miss."},{q:"Which is more important?",a:"Depends on cost. For fire alarms, high recall is life-saving - better false alarm than missed fire. For court verdicts, high precision - better to miss a guilty than punish innocent. AI design is choosing your values."}],vocabForTeacher:[{term:"Precision",teacherDef:"TP / (TP+FP) - fraction of positive predictions that were correct.",kidDef:"Of all fish you kept, how many were good eating fish?",pron:"pri-SIH-zhun",visual:"\uD83C\uDFAF Bullseye hits vs all darts thrown"},{term:"Recall",teacherDef:"TP / (TP+FN) - fraction of actual positives found.",kidDef:"Of all good fish in the lake, how many did you catch?",pron:"re-CALL",visual:"\uD83E\uDD45 Net coverage of lake"},{term:"Confusion Matrix",teacherDef:"2x2 table of TP, TN, FP, FN counts.",kidDef:"Report card showing 4 kinds of right/wrong answers.",pron:"con-FYOO-zhun MAY-trix",visual:"\uD83D\uDCCA Four boxes"},{term:"Threshold",teacherDef:"Score cut-off that turns probability into yes/no decision.",kidDef:"How sure you must be before you shout 'I found it!'",pron:"THRESH-hold",visual:"\uD83C\uDF9A️ Slider knob"}]},mentalModelDeep:{name:"Fishing Net",teacherAnalogy:"Explain evaluation like fishing with different nets. Accuracy is 'did I bring back the right total weight?' But precision is purity of catch - 9 tuna + 1 boot = 90% precision. Recall is completeness - if 20 tuna lived there and you caught 9, 45% recall. Teachers can hold physical net (laundry basket) with paper fish.",studentAnalogy:"Your net is your AI. Tight net = you only keep perfect fish but miss many. Wide net = you get all good fish but also yucky trash. Which net would you pick to clean a swimming pool vs find treasure?",sketchSteps:["1. Draw lake with 10 gold fish (good) + 10 gray boots (bad) - 15 seconds","2. Draw Net A (tiny holes) catching 4 gold, 0 boots - label Prec 100%, Rec 40%","3. Draw Net B (huge) catching 9 gold + 8 boots - Prec 53%, Rec 90%","4. Draw scale: When is boot worst? When is missed gold worst?","5. Add slider: Moving threshold = changing hole size"],commonWrongModel:{wrong:"More accuracy = better net. 95% accuracy net must be best.",right:"Best net depends on goal. Cleaning lake needs high recall, picking dinner needs high precision. Accuracy hides which mistakes you make."},bridgeQuestion:"If our waste sorter says 'recyclable' for everything, accuracy 60% (since 60% is recyclable) but precision 60% and recall 100% - would you trust it for a real recycling plant? Why not?"},examplesBank:[{title:"Spam Filter Disaster",story:"Maya's filter says 'not spam' for 950 emails, only 50 are spam. It gets 95% accuracy by saying everything is not spam. But it misses all real spam - recall 0%.",howItWorks:"Model learned majority class bias. Precision for 'spam' is undefined (0 predictions), Recall 0/50 = 0%. Needs balancing.",whereToSee:"Gmail spam folder count",discussionQ:"Would you prefer spam in inbox or missing real email?",whatIf:"What if 50% were spam? Then accuracy would drop and force model to learn.",ethicsLens:{benefits:"Shows why accuracy lies",harmed:"User drowned in spam if deployed",missing:"No cost for false negatives",trafficLight:"Yellow"}},{title:"Doctor AI - Cancer Screening",story:"AI flags 100 scans: 80 truly cancer, 20 not. But 20 real cancers were missed in 500 patients.",howItWorks:"Precision 80/100=80%, Recall 80/100=80% actually 80/100? Wait: TP 80, FN 20, so recall 80%. Good balance for screening.",whereToSee:"Hospital radiology AI",discussionQ:"Should doctor AI favor recall over precision? Why?",whatIf:"If AI flagged 400 scans to get 100% recall, precision drops to 20% - doctors overwhelmed.",ethicsLens:{benefits:"Catches disease early",harmed:"False alarms cause anxiety",missing:"Radiologist workload",trafficLight:"Red"}},{title:"Dog vs Cat - Treat Dispenser",story:"Smart feeder should give treats only to dog. It gives 9 dog treats correctly, 1 to cat, misses 2 dog moments.",howItWorks:"Precision 9/10=90% (cat upset 10% time), Recall 9/11=82% (dog sad missed 18%). Kid chooses threshold.",whereToSee:"Pet cameras on TikTok",discussionQ:"Which mistake is funnier vs worse?",whatIf:"Add bark sound sensor: precision up?",ethicsLens:{benefits:"Fun personalization",harmed:"Cat",missing:"Other pets",trafficLight:"Green"}},{title:"Fire Alarm Trade-off",story:"School alarm: high recall version rings for burnt toast. High precision version waits too long, misses real smoke.",howItWorks:"Threshold low = recall 99%, precision 30%. Threshold high = precision 95%, recall 60%. Life safety needs recall.",whereToSee:"School ceiling sensor",discussionQ:"Where should we set alarm threshold?",whatIf:"Add heat + smoke = two features improves both.",ethicsLens:{benefits:"Saves lives",harmed:"Disruption from false alarms",missing:"Kids with anxiety",trafficLight:"Red"}},{title:"Waste Sorter W19 Baseline",story:"Our W18 waste classifier: 70% accuracy but says 'landfill' for all black plastic, missing recyclable.",howItWorks:"Confusion matrix shows high FN for recyclable. Recall for recyclable only 55% despite 70% overall accuracy.",whereToSee:"Our micro:bit sorter bin",discussionQ:"Why does accuracy hide this?",whatIf:"If we collected more black plastic examples, recall improves.",ethicsLens:{benefits:"Baseline to improve",harmed:"Recyclable wasted",missing:"Compost class",trafficLight:"Yellow"}},{title:"YouTube Recommendations",story:"YouTube suggests 20 videos, you like 12. But there were 50 you would have liked total.",howItWorks:"Precision 12/20=60%, Recall 12/50=24%. Good precision but poor recall = filter bubble.",whereToSee:"YouTube home page",discussionQ:"Do you want high precision (all hits) or high recall (discover new)?",whatIf:"If you watch diverse content, recall rises but precision drops.",ethicsLens:{benefits:"Keeps engagement",harmed:"Limits discovery",missing:"Creators not seen",trafficLight:"Yellow"}}],physicalComputing:{anchor:"Fishing Net with Labeled Fish - Precision/Recall Physical Sorting",materials:["Laundry basket net","20 paper fish (10 gold stars, 10 gray X)","2 hoops (small/large)","micro:bit + light sensor"],wiring:"No wiring - or optional: micro:bit on pin0 reads light sensor for 'fish size'. If light < 100 = big fish. Display P or R on LED.",code:"onButtonA: count caught. onButtonB: count good. Show precision = good/caught. Use makeCode blocks: show number.",steps:["Scatter fish","Student as model picks with small hoop (high precision)","Record TP, FP, FN","Repeat with large hoop (high recall)","Calculate both"]},communityData:{note:"Class pools confusion matrices to see accuracy vs precision gap",visual:"Bar chart of 3 classes: accuracy 70% flat, but recyclable recall 45%, 55%, 62%"},ethicsLensWeekly:"When accuracy hides harm: who is missed?",lesson90Detailed:{prep:"Print 60 fish (30 good,30 bad), 3 hoops, chart paper, confusion matrix blank. Pre-fill example Gmail slide.",flow:[{time:"0-10 Warm-up",goal:"Expose accuracy lie",script:"Everyone, yesterday our sorter got 70% - is that good? Let's test. I have a trick. This AI says 'not spam' for everything - 95% accurate! Is it smart? Turn and talk 30 sec. No, it's cheating. Today we learn how to catch cheating with two new rulers: precision and recall. Show fishing net.",studentAction:"Turn-talk, shout 'cheating!'",materials:"Slide accuracy trick",check:"Green: Students say 'it always says same thing' - they spot majority class.",stuck:"Orange: If stuck, show 10 blue marbles, 90 red, model says all red - 90% but useless. Ask: what did it learn?"},{time:"10-25 Concept",goal:"Define precision/recall with net",script:"Draw lake, 10 gold good, 10 boots bad. Net A small catches 3 gold 0 boots - precision? Of caught, how many good? 3/3 = 100%. Recall? Of all good, how many caught? 3/10=30%. Great dinner but lake still dirty. Net B huge catches 9 gold 8 boots - precision 9/17=53% recall 90%. Which for cleaning pool? Which for dinner? You just did evaluation.",studentAction:"Draw nets, calculate with fingers, vote",materials:"Whiteboard, fish cutouts",check:"Green: Can explain both in own words: precision = good among caught, recall = caught among good.",stuck:"Orange: Use hand: left hand caught, right hand all good in lake. Count."},{time:"25-45 Unplugged",goal:"Physical confusion matrix",script:"Roles: Trainer holds bag of fish, Model wears blindfold picks, Tester checks if gold, Recorder fills matrix. Each team gets 2 hoops. First round small hoop, second large. Fill TP FP FN TN. Now compute. Which hoop for fire alarm? Discuss 2 min. Walk and see boards - notice trade-off.",studentAction:"Run 2 rounds, fill matrix, present",materials:"Hoops, fish, matrix sheets",check:"Green: Matrix sums to 20, precision/recall computed correctly.",stuck:"Orange: Give pre-filled example: TP 4 FP1 FN6 - what's precision? Coach."},{time:"45-60 Micro:bit Anchor",goal:"Link to sensor",script:"Our waste sorter is Net A or B? Look at W18 data: we missed many recyclables = low recall. Let's simulate: micro:bit light sensor as fish size. If dark, we keep fish. Button A = caught, Button B = good count. Try threshold 100 vs 200. See precision/recall change live on LEDs. Record which threshold gives best F1 for recyclable.",studentAction:"Code threshold, test 10 objects",materials:"micro:bit, light sensor, waste samples",check:"Green: Students can change threshold and read LEDs for P/R.",stuck:"Orange: Use pre-made hex file, focus on counting, not coding."},{time:"60-80 Examples + Ethics",goal:"Apply to 6 stories",script:"Gallery walk 6 posters - spam, doctor, dog, fire alarm, sorter, YouTube. For each, mark P/R high/low and traffic light. Pick one Red - who is harmed? 3-min debate: Should fire alarm favor precision or recall? Vote with feet: left = precision, right = recall. Explain choice.",studentAction:"Gallery, traffic light stickers, debate",materials:"6 posters, red/yellow/green dots",check:"Green: Can justify threshold choice with harm story.",stuck:"Orange: Give sentence starter: 'If we miss ___, ___ happens, so I pick recall because...'"},{time:"80-90 Workbook & Exit",goal:"Calculate from matrix",script:"Workbook page: Given matrix TP 30 FP10 FN20 TN40. Compute precision, recall, accuracy. Which is misleading? Exit ticket: Give example where high accuracy hides low recall. Collect. Preview W20 fairness - does net work same for small fish vs big fish? Homework: find app with precision/recall trade-off at home.",studentAction:"Individual calc, exit slip",materials:"Workbook",check:"Green: 30/40=75% prec, 30/50=60% rec, acc 70%. Can name example.",stuck:"Orange: Provide formula cards, calculator allowed."}]},unpluggedActivityEnlarged:{roles:["Trainer: hides fish","Model: picks blind","Tester: reveals gold/boot","Recorder: fills matrix & calculates"],materials:"20 fish, 2 hoops, matrix poster, markers",steps:["1. Trainer scatters 10 gold 10 boots","2. Model picks 7 with small hoop blindfolded","3. Tester reveals: count TP (gold caught) FP (boot caught)","4. Count FN: gold left in lake","5. Compute precision = TP/(TP+FP), recall=TP/(TP+FN)","6. Repeat with large hoop","7. Decide which hoop for which job: cleaning vs dinner"],variations:"Fast: 10 fish only. Slow: Add 3rd hoop medium, plot 3 points on PR curve.",observes:"Do they count FN correctly? Do they see trade-off? Do they argue threshold?",mistakes:["Confusing precision with accuracy","Forgetting FN in recall denominator","Thinking higher both always possible without better model"]},workbook:{tasks:["Fill confusion matrix from fishing game","Calculate precision/recall for 3 matrices","Design threshold for fire alarm vs court verdict","Ethics: which error hurts more?"],answerKey:"Matrix 1: TP30 FP10 FN20 -> Prec 75% Rec 60% Acc 70%. Accuracy misleading because FN high."}},{id:"W20",num:20,title:"Fairness Metrics",subtitle:"Does It Work For All?",mentalModel:"Fair Referee",emoji:"⚖️",color:"from-purple-500 to-fuchsia-500",tag:"Ethics Core",teacherEmpowerment:{whatIsThisReally:"Algorithmic fairness emerged into public debate after ProPublica's 2016 analysis of COMPAS recidivism scores showing higher false positive rates for Black defendants. Fairness isn't one metric - it's checking performance sliced by group: does your precision/recall hold for light skin vs dark skin, male vs female, urban vs rural waste? Group fairness asks for equal error rates, not just equal overall accuracy.",why7thGradersNeedThis:"Face unlock that works for teacher but not for 2 students is not '80% accurate' - it's unfair. They've felt this when beauty filters lighten skin or when voice assistants don't understand accents. Learning to audit per group gives them power to demand better, not just accept average.",realWorldBehindTheScenes:"Amazon built a hiring AI that downgraded resumes with 'women's chess club' - overall accuracy looked okay, but recall for women was terrible. Auditors sliced data by gender and found disparity. Amazon scrapped it. Modern audits at Microsoft and Google require 'disaggregated evaluation' - separate confusion matrix per demographic, then fix data gap.",kidQuestionsAndAnswers:[{q:"Can AI be fair?",a:"AI copies past data. If past data was unfair, AI learns unfairness. But we can measure fairness by checking accuracy for each group separately. Fair referee checks each team, not just final score."},{q:"Is it enough to be colorblind and ignore groups?",a:"No. Ignoring groups hides problems. Like a teacher who says 'I treat everyone same' but only calls on loud kids. You must look at results per group to see if quiet kids are missed."},{q:"What if we have little data for one group?",a:"Then model is less practiced for them - like studying only math but tested on science. Solution: collect more examples from underrepresented group, or balance data."}],vocabForTeacher:[{term:"Fairness",teacherDef:"Model performs similarly across demographic groups, equal opportunity to be correctly classified.",kidDef:"Referee calls same for both teams.",pron:"FAIR-ness",visual:"⚖️ Balanced scale"},{term:"Disaggregated Evaluation",teacherDef:"Evaluating metrics separately per subgroup rather than aggregate.",kidDef:"Grade per team, not just whole league.",pron:"dis-AG-ri-gay-ted",visual:"\uD83D\uDCCA Split bars per group"},{term:"Bias",teacherDef:"Systematic error favoring one group, from data or model design.",kidDef:"Always picking same team, even accidentally.",pron:"BUY-us",visual:"\uD83E\uDDF2 Magnet pulling"},{term:"False Positive/Negative Rate",teacherDef:"Rate of errors per group; disparity indicates unfairness.",kidDef:"How often referee makes bad call for each team.",pron:"FALLS...",visual:"\uD83D\uDEA9 Wrong whistle"}]},mentalModelDeep:{name:"Fair Referee",teacherAnalogy:"A referee who only looks at total correct calls might seem 90% fair, but if you slice: Team A gets 95% correct calls, Team B gets 60% - referee is biased. Same with AI: overall 85% accuracy can hide 60% for dark-skin faces. Fair referee watches replay per team. Draw two teams, tally calls per team.",studentAnalogy:"Imagine your game where referee only helps tallest kids. Average help looks okay, but short kids never get ball. Fairness means checking: does AI help all kids equally?",sketchSteps:["1. Draw field, Team Light and Team Dark, each 10 players","2. Draw referee whistle, tally: Light team 9/10 correct, Dark team 5/10","3. Overall 14/20=70% - looks okay but split shows 90% vs 50%","4. Draw scale tilted to Light team","5. Fix: give referee glasses = more data for Dark team, rebalance"],commonWrongModel:{wrong:"If overall accuracy is high, it's fair for everyone. Don't look at groups.",right:"Overall hides group gaps. You must slice and check each group like referee watching each team replay."},bridgeQuestion:"Our waste sorter: does it work equally for shiny plastic vs matte black plastic? If not, is it fair to all waste types? How would you check?"},examplesBank:[{title:"Face Unlock Fails",story:"Jada's phone unlocks for her brother but not her. Test: 20 light-skin friends 18/20 unlock, 20 dark-skin friends 10/20.",howItWorks:"Training data had 80% light skin. Model recall 90% vs 50%. Disaggregated eval shows gap.",whereToSee:"Phone face ID settings",discussionQ:"Whose data was missing?",whatIf:"Add 500 dark-skin images, recall rises to 85%",ethicsLens:{benefits:"Security",harmed:"Dark-skin users excluded",missing:"Inclusive dataset",trafficLight:"Red"}},{title:"Voice Assistant Accent",story:"Alexa understands US accent 95%, but understands Maya's Trinidad accent 60%.",howItWorks:"Speech data mostly US. WER (word error) disparity. Fairness audit per accent.",whereToSee:"Smart speaker",discussionQ:"Is it fair to launch without accent data?",whatIf:"Collect accent data from community",ethicsLens:{benefits:"Convenience",harmed:"Non-US speakers",missing:"Accent diversity",trafficLight:"Red"}},{title:"Hiring Filter Bias",story:"Resume screener picks 90% men for tech, 20% women with same skills.",howItWorks:"Historical hires biased, model learned keyword 'executed' vs 'collaborated'. Precision for women low.",whereToSee:"LinkedIn Easy Apply",discussionQ:"Should AI hire?",whatIf:"Remove gendered words, blind resume",ethicsLens:{benefits:"Speed",harmed:"Women candidates",missing:"Fair criteria",trafficLight:"Red"}},{title:"Waste Sorter Color Bias",story:"Our sorter: white plastic 90% accuracy, black plastic 40% - sensor can't see black.",howItWorks:"Light sensor low contrast for black. Disaggregated by color shows fairness fail.",whereToSee:"Our bins",discussionQ:"Is sorter fair to all waste?",whatIf:"Add weight sensor - feature engineering fixes fairness",ethicsLens:{benefits:"Recycling",harmed:"Black plastic waste stream",missing:"Sensor choice",trafficLight:"Yellow"}},{title:"Medical AI Skin Tone",story:"Skin disease AI trained on light skin: 85% accuracy light, 55% dark. Misses melanoma on dark skin.",howItWorks:"Dermatology datasets biased. Recall gap dangerous. FDA now requires diverse testing.",whereToSee:"Health app",discussionQ:"Who is harmed when data missing?",whatIf:"Add diverse images, recall equalizes",ethicsLens:{benefits:"Early diagnosis",harmed:"Dark skin patients risk",missing:"Diverse dermatology data",trafficLight:"Red"}},{title:"YouTube Kids Recommendation Fairness",story:"Kids channel recommends science videos to boys 80%, to girls 30% - same interest.",howItWorks:"Watch history gendered, model amplifies. Fairness = equal recommendation rate for same interest.",whereToSee:"YouTube Kids",discussionQ:"Does algorithm create stereotypes?",whatIf:"Debias by interest not gender",ethicsLens:{benefits:"Engagement",harmed:"Girls less exposed to science",missing:"Interest-based not gender",trafficLight:"Red"}}],physicalComputing:{anchor:"Fair Referee - Test Classifier With Different Groups, micro:bit Shows Fairness",materials:["micro:bit x2","Color cards: white/black plastic","Fairness audit sheet"],wiring:"micro:bit A: light sensor pin0. micro:bit B: displays group accuracy. Radio: send result to B.",code:"If pin0 > threshold -> recyclable. Log per group. B shows bar chart: Group A bar 9/10, Group B 4/10. Flash unhappy face if gap >20%.",steps:["Test 10 white items, 10 black items","Log TP per group on micro:bit","Display fairness gap","Discuss fix: add sensor"]},communityData:{note:"Pool fairness per material type across 3 classes, shows black plastic gap universal",visual:"Grouped bar: White 88%, Clear 82%, Black 41% average"},ethicsLensWeekly:"Average lies: who is missing from average?",lesson90Detailed:{prep:"Print fairness audit sheets (group columns), color cards, 2 micro:bits with radio code. Prepare ProPublica simplified slide.",flow:[{time:"0-10 Warm-up",goal:"Feel unfairness",script:"Quick game: I will only call on front row today. Is that fair? Front row 100% chance, back row 0%. But overall I called 5 students = looks like I taught. That's average hiding unfairness. Today we become fair referees for AI - we check each group separately, not just average.",studentAction:"Experience bias, discuss",materials:"Seating",check:"Green: Says 'overall number hides who was ignored'",stuck:"Orange: Show candy: give 10 to 1 group, 0 to other, average 5 each - is that fair?"},{time:"10-25 Concept",goal:"Disaggregated eval",script:"Remember fishing net? What if net works for big fish but not small fish? That's fairness. Draw referee with two teams. Tally per team. Overall 70% but Team Dark 50%. That's bias. Real story: 2016 ProPublica found court AI flagged Black defendants as high risk 45% vs white 23% - same past but unfair. How do we catch? Slice data by group, compute recall per group.",studentAction:"Draw referee, calculate per team",materials:"Board",check:"Green: Can compute per-group recall",stuck:"Orange: Use 2 separate confusion matrices side by side."},{time:"25-45 Unplugged",goal:"Audit waste sorter by color",script:"Roles: Tester for white plastic, tester for black plastic, recorder per group. Test our W19 sorter with 10 each. Fill audit sheet: accuracy white? black? Gap? Is that fair? If gap >15% we call unfair referee. Rotate. What fixes? More data for black or new sensor.",studentAction:"Test 20 items, audit",materials:"Plastic samples, audit sheet",check:"Green: Identifies gap and names cause: sensor or data",stuck:"Orange: Provide pre-counted results: white 9/10 black 4/10 - what's gap?"},{time:"45-60 Micro:bit",goal:"Visualize fairness",script:"Micro:bit A senses, B shows two bars. Radio send group label. Code: if group white, increment white correct; if black, black correct. B displays bar height and unhappy if gap big. Test live - see unfairness light up. Now brainstorm new feature to close gap.",studentAction:"Run radio fairness meter",materials:"2 micro:bits, radio",check:"Green: Micro:bit shows gap visually",stuck:"Orange: Use single micro:bit, show two numbers sequentially."},{time:"60-80 Examples + Ethics Wall",goal:"Apply lens",script:"Gallery 6 examples - face unlock, voice accent, hiring, waste, medical, YouTube kids. For each, mark harmed group, traffic light Red if gap harms safety. Pick one Red: who is harmed, what data missing? 2-min write. Share. Place red sticker on Ethics Wall for unfair. Discuss: Should we launch AI that is 90% accurate but 50% for one group?",studentAction:"Gallery, ethics write, wall",materials:"Posters, stickers",check:"Green: Names harmed group and missing data",stuck:"Orange: Sentence: 'This AI is unfair to ___ because ___ data missing, causing ___ harm.'"},{time:"80-90 Workbook",goal:"Fairness calc",script:"Workbook: Two groups confusion matrices. Group A: TP 90 FN10, Group B: TP 60 FN40. Compute recall per group: 90% vs 60% gap 30% unfair. Write one action to fix: collect more Group B data or add feature. Exit ticket: Is our waste sorter fair? Evidence? Preview W21 better data.",studentAction:"Calculate, exit",materials:"Workbook",check:"Green: Computes gap, proposes data fix",stuck:"Orange: Calculator, formula card."}]},unpluggedActivityEnlarged:{roles:["White Plastic Tester","Black Plastic Tester","Fairness Recorder","Referee who calls gap"],materials:"10 white, 10 black samples, audit sheet, red flag",steps:["1. White tester tests 10 white with sorter, counts correct","2. Black tester tests 10 black","3. Recorder writes accuracy per group","4. Compute gap = |white-black|","5. If gap >15%, raise red flag unfair","6. Discuss: is sensor or data problem?","7. Propose fix: new sensor or more black examples"],variations:"Fast: Use pre-collected counts. Slow: Add third group clear plastic, check 3-way fairness.",observes:"Do they slice correctly? Do they blame data vs model? Do they propose fix?",mistakes:["Only checking overall accuracy","Thinking fairness means ignoring groups","Not quantifying gap"]},workbook:{tasks:["Compute recall per group for face unlock example","Draw fair referee with two teams stats","Audit waste sorter by material","Propose fix for unfair gap"],answerKey:"Face unlock: Light 90% Dark 50% gap 40% unfair -> collect dark data. Waste: White 90 Black 40 gap 50% -> add weight sensor."}},{id:"W21",num:21,title:"More / Better Data",subtitle:"Data-Centric AI",mentalModel:"Better Ingredients",emoji:"\uD83E\uDDC1",color:"from-amber-500 to-pink-500",tag:"Data-Centric",teacherEmpowerment:{whatIsThisReally:"Data-centric AI shift, popularized by Andrew Ng in 2021, says fix data not just model. For 10 years we tuned architectures; now top teams spend 80% time cleaning labels, balancing classes, adding hard examples. Better ingredients = better cake with same recipe. Techniques: clean mislabels, balance classes, add edge cases, augment, collect more from failing slice.",why7thGradersNeedThis:"Kids think AI improvement = fancier code. But their waste sorter got 70% because they only had 5 black plastic examples. Adding 20 more black examples jumps to 78% without new code. They can control data quality today with phone camera and better labeling - empowerment, not helplessness.",realWorldBehindTheScenes:"Tesla doesn't just write better self-driving model; they mine fleet for 'corner cases' - weird stop signs, construction zones - and add to training. Gmail spam team has human raters re-label tricky emails. Mechanism: same model retrained on cleaner, bigger, balanced data gives +10% precision with zero code change.",kidQuestionsAndAnswers:[{q:"Is more data always better?",a:"Not if it's messy. 1000 blurry, wrong-labeled photos worse than 200 clean ones. Better ingredients means clean, balanced, diverse - not just pile more."},{q:"How do we know which data to add?",a:"Look at errors - where does model fail? If it fails on black plastic, add more black plastic. That's like tasting cake and noticing needs more sugar."},{q:"Can kids do data-centric AI?",a:"Yes! You are best data collectors for your school waste. You know which trash is tricky. Labeling carefully is real AI work - companies pay for this."}],vocabForTeacher:[{term:"Data-Centric AI",teacherDef:"Focus on improving data quality/coverage vs model architecture.",kidDef:"Fix ingredients, not just recipe.",pron:"DAY-ta CEN-trick",visual:"\uD83E\uDDC1 Cake ingredients vs recipe"},{term:"Label Noise",teacherDef:"Wrong labels in training data causing confusion.",kidDef:"Mislabeled sugar as salt - cake fails.",pron:"LAY-bel NOYZ",visual:"\uD83C\uDFF7️ Wrong tag"},{term:"Class Balance",teacherDef:"Equal representation of each class in dataset.",kidDef:"Same number of each fish type in training.",pron:"KLASS BAL-ans",visual:"⚖️ Equal piles"},{term:"Edge Cases",teacherDef:"Rare, hard examples at decision boundary.",kidDef:"Tricky fish that look like boots.",pron:"EJ KAYS",visual:"\uD83C\uDF0A Edge of net"}]},mentalModelDeep:{name:"Better Ingredients",teacherAnalogy:"Same cake recipe, two bakeries. Bakery A uses old flour, mislabeled sugar/salt, only vanilla - cake bad. Bakery B uses fresh flour, correct labels, vanilla + chocolate + strawberry - cake amazing. Same recipe (model), different ingredients (data). Data-centric AI says spend time shopping for best ingredients, not rewriting recipe.",studentAnalogy:"You want to get better at basketball but only practice free throws. You need to practice layups, 3-pointers, defense too. Better practice = better ingredients for your skill cake.",sketchSteps:["1. Draw same recipe card: 2 cups flour, 1 sugar","2. Draw bad ingredients: dusty flour, salt labeled sugar, 1 flavor","3. Draw cake = sad face, 60% tasty","4. Draw good ingredients: fresh flour, correct labels, 5 flavors, balanced","5. Same recipe card, cake = happy 90% tasty"],commonWrongModel:{wrong:"Better AI needs more complex code and bigger neural network.",right:"Often same simple model with cleaner, balanced, diverse data beats fancy model with messy data. Ingredients first."},bridgeQuestion:"Our waste sorter fails black plastic - is that model problem or ingredient problem? How would better ingredients fix it?"},examplesBank:[{title:"Blurry Photos Cleanup",story:"Team trained pet classifier with blurry phone pics, 65% accuracy. Cleaned to sharp, well-lit pics, same model 82%.",howItWorks:"Removed label noise and low-quality inputs. Data cleaning > model tuning.",whereToSee:"Phone camera gallery",discussionQ:"Would you keep blurry training data?",whatIf:"Add more blurry, accuracy drops to 60%",ethicsLens:{benefits:"Higher accuracy cheap",harmed:"None",missing:"Diverse lighting",trafficLight:"Green"}},{title:"Balancing Waste Bins",story:"Dataset: 100 recyclable, 20 landfill, 10 compost. Model always says recyclable 70% accuracy but compost recall 0%.",howItWorks:"Class imbalance bias. Balanced to 50 each via collection, accuracy 78% and compost recall 70%.",whereToSee:"Our dataset spreadsheet",discussionQ:"How to balance without throwing data away?",whatIf:"Add 100 compost examples, compost recall jumps",ethicsLens:{benefits:"Fair to all classes",harmed:"Minority classes ignored before",missing:"Compost",trafficLight:"Yellow"}},{title:"Tesla Corner Cases",story:"Tesla car misses construction cone. Fleet sends cone images to training, next update fixes.",howItWorks:"Mining hard examples where model fails, adding to data, retraining same model improves.",whereToSee:"Tesla videos",discussionQ:"Should cars learn from all drivers?",whatIf:"Without cone data, accident risk",ethicsLens:{benefits:"Safer driving",harmed:"Privacy of drivers filmed",missing:"Consent",trafficLight:"Yellow"}},{title:"Gmail Label Fix",story:"Human raters found 200 newsletters labeled as spam incorrectly, relabeled, spam precision up 5%.",howItWorks:"Fixing label noise directly improves precision. Data-centric loop: find mislabels via disagreement.",whereToSee:"Gmail spam label button",discussionQ:"Who should label?",whatIf:"Keep mislabels, user loses newsletters",ethicsLens:{benefits:"Better inbox",harmed:"Newsletter senders before",missing:"User feedback loop",trafficLight:"Green"}},{title:"Our Black Plastic Push",story:"W21 mission: collect 30 more black plastic examples, clean labels, accuracy 70%->79%.",howItWorks:"Added data for failing slice, rebalanced, same micro:bit threshold model improves recall.",whereToSee:"School cafeteria bins",discussionQ:"Where to find more black plastic?",whatIf:"Add weight sensor later = feature + data",ethicsLens:{benefits:"Less waste",harmed:"None",missing:"Compost still low",trafficLight:"Green"}},{title:"Augmentation - Rotated Bottles",story:"Bottles upside down confuse sorter. Team takes same photo rotated 4 ways, artificially more data.",howItWorks:"Data augmentation creates diversity without new collection. Model learns rotation invariant.",whereToSee:"Photo edit rotate",discussionQ:"Is fake data cheating?",whatIf:"No augmentation, upside bottle fails",ethicsLens:{benefits:"More robust",harmed:"None",missing:"Real upside examples",trafficLight:"Green"}}],physicalComputing:{anchor:"Better Ingredients - Same Model Better Data, micro:bit Logs Cleaner Data",materials:["micro:bit","Data quality checklist card","30 waste samples"],wiring:"micro:bit pin0 light sensor. Logs clean vs messy label via button hold. Shows data count per class on LED bar.",code:"On shake: add sample. Button A: recyclable count++. Button B: landfill++. Hold both = mislabel undo. Display balance meter.",steps:["Count current dataset per class","Identify minority","Collect 10 more for minority","Clean blurry/mislabeled","Retrain mental model","Compare accuracy before/after"]},communityData:{note:"3 classes pool data: Class A 100 samples 71%, Class B 200 balanced 78%, Class C 200 cleaned 84% - shows quality > quantity",visual:"Line: samples vs accuracy but cleaned higher"},ethicsLensWeekly:"Data dignity: who labels and whose data?",lesson90Detailed:{prep:"Dataset audit sheet, 30 waste items, cleaning checklist (blurry? wrong label? balanced?). Micro:bit data counter code.",flow:[{time:"0-10 Warm-up",goal:"Taste test",script:"I baked two cakes same recipe, different ingredients - taste. One with old flour, one fresh. Which better? Same with AI - we spent 3 weeks on model, today we fix ingredients. Our sorter 70% - is recipe bad or ingredients? Let's audit data like chefs check pantry.",studentAction:"Taste or imagine, vote ingredients",materials:"Cake story slide",check:"Green: Says ingredients matter more than recipe complexity",stuck:"Orange: Show 2 photos: blurry vs sharp same dog - which better to learn?"},{time:"10-25 Concept",goal:"Data-centric pillars",script:"Draw 4 ingredient fixes: 1 Clean mislabels - sugar labeled salt ruins cake. 2 Balance - need equal flour sugar eggs. 3 More of failing slice - if cake fails chocolate, add chocolate practice. 4 Edge cases - weird fish that look like boots. Andrew Ng 2021 said stop tuning model, fix data first. Same model better data = +15%.",studentAction:"Sketch 4 fixes",materials:"Board",check:"Green: Can list 2 fixes with cake analogy",stuck:"Orange: Give card: 'Our black plastic fails -> fix: ___' fill."},{time:"25-45 Unplugged",goal:"Data audit",script:"Roles: Auditor checks each photo label correct? Counter counts per class balanced? Cleaner removes blurry. Trainer retrains mentally. Each team gets 50 waste photos dataset. Find 5 mislabels, count balance: 40 recyclable 5 landfill 5 compost - unbalanced! Plan: collect 20 more landfill/compost. Write ingredient shopping list.",studentAction:"Audit dataset, shopping list",materials:"Photo sheets, audit form",check:"Green: Finds mislabels and imbalance, proposes collection",stuck:"Orange: Circle obvious mislabel: banana peel labeled plastic."},{time:"45-60 Micro:bit",goal:"Log better data",script:"Micro:bit as data counter: Shake = new sample, A=recyclable, B=landfill, A+B=compost, hold to undo mislabel. Goal: get to 20 each balanced. Display bar shows balance. Walk around school collecting? At least simulate. See count rise. How does balanced feel?",studentAction:"Collect and log to 20 each",materials:"micro:bit counter",check:"Green: Achieves balance, understands why",stuck:"Orange: Use paper counter if micro:bit busy."},{time:"60-80 Examples",goal:"Stories of data fixes",script:"Gallery 6: blurry cleanup, balancing, Tesla corners, Gmail relabel, black plastic push, augmentation. For each, ask: is fix more data, better data, or balanced? Place sticker: M/B/C. Discuss Tesla ethics: fleet filming - privacy vs safety? Traffic light. Which fix would help our sorter most right now?",studentAction:"Classify fixes, ethics debate",materials:"Posters",check:"Green: Can classify fix type and justify",stuck:"Orange: Provide labels: M=more, B=better, C=balanced"},{time:"80-90 Workbook",goal:"Plan data improvement",script:"Workbook: Our dataset 70% - list 3 ingredient fixes for next week: 1 clean 5 mislabels, 2 add 15 black plastic, 3 balance compost to 20. Compute expected lift: cleaning +3%, balancing +5%, more slice +6% = 84%? Optimistic. Exit ticket: one data fix you'll do tomorrow. Preview W22 adding new clues = features.",studentAction:"Write improvement plan",materials:"Workbook",check:"Green: Plan has specific numbers per class",stuck:"Orange: Template: 'We have __ recyclable __ landfill. To balance we need __ more __.'"}]},unpluggedActivityEnlarged:{roles:["Auditor: checks labels","Counter: counts per class","Cleaner: removes blurry","Collector: finds more minority"],materials:"50 photo cards, audit sheet, trash bins",steps:["1. Spread 50 photos, audit labels - find 5 wrong","2. Count per class, note imbalance","3. Remove blurry/low-quality 5","4. Write shopping list: need X more landfill, Y compost","5. Collect or simulate adding","6. Re-count balanced?","7. Predict new accuracy: old 70% -> new ?%"],variations:"Fast: Audit 20 cards. Slow: Actually go collect 10 real items.",observes:"Can spot mislabels? Understand balance matters? Propose realistic collection?",mistakes:["Thinking more data automatically better even if messy","Throwing away majority data to balance instead of adding minority","Ignoring label errors"]},workbook:{tasks:["Audit sample dataset 30 items: find mislabels, count balance","Write ingredient shopping list","Predict accuracy after cleaning vs adding","Ethics: who should label waste?"],answerKey:"Find 3 mislabels, imbalance 20/5/5 -> need 15 more landfill/compost each. Cleaning +3% balancing +5%."}},{id:"W22",num:22,title:"Feature Engineering",subtitle:"Making Better Clues",mentalModel:"Super Clues",emoji:"\uD83D\uDD0D",color:"from-fuchsia-500 to-pink-500",tag:"Improvement",teacherEmpowerment:{whatIsThisReally:"Feature engineering is creating inputs that make pattern obvious. Raw pixels hard; color + size + texture + weight makes waste classification trivial. History: before deep learning, winning Kaggle was 80% feature craft. Even today, adding a weight sensor to light sensor jumps waste sorter 65%->82% because black plastic clue: light fails but weight works. Good features disentangle classes.",why7thGradersNeedThis:"Kids think AI magically sees. But AI only sees clues you give. If you only give color, black plastic and black trash look same. If you give color + weight + size, suddenly separable. They experience this: identifying friend by only hair color vs hair+voice+height = better. They can invent features with sensors.",realWorldBehindTheScenes:"Netflix doesn't just use 'you watched' - they engineered features: time of day you watch, pause rate, device, genre combo, trailer rewatch. Each new clue improved recommendation precision 2-3%. Mechanism: combine clues into super clue - not just color but color×texture interaction - that splits data linearly.",kidQuestionsAndAnswers:[{q:"What is a feature?",a:"A clue AI can measure. Color is a clue, weight is a clue, size is a clue. More good clues = easier puzzle."},{q:"Can we have too many clues?",a:"Yes! If you add 100 random clues like sock color to predict waste, AI gets confused - overfitting. Need relevant clues."},{q:"How to make super clues?",a:"Combine! Light alone fails black plastic. Light + weight = super clue: light=dark AND weight=light => recyclable cup, light=dark AND weight=heavy => landfill brick. Interaction tells truth."}],vocabForTeacher:[{term:"Feature",teacherDef:"Measurable property used as input to model.",kidDef:"Clue you give AI.",pron:"FEE-cher",visual:"\uD83D\uDD0D Magnifying clue"},{term:"Feature Engineering",teacherDef:"Designing/transforming features to improve separation.",kidDef:"Making better clues from raw stuff.",pron:"en-jin-EER-ing",visual:"\uD83D\uDEE0️ Clue workshop"},{term:"Interaction Feature",teacherDef:"Combination of two features (e.g., color×weight) that captures joint pattern.",kidDef:"Two clues together tell secret.",pron:"in-ter-AK-shun",visual:"\uD83D\uDD17 Linked clues"},{term:"Feature Importance",teacherDef:"How much each feature helps accuracy.",kidDef:"Which clue helped most?",pron:"im-POR-tance",visual:"⭐ Star rating"}]},mentalModelDeep:{name:"Super Clues",teacherAnalogy:"Detective with only hair color: many suspects. Add height: fewer. Add scar + voice: one suspect. Each feature reduces suspects. Engineering super clue: not just 'red' but 'red + round + light + smells sweet = apple vs red + round + heavy + hard = bowling ball'. Show Venn diagrams overlapping.",studentAnalogy:"Guess friend from only shoe color = hard. Add laugh sound + backpack color = easy. Super clues = combining clues into mega clue.",sketchSteps:["1. Draw 2 overlapping circles: color red","2. Add circle size small - overlap shrinks","3. Add circle texture smooth - only apple left","4. Draw 3 clues list -> arrow -> super clue 'apple'","5. Show accuracy: 1 clue 60%, 2 clues 75%, 3 clues 90%"],commonWrongModel:{wrong:"More features always better, add 100 random clues.",right:"Good features are relevant and combine meaningfully. Random clues add noise and cause overfitting. Quality > quantity."},bridgeQuestion:"Our sorter uses only light sensor - 70%. What new clue (sensor) would separate black plastic (light) vs black brick (heavy)?"},examplesBank:[{title:"Waste: Light + Weight Super Clue",story:"Light sensor alone: black plastic vs black rubber both dark = confused. Add weight: plastic light, rubber heavy = perfect split.",howItWorks:"Interaction feature: if light <100 AND weight <50g => recyclable, else landfill. Accuracy 65%->82%.",whereToSee:"Kitchen scale + light sensor",discussionQ:"What other combo?",whatIf:"Weight alone also fails (paper light too)",ethicsLens:{benefits:"Fixes fairness for black plastic",harmed:"None",missing:"Compost smell sensor?",trafficLight:"Green"}},{title:"Face Unlock: Depth + Color",story:"Color alone fooled by photo. Add depth sensor (IR) = super clue: flat photo vs real face depth.",howItWorks:"Feature engineering: depth map + texture = liveness. Prevents spoof.",whereToSee:"iPhone notch",discussionQ:"Why need depth?",whatIf:"Only color, twin photo unlocks",ethicsLens:{benefits:"Security",harmed:"None",missing:"Depth fails masks?",trafficLight:"Green"}},{title:"Spam: Word + Time + Sender",story:"Word 'win' alone not spam (you can win game). Super clue: word 'win' + sent 3am + unknown sender = spam 95%.",howItWorks:"Interaction: P(spam | win, night, unknown) high. Single features weak.",whereToSee:"Gmail",discussionQ:"What super clue for phishing?",whatIf:"Only words, misses clever spam",ethicsLens:{benefits:"Less spam",harmed:"None",missing:"Language bias",trafficLight:"Green"}},{title:"Netflix: Time + Genre + Pause",story:"Netflix super clue: you pause horror at night = scared? Recommend comedy. Pause rate = engagement feature.",howItWorks:"Engineered feature: pause_rate = pauses / minute. High pause at night => switch genre.",whereToSee:"Netflix",discussionQ:"What feature would you add?",whatIf:"Only watch history, recommends more horror you hate",ethicsLens:{benefits:"Better recommendations",harmed:"Manipulation",missing:"Mood",trafficLight:"Yellow"}},{title:"Health: Temp + Light + Time",story:"Plant waterer: soil moisture alone waters at night wastefully. Add light + time: only water if dry AND light AND daytime.",howItWorks:"Super clue reduces false watering. Precision up.",whereToSee:"Plant sensor",discussionQ:"What combo for your room?",whatIf:"Only moisture, waters at midnight",ethicsLens:{benefits:"Save water",harmed:"None",missing:"Weather",trafficLight:"Green"}},{title:"Overfitting Warning",story:"Team adds 20 random features: favorite color, birth month to predict waste. Accuracy training 95% but test 60% - overfit.",howItWorks:"Irrelevant features let model memorize training noise, not learn true pattern. Need feature selection.",whereToSee:"Spreadsheet with too many columns",discussionQ:"How to know if feature useful?",whatIf:"Keep only relevant 2-3",ethicsLens:{benefits:"Lesson",harmed:"Test users",missing:"Validation",trafficLight:"Yellow"}}],physicalComputing:{anchor:"Super Clues - Add Sensor = New Feature, Accuracy 65%->82%, micro:bit Temp + Light",materials:["micro:bit","light sensor pin0","temperature onboard","weight via force? or manual scale"],wiring:"pin0 light, onboard temp, button A = manual weight entry (press count = light/medium/heavy). Combines to super clue.",code:"If light<120 and weight==light => recyclable else if light<120 and weight==heavy => landfill else if temp>25 and light>150 => compost? Display decision.",steps:["Test light only: accuracy 65%","Add temp: accuracy 72%","Add weight: accuracy 82%","Plot feature importance: weight helped black plastic most"]},communityData:{note:"Pool feature importance: light 0.4 weight 0.35 temp 0.15 size 0.1 - shows weight critical for fairness",visual:"Bar chart importance"},ethicsLensWeekly:"More clues = more surveillance? Which clues are okay?",lesson90Detailed:{prep:"Light sensor, kitchen scale or manual weight cards (light/medium/heavy), temp sensor, feature importance cards. Dataset with 1 feature vs 3 features.",flow:[{time:"0-10 Warm-up",goal:"Feel clue limit",script:"Game: I think of object in room, you ask only one clue: color. Guess? Hard. Now you can ask color+size+sound - easy! One clue 30% accuracy, three clues 90%. That's feature engineering - making better clues. Our sorter only has color clue - no wonder 70%. Today we become clue inventors.",studentAction:"20 questions with 1 vs 3 clues",materials:"Mystery box",check:"Green: Says more relevant clues help",stuck:"Orange: Show apple vs bowling ball both red - color alone fails."},{time:"10-25 Concept",goal:"Super clues",script:"Draw detective: Clue1 hair color - 10 suspects. Clue2 height - 3 suspects. Clue3 scar - 1 suspect. Super clue = clue1+clue2+clue3 combined. For waste: light alone fails black plastic vs black brick both dark. Add weight: plastic light, brick heavy - now separable! Draw Venn: light dark circle huge, add weight heavy circle, overlap small = brick. That's interaction feature.",studentAction:"Draw Venn, invent super clue",materials:"Board",check:"Green: Can invent combo that separates",stuck:"Orange: Give formula: IF light dark AND weight light THEN recyclable"},{time:"25-45 Unplugged",goal:"Build feature table",script:"Roles: Measurer measures light, weigher weighs, recorder writes feature table: object | light | weight | label. 20 objects. First try classify with only light - 13/20=65%. Now use light+weight rule you invent - try to get 16/20=80%. Which objects fixed? Black plastic! Trade tables, test other team's rule.",studentAction:"Measure, build rule, test",materials:"Scale, light cards, table",check:"Green: Rule uses both features, accuracy improves",stuck:"Orange: Give pre-made rule: If dark and light => recyclable"},{time:"45-60 Micro:bit",goal:"Sensor as new feature",script:"Micro:bit now has 2 clues: light pin0, temp onboard, weight manual button press count. Code super clue: if light<120 and weight=light -> recyclable. Upload, test black plastic again - now correct! See accuracy jump 65%->82% on LED. Feature importance: which clue fixed most errors? Weight! Discuss cost: adding sensor = money, worth it?",studentAction:"Code super clue, test",materials:"micro:bit + sensors",check:"Green: Accuracy improves, can name important feature",stuck:"Orange: Use block 'and' - show."},{time:"60-80 Examples",goal:"Feature stories",script:"Gallery 6: waste light+weight, face depth+color, spam word+time+sender, Netflix time+pause, plant temp+light, overfitting warning. For each, identify super clue and why single fails. Overfitting one: add random features like sock color - training 95% test 60% - why? Memorizing noise. Lesson: relevant only. Place green for good super clue, yellow for surveillance worry.",studentAction:"Identify super clue, discuss overfit",materials:"Posters",check:"Green: Can spot interaction and overfit",stuck:"Orange: Prompt: 'What two clues together work better than one?'"},{time:"80-90 Workbook",goal:"Design feature",script:"Workbook: List 5 possible features for waste sorter: light, weight, size, texture, smell, sound. Rank by importance, design super clue using 2: IF __ AND __ THEN __. Predict accuracy lift: +5% +7% etc. Exit ticket: One new sensor you'd add and why. Preview debugging next week - why even super clues fail.",studentAction:"Design, exit",materials:"Workbook",check:"Green: Designs plausible super clue with AND",stuck:"Orange: Provide bank: light, weight, size, temp - pick 2."}]},unpluggedActivityEnlarged:{roles:["Light Measurer","Weight Measurer","Rule Maker","Tester"],materials:"20 waste items, light chart, scale, feature table",steps:["1. Measure light for 20 items (dark/medium/bright)","2. Measure weight (light/medium/heavy)","3. Try classify with only light - count accuracy","4. Invent rule using light AND weight","5. Re-classify with super clue","6. Compare accuracy: 65%->82%?","7. Vote most important feature"],variations:"Fast: Use pre-measured cards. Slow: Add third feature temp.",observes:"Can combine with AND? See accuracy jump? Understand overfit if adding irrelevant?",mistakes:["Using OR instead of AND for super clue","Adding irrelevant feature","Not testing on held-out items"]},workbook:{tasks:["List 5 features for waste sorter","Design interaction feature with IF AND","Compute accuracy 1 vs 2 features","Spot overfitting example: training 95 test 60"],answerKey:"Super clue: dark + light weight = recyclable cup. Accuracy light only 13/20=65% light+weight 17/20=85%. Overfit: too many irrelevant features memorize training."}},{id:"W23",num:23,title:"Debugging ML Models",subtitle:"Why Did It Fail?",mentalModel:"Doctor for AI",emoji:"\uD83E\uDE7A",color:"from-pink-600 to-purple-600",tag:"Debugging",teacherEmpowerment:{whatIsThisReally:"Debugging ML is systematic diagnosis: 1 Data (mislabeled? imbalanced?), 2 Feature (missing clue?), 3 Overfit (memorized training?), 4 Bias (fails one group?), 5 Test (leak? wrong metric?). Like doctor checks vitals, history, labs, not random treatment. Coined from hardware bug, but ML debugging is harder because failures silent - model confidently wrong.",why7thGradersNeedThis:"Kids' sorter fails and they say 'AI dumb'. Debugging gives them doctor checklist to ask why: is it bad data, missing sensor, memorizing, unfair, or bad test? This growth mindset - failure is clue, not end. They debug like engineers, not just users.",realWorldBehindTheScenes:"YouTube recommendation bug: suddenly recommends kids videos to adults. Debug: Data? No. Feature? Time feature broken - clock bug. Overfit? No. Bias? Kids content overrepresented in training. Test? Test set didn't include adult nighttime. Fix: fix clock feature. Mechanism: log predictions, slice by error type, trace to root.",kidQuestionsAndAnswers:[{q:"Why did my model fail?",a:"Doctor checklist: Check data first - wrong labels? Check feature - missing clue? Check overfit - memorized? Check bias - fails one group? Check test - are you cheating test? Find root, then treat."},{q:"Is debugging coding?",a:"No, it's detective. You look at mistakes, group them: all black plastic fails = missing feature or data. All training perfect test bad = overfit. Pattern tells cause."},{q:"How do real AI teams debug?",a:"They keep error log - every mistake photo with note. Then they cluster: 50% errors are black plastic -> need weight sensor. They fix biggest cluster first - like doctor treats biggest symptom."}],vocabForTeacher:[{term:"Debugging",teacherDef:"Systematic process to find and fix root cause of model failures.",kidDef:"Doctor visit for AI - find why sick.",pron:"dee-BUG-ing",visual:"\uD83E\uDE7A Doctor bag"},{term:"Overfitting",teacherDef:"Model memorizes training data, fails new data - high train acc, low test acc.",kidDef:"Memorized answers, can't do new quiz.",pron:"oh-ver-FIT-ing",visual:"\uD83E\uDDE0 Brain overstuffed"},{term:"Data Leakage",teacherDef:"Test info sneaks into training, inflates accuracy falsely.",kidDef:"Peeking at answer key while studying.",pron:"LEEK-age",visual:"\uD83D\uDCA7 Leak"},{term:"Error Analysis",teacherDef:"Grouping mistakes by type to find pattern.",kidDef:"Sorting oopsies into piles to see pattern.",pron:"ERR-or",visual:"\uD83D\uDCCB Clipboard piles"}]},mentalModelDeep:{name:"Doctor for AI",teacherAnalogy:"Doctor doesn't give random medicine. Checks 5: 1 History (data: what did you eat?), 2 Vitals (features: temperature, blood pressure = clues), 3 Memory test (overfit: memorized or understands?), 4 Equity (bias: works for all patients?), 5 Lab test (test set valid?). Same for AI. Draw doctor with 5 tools.",studentAnalogy:"Your AI is sick, coughing wrong answers. Doctor checks: did it eat bad food (bad data)? Missing vitamin (feature)? Memorized textbook (overfit)? Only helps some kids (bias)? Used wrong thermometer (bad test)?",sketchSteps:["1. Draw sick AI robot with thermometer 70%","2. Draw doctor with 5 tools: data bag, feature lens, overfit brain, fairness scale, test clipboard","3. Check data: bag has moldy labels","4. Check feature: lens missing weight","5. Prescribe: clean data + add weight"],commonWrongModel:{wrong:"Model failed because AI is dumb, need to start over or get bigger model.",right:"Model fails for specific reason - data, feature, overfit, bias, or test. Find pattern in errors, fix root cause, same model can heal."},bridgeQuestion:"Our sorter fails 30% - if all fails are black plastic, is that data, feature, or bias? How would doctor treat?"},examplesBank:[{title:"Overfit: Memorized Training",story:"Student trains on 20 images, gets 100% train, 50% test on new waste. Model memorized background, not object.",howItWorks:"Training curve: train 100% test 50% gap = overfit. Fix: more data, fewer features, simpler model.",whereToSee:"Training vs test graph",discussionQ:"How to know if memorizing?",whatIf:"Add 100 more diverse images, gap shrinks",ethicsLens:{benefits:"Teaches validation",harmed:"Test users get bad model",missing:"Validation set",trafficLight:"Yellow"}},{title:"Data Bug: Mislabeled Compost",story:"All compost labeled as landfill, model learns compost=landfill. Error analysis: 100% compost errors same type.",howItWorks:"Label noise systematic. Fix: relabel, accuracy jumps.",whereToSee:"Label spreadsheet",discussionQ:"How to find mislabels quickly?",whatIf:"Keep mislabels, compost never recycled",ethicsLens:{benefits:"Fixable",harmed:"Compost waste",missing:"Quality check",trafficLight:"Yellow"}},{title:"Feature Bug: Missing Weight",story:"Black plastic fails consistently. Error cluster: all dark + light weight. Light feature alone insufficient.",howItWorks:"Need new feature. Add weight, errors disappear. Doctor says vitamin deficiency.",whereToSee:"Feature table",discussionQ:"What feature would fix?",whatIf:"Add weight sensor",ethicsLens:{benefits:"Fairness fix",harmed:"Black plastic before",missing:"Weight sensor",trafficLight:"Green"}},{title:"Bias Bug: Works Only White Plastic",story:"Overall 80% but black 40% white 95% gap 55% unfair. Root: training had 90% white.",howItWorks:"Disaggregated eval reveals bias. Fix: balance data.",whereToSee:"Audit sheet",discussionQ:"Is it data or bias?",whatIf:"Both - data causes bias",ethicsLens:{benefits:"Fairness audit catches",harmed:"Black plastic users",missing:"Diverse data",trafficLight:"Red"}},{title:"Test Bug: Leakage",story:"Team accidentally put same photos in train and test, got 95% but real 70%. Test cheating.",howItWorks:"Data leakage inflates score. Fix: strict train/test split, no duplicates.",whereToSee:"Dataset split",discussionQ:"How to avoid peeking?",whatIf:"Leakage hides real failure",ethicsLens:{benefits:"Lesson in honesty",harmed:"False confidence",missing:"Clean split",trafficLight:"Yellow"}},{title:"Waste Sorter Full Diagnosis W23",story:"Our sorter: 70% overall, black plastic recall 40%, training 85% test 70% gap, compost mislabeled 3. Doctor diagnosis: data imbalance + missing feature + slight overfit.",howItWorks:"5-step: Data? imbalance + mislabel yes. Feature? missing weight yes. Overfit? 15% gap mild. Bias? black gap yes. Test? clean. Prescription: balance + weight + more data.",whereToSee:"Our logs",discussionQ:"What to fix first?",whatIf:"Fix biggest cluster first: weight",ethicsLens:{benefits:"Systematic",harmed:"None",missing:"Time",trafficLight:"Green"}}],physicalComputing:{anchor:"Doctor for AI - 5-Step Debug Checklist With Cards",materials:["5 debug cards: Data, Feature, Overfit, Bias, Test","Error log sheet","micro:bit shows diagnosis"],wiring:"micro:bit displays error cluster count. Button A cycles through 5 checks, Button B marks found bug, shows prescription.",code:"Log 20 errors. Count per type. If black plastic cluster >5 -> Feature bug. If train 95 test 60 -> Overfit. Display icon: Data=\uD83C\uDFF7️ Feature=\uD83D\uDD0D Overfit=\uD83E\uDDE0 Bias=⚖️ Test=\uD83D\uDCCB",steps:["Log 20 mistakes with notes","Cluster into piles","Run 5-step checklist","Diagnose biggest pile","Prescribe fix","Retest"]},communityData:{note:"Community error clusters: 45% black plastic, 30% compost mislabel, 15% overfit, 10% test leak - shows common bugs",visual:"Pie chart of bug types"},ethicsLensWeekly:"Who pays when AI misdiagnosed?",lesson90Detailed:{prep:"5 debug cards per team, error log of 20 mistakes from W22, training/test curve poster, micro:bit diagnosis code.",flow:[{time:"0-10 Warm-up",goal:"Feel debugging need",script:"Our sorter sick - 70% fever. If you sick, do you take random medicine? No, doctor checks 5 things. Same for AI doctor. Today we learn 5 checks: Data, Feature, Overfit, Bias, Test. Hold up cards. Which do you think is our biggest sick? Vote. Let's diagnose.",studentAction:"Vote with cards",materials:"5 cards",check:"Green: Can name 5 checks",stuck:"Orange: Point to poster of doctor with 5 tools."},{time:"10-25 Concept",goal:"5-step model",script:"Draw sick robot 70%. Doctor tool1 Data bag - open, moldy labels? Check mislabels imbalance. Tool2 Feature lens - missing clue? Black plastic fails = missing weight. Tool3 Brain - overfit? Train 100% test 50% = memorized. Tool4 Scale - bias? Works white not black. Tool5 Clipboard - test leaking? Same photos train test. That's full exam. Real YouTube bug: time feature broken clock - feature bug. They fixed clock, not model.",studentAction:"Sketch doctor, label 5",materials:"Board",check:"Green: Can explain each check with example",stuck:"Orange: Give cheat sheet with icons."},{time:"25-45 Unplugged",goal:"Error analysis",script:"Roles: Logger writes each mistake: 'black cup called landfill', Clusterer piles by similarity, Doctor runs 5 checks, Prescriber writes fix. Use our W22 logs 20 errors. Pile: how many black plastic? 8? That's feature/bias. How many compost? 5 mislabeled? Data. Training vs test gap? Overfit? Fill prescription: For black plastic, add weight. For compost, relabel. Prioritize biggest pile.",studentAction:"Cluster, diagnose, prescribe",materials:"Error logs, piles",check:"Green: Clusters and names root cause",stuck:"Orange: Pre-clustered: black pile 8, compost pile 5."},{time:"45-60 Micro:bit",goal:"Diagnosis display",script:"Micro:bit counts clusters. Button A cycles check: Data? shows count mislabel. Feature? shows black count. Press B if bug found. At end, micro:bit shows prescription icon: weight = \uD83D\uDD0D. Test fix next week. How does doctor decide which medicine first? Biggest pile.",studentAction:"Run diagnosis",materials:"micro:bit",check:"Green: micro:bit prescription matches biggest cluster",stuck:"Orange: Use paper prescription pad."},{time:"60-80 Examples",goal:"Bug gallery",script:"6 bugs: overfit memorized, data mislabel, feature missing weight, bias white only, test leakage, full diagnosis. For each, ask: which of 5? Mark card. Overfit one: training curve shows gap - what's treatment? More data, simpler model. Leakage: how to avoid? No duplicate train test. Discuss ethics: if medical AI overfits, who harmed? Red traffic light.",studentAction:"Classify bug type, ethics",materials:"Posters",check:"Green: Correctly classifies 4/6 bugs",stuck:"Orange: Give hint: 'train 100 test 50 = ?'"},{time:"80-90 Workbook",goal:"Debug log",script:"Workbook: Fill debug log template: Symptom (accuracy 70% but black 40%), Cluster (8 black), Diagnosis (feature missing weight + data imbalance), Prescription (add weight sensor + 20 black examples), Expected lift (+12%). Exit ticket: One bug you found in our sorter and fix. Preview W24 project: we will do prescription to get 85%.",studentAction:"Write debug log",materials:"Debug log template",check:"Green: Log has symptom cluster diagnosis prescription",stuck:"Orange: Fill-in blank template."}]},unpluggedActivityEnlarged:{roles:["Logger: writes each error","Clusterer: piles similar","Doctor: runs 5 checks","Prescriber: writes fix"],materials:"20 error cards, 5 check cards, prescription pad",steps:["1. Logger lays 20 error cards","2. Clusterer piles by object type: black pile, compost pile","3. Doctor checks Data: any mislabels in pile?","4. Checks Feature: does pile share missing clue?","5. Checks Overfit: train vs test gap?","6. Checks Bias: one group fails?","7. Prescriber writes: Biggest pile 8 black -> add weight, expected +10%"],variations:"Fast: Use 10 errors. Slow: Add test leak check with duplicate photos.",observes:"Can cluster? Can name root cause? Prioritizes biggest?",mistakes:["Treating symptom not root (just collecting more random data)","Fixing small pile first","Confusing overfit with bias"]},workbook:{tasks:["Cluster 15 errors into piles","Run 5-step checklist per pile","Write debug log with prescription","Draw training vs test curve: overfit vs good fit"],answerKey:"Black pile 8 -> feature missing weight. Compost 5 mislabel -> data. Gap 15% train/test -> mild overfit. Prescription: weight + rebalance + more data = +12%."}},{id:"W24",num:24,title:"PROJECT 4 Improve Classifier v2",subtitle:"Tuning Engine - 70% → 85%",mentalModel:"Tuning Engine",emoji:"\uD83C\uDFCE️",color:"from-pink-500 to-purple-600",tag:"PROJECT",teacherEmpowerment:{whatIsThisReally:"Final project synthesizes W19-24: take W18 70% waste classifier and ship v2 at 85% via data-centric loop + feature engineering + fairness audit + debugging. Real product teams do this sprint: audit (W19-20), improve data (W21), add features (W22), debug (W23), ship. Metrics: precision/recall per class, fairness gap <10%, feature importance, debug log. Deliverable: before/after metrics + demo.",why7thGradersNeedThis:"They've been users of AI; now they ship improved AI. Seeing 70%->85% jump from their own ingredient and clue fixes is agency. They write debug log like engineers at Google. They present before/after, not just accuracy but fairness and precision/recall - real evaluation literacy.",realWorldBehindTheScenes:"Waste sorting company AMP Robotics did same: started 70% with color only, added weight + NIR sensor + balanced data + cleaned labels -> 85%+ and fairness across materials. Mechanism: same lightweight model, better data pipeline and 2 new sensors. Deployment: micro:bit or laptop model thresholds tuned per class, tested on school bins.",kidQuestionsAndAnswers:[{q:"Can we really go 70%->85%?",a:"Yes! 5% from cleaning labels, 5% from balancing, 10% from new feature weight - adds to 15%. Real teams see this. Your data and clues matter more than fancy code."},{q:"What if we still fail black plastic?",a:"Then debug log shows you tried and why - maybe need NIR sensor beyond micro:bit. Engineering is honest about limits and next steps. That's success too."},{q:"How to present like pro?",a:"Before/after metrics: show confusion matrix W18 vs v2, precision/recall per class, fairness gap shrinks, feature importance bar, debug log. Demo live sorting 20 items. Tell story: problem -> diagnosis -> fix -> result."}],vocabForTeacher:[{term:"v2",teacherDef:"Second version improved via evaluation loop.",kidDef:"Engine tuned car version 2.",pron:"VEE-two",visual:"\uD83C\uDFCE️ Race car upgrade"},{term:"Ablation",teacherDef:"Test contribution by removing feature/data.",kidDef:"Take away clue, see if worse?",pron:"ab-LAY-shun",visual:"\uD83E\uDDE9 Remove piece"},{term:"Ship",teacherDef:"Deploy improved model for real use.",kidDef:"Launch your tuned engine.",pron:"SHIP",visual:"\uD83D\uDE80 Launch"},{term:"Regression",teacherDef:"New version breaks old good cases.",kidDef:"Fixed black but broke white?",pron:"re-GRESH-un",visual:"↩️ Backwards"}]},mentalModelDeep:{name:"Tuning Engine",teacherAnalogy:"Race car 70% speed. Tuning: 1 Check lap times per track section (per class metrics), 2 Better fuel (clean data), 3 Add turbo + tires (2 new features weight + size), 4 Test on different tracks (fairness), 5 Dyno run (debug log) to avoid overfit. After tuning, car does 85% with same engine block, just better tuning. Draw engine with 2 new parts labeled.",studentAnalogy:"Your sorter is go-kart. You tune engine: clean fuel, add turbo (weight sensor), add spoiler (size), balance tires (balance data), test on all tracks (all waste types). Now it zooms 85%!",sketchSteps:["1. Draw go-kart 70% with one exhaust (light sensor)","2. Add fuel filter = clean data","3. Add turbo = weight sensor, spoiler = size","4. Add balanced tires = balanced classes","5. Show speedometer 70%->85% with per-class bars rising"],commonWrongModel:{wrong:"To improve, need brand new AI brain and more layers.",right:"Same brain, tuned ingredients and clues and fairness checks = 15% lift. Tuning > rebuilding."},bridgeQuestion:"What 2 new features and data fixes will give us 15% lift? How will we prove fairness improved?"},examplesBank:[{title:"Team A: Weight + Size Turbo",story:"Added weight (scale) + size (ruler) to light. Accuracy 70%->86%, black plastic recall 40%->88% fairness gap 5%.",howItWorks:"Super clue: light+weight+size interaction. Ablation: remove weight drops to 75% - weight critical.",whereToSee:"Their demo bin",discussionQ:"Which feature helped most?",whatIf:"Only weight: 82%, only size: 76%",ethicsLens:{benefits:"Fair + accurate",harmed:"None",missing:"Compost smell",trafficLight:"Green"}},{title:"Team B: Data-Centric Champions",story:"No new sensor, but cleaned 10 mislabels + added 40 black/compost examples + augmentation. 70%->81%!",howItWorks:"Data-centric only: cleaning +5%, balancing +6% = 11% lift without hardware. Shows power of ingredients.",whereToSee:"Spreadsheet",discussionQ:"Can data beat sensor?",whatIf:"Add sensor later 81%->87%",ethicsLens:{benefits:"Low cost",harmed:"None",missing:"Sensor limit",trafficLight:"Green"}},{title:"Team C: Fairness First",story:"Focused on fairness: collected 30 black plastic, audit shows gap 50%->8%. Accuracy 70%->84% but fairness star.",howItWorks:"Disaggregated eval drove collection. Feature importance shows weight fixes bias.",whereToSee:"Fairness dashboard",discussionQ:"Is fairness more important than 1% accuracy?",whatIf:"Ignore fairness, accuracy 85% but black 50% unfair",ethicsLens:{benefits:"Equitable",harmed:"None",missing:"None",trafficLight:"Green"}},{title:"Regression Caution",story:"Team added texture sensor, black improved but white dropped 90%->70% - regression. Debug: texture sensor noisy for white.",howItWorks:"Need to test all classes after fix, not just failing slice. Fix: threshold per class or remove noisy feature.",whereToSee:"Before/after per class",discussionQ:"How to avoid breaking what worked?",whatIf:"Keep both but weight less",ethicsLens:{benefits:"Lesson",harmed:"White plastic temporarily",missing:"Per-class threshold",trafficLight:"Yellow"}},{title:"Community Pool: 3 Classes Combined",story:"Pooling 3 classes datasets: 90 samples unbalanced 71%, 180 balanced 79%, 180 cleaned + 2 features 85%. Shows scaling.",howItWorks:"Sample size + quality + features matters. Pooling shows power of community data.",whereToSee:"Community pool tab",discussionQ:"Why does pooling help?",whatIf:"More schools join -> 90%?",ethicsLens:{benefits:"Collective improvement",harmed:"None if anonymized",missing:"Privacy note",trafficLight:"Green"}},{title:"Shipping: Demo Day",story:"Final demo: sort 20 real cafeteria items live, log precision/recall, show fairness gap <10%, present debug log, propose v3.",howItWorks:"Live evaluation: 17/20 correct = 85%. Per class: recyclable 9/10 recall 90% precision 82%, etc. Ship criteria met.",whereToSee:"Demo day stage",discussionQ:"What would you do for v3?",whatIf:"Add NIR sensor for v3 -> 90%+",ethicsLens:{benefits:"Real impact",harmed:"None",missing:"Maintenance",trafficLight:"Green"}}],physicalComputing:{anchor:"Tuning Engine - Improve Classifier v2 With 2 New Features, Rebalance",materials:["micro:bit","light pin0","weight scale or button weight","size ruler or ultrasonic pin1","balanced dataset 20 each"],wiring:"pin0 light, pin1 ultrasonic size (or manual), button A weight. OLED or LED shows prediction: R=recyclable L=landfill C=compost.",code:"Super rule: if light<100 and weight==light => R, elif weight==heavy => L, elif size>big and light>150 => C else... Show confidence. Log to radio for dashboard.",steps:["Baseline test 20 items 70%","Add 2 features, rebalance data","Retest 20 items aim 85%","Fairness audit per material","Demo + debug log"]},communityData:{note:"Final pool: 3 classes combined metrics - before 70% (Rec P 60 R55, Black 40, Compost 50) after 85% (Rec P 88 R90 Black 85 Compost 82) Gap <10% - celebration!",visual:"Before/after bar with arrow 70->85%"},ethicsLensWeekly:"Shipping responsibly: is 85% good enough to deploy? What warning?",lesson90Detailed:{prep:"v2 kits: light, weight, size sensors, balanced dataset bins (20 each), debug log template, before metrics poster (70%), rubrics, demo bins.",flow:[{time:"0-10 Warm-up",goal:"Launch project",script:"Remember 70% go-kart? Today we tune to 85% race car for final race. Show before metrics: 70% overall but black 40% - not fair. Goal v2: 85% overall, fairness gap <10%, 2 new features, rebalanced data, debug log. Same engine, better tuning. Who's ready to ship? Teams plan: which 2 features? Weight + size? Weight + temp? Decide now 2 min.",studentAction:"Teams pick 2 features",materials:"Before poster",check:"Green: Team picks 2 relevant features",stuck:"Orange: Suggest weight + size as default turbo."},{time:"10-25 Concept",goal:"Tuning steps",script:"Draw tuning engine: Step1 audit before (W19-20) - we did. Step2 data fix W21 - balance to 20 each, clean mislabels. Step3 super clues W22 - add weight + size. Step4 debug W23 - check no regression, no overfit. Step5 ship - demo 20 items. Show example Team A: weight+size = 70->86%. How? Ablation: remove weight -> drop to 75% so weight matters most. Your turn to engineer.",studentAction:"Plan steps",materials:"Tuning diagram",check:"Green: Plan includes data + 2 features + fairness check",stuck:"Orange: Provide checklist: data balanced? 2 features? fairness audit? debug log?"},{time:"25-45 Unplugged Build",goal:"Build v2 rule",script:"Roles: Data Manager balances bins to 20 each, Feature Engineer measures weight/size, Rule Writer writes IF AND THEN super rule, Tester tests 10 items. Use feature table: light, weight, size -> label. Try rule, iterate. If white drops, regression - fix threshold. Aim 8/10 mini test. Record before/after per class.",studentAction:"Build and iterate rule",materials:"Feature table, bins",check:"Green: Rule uses 2 new features, 8/10 mini",stuck:"Orange: Give starter rule: IF dark AND light weight => recyclable ELSE IF heavy => landfill"},{time:"45-60 Micro:bit v2",goal:"Ship code",script:"Code v2: pin0 light, pin1 size, button weight. Display prediction. Test 20 items: count correct per class. Show live on dashboard: before 70% bar, after growing to 85%. If regression, debug - which feature noisy? Adjust threshold. Log to radio for community pool. Celebrate 85%!",studentAction:"Code, test 20, log",materials:"micro:bit v2",check:"Green: Achieves 80%+ and gap <15%",stuck:"Orange: Use manual feature entry if sensor fails."},{time:"60-80 Examples + Prep Demo",goal:"Learn from others",script:"Gallery 6 v2 stories: Team A turbo, B data-centric, C fairness first, regression caution, community pool, demo day. Each team notes one idea to steal. Now prep 2-min demo script: Problem before, fix (data+features), result after (metrics + fairness), debug log highlight, next step v3. Practice.",studentAction:"Gallery, prep script",materials:"Posters, script template",check:"Green: Script has before/after numbers and fairness",stuck:"Orange: Sentence starters: 'Before ___% after ___% because we added ___'"},{time:"80-90 Workbook + Ship",goal:"Deliver",script:"Workbook final: Fill before/after confusion matrices, precision/recall per class, fairness gap, feature importance, debug log, reflection: what surprised? Exit ticket: ship checklist: 2 features? balanced? fairness gap <10%? debug log? Collect. Announce Demo Day next class. Preview L2 Unit 5.",studentAction:"Complete workbook, checklist",materials:"Workbook, rubric",check:"Green: Completed metrics show 70->85% with evidence",stuck:"Orange: Provide filled example for reference."}]},unpluggedActivityEnlarged:{roles:["Data Manager: balances 20 each","Feature Engineer: measures weight/size","Rule Writer: writes super rule","Tester: tests 20 and audits fairness"],materials:"60 items (20 per class), scale, ruler, feature table, before poster 70%",steps:["1. Baseline: test old rule 20 items = 70% record per class","2. Balance: ensure 20 each, clean mislabels","3. Measure 2 new features for 20 items","4. Write super rule using light AND weight AND size","5. Test v2 on 20 new items, record per class","6. Compute overall 85%? Fairness gap = max-min <10%?","7. Write debug log: what fixed, what regression, v3 idea"],variations:"Fast: Use pre-measured feature table. Slow: Add 3rd feature smell or sound.",observes:"Do they balance? Use AND? Check fairness not just overall? Avoid regression?",mistakes:["Only improving overall but ignoring fairness","Adding features but not balancing data","Not testing on new items (leakage)"]},workbook:{tasks:["Fill before/after confusion matrix","Compute precision/recall per class v2","Fairness gap calc: max-min","Feature importance vote","Debug log: symptom cluster diagnosis prescription","Demo script"],answerKey:"Before: 70% black recall 40% gap 50% unfair. After: 85% black 85% gap 8% fair. Features: weight most important for black."}}],bm=[{id:"learn",label:"Learn W19-24",emoji:"\uD83D\uDCDA"},{id:"physical",label:"Physical Lab",emoji:"\uD83D\uDD27"},{id:"community",label:"Community Pool",emoji:"\uD83C\uDF0A"},{id:"project",label:"Project Studio",emoji:"\uD83C\uDFCE️"},{id:"eval",label:"Eval Dashboard",emoji:"\uD83D\uDCCA"},{id:"ethics",label:"Ethics Wall",emoji:"\uD83D\uDEA6"}],Sm=[{id:"teacher",label:"Teacher Background"},{id:"mental",label:"Mental Model Deep"},{id:"script",label:"90min Script"},{id:"examples",label:"6 Examples + Ethics"},{id:"physical",label:"Physical"},{id:"community",label:"Community"},{id:"unplugged",label:"Unplugged"},{id:"workbook",label:"Workbook"}];function ea(){let[e,t]=We.useState("locked"),[r,n]=We.useState(""),[i,l]=We
