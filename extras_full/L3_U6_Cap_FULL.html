When",visual:"\uD83C\uDFAF"},{word:"User Persona",def:"Fake name, real pain - e.g. 'Maya, 13, loses library books weekly'",visual:"\uD83D\uDC64"},{word:"Success Metric",def:"Number that proves it worked",visual:"\uD83D\uDCCA"},{word:"Non-Goal",def:"What you will NOT do on purpose",visual:"\uD83D\uDEAB"}]},mentalModelDeep:{teacherAnalogy:"Think Frank Lloyd Wright. Before Fallingwater existed, he drew 100 blueprints: where sun hits, where water flows, where family gathers. If he skipped blueprint, house collapses. AI Product Design is identical: you map user flow, data flow, failure flow before you train a model. Without it, your AI is a beautiful house with doors that open to walls.",studentAnalogy:"You want a dream bedroom. Do you buy furniture first? No! You draw your room: bed here, desk near window for light, closet door must open. Blueprint = plan so everything fits and works. AI product needs same drawing.",sketchSteps:["30s: Draw a stick figure user + thought bubble pain","60s: Draw 3 boxes: INPUT (what user gives) → AI MAGIC → OUTPUT (what user gets)","90s: Draw smiley face when it works, frowny when it fails - what happens?","120s: Write 1 number that proves it works (e.g. 'finds book in 10 sec')","150s: Cross out 1 thing you will NOT build - your Non-Goal"],wrongVsRight:{wrong:"I want to build an AI that helps everyone with everything using ChatGPT",right:"Maya (13) loses library books. When she scans shelf, AI matches her reading level in 10 seconds. We will NOT try to recommend books for adults."},bridgeQuestion:"If your blueprint is wrong, will building faster fix it?"},examplesBank:[{title:"Lunch Waste Predictor",story:"Cafeteria throws 40 lbs food daily. Students built camera that predicts waste before lunch.",howItWorks:"Counts trays yesterday → predicts today → alerts kitchen to cook less",whereToSee:"Your cafeteria at 11:30am",discussionQ:"What if prediction is wrong and kids get no food?",whatIf:"What if it shames kids who take food?",ethicsLens:{benefits:"Saves food, money, planet",harmed:"Kitchen staff if blamed for overcooking",missing:"Students who need extra food not counted",trafficLight:"Yellow"}},{title:"Library Matchmaker",story:"Maya hates reading because she gets books too hard. AI matches reading level + interest.",howItWorks:"Input: 3 books you liked + reading test → Output: 1 perfect next book",whereToSee:"Library checkout desk",discussionQ:"Should AI know your reading level if friends can see?",whatIf:"What if AI only recommends same type of books forever?",ethicsLens:{benefits:"Kids read more, confidence up",harmed:"Authors of diverse genres if filtered out",missing:"English language learners",trafficLight:"Green"}},{title:"Lost & Found Vision",story:"200 jackets lost per month. AI scans lost bin photo → tags color/type → searchable.",howItWorks:"Phone photo → object detection → 'blue, Nike, size M, found Tue'",whereToSee:"School lost & found shelf",discussionQ:"Is photo of someone's jacket private?",whatIf:"What if AI mislabels expensive jacket as cheap?",ethicsLens:{benefits:"Parents save money",harmed:"Kids embarrassed if item shown public",missing:"Kids without phones to search",trafficLight:"Yellow"}},{title:"Hallway Crowd Alert",story:"Hallway jam before period 3 causes lateness. AI predicts crowd from schedule.",howItWorks:"Schedule + past crowd → predicts 'Hall A will jam in 5 min' → suggests route",whereToSee:"Google Maps traffic but for hallways",discussionQ:"Who decides alternate route is better?",whatIf:"What if all kids take suggested route and jam that one?",ethicsLens:{benefits:"Less tardiness, less pushing",harmed:"Kids with mobility issues if route has stairs",missing:"Wheelchair users",trafficLight:"Red"}},{title:"Kind Words Detector",story:"School wants more kindness. AI listens to announcements tone - not words - to nudge positivity.",howItWorks:"Audio energy + speech rate → kindness score for morning announcements (no content recording)",whereToSee:"Morning PA system",discussionQ:"Is it okay for AI to judge kindness?",whatIf:"What if it pressures kids to fake nice voice?",ethicsLens:{benefits:"More positive climate",harmed:"Neurodivergent kids with different prosody",missing:"Non-English speakers",trafficLight:"Red"}},{title:"Homework Helper Matcher",story:"7th graders stuck on math at 8pm. AI matches with 8th grader who solved similar problem before.",howItWorks:"Photo of problem (no answer) → finds peer who struggled then succeeded → connects for hint",whereToSee:"Discord study channels",discussionQ:"Is sharing homework photo cheating?",whatIf:"What if older student just gives answer?",ethicsLens:{benefits:"Peer learning, confidence",harmed:"If answer leaking ruins learning",missing:"Kids without internet at home",trafficLight:"Yellow"}}],physicalComputing:{project:"Blueprint Boards",wiring:"micro:bit not needed - paper + sticky notes. Board 1: User, Board 2: Input→AI→Output, Board 3: Fail Case",code:"No code - use Miro/FigJam template. If micro:bit: Button A cycles user persona, Button B shows success metric on LED",demo:"Students pitch blueprint in 60 sec to another team"},communityData:{prompt:"What problem at YOUR school bugs you every week?",privacy:"Anonymized - no names, only grade + problem type",sample:["Cafeteria line too long (23 votes)","Bathroom passes lost (18)","Locker jam (15)"]},ethicsLensWeekly:"Product ethics: Who defines the problem? If only loud kids are heard, quiet kids' problems ignored.",lesson90Detailed:{prep:["Print Blueprint Canvas A3 x15","Sticky notes 4 colors","Example product docs from Google (1-pager)"],flow:[{time:"0-10",goal:"Hook - House without blueprint collapses",script:"Show image of crooked house. Say: 'This house cost $500k and door opens to a wall. Why? No blueprint. Today we prevent that for AI. By end, you will have a blueprint that could save real money and food at our school.'",studentAction:"Shout what's wrong with house",materials:"Projector, house image",check:"Can they name 1 thing missing in bad house?",stuck:"Show floorplan vs no floorplan side by side"},{time:"10-25",goal:"Teacher Background + Vocab",script:"In 1960s, designers learned empathy. I will show you Google's PRD template. Your 4 words today: Problem Statement, Persona, Metric, Non-Goal. Let's make one for Lunch Waste together.",studentAction:"Fill vocab cards with drawings",materials:"Vocab cards",check:"Can they write problem statement in format?",stuck:"Give sentence starter: '[Who] struggles with [what] when [when]'"},{time:"25-45",goal:"Mental Model Deep - Blueprint",script:"Draw your dream bedroom now - 2 min. Now imagine building AI without drawing. Same disaster. Let's do 5 sketch steps together - timer on.",studentAction:"5-step sketch on A3",materials:"A3 canvas, markers",check:"Do they have Input→AI→Output?",stuck:"Provide traced template for first box"},{time:"45-65",goal:"Examples Bank Gallery Walk",script:"6 examples on walls. You have dot stickers: green = benefits clear, yellow = worried, red = harmful. Place dots. Discuss: where did you put red and why?",studentAction:"Walk, read, dot vote, discuss",materials:"6 posters, dots",check:"Can they explain 1 ethics lens?",stuck:"Pair with stronger reader, give discussion sentence starters"},{time:"65-80",goal:"Physical Computing - Blueprint Boards",script:"Teams of 3: Build physical blueprint board. Board must have persona photo, flow, metric, non-goal. You have 15 min. Then 60-sec pitch.",studentAction:"Build board, pitch",materials:"Cardboard, printouts",check:"Board has all 4 sections?",stuck:"Give pre-cut persona cards to choose from"},{time:"80-90",goal:"Workbook + Exit Ticket",script:"Open workbook p31. Complete Product Canvas. Exit ticket: Write your problem statement. If you can't, your blueprint not ready - that's okay, we iterate.",studentAction:"Workbook, exit ticket",materials:"Workbook",check:"Exit ticket collects problem statements",stuck:"Allow drawing instead of writing for ELL"}]},unpluggedActivityEnlarged:{title:"Blueprint Charades",roles:["Architect (draws)","Client (describes problem)","Inspector (checks missing parts)"],steps:["1. Client picks problem card","2. Architect can't hear client - only sees persona card","3. Architect draws blueprint from persona only","4. Inspector checks: does blueprint have metric? non-goal?","5. Client reveals real problem - match?","6. Rotate roles","7. Debrief: what was lost without direct talk?"],variations:["Add budget constraint: only 3 boxes allowed","Add time pressure: 90 sec blueprint"],mistakes:["Drawing solution before understanding user","Forgetting failure case","Metric is vague like 'be better'"]},workbook:"P31: Product Canvas - Fill Who/Pain/When, draw Input→AI→Output, write Metric number, write Non-Goal, traffic light self-check"},{id:"W32",num:32,title:"Prototyping with AI",subtitle:"Quick Prototype",mentalModel:"Cardboard Model",color:"#7C3AED",accent:"#0D9488",icon:"\uD83D\uDCE6",teacherEmpowerment:{whatIsThisReally:"Prototyping started in 1980s at IDEO - the idea that you build a fake version in 1 day to learn, not a real version in 1 month to launch. For AI, prototype means: Wizard of Oz (human pretends to be AI), or 10-image model, or paper interface. Goal is learning, not perfection.",whyNeed:"8th graders fear failure. Prototyping reframes failure as data: cardboard model is SUPPOSED to fall apart. It teaches iteration speed - Apple built 50 iPhone cardboard models before one glass one. Without this, students polish one idea too long.",realWorld:"At Apple, prototyping lab has cardboard, foam, wood. Designers hold it, feel it. For AI, they use Figma prototypes where button says 'AI magic happens' - no model yet. They test with 5 users before coding.",kidQuestions:[{q:"Isn't a cardboard model childish for AI?",a:"Jony Ive's first iPhone was wood. Childish look = brave thinking. Real engineers love cardboard."},{q:"What if my prototype is ugly?",a:"Ugly = good. Means you spent time learning, not decorating. Pretty comes later."},{q:"How do I prototype AI without data?",a:"Be the AI yourself. You are the wizard behind curtain. Or use 10 photos you take."}],vocab:[{word:"Wizard of Oz",def:"Human pretends to be AI",visual:"\uD83E\uDDD9"},{word:"Lo-Fi Prototype",def:"Low detail, fast to build",visual:"\uD83D\uDCC4"},{word:"Iteration",def:"Version 2 is smarter than version 1",visual:"\uD83D\uDD01"},{word:"Feedback",def:"What user does, not what user says",visual:"\uD83D\uDC40"}]},mentalModelDeep:{teacherAnalogy:"Architects never build skyscraper first. They build cardboard model at 1:100 scale, put it on table, shine light to see shadow, move it. They learn in 10 minutes what would cost $10M to learn later. AI cardboard model is same: 10 images, paper app, or you acting as AI - learn in 10 minutes.",studentAnalogy:"You want to see if your friends will play your new game. Do you build full board game with 100 cards? No, you draw quick board on paper and play one round. If they get bored, you change rules fast. That's prototyping.",sketchSteps:["30s: Draw app screen on paper - 1 screen only","60s: Draw what happens when user taps - next screen?","90s: List 3 things that could go wrong with AI","120s: Circle the riskiest assumption (e.g. 'AI can tell jacket color')","150s: Build that riskiest part FIRST with 5 photos or acting"],wrongVsRight:{wrong:"Build full app with 1000 images and perfect UI before testing",right:"Paper app + you pretending to be AI + test with 1 friend today. Learn, then build."},bridgeQuestion:"What costs more: throwing away cardboard or throwing away code you worked on for 2 weeks?"},examplesBank:[{title:"Paper Lunch Predictor",story:"Team drew lunch counter app on paper. One student was AI - looked at yesterday's count written on sticky and guessed.",howItWorks:"Paper screens + human AI = test if kitchen staff understand prediction",whereToSee:"Paper prototypes at IDEO museum",discussionQ:"Did users trust human AI vs real AI?",whatIf:"What if human AI is smarter than real AI will be?",ethicsLens:{benefits:"Zero code, instant learning",harmed:"None - paper is safe",missing:"Real data complexity hidden",trafficLight:"Green"}},{title:"10-Image Jacket Sorter",story:"Instead of 1000 jacket photos, they used 10 jackets from lost & found - 5 blue, 5 red. Trained Teachable Machine in 3 min.",howItWorks:"10 images → Teachable Machine → test with 2 new jackets live",whereToSee:"TeachableMachine.withgoogle.com",discussionQ:"Is 10 images enough?",whatIf:"What if all blue jackets are Nike - AI learns brand not color?",ethicsLens:{benefits:"Fast, tangible",harmed:"If biased data, AI learns bias",missing:"Black jackets, green jackets",trafficLight:"Yellow"}},{title:"Cardboard Crowd Counter",story:"Hallway sensor prototype made of cardboard box with phone inside counting via camera. Box falls apart - learning!",howItWorks:"Box = sensor housing → phone camera → student counts manually to simulate AI",whereToSee:"DIY sensors at Makey Makey",discussionQ:"Does housing affect AI?",whatIf:"What if box blocks view?",ethicsLens:{benefits:"Tests physical placement cheap",harmed:"None",missing:"Real lighting changes",trafficLight:"Green"}},{title:"Wizard Library App",story:"One student held paper phone, other student said 'You might like Dog Man because you liked...' pretending to be AI.",howItWorks:"Script: human says recommendation logic out loud",whereToSee:"Wizard of Oz method - 1980s",discussionQ:"Did friend feel AI was helpful even though human?",whatIf:"What if wizard is biased?",ethicsLens:{benefits:"Tests idea before coding",harmed:"If wizard jokes, trust broken",missing:"Scale - human can't do for 500 kids",trafficLight:"Green"}},{title:"Kindness Meter Paper",story:"Paper dial that moves when teacher says kind words - student moves dial manually. Tests if visual feedback motivates.",howItWorks:"No AI yet - just dial + human judgment",whereToSee:"Mood meters in classrooms",discussionQ:"Should kindness be measured?",whatIf:"What if kids perform kindness for score?",ethicsLens:{benefits:"Explores motivation",harmed:"Creates surveillance feeling",missing:"Cultural differences in kindness",trafficLight:"Red"}},{title:"Voice Prototype with Micro:bit",story:"Micro:bit shows happy/sad face when loud vs soft - prototype for kindness detector without real NLP.",howItWorks:"Micro:bit sound sensor → LED face → no words stored",whereToSee:"micro:bit sound level example",discussionQ:"Is loud = unkind?",whatIf:"What if quiet kid never triggers?",ethicsLens:{benefits:"No privacy risk, sound only",harmed:"If used to shame loud kids",missing:"Tone vs volume difference",trafficLight:"Yellow"}}],physicalComputing:{project:"Cardboard Model + Micro:bit Wizard",wiring:"micro:bit: A = 'AI says yes', B = 'AI says no', Shake = 'AI confused'. Use in prototype to simulate AI decisions",code:"let response = 0; input.onButtonPressed(A) { show Icon Yes } ; input.onButtonPressed(B) { show Icon No } ; Data logging: log 5 user tests",demo:"User interacts with cardboard phone, teammate presses micro:bit buttons as AI"},communityData:{prompt:"Upload photo of your cardboard prototype - what did you learn from 1 user test?",privacy:"Photos anonymized, faces blurred, only prototypes shown",sample:["Paper app - user tapped wrong button (fix placement)","10-image model - 60% accurate (need more black jackets)"]},ethicsLensWeekly:"Prototyping ethics: Are you prototyping WITH users or ON users? Consent even for paper test.",lesson90Detailed:{prep:["Cardboard, scissors, tape x15","Teachable Machine open on laptops","micro:bits 8","Paper phone templates"],flow:[{time:"0-10",goal:"Hook - Apple cardboard story",script:"Show Apple cardboard iPhones. Say: 'Apple's first iPhone was wood and cardboard. It didn't work. But it taught them how it should FEEL in hand. Today you build cardboard AI - supposed to be ugly, supposed to break.'",studentAction:"Hold cardboard phone template",materials:"Cardboard phones",check:"Are they comfortable holding ugly prototype?",stuck:"Show video 60s of IDEO cardboard prototyping"},{time:"10-25",goal:"Vocab + Wizard of Oz demo",script:"Live demo: I am AI. Student shows book. I say 'You like adventure, try this' - that's Wizard of Oz. Your 4 words: Wizard, Lo-Fi, Iteration, Feedback. Feedback is what they DO, not what they SAY.",studentAction:"One pair demos wizard in front",materials:"Book props",check:"Can they define Wizard of Oz?",stuck:"Give wizard script card"},{time:"25-45",goal:"Mental Model + Riskiest Assumption",script:"5-step sketch - find riskiest assumption. For Lost & Found, riskiest is 'Can AI tell blue vs black in bad lighting?' Build that first, not login screen. Circle it in red.",studentAction:"Sketch + circle riskiest",materials:"Blueprint from last week",check:"Red circle on riskiest assumption?",stuck:"Give list of common riskiest assumptions to choose"},{time:"45-65",goal:"Build Cardboard Prototype",script:"You have 20 min. Build lo-fi: paper app OR 10-image Teachable Machine OR micro:bit wizard. Must be testable with one user today. Ugly is perfect.",studentAction:"Build prototype",materials:"Cardboard, laptops, micro:bits",check:"Can it be tested in 2 min?",stuck:"Provide half-built template to finish"},{time:"65-80",goal:"User Test 1 Friend",script:"Test with someone not in your team. Don't explain! Watch what they DO. Where do they get stuck? Write 1 thing that broke and 1 thing that worked. That's feedback.",studentAction:"Test, observe, note",materials:"Feedback cards",check:"Feedback card has Do vs Say?",stuck:"Give observation checklist"},{time:"80-90",goal:"Iterate + Workbook",script:"Now iteration - version 2. Change ONE thing based on feedback. Workbook P32: draw V1 vs V2, write what you learned. Exit: What did you throw away? Throwing away is learning.",studentAction:"V2 sketch, workbook",materials:"Workbook P32",check:"V2 different from V1?",stuck:"Allow verbal exit instead of writing"}]},unpluggedActivityEnlarged:{title:"Human Neural Network Prototype",roles:["Camera Eye (sees)","Brain (decides)","Mouth (says answer)","User (shows item)"],steps:["1. User shows jacket (blue)","2. Eye whispers color to Brain","3. Brain decides 'blue' based on 3 examples memorized","4. Mouth says answer","5. User says correct/incorrect","6. Brain adjusts memory","7. Repeat with 5 jackets - how fast does Brain learn?"],variations:["Add noise: Eye wears blurry glasses (bad data)","Add bias: Brain only saw blue Nike before"],mistakes:["Brain memorizes, doesn't generalize","No feedback loop","Too many examples at once"]},workbook:"P32: Prototyping Log - V1 drawing, User Did (observed), User Said (quote), V2 change ONE thing, What I threw away"},{id:"W33",num:33,title:"User Testing",subtitle:"Does it work for real users?",mentalModel:"Taste Test",color:"#0D9488",accent:"#6D28D9",icon:"\uD83D\uDC45",teacherEmpowerment:{whatIsThisReally:"User testing became standard in 1990s with Jakob Nielsen: 5 users find 85% of problems. For AI, it's more critical - AI fails silently and confidently. User testing means watching real users (not friends) try your prototype with real tasks, measuring task success, time, and frustration.",whyNeed:"8th graders think 'it works on my laptop = works for everyone'. They need to learn edge cases: left-handed users, English learners, noisy cafeteria. Testing builds empathy and humility - your AI is not smart until a stranger can use it without help.",realWorld:"At Google, user researchers watch through one-way mirror. They count: can user finish task in 60 sec without asking for help? At Duolingo, they test with kids who never used app before. If kid taps wrong 3 times, design fails, not kid.",kidQuestions:[{q:"What if user is wrong and my AI is right?",a:"If user can't use it, design is wrong, not user. Great designers blame design, not people."},{q:"Do I need many users?",a:"Nielsen says 5 is enough to find big problems. 5 real users > 50 friends who say 'cool'."},{q:"What if testing shows my idea is bad?",a:"Then you saved weeks! Bad news early = good news. Pivot is not failure."}],vocab:[{word:"Task Success",def:"Can user finish without help? Yes/No",visual:"✅"},{word:"Think Aloud",def:"User says what they're thinking while doing",visual:"\uD83D\uDDE3️"},{word:"Edge Case",def:"Unusual user or situation",visual:"\uD83E\uDDE9"},{word:"Bias in Testing",def:"Only testing people like you",visual:"\uD83E\uDE9E"}]},mentalModelDeep:{teacherAnalogy:"Chef doesn't serve soup without tasting. But chef's taste ≠ customer's taste. Chef must watch customer taste, see face, see if they add salt. User testing is taste test: you don't ask 'Do you like it?' (they'll say yes to be nice). You watch if they finish the bowl, if they add salt, if they share with friend.",studentAnalogy:"You made cookies. You think they're perfect. You ask mom - she says yummy to be nice. Better test: give cookie to little brother without saying anything. Watch: does he eat whole? Make face? Ask for milk? His ACTIONS tell truth, not words.",sketchSteps:["30s: Write task: 'Find a blue jacket in lost & found using prototype in 30 sec'","60s: Draw 3 faces: \uD83D\uDE0A success no help, \uD83D\uDE10 success with help, \uD83D\uDE20 fail","90s: Draw what you'll watch: fingers, eyes, sighs - not what they say","120s: List 2 edge case users: e.g. 'left-handed', 'new student who doesn't know words'","150s: Write 1 rule: 'Don't help, just watch and note'"],wrongVsRight:{wrong:"Ask friends: 'Do you like my app?' They say 'Yes cool!' You think it works.",right:"Give stranger task: 'Find blue jacket in 30 sec.' Watch silently. Time them. Note where they tap wrong. That's real data."},bridgeQuestion:"If you help user during test, whose intelligence are you testing - AI's or yours?"},examplesBank:[{title:"Lost & Found Test",story:"Team tested with new 6th grader who never saw lost & found. He searched 'blue' but prototype only had 'jacket'. Failed - learned need color filter.",howItWorks:"Task: find your jacket. Metric: success in 30 sec. Observation: he typed 'blue' - insight!",whereToSee:"Usability lab one-way mirror",discussionQ:"Should AI understand 'blue' or user learn AI words?",whatIf:"What if new student can't read English?",ethicsLens:{benefits:"Found real gap",harmed:"If tester shames new student for failing",missing:"Non-English speakers",trafficLight:"Green"}},{title:"Library Matcher Test",story:"Tested with student who hates reading. She said 'This is for nerds' and didn't tap. Insight: need cover images not just titles.",howItWorks:"Think aloud: 'I see boring words, I leave'",whereToSee:"Kids testing apps at library",discussionQ:"Is think aloud hard for shy kids?",whatIf:"What if kid says they like it but body says bored?",ethicsLens:{benefits:"Emotion data",harmed:"If shy kid forced to talk",missing:"Kids with reading anxiety",trafficLight:"Yellow"}},{title:"Lunch Predictor Kitchen Test",story:"Tested with cafeteria manager, not student. Manager said 'I need number of trays, not percent'. Changed metric.",howItWorks:"Different user = different need. Student wants less waste, manager wants trays to cook",whereToSee:"Stakeholder testing",discussionQ:"Who is real user - student or manager?",whatIf:"What if manager wants to cook less to save work, not waste?",ethicsLens:{benefits:"Multiple stakeholders heard",harmed:"If manager's incentive misaligned with kids' hunger",missing:"Students who need extra food",trafficLight:"Yellow"}},{title:"Crowd Alert Wheelchair Test",story:"Wheelchair user tested crowd alert. Suggested route had stairs - impossible. Team added accessibility filter.",howItWorks:"Edge case testing reveals critical failure",whereToSee:"Accessibility testing labs",discussionQ:"Should edge cases be tested early or late?",whatIf:"What if you never meet wheelchair user - how to imagine?",ethicsLens:{benefits:"Inclusion from start",harmed:"If wheelchair user only brought for token test",missing:"Other mobility devices",trafficLight:"Red"}},{title:"Kind Words Detector Consent Test",story:"Tested kindness meter with class. Kids felt watched and performed fake kindness. Score went up, real kindness down.",howItWorks:"Metric gaming - Goodhart's Law: when measure becomes target, it ceases to be good",whereToSee:"Classroom behavior charts",discussionQ:"Should kindness be scored at all?",whatIf:"What if score is private not public?",ethicsLens:{benefits:"Revealed surveillance harm",harmed:"Kids who felt policed",missing:"Kids who are kind quietly",trafficLight:"Red"}},{title:"Hallway Test No Help Rule",story:"Tester helped user when stuck. User succeeded but team learned nothing. Retested with no help - found 3 bugs.",howItWorks:"No help rule is hard but essential",whereToSee:"Moderated vs unmoderated testing",discussionQ:"When is helping okay?",whatIf:"What if user gets frustrated and quits?",ethicsLens:{benefits:"True data",harmed:"Frustration if not supported after test",missing:"Emotional support protocol",trafficLight:"Green"}}],physicalComputing:{project:"Taste Test Feedback Cards + Micro:bit Timer",wiring:"micro:bit as timer: Start timer on A, Stop on B, log time to data. Shake = task failed. Use to measure task success time",code:"input.onButtonPressed(A) { start = input.runningTime() } ; input.onButtonPressed(B) { log time } ; Shows objective metric",demo:"Test 5 users, log times, calculate success rate"},communityData:{prompt:"Test your prototype with 1 person NOT in your class - log time, success, 1 quote",privacy:"No names, only grade + task + time + success Y/N",sample:["Grade 6, Find blue jacket, 45s, Success with help","Grade 7, Find book, 12s, Success no help"]},ethicsLensWeekly:"Testing ethics: Consent, no shaming for failure, edge cases not afterthought, who is not in test?",lesson90Detailed:{prep:["Feedback cards printed","micro:bits as timers","Tasks written on cards","Edge case persona cards"],flow:[{time:"0-10",goal:"Hook - Cookie taste test",script:"Bring cookies (or imagine). I ask mom 'Yummy?' She says yes to be nice. I watch brother: he eats half and gives to dog. Actions > words. Today you learn to watch actions, not ask 'Do you like it?'",studentAction:"Role play cookie test",materials:"Cookies or image",check:"Can they say why actions > words?",stuck:"Show video of user testing where user says 'easy' but fails"},{time:"10-25",goal:"Vocab + Nielsen 5 users",script:"Jakob Nielsen in 1993 proved 5 users find 85% problems. You don't need 100. You need 5 strangers and watch. Your 4 words: Task Success, Think Aloud, Edge Case, Bias. Demo: I will try to use your prototype - don't help me!",studentAction:"Watch teacher fail using student prototype",materials:"Student prototype from last week",check:"Do they resist helping?",stuck:"Put tape on mouth - no help rule visual"},{time:"25-45",goal:"Write test task + edge cases",script:"Write ONE task: 'Find blue jacket in 30 sec'. Not 'try my app'. Task must have time and success criteria. Now list 2 edge cases: who might struggle? New student? Left-handed? No English? Write them.",studentAction:"Write task cards",materials:"Task card template",check:"Task has time + success?",stuck:"Give task formula: Verb + object + time + success"},{time:"45-65",goal:"User Test Round 1 - No Help",script:"Find testers outside your team. Rule: no help, just watch and time with micro:bit. Log: time, success Y/N with/without help, 1 face emoji, 1 quote. Test 3 users minimum.",studentAction:"Test 3 users, log",materials:"micro:bit timers, feedback cards",check:"Logs have time + success?",stuck:"Pair shy testers with extroverted notetaker"},{time:"65-80",goal:"Pattern Find - What broke?",script:"Lay out 3 feedback cards. What pattern? Did all fail at same screen? Did edge case users fail more? Circle biggest pattern - that's what you fix in V3.",studentAction:"Pattern analysis, dot voting biggest pain",materials:"Cards on table",check:"Can they name 1 pattern?",stuck:"Give pattern prompts: all tapped here, all slow here, edge case failed"},{time:"80-90",goal:"Workbook + Ethics",script:"Workbook P33: log test results, write 1 edge case you missed, write how you will include them next. Ethics: Did tester feel safe? Did you get consent? Exit: What surprised you?",studentAction:"Workbook, reflection",materials:"Workbook P33",check:"Workbook has edge case reflection?",stuck:"Allow drawing pattern"}]},unpluggedActivityEnlarged:{title:"Taste Test Lab",roles:["Chef (designer)","Taster (user)","Observer (notes)","Timer (micro:bit)"],steps:["1. Chef makes paper app screen","2. Taster given task card, no explanation","3. Observer says 'Please think aloud'","4. Timer starts micro:bit","5. Chef watches silently, notes where Taster taps wrong","6. After task, Observer asks 'What was hardest?'","7. Team writes 1 fix for next version"],variations:["Blindfold Taster (tests accessibility)","Give Taster gloves (tests motor difficulties)","Taster speaks different language - use pictures only"],mistakes:["Helping Taster","Asking 'Do you like it?' not 'What happened?'","Testing only friends","Ignoring edge case failure"]},workbook:"P33: User Testing Log - User 1/2/3: time, success Y/N, help needed?, face emoji, quote, pattern, V3 fix"},{id:"W34",num:34,title:"Responsible Creator",subtitle:"Who benefits? Who is harmed?",mentalModel:"Superhero Responsibility",color:"#6D28D9",accent:"#10B981",icon:"\uD83E\uDDB8",teacherEmpowerment:{whatIsThisReally:"Responsible AI charter started 2016 after ProPublica showed bias in criminal risk scores. With great power (AI can decide who gets book, food, hallway route) comes great responsibility. Creator must ask: Who benefits? Who harmed? Who missing? What traffic light? This is not optional ethics - it's engineering requirement.",whyNeed:"8th graders will build AI that affects peers. They need to check bias, privacy, consent BEFORE expo, not after harm. This week builds ethics as habit, not lecture. They create Ethics Card for capstone - like nutrition label for AI.",realWorld:"Google has Responsible AI team that blocks launches if Red light. Microsoft has Ethics Charter checklist: consent, anonymization, bias test, opt-out. Students will use same checklist simplified.",kidQuestions:[{q:"If my AI helps most kids, is it okay if it harms a few?",a:"No. In medicine, if drug helps 90% but harms 10%, it doesn't ship. AI same. You must design for those harmed or not ship that feature."},{q:"Can AI be neutral?",a:"No. AI reflects data. If data missing wheelchair users, AI will fail them. Neutral is myth - you must choose to include."},{q:"What if I didn't mean harm?",a:"Intent ≠ impact. You can harm without meaning. That's why we check Traffic Light BEFORE building."}],vocab:[{word:"Bias",def:"Systematic error that harms group",visual:"⚖️"},{word:"Consent",def:"Clear yes that can be taken back",visual:"✋"},{word:"Anonymized",def:"Data with names removed, can't be re-identified",visual:"\uD83C\uDFAD"},{word:"Traffic Light",def:"Red=Stop, Yellow=Caution fix, Green=Go",visual:"\uD83D\uDEA6"}]},mentalModelDeep:{teacherAnalogy:"Spider-Man: 'With great power comes great responsibility.' He can swing, but if he swings carelessly, he drops people. AI creator has superpower: code that decides for hundreds. If you deploy without checking who you drop, you're villain not hero. Hero checks cape, checks landing zone, asks 'Who is below?'",studentAnalogy:"You find a superpower: you can read everyone's diary and recommend perfect book. Cool power! But should you read diaries? Who benefits? Who feels violated? Superhero asks first, acts second. Villain acts first.",sketchSteps:["30s: Draw superhero with AI power (e.g. X-ray to see lost jackets)","60s: Draw 2 people smiling - who benefits?","90s: Draw 1 person crying - who harmed?","120s: Draw empty chair - who is missing from your test?","150s: Color traffic light: Red (stop, harm high), Yellow (fix then go), Green (go)"],wrongVsRight:{wrong:"My AI is cool tech, ethics later. It helps most people so it's fine.",right:"Before demo, I checked: benefits 3 groups, harms 1 group if photo public, missing group is ELL students, so I anonymized and added opt-out. Traffic Light Yellow, fixing."},bridgeQuestion:"If your AI works perfectly for you but fails for new student who doesn't speak English, is it working?"},examplesBank:[{title:"Jacket Photo Privacy",story:"Lost & Found AI takes photos of jackets - some have names written inside. AI might show name publicly.",howItWorks:"Photo → tag → public search → name leaked",whereToSee:"Lost & found with name tags",discussionQ:"Should AI blur names?",whatIf:"What if parent wants name to find jacket?",ethicsLens:{benefits:"Find jacket fast",harmed:"Privacy leak if name shown",missing:"Students who don't want jacket found (embarrassing)",trafficLight:"Red"}},{title:"Lunch Waste Shaming",story:"Predictor shows which class wastes most. Class feels shamed, wastes hidden in trash to look good.",howItWorks:"Data → public leaderboard → shame → gaming",whereToSee:"Behavior dashboards",discussionQ:"Should data be private to kitchen only?",whatIf:"What if goal is reduce waste but method shames?",ethicsLens:{benefits:"Awareness",harmed:"Shamed class, gaming",missing:"Why waste happens (dislike food vs portion)",trafficLight:"Red"}},{title:"Library Filter Bubble",story:"Matcher keeps recommending same genre. Kid never discovers new genre, reading narrows.",howItWorks:"Like history → same genre → bubble",whereToSee:"YouTube recommendations",discussionQ:"Should AI sometimes recommend different genre on purpose?",whatIf:"What if kid only likes one genre and that's okay?",ethicsLens:{benefits:"Confidence",harmed:"Narrowing world",missing:"Librarian curation",trafficLight:"Yellow"}},{title:"Crowd Alert Surveillance",story:"Crowd counting camera could be used to track who is where. Privacy risk if repurposed.",howItWorks:"Counting → tracking → surveillance",whereToSee:"School security cameras",discussionQ:"Is counting people okay but tracking not?",whatIf:"What if principal wants to use for tardy tracking?",ethicsLens:{benefits:"Less crowding",harmed:"Surveillance creep",missing:"Student consent for counting",trafficLight:"Red"}},{title:"Kind Words Pressure",story:"Kindness score public makes kids perform fake kindness, anxious kids scored low.",howItWorks:"Score → performance → anxiety",whereToSee:"Social credit systems",discussionQ:"Can kindness be measured without harm?",whatIf:"What if score is private reflection only?",ethicsLens:{benefits:"Positive intention",harmed:"Performance pressure, neurodivergent kids",missing:"Different cultural expressions",trafficLight:"Red"}},{title:"Homework Helper Cheating",story:"Matcher connects for hints, but some give answers. Learning lost, dependency created.",howItWorks:"Hint → answer leak → cheating",whereToSee:"Chegg, Course Hero",discussionQ:"How to design hint not answer?",whatIf:"What if peer gets paid for answers?",ethicsLens:{benefits:"Peer learning",harmed:"Learning loss if answers given",missing:"Teacher oversight",trafficLight:"Yellow"}}],physicalComputing:{project:"Superhero Responsibility Charter + Micro:bit Consent Button",wiring:"micro:bit: Button A = Consent Yes (green tick), Button B = Consent No (red cross), Shake = Withdraw consent anytime. LED shows traffic light",code:"input.onButtonPressed(A) { show green } ; input.onButtonPressed(B) { show red } ; input.onGesture(Shake) { clear consent } ; Logs consent",demo:"Before testing, user presses A/B for consent, can shake to withdraw anytime"},communityData:{prompt:"For your capstone, fill Ethics Card: Benefits / Harmed / Missing / Traffic Light + fix",privacy:"Ethics cards anonymized, shared for peer review",sample:["Benefits: saves time | Harmed: privacy if photo public | Missing: ELL | Light: Yellow - will blur names"]},ethicsLensWeekly:"Core lens of unit: Superhero Responsibility. Power check before every build.",lesson90Detailed:{prep:["Ethics Card templates","Traffic light stickers","Superhero capes (optional fun)","Consent button micro:bits"],flow:[{time:"0-10",goal:"Hook - Spider-Man power",script:"Show Spider-Man quote. Say: 'You have superpower: code that decides for 500 kids. With that power, you can be hero or villain. Difference? Hero asks Who benefits? Who harmed? Before swinging. Today you make Hero Charter.'",studentAction:"Draw hero with power",materials:"Capes, quote poster",check:"Can they name power + responsibility?",stuck:"Show real case: ProPublica bias story simplified"},{time:"10-25",goal:"Vocab + Bias history",script:"2016 ProPublica found AI biased against Black people in courts. Since then, Responsible AI charter required. Your 4 words: Bias, Consent, Anonymized, Traffic Light. Consent must be yes that can be taken back - like micro:bit shake to withdraw.",studentAction:"Consent role play with micro:bit",materials:"micro:bits",check:"Can they demo consent withdrawal?",stuck:"Use hand raise consent: hand up yes, down no, shake withdraw"},{time:"25-45",goal:"Mental Model + Ethics Card",script:"5-step sketch: hero, benefits (2), harmed (1), missing (1 empty chair), traffic light. Now fill Ethics Card for your capstone idea. Must have fix if Yellow/Red. Red = stop and redesign.",studentAction:"Sketch + Ethics Card draft",materials:"Ethics Card template",check:"Card has benefits/harmed/missing/light?",stuck:"Give sentence starters for each quadrant"},{time:"45-65",goal:"Examples Bank Ethics Wall",script:"6 examples on wall with traffic lights. You are ethics board - you decide if product ships. Place stickers: Red stop, Yellow fix, Green go. Discuss most controversial.",studentAction:"Ethics board deliberation",materials:"6 posters, traffic stickers",check:"Can they justify light color?",stuck:"Give 2-min debate format: claim, evidence, light"},{time:"65-80",goal:"Physical - Consent Button",script:"Build micro:bit consent button. Before any user test from now on, user must press A for yes, can shake to withdraw anytime. This is real industry practice - consent is revocable.",studentAction:"Code consent button, test with partner",materials:"micro:bits, MakeCode",check:"Button shows green/red + withdraw works?",stuck:"Give starter code to remix"},{time:"80-90",goal:"Workbook + Charter",script:"Workbook P34: Superhero Charter - I promise to check benefits/harmed/missing before building. Sign it. Exit: What will you NOT build because it's Red light?",studentAction:"Sign charter, workbook",materials:"Workbook P34, charter poster",check:"Charter signed with specific Red line?",stuck:"Allow drawing promise"}]},unpluggedActivityEnlarged:{title:"Ethics Court",roles:["Creator (defends AI)","User who benefits (supports)","User who harmed (challenges)","Judge (decides traffic light)","Missing Person (empty chair - who not present?)"],steps:["1. Creator pitches AI in 30s","2. Benefits user says how helped","3. Harmed user says how harmed","4. Missing chair - group imagines who not here","5. Judge asks: consent? anonymized? opt-out?","6. Judge gives traffic light + required fix","7. Creator revises and re-pitches"],variations:["Add journalist role: what headline if harm happens?","Add principal role: would school allow?"],mistakes:["Only hearing benefits, ignoring harmed","Saying 'no one harmed' without checking","Forgetting missing group","Traffic light Green without fix for Yellow"]},workbook:"P34: Ethics Card - My AI: Benefits (2 groups), Harmed (1 group + how), Missing (1 group not tested), Traffic Light + Fix if Yellow/Red, Consent plan, Anonymization plan"},{id:"W35",num:35,title:"Capstone Prep",subtitle:"Problem + Data + Model + Metrics + Ethics + Next",mentalModel:"Science Fair Prep",color:"#0D9488",accent:"#6D28D9",icon:"\uD83D\uDD2C",teacherEmpowerment:{whatIsThisReally:"Science Fair Prep is where PBL (Project-Based Learning) becomes visible. Capstone requires 6 artifacts: Problem, Data, Model, Metrics, Ethics Card, Next Step. Since 2000s, capstones replace tests because they show integration. Students must show not just what they built but how they know it works and who it harms.",whyNeed:"8th graders have built pieces but never assembled into coherent story. This week teaches narrative: Problem is hook, Data is evidence, Model is how, Metrics prove, Ethics shows maturity, Next shows humility. This is what high school, college, jobs require.",realWorld:"Science fair judges ask: Problem? Data? Model? Metrics? Ethics? Next? Same as Google promo packet. Students learning to pitch like researchers, not just coders.",kidQuestions:[{q:"What if my model accuracy is low like 60%?",a:"60% with good ethics and clear next step > 95% with no ethics. Judges love honesty + plan."},{q:"Do I need big data?",a:"No. 20 well-labeled examples you collected > 1000 random internet images. Quality > quantity."},{q:"What if I change problem now?",a:"It's Week 35, not 31. Changing problem now is like changing science fair topic night before. Refine, don't replace. Small slice."}],vocab:[{word:"Capstone",def:"Final stone on arch - holds everything together",visual:"\uD83C\uDFDB️"},{word:"Metrics",def:"Numbers proving it works for real users",visual:"\uD83D\uDCC8"},{word:"Dataset",def:"Examples you collected + labeled yourself",visual:"\uD83D\uDDC2️"},{word:"Next Step",def:"What you'd do with 1 more month + $100",visual:"\uD83D\uDEE4️"}]},mentalModelDeep:{teacherAnalogy:"Science fair board has 6 panels: Question, Hypothesis, Materials, Procedure, Results, Conclusion. Capstone board has 6 similar: Problem, Data, Model, Metrics, Ethics, Next. Both show process, not just product. Missing panel = judge asks hard question you can't answer.",studentAnalogy:"You made a video game. Friend asks 'Is it fun?' You say 'Yes'. That's not proof. Better: '5 friends played, 4 finished level in 2 min, 1 got stuck at jump, I fixed jump, now 5/5 finish'. That's Problem + Data + Model + Metrics. Now you're believable.",sketchSteps:["30s: Draw 6 boxes: Problem | Data | Model | Metrics | Ethics | Next","60s: In Problem box: write who + pain + when (from W31)","90s: In Data box: draw 5 photos you collected","120s: In Model box: draw Input→AI→Output + Teachable Machine screenshot","150s: In Metrics: write '3/5 users success in 30s' + Traffic Light"],wrongVsRight:{wrong:"I built cool AI that does stuff. It works. Trust me.",right:"Maya loses library books (Problem). I collected 20 book covers labeled by reading level (Data). Teachable Machine model 75% accuracy (Model). 4/5 6th graders found book in 30s (Metrics). Yellow light - need ELL books (Ethics). Next: add Spanish labels."},bridgeQuestion:"If you have no metrics, how does audience know it works vs you just saying it works?"},examplesBank:[{title:"Lunch Waste Capstone Board",story:"Board shows: Problem 40lbs waste, Data 30 days tray counts, Model prediction, Metrics saved 10lbs week 1, Ethics Yellow (shaming risk, fix private), Next add taste feedback.",howItWorks:"6-panel board tells complete story",whereToSee:"Science fair boards",discussionQ:"What panel is strongest? Weakest?",whatIf:"What if metrics show no savings?",ethicsLens:{benefits:"Complete story",harmed:"None if ethics checked",missing:"Student taste why waste",trafficLight:"Green"}},{title:"Library Matcher Dataset",story:"Student collected 30 books, labeled reading level + interest, took photos of covers, created Teachable Machine.",howItWorks:"Data collection is learning - labeling forces thinking",whereToSee:"Dataset on Teachable Machine",discussionQ:"Who labeled? Is label objective?",whatIf:"What if labeling is biased?",ethicsLens:{benefits:"Student-owned data",harmed:"If labels stereotype",missing:"Books not in library",trafficLight:"Yellow"}},{title:"Lost & Found Metrics",story:"Metrics: Before AI 5 min search, after AI 45 sec. Success rate 80% (4/5 found). Edge case: black jackets 40% only.",howItWorks:"Metrics show where fails - black jackets need more data",whereToSee:"Metrics dashboard",discussionQ:"Is 80% good enough to ship?",whatIf:"What if metric is time but user cares about feeling?",ethicsLens:{benefits:"Honest metrics",harmed:"If 20% failure is embarrassing items",missing:"Emotional metric: relief?",trafficLight:"Green"}},{title:"Crowd Alert Next Step",story:"Next step: add wheelchair accessible routes, test with 2 wheelchair users, add opt-out for privacy.",howItWorks:"Next step shows humility + plan",whereToSee:"Roadmaps",discussionQ:"What makes next step believable?",whatIf:"What if next step needs money you don't have?",ethicsLens:{benefits:"Shows growth mindset",harmed:"None",missing:"Funding plan",trafficLight:"Green"}},{title:"Kind Words Ethics Fix",story:"Originally Red light. Fix: private reflection not public score, no audio stored, opt-in only, teacher not seeing scores.",howItWorks:"Ethics fix changes product from surveillance to reflection",whereToSee:"Ethics iteration",discussionQ:"Does fix make it still useful?",whatIf:"What if fix makes it less motivating?",ethicsLens:{benefits:"From Red to Yellow/Green",harmed:"Reduced if private",missing:"Still cultural bias",trafficLight:"Yellow"}},{title:"Homework Helper Business Plan",story:"Business plan: free for students, school pays $0, runs on peer volunteer, no data collected, hint library open source.",howItWorks:"Business plan answers sustainability",whereToSee:"Lean canvas",discussionQ:"Should school AI make money?",whatIf:"What if business plan requires ads?",ethicsLens:{benefits:"Sustainable, free",harmed:"If volunteers burn out",missing:"Teacher workload",trafficLight:"Green"}}],physicalComputing:{project:"Science Fair Prep Boards + Micro:bit Data Logger",wiring:"micro:bit logs test data: A = success, B = fail, logs time. Use for metrics. Display board with 6 panels + micro:bit showing live metric",code:"Data logging: log success/fail + time. Show on board: '3 success, 2 fail, avg 25s'",demo:"Board + live micro:bit metric demo"},communityData:{prompt:"Post your 6-panel draft - peer gives 1 glow (strong panel) + 1 grow (weak panel)",privacy:"Boards anonymized, glow/grow only",sample:["Glow: Problem clear | Grow: Metrics need edge case","Glow: Ethics thoughtful | Grow: Data small"]},ethicsLensWeekly:"Prep ethics: Are metrics honest? Did you include failure? Is next step accountable?",lesson90Detailed:{prep:["6-panel board templates A2","Teachable Machine open","Example capstone boards 2","Metrics calculators"],flow:[{time:"0-10",goal:"Hook - Science fair judges",script:"Show science fair board. Say: 'Judges ask 6 questions. If you miss one panel, they will ask and you freeze. Today you build 6 panels so you never freeze at expo. This is your armor.'",studentAction:"Look at example boards",materials:"Example boards",check:"Can they name 6 panels?",stuck:"Give 6-panel checklist card"},{time:"10-25",goal:"Vocab + Capstone rubric",script:"Capstone = final stone that holds arch. Without it arch falls. Your capstone holds 5 weeks together. Rubric: Problem clear, Data yours, Model explained, Metrics honest, Ethics light + fix, Next believable. Business plan extra credit.",studentAction:"Read rubric, self-assess where they are",materials:"Rubric handout",check:"Can they place themselves on rubric?",stuck:"Show video 2 min of past capstone pitch"},{time:"25-45",goal:"Build 6 panels",script:"You have 20 min to draft 6 panels on A2. Use your work from W31-34. Don't make new - assemble. Problem from W31, Data from W32, Metrics from W33, Ethics from W34. Add Next new.",studentAction:"Draft 6 panels",materials:"A2 templates, markers",check:"6 panels drafted?",stuck:"Give sentence starters for each panel"},{time:"45-65",goal:"Peer Glow/Grow",script:"Gallery walk: post boards, give 1 glow (what's strong) + 1 grow (what needs work) on sticky. Must be specific: not 'good' but 'Problem has clear persona Maya'.",studentAction:"Gallery walk, glow/grow",materials:"Sticky notes",check:"Each board has 2 glows, 2 grows?",stuck:"Give glow/grow starters"},{time:"65-80",goal:"Metrics + Micro:bit logger",script:"Now metrics: use micro:bit logger to get honest numbers. Test 3 more users, log success/fail + time. Calculate: success rate, avg time, edge case success. Write on Metrics panel. Honest > high.",studentAction:"Log metrics, update panel",materials:"micro:bits",check:"Metrics panel has numbers?",stuck:"Give metrics formula: success = success/total"},{time:"80-90",goal:"Workbook + Next Step",script:"Workbook P35: 6-panel self-check, what panel weakest, next step plan with $100 budget. Exit: What question are you scared judges will ask? Write it, we will prepare answer.",studentAction:"Workbook, write scary question",materials:"Workbook P35",check:"Scary question written?",stuck:"Give list of common scary questions"}]},unpluggedActivityEnlarged:{title:"Board Assembly Race",roles:["Problem Keeper (holds W31)","Data Keeper (W32)","Metrics Keeper (W33)","Ethics Keeper (W34)","Assembler (builds board)","Judge (checks 6 panels)"],steps:["1. Keepers hold their week's artifact","2. Assembler must collect from Keepers by asking right question: 'What was riskiest?'","3. Keepers give artifact only if question good","4. Assembler builds 6-panel board in order","5. Judge checks: 6 panels? Metrics honest? Ethics light?","6. If missing, Assembler goes back","7. Fastest complete accurate board wins"],variations:["Add saboteur: one Keeper gives wrong data - Assembler must catch","Add time pressure: 10 min assembly"],mistakes:["Forgetting Ethics panel","Metrics without edge case","Next step vague like 'make better'"]},workbook:"P35: Capstone Prep Checklist - 6 panels drafted? Data yours? Metrics honest? Ethics light + fix? Next with $100 plan? Business plan 1 sentence? Scary question + answer prep"},{id:"W36",num:36,title:"Capstone Expo",subtitle:"AI Creator Showcase - Shark Tank for Good",mentalModel:"Shark Tank for Good",color:"#0D9488",accent:"#6D28D9",icon:"\uD83E\uDD88",teacherEmpowerment:{whatIsThisReally:"Shark Tank for Good is pitch + ethics + business + next step. Since 2009 Shark Tank, pitching is key skill. But 'for Good' means judges ask not just 'Will it make money?' but 'Will it harm? Who missing? Can it sustain without harming?' Expo is celebration + accountability. Students pitch 3 min: Problem 30s, Demo 60s, Tech 30s, Metrics 30s, Ethics 30s, Business 30s, Next 30s.",whyNeed:"8th graders need to speak about tech with ethics and business - not just code. This prepares for high school, internships, life. Expo builds confidence, public speaking, and understanding that AI is socio-technical system, not just model.",realWorld:"At MIT Solve, teams pitch AI for good to investors who ask ethics. At Google Demo Day, ethics check is first slide. Students experiencing real-world demo day.",kidQuestions:[{q:"What if I get nervous?",a:"Everyone does. 3-min structure is your safety net. Breathe, follow timer, you have board to point to. Judges want you to succeed."},{q:"What if judges say my idea won't work?",a:"They will ask hard questions - that's their job. You answer with metrics + next step. 'You're right, black jackets fail 60% - next step is collect 20 more black jackets with $100 for pizza for volunteers.'"},{q:"Do we win prize?",a:"Prize is feedback + community gallery + your board stays up for 3 schools to see. Real prize: younger kids will remix your idea next year."}],vocab:[{word:"Pitch",def:"3-min story that makes people care + believe",visual:"\uD83C\uDFA4"},{word:"Demo",def:"Live show of AI working, not slides about it",visual:"\uD83D\uDDA5️"},{word:"Business Model",def:"How it sustains without harm - free? school pays? volunteer?",visual:"\uD83D\uDCA1"},{word:"Expo",def:"Exhibition where community sees + gives feedback",visual:"\uD83C\uDFAA"}]},mentalModelDeep:{teacherAnalogy:"Shark Tank: entrepreneur says 'I need $100k for 10%'. Sharks ask 'Will it make money?' Shark Tank for Good: entrepreneur says 'I need $100 and 2 weeks to test with wheelchair users'. Sharks ask 'Will it help without harming? Who missing? Can it sustain without ads?' Money is not goal - good is goal, but good needs sustainability.",studentAnalogy:"You invented new game. You pitch to friends: 'Play my game, it's fun, here's how it works, 4/5 friends finished, 1 got stuck I fixed, it's free, next I'll add level for left-handed players.' Friends decide to play. That's Shark Tank for Good.",sketchSteps:["30s: Draw timer: 0:00 Problem (who cries)","60s: Draw demo: you showing AI working live","90s: Draw tech: Input→AI→Output boxes","120s: Draw metrics: 4/5 success graph","150s: Draw ethics + business + next: traffic light + $0 free + next step"],wrongVsRight:{wrong:"My AI is cool, it uses deep learning, it will change world, give me A.",right:"Maya loses books (Problem 30s). Watch: I scan shelf, AI finds book in 12 sec (Demo 60s). Teachable Machine with 20 covers (Tech 30s). 4/5 6th graders found book, 45s avg, black covers fail (Metrics 30s). Yellow light - need Spanish books, I blur names (Ethics 30s). Free, runs on library computer, next add Spanish labels with $100 (Business + Next 60s)."},bridgeQuestion:"If you can't explain ethics and business, do you have a product or just a project?"},examplesBank:[{title:"Lunch Waste Pitch",story:"Pitch: 40lbs waste daily (Problem), demo predicts trays, tech tray counts, metrics saved 10lbs, ethics private not public, business free, next taste feedback.",howItWorks:"3-min pitch follows structure exactly",whereToSee:"Shark Tank episodes",discussionQ:"Would you invest $100 time?",whatIf:"What if kitchen staff don't want AI?",ethicsLens:{benefits:"Saves food",harmed:"If public shaming",missing:"Taste reason",trafficLight:"Yellow"}},{title:"Library Matcher Pitch",story:"Maya story hook, demo live scan, tech Teachable Machine 20 books, metrics 4/5 success 12s, ethics anonymized no reading level public, business free library computer, next Spanish.",howItWorks:"Story hook makes judges care",whereToSee:"Storytelling for good",discussionQ:"What hook worked?",whatIf:"What if demo fails live?",ethicsLens:{benefits:"Reading confidence",harmed:"If level public shames",missing:"ELL",trafficLight:"Green"}},{title:"Lost & Found Pitch",story:"200 jackets lost, demo photo search, tech object detection, metrics 80% success 45s avg black 40%, ethics blur names opt-in, business free, next collect black jackets.",howItWorks:"Honest metrics with failure shown",whereToSee:"Demo day",discussionQ:"Why show failure?",whatIf:"What if judge asks about expensive jacket mislabel?",ethicsLens:{benefits:"Saves money",harmed:"Privacy if names shown",missing:"Kids without phones",trafficLight:"Yellow"}},{title:"Hallway Crowd Pitch - Red Light Fix",story:"Originally Red light - surveillance risk. Fix: counting only, no tracking, data deleted daily, opt-out signs, wheelchair routes added. Now Yellow.",howItWorks:"Red to Yellow via design fix",whereToSee:"Ethics iteration pitches",discussionQ:"Can Red become Green?",whatIf:"What if principal still wants tracking?",ethicsLens:{benefits:"Less tardy",harmed:"Surveillance if not fixed",missing:"Consent",trafficLight:"Red→Yellow"}},{title:"Kind Words - From Red to Reflection",story:"Originally Red public score. Fix: private reflection journal, no scores, no audio stored, student controls, teacher doesn't see. Now Green as mindfulness tool.",howItWorks:"Pivot from scoring to reflection",whereToSee:"Mindfulness apps",discussionQ:"Is it still AI?",whatIf:"What if kids want score?",ethicsLens:{benefits:"Reflection not surveillance",harmed:"None if private",missing:"Cultural differences still",trafficLight:"Red→Green"}},{title:"Homework Helper Pitch - Business for Good",story:"Problem 7th graders stuck 8pm, demo hint not answer, tech matching, metrics 3/5 got hint helpful, ethics no answer leak, business free volunteer, next teacher oversight.",howItWorks:"Business model for good not profit",whereToSee:"Non-profit pitches",discussionQ:"How sustain volunteer?",whatIf:"What if volunteers give answers for popularity?",ethicsLens:{benefits:"Peer learning",harmed:"If answer leak",missing:"Teacher check",trafficLight:"Yellow"}}],physicalComputing:{project:"Shark Tank Pitch Timer + Micro:bit Confidence Meter",wiring:"micro:bit as pitch timer: 30s Problem (red), 60s Demo (green), 30s Tech (yellow), 30s Metrics (blue), 30s Ethics (purple), 30s Business+Next (white). Buzzes at time. Second micro:bit as confidence: shake = nervous, press = confident",code:"Timer: countdown 30s per section, LED color per section, buzz at end. Confidence: log nervous moments",demo:"Pitch with timer, audience sees timer colors"},communityData:{prompt:"Expo gallery from 3 schools: vote for most helpful, most ethical, most creative - remix one idea",privacy:"Gallery anonymized, voting not public ranking, remixing encouraged with credit",sample:["School A: Lunch Waste (23 votes helpful)","School B: Library Matcher (18 ethical)","School C: Lost & Found (15 creative)"]},ethicsLensWeekly:"Expo ethics: Is pitch honest? Does demo hide failure? Is business for good or profit? Who not in room?",lesson90Detailed:{prep:["Pitch timer micro:bits","Expo boards from W35","Shark Tank timer slides","Feedback sheets for audience","Gallery wall for 3 schools"],flow:[{time:"0-10",goal:"Hook - Shark Tank for Good",script:"Show 60s Shark Tank clip. Say: 'Sharks ask Will it make money? Our sharks ask Will it help without harming? You have 3 min to convince sharks to give you $100 and 2 weeks to make it better for more kids. Timer will buzz - that's your friend, not enemy.'",studentAction:"Watch clip, see timer",materials:"Clip, timer",check:"Can they name 7 parts of pitch?",stuck:"Give pitch structure card to hold"},{time:"10-25",goal:"Pitch Structure Deep Dive",script:"7 parts: Problem 30s (who cries?), Demo 60s (show don't tell, live!), Tech 30s (Input→AI→Output), Metrics 30s (honest numbers + failure), Ethics 30s (light + fix), Business 30s (how sustain free?), Next 30s (what with $100?). Business for good = free, volunteer, school computer, no ads.",studentAction:"Fill pitch
