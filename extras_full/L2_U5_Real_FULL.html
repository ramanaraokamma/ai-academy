h something new to break it."},{q:"Is it spying on my thoughts?",a:"No, it’s spying on patterns. It cannot hear your thoughts, only your taps. But taps are powerful clues, so it feels like mind-reading."}],vocabForTeacher:[{term:"Recommendation",teacherDef:"System that predicts user preference for an item",kidDef:"Computer suggesting stuff you might like",pronunciation:"re-kuh-men-DAY-shun",visualCue:"\uD83E\uDD1D → \uD83D\uDCE6"},{term:"Collaborative Filtering",teacherDef:"Using behavior of similar users to predict one user’s taste",kidDef:"Friends-like-you trick",pronunciation:"koh-LAB-oh-ray-tiv FIL-ter-ing",visualCue:"\uD83D\uDC65 overlapping circles"},{term:"Filter Bubble",teacherDef:"When personalization narrows exposure to diverse views",kidDef:"Stuck seeing only same type",pronunciation:"FIL-ter BUH-bul",visualCue:"\uD83E\uDEE7 bubble around person"},{term:"Similarity Score",teacherDef:"Numeric measure of how alike two users/items are",kidDef:"How close two people’s tastes are",pronunciation:"sim-ih-LAR-ih-tee SKOR",visualCue:"\uD83D\uDCCF 0 to 1 scale"}]},mentalModelDeep:{name:"Friend Suggestion",teacherAnalogy:"Think of a cafeteria table where everyone trades lunch notes. If Maya and you both love spicy chips and comic books, and Maya loved a new graphic novel, I’d bet you will too. The model never tastes the chips; it just tracks who liked what. That is collaborative filtering.",studentAnalogy:"If your best friend likes a song and you usually like the same songs, you will probably like that new song too.",sketchSteps:["Draw 3 stick figures labeled You, Alex, Sam.","Draw 3 books: A, B, C with stars under each figure showing who liked what.","Show You and Alex both liked A and B - draw line connecting them “Similar!”","Alex also liked C - draw arrow from Alex’s C to You with ?","Write “Recommend C to You because Friend-Similar” and circle."],commonWrongModel:{wrong:"AI watches the video and knows it is good.",right:"AI never watches. It sees “many kids who watched X also watched Y for 10 minutes.” It is social, not artistic judgment."},bridgeQuestion:"If you suddenly started liking only chess videos, how long would it take for your “friend group” in the computer to change?"},examplesBank:[{title:"YouTube Up Next",story:"Mina watches slime videos for an hour. Suddenly her Up Next is all slime, even slime she has seen. She wonders why she never sees science anymore.",howItWorks:"YouTube groups Mina with other long slime-watchers. That group rarely clicks science, so science scores low. It predicts watch time, not variety.",whereToSee:"YouTube homepage and Up Next panel",discussionQ:"Who decides what counts as “similar”?",whatIf:"What if YouTube optimized for “learned something new” instead of watch time?",ethicsLens:{benefits:"Finds niche content quickly",harmed:"Creators outside bubble get less views",missing:"Users who want to branch out",trafficLight:"Yellow"}},{title:"Spotify Discover Weekly",story:"Two friends both love lo-fi and indie. One discovers a new artist. The other gets it next Monday in Discover Weekly without searching.",howItWorks:"Embeds songs and listeners in vector space. If your vector is near another listener, their recent favorites become candidates for you.",whereToSee:"Spotify Discover Weekly",discussionQ:"Does this help new artists or hurt them?",whatIf:"What if your data was from only last week vs all time?",ethicsLens:{benefits:"Music discovery",harmed:"Small artists if similarity is too narrow",missing:"Different culture music",trafficLight:"Green"}},{title:"Amazon “People who bought this”",story:"You buy a math workbook. Amazon suggests a calculator and erasers. It feels helpful until it suggests 5 more workbooks you don’t need.",howItWorks:"Co-purchase matrix: counts how often Item A and B are bought together across millions of carts. High co-occurrence = recommendation.",whereToSee:"Amazon product page",discussionQ:"When is a recommendation helpful vs pushy?",whatIf:"What if data included returns (bought but disliked)?",ethicsLens:{benefits:"Saves time shopping",harmed:"Impulse buying, overspending",missing:"Budget constraints",trafficLight:"Yellow"}},{title:"TikTok For You",story:"Jaden likes one skate trick. In 20 minutes his whole For You is skate tricks, even though he also loves cooking.",howItWorks:"Very fast learning from micro-interactions: re-watches, pauses, likes. Updates similarity in real time.",whereToSee:"TikTok FYP",discussionQ:"Should AI learn this fast? Pros/cons?",whatIf:"What if you could pause the learning?",ethicsLens:{benefits:"Hyper-relevant fast",harmed:"Can trap in one interest, time loss",missing:"Intentional diversity",trafficLight:"Red"}},{title:"Library Shelf “If you liked...”",story:"Librarian puts “If you liked Dog Man, try...” cards. Kids who liked Dog Man mostly liked Investigators too. New kids get that hint.",howItWorks:"Same as collaborative filtering but with paper cards and tally marks. No computer needed.",whereToSee:"School library displays",discussionQ:"Is the librarian’s version more fair than YouTube’s?",whatIf:"What if only boys’ choices were counted?",ethicsLens:{benefits:"Human-curated, community trust",harmed:"None if diverse data",missing:"Less popular genres",trafficLight:"Green"}},{title:"Game Skin Store",story:"A game suggests an expensive skin because players like you bought it. Some players feel pressured.",howItWorks:"Purchase similarity plus willingness-to-pay prediction. Groups by spending pattern.",whereToSee:"Fortnite, Roblox avatar shop",discussionQ:"When does personalization become manipulation?",whatIf:"What if age was removed from data?",ethicsLens:{benefits:"Finds cool items",harmed:"Kids, low-income players nudged to spend",missing:"Parental controls, price sensitivity",trafficLight:"Red"}}],physicalComputing:{title:"Paper Sticky Notes Recommendation Engine",concept:"Build a physical user-item matrix with sticky notes and find similar friends.",materials:["Sticky notes 3 colors","Large poster board","Markers","Dot stickers"],wiringDesc:"No wiring. For micro:bit extension: Button A = Like, Button B = Dislike, logs to radio group. Teacher micro:bit receives and tallies.",codeBlocks:["on Button A pressed: radio send “LIKE:Book1” + show heart","on Button B pressed: send “DISLIKE:Book1”","Receiver: if LIKE count > 3, light up recommendation LED"],noTechVersion:"Students place dot stickers on books they like on class board. Count overlapping dots to find “friend” with most overlap. Recommend their extra likes.",teacherTips:"Make sure shy students can vote anonymously. Use initials not names if needed. The visual of overlapping dots makes similarity concrete."},communityData:{prompt:"What 3 books would you recommend to a 7th grader who loved Percy Jackson?",samplePool:[{book:"Heroes of Olympus",votes:28,classes:"All 3 classes love sequel"},{book:"Keeper of Lost Cities",votes:19,classes:"Class B & C"},{book:"Wings of Fire",votes:15,classes:"Class A only - filter bubble?"}],insight:"When we pooled 3 classes, we saw Class A over-recommended dragon books because their teacher read it aloud. That is data bias.",privacy:"Anonymized: only book titles and tally, no names. Demonstrates how real companies should aggregate.",filterBubbleDemo:"Show board with only Class A data vs all classes. Diversity jumps from 3 genres to 7."},lesson90Detailed:{prep:["Poster board matrix drawn","Sticky notes cut","Example video queued (30s YouTube rec)","Print recommendation cards"],phases:[{time:"0-10 Warm-up",goal:"Activate personal experience",teacherScriptExact:"Everyone, open YouTube history in your mind. What is the first video you see tomorrow morning? Why that one? Turn to partner and guess how YouTube chose it. We will uncover the trick today: Friend Suggestion.",studentAction:"Pair share: predict tomorrow’s first recommendation and why.",materials:"None",checkUnderstanding:"✅ Can name one clue YouTube uses? (watch time, likes)",ifStuck:"\uD83D\uDFE7 Prompt: Does YouTube watch the video or watch YOU?"},{time:"10-25 Concept",goal:"Introduce collaborative filtering via Friend Suggestion",teacherScriptExact:"Imagine I never read a single book, but I track who likes what. If you and Alex liked Book A and B, and Alex liked C, I will give you C. I did not read C. I copied friendship. That is how recommendation works. Let’s draw it together.",studentAction:"Copy board sketch, label similar users.",materials:"Whiteboard, markers",checkUnderstanding:"✅ Can explain difference between “AI likes it” vs “people like you liked it”?",ifStuck:"\uD83D\uDFE7 Use lunch table analogy: same chips = same taste."},{time:"25-45 Unplugged",goal:"Physical sticky note matrix",teacherScriptExact:"You are now the computer. Each table gets 5 books. Place a dot if you liked it. Now find the person at your table with most overlapping dots. That is your “similar friend.” Recommend one book they liked that you haven’t read.",studentAction:"Trainer places dots, Model checks overlap, Tester counts similarity, Recorder writes recommendation.",materials:"Sticky notes, poster",checkUnderstanding:"✅ Can compute similarity score: overlap / total?",ifStuck:"\uD83D\uDFE7 Reduce to 3 books only, use colors."},{time:"45-60 Examples + Ethics",goal:"Apply to 6 real apps",teacherScriptExact:"Look at these six cards: YouTube, Spotify, Amazon, TikTok, Library, Game store. With your group, pick one and fill: benefit, who might be harmed, who is missing, traffic light. Remember, traffic light is your judgment, not mine.",studentAction:"Jigsaw groups analyze one example, then teach others.",materials:"Example cards",checkUnderstanding:"✅ Can name one benefit and one harm?",ifStuck:"\uD83D\uDFE7 Start with Green examples (library) then move to Red."},{time:"60-80 Build",goal:"Create class recommendation board",teacherScriptExact:"Now we pool. If you liked Dog Man, what else? Write one title on sticky and place under Dog Man column. We are building our own engine. Watch what happens to diversity when we add Class B data tomorrow.",studentAction:"Add sticky to class board, observe filter bubble vs diversity.",materials:"Class board, stickies",checkUnderstanding:"✅ Can see how more diverse data changes recommendations?",ifStuck:"\uD83D\uDFE7 Model first: “If you liked...” sentence starter."},{time:"80-90 Exit",goal:"Reflect and assess",teacherScriptExact:"On exit ticket, answer: How does Friend Suggestion work in one sentence? And one way to break out of your filter bubble? Drop it in the box on your way out.",studentAction:"Complete workbook matrix and exit ticket.",materials:"Workbook W25",checkUnderstanding:"✅ Exit ticket shows similarity idea and bubble break strategy.",ifStuck:"\uD83D\uDFE7 Provide sentence stem: “Recommendation is when…”"}]},unpluggedActivityEnlarged:{title:"Friend Suggestion Matrix",roles:[{role:"Trainer",does:"Places dots for likes, explains why"},{role:"Model",does:"Acts as algorithm, finds most overlapping person"},{role:"Tester",does:"Counts overlap and checks if recommendation makes sense"},{role:"Recorder",does:"Writes similarity scores and final recommendation"}],materials:["Poster board with grid Users x Books","3 colors sticky dots","Markers"],steps:["1. Label rows with group members initials, columns with 5 books.","2. Each member places dots on books they genuinely liked.","3. Trainer picks one member as target user.","4. Model counts overlap of each other member with target (similarity).","5. Highest overlap = similar friend.","6. Find a book similar friend liked that target did not. Recommend it.","7. Swap target and repeat. Discuss: does recommendation feel accurate?"],variations:{fast:"Use only 3 books, pre-marked dots",slow:"Add 10 books and compute Jaccard similarity formally"},observes:["Do students conflate popularity (most dots) with similarity (overlap)?","Can they articulate why more data helps?","Do they notice filter bubble when same genre dominates?"],mistakes:["Thinking AI reads book content","Recommending most popular overall not most similar","Forgetting to anonymize and using names to tease"]},workbook:{task1:"Fill 4x4 matrix: Users A-D, Books 1-4. Mark likes. Compute who is most similar to User A. Recommend one book.",task2:"YouTube Case: Mina watches 10 slime videos. List 3 consequences for her feed diversity. Propose one fix YouTube could offer.",exitTicket:["Define collaborative filtering in kid words","Give one benefit and one harm of recommendations","One action to break your filter bubble"],rubric:[{level:"Emerging",desc:"Names recommendation but confuses with content analysis"},{level:"Developing",desc:"Explains “people like you liked” with example"},{level:"Proficient",desc:"Computes similarity and identifies filter bubble trade-off"},{level:"Advanced",desc:"Proposes design change to improve diversity/privacy"}]}},{id:"W26",num:26,title:"Search & Ranking",subtitle:"How Google ranks",mentalModelName:"Library Ranking",mentalModelIcon:"\uD83D\uDCDA",color:"#EA580C",teacherEmpowerment:{whatIsThisReally:"Search is two jobs: find documents that match words (retrieval) then order them by usefulness (ranking). PageRank in 1998 counted links as votes; more important pages get more votes. Today Google combines 200+ signals: relevance, freshness, location, PageRank, and user click behavior. It does not “know” best answer, it predicts which result you will find useful.",why7thGradersNeedThis:"They Google 20 times a day but think top result = correct result. Understanding ranking as a librarian’s best guess builds critical search literacy. It explains why same query gives different top results for different people.",realWorldBehindTheScenes:"When you type “best dogs for kids”, Google first finds all pages containing those words (inverted index). Then it scores each: does title match? Is site trusted? Do other trusted sites link to it? Did previous users click it and stay? It blends scores. Ads and SEO try to game those signals. Ranking is prediction, not truth.",kidQuestionsAndAnswers:[{q:"How does Google know which result is best?",a:"It guesses based on clues: words match, other sites link to it, people clicked it before and stayed. Best = predicted most helpful for you, not universally true."},{q:"Why do my friend and I get different results?",a:"Because ranking uses your location, past clicks, and what Google thinks you want. Same question, different personal librarian."},{q:"Can anyone be top result?",a:"Anyone can try by writing good matching content and getting links. But Google also fights spam. Being top takes trust and relevance."}],vocabForTeacher:[{term:"Ranking",teacherDef:"Ordering results by predicted usefulness",kidDef:"Librarian putting best books on top",pronunciation:"RANG-king",visualCue:"\uD83D\uDCDA stack tallest first"},{term:"PageRank",teacherDef:"Link-based authority score",kidDef:"Votes from other websites",pronunciation:"PAGE-rangk",visualCue:"\uD83D\uDD17→⭐"},{term:"Relevance",teacherDef:"How well doc matches query intent",kidDef:"Does it answer what I meant?",pronunciation:"REL-eh-vance",visualCue:"\uD83C\uDFAF bullseye"},{term:"SEO",teacherDef:"Optimizing content to rank higher",kidDef:"Trying to trick librarian",pronunciation:"S-E-O",visualCue:"\uD83E\uDE9C ladder to top"}]},mentalModelDeep:{name:"Library Ranking",teacherAnalogy:"Imagine you ask a librarian for “volcano book good for project.” She does not read every book. She checks: title has volcano? Is author a geologist? Did many other librarians recommend it? Did last kid who took it keep it long? She stacks best guesses. Google is that librarian with super memory.",studentAnalogy:"Librarian puts most helpful books on top of the pile, not random. She uses clues like title, who liked it, and who recommended it.",sketchSteps:["Draw librarian desk with 5 books scattered.","Write query above: “volcano project”.","Add 3 clues checklist next to each book: Title Match? Links? Kid kept it?","Score each book with stars ★★★.","Stack books ordered by stars, top = best guess."],commonWrongModel:{wrong:"Google reads internet and knows true answer.",right:"Google scores clues about usefulness. It can be wrong or gamed. Truth is not guaranteed by rank."},bridgeQuestion:"If you were librarian, would you rank a funny but inaccurate volcano book higher than a boring accurate one for a 7th grader?"},examplesBank:[{title:"Google “Best Pizzas Near Me”",story:"Two students search same words. One gets downtown spots, other gets suburban spots. Both think Google shows all pizzas.",howItWorks:"Ranking combines text match + location signal + popularity. Location personalizes top results.",whereToSee:"Google search with location on",discussionQ:"Is personalized pizza helpful or should everyone see same list?",whatIf:"What if location data was turned off?",ethicsLens:{benefits:"Finds nearby useful results",harmed:"Businesses far away lose clicks",missing:"Travelers without local data",trafficLight:"Green"}},{title:"YouTube Search Ranking",story:"Search “how to tie tie.” Top video has 10M views but is fast and confusing. A slower 100k view video is clearer but buried.",howItWorks:"Views and watch time boost rank, not clarity. Click-through rate is a strong signal.",whereToSee:"YouTube search",discussionQ:"Should views = quality?",whatIf:"What if ranking used “rewatched less = clearer”?",ethicsLens:{benefits:"Surfaces popular help",harmed:"New helpful creators",missing:"Beginner-friendly metrics",trafficLight:"Yellow"}},{title:"School Library Catalog",story:"Librarian reorders books: books with matching title on top, then most borrowed, then newest. Kids find project books faster.",howItWorks:"Hand-ranked with same signals: title match, popularity, freshness. Transparent rules.",whereToSee:"School OPAC",discussionQ:"Why is transparent ranking easier to trust?",whatIf:"What if we ranked only by newest?",ethicsLens:{benefits:"Teaches how ranking works",harmed:"None",missing:"Serendipity",trafficLight:"Green"}},{title:"Fake News Ranking High",story:"A sensational but false article about “school bans water” gets many clicks and links, outranking official school notice.",howItWorks:"Sensationalism drives clicks and shares, which ranking interprets as relevance/popularity. No fact-check in base algorithm.",whereToSee:"News search, Discover",discussionQ:"Whose job is truth: algorithm or user?",whatIf:"What if ranking penalized outrage words?",ethicsLens:{benefits:"Fast info spread",harmed:"Public misled, school reputation",missing:"Fact-checkers, affected students",trafficLight:"Red"}},{title:"App Store Search",story:"Search “math game.” Top result is paid ad, second is game that paid for keywords, third is actually best rated.",howItWorks:"Ads + keyword SEO + ratings. Payment can buy rank.",whereToSee:"App Store / Play Store",discussionQ:"Should ads be allowed to look like top results?",whatIf:"What if ads were banned from top 3?",ethicsLens:{benefits:"Funds store",harmed:"Kids tricked, money over quality",missing:"Low-income devs",trafficLight:"Yellow"}},{title:"Google Images Bias",story:"Search “scientist.” First 20 images are mostly one demographic. Students think that is what scientists look like.",howItWorks:"Image ranking inherits historical data bias: more linked/clicked images of certain demographics.",whereToSee:"Google Images",discussionQ:"How does ranking shape what we think is normal?",whatIf:"What if we added diversity signal to ranking?",ethicsLens:{benefits:"Fast visual answers",harmed:"Stereotype reinforcement",missing:"Diverse scientists",trafficLight:"Red"}}],physicalComputing:{title:"Library Ranking with Books",concept:"Physically rank 5 books for query using scorecards for relevance, authority, freshness.",materials:["5 real books","Scorecards","Star stickers","Query card"],wiringDesc:"micro:bit as scoreboard: Each criterion = button. Press A for relevance star, B for link vote. Displays total score on LED matrix.",codeBlocks:["on A pressed: relevance +=1, show relevance","on B pressed: authority +=1, show authority","on A+B: calculate total = relevance*2 + authority + freshness"],noTechVersion:"Groups get 5 books, query card “climate change for 7th grade.” Score each 1-3 on title match, trusted author, borrowed count. Stack by total.",teacherTips:"Use actual library books to make tactile. Emphasize there is no single right order - ranking is judgment with clues."},communityData:{prompt:"Rank these 4 sources for query “should schools have uniforms?”",samplePool:[{book:"Official school district page",votes:32,classes:"Highest authority"},{book:"Teen blog pro-uniform",votes:18,classes:"High relevance, low authority"},{book:"News article 2019",votes:12,classes:"Freshness low"},{book:"Ad for uniform shop",votes:2,classes:"Everyone ranked lowest"}],insight:"Students ranked ads lowest despite them often being top in real search. Shows gap between human values and algorithmic signals.",privacy:"No personal data, only ranking votes.",filterBubbleDemo:"Compare rankings when query is “uniforms good” vs “uniforms bad” - confirmation bias emerges."},lesson90Detailed:{prep:["5 books per table","Scorecards printed","Query cards","Projector for live Google search demo"],phases:[{time:"0-10 Hook",goal:"Reveal ranking illusion",teacherScriptExact:"I will Google “best video games” on two laptops. Watch top 3. They will be different. Why? Because Google is not a truth machine. It is a librarian who knows you. Today we become librarians.",studentAction:"Observe two different result lists, hypothesize why.",materials:"2 laptops, projector",checkUnderstanding:"✅ Notices personalization exists",ifStuck:"\uD83D\uDFE7 Ask: same words, different results - what else could change?"},{time:"10-25 Direct",goal:"Teach 3 signals: relevance, authority, behavior",teacherScriptExact:"Librarian uses three clues. One, does title match? Two, do other trusted libraries recommend it? That is PageRank. Three, did last kid keep it or return fast? That is behavior. Google uses same three.",studentAction:"Draw 3-clue checklist in notebook.",materials:"Slide with 3 icons",checkUnderstanding:"✅ Can list 3 signals in own words",ifStuck:"\uD83D\uDFE7 Use pizza example: title, friends recommend, you stayed long."},{time:"25-45 Unplugged",goal:"Rank books physically",teacherScriptExact:"Each table is Google for one query. Score each book: 0-2 stars for title match, 0-2 for authority (author, publisher), 0-2 for kid behavior (would a 7th grader keep it?). Add up. Stack highest on top. No perfect answer, but defend your order.",studentAction:"Score and stack books, prepare defense.",materials:"Books, scorecards",checkUnderstanding:"✅ Produces ordered stack and justification",ifStuck:"\uD83D\uDFE7 Start with only title match, then add second clue."},{time:"45-60 Examples",goal:"Evaluate real search biases",teacherScriptExact:"Now we look at six real searches. Some are Green, some Red. For each, ask: who benefits if this stays top? Who is harmed? Who is missing from the data?",studentAction:"Analyze one assigned search example, fill ethics lens.",materials:"Example cards",checkUnderstanding:"✅ Identifies at least one harmed/missing group",ifStuck:"\uD83D\uDFE7 Use sentence frame: “If I were a ___ I would feel…”"},{time:"60-80 Build + Debate",goal:"Design better ranking",teacherScriptExact:"Your job: design ranking for school library that is fair. What three signals would you use? Would you allow ads? Would you boost diverse authors? Write your ranking recipe. Then we will vote.",studentAction:"Create ranking recipe poster, gallery walk vote.",materials:"Poster paper",checkUnderstanding:"✅ Recipe includes at least 2 signals + fairness rule",ifStuck:"\uD83D\uDFE7 Provide template: My ranking uses ___, ___, and ___ because..."},{time:"80-90 Exit",goal:"Metacognition",teacherScriptExact:"Exit ticket: What does top result mean? Not “true” but “predicted most helpful based on clues.” One clue you will check next time you Google.",studentAction:"Workbook ranking exercise + exit ticket",materials:"Workbook W26",checkUnderstanding:"✅ Distinguishes rank from truth",ifStuck:"\uD83D\uDFE7 Stem: Top result means the computer thinks..."}]},unpluggedActivityEnlarged:{title:"Human PageRank Library",roles:[{role:"Trainer",does:"Reads query aloud, checks title match"},{role:"Model",does:"Counts link votes from other tables (who recommended this book?)"},{role:"Tester",does:"Checks freshness and whether kid would keep it"},{role:"Recorder",does:"Tally stars and final stack order"}],materials:["5 books","Star stickers","Link voting cards"],steps:["1. Query card revealed: e.g., “volcanoes for project”.","2. Trainer scores title match 0-2.","3. Each other table gives one link vote to best book (authority).","4. Tester scores predicted keep-time 0-2.","5. Recorder totals = title*2 + links + keep.","6. Stack books descending total.","7. Repeat with new query, see order change."],variations:{fast:"Only title match scoring",slow:"Add weighted formula and SEO attack: add keyword stuffing to one book title"},observes:["Do students default to popularity = quality?","Can they defend trade-off between funny vs accurate?","Do they notice SEO gaming?"],mistakes:["Ranking by personal favorite not query relevance","Forgetting PageRank is votes from others","Thinking highest score = factually correct"]},workbook:{task1:"Given 3 webpages about dogs with scores: Relevance 3/2/1, Links 10/5/0, Clicks 100/20/5. Compute weighted total (Relevance*3 + Links + Clicks/10). Rank them.",task2:"SEO Attack: A page adds “best dogs best dogs best dogs” to title. How does that game relevance? How could Google detect it?",exitTicket:["What are 2 signals Google uses to rank?","Why can top result be wrong?","How would you make image search less biased?"],rubric:[{level:"Emerging",desc:"Thinks top = true"},{level:"Developing",desc:"Names one ranking signal"},{level:"Proficient",desc:"Explains 3 signals and that rank is prediction"},{level:"Advanced",desc:"Proposes fairness intervention for ranking"}]}},{id:"W27",num:27,title:"Voice Assistants",subtitle:"How They Learn Your Voice",mentalModelName:"Parrot Learning",mentalModelIcon:"\uD83E\uDD9C",color:"#F97316",teacherEmpowerment:{whatIsThisReally:"Voice assistants convert sound waves to text (speech recognition) then text to action (NLU). Early systems in 1950s recognized digits only. Breakthrough came 2010s with deep learning on thousands of hours of labeled speech. Siri (2011) uses acoustic model that maps sound chunks to phonemes, plus language model that guesses likely word sequences. It improves with more examples of your voice, like a parrot.",why7thGradersNeedThis:"They say “Hey Siri” daily but think it understands meaning like a human. Knowing it matches sound patterns explains why accents, noise, and mumbling break it. It also raises privacy: your voice data trains models.",realWorldBehindTheScenes:"When you say “play music,” microphone captures waveform. System slices into 20ms chunks, extracts frequencies (spectrogram). Acoustic model predicts phonemes: “p l ay”. Language model predicts likely word: “play” vs “clay” given context. If confidence low, it asks clarification. Your corrections (“No, I said…”) become training data if opted in.",kidQuestionsAndAnswers:[{q:"Does Siri understand me?",a:"It matches sound patterns to words it has seen many times. It does not understand meaning like you do. It is pattern matching, not thinking."},{q:"Why does it understand my brother better?",a:"Because it heard more examples like his voice, or his speech is closer to its training data. Accents underrepresented get lower accuracy."},{q:"Where does my voice go?",a:"The audio is sent to servers to be processed. Some companies keep anonymized clips to improve models. You can often delete history in settings."}],vocabForTeacher:[{term:"Speech Recognition",teacherDef:"Converting audio waveform to text",kidDef:"Computer writing down what it hears",pronunciation:"speech rek-og-NIH-shun",visualCue:"\uD83C\uDFA4→\uD83D\uDCDD"},{term:"Acoustic Model",teacherDef:"Maps sound features to phonemes",kidDef:"Parrot ear that hears sound bits",pronunciation:"ah-KOOS-tik MOD-el",visualCue:"\uD83D\uDC42→\uD83D\uDD24"},{term:"Wake Word",teacherDef:"Keyword that activates listening",kidDef:"Magic word that makes it listen",pronunciation:"WAKE WORD",visualCue:"\uD83D\uDDE3️ “Hey...” → \uD83D\uDC41️"},{term:"Training Data Bias",teacherDef:"Model works better for voices similar to training data",kidDef:"Parrot learned only some voices",pronunciation:"BIAS",visualCue:"\uD83E\uDD9C hears only one person"}]},mentalModelDeep:{name:"Parrot Learning",teacherAnalogy:"A parrot does not understand English, but if you say “hello” 100 times clearly, it mimics sound pattern. More varied examples = better mimic. If you mumble, parrot mumbles. If you only teach it your voice, it fails on your cousin. Voice AI is a parrot that learned from thousands of humans.",studentAnalogy:"Like teaching a parrot your favorite phrase. It needs to hear it many times, and it copies sounds, not meaning.",sketchSteps:["Draw ear → sound wave wiggly line.","Slice wave into 5 little boxes (20ms chunks).","In each box draw frequency bars (like equalizer).","Arrow to parrot brain labeled “Which sound bit is this? p? l? ay?”","Parrot outputs words: “PLAY MUSIC” and learns."],commonWrongModel:{wrong:"Siri listens and understands meaning like a person.",right:"Siri matches sound chunks to most likely words based on patterns it heard before. It does not know what music feels like."},bridgeQuestion:"If a parrot only ever heard adults, would it understand a 7th grader’s voice? What would help it learn?"},examplesBank:[{title:"Siri Mishears Accent",story:"Amara says “set timer for 10 minutes” with accent. Siri sets timer for 10 minutes? Actually “tin minutes” and fails. Her brother with American accent works fine.",howItWorks:"Acoustic model trained mostly on American English. Phoneme mapping less accurate for underrepresented accents.",whereToSee:"Siri, Alexa with different accents",discussionQ:"Is it fair that AI works better for some accents?",whatIf:"What if training included 1000 hours of Amara’s accent?",ethicsLens:{benefits:"Hands-free help",harmed:"Speakers of underrepresented accents frustrated",missing:"Diverse voice datasets",trafficLight:"Red"}},{title:"Voice Unlock",story:"Phone unlocks with “Hey Siri, it’s me.” Works for owner but also sometimes for sibling with similar voice.",howItWorks:"Speaker verification uses voiceprint embedding. Similar voices have close embeddings.",whereToSee:"Phone voice unlock",discussionQ:"Should voice be used as password?",whatIf:"What if someone records your voice?",ethicsLens:{benefits:"Convenient",harmed:"False accepts security risk",missing:"Liveness detection",trafficLight:"Yellow"}},{title:"Noisy Classroom Fail",story:"Student says “define photosynthesis” in noisy cafeteria. Assistant hears “define photo sin the sis” and shows weird results.",howItWorks:"Noise masks frequency features, acoustic model confidence drops, language model guesses wrong.",whereToSee:"Any assistant in noise",discussionQ:"How could it handle noise better?",whatIf:"What if mic had noise cancellation training?",ethicsLens:{benefits:"Works well in quiet",harmed:"Users in noisy environments",missing:"Noise-robust training",trafficLight:"Yellow"}},{title:"Kid Voice Not Recognized",story:"7-year-old says “play Baby Shark.” Assistant says “I didn’t catch that.” Adult repeats same and works.",howItWorks:"Training data mostly adults, higher pitch and different phoneme durations for kids underrepresented.",whereToSee:"Family smart speaker",discussionQ:"Who decides what voices to include?",whatIf:"What if kids could donate voice data safely?",ethicsLens:{benefits:"Adult convenience",harmed:"Kids excluded",missing:"Child speech datasets with consent",trafficLight:"Red"}},{title:"Voice Assistant Helping Disability",story:"Student with limited mobility uses voice to turn on lights, set reminders, read books aloud. Gains independence.",howItWorks:"Same acoustic + language pipeline, but impact huge for accessibility.",whereToSee:"Accessibility features",discussionQ:"How can we ensure this benefit reaches all who need it?",whatIf:"What if device was offline and private?",ethicsLens:{benefits:"Independence, accessibility",harmed:"None if private",missing:"Offline options for privacy",trafficLight:"Green"}},{title:"Parrot Privacy",story:"Family notices smart speaker activated without wake word, recorded private conversation. Worried where recording went.",howItWorks:"Wake word detection runs locally, but false activation sends audio to cloud. Cloud stores for improvement if opted in.",whereToSee:"Smart speaker privacy settings",discussionQ:"Should speaker always listen for wake word? Trade-offs?",whatIf:"What if wake word detection was more strict?",ethicsLens:{benefits:"Convenient activation",harmed:"Privacy breach, trust loss",missing:"Clear consent, easy delete",trafficLight:"Red"}}],physicalComputing:{title:"Parrot - Record and Playback Acoustic Pattern",concept:"micro:bit records loudness pattern and plays back, shows how acoustic features are extracted.",materials:["micro:bit","Battery pack","Optional: speaker","Paper waveform strips"],wiringDesc:"micro:bit mic (V2) detects sound level. Button A: start listening, shows waveform bars on LEDs. Button B: playback via tone frequency mapped to loudness. No external wiring needed.",codeBlocks:["on A pressed: start recording sound levels into array for 2 sec, show bar graph","loop array: plot loudness as LED height","on B pressed: for each level, play tone frequency = level*10, show same bar"],noTechVersion:"Students hum same phrase 3 times, partner draws wiggly loudness line each time. Compare lines - similar but not identical. That is why parrot needs many examples.",teacherTips:"Let students hear how same words produce different waveforms when whispered vs shouted. This is why acoustic model needs variety."},communityData:{prompt:"Record “Hello, library” in different voices. How many tries until micro:bit recognizes pattern?",samplePool:[{book:"Adult male voice - avg 2 tries",votes:10,classes:"High accuracy"},{book:"Adult female voice - avg 2 tries",votes:12,classes:"High accuracy"},{book:"7th grade voice - avg 5 tries",votes:28,classes:"Lower - bias visible"}],insight:"Pooled class data shows kids need more repetitions - demonstrates training data bias physically.",privacy:"No actual voice stored, only loudness numbers 0-255. Discuss anonymization.",filterBubbleDemo:"If we only train on adult voices, kid accuracy stays low. Need diverse pool."},lesson90Detailed:{prep:["micro:bits charged","Paper waveform strips","Demo video of spectrogram","Privacy settings screenshot"],phases:[{time:"0-10 Wake",goal:"Hear the parrot",teacherScriptExact:"I will say “Hey Parrot, play music” in three voices: whisper, normal, silly. My parrot micro:bit will try to match. Watch when it fails. Why does a real parrot need to hear many times?",studentAction:"Observe micro:bit loudness bars change with voice.",materials:"micro:bit",checkUnderstanding:"✅ Notices loudness/frequency changes affect recognition",ifStuck:"\uD83D\uDFE7 Ask: did wave shape stay same or change?"},{time:"10-25 Concept",goal:"Slice sound into chunks",teacherScriptExact:"Sound is wiggly air. Computer slices into tiny 20-millisecond boxes and looks at humps inside - high squeaky or low rumble. Each box maps to a sound bit like “p” or “ay”. Many boxes together make “play”. Let’s draw slicing.",studentAction:"Draw waveform sliced into boxes, label phonemes.",materials:"Whiteboard",checkUnderstanding:"✅ Can explain acoustic model as sound bits matcher",ifStuck:"\uD83D\uDFE7 Use slinky analogy: wave slices."},{time:"25-45 Unplugged",goal:"Human parrot training",teacherScriptExact:"One person is human, one is parrot. Human says “open library” 5 times, each time a bit different. Parrot draws squiggly loudness line each time, then tries to guess new version. Does more practice help?",studentAction:"Trainer says phrase variations, Model draws waveforms, Tester tries to match new utterance.",materials:"Waveform strips",checkUnderstanding:"✅ Shows improvement with more examples",ifStuck:"\uD83D\uDFE7 Reduce to 2 words, “hi” vs “hello”."},{time:"45-60 Physical Lab",goal:"micro:bit parrot",teacherScriptExact:"Now micro:bit is parrot. Press A to teach it your “hello library” loudness pattern. Press B to see it playback as tones. Try whisper vs shout. When does it confuse?",studentAction:"Record and playback, compare patterns.",materials:"micro:bit",checkUnderstanding:"✅ Identifies noise and accent affect pattern",ifStuck:"\uD83D\uDFE7 Use loud clap vs soft hum first."},{time:"60-80 Ethics + Data Pool",goal:"Bias and privacy",teacherScriptExact:"Look at our pooled data: adult voices needed 2 tries, 7th grade needed 5. Why? Training data had more adults. Who is harmed? Also, where does your voice go after you say hey Siri? Let’s check privacy settings together.",studentAction:"Analyze pooled tries, discuss bias, explore delete voice history.",materials:"Pooled chart, settings screenshot",checkUnderstanding:"✅ Can name one bias harm and one privacy action",ifStuck:"\uD83D\uDFE7 Frame: If parrot only heard adults, what happens to kids?"},{time:"80-90 Exit",goal:"Summarize parrot model",teacherScriptExact:"Exit: Explain Parrot Learning in one sentence: Siri is like a parrot that... And one way to make it fairer for all voices.",studentAction:"Workbook: draw waveform and propose fairness fix.",materials:"Workbook W27",checkUnderstanding:"✅ Defines as pattern matching needing many examples",ifStuck:"\uD83D\uDFE7 Stem: Parrot needs many examples because..."}]},unpluggedActivityEnlarged:{title:"Parrot Learns Your Words",roles:[{role:"Trainer",does:"Says phrase 5 times with variations"},{role:"Model",does:"Draws loudness waveform each time, tries to average"},{role:"Tester",does:"Says new version, checks if Model recognizes"},{role:"Recorder",does:"Counts tries needed to recognize"}],materials:["Paper strips","Markers","Timer"],steps:["1. Trainer chooses phrase “open book”.","2. Says it 3 times, Model draws 3 waveform lines.","3. Trainer says new variation (whisper/fast).","4. Model guesses which phrase based on waveform similarity.","5. Repeat with accent imitation (fast/slow).","6. Count accuracy: 1st try vs after 5 examples.","7. Switch roles and test kid vs adult voice."],variations:{fast:"Only 2 examples, see failure",slow:"Add noisy background (other group clapping) to test robustness"},observes:["Do students think parrot understands meaning?","Can they see why more diverse data helps?","Do they connect to privacy (where do waveforms go)?"],mistakes:["Thinking waveform stores words, not sound pattern","Not varying voice, so overfitting","Forgetting that parrot copies sound, not intent"]},workbook:{task1:"Draw waveform for “hello” whispered vs shouted. Label 2 differences. Why would acoustic model struggle?",task2:"Bias audit: Table shows accuracy: Adult American 95%, Adult Indian accent 78%, Kid 62%. Which group is harmed? Propose fix.",exitTicket:["Explain Parrot Learning model","Why does Siri fail in noise?","One privacy setting you would check"],rubric:[{level:"Emerging",desc:"Thinks Siri understands meaning"},{level:"Developing",desc:"Names sound pattern matching"},{level:"Proficient",desc:"Explains slicing + acoustic model + need for diverse data"},{level:"Advanced",desc:"Proposes bias mitigation and privacy action"}]}},{id:"W28",num:28,title:"AI in Games",subtitle:"NPCs that Learn",mentalModelName:"Ghost Learning",mentalModelIcon:"\uD83D\uDC7B",color:"#D97706",teacherEmpowerment:{whatIsThisReally:"Game AI uses reinforcement learning: an agent tries actions, gets reward (+10 for catching player, -1 for wandering), and adjusts policy to maximize reward. Early games used hardcoded rules (1990s). True learning NPCs emerged with deep RL around 2013-2015 when DeepMind beat Atari. Ghosts don’t understand you; they learn which paths gave reward. That’s why they seem to ambush.",why7thGradersNeedThis:"They face adaptive enemies in Fortnite, Minecraft, Among Us. Knowing ghost learns your path by trial and reward explains difficulty spikes and why changing strategy works. It also teaches that AI learns from consequences, not intentions.",realWorldBehindTheScenes:"In Pac-Man style, ghost starts random. Each time it catches player, it gets reward, strengthening recent moves (e.g., turned left at corner). Over many games, ghost policy shifts to prefer ambush spots where player often goes. No one programmed “hide in corner”; reward shaped it. Developers tune reward to make ghosts challenging but not impossible.",kidQuestionsAndAnswers:[{q:"Do game characters think?",a:"No, they keep score. If moving left gave points before, they will try left again. It looks like thinking, but it is score-chasing."},{q:"Why do enemies get harder?",a:"Because they collect rewards and learn your habits. If you always go right, ghost learns to wait right."},{q:"Can I trick the AI?",a:"Yes! Change your pattern. If you always dodge left, start dodging right. Its learned policy becomes wrong, until it relearns."}],vocabForTeacher:[{term:"NPC",teacherDef:"Non-player character controlled by AI",kidDef:"Computer ghost or enemy",pronunciation:"N-P-C",visualCue:"\uD83D\uDC7B game piece"},{term:"Reinforcement Learning",teacherDef:"Learning by reward and penalty",kidDef:"Learning by points",pronunciation:"re-in-FORCE-ment",visualCue:"⭐ +10 / -1"},{term:"Policy",teacherDef:"Strategy mapping situation to action",kidDef:"Ghost’s plan",pronunciation:"POL-ih-see",visualCue:"\uD83D\uDDFA️→⬅️"},{term:"Reward",teacherDef:"Signal that reinforces behavior",kidDef:"Points that teach",pronunciation:"re-WARD",visualCue:"\uD83C\uDF52 Pac-Man cherry"}]},mentalModelDeep:{name:"Ghost Learning",teacherAnalogy:"Imagine a ghost in maze that starts dumb, wandering random. Each time it bumps into you, bell rings (+10). Ghost remembers: “Last time I turned left at the library corner, bell rang.” Next game, it turns left more often. After 100 games, it seems psychic, but it just chased bells. No understanding of you, only of bell.",studentAnalogy:"Ghost learns like you learn a shortcut: if a path gives you candy, you take it again. More candy = more likely to repeat.",sketchSteps:["Draw maze with 2 paths to player.","Ghost starts at center, question mark: “Left or Right?”","Show 3 trials: Left fails (-1), Right succeeds (+10).","Draw ghost brain tally: Left 0, Right +10.","Next game, ghost chooses Right more often - draw thicker arrow to Right."],commonWrongModel:{wrong:"Ghost knows where I will go because it is smart.",right:"Ghost remembers where reward happened before and repeats that path more often. Smart-looking, but just score memory."},bridgeQuestion:"If you always hide in same corner, what will ghost learn to do? How could you use that to trap ghost?"},examplesBank:[{title:"Pac-Man Ghost Ambush",story:"You always go for cherries top-left. After 5 games, red ghost waits top-left at start.",howItWorks:"Ghost gets reward for catching player. Top-left gave many rewards, so policy weights top-left actions higher.",whereToSee:"Pac-Man, retro arcade",discussionQ:"Is ghost cheating or learning?",whatIf:"What if reward was for staying away from player?",ethicsLens:{benefits:"Fun challenge",harmed:"None in game",missing:"Player who wants easy mode",trafficLight:"Green"}},{title:"Forza AI Drivers Learn Your Line",story:"Racing game AI starts copying your braking points after few laps, making it harder to overtake.",howItWorks:"Imitation + RL: AI logs your trajectory, then rewards staying close to it while optimizing speed.",whereToSee:"Forza, Gran Turismo",discussionQ:"Does AI copying you feel fair?",whatIf:"What if you drive badly on purpose?",ethicsLens:{benefits:"Realistic opponents",harmed:"New players face superhuman copy",missing:"Difficulty adjustment",trafficLight:"Yellow"}},{title:"Minecraft Mob Pathfinding",story:"Zombie keeps finding you even when you hide behind house. It learned shortest path.",howItWorks:"Pathfinding + RL: reward for reducing distance to player, learns obstacles.",whereToSee:"Minecraft",discussionQ:"What is difference between pathfinding and learning?",whatIf:"What if zombie got reward for being near cows not players?",ethicsLens:{benefits:"Engaging survival",harmed:"Can be scary/frustrating",missing:"Accessibility for anxious players",trafficLight:"Green"}},{title:"Chess Bot Exploiting Your Mistake",story:"You always move queen early. Chess bot starts punishing queen early after 2 games.",howItWorks:"Bot stores your opening patterns, evaluates reward (win) for counter-moves.",whereToSee:"Chess.com bots",discussionQ:"Is it okay for AI to memorize your weaknesses?",whatIf:"What if you change opening?",ethicsLens:{benefits:"Teaches better play",harmed:"Can feel personal attack",missing:"Teaching mode not just winning",trafficLight:"Yellow"}},{title:"AI Dungeon Master",story:"AI story game learns you love dragons, so every story adds dragons even when you want mystery.",howItWorks:"RL from human feedback: you clicked dragon stories longer, so model rewards dragon content.",whereToSee:"AI Dungeon, Storyteller games",discussionQ:"When does personalization kill creativity?",whatIf:"What if you could set “surprise me” reward?",ethicsLens:{benefits:"Personal stories",harmed:"Filter bubble in imagination",missing:"Diversity control",trafficLight:"Yellow"}},{title:"Loot Box Enemy Difficulty",story:"Game makes enemies harder when you have not bought loot box, easier after purchase to make you feel powerful.",howItWorks:"Reward for company is purchase, not player fun. AI policy optimizes spending, not fairness.",whereToSee:"Some free-to-play shooters",discussionQ:"Who should AI work for: player or company?",whatIf:"What if reward was player retention not spending?",ethicsLens:{benefits:"Company profit",harmed:"Players manipulated to spend",missing:"Transparency, player well-being",trafficLight:"Red"}}],physicalComputing:{title:"Ghost Learning Board",concept:"Board game where ghost (student) learns player path via reward tokens.",materials:["Grid board (5x5)","Player pawn","Ghost pawn","Reward tokens (+10/-1)","Policy cards"],wiringDesc:"micro:bit ghost: Shows arrow hint based on learned rewards. Button A: ghost moves random, B: ghost moves toward highest reward memory. LEDs show Q-table.",codeBlocks:["Q-table: 25 cells each 4 directions, init 0","When ghost catches player: Q[prevPos][action] += 10","Else: Q[prevPos][action] -=1","Choose action with max Q"],noTechVersion:"Student ghost keeps tally sheet. Each catch = +10 to last move. Next round, ghost must pick move with highest tally at that square.",teacherTips:"Let ghost be student - they feel learning. After 5 rounds, ghost dominates if player repeats path. Then have player switch strategy."},communityData:{prompt:"Where does ghost wait if 3 classes all hide in same corner?",samplePool:[{book:"Corner A (library) 42 visits",votes:42,classes:"Ghost will camp there"},{book:"Corner B (gym) 8 visits",votes:8,classes:"Rare, ghost ignores"},{book:"Center 15 visits",votes:15,classes:"Medium"}],insight:"Pooled data predicts ghost ambush location. Shows how RL aggregates experience.",privacy:"No personal data, only positions.",filterBubbleDemo:"If only Class A data, ghost learns only Class A habits - brittle vs diverse data."},lesson90Detailed:{prep:["Grid boards","Pawns","Reward tokens","micro:bits with Q-table code"],phases:[{time:"0-10 Hook",goal:"Feel being hunted",teacherScriptExact:"We will play human Pac-Man. One ghost, one player. Ghost starts clueless. Each time ghost catches you, ghost gets +10 and remembers that turn. After 3 rounds, watch ghost get scary smart. Who wants to be first ghost?",studentAction:"Volunteer plays, class counts rewards.",materials:"Floor grid tape",checkUnderstanding:"✅ Sees ghost improves without being told",ifStuck:"\uD83D\uDFE7 Show tally sheet growing."},{time:"10-25 Concept",goal:"Reward shapes policy",teacherScriptExact:"Ghost does not think. It has a score sheet: at each square, which direction gave points before? It picks highest score direction. That score sheet is called Q-table, policy is which direction it picks. Reward teaches policy.",studentAction:"Draw Q-table for one square with 4 arrows and scores.",materials:"Slide",checkUnderstanding:"✅ Can explain reward -> policy",ifStuck:"\uD83D\uDFE7 Use candy path analogy."},{time:"25-45 Unplugged",goal:"Ghost Learning board",teacherScriptExact:"Trainer is player moving, Model is ghost keeping tally, Tester checks if ghost caught, Recorder updates Q-table. Play 5 rounds. Does ghost get better? What happens if player changes path on round 4?",studentAction:"Play 5 rounds, update tally.",materials:"Board, pawns, tokens",checkUnderstanding:"✅ Ghost win rate increases then drops when player switches",ifStuck:"\uD83D\uDFE7 Reduce board to 3x3."},{time:"45-60 Physical",goal:"micro:bit ghost brain",teacherScriptExact:"Micro:bit ghost shows its brain: LEDs are Q-values. Press B to let it use brain not random. See how arrow hints get stronger after catches. This is how game NPCs learn.",studentAction:"Run micro:bit ghost, observe Q-table visualization.",materials:"micro:bit",checkUnderstanding:"✅ Connects tally sheet to LED Q-table",ifStuck:"\uD83D\uDFE7 Pair with student who has working code."},{time:"60-80 Examples + Ethics",goal:"When learning is unfair",teacherScriptExact:"Look at loot box example: ghost reward is your purchase, not your fun. Is that fair? Who decides what ghost should get points for? Designer does. Reward design is power.",studentAction:"Debate: Who should AI optimize for? Fill ethics lens.",materials:"Example cards",checkUnderstanding:"✅ Distinguishes player fun vs company profit reward",ifStuck:"\uD83D\uDFE7 Ask: if ghost got points for making you smile, how would it act?"},{time:"80-90 Exit",goal:"Design reward",teacherScriptExact:"Exit: Design a reward for a helpful ghost that teaches you math, not kills you. What gets +10? What gets -1? One sentence for Ghost Learning model.",studentAction:"Workbook: design helpful ghost reward + exit ticket",materials:"Workbook W28",checkUnderstanding:"✅ Can design reward to shape desired behavior",ifStuck:"\uD83D\uDFE7 Stem: Helpful ghost gets +10 when..."}]},unpluggedActivityEnlarged:{title:"Ghost Learns Your Path",roles:[{role:"Trainer",does:"Moves player pawn, tries to avoid ghost"},{role:"Model",does:"Moves ghost pawn, maintains Q-tally"},{role:"Tester",does:"Checks catch, awards reward tokens"},{role:"Recorder",does:"Updates Q-table on board"}],materials:["5x5 grid","2 pawns","Tally sheet","Reward tokens"],steps:["1. Place player and ghost opposite corners.","2. Player moves 1 step, ghost moves 1 step (random first round).","3. If catch, ghost gets +10 token to last move direction at that cell.","4. If not catch, -1 token.","5. Record Q-value = sum tokens for that cell-direction.","6. Next round, ghost must pick max Q direction (not random).","7. After 5 rounds, switch player strategy and see if ghost adapts."],variations:{fast:"Ghost only remembers last 2 rounds",slow:"Full Q-table with discount factor discussion"},observes:["Do students see learning as accumulating scores not intelligence?","Can they exploit ghost by changing path?","Do they understand reward design controls behavior?"],mistakes:["Ghost moves randomly even after learning","Thinking ghost predicts future, not past reward","Not updating Q-table after each catch"]},workbook:{task1:"Q-table: At cell (2,2), moves: Up +3, Down -1, Left +10, Right +2. Which move will ghost pick? Why? If player now always goes Up, how will table change after 3 catches Up?",task2:"Design reward for a ghost that helps you find library books: What actions get +10? What gets -1? Explain.",exitTicket:["Explain Ghost Learning in one sentence","What is reward in game AI?","Give example where game AI reward is unfair"],rubric:[{level:"Emerging",desc:"Thinks NPC thinks like human"},{level:"Developing",desc:"Names reward as points"},{level:"Proficient",desc:"Explains policy learned from reward history"},{level:"Advanced",desc:"Designs reward to shape ethical behavior"}]}},{id:"W29",num:29,title:"Generative Intro",subtitle:"Model that Creates vs Classifies",mentalModelName:"Dream Machine",mentalModelIcon:"\uD83D\uDCAD",color:"#FB923C",teacherEmpowerment:{whatIsThisReally:"Generative models learn distribution of data and sample new examples from it. GANs (2014) pit generator vs discriminator: one dreams, one judges. Transformers (2017) predict next token, and by repeating, dream paragraphs. Unlike classifiers that label “cat vs dog,” generative models produce new cat images that never existed. They remix patterns, not copy.",why7thGradersNeedThis:"They use ChatGPT, image generators, and think AI creates like human artist. Knowing it dreams from patterns helps spot hallucinations, deepfakes, and copyright issues. It also empowers them to be creators with dream machines, not just consumers.",realWorldBehindTheScenes:"Train on millions of cat photos. Model learns: cats have pointy ears, distribution of fur colors, typical poses. It does not store photos; it stores statistical recipe. To generate, it samples noise and sculpts it toward cat-like recipe. Same for text: predicts next word given previous words, learned from internet text patterns. Can produce new but may produce nonsense if recipe wrong.",kidQuestionsAndAnswers:[{q:"Can AI create new things?",a:"It creates new combos of patterns it saw. Like dreaming: your dream mixes faces you saw into new person. AI dream is remix, not from nothing."},{q:"Does it copy?",a:"It does not paste. It learns statistics. But if training had many copies of same image, it may memorize and near-copy. That is why copyright is debated."},{q:"Why does it sometimes make weird hands with 6 fingers?",a:"Because it learned pattern “hands have fingers” but not exact count rule. It predicts what looks hand-like, not anatomical correctness."}],vocabForTeacher:[{term:"Generative",teacherDef:"Model that produces new data similar to training data",kidDef:"Dream machine that makes new stuff",pronunciation:"JEN-er-uh-tiv",visualCue:"\uD83D\uDCAD→\uD83C\uDFA8"},{term:"GAN",teacherDef:"Generator vs discriminator adversarial training",kidDef:"Forger vs detective game",pronunciation:"GAN (like can)",visualCue:"\uD83C\uDFAD vs \uD83D\uDD75️"},{term:"Hallucination",teacherDef:"Generative output that is false but looks plausible",kidDef:"Dream that feels real but is fake",pronunciation:"hah-loo-sih-NAY-shun",visualCue:"\uD83D\uDC41️‍\uD83D\uDDE8️ false"},{term:"Prompt",teacherDef:"Input that conditions generation",kidDef:"Dream instruction",pronunciation:"PROMPT",visualCue:"\uD83D\uDCDD→\uD83D\uDCAD"}]},mentalModelDeep:{name:"Dream Machine",teacherAnalogy:"After seeing 1000 dogs, you dream a new dog that never existed: floppy ears from one, spots from another, size from third. You did not memorize one dog; you mixed patterns. Generative AI does same but with math: it learns probability of ear shape given breed, then samples new ear. GAN is like forger (generator) trying to fool art detective (discriminator); both get better.",studentAnalogy:"Your brain after watching many cartoons dreams a new cartoon character mixing parts you saw. AI dreams new pictures or stories the same way.",sketchSteps:["Draw brain with many small dog icons inside (training data).","Arrow to cloud labeled “patterns: ears, spots, tail”.","Draw dice \uD83C\uDFB2 = random noise.","Noise + patterns → new dog that is none of originals, circle it “NEW”.","Add detective magnifier: “Does this look real?” loop."],commonWrongModel:{wrong:"AI copies and pastes from internet.",right:"AI learns statistical recipe and sculpts noise into new example. Sometimes it memorizes, but goal is remix, not copy."},bridgeQuestion:"If Dream Machine only saw white dogs, can it dream a black dog? What does that tell about training data?"},examplesBank:[{title:"ChatGPT Writes Story",story:"Student prompts “write story about space cat.” Gets new story that never existed before, mixing cat and space patterns.",howItWorks:"Transformer predicts next word repeatedly based on patterns in internet stories. Samples new sequence.",whereToSee:"ChatGPT, Bard",discussionQ:"Who is author: you, AI, or writers of training data?",whatIf:"What if prompt is “write in style of Dr. Seuss” - copyright?",ethicsLens:{benefits:"Creative boost, writing help",harmed:"Writers whose work trained model unpaid",missing:"Consent, credit",trafficLight:"Yellow"}},{title:"Image Generator Makes 6-Finger Hand",story:"Student generates “hand holding book.” Image shows 6 fingers, looks creepy.",howItWorks:"Model learned “hands have fingers” distribution but not exact anatomy count. No 3D understanding.",whereToSee:"DALL-E, Midjourney",discussionQ:"Should we trust generated images as real?",whatIf:"What if training had hand anatomy labels?",ethicsLens:{benefits:"Fast illustration",harmed:"Misinformation if used as real photo",missing:"Fact checking",trafficLight:"Yellow"}},{title:"Deepfake Voice",story:"Someone clones principal’s voice saying school closed. Parents believe it.",howItWorks:"Generative voice model learns timbre and prosody from few minutes of principal’s speeches, then generates new sentences.",whereToSee:"Voice cloning apps",discussionQ:"When is cloning voice harmful?",whatIf:"What if clone was for accessibility (principal lost voice)?",ethicsLens:{benefits:"Accessibility, fun",harmed:"Impersonation, scams, trust erosion",missing:"Consent, watermark",trafficLight:"Red"}},{title:"Generative Music",story:"Student hums melody, AI generates full song in same style.",howItWorks:"Model learns distribution of notes and rhythms from music dataset, generates continuation.",whereToSee:"Suno, MusicLM",discussionQ:"Is AI musician creative?",whatIf:"What if training data was only classical, not hip-hop?",ethicsLens:{benefits:"New creative tool",harmed:"Musicians worried about replacement",missing:"Diverse genres, artist opt-in",trafficLight:"Yellow"}},{title:"Dream Machine for Good: Protein Design",story:"Scientists use generative model to dream new proteins that could become medicine.",howItWorks:"Model learns distribution of protein shapes that fold correctly, generates new sequences likely to fold.",whereToSee:"AlphaFold, RFDiffusion news",discussionQ:"How is dreaming proteins different from dreaming faces?",whatIf:"What if model dreams harmful protein?",ethicsLens:{benefits:"Medical breakthroughs",harmed:"Dual-use risk if misused",missing:"Safety review",trafficLight:"Green"}},{title:"Filter Bubble Dream",story:"Image generator prompted “CEO” shows mostly one demographic, because training photos were biased.",howItWorks:"Model samples from learned distribution that overrepresents certain groups.",whereToSee:"Image generators",discussionQ:"Does Dream Machine dream fair dreams?",whatIf:"What if we balanced training data?",ethicsLens:{benefits:"Fast images",harmed:"Stereotype amplification",missing:"Diverse representation",trafficLight:"Red"}}],physicalComputing:{title:"Dream Machine - Generate New Drawing from Patterns",concept:"Students learn pattern distribution then generate new combo.",materials:["Pattern cards: eyes, noses, mouths","Dice","Blank face templates"],wiringDesc:"micro:bit Dream Machine: Button A shuffles pattern (random eye, nose, mouth), shows on LED as icons. Button B generates new face on screen. Randomness = dreaming.",codeBlocks:["eyes = [^ ^, - -, o o] pick random","nose = [^, v] pick random","mouth = [U, --] pick random","on A: randomize all, display","on B: combine into new face"],noTechVersion:"Give groups 10 eyes, 10 noses, 10 mouths cutouts. They must create new face never seen before by mixing. Count how many possible combos (10x10x10=1000). That is generative space.",teacherTips:"Emphasize new face is not copy of any one - it is remix. Connect to why AI can dream infinite cats."},communityData:{prompt:"What new creature can you dream mixing 3 animals you saw?",samplePool:[{book:"Cat + dragon wings + fish tail",votes:18,classes:"Common mix - shows pattern reuse"},{book:"Dog + unicorn horn + spider legs",votes:12,classes:"Rare - more novel"},{book:"Human + bird beak + lion mane",votes:9,classes:"Creative"}],insight:"Most dreamed creatures reuse common patterns (wings, horns). Shows generative model limited by training distribution.",privacy:"Only creature descriptions pooled, no names.",filterBubbleDemo:"If only cats in training, all dreams are cats. Need diverse animals to dream diverse."},lesson90Detailed:{prep:["Pattern cards printed","Dice","micro:bits","Example generated images (good and weird hands)"],phases:[{time:"0-10 Hook",goal:"Spot the fake",teacherScriptExact:"I have 4 cat photos. 3 real, 1 AI dreamed. Which is fake? Look at ears, eyes, background. AI dreams look almost real but have glitches. Today we build Dream Machine that dreams new things.",studentAction:"Vote which cat is AI, discuss glitches.",materials:"Cat images",checkUnderstanding:"✅ Notices glitch like extra toe",ifStuck:"\uD83D\uDFE7 Point to hands/faces."},{time:"10-25 Concept",goal:"Classify vs Generate",teacherScriptExact:"Classifier answers: Is this cat or dog? Generative answers: Dream a new cat that never existed. How? It learns pattern recipe, not photos. Recipe says: pointy ears 80%, fluffy tail 60%. Then it rolls dice and sculpts noise using recipe. New cat!",studentAction:"Draw classify vs generate T-chart.",materials:"Slide",checkUnderstanding:"✅ Distinguishes labeling vs creating",ifStuck:"\uD83D\uDFE7 Use baker analogy: classifier tastes cake, generator bakes new cake."},{time:"25-45 Unplugged",goal:"Pattern remix",teacherScriptExact:"You have eyes, noses, mouths from many faces. Your job: dream a new face never seen before. You must mix: eye from card 2, nose from card 7, mouth from card 3. Is it copy? No, remix. How many new faces can we dream? 10x10x10 = 1000!",studentAction:"Create new face, count possibilities.",materials:"Pattern cards",checkUnderstanding:"✅ Explains new face is remix not copy",ifStuck:"\uD83D\uDFE7 Start with 2 parts only."},{time:"45-60 Physical",goal:"micro:bit Dream Machine",teacherScriptExact:"Micro:bit is Dream Machine. Press A, it randomly picks eye, nose, mouth from its pattern memory and shows new face. Each press is new dream. Same patterns, infinite dreams. That is generative.",studentAction:"Generate 10 faces, check for duplicates.",materials:"micro:bit",checkUnderstanding:"✅ Sees randomness + pattern = new",ifStuck:"\uD83D\uDFE7 Show code: pick random."},{time:"60-80 Ethics",goal:"Hallucination and bias",teacherScriptExact:"Dream Machine can dream 6-finger hand or biased CEO. Why? It dreams what it saw a lot. If it saw mostly one type of CEO, it dreams that. Also it can dream fake principal voice. When is dreaming harmful? Fill ethics traffic light.",studentAction:"Analyze deepfake and bias examples, traffic light.",materials:"Example cards",checkUnderstanding:"✅ Identifies harm of fake and bias",ifStuck:"\uD83D\uDFE7 Ask: would you trust dreamed photo as evidence?"},{time:"80-90 Exit",goal:"Dream vs reality",teacherScriptExact:"Exit: Dream Machine is... (pattern + randomness = new). One rule you would make for using dreamed images at school. Drop ticket.",studentAction:"Workbook: generate creature + ethics rule",materials:"Workbook W29",checkUnderstanding:"✅ Distinguishes remix from copy and proposes rule",ifStuck:"\uD83D\uDFE7 Stem: AI creates by..."}]},unpluggedActivityEnlarged:{title:"Dream Machine Face Factory",roles:[{role:"Trainer",does:"Shuffles pattern cards, provides random pick"},{role:"Model",does:"Combines picked patterns into new face"},{role:"Tester",does:"Checks if face is new (not identical to any training card)"},{role:"Recorder",does:"Counts total possible combos and logs dreams"}],materials:["30 face part cards","Blank templates","Dice"],steps:["1. Lay out 10 eyes, 10 noses, 10 mouths as training data.","2. Trainer rolls dice to pick one eye, one nose, one mouth randomly.","3. Model draws combined face on blank template.","4. Tester checks against all training faces - is it exact copy? Should not be.","5. Recorder logs new face and counts combo space.","6. Repeat 5 times, see diversity.","7. Now remove all but white faces from training - can you still dream diverse? No - bias demo."],variations:{fast:"Only 3 eyes, 3 mouths (9 combos)",slow:"Add hats, glasses, calculate 10x10x10x5 = 5000 combos, discuss exponential"},observes:["Do students think new face is copy?","Can they calculate combo count?","Do they see bias when training limited?"],mistakes:["Copying one full face instead of mixing parts","Thinking random = creative without patterns","Not checking if dream is new"]},workbook:{task1:"You have training: 5 eye types, 4 nose types, 6 mouth types. How many unique faces can Dream Machine generate? If you add 3 hat types, new total? Show math.",task2:"Hallucination: AI generates image of “7th grade library with 6-finger librarian.” Why did it make 6 fingers? How would you fix training?",exitTicket:["Difference between classifier and generator?","Explain Dream Machine in kid words","One rule for using AI-generated images fairly"],rubric:[{level:"Emerging",desc:"Thinks generative copies"},{level:"Developing",desc:"Says it makes new things but vague"},{level:"Proficient",desc:"Explains pattern + randomness = new remix, not copy"},{level:"Advanced",desc:"Discusses bias, hallucination, and ethical use"}]}},{id:"W30",num:30,title:"PROJECT 5 Library Recommendation",subtitle:"If you liked this book, you will like...",mentalModelName:"Book Matchmaker",mentalModelIcon:"\uD83D\uDC98",color:"#EA580C",teacherEmpowerment:{whatIsThisReally:"This capstone applies collaborative filtering to library books, the original Tapestry idea. Students build user-item matrix from class reading logs, compute similarity (Jaccard overlap), and recommend. History: Tapestry 1992 used annotations, GroupLens 1994 used ratings for Usenet. Today libraries use similar to increase circulation. It is full ML loop: data collection, similarity, recommendation, evaluation, ethics (privacy, filter bubble).",why7thGradersNeedThis:"They become designers not just users. Building their own Book Matchmaker makes abstract “people like you liked” tangible and gives them power to make library more diverse and fair. It connects to real job: librarian using data to help readers.",realWorldBehindTheScenes:"Library system logs checkouts anonymously. For each pair of books, counts how many same borrowers took both (co-borrow). High co-borrow = similar. When you check out Book A, system looks up books with highest co-borrow with A and suggests them on receipt. No content analysis, just community behavior. Librarians review to avoid bubble.",kidQuestionsAndAnswers:[{q:"Can we really build YouTube’s engine with paper?",a:"Yes, same math. YouTube uses millions, you use 30 classmates. Pattern same: find similar readers, recommend what they liked."},{q:"What if someone likes weird books?",a:"Great! Weird tastes help find niche similar readers. Diversity makes recommendations richer. If everyone likes same, recommendations boring."},{q:"Will our recommendations be as good as computers?",a:"For our small library, paper can be better because you know context computer does not. Computer is faster for millions."}],vocabForTeacher:[{term:"Collaborative Filtering",teacherDef:"Recommendation via similar users/items",kidDef:"Book matchmaker trick",pronunciation:"koh-LAB FILTER",visualCue:"\uD83D\uDC98 books matched"},{term:"Co-borrow",teacherDef:"Two books borrowed by same person",kidDef:"Same kid liked both",pronunciation:"KO-bor-oh",visualCue:"\uD83D\uDCDA+\uD83D\uDCDA=\uD83D\uDC64"},{term:"Diversity",teacherDef:"Variety in recommendations to avoid bubble",kidDef:"Mix of different types",pronunciation:"dih-VER-sih-tee",visualCue:"\uD83C\uDF08 books"},{term:"Anonymized",teacherDef:"Data with names removed but patterns kept",kidDef:"Hide names, keep likes",pronunciation:"ah-NON-ih-mized",visualCue:"\uD83D\uDE48 name, \uD83D\uDC40 pattern"}]},mentalModelDeep:{name:"Book Matchmaker",teacherAnalogy:"Matchmaker does not read love letters; she knows who liked whom. If Maya liked both adventure and mystery, and you liked adventure, matchmaker introduces you to mystery. Book Matchmaker does same: if same readers borrowed both Dog Man and Investigators, they are matched as similar, and new Dog Man readers get Investigators suggested. Love is in the overlap.",studentAnalogy:"If you and a friend both liked same 3 books, and your friend liked a 4th book you haven’t read, matchmaker says you will probably like that 4th book too.",sketchSteps:["Draw 2 readers with hearts around books they liked.","Show overlapping heart area = same books liked.","Arrow from overlapping area to new book only one liked.","Draw matchmaker cupid \uD83D\uDC98 connecting new book to other reader.","Write “High overlap = good match = recommend”."],commonWrongModel:{wrong:"Matchmaker reads books and decides which are similar by topic.",right:"Matchmaker never reads. It counts which books same people borrowed. Similarity is from people, not topic."},bridgeQuestion:"If we want to help kids discover books outside their usual genre, should matchmaker recommend high overlap or low overlap books?"},examplesBank:[{title:"School Library Receipt Recs",story:"You check out Percy Jackson. Receipt prints “If you liked this, try Heroes of Olympus - 28 readers who borrowed Percy also borrowed this.”",howItWorks:"Co-borrow count from anonymized checkout logs. No content reading.",whereToSee:"Library checkout system",discussionQ:"Is receipt recommendation helpful or annoying?",whatIf:"What if data included only 5 readers?",ethicsLens:{benefits:"Helps discover next book",harmed:"None if anonymized",missing:"Books with few borrowers",trafficLight:"Green"}},{title:"Filter Bubble in Library",story:"Library only recommends adventure because adventure borrowers dominate data. Mystery readers never get mystery recs.",howItWorks:"Popularity bias: most data from adventure fans, so co-borrow favors adventure.",whereToSee:"Our pooled class data",discussionQ:"How to make matchmaker fair to all genres?",whatIf:"What if we boosted low-count genres?",ethicsLens:{benefits:"Majority served",harmed:"Minority genre readers ignored",missing:"Diverse genres",trafficLight:"Yellow"}},{title:"Privacy First",story:"Librarian wants to recommend but not reveal who borrowed what. Uses anonymized counts only.",howItWorks:"Removes names, keeps only book-book co-occurrence counts.",whereToSee:"Library privacy policy",discussionQ:"What is minimum data needed to recommend without exposing people?",whatIf:"What if names were kept?",ethicsLens:{benefits:"Privacy protected",harmed:"None",missing:"Personalization depth",trafficLight:"Green"}},{title:"Cold Start - New Book No Data",story:"New graphic novel arrives. No one borrowed yet, so matchmaker cannot recommend it.",howItWorks:"Collaborative filtering needs history. No co-borrow = no recommendation. Classic cold start problem.",whereToSee:"New arrivals shelf",discussionQ:"How to recommend new books with no data?",whatIf:"What if librarian manually seeds initial likes?",ethicsLens:{benefits:"System learns over time",harmed:"New books invisible",missing:"New authors",trafficLight:"Yellow"}},{title:"Matchmaker for Good: Reluctant Readers",story:"Matchmaker finds that reluctant readers who liked Diary of Wimpy Kid also liked graphic nonfiction. Helps teacher suggest.",howItWorks:"Finds non-obvious similarity: same readers, different genres.",whereToSee:"Teacher recommendation",discussionQ:"How can data help not just popular kids but struggling readers?",whatIf:"What if we filtered for low reading confidence?",ethicsLens:{benefits:"Supports struggling readers",harmed:"None",missing:"Privacy if confidence data used",trafficLight:"Green"}},{title:"Manipulated Recommendations",story:"Publisher pays students to borrow their book many times to boost co-borrow counts, so it gets recommended.",howItWorks:"Gaming the system: fake borrowing inflates similarity.",whereToSee:"Real world: review farms",discussionQ:"How to detect fake likes?",whatIf:"What if we required longer checkout to count?",ethicsLens:{benefits:"None",harmed:"Library trust, other books suppressed",missing:"Verification",trafficLight:"Red"}}],physicalComputing:{title:"Library Rec - Build Paper Recommendation for Library",concept:"Full project: build physical collaborative filtering engine for school library.",materials:["Checkout log anonymized (book titles only)","Large matrix board","Color dots","Recommendation cards"],wiringDesc:"micro:bit Book Matchmaker: Each book = RFID? Simplified: Button A cycle books, Button B show top co-borrowed recommendation on LED scroll. Radio sync across tables.",codeBlocks:['books = ["Dog Man", "Percy", "Wimpy"]',"coBorrow = [[0,5,2],[5,0,3],[2,3,0]] matrix","on A: select book index","on B: find max coBorrow[select] and scroll recommendation"],noTechVersion:"Entirely paper: Matrix with books rows and columns, tally marks for co-borrow from class logs. For each book, find highest tally in row = recommendation.",teacherTips:"This is celebration: invite librarian. Let students present recommendations and explain filter bubble fix they added (e.g., boost mystery)."},communityData:{prompt:"Pool 3 classes: 90 students, 15 books. Build co-borrow matrix.",samplePool:[{book:"Dog Man ↔ Investigators co-borrow 22",votes:22,classes:"Strong link"},{book:"Percy ↔ Heroes 28",votes:28,classes:"Strong link"},{book:"New Book ↔ none 0",votes:0,classes:"Cold start - needs seeding"}],insight:"Pooled data reveals filter bubble: Class A loves dragons, dominates matrix. Solution: normalize by class or boost underrepresented genres.",privacy:"Anonymized: only counts, no student names. Show real anonymization.",filterBubbleDemo:"Show recommendations with only Class A data vs all 3 classes: diversity increases from 2 genres to 5. Discuss trade-off."},lesson90Detailed:{prep:["Anonymized checkout logs (or survey of fav books)","Matrix boards","Recommendation card templates","Librarian invite","micro:bits"],phases:[{time:"0-10 Launch",goal:"Driving question",teacherScriptExact:"Driving question: How can we help every 7th grader find next book they will love without reading every book ourselves? We are Book Matchmakers. Today we build real engine that library could use tomorrow. Librarian is coming at end to hear your pitch.",studentAction:"Hear driving question, see librarian note.",materials:"DQ poster",checkUnderstanding:"✅ Can restate driving question",ifStuck:"\uD83D\uDFE7 Rephrase: How to recommend without reading?"},{time:"10-25 Data Collection",goal:"Build co-borrow matrix",teacherScriptExact:"Each of you wrote 3 favorite books yesterday anonymously. We now tally: if same anonymous ID liked Book A and B, we add one to cell A-B. This is co-borrow. No names, only counts. You are doing what YouTube does with watch time.",studentAction:"Place tally marks in matrix for their 3 books.",materials:"Matrix board",checkUnderstanding:"✅ Adds tally correctly",ifStuck:"\uD83D\uDFE7 Use only 2 books first."},{time:"25-45 Compute",goal:"Find recommendations",teacherScriptExact:"Now for each book row, find highest number - that is most similar book by our community. Write recommendation card: “If you liked [Book A], you will like [Book B] because 12 readers liked both.” That is collaborative filtering.",studentAction:"Find max per row, write cards.",materials:"Cards",checkUnderstanding:"✅ Finds max and writes justification with count",ifStuck:"\uD83D\uDFE7 Circle max for them."},{time:"45-60 Physical + Bias Check",goal:"Detect filter bubble and fix",teacherScriptExact:"Look at our recommendations: 80% adventure. Why? Our data is mostly adventure lovers. Mystery readers are missing. How to fix? One idea: boost a mystery book even if count lower, to increase diversity. Another: collect more mystery data. What will you do?",studentAction:"Analyze diversity, propose fix, adjust one recommendation to improve diversity.",materials:"Pooled chart",checkUnderstanding:"✅ Identifies bubble and proposes fix",ifStuck:"\uD83D\uDFE7 Show Class A vs all classes comparison."},{time:"60-80 Build & Pitch Prep",goal:"Create display + micro:bit demo",teacherScriptExact:"Create final display: matrix, 3 recommendation cards, one bubble fix explanation, and privacy note: we anonymized. If you have micro:bit, code Book Matchmaker that shows recommendation when you press. Prepare 1-minute pitch for librarian.",studentAction:"Build display, code micro:bit, rehearse pitch.",materials:"Display materials, micro:bits",checkUnderstanding:"✅ Display includes matrix, recs, ethics note",ifStuck:"\uD83D\uDFE7 Provide sentence starters for pitch."},{time:"80-90 Showcase",goal:"Present to librarian",teacherScriptExact:"Librarian is here. Each table pitch one recommendation: book, why, data, and how you made it fair. Librarian will pick one to actually try next week. Exit ticket: What did Book Matchmaker teach you about real-world AI?",studentAction:"Pitch, receive feedback, exit ticket.",materials:"None",checkUnderstanding:"✅ Pitch includes data and fairness",ifStuck:"\uD83D\uDFE7 Allow reading from card."}]},unpluggedActivityEnlarged:{title:"Book Matchmaker Matrix",roles:[{role:"Trainer",does:"Collects anonymous favorite book lists"},{role:"Model",does:"Tally co-borrow matrix"},{role:"Tester",does:"Finds max per row, checks if recommendation makes sense"},{role:"Recorder",does:"Writes recommendation cards with counts and privacy note"}],materials:["Large matrix poster","Markers","Anonymous b
